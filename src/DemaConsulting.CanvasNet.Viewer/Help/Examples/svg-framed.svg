<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568">
  <!-- anchors.scad sits beside this file. Each arrow ends on an anchor: its pixel as reported
       for the model rendered alone at the image size (440x300), plus the image x (280) and y (152) -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>
  <style>
    .title { font: bold 28px sans-serif; fill: #ffffff; }
    .lead { font: 15px sans-serif; fill: #bfdbfe; }
    .label { font: bold 17px sans-serif; fill: #0f172a; }
    .detail { font: 14px sans-serif; fill: #475569; }
    .caption { font: italic 14px sans-serif; fill: #475569; }
    .callout { fill: none; stroke: #ea580c; stroke-width: 2.5; marker-end: url(#arrow); }
    .chevron { fill: none; stroke: #ffffff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- container and title band -->
  <rect width="1000" height="568" fill="#f1f5f9"/>
  <rect x="16" y="16" width="968" height="536" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M16,36 a20,20 0 0 1 20,-20 h928 a20,20 0 0 1 20,20 v64 h-968 z" fill="url(#band)"/>
  <rect x="16" y="100" width="968" height="5" fill="#f59e0b"/>
  <polyline class="chevron" points="868,40 888,58 868,76" opacity="0.35"/>
  <polyline class="chevron" points="896,40 916,58 896,76" opacity="0.65"/>
  <polyline class="chevron" points="924,40 944,58 924,76"/>
  <text class="title" x="56" y="60">Mounting plate MP-30</text>
  <text class="lead" x="56" y="86">Aluminum, 30 x 20 x 5 mm, one 8 mm through-hole</text>
  <!-- picture slot: the model at 440 x 300, the size its anchors were read at -->
  <rect x="270" y="132" width="460" height="340" rx="14" fill="url(#slot)" stroke="#e2e8f0" stroke-width="2"/>
  <image href="anchors.scad" x="280" y="152" width="440" height="300"/>
  <!-- callout layer: an accent bar, a label, and an arrow to an anchor -->
  <rect x="48" y="176" width="5" height="50" rx="2" fill="#f59e0b"/>
  <text class="label" x="64" y="196">Datum corner</text>
  <text class="detail" x="64" y="218">Dimensions start here</text>
  <polyline class="callout" points="226,201 252,201 293.8,254.4"/>
  <rect x="760" y="166" width="5" height="50" rx="2" fill="#f59e0b"/>
  <text class="label" x="776" y="186">Through-hole</text>
  <text class="detail" x="776" y="208">8 mm wide, 5 mm deep</text>
  <polyline class="callout" points="748,191 712,191 500,278.2"/>
  <rect x="760" y="336" width="5" height="50" rx="2" fill="#f59e0b"/>
  <text class="label" x="776" y="356">Hole wall</text>
  <text class="detail" x="776" y="378">Radius 4 mm</text>
  <polyline class="callout" points="748,361 712,361 546.7,278.2"/>
  <!-- caption -->
  <text class="caption" x="56" y="518">Figure 1. The MP-30 plate as modeled in anchors.scad; every arrow ends on an anchor the model declares.</text>
</svg>
