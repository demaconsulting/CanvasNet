<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <clipPath id="disc"><circle cx="50" cy="50" r="40"/></clipPath>
    <polygon id="star" points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"/>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="100" height="100" fill="#dddddd"/>
    <g transform="translate(35 40) scale(2)" fill="#e45756"><use href="#star"/></g>
    <g transform="translate(70 70) rotate(20) scale(1.5)" fill="#4c78a8"><use href="#star"/></g>
  </g>
</svg>
