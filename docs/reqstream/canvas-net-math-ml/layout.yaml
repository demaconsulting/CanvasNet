---
# Software Subsystem Requirements for Layout
#
# These requirements decompose the CanvasNetMathMl system's layout responsibility into the Layout subsystem (internal
# namespace DemaConsulting.CanvasNet.MathMl.Layout): the walk and dispatch of the equation tree (LayoutEngine), the
# computed styles (StyleResolver), the math font (MathFont), the box model (MathBox), the layouts of tokens
# (TokenLayout) and rows (RowLayout), the operator dictionary (OperatorDictionary), and the stretching of glyphs
# (StretchyGlyphs). Each requirement here links down to the unit requirements that implement it.
# See docs/verification/canvas-net-math-ml/layout.md for the test-evidence mapping.

sections:
  - title: CanvasNetMathMl Requirements
    sections:
      - title: Layout Requirements
        requirements:
          - id: CanvasNetMathMl-Layout-Tokens
            title: >-
              The Layout subsystem shall lay out the token elements as MathML Core does: the transformed characters
              drawn with the glyphs of the math font placed by their advances, and a box as wide as the advances with
              the ink ascent and descent.
            justification: |
              Tokens are the leaves of every equation; their boxes decide the size and the spacing of everything else.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-TokenLayout-AutoItalic
              - CanvasNetMathMl-Layout-TokenLayout-Mathvariant
              - CanvasNetMathMl-Layout-TokenLayout-Metrics
              - CanvasNetMathMl-Layout-TokenLayout-InvisibleCharacters
              - CanvasNetMathMl-Layout-TokenLayout-Space
              - CanvasNetMathMl-Layout-TokenLayout-String
              - CanvasNetMathMl-Layout-MathBox-Model
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing

          - id: CanvasNetMathMl-Layout-Operators
            title: >-
              The Layout subsystem shall space every operator by the operator dictionary of MathML Core for its text and
              its form, the form being inferred from the position of the embellished operator in its row unless the form
              attribute sets it, and the attributes of the mo overriding the dictionary.
            justification: |
              Operator spacing is what makes an equation read as mathematics; it must match a browser that implements
              MathML Core.
            children:
              - CanvasNetMathMl-Layout-OperatorDictionary-Categories
              - CanvasNetMathMl-Layout-OperatorDictionary-SpecialTables
              - CanvasNetMathMl-Layout-OperatorDictionary-Forms
              - CanvasNetMathMl-Layout-OperatorDictionary-Axis
              - CanvasNetMathMl-Layout-TokenLayout-OperatorProperties
              - CanvasNetMathMl-Layout-LayoutEngine-OperatorForms
              - CanvasNetMathMl-Layout-RowLayout-Row
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing

          - id: CanvasNetMathMl-Layout-Stretching
            title: >-
              The Layout subsystem shall stretch the stretchy embellished operators of a row along the block axis to the
              height of the other children (symmetric about the math axis when asked, within minsize and maxsize) with
              the size variants and assemblies of the math font, the Unicode-based assemblies, or a rule, shall draw
              large operators larger in display style, and shall report an operator that cannot stretch.
            justification: |
              Fences, bars, and vertical arrows must enclose their content, and sums and integrals must be drawn large
              in displayed equations, as in a browser.
            children:
              - CanvasNetMathMl-Layout-StretchyGlyphs-Variants
              - CanvasNetMathMl-Layout-StretchyGlyphs-Assembly
              - CanvasNetMathMl-Layout-StretchyGlyphs-UnicodeFallback
              - CanvasNetMathMl-Layout-StretchyGlyphs-RuleFallback
              - CanvasNetMathMl-Layout-StretchyGlyphs-Limit
              - CanvasNetMathMl-Layout-StretchyGlyphs-Failure
              - CanvasNetMathMl-Layout-TokenLayout-Stretch
              - CanvasNetMathMl-Layout-TokenLayout-LargeOp
              - CanvasNetMathMl-Layout-RowLayout-Stretch
              - CanvasNetMathMl-Layout-LayoutEngine-Stretching
              - CanvasNetMathMl-Layout-MathFont-Constructions
              - CanvasNetMathMl-Layout-MathBox-Model
              - CanvasNetMathMl-Layout-MathBox-Operators
            tests:
              - Layout_StretchyFencesAroundTallRow_MatchConstants

          - id: CanvasNetMathMl-Layout-Rows
            title: >-
              The Layout subsystem shall lay out rows and the grouping elements as MathML Core does: the children on a
              shared baseline with the spacing of their operators, mpadded with its requested size and offsets, merror
              with its border, mphantom with its size but no ink, semantics and maction with their first child, and the
              text written directly inside a row like an mtext.
            justification: |
              Rows place every token of an equation, and the grouping elements change the space or the look of their
              content.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-LayoutEngine-HiddenElements
              - CanvasNetMathMl-Layout-LayoutEngine-Phantom
              - CanvasNetMathMl-Layout-LayoutEngine-TextInRows
              - CanvasNetMathMl-Layout-RowLayout-Row
              - CanvasNetMathMl-Layout-RowLayout-Grouping
              - CanvasNetMathMl-Layout-RowLayout-Padded
              - CanvasNetMathMl-Layout-RowLayout-Error
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing

          - id: CanvasNetMathMl-Layout-Style
            title: >-
              The Layout subsystem shall compute the style of every element from its parent's as MathML Core does: the
              math style and math depth, the font size scaled by the script level with the MATH constants, the color
              and background, the mathvariant, and the inline style subset, reporting invalid values.
            justification: |
              Styles decide the size, the color, and the letters of every token.
            children:
              - CanvasNetMathMl-Layout-StyleResolver-MathStyle
              - CanvasNetMathMl-Layout-StyleResolver-MathDepth
              - CanvasNetMathMl-Layout-StyleResolver-FontSize
              - CanvasNetMathMl-Layout-StyleResolver-Colors
              - CanvasNetMathMl-Layout-StyleResolver-Variant
              - CanvasNetMathMl-Layout-StyleResolver-InlineStyle
            tests:
              - Layout_ScriptLevel_ScalesTokensWithMathConstants

          - id: CanvasNetMathMl-Layout-MathFont
            title: >-
              The Layout subsystem shall lay equations out with the bundled Noto Sans Math, its MATH constants, and the
              metrics of its glyphs, with the deterministic bundled fallback for the characters it lacks, and shall
              report a character no bundled font has.
            justification: |
              The math font with its MATH table gives the metrics of a browser's math layout, and bundled fonts only
              make the layout identical on every machine.
            children:
              - CanvasNetMathMl-Layout-MathFont-Constants
              - CanvasNetMathMl-Layout-MathFont-Fallback
              - CanvasNetMathMl-Layout-MathFont-Metrics
              - CanvasNetMathMl-Layout-TokenLayout-MissingGlyph
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing
              - Layout_ScriptLevel_ScalesTokensWithMathConstants

          - id: CanvasNetMathMl-Layout-UnsupportedFeatures
            title: >-
              The Layout subsystem shall lay out every element this version does not draw as a row of its children and
              report it, and shall report the attributes without effect on the elements it draws.
            justification: |
              An equation with a construct that is not drawn must still produce a picture, and the caller must learn
              what was not drawn.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-UnsupportedElements
              - CanvasNetMathMl-Layout-LayoutEngine-UnsupportedAttributes
            tests:
              - Layout_UnsupportedElementsAndAttributes_AreRowsWithReports

          - id: CanvasNetMathMl-Layout-Bounds
            title: >-
              The Layout subsystem shall bound the nesting depth and the work of a layout with located
              mathml-limit-exceeded errors and stop when the call is canceled.
            justification: |
              A hostile equation must not exhaust the stack or time while it is laid out.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-Bounds
            tests:
              - Layout_Bounds_WorkBudgetAndCancellation_StopTheLayout
