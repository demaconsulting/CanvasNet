---
# Software Subsystem Requirements for Layout
#
# These requirements decompose the CanvasNetMathMl system's layout responsibility into the Layout subsystem (internal
# namespace DemaConsulting.CanvasNet.MathMl.Layout): the walk and dispatch of the equation tree (LayoutEngine), the
# computed styles (StyleResolver), the math font (MathFont), the box model (MathBox), the layouts of tokens
# (TokenLayout), rows (RowLayout), fractions (FractionLayout), radicals (RadicalLayout), scripts (ScriptLayout), and
# under- and overscripts (UnderOverLayout), the operator dictionary (OperatorDictionary), and the stretching of glyphs
# (StretchyGlyphs). Each requirement here links down to the unit
# requirements that implement it.
# See docs/verification/canvas-net-math-ml/layout.md for the test-evidence mapping.

sections:
  - title: CanvasNetMathMl Requirements
    sections:
      - title: Layout Requirements
        requirements:
          - id: CanvasNetMathMl-Layout-Tokens
            title: >-
              The Layout subsystem shall lay out the token elements as MathML Core does: the transformed characters
              drawn with the glyphs of the math font placed by their advances, and a box as wide as the advances with
              the ink ascent and descent.
            justification: |
              Tokens are the leaves of every equation; their boxes decide the size and the spacing of everything else.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-TokenLayout-AutoItalic
              - CanvasNetMathMl-Layout-TokenLayout-Mathvariant
              - CanvasNetMathMl-Layout-TokenLayout-Metrics
              - CanvasNetMathMl-Layout-TokenLayout-InvisibleCharacters
              - CanvasNetMathMl-Layout-TokenLayout-Space
              - CanvasNetMathMl-Layout-TokenLayout-String
              - CanvasNetMathMl-Layout-MathBox-Model
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing

          - id: CanvasNetMathMl-Layout-Operators
            title: >-
              The Layout subsystem shall space every operator by the operator dictionary of MathML Core for its text and
              its form, the form being inferred from the position of the embellished operator in its row (postfix for a
              script) unless the form attribute sets it, and the attributes of the mo overriding the dictionary.
            justification: |
              Operator spacing is what makes an equation read as mathematics; it must match a browser that implements
              MathML Core.
            children:
              - CanvasNetMathMl-Layout-OperatorDictionary-Categories
              - CanvasNetMathMl-Layout-OperatorDictionary-SpecialTables
              - CanvasNetMathMl-Layout-OperatorDictionary-Forms
              - CanvasNetMathMl-Layout-OperatorDictionary-Axis
              - CanvasNetMathMl-Layout-TokenLayout-OperatorProperties
              - CanvasNetMathMl-Layout-LayoutEngine-OperatorForms
              - CanvasNetMathMl-Layout-LayoutEngine-ScriptForms
              - CanvasNetMathMl-Layout-RowLayout-Row
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing

          - id: CanvasNetMathMl-Layout-Stretching
            title: >-
              The Layout subsystem shall stretch the stretchy embellished operators of a row along the block axis to the
              height of the other children (symmetric about the math axis when asked, within minsize and maxsize), and
              those of an under- or overscript element along the inline axis to the width of the other children, with
              the size variants and assemblies of the math font, the Unicode-based assemblies, or a rule, shall draw
              large operators larger in display style, and shall report an operator that cannot stretch (horizontally,
              only when the author asked for stretching).
            justification: |
              Fences, bars, and vertical arrows must enclose their content, braces, arrows and wide accents must span
              what they annotate, and sums and integrals must be drawn large in displayed equations, as in a browser.
            children:
              - CanvasNetMathMl-Layout-StretchyGlyphs-Variants
              - CanvasNetMathMl-Layout-StretchyGlyphs-Assembly
              - CanvasNetMathMl-Layout-StretchyGlyphs-UnicodeFallback
              - CanvasNetMathMl-Layout-StretchyGlyphs-RuleFallback
              - CanvasNetMathMl-Layout-StretchyGlyphs-Limit
              - CanvasNetMathMl-Layout-StretchyGlyphs-Failure
              - CanvasNetMathMl-Layout-TokenLayout-Stretch
              - CanvasNetMathMl-Layout-TokenLayout-InlineStretch
              - CanvasNetMathMl-Layout-TokenLayout-LargeOp
              - CanvasNetMathMl-Layout-RowLayout-Stretch
              - CanvasNetMathMl-Layout-UnderOverLayout-InlineStretch
              - CanvasNetMathMl-Layout-LayoutEngine-Stretching
              - CanvasNetMathMl-Layout-MathFont-Constructions
              - CanvasNetMathMl-Layout-MathBox-Model
              - CanvasNetMathMl-Layout-MathBox-Operators
            tests:
              - Layout_StretchyFencesAroundTallRow_MatchConstants

          - id: CanvasNetMathMl-Layout-Rows
            title: >-
              The Layout subsystem shall lay out rows and the grouping elements as MathML Core does: the children on a
              shared baseline with the spacing of their operators, mpadded with its requested size and offsets, merror
              with its border, mphantom with its size but no ink, semantics and maction with their first child, and the
              text written directly inside a row like an mtext.
            justification: |
              Rows place every token of an equation, and the grouping elements change the space or the look of their
              content.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-LayoutEngine-HiddenElements
              - CanvasNetMathMl-Layout-LayoutEngine-Phantom
              - CanvasNetMathMl-Layout-LayoutEngine-TextInRows
              - CanvasNetMathMl-Layout-RowLayout-Row
              - CanvasNetMathMl-Layout-RowLayout-Grouping
              - CanvasNetMathMl-Layout-RowLayout-Padded
              - CanvasNetMathMl-Layout-RowLayout-Error
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing

          - id: CanvasNetMathMl-Layout-Fractions
            title: >-
              The Layout subsystem shall lay out mfrac as MathML Core 3.3.2 does: with a nonzero line thickness, the
              numerator and denominator shifted by the fraction constants of the MATH table and kept their minimum gaps
              from a bar centered on the math axis; with a zero thickness, as a stack with the stack constants; the
              children centered and the box padded by 1px on each side; the children under the user agent rules of
              their positions; and an embellished fraction spaced and stretched like its operator.
            justification: |
              The fraction layout decides where numerators, denominators, and bars are drawn, and must match a browser
              that implements MathML Core.
            children:
              - CanvasNetMathMl-Layout-FractionLayout-Bar
              - CanvasNetMathMl-Layout-FractionLayout-Stack
              - CanvasNetMathMl-Layout-FractionLayout-LineThickness
              - CanvasNetMathMl-Layout-FractionLayout-Placement
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-LayoutEngine-Embellishment
              - CanvasNetMathMl-Layout-StyleResolver-ChildRules
              - CanvasNetMathMl-Layout-MathFont-Constants
            tests:
              - Layout_FractionsAndRadicals_MatchConstants

          - id: CanvasNetMathMl-Layout-Radicals
            title: >-
              The Layout subsystem shall lay out msqrt and mroot as MathML Core 3.3.3 does: the radical symbol stretched
              over the base, the vertical gap, and the overbar, the metrics raised by the gap, the overbar, and the
              extra ascender of the MATH table, the children of msqrt laid out as a row whose operators infer their
              forms, and the index of mroot kerned and raised, under the user agent rule of its position.
            justification: |
              The radical layout decides the size of the radical symbol and where the base and the index are drawn.
            children:
              - CanvasNetMathMl-Layout-RadicalLayout-SquareRoot
              - CanvasNetMathMl-Layout-RadicalLayout-Root
              - CanvasNetMathMl-Layout-RadicalLayout-Limit
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-LayoutEngine-OperatorForms
              - CanvasNetMathMl-Layout-StyleResolver-ChildRules
              - CanvasNetMathMl-Layout-StyleResolver-MathShift
              - CanvasNetMathMl-Layout-StretchyGlyphs-Variants
              - CanvasNetMathMl-Layout-StretchyGlyphs-Assembly
            tests:
              - Layout_FractionsAndRadicals_MatchConstants

          - id: CanvasNetMathMl-Layout-Scripts
            title: >-
              The Layout subsystem shall lay out msub, msup, msubsup and mmultiscripts as MathML Core 3.4.1 and 3.4.3
              do: the scripts shifted by the script constants of the MATH table (the cramped superscript shift in a
              compact math shift), kept apart by the minimum gap, after the base with the italic correction of a
              stretched or large operator and followed by the space after a script; the prescripts of mmultiscripts
              before the base; the scripts one script level smaller as postfix operators; and an embellished scripted
              element spaced and stretched like its operator.
            justification: |
              Indices, exponents and tensor notation are the most common constructs of mathematics after rows; their
              layout must match a browser that implements MathML Core.
            children:
              - CanvasNetMathMl-Layout-ScriptLayout-Subscript
              - CanvasNetMathMl-Layout-ScriptLayout-Superscript
              - CanvasNetMathMl-Layout-ScriptLayout-SubSuperscript
              - CanvasNetMathMl-Layout-ScriptLayout-Multiscripts
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-LayoutEngine-Embellishment
              - CanvasNetMathMl-Layout-LayoutEngine-ScriptForms
              - CanvasNetMathMl-Layout-StyleResolver-ScriptRules
              - CanvasNetMathMl-Layout-StyleResolver-MathShift
              - CanvasNetMathMl-Layout-MathFont-Constants
            tests:
              - Layout_ScriptsAndLimits_MatchConstants

          - id: CanvasNetMathMl-Layout-UnderOver
            title: >-
              The Layout subsystem shall lay out munder, mover and munderover as MathML Core 3.4.2 does: the scripts
              centered on the base as limits of a large operator, as the stack of an operator stretchy along the inline
              axis, as accents (at the font size of the base, an overscript raised to the accent base height), or at the
              overbar and underbar gaps; its operators stretched along the inline axis; and, in a compact math style,
              the limits of an operator with movablelimits laid out as scripts.
            justification: |
              Limits of sums and integrals, accents, braces and labeled arrows are drawn with these elements, and must
              match a browser that implements MathML Core.
            children:
              - CanvasNetMathMl-Layout-UnderOverLayout-Limits
              - CanvasNetMathMl-Layout-UnderOverLayout-Accents
              - CanvasNetMathMl-Layout-UnderOverLayout-StretchyBase
              - CanvasNetMathMl-Layout-UnderOverLayout-InlineStretch
              - CanvasNetMathMl-Layout-UnderOverLayout-Placement
              - CanvasNetMathMl-Layout-LayoutEngine-Dispatch
              - CanvasNetMathMl-Layout-LayoutEngine-MovableLimits
              - CanvasNetMathMl-Layout-LayoutEngine-ScriptForms
              - CanvasNetMathMl-Layout-StyleResolver-ScriptRules
              - CanvasNetMathMl-Layout-TokenLayout-InlineStretch
              - CanvasNetMathMl-Layout-MathFont-Constants
            tests:
              - Layout_ScriptsAndLimits_MatchConstants

          - id: CanvasNetMathMl-Layout-ChildCount
            title: >-
              The Layout subsystem shall lay out an mfrac, mroot, msub, msup, munder or mover without exactly two
              in-flow children, an msubsup or munderover without exactly three, and an invalid mmultiscripts as a row of
              its children and report a located mathml-child-count warning.
            justification: |
              MathML Core lays invalid markup out as an mrow, and the author must learn which element is invalid.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-ChildCount
            tests:
              - Layout_WrongChildCount_IsRowWithWarning

          - id: CanvasNetMathMl-Layout-Style
            title: >-
              The Layout subsystem shall compute the style of every element from its parent's as MathML Core does: the
              math style and math depth, the font size scaled by the script level with the MATH constants, the color
              and background, the mathvariant, the inline style subset, the user agent rules of the children of
              fractions, radicals and scripted elements, and the math shift, reporting invalid values.
            justification: |
              Styles decide the size, the color, and the letters of every token.
            children:
              - CanvasNetMathMl-Layout-StyleResolver-MathStyle
              - CanvasNetMathMl-Layout-StyleResolver-MathDepth
              - CanvasNetMathMl-Layout-StyleResolver-FontSize
              - CanvasNetMathMl-Layout-StyleResolver-Colors
              - CanvasNetMathMl-Layout-StyleResolver-Variant
              - CanvasNetMathMl-Layout-StyleResolver-InlineStyle
              - CanvasNetMathMl-Layout-StyleResolver-ChildRules
              - CanvasNetMathMl-Layout-StyleResolver-MathShift
              - CanvasNetMathMl-Layout-StyleResolver-ScriptRules
            tests:
              - Layout_ScriptLevel_ScalesTokensWithMathConstants
              - Layout_FractionsAndRadicals_MatchConstants
              - Layout_ScriptsAndLimits_MatchConstants

          - id: CanvasNetMathMl-Layout-MathFont
            title: >-
              The Layout subsystem shall lay equations out with the bundled Noto Sans Math, its MATH constants, and the
              metrics of its glyphs, with the deterministic bundled fallback for the characters it lacks, and shall
              report a character no bundled font has.
            justification: |
              The math font with its MATH table gives the metrics of a browser's math layout, and bundled fonts only
              make the layout identical on every machine.
            children:
              - CanvasNetMathMl-Layout-MathFont-Constants
              - CanvasNetMathMl-Layout-MathFont-Fallback
              - CanvasNetMathMl-Layout-MathFont-Metrics
              - CanvasNetMathMl-Layout-TokenLayout-MissingGlyph
            tests:
              - Layout_TokenRow_MatchesFontMetricsAndSpacing
              - Layout_ScriptLevel_ScalesTokensWithMathConstants

          - id: CanvasNetMathMl-Layout-UnsupportedFeatures
            title: >-
              The Layout subsystem shall lay out every element this version does not draw as a row of its children and
              report it, and shall report the attributes without effect on the elements it draws.
            justification: |
              An equation with a construct that is not drawn must still produce a picture, and the caller must learn
              what was not drawn.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-UnsupportedElements
              - CanvasNetMathMl-Layout-LayoutEngine-UnsupportedAttributes
            tests:
              - Layout_UnsupportedElementsAndAttributes_AreRowsWithReports

          - id: CanvasNetMathMl-Layout-Bounds
            title: >-
              The Layout subsystem shall bound the nesting depth and the work of a layout with located
              mathml-limit-exceeded errors and stop when the call is canceled.
            justification: |
              A hostile equation must not exhaust the stack or time while it is laid out.
            children:
              - CanvasNetMathMl-Layout-LayoutEngine-Bounds
            tests:
              - Layout_Bounds_WorkBudgetAndCancellation_StopTheLayout
