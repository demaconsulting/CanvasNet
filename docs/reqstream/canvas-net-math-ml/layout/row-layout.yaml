---
# Software Unit Requirements for RowLayout
#
# These requirements describe the design-level behavior of the RowLayout unit of the Layout subsystem (internal
# namespace DemaConsulting.CanvasNet.MathMl.Layout): rows, the stretching of their operators, the grouping rules,
# mpadded, and merror. See docs/verification/canvas-net-math-ml/layout/row-layout.md for the test-evidence mapping.

sections:
  - title: CanvasNetMathMl Requirements
    sections:
      - title: Layout Requirements
        sections:
          - title: RowLayout Requirements
            requirements:
              - id: CanvasNetMathMl-Layout-RowLayout-Row
                title: >-
                  The RowLayout unit shall place the children of a row left to right on a shared baseline with the
                  maximum ascent and descent (at least zero), add the leading and trailing space of an operator child
                  around it, give the row the italic correction of its last child (none when that child is an
                  embellished operator), and add the italic correction of a slanted token (or the overlap, when larger)
                  before the next child that is not slanted only where their inks would otherwise overlap, moving a
                  child whose ink starts before its origin clear of the token before it.
                justification: |
                  MathML Core lays rows out this way and adds the italic correction of a slanted child before an upright
                  one; Chrome, which the reference layouts come from, adds no italic correction between children, which
                  lets the hook of an italic f collide with a closing brace. Glyphs must never collide, so CanvasNet
                  adds the correction where the inks would overlap and lays rows out as Chrome elsewhere.
                tests:
                  - RowLayout_LayoutRow_Children_ShareBaselineAndTakeMaximumExtents
                  - RowLayout_LayoutRow_NegativeExtents_ClampToZero
                  - RowLayout_LayoutRow_Operator_GetsItsSpacing
                  - RowLayout_LayoutRow_OperatorSpacing_FromEmbellishedOperator
                  - RowLayout_LayoutRow_ItalicCorrection_ComesFromTheLastChild
                  - RowLayout_LayoutRow_CollidingInk_GetsClearance

              - id: CanvasNetMathMl-Layout-RowLayout-Stretch
                title: >-
                  The RowLayout unit shall lay out again the stretchy embellished operators of a row with a block
                  stretch axis, before placing the children, with the block stretch size constraint of the largest
                  ascent and descent of the other children, or, when every child stretches, of the operators laid out
                  with the constraint (0, 0), and shall stretch nothing in a row that passes the constraint of its
                  parent on.
                justification: |
                  Fences grow to the height of what they enclose, as MathML Core 3.3.1.1 specifies.
                tests:
                  - RowLayout_LayoutRow_StretchyParens_CoverTallestSibling
                  - RowLayout_LayoutRow_AllChildrenStretchy_UseUnconstrainedSize
                  - RowLayout_LayoutRow_NonStretchyOrInlineAxis_AreNotStretched

              - id: CanvasNetMathMl-Layout-RowLayout-Grouping
                title: >-
                  The RowLayout unit shall make a row of one operator and space-like children an embellished operator
                  that adds no spacing inside (unless it is math), lay the anonymous row of msqrt and mtd out without
                  spacing inside in that case but carrying no operator, and make a row of space-like children
                  space-like.
                justification: |
                  MathML Core spaces an operator wrapped in a grouping element as the operator itself; the anonymous
                  rows of msqrt and mtd (MathML Core 3.1.3) are spaced like grouping elements, as Chrome spaces them,
                  while their elements are never embellished operators (3.2.4.1).
                tests:
                  - RowLayout_LayoutRow_Grouping_PropagatesOperatorAndSpaceLikeness

              - id: CanvasNetMathMl-Layout-RowLayout-Padded
                title: >-
                  The RowLayout unit shall give mpadded its requested width, height, and depth, move its content by
                  lspace and voffset, keep the inner size for a percentage or an invalid value, keep the inner width
                  for a negative width and report it as a mathml-attribute-invalid warning at the attribute, and clamp
                  a negative height, depth, or lspace to zero.
                justification: |
                  mpadded is how authors adjust the space around content, as MathML Core 3.3.6 specifies; a negative
                  width is invalid CSS, and the author must learn that it was ignored, as for mspace.
                tests:
                  - RowLayout_LayoutPadded_Attributes_SetSizeAndMoveContent

              - id: CanvasNetMathMl-Layout-RowLayout-Error
                title: >-
                  The RowLayout unit shall put a one-pixel red border around the row of merror, growing its box by the
                  border on every side.
                justification: |
                  The user agent style of MathML Core marks merror with a border.
                tests:
                  - RowLayout_LayoutError_AddsBorderPadding
