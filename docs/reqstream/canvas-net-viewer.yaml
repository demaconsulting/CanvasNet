---
# cspell:ignore vsdx
#
# Software System Requirements for CanvasNetViewer
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.Viewer
# package (namespace DemaConsulting.CanvasNet.Viewer) from the perspective of its consumers, without
# specifying implementation details.
#
# CanvasNetViewer is an independent software system, distributed as its own NuGet package. It
# aggregates the image sources of every CanvasNet format package (CanvasNetSvg, CanvasNetPdf,
# CanvasNetPptx, CanvasNetVsdx, CanvasNetScad, CanvasNetVegaLite, CanvasNetMermaid) and of the core ImageSources
# subsystem (the raster source and the folder resolver), so that one call renders any file the
# library can read and one call creates the resolver that lets an SVG document embed all of them -
# see docs/design/canvas-net-viewer.md's Dependencies section for details.
#
# The system also contains the Imaging subsystem (namespace DemaConsulting.CanvasNet.Viewer.Imaging), the library
# form of everything the canvasnet command-line tool does with images (probe, render with transformations, inspect,
# compare, montage), and the ViewerException unit with the stable ErrorCodes. The canvasnet tool (CanvasNetTool) is a
# command-line shell over these types.

sections:
  - title: CanvasNetViewer Requirements
    requirements:
      - id: CanvasNetViewer-Sources
        title: >-
          The library shall list the image sources it supports, one for each of the raster, SVG, PDF,
          PowerPoint, Visio, OpenSCAD, Vega-Lite, and Mermaid formats, in a fixed order that an application
          cannot change, and the file name extensions they claim as one sorted list.
        tags: [system]
        justification: |
          An application, a document, and the command-line tool must agree on which file types can be linked
          and rendered; one fixed list is that single source of truth, and a format is added to it in one place.
        children:
          - CanvasNetViewer-CanvasNetViewer-ImageSources
        tests:
          - CanvasNetViewer_SystemIntegration_ImageSources_ListEveryFormat

      - id: CanvasNetViewer-Embedding
        title: >-
          The library shall create, for a folder, a resolver that lets an SVG document embed a raster, a model,
          a chart, a diagram, another SVG file, and a page of a document from that folder and below it only (a query
          after the file name is ignored, and a fragment chooses the page of a document, # page=N or  # slide=N, the
          view of a model,  # view=name, or the theme of a diagram,  # theme=name; def.name=value sets a variable of a
          model and param.name=value a parameter of a chart),
          refuse a picture that would take more pixels than the render
          may use before it is decoded (a warning, not an error), and report the
          notes, printed text, and embedded images of the render.
        tags: [system]
        justification: |
          A diagram that links to models, charts, and pictures is the central use of the package; the resolver
          must work with the SVG codec without the application wiring any format package itself.
        children:
          - CanvasNetViewer-CanvasNetViewer-CreateImageResolver
          - CanvasNetViewer-CanvasNetViewer-LoaderSources
          - CanvasNetViewer-CanvasNetViewer-Parameters
        tests:
          - CanvasNetViewer_SystemIntegration_SvgEmbeddingEveryFormat_DrawsAllAndReportsEmbeds
          - CanvasNetViewer_SystemIntegration_SvgEmbeddingWithQueryAndFragment_DrawsTheFile
          - CanvasNetViewer_SystemIntegration_SvgEmbeddingHugeRasterInTinyPlacement_IsRefusedWithWarning

      - id: CanvasNetViewer-Diagrams
        title: >-
          The library shall render a Mermaid diagram (a .mmd or .mermaid file) directly, at the size Mermaid lays it
          out at and with the fonts bundled with the library, and as a picture of an SVG document, where the theme
          fragment of the link (flow.mmd#theme=dark) chooses one of Mermaid's themes and a name that is not a theme
          refuses the link with image-fragment-invalid; shall report what a diagram declares (its type, whether this
          version draws it, its direction, titles, and numbers of nodes, edges, and subgraphs) without drawing it; and
          shall show the pictures of the nodes of a diagram through the same image resolver and file-access policy as
          the pictures of an SVG document.
        tags: [system]
        justification: |
          Diagrams are written as Mermaid text in documentation and by agents; an application that already shows SVG
          documents, models, and charts must show a diagram, alone or inside a drawing, with nothing but its file or its
          link, the same picture on every machine, and under the same policy as every other linked file.
        children:
          - CanvasNetViewer-Imaging-SourceLoader-MermaidDetection
          - CanvasNetViewer-Imaging-SourceLoader-MermaidProbe
          - CanvasNetViewer-Imaging-SourceLoader-MermaidRender
          - CanvasNetViewer-Imaging-SourceLoader-MermaidErrors
          - CanvasNetViewer-Imaging-DiagramImages
        tests:
          - CanvasNetViewer_SystemIntegration_MermaidDiagram_RendersDirectlyAndEmbeddedWithTheme

      - id: CanvasNetViewer-Render
        title: >-
          The library shall render any file of a supported format, given as a path or as a stream with a file
          name, as a picture at its natural size or at a requested size (for a document, the chosen page at a
          chosen resolution, over a chosen background), returning the picture with its format, page, notes, printed
          text, anchors, and embedded images, and shall fail with a specific exception for a missing file,
          an unknown file type, a file that cannot be drawn, a page that does not exist, a path that is not a
          regular file, and a canceled render.
        tags: [system]
        justification: |
          Applications that only want to show a file (a viewer, a thumbnail generator, a report builder) should
          not need to know which package reads which format.
        children:
          - CanvasNetViewer-CanvasNetViewer-RenderPath
          - CanvasNetViewer-CanvasNetViewer-RenderStream
          - CanvasNetViewer-CanvasNetViewer-RenderOptions
        tests:
          - CanvasNetViewer_SystemIntegration_RenderWithExtraSources_UsesCustomSources

      - id: CanvasNetViewer-FileAccess
        title: >-
          The library shall read every file that a rendered or probed file references (the links of an SVG file,
          the includes of a model, the data files of a chart, and the pictures of a diagram, also nested inside an
          embedded file) under one file-access policy that the caller chooses for the operation - by default every
          regular local file, also through dot-dot, an absolute path, a file: URI without a host, and a symbolic
          link or junction, as Pandoc does - while never judging the top-level file the caller named, never
          reading a UNC path or a file: URI with a host, and keeping every resource limit whatever the policy; a
          reference the policy denies shall be the warning image-access-denied for an SVG link and a located
          error for an include or a data file, and fail with the code file-access-denied in strict mode.
        tags: [system, security]
        justification: |
          Hosts differ: a desktop converter reads what its user can, a build server confines documents to the
          repository, a service may refuse links. One policy, applied to every kind of reference by every
          operation, lets each host decide once and be sure no reference reads around it.
        children:
          - CanvasNetViewer-CanvasNetViewer-FileAccess
          - CanvasNetViewer-CanvasNetViewer-FileAccessDenied
          - CanvasNetViewer-Imaging-FileAccess
        tests:
          - CanvasNetViewer_SystemIntegration_FileAccess_DefaultFollowsAndPolicyConfinesEveryReferenceKind
          - CanvasNetViewer_SourceTree_EveryOpenOptionsCarriesTheFileAccess

      - id: CanvasNetViewer-CustomSources
        title: >-
          The library shall let a library user add image sources of their own, claiming a file name extension
          or a URI scheme, so that a new file type or a live source can be embedded and rendered; a source that
          claims the same extension or scheme as an earlier source shall take precedence, nothing shall be cached
          between renders, and no source shall claim http or https unless the user supplies it.
        tags: [system]
        justification: |
          New formats and live sources (a camera, a video frame) belong to applications, not to this library; the
          precedence rule lets an application override a built-in format, and a live source must be asked again
          for every render.
        children:
          - CanvasNetViewer-CanvasNetViewer-ExtraSources
        tests:
          - CanvasNetViewer_SystemIntegration_CustomSourceForNewExtension_IsEmbedded
          - CanvasNetViewer_SystemIntegration_CustomSourceOverridingBuiltInExtension_Wins
          - CanvasNetViewer_SystemIntegration_CustomSchemeSource_IsEmbeddedFromRawHref
          - CanvasNetViewer_SystemIntegration_LiveFrameSource_GivesFreshFrameOnEveryRender

      - id: CanvasNetViewer-ImageOperations
        title: >-
          The library shall do from code everything the canvasnet tool does with images: report the facts of a file of
          any supported format, render it (a chosen page or every page of a document) through an ordered pipeline of
          crop, resize, fit, rotate, flip, pad, tone, deskew, trim, and grid operations into image files, report the
          dominant colors and the pixels of an image, compare two images with measures and thresholds and write the
          comparison pictures, compose a contact sheet, and write a copy of an SVG drawing that other SVG readers can
          show, each as one call that takes plain request values and returns plain result values, without a command
          line.
        tags: [system]
        justification: |
          What an agent can do through the command line, an application should be able to do through the library
          without starting a process or building a command line; the tool is then only a way to type the requests.
        children:
          - CanvasNetViewer-Imaging-Load
          - CanvasNetViewer-Imaging-Render
          - CanvasNetViewer-Imaging-Transform
          - CanvasNetViewer-Imaging-Inspect
          - CanvasNetViewer-Imaging-Compare
          - CanvasNetViewer-Imaging-Montage
          - CanvasNetViewer-Imaging-Write
          - CanvasNetViewer-Imaging-RequestDefaults
          - CanvasNetViewer-Imaging-DiagnosticOrigin
          - CanvasNetViewer-Imaging-ChartImages
          - CanvasNetViewer-Imaging-Flatten
        tests:
          - CanvasNetViewer_SystemIntegration_ImageOperations_ProbeRenderInspectCompareMontage
          - CanvasNetViewer_SystemIntegration_Flatten_ComposedSvgBecomesPlainSvg

      - id: CanvasNetViewer-UserGuideExamples
        title: >-
          Every C# example of the user guide of the library that is marked as compiled shall be a complete program
          (its own using directives and declared variables) that compiles without an error against the current
          public API of the library, and every C# block of the guide shall be marked as compiled or as a signature
          listing, so that an example cannot silently drift from the API or escape the check.
        tags: [system]
        justification: |
          A user guide whose examples no longer compile misleads the library users and agents that copy them; the
          examples are the documentation of the API, so they are held to the API by a test and not by review alone.
        tests:
          - CanvasNetViewer_UserGuideExamples_Compile
          - CanvasNetViewer_UserGuideExamples_NegativeControl_ReportsErrors

      - id: CanvasNetViewer-ErrorContract
        title: >-
          The library shall report every expected failure of those operations (a file that is missing, unsupported,
          corrupt, or too large, a page that does not exist, an output that cannot be written, inputs that cannot be
          compared) as one exception type that carries a stable error code, a message, and a hint, with the codes
          fixed between releases.
        tags: [system]
        justification: |
          A program must be able to tell a mistake of the user from a defect, and to act on the failure without
          parsing text; the canvasnet tool reports the same codes in its results.
        children:
          - CanvasNetViewer-ViewerException-Contract
          - CanvasNetViewer-ViewerException-ErrorCodes
        tests:
          - CanvasNetViewer_SystemIntegration_FailedOperation_IsViewerExceptionWithStableCode
