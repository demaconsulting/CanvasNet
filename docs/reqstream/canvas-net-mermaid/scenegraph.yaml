---
# Software Subsystem Requirements for Scenegraph
#
# These requirements decompose the CanvasNetMermaid system's drawing responsibilities into the Scenegraph subsystem
# (internal namespace DemaConsulting.CanvasNet.Mermaid.Scenegraph): the immutable scene of a laid-out diagram that is
# the assertion surface of the tests (SceneModel) and the painter that draws a scene onto a CanvasNet Surface with
# the bundled fonts, the caller's pictures, and the painted-pixel limit (ScenePainter). Each requirement here links
# down to the unit requirements that implement it. See docs/verification/canvas-net-mermaid/scenegraph.md for the
# test-evidence mapping.

sections:
  - title: CanvasNetMermaid Requirements
    sections:
      - title: Scenegraph Requirements
        requirements:
          - id: CanvasNetMermaid-Scenegraph-Model
            title: >-
              The Scenegraph subsystem shall represent a laid-out diagram as an immutable scene in Mermaid's SVG
              coordinates - a view box and translated groups of paths with fill, stroke, and drop shadow, lines of
              styled text runs, and pictures, each with a role, Mermaid's element id, and the location of its
              construct - whose bounds are those of its geometry as an SVG bounding box gives them.
            justification: |
              Separating the scene from the pixels lets the tests and the reference comparison assert the layout
              with numbers, and the view box of a diagram includes bounds that Mermaid takes from the bounding box
              of its SVG elements.
            children:
              - CanvasNetMermaid-Scenegraph-SceneModel-Rectangles
              - CanvasNetMermaid-Scenegraph-SceneModel-Segments
              - CanvasNetMermaid-Scenegraph-SceneModel-Bounds
              - CanvasNetMermaid-Scenegraph-SceneModel-Shadow
            tests:
              - Scenegraph_PaintNodeScene_TwoScales_DeterministicAndScaled
              - Scenegraph_PaintBoxScene_ShadowIsUnderTheBoxAndOutsideTheBounds

          - id: CanvasNetMermaid-Scenegraph-Painting
            title: >-
              The Scenegraph subsystem shall paint a scene onto a surface over a background (transparent when none),
              placed at a uniform scale or fitted and centered in a size, with anti-aliased fills under the nonzero
              or even-odd rule, strokes with their width and dashes scaled, drop shadows under their paths, and text
              runs in the bundled fonts anchored at the start, middle, or end of their line.
            justification: |
              The painter turns the verified scene into the pixels of the natural-size and exact-size renders of a
              diagram, and it must draw what Mermaid's SVG shows.
            children:
              - CanvasNetMermaid-Scenegraph-SceneModel-PathConversion
              - CanvasNetMermaid-Scenegraph-ScenePainter-FillStroke
              - CanvasNetMermaid-Scenegraph-ScenePainter-Dashes
              - CanvasNetMermaid-Scenegraph-ScenePainter-Text
              - CanvasNetMermaid-Scenegraph-ScenePainter-Placement
              - CanvasNetMermaid-Scenegraph-ScenePainter-DropShadow
              - CanvasNetMermaid-Scenegraph-ScenePainter-StrokedText
            tests:
              - Scenegraph_PaintNodeScene_TwoScales_DeterministicAndScaled
              - Scenegraph_PaintBoxScene_ShadowIsUnderTheBoxAndOutsideTheBounds

          - id: CanvasNetMermaid-Scenegraph-Pictures
            title: >-
              The Scenegraph subsystem shall draw the pictures of a scene only through the picture loader that the
              scene carries, at the device size of their box, stretched to fill the box, with their opacity, and
              shall draw no picture when the scene has no loader.
            justification: |
              Node pictures come from the caller's image resolver and nowhere else, and Mermaid's image element
              fills its box without keeping the aspect of the picture.
            children:
              - CanvasNetMermaid-Scenegraph-ScenePainter-Images
            tests:
              - Scenegraph_PaintPictureScene_PicturesComeOnlyFromTheLoader

          - id: CanvasNetMermaid-Scenegraph-BoundedPainting
            title: >-
              The Scenegraph subsystem shall bound the work of painting a scene: it shall charge the device pixels of
              every item to the painted-pixel limit before painting it and fail with a located
              mermaid-limit-exceeded error when the limit would be passed, skip an item whose geometry is not finite
              or lies far outside every surface, and stop with an operation-canceled error when the cancellation
              token is canceled.
            justification: |
              A diagram from an untrusted source must not make the renderer paint without bound or run after the
              caller has given up on it.
            children:
              - CanvasNetMermaid-Scenegraph-ScenePainter-PaintedPixelLimit
              - CanvasNetMermaid-Scenegraph-ScenePainter-UnboundedGeometry
              - CanvasNetMermaid-Scenegraph-ScenePainter-Cancellation
            tests:
              - Scenegraph_PaintNodeScene_OverPaintedPixelLimit_FailsAtTheNode
              - Scenegraph_PaintNodeScene_CanceledToken_Throws

          - id: CanvasNetMermaid-Scenegraph-Determinism
            title: >-
              The Scenegraph subsystem shall paint the same scene, size, and placement to identical pixels every
              time, using only the fonts bundled with CanvasNet and never the fonts installed on the machine.
            justification: |
              Renders must be repeatable and identical on every platform, which fonts installed on a machine would
              prevent.
            children:
              - CanvasNetMermaid-Scenegraph-ScenePainter-Text
            tests:
              - Scenegraph_PaintNodeScene_TwoScales_DeterministicAndScaled
