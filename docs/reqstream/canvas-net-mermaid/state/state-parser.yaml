---
# Software Unit Requirements for StateParser
#
# These requirements describe the design-level behavior of the StateParser unit of the State subsystem (internal
# namespace DemaConsulting.CanvasNet.Mermaid.State): the lexer and the grammar of the state diagram language of the
# pinned Mermaid release, the statement tree it hands to the state database, the located errors with Mermaid's
# expected tokens, and the limits checked while the text is read. See
# docs/verification/canvas-net-mermaid/state/state-parser.md for the test-evidence mapping.

sections:
  - title: CanvasNetMermaid Requirements
    sections:
      - title: State Requirements
        sections:
          - title: StateParser Requirements
            requirements:
              - id: CanvasNetMermaid-State-StateParser-Tokens
                title: >-
                  The StateParser unit shall split a state diagram text into the tokens that Mermaid's state lexer
                  produces, including keywords in any case, a note position in the case it is written in, an inline
                  comment that ends an id, a direction statement wherever the word stands on its line, and the
                  pseudo-state forms, while keeping every token located in the original text.
                justification: |
                  Mermaid's lexer decides what a text means in many corner cases that authors rely on; locations must
                  still point into the file as written.
                tests:
                  - StateParser_Parse_UpstreamVector_MatchesMermaid
                  - StateParser_Parse_KeywordsInAnyCase_AreRecognized
                  - StateParser_Parse_CommentsAndDirectionLines_FollowTheLexer

              - id: CanvasNetMermaid-State-StateParser-Grammar
                title: >-
                  The StateParser unit shall accept exactly the texts that the state grammar of the pinned Mermaid
                  release accepts under both headers - states with descriptions and the as form, transitions with
                  labels, the start and end states, composite states with their own directions and concurrency
                  dividers numbered in parse order, the fork, join, and choice states in both notations, notes, the
                  classDef, class, style, and click statements, the direction, the accessibility statements, and the
                  statements Mermaid keeps as text and ignores - and shall hand the state database the same statement
                  tree that Mermaid's parser builds, reading a click inside a composite state as states, as Mermaid's
                  lexer does.
                justification: |
                  The ids, the regions, and the clusters of a state diagram depend on the statement tree and its
                  order, and the layout depends on all of them.
                tests:
                  - StateParser_Parse_UpstreamVector_MatchesMermaid
                  - StateParser_Vectors_FileHasEnoughCases_AtLeast100
                  - StateParser_Parse_Header_ReadsTheSameStatements
                  - StateParser_Parse_IgnoredStatements_AreKeptAsText
                  - StateParser_Parse_StateForms_GiveMermaidsStatements
                  - StateParser_Parse_DividersAndDirections_AreReadPerComposite
                  - StateParser_Parse_ClickInsideComposite_IsReadAsStates

              - id: CanvasNetMermaid-State-StateParser-Errors
                title: >-
                  The StateParser unit shall refuse a token that the grammar does not accept with a
                  MermaidSyntaxException of code mermaid-syntax-error, located at the token in the original text, that
                  names the token found and lists as expected the token names that Mermaid's parser lists, with a hint;
                  shall refuse a divider outside a composite state and a dash in an id as Mermaid's invalid token, a
                  note without its end as a located lexical error, and a composite state name of two words with
                  Mermaid's own message; and shall fail an unclosed composite state at the end of the text.
                justification: |
                  Authors compare messages with Mermaid's; the expected tokens and the location tell them what to
                  write and where.
                tests:
                  - StateParser_Parse_MissingTarget_ThrowsLocatedErrorWithExpectedTokens
                  - StateParser_Parse_DashOutsideComposite_IsAnInvalidToken
                  - StateParser_Parse_UnclosedNote_IsALexicalError
                  - StateParser_Parse_TwoWordCompositeName_ThrowsMermaidsMessage
                  - StateParser_Parse_UnclosedComposite_FailsAtTheEnd
                  - StateParser_Parse_UpstreamVector_MatchesMermaid

              - id: CanvasNetMermaid-State-StateParser-LinearTime
                title: >-
                  The StateParser unit shall read long lines of many tokens and a text of many statements without
                  recursion that grows with the text and without matching work that grows faster than the length of
                  the text.
                justification: |
                  The text is untrusted; a long line or a long text must not exhaust the stack or cost quadratic time.
                tests:
                  - StateParser_Parse_LongLinesAndManyStatements_AreReadIteratively

              - id: CanvasNetMermaid-State-StateParser-Limits
                title: >-
                  The StateParser unit shall refuse, with a MermaidSyntaxException of code mermaid-limit-exceeded
                  located at the element that breaches it, composite states nested deeper than MaxNestingDepth and
                  every id, description, label, note, style, class, link, tooltip, or accessibility text it keeps that
                  is longer than MaxLabelLength.
                justification: |
                  The size of the model, and so the cost of every later stage, must be bounded while untrusted text is
                  read, and the nesting bounds the recursion of the parser.
                tests:
                  - StateParser_Parse_CompositesTooDeep_ThrowsLimitExceeded
                  - StateParser_Parse_LongTextAnywhere_ThrowsLimitExceeded
