---
# Software Unit Requirements for ClusterLayout
#
# These requirements describe the design-level behavior of the ClusterLayout unit of the Rendering subsystem
# (internal namespace DemaConsulting.CanvasNet.Mermaid.Rendering): Mermaid's dagre renderer, which turns the layout
# data of a diagram into compound graphs, lays out the subgraphs without links to the outside on their own, sizes
# every node and edge label, runs the dagre layout, and draws the subgraphs, edges, edge labels, and nodes.
# See docs/verification/canvas-net-mermaid/rendering/cluster-layout.md for the test-evidence mapping.

sections:
  - title: CanvasNetMermaid Requirements
    sections:
      - title: Rendering Requirements
        sections:
          - title: ClusterLayout Requirements
            requirements:
              - id: CanvasNetMermaid-Rendering-ClusterLayout-IsolatedSubgraphs
                title: >-
                  The ClusterLayout unit shall lay out each subgraph without links to the outside as a graph of its
                  own - in the direction the subgraph declares, else in the other one of top-to-bottom and
                  left-to-right, recursively for nested subgraphs - and draw it as one group that stands in for its
                  contents in the graph around it.
                justification: |
                  Mermaid extracts such subgraphs and lays them out separately, which changes their direction and
                  their size; the same extraction gives the same layout.
                tests:
                  - ClusterLayout_Render_IsolatedSubgraph_IsLaidOutOnItsOwnInTheOtherDirection
                  - ClusterLayout_Render_DeclaredDirection_Wins
                  - ClusterLayout_Render_NestedIsolatedSubgraph_IsANestedGroup

              - id: CanvasNetMermaid-Rendering-ClusterLayout-SubgraphLinks
                title: >-
                  The ClusterLayout unit shall attach a link to or from a subgraph that has links to the outside to a
                  node inside that subgraph and cut its route where it crosses the subgraph's rectangle, and shall
                  end a link to a subgraph without links to the outside on the box of the laid-out subgraph.
                justification: |
                  Dagre cannot route to a compound node; Mermaid's anchors and cuts decide where such links start
                  and end.
                tests:
                  - ClusterLayout_Render_LinksToIsolatedSubgraph_EndOnItsBox
                  - ClusterLayout_Render_LinkFromSubgraphWithOutsideLinks_StartsOutsideIt

              - id: CanvasNetMermaid-Rendering-ClusterLayout-SelfLoops
                title: >-
                  The ClusterLayout unit shall lay out a link from a node to itself through two hidden nodes beside
                  the node and draw it as one compact loop with its label outside the node, on the side the layout
                  put the loop.
                justification: |
                  Dagre does not lay out self-loops the way Mermaid draws them; Mermaid's workaround decides the
                  space the loop takes and its route.
                tests:
                  - ClusterLayout_Render_SelfLoop_IsOneLoopBesideItsNode

              - id: CanvasNetMermaid-Rendering-ClusterLayout-SubgraphRectangles
                title: >-
                  The ClusterLayout unit shall draw each subgraph laid out with its graph as a rectangle around its
                  contents, made taller by the subgraph title margins with its nodes moved down accordingly, and
                  widened around the same center when its title is wider than its contents.
                justification: |
                  The subgraph title margins and a wide title change the size of the subgraph and the position of
                  everything in it, as in Mermaid.
                tests:
                  - ClusterLayout_Render_WideTitle_WidensTheRectangle
                  - ClusterLayout_Render_SubgraphTitleMargins_MoveNodesDown

              - id: CanvasNetMermaid-Rendering-ClusterLayout-DrawingOrder
                title: >-
                  The ClusterLayout unit shall draw a graph in Mermaid's layers - subgraph rectangles (top level
                  first, then each subtree), edges, edge labels, then nodes - give the box of everything drawn, and
                  draw nothing and give no box for an empty diagram.
                justification: |
                  The drawing order decides what is painted over what, and the box of the drawing becomes the view
                  box of the picture.
                tests:
                  - ClusterLayout_SortNodesByHierarchy_TopLevelFirst
                  - ClusterLayout_Render_EmptyDiagram_DrawsNothing

              - id: CanvasNetMermaid-Rendering-ClusterLayout-WorkLimit
                title: >-
                  The ClusterLayout unit shall charge every stage of its work to the layout work budget of the call
                  and stop with a located limit failure when the budget is spent.
                justification: |
                  The subgraph handling repeats over the nodes and edges of the diagram; untrusted input must not
                  make it run without bound.
                tests:
                  - ClusterLayout_Render_TinyWorkBudget_ThrowsLimitExceeded
