---
# Software Unit Requirements for ShapeLibrary
#
# These requirements describe the design-level behavior of the ShapeLibrary unit of the Rendering subsystem
# (internal namespace DemaConsulting.CanvasNet.Mermaid.Rendering): the node shapes of Mermaid's
# rendering-elements/shapes in the classic look, their intersect functions, the subgraph rectangle, and the shape
# registry ShapeNames.
# See docs/verification/canvas-net-mermaid/rendering/shape-library.md for the test-evidence mapping.

sections:
  - title: CanvasNetMermaid Requirements
    sections:
      - title: Rendering Requirements
        sections:
          - title: ShapeLibrary Requirements
            requirements:
              - id: CanvasNetMermaid-Rendering-ShapeLibrary-Registry
                title: >-
                  The ShapeLibrary unit shall know Mermaid's 53 documented shapes by their short names, aliases, and
                  internal aliases and the undocumented shapes a diagram uses, each naming the shape it stands for,
                  with a case-sensitive test of a name and a suggestion of the nearest name a flowchart accepts for a
                  misspelled one.
                justification: |
                  The flowchart syntax accepts exactly the names of Mermaid's registry, and a typo deserves a useful
                  hint.
                tests:
                  - ShapeNames_ShortNames_AreTheFiftyThreeDocumentedShapes
                  - ShapeNames_HandlerOf_Alias_GivesItsShape
                  - ShapeNames_IsKnown_UnknownOrWrongCase_IsFalse
                  - ShapeNames_Nearest_Typo_SuggestsAcceptedName

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-EveryShape
                title: >-
                  The ShapeLibrary unit shall draw every shape name that a flowchart accepts, and shall fail with a
                  located render failure that suggests a documented shape for a name it does not draw.
                justification: |
                  A flowchart may name any documented shape; a shape that only other diagram types use must fail
                  clearly instead of drawing something else.
                tests:
                  - ShapeLibrary_Draw_EveryDocumentedName_IsDrawn
                  - ShapeLibrary_Vectors_CoverEveryDocumentedShape
                  - ShapeLibrary_Draw_UndrawnShape_ThrowsRenderFailed

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-Geometry
                title: >-
                  The ShapeLibrary unit shall give each shape, for the label box Mermaid measured, the node size,
                  drawn box, label place, and outline intersections that the pinned Mermaid gives it, within 0.02
                  pixel (0.06 pixel for the circles Mermaid draws through rough.js), in the direction of the graph the
                  node is laid out in.
                justification: |
                  The geometry of the shapes is the basis of layout fidelity; checking it with Mermaid's own label
                  box separates it from the text measurement.
                tests:
                  - ShapeLibrary_Draw_UpstreamVectorWithMermaidLabel_MatchesGeometry
                  - ShapeLibrary_Draw_State_SizesToTheLabel
                  - ShapeLibrary_Draw_ForkInLeftToRight_IsUpright
                  - ShapeLibrary_SegmentBounds_Arcs_IncludeTheirExtremes

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-NodeSize
                title: >-
                  The ShapeLibrary unit shall give each shape, with the label measured by this library, the label box
                  and node size of the pinned Mermaid within 0.02 pixel for HTML labels and within 2 pixels for SVG
                  labels.
                justification: |
                  The node size that the layout uses is what the user sees; the tolerance for SVG labels covers the
                  glyph rounding of the browser's text box.
                tests:
                  - ShapeLibrary_Draw_UpstreamVector_MatchesNodeSize

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-Intersections
                title: >-
                  The ShapeLibrary unit shall compute where a line from a node's center leaves its rectangle,
                  ellipse, circle, or polygon outline with the arithmetic of Mermaid's intersect functions, including
                  their quirks.
                justification: |
                  Edges end where the intersect functions say; the same arithmetic gives the same end points.
                tests:
                  - ShapeLibrary_IntersectRect_Point_LeavesThroughTheRightSide
                  - ShapeLibrary_IntersectEllipse_Points_LieOnTheEllipse
                  - ShapeLibrary_IntersectLine_Crossing_KeepsTheRoundingOffset
                  - ShapeLibrary_IntersectLine_NoCrossing_GivesNull
                  - ShapeLibrary_IntersectPolygon_Square_GivesNearestCrossing

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-Paint
                title: >-
                  The ShapeLibrary unit shall paint the parts of each shape with the colors and stroke widths that
                  Mermaid's elements compute to, the node's own class and inline styles winning over the style sheet
                  and its text properties applying to the label.
                justification: |
                  The look of a node follows the theme, classDef, class, and style statements exactly as in Mermaid.
                tests:
                  - ShapeLibrary_Draw_UpstreamVector_MatchesPaint
                  - ShapeLibrary_SplitStyles_Styles_SplitsLabelFromNode
                  - ShapeLibrary_Draw_UserStyles_PaintTheShape

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-LegacyEllipse
                title: >-
                  The ShapeLibrary unit shall draw the legacy ellipse shape of the A(-text-) syntax as an ellipse
                  around the padded label with an elliptical outline for the edges.
                justification: |
                  The pinned Mermaid accepts the syntax but fails to draw it; the library draws what earlier Mermaid
                  versions drew instead of failing.
                tests:
                  - ShapeLibrary_Draw_LegacyEllipse_IsAnEllipse

              - id: CanvasNetMermaid-Rendering-ShapeLibrary-Images
                title: >-
                  The ShapeLibrary unit shall size an image node from the natural size of its picture, its width and
                  height, and its aspect constraint, and shall keep the frame, report the picture, and draw no
                  picture when the picture cannot be loaded.
                justification: |
                  Image nodes are sized as Mermaid sizes them; a picture that cannot be loaded must not stop the
                  render or go unreported.
                tests:
                  - ShapeLibrary_Draw_ImageWithoutResolver_ReportsAndDrawsNoPicture
                  - ShapeLibrary_Draw_UpstreamVectorWithMermaidLabel_MatchesGeometry
