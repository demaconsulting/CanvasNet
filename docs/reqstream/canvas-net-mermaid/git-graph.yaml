---
# Software Subsystem Requirements for GitGraph
#
# These requirements decompose the CanvasNetMermaid system's git graph responsibility into the GitGraph subsystem
# (internal namespace DemaConsulting.CanvasNet.Mermaid.GitGraph): reading the git graph language exactly as the pinned
# Mermaid release reads it and running its statements as Mermaid's git graph database runs them (GitGraphParser), and
# drawing the branches, arrows, commits, labels, tags, and title as Mermaid's git graph renderer draws them
# (GitGraphRenderer). Each requirement here links down to the unit requirements that implement it. See
# docs/verification/canvas-net-mermaid/git-graph.md for the test-evidence mapping.

sections:
  - title: CanvasNetMermaid Requirements
    sections:
      - title: GitGraph Requirements
        requirements:
          - id: CanvasNetMermaid-GitGraph-Language
            title: >-
              The GitGraph subsystem shall open every git graph text (the gitGraph keyword) that the gitGraph grammar
              of the pinned Mermaid release accepts - the header with or without the LR, TB, or BT direction, the
              commit, branch (with its order), merge, checkout and switch, and cherry-pick statements with their
              options, the title, the accessible title and description, blank lines, comments, and directives - into
              the same commits, branches, and branch order that Mermaid's git graph database records for it, the
              generated commit ids included.
            justification: |
              A git graph can only be drawn the way Mermaid draws it when its text means exactly what it means to
              Mermaid; the language is defined by Mermaid's grammar, value converters, and database, not by a
              description of them.
            children:
              - CanvasNetMermaid-GitGraph-GitGraphParser-Tokens
              - CanvasNetMermaid-GitGraph-GitGraphParser-Grammar
              - CanvasNetMermaid-GitGraph-GitGraphParser-Values
              - CanvasNetMermaid-GitGraph-GitGraphParser-Database
              - CanvasNetMermaid-GitGraph-GitGraphParser-GeneratedIds
            tests:
              - CanvasNetMermaid_GitGraph_Fixture_ParsesAndLaysOutConsistently
              - CanvasNetMermaid_GitGraph_Text_GivesTheDiagramAndTheScene

          - id: CanvasNetMermaid-GitGraph-Metadata
            title: >-
              The GitGraph subsystem shall give the commits (as nodes), the links of the commits to their parents (as
              edges), no subgraphs, the direction, the title (a title statement with a value replacing the frontmatter
              title), and the accessible title of an opened git graph, without rendering it.
            justification: |
              Hosts list and check diagrams before they draw them; the facts must come from the parsed text alone and
              keep the meaning of the document's node, edge, and subgraph counts.
            children:
              - CanvasNetMermaid-GitGraph-GitGraphParser-Metadata
            tests:
              - CanvasNetMermaid_GitGraph_Text_GivesTheDiagramAndTheScene

          - id: CanvasNetMermaid-GitGraph-FailClosed
            title: >-
              The GitGraph subsystem shall refuse, when the document is opened, a git graph text that its grammar or
              its lexer does not accept, with the tokens that Mermaid lists as expected, an operation that Mermaid's
              git graph database rejects, with Mermaid's message, and a text that exceeds the node or label length
              limits of the open call, each with a coded MermaidSyntaxException located in the original text and with
              a hint; the main branch, each branch, and each commit count as a node.
            justification: |
              Invalid or oversized untrusted text must never produce a partial diagram or unbounded work; the author
              needs the place of the problem in the file as written and a way to fix it.
            children:
              - CanvasNetMermaid-GitGraph-GitGraphParser-Errors
              - CanvasNetMermaid-GitGraph-GitGraphParser-Database
              - CanvasNetMermaid-GitGraph-GitGraphParser-Limits
            tests:
              - CanvasNetMermaid_GitGraph_InvalidText_FailsClosedWithLocation

          - id: CanvasNetMermaid-GitGraph-Configuration
            title: >-
              The GitGraph subsystem shall draw a git graph with the gitGraph settings of the render's configuration -
              showBranches, showCommitLabel, rotateCommitLabel, parallelCommits, titleTopMargin, and diagramPadding -
              and shall run the statements again when the render's configuration names another main branch or main
              branch order than the text's own configuration, a rejection of that run failing the render, located,
              with mermaid-render-failed.
            justification: |
              The settings of a render decide what a git graph shows and where; a site configuration that names
              another main branch changes what the statements mean, and Mermaid runs them again in that case.
            children:
              - CanvasNetMermaid-GitGraph-GitGraphParser-RenderDatabase
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Positions
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-RenderConfiguration
            tests:
              - CanvasNetMermaid_GitGraph_Configuration_ChangesTheDrawing

          - id: CanvasNetMermaid-GitGraph-Drawing
            title: >-
              The GitGraph subsystem shall draw a git graph as Mermaid's git graph renderer draws it under the
              effective configuration and theme of the render - the branch lines and labels, the commit bullets of
              each commit type, the arrows with their rerouting lanes, the commit labels, rotated when the
              configuration rotates them, the tags, the title, and the view box of the browser's bounding box of the
              drawing - with the paint of the git graph style sheet, and shall charge the work of the drawing to the
              layout work limit.
            justification: |
              The pixels and the size of a git graph must be Mermaid's for the same text, configuration, and theme,
              and the work of a render must be bounded.
            children:
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Positions
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Arrows
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Labels
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Title
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-ViewBox
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Paint
              - CanvasNetMermaid-GitGraph-GitGraphRenderer-Cost
            tests:
              - CanvasNetMermaid_GitGraph_Fixture_ParsesAndLaysOutConsistently
              - CanvasNetMermaid_GitGraph_Text_GivesTheDiagramAndTheScene
              - CanvasNetMermaid_GitGraph_Themes_PaintTheCommitsAndBranches
