---
# Software Unit Requirements for PptxDocument
#
# cspell:ignore ooxml pptx srgb xfrm prst cust patt bodyPr normAutofit noAutofit spAutoFit pPr
# cspell:ignore rPr txBody txStyles lstStyle defRPr ctrTitle lIns tIns rIns bIns algn marL lnSpc
# cspell:ignore spcBef spcAft justLow lnSpcReduction fontScale lvl ordinally mistargeted
#
# These requirements describe the design-level behavior of the PptxDocument unit.
#
# Packaging note: PptxDocument is distributed as the separate DemaConsulting.CanvasNet.Pptx NuGet
# package (namespace DemaConsulting.CanvasNet.Pptx), which references the core
# DemaConsulting.CanvasNet package. PptxDocument is the sole unit of the CanvasNetPptx system.

sections:
  - title: CanvasNetPptx Requirements
    sections:
      - title: PptxDocument Requirements
        requirements:
          - id: CanvasNetPptx-PptxDocument-OpenStream
            title: >-
              The PptxDocument class shall expose a static Open(Stream) method that buffers the
              entire supplied stream into memory (without disposing or requiring it to remain
              seekable afterward), constructs the OOXML package layer from the buffered bytes,
              rejects a null stream with ArgumentNullException, and bounds the number of bytes
              read from the supplied stream to a fixed maximum package size (256 MiB), rejecting a
              stream exceeding that bound with InvalidDataException rather than buffering it in
              full.
            justification: |
              Callers need to open a package from any stream source (file, network, in-memory)
              without CanvasNetPptx retaining a dependency on the caller's stream lifetime. A
              caller-supplied stream is not necessarily trusted or even finite (for example a
              network stream under adversarial control, or a non-terminating stream), so buffering
              it in full with no upper bound would let a single Open(Stream) call exhaust available
              memory or block indefinitely; a fixed, documented size bound fails the call closed
              with a clear exception instead.
            tests:
              - PptxDocument_Open_WellFormedMinimalPackage_Succeeds
              - PptxDocument_Open_NullStream_ThrowsArgumentNullException
              - PptxDocument_Open_NonTerminatingOversizedStream_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-OpenPath
            title: >-
              The PptxDocument class shall expose a static Open(string) method that validates the
              path is neither null nor empty/whitespace-only (throwing ArgumentNullException or
              ArgumentException respectively), then opens and delegates to Open(Stream).
            justification: |
              Callers most commonly have a file path rather than an already-open stream, and must
              receive argument-validation errors distinguishable from a missing-file error.
            tests:
              - PptxDocument_Open_NullPath_ThrowsArgumentNullException
              - PptxDocument_Open_WhitespacePath_ThrowsArgumentException

          - id: CanvasNetPptx-PptxDocument-ZipValidation
            title: >-
              The PptxDocument class shall open the buffered bytes as a read-only ZipArchive and
              reject an unreadable or corrupt (non-ZIP) stream with InvalidDataException.
            justification: |
              A .pptx file is fundamentally a ZIP archive; a corrupt or non-ZIP input must fail
              closed with a clear, documented exception type rather than an unrelated BCL
              exception leaking through.
            tests:
              - PptxDocument_Open_CorruptNonZipStream_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-ContentTypesValidation
            title: >-
              The PptxDocument class shall require the package to contain a well-formed
              [Content_Types].xml part whose root is a Types element in the OPC content-types
              namespace, parsing its Default (extension-to-content-type) and Override
              (part-specific) entries - each of which must declare its required attribute(s)
              (Extension/ContentType for Default, PartName/ContentType for Override) - and reject
              a package missing this part, an oversized part exceeding a bounded character budget,
              a part with a malformed root element, or a Default/Override element with a missing
              required attribute, all with InvalidDataException.
            justification: |
              Every valid OPC package must declare [Content_Types].xml; its absence means the
              package is fundamentally malformed and must be rejected before any later phase
              attempts to interpret any part's content. A malformed root or incomplete
              Default/Override element must fail closed (per Open()'s documented contract) rather
              than silently being skipped, and an attacker-controlled, unbounded XML part (an "XML
              bomb") must not be allowed to exhaust memory while parsing.
            tests:
              - PptxDocument_Open_MissingContentTypes_ThrowsInvalidDataException
              - PptxDocument_Open_OversizedContentTypesPart_ThrowsInvalidDataException
              - PptxDocument_Open_ContentTypesWrongRoot_ThrowsInvalidDataException
              - PptxDocument_Open_ContentTypesDefaultMissingRequiredAttribute_ThrowsInvalidDataException
              - PptxDocument_Open_ContentTypesOverrideMissingRequiredAttribute_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-PackageRelationshipsValidation
            title: >-
              The PptxDocument class shall require the package to contain a well-formed
              package-level _rels/.rels relationships part whose root is a Relationships element
              in the OPC relationships namespace, parsing it eagerly at Open() time, and reject a
              package missing this part, a part with a malformed root element, or a Relationship
              element missing a required attribute (Id, Type, or Target), all with
              InvalidDataException.
            justification: |
              The package-level relationships part is the sole entry point for discovering the
              presentation's root part in later phases; its absence means the package cannot be
              navigated at all. A malformed root or an incomplete Relationship element must fail
              closed rather than silently being skipped, which would otherwise let a malformed
              package appear navigable when it is not.
            tests:
              - PptxDocument_Open_MissingPackageRelationships_ThrowsInvalidDataException
              - PptxDocument_Open_PackageRelsWrongRoot_ThrowsInvalidDataException
              - PptxDocument_Open_RelationshipMissingRequiredAttribute_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-CaseSensitivePartNames
            title: >-
              The PptxDocument class shall compare OPC part names ordinally (case-sensitively),
              treating two part names differing only by case as distinct parts, rejecting an
              incorrectly-cased reserved part name (for example "[content_types].xml") as if the
              reserved part were absent, and rejecting a package containing two ZIP entries with
              exactly identical names, all with InvalidDataException where applicable.
            justification: |
              OPC (ECMA-376 Part 2) defines part-name comparison as ordinal; treating part names
              case-insensitively would incorrectly merge two legitimately distinct parts (for
              example "ppt/slides/Slide1.xml" and "ppt/slides/slide1.xml") or incorrectly accept
              a malformed reserved-name part that must instead be rejected as absent.
            tests:
              - PptxDocument_ResolvePart_PartNamesDifferingOnlyByCase_ResolveAsDistinctParts
              - PptxDocument_Open_WrongCaseContentTypesPartName_ThrowsInvalidDataException
              - PptxDocument_Open_DuplicateEntryNames_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-ContentTypeOverride
            title: >-
              The PptxDocument class shall resolve a part's content type using its
              [Content_Types].xml Override entry (keyed by exact part path) when one is declared
              for that part, in preference to any Default extension-based mapping.
            justification: |
              OPC's own content-type resolution rules require an Override to take precedence over
              a Default mapping for the same part; getting this precedence wrong would
              misidentify a part's real content type.
            tests:
              - PptxDocument_ResolvePart_OverrideContentType_TakesPrecedenceOverDefaultExtension

          - id: CanvasNetPptx-PptxDocument-ContentTypeDefault
            title: >-
              The PptxDocument class shall resolve a part with no Override entry via
              [Content_Types].xml's Default extension-based mapping, and reject a request to
              resolve a part the package does not contain, or whose content type cannot be
              resolved by either mapping, with InvalidDataException.
            justification: |
              Most parts in a real .pptx package (nearly every slide, layout, and master) rely
              solely on the Default extension mapping rather than an individual Override entry.
            tests:
              - PptxDocument_ResolvePart_NoOverride_ResolvesDefaultExtensionContentType
              - PptxDocument_ResolvePart_UnknownPart_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-RelationshipResolution
            title: >-
              The PptxDocument class shall resolve a named relationship ID from a given source
              part's own relationships part (or, for the empty source part path, the package-level
              _rels/.rels), reject an unknown relationship ID, and reject a relationship whose
              TargetMode is External, all with InvalidDataException.
            justification: |
              Relationship resolution is the sole navigation mechanism for discovering a package's
              part graph; an unknown ID or an unsupported external target must fail closed rather
              than silently returning an incorrect or unusable path.
            tests:
              - PptxDocument_Open_WellFormedMinimalPackage_Succeeds
              - PptxDocument_ResolveRelationship_UnknownRelationshipId_ThrowsInvalidDataException
              - PptxDocument_ResolveRelationship_ExternalTargetMode_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-RelativeTargetTraversal
            title: >-
              The PptxDocument class shall resolve a relationship's relative Target value relative
              to the source part's own directory (not the package root), correctly applying a
              leading "../" parent-directory traversal segment, and reject a target that would
              traverse past the package root with InvalidDataException.
            justification: |
              Real-world .pptx packages universally reference sibling parts (for example a slide
              referencing its layout) using a relative, parent-traversing Target value; incorrect
              resolution would misidentify the target part entirely.
            tests:
              - PptxDocument_ResolveRelationship_RelativeTargetWithParentTraversal_ResolvesCorrectTarget
              - PptxDocument_ResolveRelationship_TargetEscapesPackageRoot_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-Dispose
            title: >-
              The PptxDocument class shall make Dispose idempotent (safe to call more than once),
              releasing the underlying ZipArchive and its backing buffer.
            justification: |
              Standard, predictable IDisposable behavior matches every other disposable type in
              CanvasNet, so double-disposing (a common pattern with using declarations and manual
              disposal both present) never throws.
            tests:
              - PptxDocument_Dispose_CalledTwice_DoesNotThrow

          - id: CanvasNetPptx-PptxDocument-PresentationParsing
            title: >-
              The PptxDocument class shall, at Open() time, locate ppt/presentation.xml via the
              package root's /officeDocument relationship, parse its declared slide size into a
              public SlideSize property, resolve its ordered slide list into a public SlideCount
              property, and expose a GetSlideSizeInPixels(float dpi) conversion method, all guarded
              by ObjectDisposedException once the document is disposed.
            justification: |
              Callers need the presentation's overall slide size and slide count without
              navigating the package's relationship graph themselves, and need a pixel-resolution
              conversion ahead of any later rendering phase reusing the same arithmetic.
            tests:
              - PptxDocument_Open_MultiSlidePresentation_SlideCountAndSlideSizeResolveCorrectly
              - PptxDocument_GetSlideSizeInPixels_ValidDpi_ComputesExpectedPixelSize
              - PptxDocument_GetSlideSizeInPixels_NonPositiveDpi_ThrowsArgumentOutOfRangeException
              - CanvasNetPptx_SystemIntegration_PptxOpenPresentation_SlideCountAndSizeResolveEndToEnd

          - id: CanvasNetPptx-PptxDocument-PresentationValidation
            title: >-
              The PptxDocument class shall reject, with InvalidDataException, a package with no
              /officeDocument relationship, a presentation part whose root is not a PresentationML
              <p:presentation> element, a presentation missing a valid <p:sldSz> (including a
              missing, non-numeric, or non-positive cx/cy attribute, or a cx/cy that would
              overflow int once converted to pixels), a presentation whose <p:sldIdLst> is missing
              or declares zero slides, and a <p:sldId> whose resolved relationship Type does not
              identify a slide part.
            justification: |
              A malformed or non-presentation package must fail closed at Open() time rather than
              later surfacing as a confusing null-reference or structural failure when a caller
              first reads SlideCount/SlideSize, calls GetSlideSizeInPixels, or navigates to a
              mistargeted "slide" that is actually a theme or other arbitrary part.
            tests:
              - PptxDocument_Open_MissingOfficeDocumentRelationship_ThrowsInvalidDataException
              - PptxDocument_Open_PresentationMissingSldSz_ThrowsInvalidDataException
              - PptxDocument_Open_PresentationEmptySlideList_ThrowsInvalidDataException
              - PptxDocument_Open_PresentationNonNumericSldSz_ThrowsInvalidDataException
              - PptxDocument_Open_SlideIdRelationshipWrongType_ThrowsInvalidDataException
              - PptxDocument_GetSlideSizeInPixels_OversizedDimension_ThrowsInvalidDataException
              - CanvasNetPptx_SystemIntegration_PptxOpenValidationEmptySlideList_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-SlideSizePixelConversion
            title: >-
              The PptxDocument class shall convert its EMU-unit SlideSize to a pixel size at a
              caller-supplied DPI via GetSlideSizeInPixels(float dpi), rounding each dimension to
              the nearest pixel, and reject a non-positive or non-finite dpi with
              ArgumentOutOfRangeException.
            justification: |
              A later rendering phase needs a pixel-dimensioned Canvas.Surface to paint onto;
              providing this conversion now, already tested, avoids re-deriving the EMU-to-pixel
              arithmetic when that phase arrives.
            tests:
              - PptxDocument_GetSlideSizeInPixels_ValidDpi_ComputesExpectedPixelSize
              - PptxDocument_GetSlideSizeInPixels_NonPositiveDpi_ThrowsArgumentOutOfRangeException

          - id: CanvasNetPptx-PptxDocument-ThemeColorScheme
            title: >-
              The PptxDocument class shall resolve a theme part's 12-slot color scheme
              (<a:clrScheme>) into concrete Rgba32 values, resolving an <a:srgbClr val="RRGGBB"/>
              directly and an <a:sysClr val="..." lastClr="RRGGBB"/> via its cached lastClr value,
              and reject a color value that is not exactly six hexadecimal digits (for example an
              eight-digit AARRGGBB value) with InvalidDataException.
            justification: |
              A placeholder's effective properties may reference a theme color by scheme slot
              rather than an explicit RGB value; resolving the scheme up front lets a later
              rendering phase look up a concrete color without re-parsing the theme XML. OOXML's
              own color-value attributes are always exactly six hex digits; an eight-digit value
              must be rejected rather than silently misread with its first byte as alpha.
            tests:
              - PptxDocument_GetTheme_SrgbClrColorScheme_ResolvesRgba32Values
              - PptxDocument_GetTheme_SysClrColorScheme_ResolvesLastClrValue
              - PptxDocument_GetTheme_SrgbClrEightDigitValue_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-ThemeFontScheme
            title: >-
              The PptxDocument class shall resolve a theme part's font scheme (<a:fontScheme>)
              into major (heading) and minor (body) typeface collections, each naming the Latin,
              East Asian, and complex-script typeface.
            justification: |
              A placeholder's effective text properties may reference a theme's major/minor font
              rather than an explicit typeface name; resolving the font scheme up front supports
              that lookup without re-parsing the theme XML in a later phase.
            tests:
              - PptxDocument_GetTheme_FontScheme_ResolvesMajorMinorTypefaces

          - id: CanvasNetPptx-PptxDocument-MasterPlaceholderParsing
            title: >-
              The PptxDocument class shall structurally parse a slide master's immediate
              placeholder shapes (type and idx, defaulting to "obj"/0 when omitted) and resolve
              its theme part via the master's own /theme relationship.
            justification: |
              A slide layout's placeholders may inherit effective properties from the owning
              master's placeholders of a matching type, and a master's theme supplies the
              scheme-level color/font context for the whole master/layout/slide chain beneath it.
            tests:
              - PptxDocument_GetMaster_PlaceholderShapes_ParsedWithTypeAndIdx

          - id: CanvasNetPptx-PptxDocument-LayoutPlaceholderParsing
            title: >-
              The PptxDocument class shall structurally parse a slide layout's immediate
              placeholder shapes (type and idx, defaulting to "obj"/0 when omitted) and resolve
              its owning master's part path via the layout's own /slideMaster relationship.
            justification: |
              A slide's placeholders are matched against the owning layout's placeholders by idx;
              the layout's own master part path is needed to continue the inheritance chain to
              the master level when a layout-level match is found.
            tests:
              - PptxDocument_GetLayout_PlaceholderShapes_ParsedWithDefaultTypeAndIdx

          - id: CanvasNetPptx-PptxDocument-SlidePlaceholderParsing
            title: >-
              The PptxDocument class shall expose GetSlide(int slideIndex), range-checked against
              SlideCount with ArgumentOutOfRangeException, structurally parsing the slide's
              immediate placeholder shapes (excluding non-placeholder shapes) and resolving its
              owning layout's part path via the slide's own /slideLayout relationship.
            justification: |
              A caller (or a later rendering phase) needs to enumerate a specific slide's
              placeholder shapes and locate its layout to begin the property-inheritance
              resolution chain.
            tests:
              - PptxDocument_GetSlide_ImmediatePlaceholderShapes_ParsedStructurally
              - PptxDocument_GetSlide_IndexOutOfRange_ThrowsArgumentOutOfRangeException

          - id: CanvasNetPptx-PptxDocument-PlaceholderInheritanceIdxMatch
            title: >-
              The PptxDocument class shall resolve a slide placeholder's matching layout
              placeholder by idx alone (type is not consulted at this hop), with a miss (no layout
              placeholder shares the slide placeholder's idx) short-circuiting the remainder of
              the inheritance chain rather than being retried by type.
            justification: |
              This is the verified ECMA-376 §19.3.1.36 slide-to-layout placeholder matching rule
              (confirmed against the python-pptx reference implementation), distinct from a
              naive "type+idx exact match" framing.
            tests:
              - PptxDocumentInheritance_ResolvePlaceholderProperties_IdxMatchAtLayout_UsesLayoutSpPr
              - PptxDocumentInheritance_ResolvePlaceholderProperties_NoIdxMatchAtLayout_FallsThroughToMasterOnly

          - id: CanvasNetPptx-PptxDocument-PlaceholderInheritanceTypeMatch
            title: >-
              The PptxDocument class shall, only when a layout-level idx match was found, resolve
              that matched layout placeholder's matching master placeholder by type alone (idx is
              not consulted at this hop), remapping the layout placeholder's type through a fixed
              table (body/chart/bitmap/orgChart/mediaClip/obj/pic/subTitle/tbl/clipArt/dgm/media to
              "body"; ctrTitle to "title"; every other type maps to itself) before matching.
            justification: |
              This is the verified ECMA-376 §19.3.1.36 layout-to-master placeholder matching rule;
              getting the remap table or the "only runs after a layout match" short-circuit wrong
              would resolve an incorrect or spurious master-level property fragment.
            tests:
              - PptxDocumentInheritance_ResolvePlaceholderProperties_TypeMatchAtMaster_IgnoresMismatchedIdx
              - PptxDocumentInheritance_ResolvePlaceholderProperties_RemappedBodyLikeType_MatchesMasterBodyPlaceholder

          - id: CanvasNetPptx-PptxDocument-PlaceholderInheritancePerCategory
            title: >-
              The PptxDocument class shall resolve a slide placeholder's effective <p:spPr> and
              <p:txBody>/<a:lstStyle> property fragments independently (slide, then matched
              layout, then matched master, taking the first element present at all - an empty
              element still counts as present), and carry the resolved theme through unchanged as
              context rather than selecting it via the same fallback.
            justification: |
              Each property category's inheritance chain is independent in real PowerPoint
              behavior (a slide may override its fill without overriding its text style, or vice
              versa); merging them into a single fallback decision would resolve incorrect
              effective properties for one or both categories.
            tests:
              - PptxDocumentInheritance_ResolvePlaceholderProperties_PerCategoryIndependentFallthrough_SlideOverridesFillButNotText
              - PptxDocumentInheritance_ResolvePlaceholderProperties_NoMatchAtAnyLevel_ReturnsNullForBothCategories

          - id: CanvasNetPptx-PptxDocument-ShapeFrameTransform
            title: >-
              The PptxDocument class shall resolve a shape's <a:xfrm> element (off/ext position and
              size, an optional rot rotation in 60,000ths of a degree about the shape's own center,
              defaulting to zero when omitted, and optional flipH/flipV mirroring about the shape's
              own center) into a single composed transform placing the shape's local coordinate
              space into its parent's coordinate space, and reject a missing off/ext child element,
              a non-numeric off/ext attribute (x/y/cx/cy), or a non-numeric rot attribute with
              InvalidDataException.
            justification: |
              Every DrawingML shape's geometry is authored in its own local coordinate space; a
              correct, single composed transform is the foundation every later geometry and paint
              resolution in this phase, and any future rendering phase, builds on. A malformed
              (non-numeric) off/ext attribute must fail with the documented InvalidDataException
              contract, not an unrelated raw conversion-failure exception.
            tests:
              - ResolveShapeFrame_PlainOffsetAndSize_MapsLocalOriginToOffset
              - ResolveShapeFrame_MissingOff_ThrowsInvalidDataException
              - ResolveShapeFrame_MissingExt_ThrowsInvalidDataException
              - ResolveShapeFrame_Rotation90Degrees_RotatesAboutOwnCenterClockwise
              - ResolveShapeFrame_MissingRot_DefaultsToZeroRotation
              - ResolveShapeFrame_FlipHorizontal_MirrorsAboutOwnCenterX
              - ResolveShapeFrame_FlipVertical_MirrorsAboutOwnCenterY
              - ResolveShapeFrame_InvalidRotAttribute_ThrowsInvalidDataException
              - ResolveShapeFrame_NonNumericOffAttribute_ThrowsInvalidDataException
              - ResolveShapeFrame_NonNumericExtAttribute_ThrowsInvalidDataException
              - CanvasNetPptx_SystemIntegration_GeometryAndPaint_FreeformShapeResolvesEndToEnd

          - id: CanvasNetPptx-PptxDocument-GroupChildTransform
            title: >-
              The PptxDocument class shall resolve a group shape's (<p:grpSp>) own <a:xfrm> element
              into a child-space-to-group-space transform, scaling and translating a child
              coordinate declared in the group's chOff/chExt child coordinate space into the
              group's own off/ext box, defaulting to an identity child coordinate space when
              chOff/chExt are omitted (but requiring both attributes, failing closed with
              InvalidDataException, whenever chOff/chExt IS present but incomplete), so a child
              shape's own resolved frame transform composes correctly through its owning group's
              transform chain.
            justification: |
              A group shape's children are authored in a child-specific coordinate space distinct
              from the group's own placement in its parent; composing a child's transform without
              correctly scaling through the group's chOff/chExt would misplace every shape nested
              in a group. A present-but-incomplete chOff/chExt is malformed input, not an "absent
              element" the schema-default fallback is meant to cover, and must fail closed rather
              than silently substituting a default.
            tests:
              - ResolveGroupChildTransform_IdentityChildSpace_MatchesGroupFrameDirectly
              - ResolveGroupChildTransform_ScaledChildSpace_ScalesChildCoordinatesIntoGroupBox
              - ResolveGroupChildTransform_OffsetChildSpace_TranslatesChildOriginBeforeScaling
              - ResolveGroupChildTransform_ChildOfChild_ComposesThroughBothTransforms
              - ResolveGroupChildTransform_MissingChOffChExt_DefaultsToIdentityChildSpace
              - ResolveGroupChildTransform_ChOffPresentWithMissingAttribute_ThrowsInvalidDataException
              - ResolveGroupChildTransform_ChExtPresentWithMissingAttribute_ThrowsInvalidDataException
              - CanvasNetPptx_SystemIntegration_GeometryAndPaint_GroupShapeChildTransformComposesEndToEnd

          - id: CanvasNetPptx-PptxDocument-PresetGeometry
            title: >-
              The PptxDocument class shall resolve a shape's <a:prstGeom prst="..."> element into a
              concrete geometric path sized to the shape's own width/height, supporting a fixed set
              of approximately 24 common preset geometry names (including rect, roundRect, ellipse,
              triangle, and a practical subset of arrows, stars, and other basic shapes), and shall
              reject a preset name outside this supported set with PptxUnsupportedFeatureException
              (feature token "pptx-preset-geometry") rather than producing incorrect geometry, and
              reject a missing geometry element (neither <a:prstGeom> nor <a:custGeom>) or a
              <a:prstGeom> missing its prst attribute with InvalidDataException.
            justification: |
              DrawingML's preset geometry vocabulary is large; implementing every preset is out of
              scope for this phase, but silently rendering an unsupported preset as the wrong shape
              would be worse than a clear, distinguishable failure a caller can catch and handle.
            tests:
              - ResolveShapeGeometry_PrstGeomRect_ReturnsRectanglePath
              - ResolveShapeGeometry_NeitherPrstGeomNorCustGeom_ThrowsInvalidDataException
              - ResolveShapeGeometry_UnsupportedPreset_ThrowsPptxUnsupportedFeatureException
              - ResolveShapeGeometry_PrstGeomMissingPrstAttribute_ThrowsInvalidDataException
              - PptxPresetGeometry_Build_EachSupportedPreset_ProducesPathWithinDeclaredBounds
              - PptxPresetGeometry_Build_UpArrow_PointsUpward
              - PptxPresetGeometry_Build_DownArrow_PointsDownward
              - PptxPresetGeometry_Build_UnsupportedPreset_ThrowsWithFeatureToken
              - PptxPresetGeometry_Build_NonPositiveSize_ReturnsEmptyPath

          - id: CanvasNetPptx-PptxDocument-CustomGeometry
            title: >-
              The PptxDocument class shall resolve a shape's <a:custGeom> element by parsing every
              <a:path> under its <a:pathLst>, interpreting moveTo/lnTo/cubicBezTo/quadBezTo/close
              commands into the equivalent core Path commands, scaling each path's own w/h
              coordinate space (defaulting to the shape's own extent when omitted) to the shape's
              declared extent, and resolving a <a:custGeom> with no <a:pathLst> to an empty path.
            justification: |
              Many real-world DrawingML shapes (especially those hand-drawn or imported from other
              authoring tools) use an explicit custom geometry rather than a named preset; without
              this parser, such shapes could not be resolved to any geometry at all.
            tests:
              - ResolveCustomGeometry_MoveLineClose_ProducesClosedTriangle
              - ResolveCustomGeometry_CubicBezTo_ProducesCubicBezierCommand
              - ResolveCustomGeometry_QuadBezTo_ProducesQuadraticBezierCommand
              - ResolveCustomGeometry_PathCoordinateSpaceScaledToShapeExtent
              - ResolveCustomGeometry_NoPathLst_ReturnsEmptyPath

          - id: CanvasNetPptx-PptxDocument-FillResolution
            title: >-
              The PptxDocument class shall resolve a shape's fill from its <p:spPr> into a closed
              PptxPaint value: an explicit <a:noFill>, no recognized fill child element, or a null
              <p:spPr> all resolve to PptxNoFill; <a:solidFill> resolves to a PptxSolidFill via
              color resolution; <a:gradFill> resolves to a PptxGradientFill; and <a:pattFill>/
              <a:blipFill> are rejected with PptxUnsupportedFeatureException (feature tokens
              "pptx-pattern-fill"/"pptx-picture-fill" respectively) rather than being silently
              misinterpreted as unfilled or solid-filled.
            justification: |
              Pattern and picture fills require image-decoding and tiling machinery out of scope
              for this phase; rejecting them explicitly, rather than silently falling back to
              PptxNoFill, lets a caller distinguish "genuinely unfilled" from "fill kind not yet
              supported".
            tests:
              - ResolveFill_NullParent_ReturnsNoFill
              - ResolveFill_ExplicitNoFill_ReturnsNoFill
              - ResolveFill_NoRecognizedFillChild_ReturnsNoFill
              - ResolveFill_SolidFillSrgbClr_ReturnsResolvedSolidFill
              - ResolveFill_SolidFillSchemeClr_ResolvesThroughTheme
              - ResolveFill_GradFillLinear_ReturnsResolvedGradientFill
              - ResolveFill_PatternFill_ThrowsPptxUnsupportedFeatureException
              - ResolveFill_PictureFill_ThrowsPptxUnsupportedFeatureException

          - id: CanvasNetPptx-PptxDocument-ColorResolution
            title: >-
              The PptxDocument class shall resolve a DrawingML color-definition element to a
              concrete Rgba32 value: <a:srgbClr val="RRGGBB"/> directly, <a:sysClr .../> via its
              lastClr attribute, and <a:schemeClr val="..."/> by looking the named slot up in the
              supplied PptxTheme's color scheme (reusing the existing PptxTheme/PptxColorScheme
              resolver rather than re-resolving the theme), including the bg1/tx1/bg2/tx2
              background/text aliases mapped to their corresponding dk/lt scheme slots; an
              unrecognized schemeClr slot name throws InvalidDataException, any other,
              unsupported color-definition element kind throws PptxUnsupportedFeatureException
              (feature token "pptx-color-kind"), and an srgbClr/sysClr hex value whose length
              (after stripping an optional leading '#') is not exactly six hex digits - for
              example an 8-digit  # AARRGGBB-style value - throws InvalidDataException rather than
              being passed to the underlying hex parser.
            justification: |
              Scheme color resolution must build directly on Phase 1b's already-verified
              PptxTheme/PptxColorScheme resolver rather than duplicating its 12-slot lookup table,
              so both phases stay in sync automatically if that table ever changes. OOXML's
              srgbClr/sysClr val attribute is specified as exactly six RGB hex digits; the
              underlying Rgba32 hex parser also accepts an 8-digit  # AARRGGBB form and would
              silently treat the first byte as alpha for a malformed 8-digit value, so the
              six-digit form must be enforced before parsing to fail closed rather than silently
              produce a wrong, unintended-alpha color.
            tests:
              - ResolveColor_SrgbClr_ParsesHexDirectly
              - ResolveColor_SysClr_UsesLastClrAttribute
              - ResolveColor_SchemeClrOrdinarySlots_ResolveToMatchingThemeSlot
              - ResolveColor_SchemeClrBackgroundTextAliases_MapToExpectedSlot
              - ResolveColor_SchemeClrUnrecognizedSlot_ThrowsInvalidDataException
              - ResolveColor_UnsupportedColorKind_ThrowsPptxUnsupportedFeatureException
              - ResolveColor_SrgbClrEightDigitValue_ThrowsInvalidDataException
              - ResolveColor_SysClrEightDigitLastClrValue_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-ColorTransforms
            title: >-
              The PptxDocument class shall apply a DrawingML color-definition element's
              lumMod/lumOff/shade/tint/alpha child transforms to its resolved base color in a
              fixed pipeline order - lumMod and lumOff applied together first in HSL luminance
              space, then shade and tint in RGB space, then alpha replacing the alpha channel
              outright - interpreting each val attribute as OOXML's thousandths-of-a-percent unit
              (100000 = 100%).
            justification: |
              Real-world themes and shapes very commonly apply one or more of these transforms
              (for example a "lighter" or "darker" accent-color shade) rather than referencing a
              raw color directly; without this pipeline, such shapes would resolve to the wrong,
              untransformed color.
            tests:
              - ResolveColor_Alpha_SetsAlphaChannel
              - ResolveColor_Shade_DarkensProportionally
              - ResolveColor_Tint_LightensProportionally
              - ResolveColor_LumMod_DecreasesLuminance
              - ResolveColor_LumOff_IncreasesLuminance
              - ResolveColor_CombinedLumModLumOffShadeTintAlpha_AppliesFixedPipelineOrder

          - id: CanvasNetPptx-PptxDocument-GradientFill
            title: >-
              The PptxDocument class shall resolve a <a:gradFill> element's <a:gsLst> gradient
              stops and its <a:lin> linear-direction angle (in 60,000ths of a degree) into a core
              LinearGradient spanning the shape's own width/height, and shall reject a <a:gradFill>
              with no <a:lin> child (for example a path/radial gradient) with
              PptxUnsupportedFeatureException (feature token "pptx-gradient-path"), a <a:gradFill>
              with no <a:gsLst> with InvalidDataException, and a <a:gs> element with a non-numeric
              pos attribute with InvalidDataException.
            justification: |
              Linear gradients are the most common DrawingML gradient fill in practice; radial and
              path gradients require a different, not-yet-implemented core gradient paint type, so
              rejecting them explicitly avoids silently rendering them as an incorrect linear
              approximation. A malformed (non-numeric) gradient-stop position must fail with the
              documented InvalidDataException contract, not an unrelated raw conversion-failure
              exception.
            tests:
              - ResolveGradientFill_LinearZeroDegrees_PointsAlongPositiveX
              - ResolveGradientFill_MissingLin_ThrowsPptxUnsupportedFeatureException
              - ResolveGradientFill_MissingGsLst_ThrowsInvalidDataException
              - ResolveGradientFill_NonNumericGsPos_ThrowsInvalidDataException

          - id: CanvasNetPptx-PptxDocument-LineStyleResolution
            title: >-
              The PptxDocument class shall resolve a shape's <a:ln> stroke element into a
              PptxLineStyle (width in EMU, resolved fill, and an optional dash array derived from
              <a:prstDash val="..."/>), resolving to no stroke (null) when <a:ln> is null, its w
              attribute is missing or non-positive, or its resolved fill is PptxNoFill, and shall
              realize a resolved PptxLineStyle against a shape's path into a stroked outline path
              via the core PathStroker, mirroring the PDF renderer's own StrokeStyle/PathStroker
              call pattern.
            justification: |
              A shape's visible outline is produced by stroking its geometric path with the
              resolved line style, not merely resolving the line style's data in isolation; reusing
              the already-tested core PathStroker exactly as the PDF renderer already does avoids
              a second, divergent stroking implementation for this package.
            tests:
              - ResolveLineStyle_NullElement_ReturnsNull
              - ResolveLineStyle_ZeroWidth_ReturnsNull
              - ResolveLineStyle_NoFillLine_ReturnsNull
              - ResolveLineStyle_WidthAndSolidFill_ResolvesWidthAndColor
              - ResolveLineStyle_DashPresets_ProduceNonNullDashArray
              - ResolveLineStyle_SolidPreset_ProducesNullDashArray
              - ResolveStrokeOutline_RectangleWithSolidLine_ProducesNonEmptyOutline
              - CanvasNetPptx_SystemIntegration_GeometryAndPaint_FreeformShapeResolvesEndToEnd

          - id: CanvasNetPptx-PptxDocument-TextBodyParsing
            title: >-
              The PptxDocument class shall parse a shape's <p:txBody> element into an ordered list
              of paragraphs, each with its own raw, unresolved paragraph properties and ordered
              runs, and shall parse its <a:bodyPr> element into resolved vertical anchor (t/ctr/b,
              defaulting to t), word-wrap mode (square/none, defaulting to square), four insets
              (lIns/tIns/rIns/bIns, defaulting to 91440/45720/91440/45720 EMU when absent), and the
              raw autofit child element (noAutofit/normAutofit/spAutoFit), retained unparsed for
              the layout engine to interpret; an empty <a:p> with no recognized child is a valid,
              empty paragraph (a blank line), not an error.
            justification: |
              Text layout and rendering cannot begin without first structurally parsing the
              DrawingML text-body element tree into a form later phases of this feature (property
              inheritance, word-wrap, rendering) can consume without re-parsing raw XML.
            tests:
              - ParseBodyProperties_Absent_ResolvesSchemaDefaults
              - ParseBodyProperties_AnchorCtr_ResolvesMiddle
              - ParseBodyProperties_AnchorB_ResolvesBottom
              - ParseBodyProperties_AnchorT_ResolvesTop
              - ParseBodyProperties_WrapNone_ResolvesWrapNone
              - ParseBodyProperties_CustomInsets_ResolvesDeclaredValues
              - ParseBodyProperties_AutofitElement_IsRetainedUnparsed
              - ParseTextBody_NoParagraphs_ResolvesEmptyParagraphList
              - ParseTextBody_SingleParagraphSingleRun_ParsesBodyAndParagraph
              - ParseParagraph_NoChildren_ResolvesEmptyRunList

          - id: CanvasNetPptx-PptxDocument-ParagraphRunParsing
            title: >-
              The PptxDocument class shall parse a paragraph's <a:pPr> element (algn, marL, indent,
              lnSpc, spcBef, spcAft, and defRPr, each retained raw/unresolved) and its lvl attribute
              (clamped to the valid [0,8] level range per the OOXML schema's ten-level style
              vocabulary), defaulting every field/level to its schema default when <a:pPr> or the
              individual attribute is absent, shall parse a run's <a:rPr> element (retained
              raw/unresolved) and its <a:t> text, defaulting text to the empty string when <a:t> is
              absent, and shall parse a paragraph's <a:r> run children and <a:br> explicit
              line-break children into a single ordered item list preserving their original
              document order (rather than selecting only <a:r> children and discarding every
              <a:br>), so a later layout pass can turn each preserved <a:br> into an explicit line
              boundary.
            justification: |
              Resolving effective run/paragraph properties (CanvasNetPptx-PptxDocument-
              TextPropertyInheritance) requires each paragraph's/run's own raw property fragment to
              already be extracted and level-clamped, independent of the inheritance chain itself.
              <a:br/> is DrawingML's explicit line-break element (distinct from word-wrap-induced
              line breaks); discarding it during parsing would make it structurally impossible for
              any later layout stage to honor an author-intended forced line break, so document
              order between runs and breaks must be preserved from the parse stage onward.
            tests:
              - ParseParagraphProperties_Absent_ResolvesLevelZeroAndNullOptionals
              - ParseParagraphProperties_LevelAttribute_ClampsToZeroToEight
              - ParseParagraphProperties_FullyPopulated_ResolvesEveryField
              - ParseRun_NoText_ResolvesEmptyString
              - ParseRun_WithTextAndRPr_ResolvesBoth
              - ParseParagraph_RunBreakRun_PreservesBreakInDocumentOrder

          - id: CanvasNetPptx-PptxDocument-TextPropertyInheritance
            title: >-
              The PptxDocument class shall resolve a run's effective character properties
              (typeface, size, bold, italic, underline, color) and a paragraph's effective
              properties (alignment, left margin, indent, line spacing) attribute-by-attribute
              through the chain run/paragraph defRPr -> placeholder level-indexed lstStyle ->
              master level-indexed txStyles bucket -> theme/hard-coded default, each attribute
              independently taking its own first non-null value rather than falling back at the
              level of the whole run/paragraph, shall normalize algn="just"/"justLow" to "l" (full
              text justification is explicitly out of scope this phase), and shall resolve an
              <a:latin typeface="..."/> value naming one of the six reserved DrawingML theme-font
              tokens (+mj-lt/+mn-lt, +mj-ea/+mn-ea, +mj-cs/+mn-cs) through the supplied PptxTheme's
              FontScheme (major/minor Latin/EastAsian/ComplexScript font) at whichever inheritance
              tier the token is declared, rather than returning the literal token string as the
              resolved family name.
            justification: |
              Real-world DrawingML text commonly overrides a single attribute (for example making
              one word bold) without overriding every other attribute at the same level; an
              element-level (not attribute-level) fallback would incorrectly lose every other
              attribute's own, more specific resolution for that run/paragraph. DrawingML permits
              an <a:latin typeface="..."/> to name a theme-font token instead of a literal family
              name so that body text tracks the theme's own major/minor font choice; returning the
              token string unresolved would make font lookup miss the theme's actual font and fall
              back to a bundled default font even when the theme itself defines the intended one.
            tests:
              - ResolveEffectiveRunProperties_RunOverride_WinsOverEveryOtherTier
              - ResolveEffectiveRunProperties_ParagraphDefRPrOnly_WinsWhenRunDeclaresNothing
              - ResolveEffectiveRunProperties_PlaceholderLevelStyleOnly_WinsWhenRunAndParagraphDeclareNothing
              - ResolveEffectiveRunProperties_NoneDeclared_ResolvesHardCodedDefaults
              - ResolveEffectiveRunProperties_UnderlineAttribute_ResolvesExpectedBoolean
              - ResolveEffectiveRunProperties_RunSolidFillSrgbClr_ResolvesExplicitColor
              - ResolveEffectiveParagraphProperties_NoneDeclared_ResolvesHardCodedDefaults
              - ResolveEffectiveParagraphProperties_Alignment_NormalizesJustificationToLeft
              - ResolveEffectiveParagraphProperties_FixedLineSpacing_ResolvesPointsToEmu
              - ResolveEffectiveParagraphProperties_PlaceholderLevelStyleOnly_WinsWhenParagraphDeclaresNothing
              - ResolveEffectiveRunProperties_ThemeFontToken_ResolvesThroughFontScheme
              - ResolveEffectiveRunProperties_LiteralTypeface_PassesThroughUnchanged

          - id: CanvasNetPptx-PptxDocument-TextStylesInheritance
            title: >-
              The PptxDocument class shall parse a slide master's own <p:txStyles> element (a
              direct, sibling-of-<p:cSld> child of <p:sldMaster>, not nested inside it) into its
              schema-optional titleStyle/bodyStyle/otherStyle buckets, and shall select, for a
              given shape's placeholder type, titleStyle for title/ctrTitle placeholder types,
              otherStyle for a non-placeholder shape, and bodyStyle otherwise, consulting the
              selected bucket's level-indexed entry in the run/paragraph property-inheritance
              chain (CanvasNetPptx-PptxDocument-TextPropertyInheritance) after the placeholder's
              own lstStyle and before the theme/hard-coded default.
            justification: |
              A slide master's own default text styling (distinct from any one placeholder's own
              lstStyle override) is the next fallback tier ECMA-376 defines before the theme/
              hard-coded default; without parsing and consulting it, text with no placeholder-level
              style override would skip straight to an incorrect default.
            tests:
              - GetMaster_TxStylesSiblingOfCSld_ParsesAllThreeStyles
              - ResolveEffectiveRunProperties_MasterTxStylesOnly_WinsWhenEverythingAboveIsAbsent
              - ResolveEffectiveRunProperties_MasterTitleStyle_SelectedForTitlePlaceholderType
              - ResolveEffectiveRunProperties_MasterOtherStyle_SelectedForNonPlaceholderShape
              - ResolveEffectiveParagraphProperties_MasterTxStylesOnly_WinsWhenEverythingAboveIsAbsent
              - CanvasNetPptx_SystemIntegration_TextLayoutAndRender_TitlePlaceholderResolvesMasterTitleStyleEndToEnd
              - CanvasNetPptx_SystemIntegration_TextLayoutAndRender_NonPlaceholderShapeResolvesMasterOtherStyleEndToEnd

          - id: CanvasNetPptx-PptxDocument-TextLayoutWordWrap
            title: >-
              The PptxDocument class shall word-wrap a text body's resolved runs into lines bounded
              by the owning shape's own width (less its horizontal insets), tokenizing each run's
              text into whitespace/non-whitespace tokens (preserving multi-space runs as their own
              token, not collapsing them) and greedily packing tokens onto each line - treating
              only whitespace (and explicit line-break items) as legal wrap points, so consecutive
              non-whitespace tokens spanning two or more adjacent runs (a single word split across
              a formatting-run boundary, with no whitespace between them) are packed as one
              wrap-atomic unit that is never itself broken mid-word - placing a single token or
              word-spanning-runs unit that alone exceeds the available width alone on its own
              (overflowing) line rather than looping indefinitely, shall resolve horizontal
              alignment (left/center/right, using each line's own margin/indent) against the
              available width, shall force a new line at each preserved <a:br> explicit line-break
              item (in addition to word-wrap-induced line breaks), and shall select the
              tallest-run candidate for each line's natural height/baseline by comparing each
              run's font metrics (ascender, descender, line gap) scaled by that run's own font.
              UnitsPerEm and its own resolved SizeEmu, rather than by comparing raw, unscaled
              font-design-unit metrics across runs that may use different fonts and/or sizes.
            justification: |
              Word-wrap is the foundational text-layout behavior every other layout concern
              (vertical anchor, autofit) builds on; an incorrect or infinite-looping wrap algorithm
              would make every other text-layout feature unusable. Wrapping at a non-whitespace
              run boundary would be a visible layout defect indistinguishable from a tokenizer bug:
              since each run is tokenized independently of its neighbors, a single word spelled
              across two formatting runs (for example a bold "Hel" run immediately followed by a
              plain "lo" run spelling "Hello", with no whitespace between them - a routine
              consequence of a PowerPoint author changing formatting mid-word) would otherwise be
              eligible to wrap at that internal run boundary even though no whitespace exists
              there, producing an incorrect line break a real document could trigger at any
              width. <a:br/> is DrawingML's explicit line-break element and must force a line
              boundary distinct from word-wrap's own token-packing decisions, or an
              author-intended forced break would be silently dropped and its following text would
              incorrectly run on into the same line. Raw font-design-unit metrics are not directly
              comparable across runs using different fonts or point sizes (for example a font with
              an unusually tall em-box can report larger raw ascender/descender/line-gap values
              despite rendering at a visually smaller size); comparing unscaled values can
              therefore select the wrong run as "tallest" and produce an incorrect line
              height/baseline for that line.
            tests:
              - ResolveTextLayout_WordWrap_NarrowWidth_WrapsAtTokenBoundary
              - ResolveTextLayout_WordWrap_SingleTokenWiderThanAvailableWidth_PlacedAloneOnOwnLine
              - ResolveTextLayout_WordWrap_WordSplitAcrossRuns_DoesNotWrapAtRunBoundary
              - ResolveTextLayout_AlignCenter_CentersLineWithinAvailableWidth
              - ResolveTextLayout_AlignRight_RightAlignsLineAgainstAvailableWidth
              - ResolveTextLayout_RunBreakRun_ForcesSecondLine
              - ResolveTextLayout_TallestFontComparison_ScalesByUnitsPerEmAndSizeEmu_NotRawFontUnits

          - id: CanvasNetPptx-PptxDocument-TextVerticalAnchor
            title: >-
              The PptxDocument class shall position a text body's word-wrapped lines vertically
              per its resolved anchor (t/ctr/b) and total resolved block height within the owning
              shape's own height (less its vertical insets), with no clipping applied when the
              block overflows the available height (text positioned exactly as computed, even past
              the shape's own box).
            justification: |
              Vertical anchoring is a required, independently observable text-layout behavior
              (PowerPoint commonly anchors title/body placeholders differently); an incorrect
              anchor calculation would visibly misplace every anchored text body.
            tests:
              - ResolveTextLayout_AnchorTop_PositionsFirstBaselineAtAscentFromTop
              - ResolveTextLayout_AnchorMiddle_CentersBlockVerticallyWithinAvailableHeight
              - ResolveTextLayout_AnchorBottom_PositionsBlockAtBottomOfAvailableHeight

          - id: CanvasNetPptx-PptxDocument-TextAutofit
            title: >-
              The PptxDocument class shall apply a text body's resolved autofit policy in three
              tiers: no scaling at all for noAutofit, an absent autofit element, or spAutoFit
              (shape-resize autofit, deliberately not implemented this phase); a normAutofit with
              one or both of its fontScale/lnSpcReduction attributes present, applying each present
              attribute's own stored value verbatim and independently, using that attribute's own
              spec-defined neutral default (fontScale 100%, lnSpcReduction 0%/no reduction) for
              whichever of the two attributes is absent, rather than requiring both attributes to
              be present before applying either; and an attribute-less normAutofit (neither
              attribute present) running a bounded, deterministic 10%-step shrink loop (at most 9
              iterations, floored at 10% scale) that stops at the first scale whose naturally
              laid-out height fits the available height.
            justification: |
              PowerPoint's own "shrink text on overflow" autofit behavior is commonly authored
              without explicit fontScale/lnSpcReduction values (PowerPoint itself computes and
              persists them lazily); a bounded, deterministic shrink loop reproduces the same
              user-visible effect without depending on PowerPoint's own unpublished exact algorithm.
              The two normAutofit attributes are independently optional per the OOXML schema -
              PowerPoint may persist only one of the two (for example only a computed fontScale);
              requiring both before applying either would discard a validly persisted single
              attribute entirely and fall through to the attribute-less shrink loop instead of
              honoring the author's/PowerPoint's own already-computed factor.
            tests:
              - ResolveTextLayout_NoAutofit_AppliesNoScalingEvenWhenOverflowing
              - ResolveTextLayout_SpAutoFit_AppliesNoScaling
              - ResolveTextLayout_NormAutofitWithExplicitAttributes_AppliesStoredFactorsVerbatim
              - ResolveTextLayout_NormAutofitAttributeLess_ShrinkLoopConvergesOnFirstFittingScale
              - ResolveTextLayout_NormAutofitFontScaleOnly_AppliesStoredFontScaleVerbatim
              - ResolveTextLayout_NormAutofitLnSpcReductionOnly_AppliesStoredReductionWithNeutralFontScale

          - id: CanvasNetPptx-PptxDocument-TextRendering
            title: >-
              The PptxDocument class shall paint a resolved text layout's glyphs onto a core
              Surface by composing each glyph's own unit-to-EMU scale (with a negated Y component,
              since TrueType glyph outlines use a y-up font coordinate system while CanvasNet's
              shape-local/surface space is y-down), its resolved baseline origin, and the owning
              shape's own frame transform into a single glyph-to-surface matrix, re-issuing the
              glyph's outline through that matrix and filling it with the glyph's resolved color
              via the core PathFiller (mirroring the PDF renderer's own glyph-painting pattern),
              skipping a glyph whose outline has no subpaths (for example a whitespace glyph)
              entirely rather than painting an empty fill, and shall resolve a DrawingML typeface
              name hint to a concrete TrueTypeFont via the core SystemFontCatalog (always passing
              serif/fixed-pitch false, since DrawingML never signals either classification),
              falling back to a bundled font when no installed font matches.
            justification: |
              Painting resolved glyph ink onto a Surface is this phase's terminal, user-visible
              output; reusing the already-verified core PathFiller/SystemFontCatalog building
              blocks (exactly as the PDF renderer already does) avoids a second, divergent
              glyph-painting/font-resolution implementation for this package. A positive (rather
              than negated) Y scale on the glyph-outline transform would paint every glyph upside
              down and below the baseline instead of right-side-up and above it, since TrueType
              outline coordinates are y-up but this package's shape-local/surface space is y-down
              (see core Path.Rectangle's own doc comments for the authoritative convention); a
              symmetric glyph outline cannot expose this regression class, since flipping it about
              its own center leaves it visually/structurally identical, so an asymmetric synthetic
              glyph outline is required to detect it.
            tests:
              - PaintTextLayout_IdentityTransform_PaintsGlyphAtExpectedLocationWithResolvedColor
              - PaintTextLayout_TranslatedShapeTransform_ShiftsPaintedLocation
              - PaintTextLayout_EmptyOutlineGlyph_PaintsNothing
              - PaintTextLayout_AsymmetricGlyph_PaintsInkAboveBaselineNotBelow
              - ResolveTextFont_AnyFamilyHint_ResolvesNonNullFont
              - CanvasNetPptx_SystemIntegration_TextLayoutAndRender_TitlePlaceholderResolvesMasterTitleStyleEndToEnd
              - CanvasNetPptx_SystemIntegration_TextLayoutAndRender_NonPlaceholderShapeResolvesMasterOtherStyleEndToEnd

          - id: CanvasNetPptx-PptxDocument-PictureDecodeAndCrop
            title: >-
              The PptxDocument class shall resolve a <p:pic> shape's <p:blipFill>/<a:blip> into a
              decoded core Surface by dispatching on the embedded relationship's resolved part
              content type (mirroring the SVG codec's own raster-decoder dispatch), rejecting a
              <a:blip> with neither an r:embed nor an r:link attribute and one with only r:link
              with InvalidDataException and PptxUnsupportedFeatureException (feature token
              "pptx-image-link") respectively, rejecting an unsupported content type with
              PptxUnsupportedFeatureException (feature token "pptx-image-format"), and shall
              resolve a <p:blipFill>'s optional <a:srcRect> into a normalized, scaled-fraction
              PptxSrcRect crop rectangle (each edge defaulting to zero/full-extent when its own
              attribute is absent).
            justification: |
              A dedicated <p:pic> picture shape is the only in-scope picture-rendering construct
              this phase (an ordinary shape's own <a:blipFill>/<a:pattFill> background fill remains
              explicitly deferred - see this unit's own remarks); decoding its referenced media
              part eagerly, by content type, mirrors the already-verified SVG codec dispatch
              pattern rather than inventing a second, divergent raster-decode entry point. A linked
              (external-file) image has no embedded bytes this package can read without performing
              file-system I/O outside the supplied package stream, so it is deliberately
              unsupported rather than silently treated as a missing/blank image. <a:srcRect>'s
              scaled-fraction percentages (in thousandths of a percent) must be parsed exactly as
              OOXML defines them, or a crop that is supposed to trim a small edge sliver would
              instead crop away most or all of the image.
            tests:
              - ResolveSrcRect_NoSrcRectElement_ReturnsNull
              - ResolveSrcRect_AllEdgesPresent_ParsesScaledFractions
              - ResolveSrcRect_SomeEdgesAbsent_DefaultsToZero
              - ResolveSrcRect_NonNumericEdgeAttribute_ThrowsInvalidDataException
              - ResolveSrcRect_NullBlipFillElement_ThrowsArgumentNullException
              - ResolvePictureSurface_EmbeddedPng_DecodesSurfaceWithExpectedPixel
              - ResolvePictureSurface_NoBlipElement_ThrowsInvalidDataException
              - ResolvePictureSurface_BlipMissingEmbedAndLink_ThrowsInvalidDataException
              - ResolvePictureSurface_LinkedBlipOnly_ThrowsPptxUnsupportedFeatureExceptionWithImageLinkToken
              - ResolvePictureSurface_UnsupportedContentType_ThrowsPptxUnsupportedFeatureExceptionWithImageFormatToken
              - ResolvePictureSurface_NullArguments_ThrowsArgumentNullException

          - id: CanvasNetPptx-PptxDocument-PicturePainting
            title: >-
              The PptxDocument class shall paint a decoded picture Surface onto a destination
              Surface by composing the picture's own crop-rectangle-to-unit-square mapping with
              the shape's resolved frame transform into a single image-to-surface matrix, sampling
              the source image with nearest-neighbor filtering for each destination pixel whose
              inverse-mapped source coordinate falls within the image bounds, and painting no
              pixels at all when the composed transform is singular (non-invertible), without
              applying any Y-axis flip to the sampled image (unlike a y-up rendering target such as
              PDF, this package's surface space is already y-down, matching the image's own
              top-down pixel row order).
            justification: |
              Nearest-neighbor sampling composed through a single matrix keeps picture painting
              consistent with this package's existing shape-transform/geometry conventions (see
              Phase 1c's ResolveShapeFrame) without introducing a second coordinate-mapping scheme
              just for images. A singular transform (for example a zero-area shape frame) has no
              well-defined inverse to sample through, so painting nothing is the only fail-safe
              behavior; explicitly omitting the (1-v) row flip that an equivalent y-up target would
              require is a deliberate, documented divergence from the PDF renderer's own pattern,
              not an oversight - applying it here would paint every picture upside down.
            tests:
              - PaintPicture_IdentityTransformNoCrop_PaintsImagePixelsUnflipped
              - PaintPicture_TopBottomAsymmetricImage_PaintsWithoutVerticalFlip
              - PaintPicture_WithSrcRectCroppingLeftHalf_SamplesOnlyRightHalf
              - PaintPicture_TranslatedTransform_ShiftsPaintedFootprint
              - PaintPicture_DegenerateTransform_PaintsNothing
              - PaintPicture_NullSurfaceOrImage_ThrowsArgumentNullException

          - id: CanvasNetPptx-PptxDocument-TableParsing
            title: >-
              The PptxDocument class shall parse a <p:graphicFrame>'s <a:graphic>/<a:graphicData>/
              <a:tbl> into a PptxTable (column widths from <a:tblGrid>/<a:gridCol>, rows from
              <a:tr> with required height attributes, cells from <a:tc> with gridSpan/rowSpan/
              hMerge/vMerge attributes defaulting to 1/1/false/false when absent), rejecting a
              <a:graphicData> whose uri does not end in "/table" with
              PptxUnsupportedFeatureException (feature token "pptx-graphic-frame-kind") and a
              missing <a:graphicData>, <a:tblGrid>, or <a:tr> height, or a non-numeric gridCol
              width/gridSpan/rowSpan attribute, with InvalidDataException, and shall resolve each
              cell's <a:tcPr> fill and line styles (<a:lnL>/<a:lnR>/<a:lnT>/<a:lnB>) and text body
              by reusing the already-verified Phase 1c/1d ResolveFill/ResolveLineStyle/
              ParseTextBody resolvers verbatim.
            justification: |
              A <p:graphicFrame> can declare graphic data kinds other than a table (for example an
              embedded chart or OLE object); this phase only implements tables, so any other kind
              is a deliberately unsupported, well-formed construct rather than a malformed one.
              Reusing ResolveFill/ResolveLineStyle/ParseTextBody verbatim for cell-level properties
              keeps a table cell's own fill/border/text behavior in lock-step with an ordinary
              shape's own fill/border/text behavior, rather than maintaining a second, divergent
              resolution path solely for table cells.
            tests:
              - ParseTable_WellFormedTable_ParsesColumnsAndRows
              - ParseTable_MissingGraphicData_ThrowsInvalidDataException
              - ParseTable_NonTableGraphicFrameKind_ThrowsPptxUnsupportedFeatureExceptionWithGraphicFrameKindToken
              - ParseTable_MissingTblGrid_ThrowsInvalidDataException
              - ParseTable_GridColNonNumericWidth_ThrowsInvalidDataException
              - ParseTable_TrMissingHeight_ThrowsInvalidDataException
              - ParseTableCell_NoAttributes_DefaultsToSpanOneNoMerge
              - ParseTableCell_AttributesPresent_ParsesSpanAndMergeFlags
              - ParseTableCell_NonNumericGridSpan_ThrowsInvalidDataException
              - ParseTableCell_TcPrWithFillAndBorders_ResolvesFillAndBorders
              - ParseTableCell_NoTxBody_TextBodyIsNull
              - ParseTableCell_WithTxBody_ParsesTextBody

          - id: CanvasNetPptx-PptxDocument-TableCellRectResolution
            title: >-
              The PptxDocument class shall resolve each of a PptxTable's non-merge-continuation
              cells (a cell with neither hMerge nor vMerge set) into a PptxResolvedTableCell
              carrying its own EMU-space rectangle, computed by accumulating each physical
              <a:tc>-entry's own single grid column's width when advancing the running column
              offset (so that a spanning cell's own trailing continuation entries are never
              double-counted), while the surviving cell's own stored rectangle width/height spans
              the full gridSpan/rowSpan range of columns/rows it covers, and shall silently skip
              any merge-continuation cell (it contributes no PptxResolvedTableCell of its own).
            justification: |
              Per ECMA-376's table content model, each <a:tc> XML entry - whether a real cell or an
              hMerge/vMerge continuation placeholder - represents exactly one physical grid column;
              only the governing (non-continuation) cell of a merged region owns a rectangle wide/
              tall enough to span that whole region. Advancing the running column offset by the
              merged cell's own full spanned width, rather than by each physical entry's own single
              column width, would double-count the columns already covered by that cell's trailing
              continuation entries, corrupting every subsequent cell's computed left edge in the
              same row.
            tests:
              - ResolveCellRects_SimpleGrid_ComputesCumulativeOffsets
              - ResolveCellRects_MergeContinuationCells_AreSkipped
              - ResolveCellRects_HorizontalMerge_ComputesSpannedWidth
              - ResolveCellRects_VerticalMerge_ComputesSpannedHeight

          - id: CanvasNetPptx-PptxDocument-TablePainting
            title: >-
              The PptxDocument class shall paint a PptxTable onto a destination Surface by, for
              each resolved cell rectangle, filling its own resolved fill (solid or gradient, via
              the core PathFiller, transforming the cell's core Path.Rectangle through the table's
              own shape transform first), stroking each side with a resolved line style whose own
              width/dash/cap matches the Phase 1c stroke-outline convention, and painting the
              cell's own text body (when present) via the already-verified Phase 1d
              ResolveTextLayout/PaintTextLayout pipeline constrained to the cell's own rectangle,
              and shall paint nothing for an empty cell (no fill, no borders, no text).
            justification: |
              Reusing the core PathFiller for cell fills and the Phase 1d text-layout/rendering
              pipeline for cell text keeps a table cell's painted appearance consistent with how an
              ordinary shape's own fill and text are painted elsewhere in this package, rather than
              introducing a third, divergent painting code path solely for tables. An empty cell
              (no fill, no border, no text) is a common, valid table shape and must not paint any
              visible pixels at all.
            tests:
              - PaintTable_SolidFilledCell_PaintsFillColorAcrossCellRectangle
              - PaintTable_CellWithTopBorder_PaintsStrokedLineAtTopEdge
              - PaintTable_CellWithText_PaintsGlyphInkInsideCellRectangle
              - PaintTable_EmptyCell_PaintsNothing

          - id: CanvasNetPptx-PptxDocument-ShapeTree
            title: >-
              The PptxDocument class shall recursively parse a <p:spTree> (or, for a nested group,
              a <p:grpSp>'s own direct children, which are not wrapped in a nested <p:spTree> per
              ECMA-376's CT_GroupShape content model) into a closed PptxShapeTreeNode hierarchy,
              dispatching a <p:sp> to PptxSpShapeNode (resolving its placeholder, if any, via the
              Phase 1b placeholder-detection logic extracted into TryParsePlaceholder), a <p:pic>
              to PptxPictureShapeNode, a <p:graphicFrame> to PptxGraphicFrameShapeNode (eagerly
              parsing its table via ParseTable, against a theme lazily resolved - only when a
              table is actually encountered - via the slide's own layout/master/theme relationship
              chain), and a <p:grpSp> to PptxGroupShapeNode (resolving its own child-coordinate-
              space transform via the already-verified Phase 1c ResolveGroupChildTransform and
              recursing into its own children), silently skipping any other element kind (for
              example <p:nvGrpSpPr>, <p:grpSpPr>, <p:cxnSp>, or <p:contentPart>), and shall expose
              the result as PptxSlide.ShapeTree alongside the existing, unchanged
              PptxSlide.Placeholders flat list.
            justification: |
              Earlier phases only enumerated a slide's immediate placeholder shapes, excluding
              freeform shapes and never recursing into groups at all; a full shape-tree walk is the
              structural foundation a future per-slide Render API needs to paint every shape in
              document order, including nested groups' own children with their own composed
              transforms. Deferring theme resolution until a table is actually encountered avoids
              forcing every slide - including the overwhelming majority with no tables at all - to
              walk its layout/master/theme relationship chain merely to build its shape tree.
              Silently skipping unrecognized element kinds (rather than rejecting them) matches the
              existing Phase 1b precedent of excluding non-placeholder shapes from the flat
              placeholder list - a tree-walk tolerance, not a fail-closed feature rejection.
            tests:
              - ParseShapeTree_FreeformShape_ProducesSpShapeNodeWithNullPlaceholder
              - ParseShapeTree_PlaceholderShape_ProducesSpShapeNodeWithResolvedPlaceholder
              - ParseShapeTree_Picture_ProducesPictureShapeNode
              - ParseShapeTree_GraphicFrameTable_ProducesGraphicFrameShapeNodeWithParsedTable
              - ParseShapeTree_NoGraphicFrame_NeverInvokesThemeResolver
              - ParseShapeTree_UnrecognizedElements_SilentlySkipped
              - ParseShapeTree_Group_ProducesGroupShapeNodeWithDirectSiblingChildren
              - ParseShapeTree_NestedGroups_EachResolveOwnChildTransformAndChildren
              - ParseShapeTree_GroupMissingXfrm_ThrowsInvalidDataException
              - ParseShapeTree_GraphicFrameInsideGroup_ParsesTableUsingPropagatedThemeResolver
              - TryParsePlaceholder_FreeformShape_ReturnsNull
              - TryParsePlaceholder_NoTypeOrIdxAttributes_DefaultsToObjAndZero
              - TryParsePlaceholder_NonNumericIdx_ThrowsInvalidDataException
