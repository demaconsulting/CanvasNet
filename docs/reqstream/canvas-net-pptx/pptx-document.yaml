          - id: CanvasNetPptx-PptxDocument-RenderPublicApi
            title: >-
              The PptxDocument class shall expose public Render(int slideIndex, int width, int
              height, PptxRenderOptions? options = null) and Render(int slideIndex, float dpi,
              PptxRenderOptions? options = null) overloads that each validate a disposed document,
              an out-of-range slideIndex, non-positive width/height, and a non-positive or
              non-finite dpi by throwing ObjectDisposedException or ArgumentOutOfRangeException
              respectively before any rendering work begins, shall compute the dpi overload's own
              pixel width/height from the slide's own SlideSize EMU dimensions using the same
              EMU-per-inch convention as DemaConsulting.CanvasNet.Pdf.PdfDocument's own DPI
              overload, and shall clear the destination Surface to options.BackgroundColor (or
              PptxRenderOptions.Default's opaque white when options is null) before painting any
              shape.
            justification: |
              Validating every argument before any rendering work begins - rather than allowing a
              later internal resolver to throw a less specific or less helpfully-named exception -
              keeps this API's own failure modes consistent with every other public entry point in
              this codebase (see CanvasNetPptx-PptxDocument's own earlier public-API requirements).
              Reusing PdfDocument's own DPI-to-pixel-dimension convention keeps the two sibling
              format renderers' public APIs symmetric for a caller already familiar with one of
              them. Clearing to a caller-supplied background color before painting - defaulting to
              opaque white - mirrors PdfRenderOptions's own convention and gives a caller painting
              a slide with transparent or partially-covered shapes a predictable, non-garbage
              background rather than undefined pixel contents.
            tests:
              - Render_DefaultOptions_ClearsUnpaintedAreaToOpaqueWhite
              - Render_CustomBackgroundColor_ClearsToThatColor
              - Render_FullyTransparentBackgroundColor_ClearsToTransparent
              - Render_NegativeSlideIndex_ThrowsArgumentOutOfRangeException
              - Render_SlideIndexAtSlideCount_ThrowsArgumentOutOfRangeException
              - Render_NonPositiveWidth_ThrowsArgumentOutOfRangeException
              - Render_NonPositiveHeight_ThrowsArgumentOutOfRangeException
              - Render_DisposedDocument_ThrowsObjectDisposedException
              - Render_Dpi_NonPositiveDpi_ThrowsArgumentOutOfRangeException
              - Render_Dpi_NonFiniteDpi_ThrowsArgumentOutOfRangeException
              - Render_Dpi_NegativeSlideIndex_ThrowsArgumentOutOfRangeException
              - Render_Dpi_SlideIndexAtSlideCount_ThrowsArgumentOutOfRangeException
              - Render_DpiOverload_ComputesExpectedPixelDimensionsFromSlideSize

          - id: CanvasNetPptx-PptxDocument-SlideBackgroundFill
            title: >-
              The PptxDocument class's Render methods shall resolve and paint a slide's own
              p:cSld/p:bg background fill - falling back to its layout's, then its master's, own
              p:bg when the slide declares none - across the full slide immediately before the
              shape-tree walk begins, reusing the existing ResolveFill/ResolveColor DrawingML
              fill-resolution pipeline (solid, linear-gradient, and p:bgRef theme-indexed fills via
              a:fmtScheme/a:bgFillStyleLst with phClr substitution) rather than duplicating it, and
              shall fall back unchanged to PptxRenderOptions.BackgroundColor only when none of
              slide/layout/master declare a p:bg at all.
            justification: |
              A branded, non-white background fill is the single highest-visual-impact gap between
              CanvasNetPptx's rendered output and a real PowerPoint export - before this
              requirement, every slide rendered against a plain, uniform BackgroundColor regardless
              of what the file itself declared, even though two real fixture files in this
              project's own corpus (pythonpptx-sld-background.pptx, added specifically for this
              feature, and aiden0z-image-crop-css-reset.pptx) declare one. Resolving slide, then
              layout, then master in "first element present at all wins" order mirrors this unit's
              own established placeholder-property-inheritance precedent (see
              CanvasNetPptx-PptxDocument-PlaceholderInheritancePerCategory above) exactly, rather than
              introducing a second, bespoke inheritance rule. Reusing ResolveFill/ResolveColor
              rather than re-implementing fill resolution for backgrounds keeps every future
              fill-resolution bug fix or feature addition automatically applicable to backgrounds
              too, and keeps this requirement's own verification scope limited to the
              background-specific resolution/dispatch logic layered on top. A pattern or picture
              background fill is explicitly out of scope for this requirement - it is rejected with
              PptxUnsupportedFeatureException, inherited unchanged from ResolveFill's own
              pre-existing Phase 1c boundary (see CanvasNetPptx-PptxDocument-FillResolution above) -
              rather than silently dropped or misrendered.
            tests:
              - Render_SlideLevelSolidBackground_PaintsAcrossFullSlide
              - Render_SlideLevelBackgroundWithShape_ShapePaintsOnTopOfBackground
              - Render_LayoutLevelSolidBackground_PaintsWhenSlideDeclaresNone
              - Render_MasterLevelSolidBackground_PaintsWhenNeitherSlideNorLayoutDeclaresOne
              - Render_SlideLevelBackground_TakesPriorityOverLayoutAndMasterBackgrounds
              - Render_LayoutLevelBackground_TakesPriorityOverMasterBackgroundWhenSlideDeclaresNone
              - Render_NoBackgroundAnywhere_FallsBackToOptionsBackgroundColor
              - Render_SlideLevelThemeIndexedBackgroundReference_ResolvesBgFillStyleListEntryWithPhClrSubstitution
              - Render_SlideLevelThemeIndexedBackgroundReferenceIdxZero_PaintsNoBackground
              - ResolveSlideBackgroundFill_AllThreeTiersNull_ReturnsNull
              - ResolveSlideBackgroundFill_SlideDeclaresOne_ResolvesSlideOwnBackground
              - ResolveSlideBackgroundFill_SlideDeclaresNoneLayoutDoes_ResolvesLayoutOwnBackground
              - ResolveSlideBackgroundFill_SlideAndLayoutDeclareNoneMasterDoes_ResolvesMasterOwnBackground
              - ResolveSlideBackgroundFill_EmptySlideBackgroundStillWinsOverLayout_MatchesPlaceholderInheritancePrecedent
              - ResolveSlideBackgroundFill_BgElementWithNeitherBgPrNorBgRef_ThrowsInvalidDataException
              - ResolveSlideBackgroundFill_BgRefIdxZero_ReturnsNoFill
              - ResolveSlideBackgroundFill_BgRefIdxOneThousand_ReturnsNoFill
              - ResolveSlideBackgroundFill_BgRefIdxInFillStyleListRange_ThrowsPptxUnsupportedFeatureException
              - ResolveSlideBackgroundFill_BgRefIdxResolvesBgFillStyleListEntryWithPhClrSubstitution
              - ResolveSlideBackgroundFill_BgRefIdxSecondEntry_ResolvesSecondBgFillStyleListEntry
              - ResolveSlideBackgroundFill_BgRefResolution_DoesNotMutateThemeBgFillStyleList
              - ResolveSlideBackgroundFill_BgRefIdxPastEndOfBgFillStyleList_ThrowsInvalidDataException
              - ResolveSlideBackgroundFill_BgRefWithNoIdxAttribute_ThrowsInvalidDataException
              - ResolveSlideBackgroundFill_BgRefWithNonNumericIdxAttribute_ThrowsInvalidDataException
              - ResolveSlideBackgroundFill_BgRefWithNoColorChild_ResolvesEntryWithDefaultPhClr
              - GetTheme_NoFmtScheme_BgFillStyleListIsEmpty
              - GetTheme_FmtSchemeWithNoBgFillStyleLst_BgFillStyleListIsEmpty
              - GetTheme_FmtSchemeWithBgFillStyleLst_ParsesEntriesInDocumentOrder
