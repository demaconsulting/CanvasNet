              - PptxDocument_Render_Aiden0zImageCropCssResetFixture_PaintsVisibleContentAndBackgroundFill

          - id: CanvasNetPptx-PptxDocument-MasterLayoutShapeRendering
            title: >-
              The PptxDocument class's Render methods shall render a slide's own master's and own
              layout's non-placeholder shapes (pictures, autoshapes, groups, and freeform shapes)
              back-to-front in document order - master shapes first, then layout shapes, then the
              slide's own shapes unchanged on top - immediately after painting the resolved
              background and before the existing slide shape-tree walk, using the exact same
              per-shape-type paint dispatch a slide-level shape already uses, while never
              rendering a master's or layout's own placeholder shapes directly, and shall catch a
              PptxUnsupportedFeatureException thrown while painting a single master/layout shape
              (including one nested inside a group) and skip only that shape, continuing to render
              every other master/layout and slide shape, while a slide's own shape throwing the
              same exception continues to hard-fail Render unchanged.
            justification: |
              A real PowerPoint deck frequently places decoration (a logo, a rule, a watermark)
              directly on a slide master's or slide layout's own shape tree, outside any
              placeholder - before this requirement, CanvasNetPptx walked a master's or layout's
              own p:cSld/p:spTree only far enough to find placeholder shapes for the
              PlaceholderInheritancePerCategory chain (and, after the SlideBackgroundFill
              requirement above, to resolve p:bg) - any non-placeholder sibling shape was silently
              never painted, leaving a visible gap between CanvasNetPptx's rendered output and a
              real PowerPoint export. Reusing the existing per-shape-type paint dispatch (the same
              RenderNode/RenderShape/RenderPicture/RenderGraphicFrame functions a slide-level shape
              already uses) rather than introducing a parallel master/layout-specific rendering
              path keeps every future shape-rendering bug fix or feature addition automatically
              applicable to master/layout shapes too. A master/layout's own placeholder shapes
              must never be painted directly - they are real PowerPoint's own "Click to
              edit…" prompt/edit-mode-only text, never shown on an actual exported slide - so
              RenderNode gained a skipPlaceholderShapes flag, set only for the two new master/
              layout loops, leaving the pre-existing slide-shape-tree loop's own behavior
              unchanged. A slide only ever walks its own layout's and that layout's own master's
              shape tree (the same slide -> layout -> master relationship already resolved for
              placeholder inheritance and background), never an unrelated layout's or master's
              shapes. A master/layout shape that itself uses an already-deferred feature (an
              unsupported preset geometry, a chart/OLE graphic frame, an unsupported raster
              picture format, and so on) hits the exact same PptxUnsupportedFeatureException
              boundary a slide-level shape already hits. A regression fix corrected the original
              implementation, which did
              not contain this exception: without containment, a single already-deferred feature
              used by one decorative master/layout shape aborted rendering for every slide using
              that master/layout - a severe regression versus the pre-existing behavior where
              master/layout shape trees were never walked at all. RenderNode now catches
              PptxUnsupportedFeatureException at each leaf dispatch point, gated on the same
              skipPlaceholderShapes flag, so only the single failing master/layout shape is
              skipped and rendering continues; a slide's own shape (skipPlaceholderShapes == false)
              is never caught here and continues to hard-fail Render exactly as before this fix.
            tests:
              - Render_MasterNonPlaceholderPicture_PaintsOnEverySlideUsingThatMasterResolvingOwnRels
              - Render_LayoutNonPlaceholderAutoshape_PaintsOnlyOnSlidesUsingThatLayout
              - Render_MasterAndSlideShapesOverlap_SlideShapePaintsOnTopOfMasterShape
              - Render_MasterAndLayoutShapesOverlap_LayoutShapePaintsOnTopOfMasterShape
              - Render_MasterPlaceholderShape_DoesNotRenderItsOwnPromptContent
              - Render_LayoutPlaceholderShape_DoesNotRenderItsOwnPromptContent
              - Render_MasterNonPlaceholderPictureWithUnsupportedFormat_SkipsThatShapeAndStillRendersSlideContent
              - Render_SlideOwnPictureWithUnsupportedFormat_StillThrowsPptxUnsupportedFeatureException
              - PptxDocument_Render_Aiden0zChartAndComplexFixture_Slide0PaintsSlide1ThrowsUnsupportedFeature

          - id: CanvasNetPptx-PptxDocument-BulletProperties
            title: >-
              The PptxDocument class shall parse a paragraph's a:buNone/a:buAutoNum/a:buChar
              bullet-type choice, and its independent a:buClrTx/a:buClr color,
              a:buFontTx/a:buFont font, and a:buSzTx/a:buSzPct/a:buSzPts size choices, and shall
              resolve each of these four choice-groups independently through the same
              placeholder/master attribute-level inheritance chain already established for
              run/paragraph properties (own paragraph, then placeholder level override, then
              master level override, then a hard-coded default), with an explicit a:buNone or the
              complete absence of bullet markup anywhere in the chain resolving to no bullet at
              all, a:buAutoNum's type/startAt defaulting per the ECMA-376 schema
              (arabicPeriod/1) when omitted, and the three "follow text" sentinels
              (a:buClrTx/a:buFontTx/a:buSzTx, and the complete absence of color/font/size markup)
              resolving to the paragraph's own first run's effective color/typeface/size.
            justification: |
              A bulleted or numbered paragraph is one of the most common real-world PPTX
              constructs, and before this requirement CanvasNetPptx neither parsed nor resolved
              any bullet markup at all - every such paragraph rendered as plain, unmarked text, a
              visually obvious gap against a real PowerPoint export. Resolving each of the four
              independent OOXML choice-groups (type/color/font/size) on its own inheritance chain,
              rather than resolving one monolithic "bullet properties" object wholesale from
              whichever single tier wins, is required because a real-world paragraph commonly
              declares only its own bullet character while deliberately relying on its
              placeholder/master level style for the bullet's color/font/size (or the reverse) -
              mirroring exactly how algn/marL/indent/lnSpc are already each resolved independently
              by ResolveEffectiveParagraphProperties (see
              CanvasNetPptx-PptxDocument-PlaceholderInheritancePerCategory above), rather than
              introducing a second, bespoke, coarser-grained inheritance rule specific to bullets.
            tests:
              - ParseParagraphProperties_Absent_ResolvesEmptyBulletProperties
              - ParseBulletProperties_BuNone_CapturesTypeElement
              - ParseBulletProperties_BuChar_CapturesTypeElement
              - ParseBulletProperties_BuAutoNum_CapturesTypeElement
              - ParseBulletProperties_ColorFontSizeModifiers_CapturesEachIndependently
              - ParseBulletProperties_FollowTextModifiers_CapturesEachIndependently
              - ResolveEffectiveParagraphProperties_NoBulletMarkupAnywhere_ResolvesNone
              - ResolveEffectiveParagraphProperties_OwnBuChar_WinsOverEveryOtherTier
              - ResolveEffectiveParagraphProperties_OwnBuNone_SuppressesInheritedBullet
              - ResolveEffectiveParagraphProperties_PlaceholderLevelBuAutoNum_WinsWhenParagraphDeclaresNothing
              - ResolveEffectiveParagraphProperties_MasterBodyStyleBuChar_WinsWhenEverythingAboveIsAbsent
              - ResolveEffectiveParagraphProperties_BuAutoNumNoAttributes_ResolvesSchemaDefaults
              - ResolveEffectiveParagraphProperties_OwnTypeOnly_InheritsColorFontSizeIndependently
              - ResolveEffectiveParagraphProperties_BuClrTxOrAbsent_FollowsFirstRunColor
              - ResolveEffectiveParagraphProperties_BuClrTxRunLessParagraph_FallsBackToDark1
              - ResolveEffectiveParagraphProperties_BuFontTxOrAbsent_FollowsFirstRunFont
              - ResolveEffectiveParagraphProperties_BuSzPct_ResolvesFractionOfFirstRunSize
              - ResolveEffectiveParagraphProperties_BuSzPts_ResolvesAbsoluteSizeIndependentOfRunSize
              - ResolveEffectiveParagraphProperties_SldNumDtFtrPlaceholderType_SuppressesMasterBodyStyleBullet
              - ResolveEffectiveParagraphProperties_SldNumDtFtrPlaceholderTypeWithOwnBuChar_StillResolvesOwnBullet

          - id: CanvasNetPptx-PptxDocument-BulletRendering
            title: >-
              The PptxDocument class's text layout engine shall format an auto-numbered bullet's
              rendered string for the arabicPeriod, arabicParenR, arabicPlain, alphaLcPeriod,
              alphaUcPeriod, alphaLcParenR, alphaUcParenR, romanLcPeriod, romanUcPeriod,
              romanLcParenR, and romanUcParenR ST_TextAutonumberScheme values (gracefully omitting
              only that one paragraph's bullet glyph, without aborting rendering, for any other
              scheme value), shall maintain one running counter and last-used-scheme per indent
              level so consecutive same-level auto-numbered paragraphs sequence correctly and a
              nested sub-list's own counter resets independently of, and without disturbing, its
              parent level's own counter, shall paint a resolved bullet glyph at the paragraph's
              own marL+indent hanging-indent gutter position, shall position a bulleted
              paragraph's own first-line run text starting at marL (not marL+indent) whenever that
              line has a resolved bullet, clamped so the text never shares an X range with the
              bullet glyph it is painted beside regardless of the paragraph's resolved indent,
              shall additionally reserve a minimum trailing gap - one space character's own
              advance width, measured in the bullet's own resolved font/size - beyond an
              auto-numbered marker's own measured width specifically (not for a buChar marker,
              whose already-correct "touching, zero extra gap" behavior is unaffected), so a
              multi-character auto-number marker (e.g. "12.") reads as visibly separated from the
              paragraph's own text rather than merely touching it, matching PowerPoint's own
              tab-stop-like spacing after a number marker, leaving a non-bulleted paragraph's own
              first-line indent behavior unchanged, and shall suppress the bullet glyph entirely
              (while still advancing the auto-number counter state) for a paragraph with no <a:r>
              run children at all, so a blank/spacer paragraph that merely inherits a list's
              bullet properties never renders a stray, isolated bullet glyph with no accompanying
              text.
            justification: |
              Formatting and positioning a bullet glyph requires layout-engine support distinct
              from, and layered on top of, the choice-group parsing/inheritance resolution above:
              auto-numbering requires per-shape sequence state that single-paragraph property
              resolution alone cannot provide, and correct gutter positioning requires the
              paragraph's own text to be deliberately excluded from the indent it would otherwise
              apply to itself. The latter was found, during this requirement's own implementation,
              to be a previously-undocumented, closely-related rendering defect: a bulleted
              paragraph's first-line text was already incorrectly shifted into the
              hanging-indent gutter reserved for the bullet glyph (treating indent as an
              additional first-line text indent rather than the gutter width ECMA-376, and every
              real PowerPoint export, intends) - fixing this alongside adding the bullet glyph
              itself is necessary, not merely cosmetic, since a bullet glyph painted correctly in
              the gutter while its own paragraph's text remains shifted into that same gutter would
              still look wrong relative to a genuine PowerPoint export. An unrecognized
              auto-number scheme degrades gracefully (omitting only that one bullet) rather than
              throwing PptxUnsupportedFeatureException, matching this codebase's own established
              convention for an optional, nullable-returning resolver, since a single unsupported
              bullet scheme in an otherwise-ordinary real-world deck must never abort rendering of
              every other slide/shape/paragraph. A further visual-fidelity defect was found after
              this requirement's initial implementation: painting a bullet glyph for any paragraph
              with resolved, non-None bullet properties - regardless of whether that paragraph had
              any run content at all - rendered a stray, isolated bullet glyph on a run-less
              blank/spacer paragraph, something no genuine PowerPoint export ever does. The fix
              gates only the glyph itself on the paragraph having at least one run, leaving the
              auto-number counter's own advancement untouched, so a run-less auto-numbered
              paragraph still consumes its own position in the sequence even though nothing is
              painted for it - matching real PowerPoint's own counter semantics. A further bug was
              found against real-world content, reported as a buAutoNum marker appearing to render
              stacked/overlapping its own paragraph's first word: investigation (direct code
              inspection plus temporary numeric probes) refuted the plausible duplicate-paint and
              type-precedence-merge hypotheses - there is exactly one bullet-glyph-painting call
              site, and a paragraph's own buAutoNum fully supersedes an inherited master buChar
              default, never merging the two - and instead confirmed a bullet-gutter/text-start-X
              collision in PositionLines: when a bulleted paragraph's resolved IndentEmu was zero
              or not negative enough to clear the bullet glyph's own rendered width, the bullet
              and the paragraph's own first-line text painted at the same, or an overlapping, X
              coordinate - a positioning defect affecting buChar and buAutoNum bullets alike,
              confirmed numerically on a real-world slide (marL="320040", lvl="1", no indent
              attribute, a plain non-placeholder TextBox, buAutoNum type="arabicPeriod"). The fix
              clamps the bulleted first line's own text-start-X to never fall short of the
              bullet's own gutter position plus its own measured width, a no-op whenever the
              existing gutter already clears the bullet's own width. A follow-up real-world report
              found that same clamp, while correct for buChar, still insufficient for buAutoNum:
              CanvasNet rendered an auto-numbered marker immediately touching the paragraph's own
              first word (e.g. "1.3 custom tip geometries"), whereas real PowerPoint shows a
              clear, word-space-sized gap after the marker. Investigation confirmed
              BuildBulletGlyphs already measures a multi-character auto-number marker's full
              string width correctly (refuting a suspected single-glyph-width regression) - the
              gap was the prior fix's own documented "just touching, zero extra padding"
              simplification, applied uniformly to every bullet kind. The fix adds a
              BulletGlyphsResult.TrailingGapEmu - one space character's own advance width,
              measured in the bullet's own resolved font/size - gated to PptxBulletKind.AutoNum
              only (zero for Char/None, leaving the already-verified buChar behavior unaffected),
              folded additively into the existing clamp.
            tests:
              - FormatAutoNumber_SupportedTypes_FormatsExpectedString
              - FormatAutoNumber_UnsupportedType_ReturnsNull
              - ResolveTextLayout_NonBulletedParagraph_FirstLineIndentStillAppliesToTextX
              - ResolveTextLayout_BulletedParagraph_TextStartsAtMarLGutterHoldsBullet
              - ResolveTextLayout_BuNone_PaintsNoGlyphBeyondRunText
              - ResolveTextLayout_ConsecutiveAutoNumParagraphs_SequencesCounterAcrossParagraphs
              - ResolveTextLayout_NestedThenReturnToShallowerLevel_ResumesShallowerCounterRestartsDeeperLevel
              - ResolveTextLayout_UnsupportedAutoNumType_SkipsOnlyThatBulletGracefully
              - PaintTextLayout_BulletedParagraph_PaintsBulletGlyphToSurface
              - BuildLines_ParagraphWithBulletPropertiesAndNoRuns_PaintsNoBulletGlyph
              - BuildLines_OtherwiseIdenticalParagraphWithOneRun_StillPaintsBulletGlyph
              - BuildLines_RunlessAutoNumberParagraph_CounterStillAdvancesForSubsequentParagraph
              - PptxDocument_Render_Aiden0zChartAndComplexFixture_Slide0PaintsSlide1ThrowsUnsupportedFeature
              - ResolveTextLayout_BulletedParagraphWithZeroIndent_TextClearsBulletWidth
              - PaintTextLayout_BulletedParagraphWithZeroIndent_BulletAndTextInkDoNotOverlap
              - ResolveTextLayout_MasterBuCharDefault_OwnBuAutoNumOverride_PaintsOnlyAutoNumberMarker
              - ResolveTextLayout_BulletedParagraphWithZeroIndent_AutoNumTwoDigitMarker_TextClearsBulletWidthPlusGap
              - PaintTextLayout_BulletedParagraphWithZeroIndent_AutoNumMarker_BulletAndTextHaveVisibleGap

          - id: CanvasNetPptx-PptxDocument-ShapeStyleReference
            title: >-
              The PptxDocument class shall resolve a shape's own <p:style>/<a:fillRef idx="N"/>
              and <a:lnRef idx="N"/> shape-style references - as produced by PowerPoint's "Shape
              Styles" gallery - into a concrete fill/line style, indexing the theme's own
              <a:fmtScheme>/<a:fillStyleLst>/<a:lnStyleLst> directly, 1-based, with no offset
              (idx="0" meaning "none"; idx outside [1,3], or indexing past either list's own
              entry count, throwing InvalidDataException), substituting the fillRef/lnRef's own
              color-definition child for the matched style-list entry's own <a:schemeClr
              val="phClr"/> token(s), and shall give priority to an explicit fill-definition child
              (on the shape's own <p:spPr>, or on its own <a:ln>, including an explicit
              <a:noFill/>) over its corresponding style reference. For the line side specifically,
              a present <a:ln> that declares no recognized fill-definition child of its own keeps
              its own width/dash but defers only its color to the style <a:lnRef> (falling back to
              "no stroke" when no style color is available); a fully absent fill/line element
              defers to the style reference entirely for both width and color.
            justification: |
              A shape styled purely through PowerPoint's own Shape Styles gallery (rather than an
              explicit, user-applied fill/line) declares that choice solely via <p:style>, which
              this unit previously parsed nowhere at all - such a shape silently rendered with no
              fill and no stroke whatsoever, a genuine visual-fidelity defect rather than a
              gracefully-deferred feature boundary. Unlike <p:bgRef>'s own background-specific
              +1000/+1001 offset matrix into bgFillStyleLst, an ordinary fillRef/lnRef indexes
              fillStyleLst/lnStyleLst directly, since a real theme's own fmtScheme always declares
              exactly 3 entries in each list and no "other half" concept applies here; rejecting an
              out-of-range idx with InvalidDataException (rather than silently clamping it) keeps
              this resolver consistent with every other idx-validating resolver already in this
              unit. An explicit fill-definition child (including <a:noFill/>) must win over a style
              reference because real PowerPoint itself allows a user to override an otherwise
              gallery-styled shape's own fill/line without clearing its <p:style>, so both can
              legitimately coexist on the same shape. However, a real-world shape commonly declares
              an <a:ln> that carries only width/dash/cap attributes with no recognized
              fill-definition child at all, relying entirely on its <p:style>/<a:lnRef> for its own
              visible color - treating such a fill-less <a:ln> as if it had "explicitly won" over
              the style (the original, buggy policy) silently discarded that color and rendered no
              stroke at all, the opposite of PowerPoint's own rendering. The line side's resolver
              therefore keeps the shape's own width/dash (never pulled from style) but defers only
              its color to the style <a:lnRef>, falling back to "no stroke" when no style color is
              available - the same pre-existing default every other fill-less-line call site in
              this unit already produces, and the same default ResolveConnectorLineStyle already
              establishes as precedent for a connector's own, broader per-attribute merge; no new
              default color is invented, since OOXML's own schema default for an absent or idx="0"
              style reference is "no line at all", not a specific color.
            tests:
              - ResolveShapeStyleFill_NullStyleElement_ReturnsNoFill
              - ResolveShapeStyleFill_NoFillRef_ReturnsNoFill
              - ResolveShapeStyleFill_IdxZero_ReturnsNoFill
              - ResolveShapeStyleFill_FillRefIdxOne_ResolvesFillStyleListEntryZeroNoOffset
              - ResolveShapeStyleFill_FillRefWithSchemeClrPhClr_SubstitutesFillRefOwnColor
              - ResolveShapeStyleFill_IdxOutOfRange_ThrowsInvalidDataException
              - ResolveShapeStyleFill_IdxPastEndOfEmptyFillStyleList_ThrowsInvalidDataException
              - ResolveShapeStyleFill_FillRefWithNoIdxAttribute_ThrowsInvalidDataException
              - ResolveShapeStyleLineStyle_NullStyleElement_ReturnsNull
              - ResolveShapeStyleLineStyle_NoLnRef_ReturnsNull
              - ResolveShapeStyleLineStyle_IdxZero_ReturnsNull
              - ResolveShapeStyleLineStyle_LnRefIdxOne_ResolvesLnStyleListEntryZeroNoOffset
              - ResolveShapeStyleLineStyle_LnRefWithSchemeClrPhClr_SubstitutesLnRefOwnColor
              - ResolveShapeStyleLineStyle_IdxOutOfRange_ThrowsInvalidDataException
              - ResolveShapeStyleLineStyle_LnRefWithNoIdxAttribute_ThrowsInvalidDataException
              - GetTheme_NoFmtScheme_FillStyleListAndLnStyleListDefaultToEmpty
              - GetTheme_FmtSchemeWithNoFillStyleLstOrLnStyleLst_BothDefaultToEmpty
              - GetTheme_FmtSchemeWithFillStyleLstAndLnStyleLst_ParsesEntriesInDocumentOrder
              - Render_ShapeWithOnlyStyleFillRefNoExplicitSpPrFill_RendersResolvedTintedAccentColor
              - Render_ShapeWithBothExplicitSpPrFillAndStyleFillRef_ExplicitFillWins
              - Render_ShapeWithOnlyStyleLnRefNoExplicitLn_RendersResolvedStrokeColor
              - Render_ShapeWithExplicitLnNoFillAndStyleLnRef_ExplicitLnWins
              - ResolveShapeLineStyle_LnElementNull_DefersToStyleLineStyle
              - ResolveShapeLineStyle_LnHasExplicitSolidFill_OwnFillWinsOverStyle
              - ResolveShapeLineStyle_LnHasExplicitNoFill_ResolvesNullRegardlessOfStyle
              - ResolveShapeLineStyle_LnHasWidthButNoFillChild_KeepsOwnWidthUsesStyleColor
              - ResolveShapeLineStyle_LnHasWidthAndOwnDashButNoFillChild_KeepsOwnDashArray
              - ResolveShapeLineStyle_LnHasWidthButNoFillChildAndNoStyleElement_ResolvesNullDefault
              - ResolveShapeLineStyle_LnHasWidthButNoFillChildAndStyleLnRefIdxZero_ResolvesNullDefault
              - ResolveShapeLineStyle_LnHasNoWidthAndNoFillChild_ResolvesNullRegardlessOfStyle
              - Render_ShapeWithLnWidthOnlyNoFillChildAndStyleLnRef_UsesOwnWidthAndStyleColor

          - id: CanvasNetPptx-PptxDocument-ConnectorRendering
            title: >-
              The PptxDocument class shall dispatch a <p:cxnSp> connector shape to its own
              PptxConnectorShapeNode in the same document-order shape-tree walk as every other
              shape kind, resolving its preset connector geometry (line/straightConnector1 as an
              open two-point diagonal; bentConnector2-5/curvedConnector2-5 as an elbow polyline,
              optionally corner-rounded; any other, unimplemented preset name failing gracefully
              for that one shape only, not the whole slide render) even when its own <a:ext>
              declares a zero width and/or zero height, shall paint its effective stroke by
              merging its own <a:ln> with its sibling <p:style>/<a:lnRef> fallback independently
              per attribute (width, paint, dash) rather than as an all-or-nothing choice, shall
              paint a fill only when the connector's own <p:spPr> explicitly declares one, and
              shall paint a resolved <a:headEnd>/<a:tailEnd> arrowhead (recognizing
              triangle/stealth/diamond/oval/arrow type values, sized relative to the connector's
              own stroke width via its w/len size keywords) oriented along the connector's own
              line direction at the corresponding endpoint.
            justification: |
              A <p:cxnSp> connector shape - the straight/elbow/curved lines PowerPoint draws
              between other shapes in flowcharts and diagrams - was previously never represented
              in the parsed shape tree at all, so a slide containing one rendered with that
              connector simply absent; for a real-world flowchart/diagram slide this is a severe,
              highly visible fidelity gap, not a gracefully-deferred rare feature. Dispatching
              <p:cxnSp> through the exact same ParseShapeTree/RenderNode walk every other shape
              kind already uses (rather than a parallel, connector-specific tree/render path)
              keeps a connector's z-order among its siblings, and its own group-nested transform
              composition when nested inside a <p:grpSp>, correct for free, with no special-casing
              needed anywhere in the walk itself. The preset-geometry zero-size bypass is a
              targeted, connector-scoped fix: a real-world connector frequently declares a
              perfectly horizontal or vertical line via a zero-height or zero-width <a:ext> -
              confirmed in the pythonpptx-shp-connector-props.pptx fixture's own second slide -
              and PptxPresetGeometry's own pre-existing "non-positive bounding box renders as
              Path.Empty" guard (correct and unchanged for every other, non-connector preset) would
              otherwise silently discard such a connector's line entirely. The per-attribute line-
              style merge (rather than RenderShape's own simpler "any present <a:ln> wins outright
              over <a:lnRef>" policy) was proven necessary by that same real fixture: its own
              connector declares a bare <a:ln><a:tailEnd type="arrow"/></a:ln> - no width, no fill
              - relying entirely on its sibling <p:style>/<a:lnRef> for its actual visible color
              and width; under the ordinary shape policy this would resolve to an invisible line.
              A connector paints no fill by default (unlike an ordinary autoshape) because a real
              connector line is visually just a stroked path with no interior area to fill, and
              PowerPoint itself only rarely has a user explicitly add one. Arrowhead size-keyword
              scaling is a documented, reasonable visual approximation relative to the connector's
              own stroke width, since PowerPoint publishes no normative EMU/pixel table for its own
              sm/med/lg size keywords. An exotic or future connector preset name this phase does
              not implement degrades to "this one connector paints nothing" (via a dedicated,
              unconditional inner try/catch around connector geometry resolution specifically, in
              addition to the standard skipPlaceholderShapes-gated outer catch every node kind
              already has) rather than aborting the rest of the slide's own render - satisfying the
              same graceful, single-shape-scoped degradation policy already established for
              master/layout decorative shapes, now extended to a slide's own connectors as well.
            tests:
              - ParseShapeTree_Connector_ProducesConnectorShapeNode
              - PptxPresetGeometry_Build_StraightConnectorPresets_ProducesOpenDiagonal
              - PptxPresetGeometry_Build_StraightConnectorWithZeroWidthOrHeight_StillProducesLine
              - PptxPresetGeometry_Build_OrdinaryPresetWithZeroHeight_StillDegradesToEmpty
              - PptxPresetGeometry_Build_BentConnectorPresets_ReachesEndpointAsOpenPolyline
              - PptxPresetGeometry_Build_CurvedConnectorPresets_ReachesEndpoint
              - ResolveShapeFrame_StraightConnectorWithFlipCombination_MapsEndpointsCorrectly
              - ResolveConnectorLineStyle_OwnLnExplicitNoFill_AlwaysWinsOverStyle
              - ResolveConnectorLineStyle_OwnLnHasNoWidth_FallsBackToStyleWidth
              - ResolveConnectorLineStyle_OwnLnHasWidthButNoFill_FallsBackToStylePaint
              - ResolveConnectorLineStyle_OwnLnHasExplicitWidthAndFill_OwnValuesWin
              - ResolveConnectorLineStyle_NoOwnWidthAndNoStyle_ResolvesToNull
              - ResolveConnectorLineStyle_OwnLnHasExplicitDash_UsesOwnDashArray
              - ResolveArrowhead_RecognizedTypeValue_ResolvesExpectedKind
              - ResolveArrowhead_NoLnElement_ReturnsNull
              - ResolveArrowhead_NoMatchingEndElement_ReturnsNull
              - ResolveArrowhead_NoneOrUnrecognizedType_ReturnsNull
              - ResolveArrowhead_NoWOrLenAttributes_DefaultsToMed
              - PptxArrowheadGeometry_Build_FilledKinds_TipAtOriginBodyExtendsBackward
              - PptxArrowheadGeometry_Build_Oval_IsClosedAndCenteredNearOrigin
              - PptxArrowheadGeometry_Build_Arrow_IsOpenChevron
              - PptxArrowheadGeometry_Build_NonPositiveLineWidth_ReturnsEmpty
              - PptxArrowheadGeometry_Build_SizeKeys_LargeIsBiggerThanSmall
              - ComputeEndpointsAndTangents_HorizontalStraightConnector_TangentsPointAlongPositiveX
              - ComputeEndpointsAndTangents_VerticalStraightConnector_TangentsPointAlongPositiveY
              - ComputeEndpointsAndTangents_DiagonalStraightConnector_TangentsPointAtFortyFiveDegrees
              - ComputeEndpointsAndTangents_BentConnector_FinalSegmentTangentPointsAlongLastDirection
              - Render_StraightConnector_PaintsDiagonalLineAtExpectedPixels
              - Render_ZeroHeightHorizontalConnector_PaintsLineWithoutDegradingToEmpty
              - Render_ConnectorWithTailArrowhead_PaintsArrowheadNearEndpoint
              - PptxDocument_Render_ShpConnectorPropsFixture_ConnectorsPaintVisibleLines

          - id: CanvasNetPptx-PptxDocument-UnderlineRendering
            title: >-
              The PptxDocument class shall resolve a text run's effective <a:rPr u="..."> value
              into one of four underline styles (none/single/double/other, where every ECMA-376
              variant other than none/sng/dbl - heavy, dotted, dottedHeavy, dash, dashHeavy,
              dashLong, dashLongHeavy, dotDash, dotDashHeavy, dotDotDash, dotDotDashHeavy, wavy,
              wavyHeavy, wavyDbl, and any unrecognized value - maps to other), following the same
              four-tier run/paragraph-defRPr/lstStyle-level/master-txStyles inheritance chain as
              every other text property, shall resolve the underline's own color independently
              from an explicit <a:uFill>/<a:solidFill> child when present, defaulting to the
              run's own already-resolved text-fill color whenever no <a:uFill> child exists
              (including when an explicit <a:uFillTx/> is present), and shall paint a visible,
              solid-filled rectangle beneath each underlined run spanning its own measured glyph
              width (continuous across interior spaces within one run, and not merged across a
              run boundary even when both runs are underlined), positioned and sized proportional
              to the run's own font size, with a double-underline style painting two thinner,
              gapped rectangles instead of one.
            justification: |
              A real-world corpus fixture ("ERF IWF Breadboard Motion System Overview.pptx",
              slide 23 "Configurations") contains text runs declaring <a:rPr u="sng"/> that
              PowerPoint's own ground-truth rendering shows with a visible single underline, while
              CanvasNet rendered no underline at all: GetUnderline parsed the u attribute into a
              boolean PptxEffectiveRunProperties.Underline, but nothing downstream (layout or
              paint) ever consumed it, silently dropping an explicitly-authored, visible text
              decoration. Modeling the resolved value as a style enum (rather than restoring the
              prior boolean) lets every other ECMA-376 u variant resolve to a defined, intentional
              behavior (a single solid line, documented as a pragmatic simplification) instead of
              either crashing on an unrecognized value or silently dropping it exactly as before.
              Resolving the underline's own color independently of the run's text color (rather
              than always matching the text color outright) is required because PowerPoint itself
              allows an author to declare a differently-colored underline via <a:uFill>; defaulting
              to the run's own text color whenever no <a:uFill> child exists (including the
              explicit "inherit text color" marker <a:uFillTx/>) matches PowerPoint's own default
              behavior for a run that does not override its underline color. Building one
              contiguous span per underlined run (not merged across a run boundary, but continuous
              across an interior space within the same run) matches PowerPoint's own visual
              behavior: an underline never bridges a run boundary even when both runs happen to
              be underlined, but a single run's own interior whitespace is visibly underlined, not
              skipped. Deriving thickness/offset as a documented, SizeEmu-proportional
              approximation (rather than parsing the OpenType post table's own
              underlinePosition/underlineThickness fields) is an explicit, pragmatic
              simplification for this phase - true font-metric-derived values are deferred to a
              later phase.
            tests:
              - ResolveEffectiveRunProperties_NoneDeclared_ResolvesHardCodedDefaults
              - ResolveEffectiveRunProperties_UnderlineAttribute_ResolvesExpectedStyle
              - ResolveEffectiveRunProperties_ExplicitUFill_OverridesTextColor
              - ResolveEffectiveRunProperties_NoUnderlineFillMarkup_DefaultsUnderlineColorToTextColor
              - ResolveEffectiveRunProperties_ExplicitUFillTx_DefaultsUnderlineColorToTextColor
              - ResolveTextLayout_UnderlinedRun_EmitsOneSegmentSpanningRunWidth
              - ResolveTextLayout_NonUnderlinedRun_EmitsNoSegment
              - ResolveTextLayout_TwoRunsOnlyFirstUnderlined_EmitsExactlyOneSegment
              - ResolveTextLayout_UnderlinedRunWithInteriorSpace_SpanCoversSpace
              - PaintTextLayout_SingleUnderlineSegment_PaintsStrokeBelowBaselineAtExpectedPositionAndColor
              - PaintTextLayout_NoUnderlineSegments_PaintsNoExtraInk
              - PaintTextLayout_DoubleUnderlineSegment_DoesNotThrowAndPaintsInk
              - PaintTextLayout_OtherUnderlineSegment_DoesNotThrowAndPaintsInk
