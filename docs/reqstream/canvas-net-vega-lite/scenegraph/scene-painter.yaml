---
# Software Unit Requirements for ScenePainter
#
# These requirements describe the design-level behavior of the ScenePainter unit of the Scenegraph subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Scenegraph): the painter (ScenePainter.cs and
# ScenePainter.Paths.cs) that draws a Scene onto a CanvasNet Surface using only the public CanvasNet drawing APIs,
# at a uniform scale and offset, with the caller owning the surface - including the paths with curved segments, the
# arc items (through the ArcGeometry unit), the trail items, and the stroke miter limit. See
# docs/verification/canvas-net-vega-lite/scenegraph/scene-painter.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Scenegraph Requirements
        sections:
          - title: ScenePainter Requirements
            requirements:
              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-FillStroke
                title: >-
                  The ScenePainter unit shall fill and stroke rectangles and rules with the fill, stroke,
                  stroke width, and the item, fill, and stroke opacities, draw nothing for an item
                  without paint, and fill the surface with the background of the scene first; and shall
                  keep the stroke safe for any specified number: a stroke width, dash offset, or dash
                  entry that is finite as a double but not as a float is validated after the conversion
                  (an unusable width draws nothing, an overflowing offset counts as zero), and a dash
                  pattern that is unusable after the conversion, finer than a quarter of a surface pixel,
                  or longer than 50000 estimated dashes on a path is drawn solid, so that no such value
                  escapes as an exception or makes the stroker do unbounded work.
                justification: |
                  Fill, stroke, and opacity are the basic paint of every mark and guide, and a chart
                  specification may carry any number as a stroke width, dash, or offset, which must not be
                  able to stop or stall the renderer.
                tests:
                  - ScenePainter_Paint_RectAndRuleHonorsFillStrokeOpacity
                  - ScenePainter_Paint_NoPaintDrawsNothingAndBackgroundFillsTheSurface
                  - ScenePainter_Paint_PathologicalDashPatternsFallBackToSolid
                  - ScenePainter_Paint_ValuesOutsideTheFloatRangeAreSafe

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-ClipScale
                title: >-
                  The ScenePainter unit shall apply the uniform scale and offset of the placement and
                  clip group content to the clip rectangle with fractional per-pixel coverage, exact on
                  integer edges, intersecting nested clips and limiting memory to the pixel box of the
                  clip.
                justification: |
                  Scaling and clipping decide where every pixel of a fitted or clipped chart falls.
                tests:
                  - ScenePainter_Paint_ClipAndScaleMatchAnalyticPixels
                  - ScenePainter_Paint_FractionalAndNestedClipsUseCoverage

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Gradient
                title: >-
                  The ScenePainter unit shall fill an item that has a gradient with the core linear gradient, its
                  start and end placed on the bounding box of the item's path and mapped to pixels with the
                  placement of the item, with the fill opacity scaling every stop, the end colors continuing
                  beyond the stops, hard steps preserved, and no fallback to the solid fill when the gradient
                  is transparent, but a fallback to the solid fill for a gradient that has no usable stop or
                  whose geometry is not finite; and shall paint the same pixels every time.
                justification: |
                  The color legend draws its bar with a gradient fill, and the colors of the bar are the
                  evidence of a continuous color scale, so the pixels must follow the stops and the geometry.
                tests:
                  - ScenePainter_Paint_GradientFillRunsAlongTheItemBox
                  - ScenePainter_Paint_GradientFollowsTheScaleAndTheEnclosingGroup
                  - ScenePainter_Paint_GradientOpacityReplacementAndFallback
                  - ScenePainter_Paint_GradientOnGroupSymbolAndPath
                  - ScenePainter_Paint_GradientIsDeterministic

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Symbols
                title: >-
                  The ScenePainter unit shall draw symbols whose area and bounds follow the Vega symbol
                  shapes, polylines and polygons, rounded rectangles, and the filled and stroked
                  background of a group with crisp half-pixel stroke alignment.
                justification: |
                  The point-like marks and the view border are drawn by these items.
                tests:
                  - ScenePainter_Paint_SymbolsCoverTheirDocumentedArea
                  - ScenePainter_SymbolPath_ShapesHaveVegaBounds
                  - ScenePainter_IsSymbolShape_KnowsTheDrawnShapes
                  - ScenePainter_Paint_PathsRoundedRectanglesAndGroupBackgroundAreCrisp

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Text
                title: >-
                  The ScenePainter unit shall draw text with the font resolved by the text measurer, at
                  the baseline, alignment, rotation, and scale of the item, truncated to the limit with
                  an ellipsis, and without stroking the text.
                justification: |
                  Labels and titles are drawn by these items and must sit exactly where the layout
                  measured them.
                tests:
                  - ScenePainter_Paint_TextUsesBaselineRotationAndScale
                  - ScenePainter_Paint_TextLimitTruncatesTheDrawnLine

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Arguments
                title: >-
                  The ScenePainter unit shall reject invalid arguments (a null scene, a size outside the
                  surface limits) and stop with an OperationCanceledException when the cancellation token
                  is canceled, leaving the ownership of the surface with the caller.
                justification: |
                  The painter is the last step of Render; its failures must be predictable and must not
                  leak surfaces.
                tests:
                  - ScenePainter_Paint_InvalidArgumentsAndCancellation

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-CurvedPaths
                title: >-
                  The ScenePainter unit shall draw a path item that has segments as the outline of its moves, lines,
                  and cubic Beziers - filled with the nonzero rule and stroked through the curve, each move starting
                  a separate subpath and a command after a close continuing at the start of the closed subpath - and
                  shall draw nothing for a path with a segment that has a coordinate that is not finite (and for an
                  arc or a trail with a parameter that is not finite).
                justification: |
                  The line and area marks are drawn from their segments; the painter must follow the curve and
                  must not be stopped by a value that is not a number.
                tests:
                  - ScenePainter_Paint_SegmentPathStrokesThroughItsCubicCurve
                  - ScenePainter_Paint_ClosedSegmentPathFillsItsInterior
                  - ScenePainter_Paint_MoveToSegmentsStartSeparateSubpaths
                  - ScenePainter_Paint_NonFiniteSegmentsArcsAndTrailsDrawNothing

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Arcs
                title: >-
                  The ScenePainter unit shall draw an arc item by filling the outline that the ArcGeometry unit
                  builds for its radii, angles, pad angle, and corner radius, translated to its center, so that the
                  wedge is covered and the hole of a donut is empty, with the stroke, the opacities, and the
                  placement scale of any other item.
                justification: |
                  The pie and donut charts are drawn by the arc item; its pixels must be the wedge and nothing
                  else, at any scale.
                tests:
                  - ScenePainter_Paint_ArcFillsOnlyItsWedgeAndLeavesTheHoleEmpty
                  - ScenePainter_Paint_ArcStrokeAndOpacityFollowTheItem
                  - ScenePainter_Paint_PathsAndArcsScaleWithThePlacement

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Trails
                title: >-
                  The ScenePainter unit shall draw a trail item as the union of the capsules between its
                  consecutive points - each as wide as the size of its end points, as Vega's trail does - so that
                  its width follows the size of each point, shall break the trail at the boundary of a run and at a
                  point with no usable size, and shall draw a circle for coincident points.
                justification: |
                  A trail is a line whose width varies with the data; the capsules are what make the width change
                  smoothly and the runs are how a gap breaks the trail.
                tests:
                  - ScenePainter_Paint_TrailWidthFollowsTheSizeOfEachPoint
                  - ScenePainter_Paint_TrailBreaksAtRunBoundariesAndDrawsCapsForCoincidentPoints

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-MiterLimit
                title: >-
                  The ScenePainter unit shall stroke with the stroke miter limit of the item (the Vega default of 4
                  when it has none, a value below 1 or that is not finite treated as 1, and a value above 1000 as
                  1000), so that a sharp join is beveled beyond the limit, and shall give a path the dash, cap,
                  join, and dash offset of its item.
                justification: |
                  The strokeMiterLimit, strokeCap, strokeJoin, and strokeDashOffset properties decide the corners
                  of lines and outlines, and an extreme limit must not make the stroker misbehave.
                tests:
                  - ScenePainter_Paint_StrokeMiterLimitBevelsASharpJoin
                  - ScenePainter_Paint_PathStrokeHonorsDashCapJoinAndOffset
