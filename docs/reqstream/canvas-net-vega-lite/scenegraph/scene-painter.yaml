---
# Software Unit Requirements for ScenePainter
#
# These requirements describe the design-level behavior of the ScenePainter unit of the Scenegraph subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Scenegraph): the painter (ScenePainter.cs and
# ScenePainter.Paths.cs) that draws a Scene onto a CanvasNet Surface using only the public CanvasNet drawing APIs,
# at a uniform scale and offset, with the caller owning the surface - including the paths with curved segments, the
# arc items (through the ArcGeometry unit), the trail items, the stroke miter limit, and (Phase 13,
# ScenePainter.Images.cs and SceneImageSource.cs) the picture items of the image mark, loaded at paint time through
# the image resolver of the host. See
# docs/verification/canvas-net-vega-lite/scenegraph/scene-painter.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Scenegraph Requirements
        sections:
          - title: ScenePainter Requirements
            requirements:
              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-FillStroke
                title: >-
                  The ScenePainter unit shall fill and stroke rectangles and rules with the fill, stroke,
                  stroke width, and the item, fill, and stroke opacities, draw nothing for an item
                  without paint, and fill the surface with the background of the scene first; and shall
                  keep the stroke safe for any specified number: a stroke width, dash offset, or dash
                  entry that is finite as a double but not as a float is validated after the conversion
                  (an unusable width draws nothing, an overflowing offset counts as zero), and a dash
                  pattern that is unusable after the conversion, finer than a quarter of a surface pixel,
                  or longer than 50000 estimated dashes on a path is drawn solid, so that no such value
                  escapes as an exception or makes the stroker do unbounded work.
                justification: |
                  Fill, stroke, and opacity are the basic paint of every mark and guide, and a chart
                  specification may carry any number as a stroke width, dash, or offset, which must not be
                  able to stop or stall the renderer.
                tests:
                  - ScenePainter_Paint_RectAndRuleHonorsFillStrokeOpacity
                  - ScenePainter_Paint_NoPaintDrawsNothingAndBackgroundFillsTheSurface
                  - ScenePainter_Paint_PathologicalDashPatternsFallBackToSolid
                  - ScenePainter_Paint_ValuesOutsideTheFloatRangeAreSafe

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-ClipScale
                title: >-
                  The ScenePainter unit shall apply the uniform scale and offset of the placement and
                  clip group content to the clip rectangle with fractional per-pixel coverage, exact on
                  integer edges, intersecting nested clips and limiting memory to the pixel box of the
                  clip.
                justification: |
                  Scaling and clipping decide where every pixel of a fitted or clipped chart falls.
                tests:
                  - ScenePainter_Paint_ClipAndScaleMatchAnalyticPixels
                  - ScenePainter_Paint_FractionalAndNestedClipsUseCoverage

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Gradient
                title: >-
                  The ScenePainter unit shall fill an item that has a gradient with the core linear gradient, its
                  start and end placed on the bounding box of the item's path and mapped to pixels with the
                  placement of the item, with the fill opacity scaling every stop, the end colors continuing
                  beyond the stops, hard steps preserved, and no fallback to the solid fill when the gradient
                  is transparent, but a fallback to the solid fill for a gradient that has no usable stop or
                  whose geometry is not finite; and shall paint the same pixels every time.
                justification: |
                  The color legend draws its bar with a gradient fill, and the colors of the bar are the
                  evidence of a continuous color scale, so the pixels must follow the stops and the geometry.
                tests:
                  - ScenePainter_Paint_GradientFillRunsAlongTheItemBox
                  - ScenePainter_Paint_GradientFollowsTheScaleAndTheEnclosingGroup
                  - ScenePainter_Paint_GradientOpacityReplacementAndFallback
                  - ScenePainter_Paint_GradientOnGroupSymbolAndPath
                  - ScenePainter_Paint_GradientIsDeterministic

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Symbols
                title: >-
                  The ScenePainter unit shall draw symbols whose area and bounds follow the Vega symbol
                  shapes (and, for a shape that is SVG path data, the path of the SymbolPathParser unit, or a
                  circle when it does not parse), polylines and polygons, rounded rectangles, and the filled and stroked
                  background of a group with crisp half-pixel stroke alignment.
                justification: |
                  The point-like marks and the view border are drawn by these items.
                tests:
                  - ScenePainter_Paint_SymbolsCoverTheirDocumentedArea
                  - ScenePainter_SymbolPath_ShapesHaveVegaBounds
                  - ScenePainter_SymbolPath_DrawsCustomPathsAndFallsBackToACircle
                  - ScenePainter_IsSymbolShape_KnowsTheDrawnShapes
                  - ScenePainter_Paint_PathsRoundedRectanglesAndGroupBackgroundAreCrisp

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Text
                title: >-
                  The ScenePainter unit shall draw text with the font resolved by the text measurer, at
                  the baseline, alignment, rotation, and scale of the item, truncated to the limit with
                  an ellipsis, and without stroking the text.
                justification: |
                  Labels and titles are drawn by these items and must sit exactly where the layout
                  measured them.
                tests:
                  - ScenePainter_Paint_TextUsesBaselineRotationAndScale
                  - ScenePainter_Paint_TextLimitTruncatesTheDrawnLine

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Arguments
                title: >-
                  The ScenePainter unit shall reject invalid arguments (a null scene, a size outside the
                  surface limits) and stop with an OperationCanceledException when the cancellation token
                  is canceled, leaving the ownership of the surface with the caller.
                justification: |
                  The painter is the last step of Render; its failures must be predictable and must not
                  leak surfaces.
                tests:
                  - ScenePainter_Paint_InvalidArgumentsAndCancellation

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-CurvedPaths
                title: >-
                  The ScenePainter unit shall draw a path item that has segments as the outline of its moves, lines,
                  and cubic Beziers - filled with the nonzero rule and stroked through the curve, each move starting
                  a separate subpath and a command after a close continuing at the start of the closed subpath - and
                  shall draw nothing for a path with a segment that has a coordinate that is not finite (and for an
                  arc or a trail with a parameter that is not finite).
                justification: |
                  The line and area marks are drawn from their segments; the painter must follow the curve and
                  must not be stopped by a value that is not a number.
                tests:
                  - ScenePainter_Paint_SegmentPathStrokesThroughItsCubicCurve
                  - ScenePainter_Paint_ClosedSegmentPathFillsItsInterior
                  - ScenePainter_Paint_MoveToSegmentsStartSeparateSubpaths
                  - ScenePainter_Paint_NonFiniteSegmentsArcsAndTrailsDrawNothing

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Arcs
                title: >-
                  The ScenePainter unit shall draw an arc item by filling the outline that the ArcGeometry unit
                  builds for its radii, angles, pad angle, and corner radius, translated to its center, so that the
                  wedge is covered and the hole of a donut is empty, with the stroke, the opacities, and the
                  placement scale of any other item.
                justification: |
                  The pie and donut charts are drawn by the arc item; its pixels must be the wedge and nothing
                  else, at any scale.
                tests:
                  - ScenePainter_Paint_ArcFillsOnlyItsWedgeAndLeavesTheHoleEmpty
                  - ScenePainter_Paint_ArcStrokeAndOpacityFollowTheItem
                  - ScenePainter_Paint_PathsAndArcsScaleWithThePlacement

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Trails
                title: >-
                  The ScenePainter unit shall draw a trail item as the union of the capsules between its
                  consecutive points - each as wide as the size of its end points, as Vega's trail does - so that
                  its width follows the size of each point, shall break the trail at the boundary of a run and at a
                  point with no usable size, and shall draw a circle for coincident points; a translucent trail
                  that is painted in several chunks (an unusually large trail) shall be composited once, so that
                  its capsules do not composite twice at the joints of the chunks, as Vega paints one path, with
                  the cancellation token still polled before every chunk; the coverage layers that do this shall
                  exist only for a trail of several chunks and only for the paints that need them (a solid fill that
                  is translucent, and a drawn stroke that is translucent or follows a layered fill, to keep the
                  order of fill and stroke; an opaque fill is painted directly), shall be charged against a pixel
                  budget before they are allocated (a trail whose layers would be larger being painted chunk by
                  chunk), shall grow only by the points that can be drawn, and shall ignore a stroke width that is
                  never drawn.
                justification: |
                  A trail is a line whose width varies with the data; the capsules are what make the width change
                  smoothly and the runs are how a gap breaks the trail, and a large translucent trail must not
                  show the seams of the implementation nor allocate memory that nothing bounds, nor memory that
                  its paints do not need.
                tests:
                  - ScenePainter_Paint_TrailWidthFollowsTheSizeOfEachPoint
                  - ScenePainter_Paint_TrailBreaksAtRunBoundariesAndDrawsCapsForCoincidentPoints
                  - ScenePainter_Paint_TranslucentTrailInSeveralChunksHasNoSeam
                  - ScenePainter_Paint_TranslucentTrailOutlineInSeveralChunksHasNoSeam
                  - ScenePainter_Paint_TranslucentTrailBeyondTheSurfaceEdgeHasNoSeam
                  - ScenePainter_Paint_OpaqueTrailInSeveralChunksIsBlackAlongTheWholeRow
                  - ScenePainter_Paint_TrailLayerPixelsAreChargedAgainstTheBudgetAndFallBackBeyondIt
                  - ScenePainter_Paint_TrailLayersIgnoreAStrokeWidthThatIsNotDrawn
                  - ScenePainter_Paint_OpaqueFillWithTranslucentStrokeIsChargedOneLayer
                  - ScenePainter_Paint_TranslucentFillWithOpaqueStrokeKeepsTheStrokeAboveTheFill
                  - ScenePainter_Paint_FullyTransparentFillIsNotLayered
                  - ScenePainter_Paint_TrailThatEndsAtTheFirstChunkBoundaryAllocatesNoLayers
                  - ScenePainter_Paint_TranslucentTrailBeyondTheTargetAllocatesNoLayers
                  - ScenePainter_Paint_PointsThatCannotBeDrawnDoNotGrowTheLayerBox
                  - ScenePainter_TrailLayerPixelBudget_DefaultIsBoundedBelowTheLayersOfTheLargestTarget

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-MiterLimit
                title: >-
                  The ScenePainter unit shall stroke with the stroke miter limit of the item (the Vega default of 4
                  when it has none, a value below 1 or that is not finite treated as 1, and a value above 1000 as
                  1000), so that a sharp join is beveled beyond the limit, and shall give a path the dash, cap,
                  join, and dash offset of its item.
                justification: |
                  The strokeMiterLimit, strokeCap, strokeJoin, and strokeDashOffset properties decide the corners
                  of lines and outlines, and an extreme limit must not make the stroker misbehave.
                tests:
                  - ScenePainter_Paint_StrokeMiterLimitBevelsASharpJoin
                  - ScenePainter_Paint_PathStrokeHonorsDashCapJoinAndOffset

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Bounds
                title: >-
                  The ScenePainter unit shall bound the cost of painting every item with one magnitude bound of
                  32,768 surface pixels (the value times the scale of the placement): it shall draw nothing for
                  a path with an end point, an arc with a center, radius, or corner radius, a trail point with a
                  coordinate or size, a text with a position, offset, font size, or line height, a group with an
                  offset, or a stroke with a width that is not finite or is beyond the bound; it shall draw a
                  cubic with a control point beyond the bound as a line to its end point; it shall paint a trail
                  in chunks of a bounded estimated cost and poll the cancellation token before each chunk; and it
                  shall never throw for such values (in particular not for a font size that is finite as a double
                  and infinity as a single).
                justification: |
                  A coordinate or size that overflows a single, or that is beyond the precision of the core
                  filler, makes the flattening of one curve cost seconds and cannot be interrupted, and a
                  font size of 1e300 made the core text renderer throw; the cost of one item must be bounded
                  and the painting must honor cancellation.
                tests:
                  - ScenePainter_Paint_SegmentsBeyondTheMagnitudeBoundDrawNothingOrBecomeLines
                  - ScenePainter_Paint_ArcsBeyondTheMagnitudeBoundDrawNothing
                  - ScenePainter_Paint_TrailPointsBeyondTheMagnitudeBoundEndTheRun
                  - ScenePainter_Paint_TrailIsPaintedInChunksWithACancellationPollBetweenThem
                  - ScenePainter_Paint_GroupBeyondTheMagnitudeBoundDrawsNothing
                  - ScenePainter_Paint_TheBoundAppliesToTheSizeInSurfacePixels
                  - ScenePainter_Paint_TextBeyondTheMagnitudeBoundDrawsNothingAndNeverThrows
                  - ScenePainter_IsDrawable_Text_FollowsTheSharedRule
                  - ScenePainter_Paint_TextWithZeroFontSizeDrawsNothing

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-Images
                title: >-
                  The ScenePainter unit shall draw a SceneImage with the rules of Vega's image mark - the width of
                  the box is the width of the item, else the height times the aspect ratio of the picture when the
                  aspect is kept, else the natural width (and symmetrically for the height), the anchor moves the box
                  by half of it for center and middle and by all of it for right and bottom, a box without area draws
                  nothing, a picture of another aspect ratio than a box with both dimensions is fitted inside it and
                  centered unless the aspect is off, the opacity of the item is multiplied into the picture, a
                  picture that is not smoothed keeps hard edges, the picture is clipped by the clip of its group, and
                  an item that is not finite, is beyond the magnitude bound, has a negative size or no opacity or
                  has no link is neither drawn nor asked for - and shall ask for a picture at the size of its box in
                  device pixels at every scale, a raster (as the resolver says, never as the size of the answer
                  suggests) keeping its own pixels as scene units, also when its size equals the request, and a
                  picture drawn for the request having the default natural size of 256 units.
                justification: |
                  A picture is only readable where Vega-Lite would put it, at the size it asks for, and a picture
                  must never be loaded for an item that cannot be drawn.
                tests:
                  - ScenePainter_Paint_ImageWithoutSize_DrawsNaturalSizeAtLeftTop
                  - ScenePainter_Paint_ImageAnchor_MovesTheNaturalBox
                  - ScenePainter_Paint_ImageWithSize_AsksForTheBoxInDevicePixels
                  - ScenePainter_Paint_RasterWithoutSize_ScalesWithThePlacement
                  - ScenePainter_Paint_VectorWithoutSize_HasTheDefaultNaturalSize
                  - ScenePainter_Paint_RasterThatEqualsTheRequestAtScaleTwo_IsDrawnAtItsNaturalSize
                  - ScenePainter_Paint_VectorDrawnForTheRequestAtScaleTwo_CoversTheRequestedDevicePixels
                  - ScenePainter_Paint_RasterThatEqualsTheRequestInOneDimension_KeepsItsOwnAspect
                  - SceneImageSource_Get_ResolverThatDoesNotSay_GivesNoKindAndCachesTheKindOfOneThatDoes
                  - ScenePainter_Paint_ImageWithOneDimension_FollowsTheAspectRule
                  - ScenePainter_Paint_ImageInBoxOfOtherAspect_IsFittedAndCentered
                  - ScenePainter_Paint_PictureOfTheRequestedSize_FillsTheBox
                  - ScenePainter_Paint_ImageOpacity_BlendsOverTheBackground
                  - ScenePainter_Paint_ImageInClippedGroup_IsCut
                  - ScenePainter_Paint_ImageWithoutSmoothing_KeepsHardEdges
                  - ScenePainter_Paint_EmptyImage_IsNotAskedFor
                  - ScenePainter_Paint_WithoutLoader_SkipsPictures

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-ImageLoading
                title: >-
                  The ScenePainter unit shall load the pictures of a painting through the SceneImageSource of the
                  painting, which asks the caller's IImageResolver once for each link and device size (the answer
                  shared by the items that ask for it), counts the questions against MaxImages and fails the call
                  that would exceed it with the location of the mark, reports a link the resolver did not give as the
                  warning vl-mark-image-unresolved once for the link, never asks when there is no resolver, lets an
                  exception of the resolver propagate unchanged, and disposes every surface the resolver returned
                  when the painting ends or fails.
                justification: |
                  The resolver contract allows no caching and returns a fresh surface for every call, so a chart that
                  shows one icon for every point must not ask once for every point; a specification must not be
                  able to make the host load pictures without bound; and every picture is memory that must be released.
                tests:
                  - SceneImageSource_Get_CachesWithinOnePaintingAndDisposesEverySurface
                  - SceneImageSource_Get_BeyondTheLimit_FailsAtTheMark
                  - SceneImageSource_Get_ResolverGivesNothing_ReportsOnceAndDrawsNothing
                  - ScenePainter_Paint_WithoutResolver_DrawsNothingAndReportsNothing
                  - SceneImageSource_Get_ResolverThrows_PropagatesUnchanged
                  - SceneImageSource_Get_KeyIncludesTheDeviceSize

              - id: CanvasNetVegaLite-Scenegraph-ScenePainter-PaintBudget
                title: >-
                  The ScenePainter unit shall count the device pixels that a painting fills, strokes and draws against
                  the paint limit it was given (VegaLiteLimits.MaxPaintedPixels) before it does the work of each item -
                  the box of a fill cut to the surface (or to the clip layer that the item is drawn on), the box of a
                  stroke grown by half its width, the estimated box of text, the box of a picture and the pixels of
                  each resampled copy that is made, and the pixels of a clip layer and of the layers of a translucent
                  trail - charging nothing for an item outside the surface, accepting a total exactly at the limit,
                  and failing the painting with a VegaLiteRenderException that names VegaLiteLimits.MaxPaintedPixels
                  and is located at the item or at the nearest enclosing group that has a location (the marks group
                  of a mark has the location of the mark) before the item that did not fit is painted; shall count
                  nothing when it has no limit; and shall make the resampled or translucent copy of a picture once for
                  the items that draw the same picture at the same size and opacity, keeping at most a bounded number
                  of pixels of copies.
                justification: |
                  The number of scene items does not bound the area they cover: marks of a million square pixels,
                  strokes thousands of pixels wide and pictures without a size are cheap to describe and take minutes
                  to paint, so a hostile specification would otherwise exhaust time without breaking any other limit.
                tests:
                  - ScenePainter_Paint_FullSurfaceRects_AreChargedTheirBoxBeforeThePaint
                  - ScenePainter_Paint_ItemThatDoesNotFit_IsNotPainted
                  - ScenePainter_Paint_FailureIsLocatedAtTheItemOrTheNearestLocatedGroup
                  - ScenePainter_Paint_BoxIsCutToTheSurface_AndAnItemOutsideCostsNothing
                  - ScenePainter_Paint_StrokeIsChargedItsBoxGrownByHalfTheWidth
                  - ScenePainter_Paint_FillAndStrokeAreTwoCharges
                  - ScenePainter_Paint_ClipLayerAndItsContentAreCharged
                  - ScenePainter_Paint_TextIsChargedAnEstimatedBox
                  - ScenePainter_Paint_TextWithANonPositiveLineHeight_IsChargedEveryLine
                  - ScenePainter_Paint_ArcsAtTheEdge_AreChargedAtLeastTheirVisibleArea
                  - ScenePainter_Paint_TranslucentTrailInSeveralChunksIsChargedItsFillInTheLayer
                  - ScenePainter_Paint_WithoutALimit_CountsNothing
                  - ScenePainter_Paint_LimitIsPerPainting
                  - ScenePainter_Paint_PictureBox_IsChargedBeforeItIsDrawnAndLocatedAtTheMark
                  - ScenePainter_Paint_NonSmoothPictureCopy_IsMadeOnceForTheItemsThatShareIt
                  - SceneImageSource_GetTile_SharesCopiesAndBoundsWhatItKeeps
                  - VegaLiteDocument_Render_ImageMarkWithoutSize_IsBoundedByThePaintLimitAndResamplesOnce
