---
# Software Unit Requirements for EncodingPlan
#
# These requirements describe the design-level behavior of the EncodingPlan unit of the Transforms subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Transforms): the implicit data pipeline of a single view
# that Vega-Lite derives from the encoding - the bins of a binned position channel, the time units of a temporal
# channel, the aggregate of an aggregated channel, the impute of a missing key, and the stack of a stacked
# measure (cartesian or polar) - split into the analysis
# of the specification that needs no data (EncodingPlan.cs: the names of the derived fields, the default axis
# titles, the stack decision, the path grouping fields, and the order fields) and its execution on the
# transformed table (EncodingTransforms.cs), which runs
# the AggregateTransforms engine, the bin algorithm, and the TimeUnitTransform unit. The scales, marks, and axes
# read the plan and the resulting tables, so that they agree on which
# field each channel draws. The naming and title rules follow Vega-Lite behavior, attributed in
# src/DemaConsulting.CanvasNet.VegaLite/third-party/README.md. See
# docs/verification/canvas-net-vega-lite/transforms/encoding-plan.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Transforms Requirements
        sections:
          - title: EncodingPlan Requirements
            requirements:
              - id: CanvasNetVegaLite-Transforms-EncodingPlan-FieldNames
                title: >-
                  The EncodingPlan unit shall decide from the specification alone, before any data is read,
                  which field each channel of the drawn view reads and which field holds its second end: the
                  field of the definition as written, the Vega-Lite name of a derived field (the bin start
                  bin_maxbins_10_x with its _end and _range companions, an aggregate such as sum_x, __count for a
                  count of records, the _start and _end of a stack, and the field of the row that argmax or
                  argmin returns), and no field for a datum or a value, asking for no bin, aggregate, or stack
                  when the encoding has none.
                justification: |
                  Scales, marks, and axes must agree on which field each channel draws, and the names of the
                  derived fields are how Vega-Lite specifications and its documentation refer to them.
                tests:
                  - EncodingPlan_Create_NamesAndTitlesAggregatesAndPlainFields
                  - EncodingPlan_Create_NamesABinByItsParametersAndField
                  - EncodingPlan_Create_DiscreteBinReadsTheRangeText
                  - EncodingPlan_Create_DatumAndValueChannelsReadNoField
                  - EncodingPlan_Create_ArgMaxReadsTheFieldOfTheReturnedRow
                  - EncodingPlan_Create_IdentityPlansAskForNothing

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-ImplicitAggregate
                title: >-
                  The EncodingPlan unit shall, for an encoding whose channels carry an aggregate, group the
                  transformed rows by every other field definition of the encoding (including the arrays of
                  detail and tooltip channels, without repeating a field, and the start and end of a binned
                  channel) and compute the aggregate of each aggregated channel per group, in first-seen
                  group order, giving one row for an encoding without a field to group by and no row for an
                  empty table, a count without a field, and the field of the winning row for argmax and
                  argmin.
                justification: |
                  A bar chart of a sum per category, written as an encoding, must draw the same bars that the
                  explicit aggregate transform would give, without the author writing the transform.
                tests:
                  - EncodingPlan_Create_AggregateGroupsByEveryOtherFieldDefinition
                  - EncodingPlan_Create_AggregateGroupsByTheBoundariesOfABin
                  - EncodingTransforms_Apply_AggregatesPerCategoryInFirstSeenOrder
                  - EncodingTransforms_Apply_AggregateWithoutDimensionsIsOneRowAndEmptyInputHasNone
                  - EncodingTransforms_Apply_ArgMaxReadsTheFieldOfTheWinningRow

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-ImplicitBin
                title: >-
                  The EncodingPlan unit shall, for an x or y channel with bin set, add to every row the start
                  and end of its bin (computed once for each field and parameter combination and shared by the
                  channels that use it, 10 bins at most unless maxbins, step, extent, nice, base, divide,
                  steps, minstep, or anchor say otherwise), keep the rows of an encoding that only bins, give
                  a value that cannot be binned no bounds (all such rows forming one group when aggregated),
                  turn the bins of a nominal or ordinal channel into text categories ordered by bin start, and
                  leave an already binned field (bin set to binned) as it is.
                justification: |
                  A histogram is a bar chart of counts per bin; the bins must be those of Vega-Lite so that the
                  same specification draws the same bars.
                tests:
                  - EncodingPlan_Create_SharesABinBetweenChannelsByFieldAndParameters
                  - EncodingTransforms_Apply_BinsAndCountsAHistogram
                  - EncodingTransforms_Apply_BinOnlyKeepsRowsAndLeavesInvalidValuesWithoutABin
                  - EncodingTransforms_Apply_InvalidValuesFormOneGroupWithoutBounds
                  - EncodingTransforms_Apply_BinStepAndExtentParameters
                  - EncodingTransforms_Apply_OrdinalBinsAreTextCategoriesOrderedByStart

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-BinnedChannels
                title: >-
                  The EncodingPlan unit shall, for a color, fill, stroke, size, opacity, fillOpacity,
                  strokeOpacity, strokeWidth, strokeDash, shape, or angle channel with bin set and a field
                  that is not aggregated, add the bin of the field as for a position channel with Vega-Lite's
                  default of 6 bins (4 for strokeDash, 10 for angle) when neither maxbins nor step is given,
                  name it by those parameters, share it with the channels that bin the same field the same
                  way, group an aggregate by its start and end, give a quantitative field the start of the
                  bin and its end and a nominal or ordinal field the text of the bin (formatted with the
                  format of the legend), and read bin set to binned on x and y only.
                justification: |
                  A color or size that shows a binned measure must use the bins of Vega-Lite so that the
                  same specification draws the same classes; the bin of a histogram and of its color must be
                  one bin.
                tests:
                  - EncodingPlan_Create_BinsTheChannelsThatHaveAScaleWithTheirDefaultMaxBins
                  - EncodingPlan_Create_DiscreteBinOfAnotherChannelReadsTheRangeTextWithTheLegendFormat
                  - EncodingPlan_Create_DiscreteBinReadsTheRangeText
                  - EncodingTransforms_Apply_BinsAColorChannelAndSharesTheBinWithX
                  - EncodingTransforms_Apply_NonPositionBinsUseTheirDefaultMaxBinsAndTheRangeTextOfDiscreteFields
                  - EncodingTransforms_Apply_NonPositionBinsAreChargedAndCancellable
              - id: CanvasNetVegaLite-Transforms-EncodingPlan-StackRules
                title: >-
                  The EncodingPlan unit shall, when the Vega-Lite rules make the measure channel of an encoding
                  stack, stack it within each group of the other position channel (and of the end of its bin),
                  into a start and an end field named after the measure, with the layers divided by the color,
                  detail, and order channels but never by the dimension field itself, ordered by the order
                  channel when there is one and otherwise by the layer fields - ascending on x and descending
                  on y so that the first layer is at the bottom - and with the offsets zero (negative values
                  stacking down), center, and normalize.
                justification: |
                  Stacked bars are the default form of a bar chart with a color; the order of the layers and
                  the sign handling decide what the reader sees.
                tests:
                  - EncodingPlan_Create_DecidesTheStackLikeVegaLite
                  - EncodingPlan_Create_StackNamesAndGroupsFollowTheMeasure
                  - EncodingPlan_Create_OrdersTheLayersLikeVegaLite
                  - EncodingPlan_Create_StackByExcludesTheDimensionField
                  - EncodingPlan_Create_BarWithTwoMeasuresStacksTheAggregatedOne
                  - EncodingTransforms_Apply_StacksTheAggregatedLayersDescendingOnY
                  - EncodingTransforms_Apply_StacksAscendingOnX
                  - EncodingTransforms_Apply_StacksNegativeValuesDownwards
                  - EncodingTransforms_Apply_SignedStacksOnXAndWithAggregatedNegativeSums
                  - EncodingPlan_Create_AreaMarkStacksSignedValuesLikeABar
                  - EncodingTransforms_Apply_NormalizeAndCenterOffsets
                  - EncodingTransforms_Apply_OrderChannelOrdersTheLayers

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-Titles
                title: >-
                  The EncodingPlan unit shall give each channel the Vega-Lite default title of its definition -
                  the field name, Sum of x (or SUM(x) under the functional title format) for an aggregate,
                  Count of Records for a count of records, x (binned) for a bin, and the verbal forms of the
                  other operations - merging the titles of the two ends of a range into one, and following the
                  field-title and count-title settings of the configuration.
                justification: |
                  The axis title is the first thing that tells a reader what a derived value is; without a
                  title that follows Vega-Lite the author would have to write a title for every aggregate.
                tests:
                  - EncodingPlan_Create_NamesAndTitlesAggregatesAndPlainFields
                  - EncodingPlan_Create_TitlesFollowTheConfiguration
                  - EncodingPlan_Create_MergesTheTitlesAndFieldsOfARange

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-RawAndMain
                title: >-
                  The EncodingPlan unit shall give the later stages the table that the marks draw (after the
                  bins, the aggregate, and the stack) and, when a scale reads the rows before the aggregate (a
                  sort by a field or an operation, an unaggregated domain), also the table before it,
                  returning the one transformed table itself when the encoding has no bin, aggregate, or stack.
                justification: |
                  Sorting a category by a measure or showing the unaggregated extent needs the rows as they
                  were; an encoding that changes nothing must cost nothing and change no row.
                tests:
                  - EncodingPlan_Create_FlagsTheEncodingsThatReadTheRawTable
                  - EncodingTransforms_Apply_KeepsTheRawRowsWhenAScaleNeedsThem
                  - EncodingTransforms_Apply_IdentityReturnsTheInputAndChecksArguments

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-Limits
                title: >-
                  The EncodingPlan unit shall count the rows of the groups it creates (and those of a stack
                  that sits next to the kept raw table) in the row budget of the call as they appear, before
                  they are allocated, with the input rows still counted, shall bound the bins by the
                  scale-domain limit, shall charge its work to the evaluation-step budget, and shall fail with
                  a located VegaLiteRenderException (at the channel or at the bin) when a limit is exceeded,
                  accepting exactly the limit.
                justification: |
                  An encoding can multiply or retain the rows of a chart as an explicit transform can; the cost
                  must be bounded before it is spent and the failure must point at the encoding.
                tests:
                  - EncodingTransforms_Apply_CountsTheGroupsInTheRowBudget
                  - EncodingTransforms_Apply_StackNextToRawRowsCountsTheRows
                  - EncodingTransforms_Apply_BoundsTheBinsAndChargesTheRows
                  - EncodingTransforms_Apply_NonPositionBinsAreChargedAndCancellable

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-Cancellation
                title: >-
                  The EncodingPlan unit shall observe the cancellation token of the call while it bins,
                  aggregates, and stacks, and stop with an OperationCanceledException without delivering a
                  partial table.
                justification: |
                  Aggregating a large table can take noticeable time, and callers must be able to abandon it.
                tests:
                  - EncodingTransforms_Apply_PollsTheCancellationToken

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-Determinism
                title: >-
                  The EncodingPlan unit shall give the same plan and the same tables for the same
                  specification, input, and parameters on repeated calls and from several threads, independent
                  of the culture, time zone, and platform, naming derived fields and bin categories with
                  invariant number text.
                justification: |
                  Reproducibility is a system contract; a derived name or a bin label that depended on the
                  culture would break golden tests.
                tests:
                  - EncodingTransforms_Apply_IsDeterministicAndCultureInvariant

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-TimeUnits
                title: >-
                  The EncodingPlan unit shall, for a channel whose field has a time unit (and no bin or
                  aggregate), name its derived start field as Vega-Lite does (yearmonth_date,
                  utcmonth_date, month_step_2_date, and timeunit_maxbins_10_date) with its _end companion,
                  share one derived field between the channels that read the same field and unit, give the
                  field a band end only when its mark spans the unit (a bar, rect, or tick on a temporal
                  position channel without a secondary channel, and never a point, an ordinal channel, or a
                  bin), title it with the verbal or functional default (date (year-month),
                  YEARMONTH(date), UTCYEARMONTH(date), and TIMEUNIT(date) for maxbins), let a bin win over a
                  unit, group an aggregate by the start (and the end when it spans), and place the time unit
                  step between the bin and the aggregate of the pipeline (bin, time unit, aggregate,
                  stack) in the time calendar of the chart, handing the resolved unit of a maxbins form to
                  the scales and marks.
                justification: |
                  Scales, marks, and axes must agree on which derived field a time unit channel draws and
                  on whether the bar spans its unit; Vega-Lite specifies the names, the titles, and the order.
                tests:
                  - EncodingPlan_Create_NamesATimeUnitFieldAndItsEnd
                  - EncodingPlan_Create_ObjectFormNames
                  - EncodingPlan_Create_MarksWithABandPositionSpanTheirUnit
                  - EncodingPlan_Create_BarWithTimeUnit_HasBandEnd_PointWithTimeUnit_HasNoBandEnd
                  - EncodingPlan_Create_OrdinalTimeUnit_HasNoBandEnd
                  - EncodingPlan_Create_SecondaryChannel_SuppressesBandEnd
                  - EncodingPlan_Create_TitlesVerbalFunctionalPlain
                  - EncodingPlan_Create_AggregateGroupsByTimeUnitStart
                  - EncodingPlan_Create_BinWinsOverTimeUnit
                  - EncodingPlan_Create_SharedAndDistinctUnits
                  - EncodingPlan_Create_StackUsesTheTimeUnitFields
                  - EncodingPlan_Create_WithoutAnEncodingThereAreNoUnits
                  - EncodingTransforms_TimeUnitThenAggregate_CountsByMonth
                  - EncodingTransforms_TimeUnitThenAggregate_PointHasNoEndField
                  - EncodingTransforms_BinThenTimeUnitThenAggregate_ThenStack
                  - EncodingTransforms_StackByTimeUnitField
                  - EncodingTransforms_SortByAggregate_KeepsTheUnitFieldsInTheRawTable
                  - EncodingTransforms_MaxBins_HandsOnTheResolvedUnit
                  - EncodingTransforms_TimeUnit_FollowsTheCalendarOfTheChart
                  - EncodingTransforms_WithoutTimeUnits_HasNoUnits
                  - EncodingTransforms_TimeUnit_FailureIsLocatedAtTheChannelUnit

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-ConditionalFields
                title: >-
                  The EncodingPlan unit shall read the field, aggregate, bin, type, scale, and legend of a
                  channel whose own definition is a value from the first condition on a test that holds a
                  field, as Vega-Lite reads the field definition of a conditional channel, while a channel
                  that has a field of its own keeps it and a condition that holds only values, or a
                  parameter, reads none.
                justification: |
                  A color that is conditional on a test but mapped from a field elsewhere draws a scale and a
                  legend from that field; the plan must name the same field as the scale and the legend.
                tests:
                  - EncodingPlan_Create_FieldInAConditionIsTheFieldOfTheChannel

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-PolarStack
                title: >-
                  The EncodingPlan unit shall stack the theta channel of an arc (or text) mark within each group
                  of the radius channel - and the radius channel within each group of theta when theta is not
                  the stacked field - into a start and an end field named after the measure, with the same layer
                  fields, offsets, and ascending layer order as the horizontal stack, linking the secondary
                  channels theta2 and radius2 to their main channels as x2 and y2 are linked, deciding no stack
                  for a ranged polar mark, and not grouping the stack by the stacked field itself (a radial chart
                  that reads theta and radius from one field).
                justification: |
                  A pie chart is a stacked theta; the slices must follow one another around the circle as the
                  layers of a bar follow one another along the axis.
                tests:
                  - StackRules_Decide_StacksThetaWithRadiusAsTheDimension
                  - StackRules_Decide_RangedPolarMarkIsNotStacked
                  - EncodingPlan_Create_PlansAPolarStackWithAscendingLayers
                  - EncodingPlan_Create_PolarDimensionAndOrderDecideTheStackGroups
                  - EncodingPlan_Create_LinksTheSecondaryPolarChannels
                  - EncodingPlan_Create_CartesianStackKeepsPrecedenceOverPolar
                  - EncodingPlan_Create_StackDoesNotGroupByTheStackedField

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-PathGroups
                title: >-
                  The EncodingPlan unit shall list, from the specification alone, the fields that group the rows
                  of a path mark into paths, as Vega-Lite's path grouping fields do (the value fields of the
                  definitions that do not aggregate of detail, key, color, fill, stroke, the opacity channels,
                  stroke dash, stroke width, size - but not for a trail, whose size is per point - and order -
                  but not for a line or a trail - each field once, in the order of the channels) and the fields
                  and directions of the order channel.
                justification: |
                  The marks, the encoding impute, and the stack impute must agree on which rows form one path.
                tests:
                  - EncodingPlan_PathGroupFields_FollowVegaLiteGroupingRules
                  - EncodingPlan_OrderFields_ListTheOrderChannelWithDirections

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-EncodingImpute
                title: >-
                  The EncodingPlan unit shall execute the impute property of an x or y definition that has both
                  position field definitions - after the aggregate and before the stack - with the other position
                  field as the key, the path group fields as the groups, and the method (value, mean, median, max,
                  or min), the constant value (0 by default), the frame, and the keyvals of the definition,
                  through the AggregateTransforms impute engine, and shall refuse a keyvals list longer than the
                  scale-domain limit with a located specification error.
                justification: |
                  Imputing a missing combination turns a gap of a line into an explicit value; the encoding
                  property must act as the impute transform does.
                tests:
                  - EncodingPlan_Impute_PlansFieldKeyAndPathGroups
                  - EncodingTransforms_Apply_ImputesBeforeTheStack
                  - EncodingTransforms_Apply_ImputeMethodMeanUsesTheGroupWindow
                  - EncodingTransforms_Apply_ImputeOnXUsesYAsTheKey
                  - EncodingTransforms_Apply_ImputeObjectParametersReachTheEngine
                  - SpecParser_Parse_RejectsABadImputeObjectWithItsLocation

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-StackImpute
                title: >-
                  The EncodingPlan unit shall impute the stacked field with zero for every missing combination of
                  a stack-by group and a dimension key before the stack of a line, area, or trail (so that every layer
                  has a vertex at every key and the layers meet), unless the definition says impute null, the
                  dimension is binned (the FeatureCatalog warning vl-encoding-stack-impute-bin), has a band end, or
                  the stack has no stack-by field.
                justification: |
                  A stacked area whose layers lack a key would pinch to nothing between its neighbors; Vega-Lite
                  imputes the missing keys, and a layer must start where the one below it ends.
                tests:
                  - EncodingTransforms_Apply_StackedPathMarkImputesMissingKeysWithZero
                  - EncodingTransforms_Apply_ImputeNullDisablesTheStackImpute
                  - EncodingPlan_StackImpute_SkipsABinnedDimension

              - id: CanvasNetVegaLite-Transforms-EncodingPlan-ImputeLimits
                title: >-
                  The EncodingPlan unit shall bound the encoding and stack impute by the row limit and the cell
                  limit of the call (counting the appended rows, and the number of groups times keys, before it
                  materializes them), charge its work to the evaluation-step budget, and observe the cancellation
                  token, failing with a located VegaLiteRenderException when a limit is exceeded.
                justification: |
                  An impute multiplies the groups by the keys; the cost must be bounded before it is spent and a
                  caller must be able to abandon it.
                tests:
                  - EncodingTransforms_Apply_ImputeRespectsTheRowAndCellLimits
                  - EncodingTransforms_Apply_ImputePollsCancellation
                  - EncodingTransforms_Apply_ImputeBoundsSeriesTimesKeys
