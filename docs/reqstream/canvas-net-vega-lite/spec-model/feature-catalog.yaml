---
# Software Unit Requirements for FeatureCatalog
#
# These requirements describe the design-level behavior of the FeatureCatalog unit of the SpecModel subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.SpecModel): the visitor that walks a parsed
# specification and reports, with stable vl-* identifiers, every recognized construct that the renderer does
# not draw, plus the schema-version and empty-data warnings. The supported sets are the Supported* fields of
# the unit; a construct that becomes supported is removed from the reported set in the same change. See
# docs/verification/canvas-net-vega-lite/spec-model/feature-catalog.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: SpecModel Requirements
        sections:
          - title: FeatureCatalog Requirements
            requirements:
              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-StableIds
                title: >-
                  The FeatureCatalog unit shall report each unsupported construct with a stable
                  lower-case identifier built from its category and name (for example vl-transform-window
                  or vl-composition-layer, with spec names lower-cased and stripped of separators), a
                  message, and the pointer, line, and column of the construct, and shall return the
                  reports in document order.
                justification: |
                  Tools and builds react to specific gaps by identifier, so identifiers must never change
                  silently, and reports in document order make output stable.
                tests:
                  - FeatureCatalog_Visit_RecognizedUnsupportedPropertiesReturnsStableIds
                  - FeatureCatalog_Visit_MarkReportCarriesLineAndColumn
                  - FeatureCatalog_Visit_ReportsAreInDocumentOrder

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-SupportedSilent
                title: >-
                  The FeatureCatalog unit shall return no report for a specification that uses only the
                  supported subset and shall not report channels or properties that Vega-Lite does not
                  define or that the renderer deliberately ignores (tooltip, href, description, key).
                justification: |
                  Reporting a supported construct would make every chart noisy, and reporting an unknown
                  name as unsupported would hide the typo warning that is the better diagnostic.
                tests:
                  - FeatureCatalog_Visit_SupportedSpecificationHasNoReports
                  - FeatureCatalog_Visit_UnknownChannelIsNotReported
                  - FeatureCatalog_Visit_ChannelsReportExceptSupportedAndIgnored

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-RemoteUrl
                title: >-
                  The FeatureCatalog unit shall classify a data URL that carries a scheme (including a file:
                  URI), a UNC path, a drive letter, or an absolute or rooted path (a leading slash or
                  backslash, on every host operating system) as remote and report it with the stable
                  vl-data-remote-url identifier, and shall classify a plain relative URL as a local file
                  that it does not report, because the data stage reads it (a local file that cannot be
                  read is an error of the render, not a report).
                justification: |
                  A remote URL must never reach a file resolver or the network, and the difference between
                  a remote and a local reference is the difference between a security boundary and a
                  supported feature.
                tests:
                  - FeatureCatalog_Visit_RemoteUrlsRemainVlDataRemoteUrl
                  - FeatureCatalog_IsSchemeBearingUrl_ClassifiesUrls

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-DataSources
                title: >-
                  The FeatureCatalog unit shall not report a data source or format that the data stage
                  reads (inline rows, a relative local url, the csv, tsv, dsv, and json formats, a
                  parse map, a format property, a named dataset, and a sequence), shall report the data
                  that is recognized but not read with its own identifier (text values, geographic
                  sources, and a top-level dataset that a data name refers to given as text or as an
                  object), shall report a custom date format of a parse entry with the stable identifier
                  vl-data-parse-date-format, and shall warn with vl-data-empty when a data object has no
                  rows.
                justification: |
                  Data that was not used must be explained to the author instead of leaving an unexplained
                  empty chart, and data that is used must not make every chart noisy.
                tests:
                  - FeatureCatalog_Visit_LocalUrlsAndPhase4FormatsAreSupported
                  - FeatureCatalog_Visit_DataSourcesReportTheirOwnIdentifiers
                  - FeatureCatalog_Visit_CustomDateFormatReportsStableIdentifier
                  - FeatureCatalog_Visit_RemoteUrlsRemainVlDataRemoteUrl

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-MarksAndChannels
                title: >-
                  The FeatureCatalog unit shall report every mark other than bar, rect, point, circle,
                  square, rule, and tick as vl-mark-type, every channel other than x, y, color, fill,
                  stroke, size, and opacity as vl-channel-name, the temporal and geographic types, and the
                  encoding properties aggregate, bin, timeUnit, stack, sort (for the forms that are not
                  supported), condition, impute, and
                  bandPosition when they change the chart, including an implicit bar stack at the
                  measure channel.
                justification: |
                  Marks and channels are the heart of the supported boundary; each unsupported one must be
                  named so that the author knows exactly what was not drawn.
                tests:
                  - FeatureCatalog_Visit_UnsupportedMarkReportsMarkId
                  - FeatureCatalog_Visit_ChannelsReportExceptSupportedAndIgnored
                  - FeatureCatalog_Visit_EncodingPropertiesReportOnlyWhenTheyChangeTheChart
                  - FeatureCatalog_Visit_ImplicitBarStackIsReportedAtTheMeasure

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-ScalesAndGuides
                title: >-
                  The FeatureCatalog unit shall report scale types other than linear, band, point, and
                  ordinal, scale properties and color schemes outside the supported set, a legend only
                  when one would be drawn, and the guide properties and encode blocks that the axis
                  builder does not honor, and shall not report the properties it does honor.
                justification: |
                  Scales and guides decide how data is positioned and labeled; a silently ignored property
                  would produce a plausible but wrong chart.
                tests:
                  - FeatureCatalog_Visit_ScaleTypesAndPropertiesReportOutsideTheSupportedSubset
                  - FeatureCatalog_Visit_ColorSchemesAndContinuousColorsReportOutsideTheSupportedSubset
                  - FeatureCatalog_Visit_AxisPropertiesReportOnlyTheUnsupportedOnes
                  - FeatureCatalog_Visit_LegendsAreReportedOnlyWhenOneWouldBeDrawn

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-TransformsAndCompositions
                title: >-
                  The FeatureCatalog unit shall report each transform of a later phase (aggregate,
                  joinaggregate, window, bin, stack, impute, timeUnit, regression, loess, density, quantile,
                  and extent) as vl-transform-name, every transform and every variable parameter of a nested
                  view that is not drawn, each selection parameter (vl-param-selection), the conditional
                  encodings (vl-encoding-condition), each projection, composition (layer, concat, hconcat,
                  vconcat, facet, repeat), and autosize fit mode, shall examine the nested views of a
                  composition, shall report each construct once at its own location, and shall not report
                  the transforms calculate, filter, fold, flatten, sample, pivot, and lookup or the variable
                  parameters of the drawn view.
                justification: |
                  A construct that changes what a chart means and that the renderer does not implement must be
                  reported rather than skipped, and one that it implements must not make every chart noisy.
                tests:
                  - FeatureCatalog_Visit_TransformsExpressionsAndParametersAreReported
                  - FeatureCatalog_Visit_SupportedPhase5TransformsAndParametersAreNotReported
                  - FeatureCatalog_Visit_LaterPhaseTransformsConditionsAndSelectionsStayReported
                  - FeatureCatalog_Visit_NestedViewTransformsAndVariableParametersAreReported
                  - FeatureCatalog_Visit_CompositionsAreReportedAndNestedViewsExamined
                  - FeatureCatalog_Visit_AutosizeFitModesAreReported

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-ExpressionConstructs
                title: >-
                  The FeatureCatalog unit shall report, at the string value of the expression and with the
                  offset inside the text in the message, each call of a function outside the whitelist as
                  vl-expr-function-name (the name as written), each use of view state (signal, event, item,
                  and an undeclared width, height, padding, autosize, background, or cursor) as
                  vl-expr-view-state, and each deferred operator as vl-expr-construct-name, and shall report
                  an expression reference at a site that the renderer does not evaluate (the title, the
                  size, the padding, the background, the view, a mark property or channel value outside the
                  row-bound set) as vl-expr-ref and an axis labelExpr as vl-expr-label, but not an expression
                  reference at a site that is evaluated.
                justification: |
                  An expression construct that evaluates to null or is not evaluated would silently change the
                  chart; each must be reported by an identifier that names exactly what was not run.
                tests:
                  - FeatureCatalog_Visit_UnsupportedExpressionConstructsAreReportedAtTheExpression
                  - FeatureCatalog_Visit_ExpressionReferencesAreReportedOnlyAtDeferredSites

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-TransformParts
                title: >-
                  The FeatureCatalog unit shall report the parts of a supported transform that the renderer
                  does not execute - a filter on a selection parameter or a selection (vl-transform-filter-param),
                  a time unit or a date object in a filter predicate (vl-transform-filter-timeunit and
                  vl-transform-filter-datetime), a pivot operation other than sum and count
                  (vl-transform-pivot-op), and a lookup from a parameter (vl-transform-lookup-param) - and a
                  channel sort that is not ascending, descending, null, a value list, or an aggregate sort
                  object (vl-encoding-sort), and shall not report the supported forms.
                justification: |
                  A supported transform that silently ignored part of its definition would draw a plausible
                  but different chart; the ignored part must be named.
                tests:
                  - FeatureCatalog_Visit_UnsupportedPartsOfSupportedTransformsAreReported
                  - FeatureCatalog_Visit_SortByFieldIsReportedOnlyForUnsupportedForms

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-SchemaVersion
                title: >-
                  The FeatureCatalog unit shall warn with vl-schema-version, at the $schema value, when the
                  schema names a Vega-Lite major version other than 5 or 6 or names no Vega-Lite version,
                  and shall not warn for versions 5 and 6 or for a specification without a schema.
                justification: |
                  The renderer implements the version 6 defaults; a specification written for another
                  version may render differently and its author should be told.
                tests:
                  - FeatureCatalog_Visit_SchemaVersionWarnsOutsideFiveAndSix
