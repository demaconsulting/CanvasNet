---
# Software Unit Requirements for FeatureCatalog
#
# These requirements describe the design-level behavior of the FeatureCatalog unit of the SpecModel subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.SpecModel): the visitor that walks a parsed
# specification and reports, with stable vl-* identifiers, every recognized construct that the renderer does
# not draw, plus the schema-version and empty-data warnings. The supported sets are the Supported* fields of
# the unit; a construct that becomes supported is removed from the reported set in the same change (Phase 6
# removed the reports of aggregate, stack, bin on x and y, the aggregating transforms, and the secondary
# channels of bars, rects, and rules, and added the reports of the parts of them that stay unsupported; Phase 8
# removed the reports of the temporal type, the time unit, the timeUnit transform, the time scale types, the
# time unit and date object tests, and the custom date format, and added the reports of the parts of the time
# phase that stay unsupported; Phase 9 removed the reports of the marks line, area, trail, text, and arc, of
# the channels text, theta, radius, theta2, radius2, order, and detail, and of the impute of x and y, and added the
# reports of the invalid modes and the bundle area, and narrowed the channel reports to the marks that do not draw
# the channel). Phase 10 removed the reports of the layer composition and of the marks boxplot, errorbar, and
# errorband, reworded the report of a transform of a view that is not drawn, and added the reports of the properties
# a layer ignores, of the grouping channels of a composite mark, and of the error channels of the other marks). Phase 11
# removed the reports of the concat, hconcat, vconcat, repeat, and facet compositions and of the transform of a view
# that is not drawn (every composition is drawn), narrowed the row, column, and facet channel reports to a unit view
# that cannot be faceted, retired the report of the autosize types fit, fit-x, and fit-y (they are drawn), and added the
# warnings about the properties that a composition ignores and the reports of the parts of a facet that are not drawn
# (vl-facet-field-transform, vl-facet-sort, vl-header-orient). See
# docs/verification/canvas-net-vega-lite/spec-model/feature-catalog.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: SpecModel Requirements
        sections:
          - title: FeatureCatalog Requirements
            requirements:
              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-StableIds
                title: >-
                  The FeatureCatalog unit shall report each unsupported construct with a stable
                  lower-case identifier built from its category and name (for example vl-transform-regression
                  or vl-composition-hconcat, with spec names lower-cased and stripped of separators), a
                  message, and the pointer, line, and column of the construct, and shall return the
                  reports in document order.
                justification: |
                  Tools and builds react to specific gaps by identifier, so identifiers must never change
                  silently, and reports in document order make output stable.
                tests:
                  - FeatureCatalog_Visit_RecognizedUnsupportedPropertiesReturnsStableIds
                  - FeatureCatalog_Visit_MarkReportCarriesLineAndColumn
                  - FeatureCatalog_Visit_ReportsAreInDocumentOrder

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-SupportedSilent
                title: >-
                  The FeatureCatalog unit shall return no report for a specification that uses only the
                  supported subset and shall not report channels or properties that Vega-Lite does not
                  define or that the renderer deliberately ignores (tooltip, href, description, key).
                justification: |
                  Reporting a supported construct would make every chart noisy, and reporting an unknown
                  name as unsupported would hide the typo warning that is the better diagnostic.
                tests:
                  - FeatureCatalog_Visit_SupportedSpecificationHasNoReports
                  - FeatureCatalog_Visit_UnknownChannelIsNotReported
                  - FeatureCatalog_Visit_ChannelsReportExceptSupportedAndIgnored

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-RemoteUrl
                title: >-
                  The FeatureCatalog unit shall classify a data URL that carries a scheme (including a file:
                  URI), a UNC path, a drive letter, or an absolute or rooted path (a leading slash or
                  backslash, on every host operating system) as remote and report it with the stable
                  vl-data-remote-url identifier, and shall classify a plain relative URL as a local file
                  that it does not report, because the data stage reads it (a local file that cannot be
                  read is an error of the render, not a report).
                justification: |
                  A remote URL must never reach a file resolver or the network, and the difference between
                  a remote and a local reference is the difference between a security boundary and a
                  supported feature.
                tests:
                  - FeatureCatalog_Visit_RemoteUrlsRemainVlDataRemoteUrl
                  - FeatureCatalog_IsSchemeBearingUrl_ClassifiesUrls

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-DataSources
                title: >-
                  The FeatureCatalog unit shall not report a data source or format that the data stage
                  reads (inline rows, a relative local url, the csv, tsv, dsv, and json formats, a
                  parse map, a format property, a named dataset, and a sequence), shall report the data
                  that is recognized but not read with its own identifier (text values, geographic
                  sources, and a top-level dataset that a data name refers to given as text or as an
                  object), shall not report a custom date format of a parse entry (date or utc with a d3 time
                  format, which the data stage applies), and shall warn with vl-data-empty when a data object has no
                  rows.
                justification: |
                  Data that was not used must be explained to the author instead of leaving an unexplained
                  empty chart, and data that is used must not make every chart noisy.
                tests:
                  - FeatureCatalog_Visit_LocalUrlsAndPhase4FormatsAreSupported
                  - FeatureCatalog_Visit_DataSourcesReportTheirOwnIdentifiers
                  - FeatureCatalog_Visit_CustomDateFormatIsSupportedAndReportsNothing
                  - FeatureCatalog_Visit_RemoteUrlsRemainVlDataRemoteUrl

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-MarksAndChannels
                title: >-
                  The FeatureCatalog unit shall report every mark other than bar, rect, point, circle,
                  square, rule, tick, line, area, trail, text, arc, boxplot, errorbar, and errorband as
                  vl-mark-type, every channel other than
                  x, y, theta, radius, theta2, radius2, text, color, fill, stroke, size, opacity, shape,
                  strokeWidth, strokeDash, fillOpacity, strokeOpacity, angle, xError, xError2, yError, and
                  yError2 (and the accepted and ignored
                  tooltip, href, description, and key) as vl-channel-name, the channels of a mark that does not
                  draw them (as vl-channel-name, the channel being ignored; a shape of a line, area, trail, or
                  rule that has a point overlay, which a shape switches on unless point is false or null, is not
                  reported, and an angle, a stroke dash, or a size that only the overlay points draw is reported
                  with a message that says so), the overlays being decided with the effective configuration of the
                  rendering (the caller's included) when there is one, the geographic types, and the
                  encoding properties impute (on a channel other than x and y) and bandPosition when they change
                  the chart (a bandPosition of a field without a time unit), but not the temporal type, the time
                  unit, the properties aggregate, stack, and sort (in its supported forms), the impute of x and
                  y, and the bin of x, y, and the channels that have a scale (which the renderer draws), and no
                  implicit bar stack; shall
                  accept the
                  secondary channels x2 and y2 of a bar, rect, rule, or area that has the channel they extend and
                  report them (vl-channel-x2 and vl-channel-y2) for any other mark or without it; shall
                  accept the order and detail channels on every mark without a report; and shall report the
                  bin of a channel that cannot bin (vl-encoding-bin: a secondary channel and
                  order) and a bin: "binned" on a channel other than x and y (vl-encoding-bin), a bin extent that is a
                  parameter (vl-encoding-bin-extent-param), and an explicit stack of a scale that is not
                  linear (vl-encoding-stack-nonlinear; Vega-Lite does not stack on a log, pow, sqrt, or symlog
                  scale, so such marks are not stacked).
                justification: |
                  Marks and channels are the heart of the supported boundary; each unsupported one must be
                  named so that the author knows exactly what was not drawn, and one that is drawn must not
                  be reported.
                tests:
                  - FeatureCatalog_Visit_UnsupportedMarkReportsMarkId
                  - FeatureCatalog_Visit_ChannelsReportExceptSupportedAndIgnored
                  - FeatureCatalog_Visit_ShapeAngleAndDashChannelsAreReportedForMarksThatDoNotDrawThem
                  - FeatureCatalog_Visit_EncodingPropertiesReportOnlyWhenTheyChangeTheChart
                  - FeatureCatalog_Visit_ImplicitBarStackIsNotReported
                  - FeatureCatalog_Visit_OrderChannelIsAcceptedForEveryMark
                  - FeatureCatalog_Visit_SecondaryPositionChannelsAreAcceptedForRanges
                  - FeatureCatalog_Visit_StackOnANonLinearScaleIsReported
                  - FeatureCatalog_Visit_Phase6FeaturesAreNotReportedAndRemainingPartsAre
                  - FeatureCatalog_Visit_BinOnScaleChannelsAndTheBinOrdinalScaleAreSupported
                  - FeatureCatalog_Visit_ReportsChannelsThatTheMarkDoesNotDraw
                  - FeatureCatalog_Visit_ShapeOfAPathMarkWithAPointOverlayIsNotReported
                  - FeatureCatalog_Visit_ReportsFollowTheEffectiveConfiguration
                  - FeatureCatalog_Visit_VisitsTheDefinitionOfAChannelThatAnOverlayDraws

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-PathMarks
                title: >-
                  The FeatureCatalog unit shall not report the line, area, and trail marks, shall report the
                  invalid modes that the renderer cannot draw (vl-mark-invalid-show for show and for null, at the
                  value), warn that the filter modes should leave the invalid rows out of the scale domains
                  (vl-mark-invalid-domains, for filter and break-paths-filter-domains), report an area with the
                  bundle interpolation (vl-mark-interpolate-bundle-area, drawn with the linear interpolation) and a
                  line or area whose interpolation is not one of the fifteen names of Vega-Lite
                  (vl-mark-interpolate-unknown, drawn with the linear interpolation), read the invalid mode and
                  the interpolation as the mark builder does (the mark definition, then the styles, config.<mark>,
                  and config.mark of the specification) and report one that comes from the configuration at the
                  configuration, once, keep
                  reporting geoshape and image, report the impute of a channel other than x and y
                  (vl-encoding-impute), and warn that a stacked path mark does not impute a binned dimension
                  (vl-encoding-stack-impute-bin).
                justification: |
                  A path mark that is drawn must not make every chart noisy, and the parts of it that are not drawn
                  as Vega-Lite draws them must be named where they are written, whether the mark or the
                  configuration writes them; a value from the configuration that is not reported would be
                  silently ignored, and the strict mode could not stop it.
                tests:
                  - FeatureCatalog_Report_LineAreaTrailAreSupportedAndGeoshapeImageAreNot
                  - FeatureCatalog_Report_ChannelGatingFollowsTheSupportTable
                  - FeatureCatalog_Report_InvalidShowDomainsAndBundleAreaIds
                  - FeatureCatalog_Report_ConfigValuesOfInvalidAndInterpolateAreReportedAtTheConfig
                  - FeatureCatalog_Report_ImputeIsReportedOnlyOutsideXAndY
                  - FeatureCatalog_Report_StackImputeBinWarnsAboutABinnedDimension

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-TextMark
                title: >-
                  The FeatureCatalog unit shall not report the text mark or its text channel, shall report the
                  text channel of any other mark as not drawn (vl-channel-text), accept a bin on the text channel,
                  and report a custom format type of a text channel (vl-format-type-custom, at the format type,
                  the default format being used).
                justification: |
                  A label that is drawn must not be reported; a text channel that nothing draws, and a format that
                  the renderer replaces, must be named.
                tests:
                  - FeatureCatalog_Report_TextIsSupportedAndItsChannelsAreGated

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-ArcMark
                title: >-
                  The FeatureCatalog unit shall not report the arc mark or the theta, radius, theta2, and radius2
                  channels of a mark that draws them (theta and radius for arc and text, theta2 and radius2 for
                  arc), shall report them as not drawn (vl-channel-name) on any other mark, shall accept the band
                  position of a stacked theta or radius of a text mark, and shall check the stack of a polar
                  channel on a scale that is not linear (vl-encoding-stack-nonlinear).
                justification: |
                  A pie or donut chart is drawn without a report, and a polar channel that a mark ignores must be
                  named where it is written.
                tests:
                  - FeatureCatalog_Report_ArcIsSupportedAndPolarChannelsAreGated

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-ScalesAndGuides
                title: >-
                  The FeatureCatalog unit shall report scale types other than linear, log, pow, sqrt, symlog,
                  time, utc, sequential, band, point, ordinal, quantile, quantize, threshold, and bin-ordinal, scale
                  properties outside the supported set (the bins property, but not the properties of the
                  continuous color scales or the base, exponent, and constant of the log, pow, and symlog
                  scales), a cubehelix interpolation
                  (vl-scale-interpolate-cubehelix), a shape that is a custom path (vl-shape-path), the legend
                  properties that the legend builder does not draw (encode, a format type other than
                  number, time, and utc, a title
                  orient other than top, clipHeight, and a custom symbol path), and the guide properties and
                  encode blocks that the axis builder does not honor, shall warn (vl-scale-type-ignored) about
                  a scale type that the channel
                  or the field type cannot use (the bin-ordinal type is accepted for a binned quantitative
                  color only, and a temporal field accepts only time and utc), and shall not report the
                  continuous color scales, the color
                  schemes, the legends (which are drawn), or the properties it does honor (the identifiers
                  vl-scale-color-ramp and vl-guide-legend are retired).
                justification: |
                  Scales and guides decide how data is positioned and labeled; a silently ignored property
                  would produce a plausible but wrong chart.
                tests:
                  - FeatureCatalog_Visit_ScaleTypesAndPropertiesReportOutsideTheSupportedSubset
                  - FeatureCatalog_Visit_LogPowSqrtAndSymlogScalesAreSupported
                  - FeatureCatalog_Visit_BinOnScaleChannelsAndTheBinOrdinalScaleAreSupported
                  - FeatureCatalog_Visit_ContinuousColorsAndSchemesAreSupported
                  - FeatureCatalog_Visit_CubehelixInterpolationIsReported
                  - FeatureCatalog_Visit_CustomPathShapesAreReported
                  - FeatureCatalog_Visit_ScaleTypeIgnoredWarnsAboutTypesThatCannotBeUsed
                  - FeatureCatalog_Visit_SchemeNamesAreNotReported
                  - FeatureCatalog_Visit_AxisPropertiesReportOnlyTheUnsupportedOnes
                  - FeatureCatalog_Visit_LegendsAreDrawnAndOnlyTheirUnsupportedPropertiesAreReported

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-TransformsAndCompositions
                title: >-
                  The FeatureCatalog unit shall report each transform of a later phase (regression,
                  loess, density, quantile, and extent) as vl-transform-name ("not supported yet"), every
                  variable parameter of a nested view (also in a concat, hconcat, vconcat, facet, or repeat),
                  each selection parameter (vl-param-selection), the conditions on a parameter
                  (vl-encoding-condition-param), each projection, shall examine the
                  nested views of a composition, shall report each construct once at its own location, and
                  shall not report the layer, concat, hconcat, vconcat, facet, and repeat compositions (the
                  stable identifiers vl-composition-concat, -hconcat, -vconcat, -repeat, and -facet are retired),
                  an autosize of fit, fit-x, or fit-y (the family vl-layout-autosize-type is retired and never
                  reused),
                  or the transforms calculate, filter, fold, flatten, sample, pivot, lookup, aggregate,
                  joinaggregate, window, bin, timeUnit, stack, and impute of any view (the single view, a
                  layered view and its layers, and the views of a concatenation, a facet, or a repeat), and shall
                  never say that a transform is not applied because of a composition.
                justification: |
                  A construct that changes what a chart means and that the renderer does not implement must be
                  reported rather than skipped, and one that it implements must not make every chart noisy.
                tests:
                  - FeatureCatalog_Visit_TransformsExpressionsAndParametersAreReported
                  - FeatureCatalog_Visit_SupportedPhase5TransformsAndParametersAreNotReported
                  - FeatureCatalog_Visit_LaterPhaseTransformsConditionsAndSelectionsStayReported
                  - FeatureCatalog_Visit_NestedViewTransformsAreAppliedAndVariableParametersAreReported
                  - FeatureCatalog_Visit_NestedViewAggregatingTransformsAreAppliedInConcatAndFacet
                  - FeatureCatalog_Visit_Phase6FeaturesAreNotReportedAndRemainingPartsAre
                  - FeatureCatalog_Visit_ConcatFacetAndRepeatAreDrawnAndNestedViewsExamined
                  - FeatureCatalog_Visit_ConcatAndRepeatAreNotReported
                  - FeatureCatalog_Visit_AutosizeTypesAreNotReported
                  - FeatureCatalog_Visit_TopLevelTransformOfLayerSpecIsNotReported
                  - FeatureCatalog_Visit_TransformOfComposedViewIsAppliedAndNotReported
                  - FeatureCatalog_Visit_TransformOfFacetViewIsAppliedAndNotReported
                  - FeatureCatalog_Visit_TransformOfLayerInsideConcatAndFacetIsApplied
                  - FeatureCatalog_Visit_TransformOfLaterPhaseInLayerIsNotSupportedYet
                  - FeatureCatalog_Visit_LayerTransformsReportOnlyTheirUnsupportedParts

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-FacetReports
                title: >-
                  The FeatureCatalog unit shall not report a facet or a unit view with a row, column, or facet
                  channel (the stable identifier vl-composition-facet is retired), shall report a row, column, or
                  facet channel only of a unit view that cannot be faceted (a layer, a layered view whose encoding
                  holds it, or the spec of a facet) as vl-channel-row, vl-channel-column, or vl-channel-facet, and
                  shall report, at the property, a bin, time unit, or aggregate of a facet field
                  (vl-facet-field-transform), a facet sort that is an object (vl-facet-sort), a header labelOrient
                  or titleOrient on a side that the header does not draw (vl-header-orient), a custom header
                  formatType (vl-format-type-custom), and an expression in a facet (vl-expr-ref), and shall not report a
                  header labelExpr (it is drawn; only its unsupported constructs are reported at its text).
                justification: |
                  A facet whose field is binned, sorted by an aggregate, or whose header is placed on a side that
                  is not drawn would otherwise look as if the author's setting took effect; the catalog is the single
                  place that names it.
                tests:
                  - FeatureCatalog_Visit_FacetAndFacetedUnitViewAreNotReported
                  - FeatureCatalog_Visit_RowColumnChannelInLayerOrFacetSpecStillReported
                  - FeatureCatalog_Visit_FacetFieldTransformIsReported
                  - FeatureCatalog_Visit_FacetSortByAggregateIsReported
                  - FeatureCatalog_Visit_HeaderOrientExprAndFormatTypeAreReported

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-CompositionReports
                title: >-
                  The FeatureCatalog unit shall warn (vl-composition-property-ignored, at the property) about a
                  width, height, or autosize other than pad of a concatenation, a facet, or a repeat of rows,
                  columns, or values, about a container size of a view inside one, and about a padding, background,
                  config, datasets, or autosize of a view inside one (a fit autosize or a container size of a
                  composition is thus warned about and not drawn; the vl-layout-fit-step warning for a fit that a step
                  size drops comes from the layout, as the scales decide it); shall visit the merged encoding of every
                  chart of a concatenation or a repeat once, as the renderer draws it; and shall document the
                  warnings that the renderer produces from the view tree (vl-concat-axis-shared,
                  vl-composition-columns-ignored, vl-repeat-ref-unresolved) as identifiers that the catalog itself
                  never produces, so that each is delivered once.
                justification: |
                  Vega-Lite drops these properties of a composition with a warning, so a chart that sets them
                  would otherwise look as if they took effect; the catalog is the single place that names a
                  construct the renderer does not honor.
                tests:
                  - FeatureCatalog_Visit_CompositionPropertiesIgnoredAreWarnedAbout
                  - FeatureCatalog_Visit_NestedViewPropertiesIgnoredAreWarnedAbout
                  - FeatureCatalog_Visit_RepeatedUnitEncodingIsVisitedPerCopy
                  - FeatureCatalog_Visit_ConcatChildEncodingIsVisitedOnce
                  - FeatureCatalog_Visit_TreeWarningsAreLeftToTheRenderer

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-LayerReports
                title: >-
                  The FeatureCatalog unit shall not report the layer composition (the stable identifier
                  vl-composition-layer is retired), shall visit the encoding that a layer inherits once for each
                  layer, with that layer's mark, reporting a construct of an inherited channel once at the
                  location where it is written, and shall warn (vl-layer-property-ignored, at the property)
                  about a width, height, autosize, padding, background, config, datasets, or title of a view
                  inside a layered view, which only the top-level view decides.
                justification: |
                  A layered chart is drawn, so it must not be reported; a channel that one layer draws and
                  another does not must be judged by the mark that uses it, and a property that a layer
                  ignores must be named where it is written.
                tests:
                  - FeatureCatalog_Visit_LayerCompositionIsNeverReported
                  - FeatureCatalog_Visit_InheritedEncodingIsVisitedPerLayerAndReportedOnce
                  - FeatureCatalog_Visit_LayerPropertiesOfTheTopLevelViewAreWarnedAboutInALayer
                  - FeatureCatalog_Visit_TopLevelTransformOfLayerSpecIsNotReported

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-CompositeMarks
                title: >-
                  The FeatureCatalog unit shall not report the boxplot, errorbar, and errorband marks (the stable
                  identifiers vl-mark-boxplot, vl-mark-errorbar, and vl-mark-errorband are retired) or their
                  channels (the x2 and y2 ends of the two error marks, the xError, xError2, yError, and yError2
                  channels of them, and the shape, angle, and strokeDash channels of the outliers of a boxplot),
                  shall report a bin, a time unit, or an aggregate of a channel that groups the rows of a
                  composite mark (vl-composite-grouping, at the channel), shall report the error channels of any
                  other mark as ignored (vl-channel-xerror, vl-channel-xerror2, vl-channel-yerror, and
                  vl-channel-yerror2), and shall report the size channel of an errorbar as not drawn.
                justification: |
                  A composite mark that is drawn must not make every chart noisy, but the parts of a specification
                  that the expansion cannot honor must be named where they are written.
                tests:
                  - FeatureCatalog_Visit_BoxPlotIsSupportedWithItsChannels
                  - FeatureCatalog_Visit_BinOrTimeUnitOfAGroupingChannelIsReported
                  - FeatureCatalog_Visit_AggregateOfAGroupingChannelIsReportedButNotTheMeasure
                  - FeatureCatalog_Visit_GroupingReportFollowsTheOrientationAndLayers
                  - FeatureCatalog_Visit_UndecidableBoxPlotAndRetiredIdentifier
                  - FeatureCatalog_Visit_ErrorBarAndErrorBandAreSupportedWithTheirChannels
                  - FeatureCatalog_Visit_ErrorChannelsOfOtherMarksAreReported
                  - FeatureCatalog_Visit_ErrorBarReportsTheChannelsItDoesNotDraw
                  - FeatureCatalog_Visit_ErrorBarGroupingIsReportedAtTheGroupingChannel

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-ExpressionConstructs
                title: >-
                  The FeatureCatalog unit shall report, at the string value of the expression and with the
                  offset inside the text in the message, each call of a function outside the whitelist as
                  vl-expr-function-name (the name lower-cased, and as written in the message), each use of
                  view state (signal, event, item,
                  and an undeclared width, height, padding, autosize, background, or cursor) as
                  vl-expr-view-state, and each deferred operator as vl-expr-construct-name, and shall report
                  an expression reference at a site that the renderer does not evaluate (the title, the
                  size, the padding, the background, the view, a mark property or channel value outside the
                  row-bound set) as vl-expr-ref, but not an expression reference at a site that is evaluated, and shall
                  report the same constructs, with the same identifiers and at the text of the labelExpr, in the
                  labelExpr
                  of an axis, a legend, and a facet header and of config.axis*, config.header*, and config.axis (the
                  identifier vl-expr-label is retired: it is never produced again and never reused), without reporting
                  a labelExpr whose expression is supported and without reading config.legend.labelExpr, which
                  Vega-Lite does not read.
                justification: |
                  An expression construct that evaluates to null or is not evaluated would silently change the
                  chart; each must be reported by an identifier that names exactly what was not run.
                tests:
                  - FeatureCatalog_Visit_UnsupportedExpressionConstructsAreReportedAtTheExpression
                  - FeatureCatalog_Visit_DifferentlyCasedFunctionNames_ShareOneLowerCaseIdentifier
                  - FeatureCatalog_Visit_ExpressionReferencesAreReportedOnlyAtDeferredSites
                  - FeatureCatalog_Visit_SupportedLabelExpressionsAreNotReported
                  - FeatureCatalog_Visit_LabelExpressionConstructsAreReportedAtTheText
                  - FeatureCatalog_Visit_ConfigLegendLabelExprIsIgnored

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-TransformParts
                title: >-
                  The FeatureCatalog unit shall report the parts of a supported transform that the renderer
                  does not execute - a filter on a selection parameter or a selection (vl-transform-filter-param),
                  a pivot operation other than sum and count
                  (vl-transform-pivot-op), a lookup from a parameter (vl-transform-lookup-param), and a bin
                  transform whose extent is a parameter (vl-transform-bin-extent-param) - and a channel sort
                  that is not ascending, descending, null, a value list, or a sort by an operation or a channel
                  that the renderer computes (vl-encoding-sort), and shall not report the supported forms.
                justification: |
                  A supported transform that silently ignored part of its definition would draw a plausible
                  but different chart; the ignored part must be named.
                tests:
                  - FeatureCatalog_Visit_UnsupportedPartsOfSupportedTransformsAreReported
                  - FeatureCatalog_Visit_SortByFieldIsReportedOnlyForUnsupportedForms
                  - FeatureCatalog_Visit_Phase6FeaturesAreNotReportedAndRemainingPartsAre

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-SortDiagnostics
                title: >-
                  The FeatureCatalog unit shall report a sort by a channel that the encoding does not have
                  (or that reads no field) as vl-encoding-sort with a message that names the channel and says
                  that the categories are sorted ascending, report a sort by an operation that cannot order
                  categories as vl-encoding-sort with the operation message, and warn with
                  vl-encoding-sort-ignored, at the sort, when a sort array, a channel shorthand, or a sort
                  object with a field, an operation, or an encoding is given on a quantitative field whose
                  scale is continuous - and shall not warn for ascending, descending, null, an object that
                  has only an order, a discrete field, or a discrete scale type.
                justification: |
                  A sort that does nothing must say why: the specification, not the renderer, is the problem,
                  and the message must name what to fix without hiding it behind a generic unsupported text.
                tests:
                  - FeatureCatalog_Visit_SortOfAMissingChannelNamesTheChannel
                  - FeatureCatalog_Visit_SortOnAContinuousScaleIsIgnoredWithAWarning
                  - FeatureCatalog_Visit_SortByFieldIsReportedOnlyForUnsupportedForms
                  - CanvasNetVegaLite_SystemIntegration_Sort_MalformedSortReportsLocatedDiagnosticsAndNeverCrashes

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-SchemaVersion
                title: >-
                  The FeatureCatalog unit shall warn with vl-schema-version, at the $schema value, when the
                  schema names a Vega-Lite major version other than 5 or 6 or names no Vega-Lite version,
                  and shall not warn for versions 5 and 6 or for a specification without a schema.
                justification: |
                  The renderer implements the version 6 defaults; a specification written for another
                  version may render differently and its author should be told.
                tests:
                  - FeatureCatalog_Visit_SchemaVersionWarnsOutsideFiveAndSix

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-ConditionalEncodings
                title: >-
                  The FeatureCatalog unit shall not report a condition with a test on the color, fill, stroke,
                  opacity, fill opacity, stroke opacity, stroke width, stroke dash, size, shape, and angle
                  channels, shall report vl-encoding-condition for a condition on a channel that takes none,
                  vl-encoding-condition-param for a condition or a test on a parameter that is not a variable
                  parameter (a time unit or a date object in a test is evaluated and not reported), each
                  at the construct, and shall visit the expressions and the field properties of a condition
                  like those of a channel.
                justification: |
                  A condition that the renderer cannot evaluate must be reported where it is, and one that it
                  evaluates must not be reported at all.
                tests:
                  - FeatureCatalog_Visit_ConditionsWithATestAreNotReported
                  - FeatureCatalog_Visit_ParameterConditionsAreReported
                  - FeatureCatalog_Visit_TimeUnitAndDateTestsAreSupported
                  - FeatureCatalog_Visit_ConditionOnAChannelThatTakesNoneIsReported
                  - FeatureCatalog_Visit_ConditionExpressionsAndFieldPropertiesAreVisited
                  - FeatureCatalog_Visit_LaterPhaseTransformsConditionsAndSelectionsStayReported

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-TimeIds
                title: >-
                  The FeatureCatalog unit shall report, with stable identifiers and through the same sink, the
                  parts of the time phase that the renderer does not draw - a binned time unit (a name that starts
                  with binned, or binned true) as vl-timeunit-binned at the value, the maxbins form of a time
                  unit in a predicate as vl-timeunit-maxbins, a band position or a time unit band position
                  other than one half on a bar or rect with a time unit as vl-encoding-bandposition-rect, a
                  band position on a field with neither a time unit nor a bin as vl-encoding-bandposition, a
                  datetime object as the datum of a channel as vl-encoding-datum-datetime, and a format type
                  other than number, time, and utc as vl-format-type-custom - and shall warn, without ever
                  failing in strict mode, about a week or day-of-year part of the time unit of a predicate
                  (vl-predicate-timeunit-part), a time interval as nice or as the tick count on a scale that
                  is not a time scale (vl-scale-nice-interval and vl-guide-axis-tickcount-interval), a zero
                  property of a time scale (vl-scale-zero-ignored), and a scale type that a temporal field
                  cannot use (vl-scale-type-ignored); and shall no longer report the temporal type, a time unit
                  in an encoding, the timeUnit transform of the drawn view, the time scale types, a time unit
                  or datetime object in a filter predicate or condition test, and a custom date format
                  (the identifiers vl-type-temporal, vl-encoding-timeunit, vl-transform-timeunit,
                  vl-scale-time, vl-scale-utc, vl-transform-filter-timeunit, vl-transform-filter-datetime,
                  vl-encoding-condition-test, and vl-data-parse-date-format are retired).
                justification: |
                  A time construct that the renderer cannot draw must be named at the place it is written, and
                  one that it draws must not make every chart noisy; the names are what tools and builds react
                  to, so the retired ones must be gone and the new ones stable.
                tests:
                  - FeatureCatalog_Visit_TemporalFieldsAndTimeUnitsAreSupported
                  - FeatureCatalog_Visit_BinnedTimeUnitIsReportedAtTheValue
                  - FeatureCatalog_Visit_MaxBinsTimeUnitIsReportedInPredicatesOnly
                  - FeatureCatalog_Visit_BandPositionIdentifiers
                  - FeatureCatalog_Visit_DatumDatetimeIsReported
                  - FeatureCatalog_Visit_IntervalsOnScalesThatAreNotTimeScales
                  - FeatureCatalog_Visit_TimeAndUtcScaleTypesFollowVegaLite
                  - FeatureCatalog_Visit_ZeroOnATimeScaleIsAWarning
                  - FeatureCatalog_Visit_WeekAndDayOfYearPartsOfPredicatesAreWarnings
                  - FeatureCatalog_Visit_NestedTimeUnitTransformIsAppliedInConcatAndFacetAndRemovedIdsAreGone
                  - FeatureCatalog_Visit_TimeIdsAreDeliveredAndStrictModeThrows
                  - FeatureCatalog_Visit_FormatTypesNumberTimeAndUtcAreEvaluated

              - id: CanvasNetVegaLite-SpecModel-FeatureCatalog-OffsetReports
                title: >-
                  The FeatureCatalog unit shall not report the xOffset and yOffset channels of a view that draws them
                  (the offset of a nominal or ordinal position, a continuous offset of the marks other than bar and
                  area), shall report at the channel, with vl-offset-position, an offset whose position channel is
                  missing, is not nominal or ordinal, or has a time unit, and, with vl-offset-ranged, a continuous
                  (quantitative or temporal) offset of a bar or an area, each ignored when drawn, and shall warn with
                  vl-scale-type-ignored about a point scale type given to a position that holds an offset.
                justification: |
                  An offset that cannot be nested would draw ungrouped marks that look intended; the catalog must name
                  why the grouping is missing, and a supported offset must not make the chart noisy.
                tests:
                  - FeatureCatalog_Visit_OffsetsAreReportedOnlyWhenTheyAreNotDrawn
                  - FeatureCatalog_Visit_PointScaleOnAPositionWithOffsetWarns
