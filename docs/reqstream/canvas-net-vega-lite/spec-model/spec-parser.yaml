---
# Software Unit Requirements for SpecParser
#
# These requirements describe the design-level behavior of the SpecParser unit of the SpecModel subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.SpecModel): the bounded UTF-8 JSON reader that builds
# the immutable SpecNode tree with positions, the structural validation and unknown-property warnings in the
# partial file SpecParser.Validation.cs (including the properties of the line, area, trail, text, and arc marks and
# their overlay objects), the compilation of expressions and the validation of parameters and
# transforms in SpecParser.Transforms.cs (with the compiled expressions held by SpecExpressions.cs, and the compilation
# of the expression references of the static sites that the ExpressionReferenceFolder unit evaluates), the validation
# of the aggregating transforms (aggregate, joinaggregate, window, bin, stack, impute) and of the aggregate, bin,
# stack, sort, and impute of an encoding in SpecParser.Aggregates.cs, the validation of the time units, the datetime
# objects, the tick and nice intervals, the timeUnit transform, and the time predicates in SpecParser.Time.cs
# (with the predicate-to-expression translation of PredicateSource.cs), the validation of resolve and of the
# composite mark properties and of the compositions (facet, repeat, columns, spacing, align, center, header, and the
# repeat references) in SpecParser.Layers.cs, the compilation of the labelExpr of axes, legends, and headers and of the
# axis and header configuration in SpecParser.LabelExpressions.cs, and the
# SpecMetadata reader. See
# docs/verification/canvas-net-vega-lite/spec-model/spec-parser.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: SpecModel Requirements
        sections:
          - title: SpecParser Requirements
            requirements:
              - id: CanvasNetVegaLite-SpecModel-SpecParser-JsonTree
                title: >-
                  The SpecParser unit shall read JSON text (a string or UTF-8 bytes) into an immutable tree
                  of nodes of kind object, array, string, number, boolean, or null, with object
                  properties in document order, array items in order, finite numbers, and a leading
                  byte-order mark ignored, reading a very large inline data array in one pass, and shall
                  enumerate the views of the tree with parents before nested views.
                justification: |
                  A single immutable tree is the one representation every later stage reads, and its cost
                  must not grow faster than the size of the text.
                tests:
                  - SpecParser_Parse_ValidInlineSpecRecordsJsonPointerAndLineColumn
                  - SpecParser_Parse_AllValueKindsAndBomAreHandled
                  - SpecParser_Parse_LargeInlineDataIsReadInOnePass
                  - SpecTree_EnumerateViews_ListsNestedViewsParentsFirst

              - id: CanvasNetVegaLite-SpecModel-SpecParser-LocationTracking
                title: >-
                  The SpecParser unit shall give every node its RFC 6901 pointer (with ~0 and ~1
                  escaping), the one-based line and column of its value, and the position of its key,
                  counting columns in UTF-16 code units, and shall report malformed JSON with the
                  location of the first offending character.
                justification: |
                  Located diagnostics are only trustworthy when the positions are exact and computed by
                  one agreed rule.
                tests:
                  - SpecParser_Parse_MalformedJsonReportsFirstLocation
                  - SpecParser_Parse_LocationsCountUtf16CodeUnits
                  - SpecParser_Parse_ValidInlineSpecRecordsJsonPointerAndLineColumn
                  - SpecNode_ToString_DescribesKindPointerAndPosition

              - id: CanvasNetVegaLite-SpecModel-SpecParser-StructuralValidation
                title: >-
                  The SpecParser unit shall throw a located VegaLiteSpecException for text that is not a
                  Vega-Lite specification object, for bytes that are not valid UTF-8 (a stray or truncated byte, an
                  overlong encoding, an encoded surrogate) and for text with an unpaired surrogate, and for the first
                  value in document order whose type does not fit the known property it belongs to, and
                  shall accept every documented valid form of those properties.
                justification: |
                  A wrong type must stop the renderer before it misreads the property, and a valid form
                  that is rejected would make correct specifications unusable.
                tests:
                  - SpecParser_Parse_NotASpecificationThrowsLocatedSpecException
                  - SpecParser_Parse_InvalidUtf8BytesThrowSpecException
                  - SpecParser_Parse_MalformedUtf8InStringIsRejectedNotReplaced
                  - SpecParser_Parse_MalformedUtf8InNameOrStructureIsRejected
                  - SpecParser_Parse_ValidMultiByteUtf8IsAccepted
                  - SpecParser_Parse_UnpairedSurrogateInStringIsRejected
                  - SpecParser_Parse_WrongTypeReportsPointer
                  - SpecParser_Parse_FirstWrongValueInDocumentOrderIsReported
                  - SpecParser_Parse_ValidFormsOfCheckedPropertiesAreAccepted

              - id: CanvasNetVegaLite-SpecModel-SpecParser-DataFormats
                title: >-
                  The SpecParser unit shall throw a located VegaLiteSpecException for a data format
                  delimiter that is not exactly one character that can separate fields (an empty one, a
                  longer one, a quote, a line break, or a value that is not text), for a parse property that
                  is not auto, null, or an object, for a parse entry that is not a known type or a date
                  format (number, boolean, date, string, date:'format', utc:'format') or whose date or utc
                  format is not a quoted text, for a format property that
                  is not text, for a sequence step that is not a number, and for an empty sequence field
                  name, and shall accept the documented valid forms, including a custom date format in
                  quotes, a
                  negative or zero sequence step, and top-level datasets of every kind.
                justification: |
                  The data stage reads these properties as given; a malformed one must stop the renderer
                  with its location before the data is read, and a valid form that is rejected would make
                  correct specifications unusable.
                tests:
                  - SpecParser_Parse_Phase4DataFormsAreAccepted
                  - SpecParser_Parse_WrongTypeReportsPointer

              - id: CanvasNetVegaLite-SpecModel-SpecParser-DuplicateAndUnknownKeys
                title: >-
                  The SpecParser unit shall keep the last value of a key written twice while keeping the
                  position of the first occurrence and raising one vl-duplicate-key warning at the later
                  key, and shall raise one vl-unknown-property warning for each property that Vega-Lite
                  does not define at the places it checks, never warning about a defined name.
                justification: |
                  Duplicate keys are a common authoring mistake whose resolution must be deterministic,
                  and unknown properties are usually typos that deserve a warning, not a failure.
                tests:
                  - SpecParser_Parse_DuplicateKeyLastWinsAndWarns
                  - SpecParser_Parse_UnknownPropertiesWarnOnceAndValidKeysNeverWarn
                  - SpecParser_Parse_ValidTopLevelNamesDoNotWarn

              - id: CanvasNetVegaLite-SpecModel-SpecParser-Expressions
                title: >-
                  The SpecParser unit shall compile, when the specification is parsed, the text of every
                  expression that the renderer evaluates - the expression of a calculate transform, a filter
                  given as text, and the expr reference of a mark property or channel value of a view
                  - with the expression parser, expose the compiled expressions by the string node that holds
                  them (SpecExpressions), throw a VegaLiteSpecException located at that string (the pointer,
                  line, and column of the value, and the offset inside the text in the message) for a syntax
                  error or a limit, throw one for an expression that names an identifier that is not a
                  declared parameter (the declared parameters of the view, including selection parameters,
                  and the names width, height, padding, autosize, background, and cursor being allowed), and
                  compile nothing for a site at which Vega-Lite's schema allows no expression reference.
                justification: |
                  A mistake in an expression must be found when the specification is opened, with its
                  location, and the renderer must evaluate only the text that it compiled and checked.
                tests:
                  - SpecParser_Parse_ExpressionErrorsCarryTheLocationOfTheTextAndTheOffset
                  - SpecParser_Parse_CompilesTheExpressionsOfSupportedSitesOnly
                  - SpecParser_Parse_WrongTypeReportsPointer

              - id: CanvasNetVegaLite-SpecModel-SpecParser-StaticReferences
                title: >-
                  The SpecParser unit shall also compile, when the specification is parsed, every expr reference
                  at a static site that Vega-Lite's schema allows (the title, the padding and background of the
                  top-level view, the mark properties that no row reads, the properties of an axis, a legend, a
                  header, a scale, and the view background, the value and datum of the other channels, and the same
                  properties of the configuration of the top-level view), failing with a located
                  VegaLiteSpecException for a syntax error or an undeclared parameter, shall list those references
                  in document order for the evaluation of the call, shall not list a reference that the marks
                  evaluate for every row, and shall accept an expression reference for the gridAlign of a
                  legend.
                justification: |
                  A parameter that drives a title, a size, or a domain is a mistake to find when the document is
                  opened, and the later stage that folds the references must work from a list that holds exactly
                  the references that have one value.
                tests:
                  - SpecParser_Parse_CompilesTheExpressionsOfSupportedSitesOnly
                  - SpecParser_Parse_ValidatesOverlayObjectsLikeMarkDefinitions
                  - SpecMetadata_Read_TitleIsPlainText
                  - ExpressionReferenceSites_Find_ThePaintPropertiesOfAMarkAreRowBound
                  - ExpressionReferenceFolder_Fold_EverySiteOfTheTableFolds

              - id: CanvasNetVegaLite-SpecModel-SpecParser-Parameters
                title: >-
                  The SpecParser unit shall validate the parameters of every view with a located
                  VegaLiteSpecException - a name that is repeated in one view or reserved (datum,
                  event, item, parent), a definition whose value and expr are not of the documented forms, and
                  a variable parameter whose expression depends on itself directly or through other
                  parameters (located at the expression of the lowest declared parameter that is on or depends
                  on the cycle) - and shall expose the dependency graph so that the parameters can be
                  evaluated with every dependency first, in declaration order otherwise.
                justification: |
                  A parameter cycle or a duplicate name has no meaning and must stop the renderer with the
                  location of the mistake; a deterministic order makes the parameter values well defined.
                tests:
                  - SpecParser_Parse_Phase5TransformsAndParametersAreAccepted
                  - ParameterGraph_Sort_OrdersDependenciesFirstThenDeclarationOrder
                  - SpecParser_Parse_WrongTypeReportsPointer
                  - CanvasNetVegaLite_SystemIntegration_Parameters_InvalidDefinitionsFailWhenTheDocumentIsOpened

              - id: CanvasNetVegaLite-SpecModel-SpecParser-Transforms
                title: >-
                  The SpecParser unit shall validate the shape of the supported transforms of every view
                  (calculate, filter and its predicates, fold, flatten, sample, pivot with an op that is an
                  aggregate operation of Vega, lookup, and timeUnit,
                  with their
                  required and optional properties, field lists, names, and counts) and of the predicates
                  that compose them with a located VegaLiteSpecException at the first wrong value in document
                  order, shall require that a predicate param names a declared parameter, and shall accept
                  every documented valid form, classifying every transform of Vega-Lite as supported.
                justification: |
                  The transform stage reads these properties as given; a malformed one must stop the renderer
                  with its location before any data is read.
                tests:
                  - SpecParser_Parse_Phase5TransformsAndParametersAreAccepted
                  - SpecParser_Parse_WrongTypeReportsPointer
                  - CanvasNetVegaLite_SystemIntegration_Expressions_ErrorsAndLimitsFailWhenTheDocumentIsOpened
                  - SpecParser_IsSupportedTransform_AcceptsEveryTransformOfVegaLite

              - id: CanvasNetVegaLite-SpecModel-SpecParser-StatisticalTransforms
                title: >-
                  The SpecParser unit shall validate the shape of the transforms regression (on, regression,
                  the method linear, log, exp, pow, quad, or poly, an integer order from 0 to 64, extent,
                  params, groupby, and an as of one or two names), loess (on, loess, a bandwidth from 0 to 1,
                  groupby, and as), density (density, a bandwidth, steps, minsteps, and maxsteps that are not
                  negative, extent, counts, cumulative, groupby, resolve, and as), quantile (quantile, a step
                  that is not negative, probs, groupby, and as), and extent (the field and a parameter name)
                  with a located VegaLiteSpecException at the first wrong value in document order; shall read
                  an extent property next to a regression or density as the option of that transform and not
                  as a transform of its own (a density before a regression before the first property), as
                  Vega-Lite does; and shall make the parameter of an extent transform visible to the
                  expressions of its view and of the views below it, reject it when it repeats the name of a
                  declared parameter, and list the extent parameters of a specification.
                justification: |
                  The statistics read these properties as given and generate rows from them; a malformed one
                  must stop the renderer with its location, and an extent parameter must be known where the
                  expressions that read it are checked.
                tests:
                  - SpecParser_Parse_StatisticalTransformShapesAreLocatedErrors
                  - SpecParser_Parse_AcceptsTheWellFormedStatisticalTransforms
                  - SpecParser_FindTransformOperation_AnExtentNextToARegressionOrDensityIsTheirOption
                  - SpecParser_Parse_AnExtentParameterIsVisibleToTheExpressionsOfTheViewAndItsDescendants
                  - SpecParser_IsExtentParameter_OnlyExtentTransformsOfTheViewOrAncestorsCount
                  - SpecParser_Parse_AnExtentParameterCannotRepeatADeclaredParameter

              - id: CanvasNetVegaLite-SpecModel-SpecParser-AggregateTransforms
                title: >-
                  The SpecParser unit shall validate the shape of the transforms aggregate and joinaggregate
                  (the list of operations with a known op, a field where the op needs one, an as, and the
                  groupby list), window (the window operations and their parameters, the sort fields, the frame
                  of two integers or nulls, ignorePeers, and the groupby list), bin (the field, the as pair,
                  and the bin parameters), stack (the field, the offset, the sort, the groupby list, and the as
                  pair), and impute (the field, the key, the keyvals list or sequence, the method, the value,
                  the frame, and the groupby list) with a located VegaLiteSpecException at the first wrong
                  value in document order - an operation name that does not exist, a missing field, a
                  and shall accept every documented valid form.
                justification: |
                  The transform stage reads these properties as given; a malformed or unknown one must stop the
                  renderer with its location before any data is read, and a valid form that was rejected would
                  make correct specifications unusable.
                tests:
                  - SpecParser_Parse_AggregateTransformShapesArePinned
                  - SpecParser_Parse_WindowTransformShapesArePinned
                  - SpecParser_Parse_BinParamsAndBinTransformShapesArePinned
                  - SpecParser_Parse_StackAndImputeTransformShapesArePinned
                  - SpecParser_Parse_ValidAggregatingTransformsAreAccepted
                  - SpecParser_IsSupportedTransform_AcceptsEveryTransformOfVegaLite

              - id: CanvasNetVegaLite-SpecModel-SpecParser-EncodingAggregates
                title: >-
                  The SpecParser unit shall validate the shape of the encoding properties aggregate, bin (a
                  boolean, binned, or an object of bin parameters), stack, sort (a direction, a list, a channel
                  shorthand with an optional minus, an object with op, field, and order, or an object with
                  encoding and order), and the sort of the order channel with a located
                  VegaLiteSpecException at the first wrong value in document order, shall accept every
                  documented valid form, and shall tell the sorts that the
                  renderer computes from the others.
                justification: |
                  The scale and mark stages read these properties as given; a malformed one must stop the
                  renderer with its location, and the sorts that are not computed must be left to the feature
                  catalog rather than half done.
                tests:
                  - SpecParser_Parse_EncodingAggregateBinStackSortShapesArePinned
                  - SpecParser_Parse_ValidEncodingAggregateBinStackSortFormsAreAccepted
                  - SpecParser_TryParseSortShorthand_AcceptsAChannelWithAnOptionalMinus
                  - SpecParser_IsSupportedSort_RequiresAnOperationOrChannelTheRendererComputes
                  - SpecParser_IsSupportedSort_RejectsNullArguments

              - id: CanvasNetVegaLite-SpecModel-SpecParser-SortValues
                title: >-
                  The SpecParser unit shall validate the values of an encoding sort array - every item a
                  string, a number, a boolean, or null, and an object only as a date-time object on a field of
                  type temporal, an object or array item otherwise being a located VegaLiteSpecException at the
                  item - shall report an array that mixes the kinds of its values as the warning
                  vl-encoding-sort-mixed-types at the array (the values still being accepted and matched by
                  kind), shall report a key that a sort object does not define as a vl-unknown-property warning
                  at the key, and shall tell the channel that a sort refers to.
                justification: |
                  A sort array item that is an object or an array would otherwise be read as the null category
                  and silently mis-sort the chart; the specification is the problem and must be reported where
                  it is, and a spec-quality problem that changes nothing the renderer can fix is a warning.
                tests:
                  - SpecParser_Parse_EncodingAggregateBinStackSortShapesArePinned
                  - SpecParser_Parse_SortArrayAndObjectWarningsAreLocated
                  - SpecParser_TryGetSortChannel_ReadsTheShorthandAndTheEncoding
                  - SpecParser_Parse_ValidEncodingAggregateBinStackSortFormsAreAccepted

              - id: CanvasNetVegaLite-SpecModel-SpecParser-ScaleOptions
                title: >-
                  The SpecParser unit shall validate the structured options of a scale - domainMid, domainMin,
                  domainMax, rangeMin, and rangeMax numbers (or expression references), an interpolate that is
                  the name of a color space or an object with that name as its type and a numeric gamma, a scheme
                  that is a name or an object with a string name, a positive whole count, and an extent of two
                  numbers, and bins as an array or an object - with a located VegaLiteSpecException at the
                  offending value, shall validate the parameters of the log, pow, and symlog scale types (a base above
                  zero other than 1, a finite exponent, a constant above zero; those of another type are not checked),
                  and shall report an unknown key of a scheme or interpolate object as a
                  vl-unknown-property warning at the key.
                justification: |
                  A scheme or an interpolation with the wrong shape cannot be what the author meant, so the
                  mistake is reported where it is instead of drawing a guess.
                tests:
                  - SpecParser_Parse_WrongTypeReportsPointer
                  - SpecParser_Parse_ColorScaleOptionsAreAcceptedAndUnknownKeysWarn
                  - SpecParser_Parse_TransformScaleParametersAreCheckedOnlyForTheirType

              - id: CanvasNetVegaLite-SpecModel-SpecParser-TimeUnits
                title: >-
                  The SpecParser unit shall validate a timeUnit wherever it is written (a channel definition, a
                  condition, a predicate, and the timeUnit transform with its field and as) - a name of the
                  documented time units with the utc and binned prefixes, or an object with unit or maxbins,
                  step, utc, and binned of the right kinds, warning about an unknown member of the object -
                  with a located VegaLiteSpecException at the value for an unknown unit or a bad member,
                  shall validate the numeric band properties of a mark (timeUnitBandPosition and
                  timeUnitBandSize), a bad value being an error in the specification and ignored in a
                  caller's configuration, and shall classify the timeUnit transform as supported.
                justification: |
                  The transform and encoding stages read a time unit as written; a misspelled unit must stop the
                  renderer with its location instead of drawing an ungrouped chart.
                tests:
                  - SpecParser_TimeUnit_AcceptsEveryName
                  - SpecParser_TimeUnit_UnknownUnitIsLocated
                  - SpecParser_TimeUnit_ObjectForm_ValidatesMembers
                  - SpecParser_TimeUnit_UnknownMemberIsAWarning
                  - SpecParser_TimeUnit_Binned_ParsesAndIsApplied
                  - SpecParser_MarkTimeUnitBand_NonNumberIsAnErrorInTheSpecAndIgnoredInTheCallerConfig
                  - SpecParser_TimeUnitTransform_ValidatesFieldAndAs

              - id: CanvasNetVegaLite-SpecModel-SpecParser-DateTimeObjects
                title: >-
                  The SpecParser unit shall validate a datetime object (the members year, quarter, month, date,
                  day, hours, minutes, seconds, milliseconds, and utc, a month or day as a number or a name,
                  an object with no member being an error) in a scale domain, domainMin and domainMax, the
                  values of an axis and of a legend, the value of a predicate, the sort array of a temporal
                  field, and the datum of a channel, with a located VegaLiteSpecException at the member that
                  is wrong, and shall leave an expression reference and a repeated datum alone.
                justification: |
                  A datetime object that cannot be read must be found where it is written; a wrong month name
                  would otherwise draw a wrong date.
                tests:
                  - SpecParser_DateTimeObject_InDomainPredicateAndValues_Validated
                  - SpecParser_DateTimeObject_ExpressionReferencesAndRepeatDatumsAreLeftAlone

              - id: CanvasNetVegaLite-SpecModel-SpecParser-TickIntervals
                title: >-
                  The SpecParser unit shall validate a time interval given as the tickCount of an axis or a
                  legend or as the nice property of a scale - one of the eight interval names
                  (millisecond, second, minute, hour, day, week, month, year), or an object with a known
                  interval and a step above zero - with a located VegaLiteSpecException at the offending
                  value.
                justification: |
                  An interval that the tick generator cannot read must stop the renderer with its location.
                tests:
                  - SpecParser_TickCountInterval_Validated
                  - SpecParser_IsTimeInterval_NamesTheEightIntervals

              - id: CanvasNetVegaLite-SpecModel-SpecParser-TimeFormatLimits
                title: >-
                  The SpecParser unit shall refuse, with a located VegaLiteSpecException at the format, a d3 time
                  format that is longer than 1,024 characters or expands to more than 4,096 pieces - the format
                  text or a member of the format object of an axis or a legend that is read as a time format (the
                  field is temporal or has a time unit, or the format type is time or utc), and the date format of a
                  parse entry of a data format - and shall leave number formats and custom format types alone.
                justification: |
                  A time format is untrusted text that the guides compile and repeat for every label; the
                  specification is the cheapest place to find a format that no chart needs.
                tests:
                  - SpecParser_TimeFormat_SpecifierLimitsAreSpecificationErrors

              - id: CanvasNetVegaLite-SpecModel-SpecParser-TimePredicates
                title: >-
                  The SpecParser unit shall write a filter or condition predicate that has a time unit or a
                  datetime object as an expression (the left side the datetime of the unit parts of the
                  field, the right side the datetime of the value, the utc functions for a utc unit, the
                  parts week and dayofyear omitted with a warning, a range as a pair of comparisons, and
                  oneOf as an index test), in every culture identically, compile it once under the
                  predicate so that the row transforms and the conditions evaluate it, and bound a oneOf
                  list of times by the scale domain limit and the text that is written for it by eight times
                  the source length limit (the expression length limit applies to the expressions that the user
                  writes, not to the text that is written from a predicate; the text is counted as it is written
                  and refused, with the error of a text over the budget, before it is allocated), and bound an
                  expression that the user writes as an operand of the predicate by the expression length limit,
                  at the expression.
                justification: |
                  A time predicate is an expression like any other; compiling it once keeps its cost bounded
                  and its meaning that of Vega-Lite, and a long field name must not multiply into memory that
                  the limits do not bound.
                tests:
                  - PredicateSource_TimeUnit_Equal_Month
                  - PredicateSource_TimeUnit_Range_YearMonth
                  - PredicateSource_TimeUnit_Range_OpenEnds
                  - PredicateSource_TimeUnit_OneOf_Day
                  - PredicateSource_TimeUnit_Utc_Uses_utc_functions
                  - PredicateSource_TimeUnit_Quarter_UsesMonthTimesThree
                  - PredicateSource_DatetimeWithoutUnit_WrapsLeftInTime
                  - PredicateSource_WeekPart_IsOmittedAndWarned
                  - PredicateSource_StringValueWithUnit_UsesDatetimeLiteral
                  - PredicateSource_NumberBelow10000WithSingleUnit_UsesThePart
                  - PredicateSource_UnitsThatApplyNothingAndExpressionValuesStayPlain
                  - PredicateSource_IsTimeAware_AndReadUnit
                  - PredicateSource_BinnedUnitComparesTheInstantOfTheField
                  - PredicateSource_TimePredicates_AreCultureIndependent
                  - PredicateSource_TimeMembers_RejectNull
                  - SpecParser_TimePredicates_AreCompiledOnceUnderThePredicate
                  - SpecParser_TimePredicates_OneOfIsBoundedByTheDomainSizeAndTheGeneratedBudget
                  - SpecParser_TimePredicates_LongFieldFailsFastWithTheGeneratedBudgetError

              - id: CanvasNetVegaLite-SpecModel-SpecParser-LegendOptions
                title: >-
                  The SpecParser unit shall validate the properties of a legend object - the orient, direction,
                  and title orient names and the kinds of the paint, font, and layout properties - and the counts
                  and lengths of a legend (columns, symbolLimit, tickCount, clipHeight, gradientLength, and
                  gradientThickness), which must not be negative, with a located VegaLiteSpecException at the
                  offending value, and shall report a key that Vega-Lite does not define for a legend as a
                  vl-unknown-property warning at the key.
                justification: |
                  A legend with a wrong property cannot be what the author meant, and a negative size would break
                  the layout that is derived from it.
                tests:
                  - SpecParser_Parse_WrongTypeReportsPointer
                  - SpecParser_Parse_LegendPropertiesAreAcceptedAndUnknownKeysWarn

              - id: CanvasNetVegaLite-SpecModel-SpecParser-Limits
                title: >-
                  The SpecParser unit shall reject source text longer than the source-length limit with
                  an InvalidDataException, nesting deeper than the JSON-depth limit and strings longer
                  than the string-length limit with a located VegaLiteSpecException, and numbers outside
                  the double range, while using an explicit stack so that no input can overflow the call
                  stack.
                justification: |
                  Recursion over untrusted nesting would let a hostile specification terminate the host
                  process, and unbounded text would exhaust memory.
                tests:
                  - SpecParser_Parse_DepthAndSourceLimitsFailClosed
                  - CanvasNetVegaLite_SystemIntegration_Limits_OversizedSourceAndDepthFailClosed

              - id: CanvasNetVegaLite-SpecModel-SpecParser-Metadata
                title: >-
                  The SpecParser unit shall derive from the tree the schema URL, the schema major version
                  (for any vega-lite/vN.json URL), the plain-text title (several lines joined with a
                  line feed), the mark types with their locations, the data references (inline, URL,
                  named, or sequence, with the sequence length), and the distinct parameter names, with
                  inline values taking precedence over a name.
                justification: |
                  The public properties of the document are computed from this metadata when the
                  document is opened, so it must be exact and independent of rendering.
                tests:
                  - SpecMetadata_Read_DescribesSchemaTitleMarksDataAndParameters
                  - SpecMetadata_Read_TitleIsPlainText
                  - SpecMetadata_Read_SequenceComputesLength
                  - SpecMetadata_Read_InlineValuesTakePrecedenceOverName
                  - SpecParser_ParseSchemaMajorVersion_ParsesTheMajorVersion

              - id: CanvasNetVegaLite-SpecModel-SpecParser-ConditionalEncodings
                title: >-
                  The SpecParser unit shall validate the condition of a channel definition (an object or an
                  array of objects, each with a test, a param, or a legacy selection and the properties of a
                  value or a field definition) with a located error at the offending value (including a param or
                  selection that no view declares), shall compile the test of a
                  condition once, an expression text as written and a predicate object
                  (equal, lt, lte, gt, gte, range, oneOf, valid, and, or, not, a variable parameter, a selection
                  parameter, a legacy selection) as the expression that means the same - a selection as the
                  predicate that Vega-Lite compiles for it, with its empty rule and its resolve, using the
                  identity test for a point selection over the identity of the rows - shall compile the value
                  expression of a condition, and shall leave out what no expression can say (a variable parameter
                  whose name is not an identifier, a date object that is not valid); the text that
                  is written for a predicate, a selection included, is not bound by the expression length limit of
                  user-written expressions but by eight times the source length limit (counted as it is written and
                  refused before it is allocated, so that a long field name with a large oneOf list, or a large
                  and or or of selection predicates, fails fast with a located error), an expression that the user
                  writes as an operand of a predicate
                  is bound by the expression length limit like any user-written expression and refused at the
                  expression, and a oneOf list by the scale domain limit, so that a membership list of a
                  thousand values is accepted.
                justification: |
                  Evaluating the tests of the conditions with the expression engine gives them the same
                  limits, step budget, and cancellation as every other expression, and compiling them once
                  keeps the per-row work small.
                tests:
                  - SpecParser_Parse_MalformedConditionReportsThePointer
                  - SpecParser_Parse_ConditionTestsAreCompiled
                  - SpecParser_Conditions_LargeOneOfAndOrPredicatesAreNotBoundByTheUserExpressionLength
                  - SpecParser_Conditions_LongFieldTimesLargeOneOfFailsFastWithTheGeneratedBudgetError
                  - SpecParser_PredicateExpressionOperands_AreBoundByTheUserExpressionLength
                  - SpecParser_Parse_ConditionsThatAreNotEvaluatedAreNotCompiled
                  - SpecParser_Parse_FieldConditionScaleIsValidated
                  - PredicateSource_TryBuild_WritesTheExpressionThatMeansTheSame
                  - PredicateSource_TryBuild_WritesTheSelectionTestOfVegaLite
                  - PredicateSource_TryBuild_QuotesPathsAndStrings
                  - PredicateSource_TryBuild_RefusesWhatNoExpressionCanSay
                  - PredicateSource_TryBuild_NullPredicateThrows
                  - PredicateSource_Build_RefusesAnOverBudgetExpansionBeforeAllocatingIt
                  - PredicateSource_Build_BudgetBoundaryAndUnsupportedWins
                  - PredicateSource_IsUnsupported_DoesNotAllocateTheExpansion
                  - PredicateSource_Build_SelectionPredicatesAreCountedAgainstTheBudget
                  - SpecParser_Conditions_SelectionPredicatesObeyTheGeneratedBudget
                  - ChannelDefinitions_CanCondition_ListsTheConditionalChannels
                  - ChannelDefinitions_FieldDefinitionOf_FindsTheObjectThatCarriesTheField
                  - ChannelDefinitions_Conditions_ListsConditionsInOrder
                  - ChannelDefinitions_Values_ListsTheConstantsOfAChannelThatNoFieldDrives
                  - SpecParser_Parse_EvaluatesSizeConditionsOfMarksThatUseASize
                  - SpecParser_Parse_PredicateOnAnUndeclaredSelectionIsAnError

              - id: CanvasNetVegaLite-SpecModel-SpecParser-Selections
                title: >-
                  The SpecParser unit shall validate a selection parameter (a select that is point or interval,
                  as a text or as an object whose type is one of them, with fields and encodings arrays of texts,
                  a resolve of global, union, or intersect, and views an array) and the legacy selection property
                  (an object of selections whose type is single, multi, or interval) with a located error at the
                  offending value, shall accept every interaction property (on, clear, toggle, nearest, translate,
                  zoom, mark, bind, and an event stream) without checking it, shall list the selections of the
                  legacy property among the parameter names, and shall find a selection by its name from every
                  view of the specification (Vega-Lite merges the selections of the children into their parents;
                  the first declaration of a name wins) while a variable parameter is visible only from the
                  views below its declaration.
                justification: |
                  A malformed selection must be found when the document is opened, a selection is shared by the
                  views of a composition, and the interaction properties have no meaning in a static chart.
                tests:
                  - SpecParser_Parse_SelectWithAnUnknownTypeIsAnError
                  - SpecParser_Parse_MalformedSelectionOptionsAreErrors
                  - SpecParser_Parse_SelectionFormsAreAccepted
                  - SpecParser_Parse_LegacySelectionIsValidated
                  - SpecParser_FindParameter_SelectionsAreVisibleFromEveryView
                  - SpecParser_Parse_Phase5TransformsAndParametersAreAccepted

              - id: CanvasNetVegaLite-SpecModel-SpecParser-DefaultFieldType
                title: >-
                  The SpecParser unit shall give a field definition without a type the type that Vega-Lite
                  infers (its defaultType) through one shared rule, so that the scales, legends, labels,
                  stacks, bins, time parsing, text, facet headers, and composite marks agree: quantitative on
                  latitude and longitude; nominal on row, column, facet, shape, and strokeDash; ordinal on
                  order and for a sort array; temporal for a timeUnit; quantitative for a bin or an aggregate
                  other than argmin and argmax; the type of an explicit scale type; and nominal otherwise. A
                  secondary channel shall have the type of its main channel, a datum the type of its value,
                  and a missing type shall be neither reported nor refused in strict mode.
                justification: |
                  Vega-Lite 5 made the type optional, so a specification without it is valid; reading it as
                  quantitative drew a text channel over strings as NaN and a color field as a gradient.
                tests:
                  - ChannelDefinitions_TypeOf_InfersTheMissingTypeLikeVegaLite
                  - ChannelDefinitions_TypeOf_DatumLatitudeAndSecondaryChannels
                  - CanvasNetVegaLite_DefaultType_TextOverStringsShowsTheStrings
                  - CanvasNetVegaLite_DefaultType_TextFollowsTheInferredType
                  - CanvasNetVegaLite_DefaultType_ColorWithoutTypeIsNominal
                  - CanvasNetVegaLite_DefaultType_ShapeWithoutTypeIsNominal
                  - CanvasNetVegaLite_DefaultType_PositionsWithoutTypeFollowDefaultType
                  - CanvasNetVegaLite_DefaultType_TimeUnitWithoutTypeIsTemporal
                  - CanvasNetVegaLite_DefaultType_BinWithoutTypeIsQuantitative
                  - CanvasNetVegaLite_DefaultType_CountingAggregatesWithoutTypeAreQuantitative
                  - CanvasNetVegaLite_DefaultType_SecondaryChannelFollowsItsMainChannel
                  - CanvasNetVegaLite_DefaultType_StackedBarWithoutTypes
              - id: CanvasNetVegaLite-SpecModel-SpecParser-PathMarkRules
                title: >-
                  The SpecParser unit shall validate the properties of the line, area, and trail marks with a
                  located error at the offending value - interpolate (one of the fifteen Vega-Lite names),
                  tension (a number), point (a boolean, an object that is validated as a mark definition, the
                  text transparent, or null), line (a boolean, an object that is validated as a mark definition, or
                  null), invalid (one of the five modes or null), order (a boolean or null), strokeDashOffset,
                  strokeMiterLimit, padAngle, innerRadius, outerRadius, radius, radius2, theta, and theta2 (numbers
                  or expression references) - warn about an unknown key of an overlay object at the key, and compile
                  the expression of a size value for the line and trail marks.
                justification: |
                  The properties of the new marks arrive as untrusted JSON; each must be checked once, with the
                  location of the mistake, before the builders rely on its type.
                tests:
                  - SpecParser_Parse_AcceptsTheFifteenInterpolateNames
                  - SpecParser_Parse_RejectsABadInterpolateOrInvalidOrPointValue
                  - SpecParser_Parse_ValidatesOverlayObjectsLikeMarkDefinitions

              - id: CanvasNetVegaLite-SpecModel-SpecParser-TextRules
                title: >-
                  The SpecParser unit shall validate the properties of the text mark with a located error at the
                  offending value - text (a string, an array of strings, or an expression reference), fontStyle,
                  ellipsis, and lineBreak (text), fontWeight (text or a number), limit and lineHeight (numbers) -
                  and compile the expression of a size value of a text mark.
                justification: |
                  Text properties arrive as untrusted JSON and decide what is drawn and how much memory the
                  labels use.
                tests:
                  - SpecParser_Parse_ValidatesTextMarkProperties

              - id: CanvasNetVegaLite-SpecModel-SpecParser-ImputeRules
                title: >-
                  The SpecParser unit shall validate the impute property of a position definition - null, or an
                  object with keyvals (an array or a sequence object whose length is bounded by the scale-domain
                  limit), method (value, mean, median, max, or min), value, and frame (two numbers or nulls) - with
                  a located error at the offending member, and warn about an unknown member at the key.
                justification: |
                  The impute of an encoding is executed by the pipeline; its parameters must be validated and
                  bounded before the pipeline reads them.
                tests:
                  - SpecParser_Parse_RejectsABadImputeObjectWithItsLocation
                  - SpecParser_Parse_AcceptsTheImputeForms
                  - SpecParser_Parse_WarnsAboutUnknownImputeMembers

              - id: CanvasNetVegaLite-SpecModel-SpecParser-ResolveAndCompositeValidation
                title: >-
                  The SpecParser unit shall validate the resolve of a view with a located error at the offending
                  value - an object whose scale, axis, and legend members are objects, whose channels are those
                  that Vega-Lite resolves for that kind (the axes of x and y only, the legends of the non-position
                  channels), and whose values are shared or independent - warn about an unknown kind, and validate
                  the properties of the boxplot, errorbar, and errorband marks (the extent: a number of at least
                  zero or min-max for a boxplot, one of ci, iqr, stderr, and stdev for an errorbar and an
                  errorband; the center: mean or median; and the parts box, median, rule, ticks, outliers, band,
                  and borders: a boolean or an object) without applying those rules to the primitive marks.
                justification: |
                  The resolve and the composite properties arrive as untrusted JSON and decide how the layers are
                  combined and what is computed; each must be checked once, with the location of the mistake,
                  before the normalizer relies on its type.
                tests:
                  - SpecParser_Parse_ValidResolveIsAccepted
                  - SpecParser_Parse_MalformedResolveReportsThePointer
                  - SpecParser_Parse_UnknownResolveKindIsAWarning
                  - SpecParser_IsResolveChannel_FollowsTheVegaLiteMaps
                  - SpecParser_Parse_ValidCompositeMarkIsAccepted
                  - SpecParser_Parse_MalformedCompositeMarkReportsThePointer
                  - SpecParser_Parse_CompositeRulesDoNotApplyToPrimitiveMarks

              - id: CanvasNetVegaLite-SpecModel-SpecParser-ComposedViewExpressions
                title: >-
                  The SpecParser unit shall compile the expressions of every view alike (the conditions of the
                  encoding of a layer and of the layered view above it, the expression values of the marks, and
                  those of the views of a concatenation, a facet, and a repeat) so that no view of a composition is
                  left unchecked, as the renderer draws every view of the specification.
                justification: |
                  A view of a composition is drawn like any view, so a mistake in its expressions must be found
                  when the specification is opened, with its location.
                tests:
                  - SpecParser_Parse_ExpressionsOfComposedViewsAreCompiled
                  - SpecParser_Parse_ConditionsThatAreNotEvaluatedAreNotCompiled

              - id: CanvasNetVegaLite-SpecModel-SpecParser-CompositionValidation
                title: >-
                  The SpecParser unit shall validate the properties of the compositions with a located error at the
                  offending value: a facet and a repeat need a spec object; a facet is a field definition or an object
                  of a row and a column field definition (each with a field that is a name or a repeat reference);
                  a repeat is an array of strings or an object of row, column, and layer arrays of strings (an unknown
                  key being a warning); the spec of a facet and a view of a layer are never a concatenation, a facet, or
                  a repeat; columns is a non-negative integer; spacing is a number or an object of numbers for row and
                  column; align is all, each, or none, or an object of them; center is a boolean or an object of
                  booleans;
                  and the header of a facet field or a faceting channel has the property shapes of Vega-Lite (an unknown
                  one being a warning); these layout properties and the header on any other channel are unknown
                  properties (a warning).
                justification: |
                  The composition properties arrive as untrusted JSON and decide how many views are made and how
                  they are
                  laid out; each must be checked once, with the location of the mistake, before the normalizer relies on
                  its type.
                tests:
                  - SpecParser_Parse_FacetWithoutSpecIsError
                  - SpecParser_Parse_FacetMappingWithoutFieldIsError
                  - SpecParser_Parse_RepeatWithoutSpecIsError
                  - SpecParser_Parse_RepeatArrayOfNonStringsIsError
                  - SpecParser_Parse_RepeatObjectWithUnknownKeyWarns
                  - SpecParser_Parse_ColumnsMustBeNonNegativeInteger
                  - SpecParser_Parse_ColumnsAcceptsWholeNumbers
                  - SpecParser_Parse_SpacingAcceptsNumberAndRowColumnObject
                  - SpecParser_Parse_AlignCenterShapes
                  - SpecParser_Parse_HeaderPropertyShapes
                  - SpecParser_Parse_ResolveOnConcatAcceptsXAndOffsetChannels
                  - SpecParser_Parse_FacetWithFieldDefinitionAndLayoutIsAccepted
                  - SpecParser_Parse_FacetSpecAndLayerChildCannotBeCompositions

              - id: CanvasNetVegaLite-SpecModel-SpecParser-RepeatReferences
                title: >-
                  The SpecParser unit shall accept a {"repeat": ...} reference as the field or datum of a channel, the
                  field of a sort, the field or datum of a condition, and a facet field, and shall refuse with a located
                  error a reference that names anything but row, column, repeat, or layer.
                justification: |
                  The references are replaced by the repeated values, so a name that no repeat can give must be refused
                  where it is written.
                tests:
                  - SpecParser_Parse_RepeatRefIsAcceptedAsField

              - id: CanvasNetVegaLite-SpecModel-SpecParser-LabelExpressions
                title: >-
                  The SpecParser unit shall compile the labelExpr of every axis, legend, and facet header, and of
                  config.axis, config.axisX, config.axisY, config.axisBand, the other axis configuration, and
                  config.header, config.headerRow, config.headerColumn, and config.headerFacet, when the document
                  is opened (and not config.legend, which Vega-Lite does not read), so that an expression with a
                  syntax error or an unknown parameter fails with a VegaLiteSpecException located at the text of the
                  expression, before any data is read.
                justification: |
                  A mistake in a label expression should stop the author where the text is written, at open time,
                  rather than after the data has been read or at some label of a chart.
                tests:
                  - SpecParser_Parse_LabelExpressionErrorIsASpecExceptionAtTheText
                  - FeatureCatalog_Visit_ConfigLegendLabelExprIsIgnored

              - id: CanvasNetVegaLite-SpecModel-SpecParser-StepFor
                title: >-
                  The SpecParser unit shall accept the for property of a width or height given as a step with the
                  values position and offset (the step of the offset scale is the default for a discrete offset),
                  and shall fail with a VegaLiteSpecException located at the property for any other value.
                justification: |
                  The step of a chart with grouped bars can apply to the groups or to the positions; the author's
                  choice must be read, and a value that Vega-Lite does not know must be refused where it is written.
                tests:
                  - SpecParser_Parse_StepForMustBePositionOrOffset
