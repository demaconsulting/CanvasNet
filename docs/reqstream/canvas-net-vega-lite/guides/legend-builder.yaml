---
# Software Unit Requirements for LegendBuilder
#
# These requirements describe the design-level behavior of the LegendBuilder unit of the Guides subsystem (internal
# namespace DemaConsulting.CanvasNet.VegaLite.Guides): LegendPlan decides which channels get a legend, their kind,
# orient, direction, and title and which channels share one, and LegendBuilder builds a legend as scene items -
# symbol, gradient, or discrete gradient - and measures the box it needs. The rules follow Vega-Lite and Vega. See
# docs/verification/canvas-net-vega-lite/guides/legend-builder.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Guides Requirements
        sections:
          - title: LegendBuilder Requirements
            requirements:
              - id: CanvasNetVegaLite-Guides-LegendBuilder-Planning
                title: >-
                  The LegendBuilder unit shall plan a legend for each of the channels color, size, shape, fill, stroke,
                  strokeDash, strokeWidth, and opacity, in that order, that has a scale and is driven by a field or a
                  datum, unless its legend or scale is null or config.legend.disable is set; shall choose a gradient
                  legend for a continuous color scale, a discrete gradient for a quantize, quantile, or threshold color
                  scale, and a symbol legend otherwise or when legend.type is symbol; shall default the orient to right
                  and the direction to vertical, horizontal for top and bottom; and shall title the legend with the
                  legend title, the channel title, or the default field title.
                justification: |
                  These are the rules that decide what a reader sees as the key of a chart, and they must match
                  Vega-Lite's so that a specification renders as its author expects.
                tests:
                  - LegendPlan_Create_ChannelsInVegaLiteOrderOneLegendPerField
                  - LegendPlan_Create_NoLegendForNullLegendNullScaleValueOrDisabled
                  - LegendPlan_Create_KindFollowsTheScaleAndTheTypeProperty
                  - LegendPlan_Create_OrientAndDirectionFollowVegaLiteDefaults
                  - LegendPlan_Create_TitleFollowsTheLegendTheChannelAndTheFieldTitle
                  - LegendPlan_Create_MarkFactsDescribeFilledFixedPaintsAndOpacity

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Merging
                title: >-
                  The LegendBuilder unit shall merge the legends of channels whose domains are the same (the same
                  field and binning, the same kind of domain, the same explicit domain and sort) into one legend
                  whose entries come from the first channel, unless both give an orient and the two differ, and shall
                  combine the shape, color, size, and other properties of the channels in each symbol.
                justification: |
                  A field that drives several channels is explained once, as Vega-Lite does.
                tests:
                  - LegendPlan_Merge_ChannelsOfTheSameDomainShareOneLegend
                  - LegendPlan_Merge_ExplicitOrientsThatDifferKeepLegendsApart
                  - LegendBuilder_Symbol_MergedChannelsCombineTheirProperties

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Symbols
                title: >-
                  The LegendBuilder unit shall draw each symbol of a symbol legend with the scaled fill, stroke,
                  shape, size, stroke width, dash, and opacity of its value, with the fixed paints and opacity of
                  the mark for what the legend does not explain, and with the base paints of the legend
                  configuration when a field drives the paint or the mark has none, centered in an entry of size
                  max(ceil(sqrt(size) + strokeWidth), labelFontSize) with its label beside it.
                justification: |
                  The symbols are what the reader compares with the marks; they must look like the marks.
                tests:
                  - LegendBuilder_Symbol_NominalColorOnAPointDrawsStrokedCirclesInOneColumn
                  - LegendBuilder_Symbol_FixedAndBasePaintsComeFromTheMarkAndTheConfiguration
                  - LegendBuilder_Symbol_OpacityStrokeWidthAndDashChannelsShowTheirValues

              - id: CanvasNetVegaLite-Guides-LegendBuilder-PathMarkSymbols
                title: >-
                  The LegendBuilder unit shall draw the symbols of the legend of a line, rule, or trail mark as
                  the stroke shape (a short line) painted with the stroke color of the entry (a trail being filled
                  by default but drawn with a stroke in its legend, as Vega-Lite does), with the stroke width of
                  the mark or the legend default, and the symbols of the legend of an area, arc, or text mark as
                  filled circles in the color of the entry.
                justification: |
                  The symbol of a legend must look like the mark that it explains; Vega-Lite draws the legend of a
                  line with a stroke and that of an area, arc, or text with a filled circle.
                tests:
                  - LegendBuilder_Build_LineMarkUsesAStrokeSymbolInTheMarkColor
                  - LegendBuilder_Build_AreaArcAndTextMarksUseFilledCircles

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Entries
                title: >-
                  The LegendBuilder unit shall take the entries of a symbol legend from the domain of a discrete
                  scale, the ticks of a continuous scale (five by default) formatted with the d3 tick format, or the
                  classes of a discretizing scale labeled with ranges, honor values, format, and the symbol
                  properties, drop a first value that the scale maps to zero, and limit the entries to symbolLimit
                  with a final entry that counts the rest.
                justification: |
                  The entries are the content of the legend; the limit keeps a legend of a large domain readable and
                  bounded.
                tests:
                  - LegendBuilder_Symbol_QuantitativeSizeUsesTheTicksOfTheScale
                  - LegendBuilder_Symbol_SymbolLimitAddsAnEllipsisEntry
                  - LegendBuilder_Symbol_DiscretizingScaleLabelsUseRanges
                  - LegendBuilder_Symbol_ValuesFormatAndSymbolPropertiesApply

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Grid
                title: >-
                  The LegendBuilder unit shall lay the entries of a symbol legend out in a grid with Vega's
                  alignment each, row padding 2 and column padding 10, in one column for a vertical legend and in
                  one row for a horizontal one, filling the columns of a vertical legend with several columns from
                  top to bottom.
                justification: |
                  The grid decides the size of the legend and so of the chart.
                tests:
                  - LegendBuilder_Symbol_ColumnsFillTopToBottomWithColumnPadding
                  - LegendBuilder_Symbol_HorizontalDirectionLaysTheEntriesOutInOneRow

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Gradient
                title: >-
                  The LegendBuilder unit shall draw the legend of a continuous color scale as a bar of the gradient
                  thickness (16) and the gradient length (the view height, or for a horizontal top or bottom legend
                  the view width, limited to 64 to 200 and 100 to 200 pixels) filled with a linear gradient whose
                  stops are the ends of the domain and the ticks between them for a count of 15, with labels at the
                  ticks (a tick count of max(2, 2 * floor(length / 100)), the two ends of the domain when there are
                  fewer than three ticks) outside the bar, overlapping labels removed.
                justification: |
                  The gradient legend is how a quantitative color is explained; the stop rule is Vega's.
                tests:
                  - LegendBuilder_Gradient_ContinuousColorDrawsAVerticalBarWithTickLabels
                  - LegendBuilder_Gradient_LengthFollowsTheDataRectangleAndDirection
                  - LegendBuilder_Gradient_FewerThanThreeTicksUseTheEndsOfTheDomain
                  - LegendBuilder_Gradient_ExplicitLengthThicknessTicksAndLabelProperties
                  - LegendBuilder_Gradient_DomainWithoutSpanUsesTheUnitRamp

              - id: CanvasNetVegaLite-Guides-LegendBuilder-DiscreteGradient
                title: >-
                  The LegendBuilder unit shall draw the legend of a quantize, quantile, or threshold color scale as
                  one band per class, each with the color of its class and the height of its share of the bar, with
                  a label at each boundary between classes and none for the first class, widening a threshold scale
                  by one class at each end.
                justification: |
                  A discretizing scale has classes, not a ramp; the bands show them as they are.
                tests:
                  - LegendBuilder_Discrete_QuantizeColorDrawsOneBandPerClass
                  - LegendBuilder_Discrete_ThresholdScaleIsWidenedByOneClassAtEachEnd

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Titles
                title: >-
                  The LegendBuilder unit shall place the title above the entries with the title padding, anchored at
                  its start, middle, or end and pushed in when it reaches beyond the left padding, size the legend
                  box as the content and the padding rounded up, report the orient, offset, and position the layout
                  needs, and carry the fill, stroke, and corner radius of the box.
                justification: |
                  The title and padding decide the box that the layout places.
                tests:
                  - LegendBuilder_Title_PaddingAnchorAndBoxPaint
                  - LegendBuilder_Title_NullTitleLeavesTheEntriesAtThePadding
                  - LegendBuilder_Build_ReportsOrientOffsetAndPositionForTheLayout

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Limits
                title: >-
                  The LegendBuilder unit shall fail with a located VegaLiteRenderException that names the limit when
                  the legend values are more than MaxScaleDomainSize, the ticks more than MaxTicks, a label longer
                  than MaxStringLength, or the scene items more than MaxSceneItems, charging every item to the scene
                  budget before it is created; shall report an invalid format as a located VegaLiteSpecException;
                  and shall poll the cancellation token.
                justification: |
                  A legend is built from specification and data input that may be hostile; every allocation must be
                  bounded before it happens.
                tests:
                  - LegendBuilder_Limits_AreEnforcedBeforeAnythingIsCreated
                  - LegendBuilder_Build_CancellationAndInvalidFormat

              - id: CanvasNetVegaLite-Guides-LegendBuilder-Determinism
                title: >-
                  The LegendBuilder unit shall give identical scene items for repeated builds of the same legend.
                justification: |
                  Equal inputs must give byte-identical charts on every run.
                tests:
                  - LegendBuilder_Build_IsDeterministic

              - id: CanvasNetVegaLite-Guides-LegendBuilder-NonLinearScales
                title: >-
                  The LegendBuilder unit shall build the gradient and symbol legends of a log, pow, sqrt, or symlog
                  scale along the transformed domain (the labels and the stops of a gradient at the fraction of the
                  value in the transformed domain), with only the log ticks that Vega labels as entries and labels
                  (the variable-precision format), the end points of the domain when fewer than three labels are
                  left, and the ticks bounded by the tick limit with a located error and the cancellation token.
                justification: |
                  A legend of a transformed scale must show where its values lie in the scale, not on a linear bar.
                tests:
                  - LegendBuilder_Gradient_LogScaleLabelsThePowersAlongTheLogarithm
                  - LegendBuilder_Symbol_LogSizeShowsThePowersWithEvenSizeSteps
                  - LegendBuilder_Gradient_SqrtScalePlacesTheLabelsAlongTheRoot
                  - LegendBuilder_Gradient_LogTicksAreLimitedAndCancellable

              - id: CanvasNetVegaLite-Guides-LegendBuilder-BinnedLegends
                title: >-
                  The LegendBuilder unit shall build the symbol legend of a bin-ordinal scale with one entry per
                  bin (not per edge) labeled with the range of the bin (the edges formatted and joined with an
                  en dash, as in Vega; the legend format applies to every edge, and the last of an explicit list
                  of values reads as at least its value), in the colors of the scale in bin order, titled as a
                  binned field; shall merge the channels of the same binned field and parameters into one
                  legend; shall show a binned size with the ticks of its linear scale and a nominal or ordinal
                  binned field with the text of each bin; and shall charge the scene items before creating them
                  and observe the cancellation token.
                justification: |
                  The key of a binned color must say which values each color stands for, in the form Vega-Lite shows.
                tests:
                  - LegendBuilder_Symbol_BinnedColorLabelsTheRangesOfTheBins
                  - LegendBuilder_Symbol_BinnedColorFormatValuesAndReverseApply
                  - LegendBuilder_Symbol_BinnedSizeShowsTicksAndOrdinalBinnedOpacityShowsTheBinText
                  - LegendBuilder_Merge_BinnedChannelsOfTheSameBinShareOneLegend
                  - LegendBuilder_Limits_BinnedLegendChargesItsItemsAndPollsTheToken

              - id: CanvasNetVegaLite-Guides-LegendBuilder-ConditionalLegends
                title: >-
                  The LegendBuilder unit shall draw a legend for a condition that holds a field, from its
                  scale and title, shall draw none for conditions that hold only values, shall show the first
                  condition value (else the value of the channel) as the fixed fill, stroke, or shape of the
                  symbols of another legend, and the largest of the base and condition opacities, and shall
                  give the same legend on every call.
                justification: |
                  A condition alone does not say what a color stands for, so it creates no key; the symbols of
                  another key must still look like the marks that they describe, as Vega-Lite's
                  first-condition-value rule does.
                tests:
                  - LegendPlan_Create_ValueConditionsCreateNoScaleAndNoLegend
                  - LegendPlan_Create_FieldConditionCreatesTheScaleAndTheLegend
                  - LegendPlan_Create_FieldWithValueConditionKeepsItsLegend
                  - LegendBuilder_Symbol_SizeLegendShowsTheFirstConditionValueOfAFixedColor
                  - LegendBuilder_Symbol_OpacityOfConditionalChannelIsTheLargestValue
                  - LegendBuilder_Symbol_ConditionalLegendIsDeterministic

              - id: CanvasNetVegaLite-Guides-LegendBuilder-TemporalLabels
                title: >-
                  The LegendBuilder unit shall build the legend of a temporal field with the time labels of the
                  TimeLabels unit: the gradient of a temporal color with its labels at the time ticks of the
                  scale (the tick count as a number or an interval, the minimum step of the unit) and the ramp
                  sampled at them, the symbols of a size or opacity on a time scale at its time ticks, and the
                  symbols of an ordinal time unit field over its date values, labeling a date with the legend
                  format, else the default format of the time unit, else the time format of the
                  configuration (%b %d, %Y by default), reading explicit legend values given as timestamps, date
                  texts, or datetime objects, using the time zone of the scale (UTC for a UTC scale, a UTC unit,
                  or a color that asks for the scale type utc, with the whole-day ticks counted from the epoch),
                  ignoring the zero rule of the scale, bounding the labels (each, and those of the legend
                  together), the ticks, and the items by the limits with located errors, and giving the same legend
                  in every culture and on every call.
                justification: |
                  A legend of dates must say which dates each color or size stands for, in the form Vega-Lite
                  shows, in the zone the caller chose, and bounded.
                tests:
                  - LegendBuilder_Time_TemporalGradient_LabelsUseConfigTimeFormat
                  - LegendBuilder_Time_LegendFormatOverridesAndUnitSpecifier
                  - LegendBuilder_Time_OrdinalTimeUnitSymbols_LabelWithTheUnitSpecifier
                  - LegendBuilder_Time_SizeOnTimeScale_TicksAndLabels
                  - LegendBuilder_Time_ExplicitValuesAcceptDatetimeObjects
                  - LegendBuilder_Time_Zone_LabelsUseLocalTime
                  - LegendBuilder_Time_TemporalColorUtcType_UsesTheUtcCalendar
                  - LegendBuilder_Time_TemporalColor_ZeroIsIgnored
                  - LegendBuilder_Time_LimitsAndCancellation
                  - LegendBuilder_Time_LabelsTogetherTooLong_IsLocated
                  - LegendBuilder_Time_FormatSpecifierLimits_AreSpecificationErrors
                  - LegendBuilder_Time_Culture_InvariantAndDeterministic
