---
# Software Unit Requirements for MarkBuilder
#
# These requirements describe the design-level behavior of the MarkBuilder unit of the Marks subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Marks): the per-mark geometry of bar, rect, point,
# circle, square, rule, tick, line, area, trail, text, and arc (MarkBuilder.cs and its partial files
# MarkBuilder.Order.cs, MarkBuilder.Paths.cs, MarkBuilder.Overlays.cs, MarkBuilder.Text.cs, and
# MarkBuilder.Arcs.cs), the stacked, binned, and ranged geometry that the implicit encoding pipeline
# and the secondary channels x2 and y2 produce, the grouping, sorting, and invalid-data rules of the paths, the
# overlays of the path marks, the polar geometry of the arcs and of text, the resolution of the paint and size
# channels, and the limits. The
# geometry rules follow Vega-Lite behavior, attributed in
# src/DemaConsulting.CanvasNet.VegaLite/third-party/README.md. See
# docs/verification/canvas-net-vega-lite/marks/mark-builder.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Marks Requirements
        sections:
          - title: MarkBuilder Requirements
            requirements:
              - id: CanvasNetVegaLite-Marks-MarkBuilder-BarRect
                title: >-
                  The MarkBuilder unit shall build a bar or rect for each row spanning the band of a
                  discrete scale (the band width reduced by the padding, or centered at an explicit size)
                  or centered at the continuous band size on a continuous scale, and from the value to
                  zero (or to the first domain value when zero is outside the domain and the bar is not
                  stacked) along the measure axis, spanning the whole rectangle when a channel is absent.
                justification: |
                  Bars and rects are the most common marks, and their position and extent are what a
                  reader compares.
                tests:
                  - MarkBuilder_Build_BarAndRectPositionsMatchExpectedSceneItems

              - id: CanvasNetVegaLite-Marks-MarkBuilder-StackedLayers
                title: >-
                  The MarkBuilder unit shall draw each layer of a stacked channel from the stack start to the
                  stack end of its row (vertical and horizontal, with the offsets zero, center, and normalize,
                  and with no stack when the encoding says null) as a bar, rect, or rule, and place a point,
                  circle, square, or tick on a stacked channel at the stack end.
                justification: |
                  A stacked bar chart is only readable when each layer sits on the one below it.
                tests:
                  - MarkBuilder_Build_StackedLayersSpanFromTheStackStartToItsEnd
                  - MarkBuilder_Build_StackedAndBinnedMarksRespectTheBudgetAndCancellation

              - id: CanvasNetVegaLite-Marks-MarkBuilder-SignedStacks
                title: >-
                  The MarkBuilder unit shall draw the layers of a stack with negative values hanging below (or,
                  on a horizontal measure, left of) the zero baseline - the positive layers from zero up and
                  the negative layers from zero down, separately, in both orientations, an all-negative stack
                  entirely below zero, and the offsets center and normalize by the absolute values - each layer
                  from its stack start to its stack end whichever of the two is the larger.
                justification: |
                  A chart of takings and outgoings is a stacked chart on both sides of zero; a negative layer
                  drawn above the baseline or on top of the positive layers would reverse its meaning.
                tests:
                  - MarkBuilder_Build_SignedStacksHangBelowZeroInBothOrientations
                  - CanvasNetVegaLite_SystemIntegration_Stacking_SignedLayersAreDrawnOnBothSidesOfZero

              - id: CanvasNetVegaLite-Marks-MarkBuilder-BinnedBars
                title: >-
                  The MarkBuilder unit shall draw a bar or rect on a binned continuous channel across its bin
                  - from the start to the end of the bin on the scale, reduced by the bin spacing (1 pixel for
                  a bar and 0 for a rect and a tick by default, from the mark or the configuration) and offset
                  by the half pixel of the axis - widening a bin thinner than the minimum band size to that
                  size, centering a bar with an explicit size on the middle of its bin, drawing the bins in
                  reverse for a reversed scale, extending an already binned field with a step to one step past
                  its start when it has no end field, and place a point, circle, square, rule, or tick on a
                  binned channel at the middle of its bin.
                justification: |
                  A histogram must show bars that fill their bins and touch only by the spacing; Vega-Lite
                  draws them so and the same chart must look the same.
                tests:
                  - MarkBuilder_Build_BinnedBarsSpanTheirBinsLessTheSpacing
                  - MarkBuilder_Build_PreBinnedRangesSpanFromTheStartToTheEndField
                  - MarkBuilder_Build_StackedAndBinnedMarksRespectTheBudgetAndCancellation

              - id: CanvasNetVegaLite-Marks-MarkBuilder-SecondaryChannels
                title: >-
                  The MarkBuilder unit shall draw a bar or rect whose x or y has an x2 or y2 (a field, a
                  datum, or a pixel value) as a range between the two ends instead of a bar to zero or a
                  centered thickness, draw a rule with a range on one channel between the two ends and with
                  ranges on both between the two points, let a pixel value of the secondary channel win over a
                  stack start, and draw nothing for a row whose end is not a number.
                justification: |
                  Ranges (a floating bar, an error bar, a timeline) are written with the secondary
                  channels and must be drawn between the two ends.
                tests:
                  - MarkBuilder_Build_SecondaryChannelsSpanARange
                  - MarkBuilder_Build_PreBinnedRangesSpanFromTheStartToTheEndField

              - id: CanvasNetVegaLite-Marks-MarkBuilder-MarkClip
                title: >-
                  The MarkBuilder unit shall clip the marks to the data rectangle only when the mark says clip
                  true, and shall not clip them because a scale has an explicit domain, so that a bar that
                  starts at zero outside an explicit domain is drawn as Vega-Lite draws it.
                justification: |
                  Vega-Lite clips marks only with the mark's clip property or for the extent of an interval
                  selection (scaleClip); an explicit domain alone does not clip.
                tests:
                  - MarkBuilder_Build_BarAndRectPositionsMatchExpectedSceneItems

              - id: CanvasNetVegaLite-Marks-MarkBuilder-SymbolsRuleTick
                title: >-
                  The MarkBuilder unit shall build a point, circle, or square at the center of the band
                  or value of each row with the size from the mark, the size scale, or the style, a rule
                  as a full-height vertical line for x only or a full-width horizontal line for y only or
                  from the value to zero along the measure axis for both, and a tick across the band with
                  the configured thickness, oriented by the orientation rule.
                justification: |
                  These marks show individual values and their positions must match analytic
                  expectations.
                tests:
                  - MarkBuilder_Build_PointCircleSquareRuleAndTickMatchExpectedSceneItems

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Channels
                title: >-
                  The MarkBuilder unit shall give each item its paint, size, and opacity from the color,
                  fill, stroke, size, and opacity channels (a field through the scale, a value as given,
                  fill winning over color), from the mark definition, and from the style, mark, and
                  Vega configuration in that order, apply the default opacity of 0.7 to point, tick,
                  circle, and square marks that configure none, and drop the rows whose continuous value is
                  null or not a number.
                justification: |
                  The channels carry additional data in a chart and their defaults decide its look.
                tests:
                  - MarkBuilder_Build_ColorSizeAndOpacityUseExpectedProperties
                  - MarkBuilder_Build_InvalidValuesOfContinuousChannelsDropTheRow

              - id: CanvasNetVegaLite-Marks-MarkBuilder-ContinuousColors
                title: >-
                  The MarkBuilder unit shall color each item of a color, fill, or stroke channel from the scale of
                  the channel whatever its kind - the color of the ramp (sequential or diverging, with its
                  domain, reversal, and middle value) for a continuous scale, the color of the class of the
                  value for a quantize, quantile, or threshold scale (a value on a threshold belonging to the
                  class above), and
                  the color of the category for an ordinal scale - as the fill of a filled mark and the
                  stroke of an unfilled one, and shall not draw a row whose value on a continuous color scale is not a
                  number.
                justification: |
                  A continuous or binned color encoding is the second most common way to show a measure, and the
                  default mark color it replaced hid the data.
                tests:
                  - MarkBuilder_Build_SequentialColorInterpolatesTheRange
                  - MarkBuilder_Build_DefaultRampReverseAndDivergingColors
                  - MarkBuilder_Build_DiscretizedColorsGiveTheColorOfTheClass
                  - MarkBuilder_Build_RampColorsPaintBarsRectsRulesAndTicks

              - id: CanvasNetVegaLite-Marks-MarkBuilder-StrokeAndSymbolChannels
                title: >-
                  The MarkBuilder unit shall give each item its stroke width, fill opacity, stroke opacity, and
                  stroke dash pattern from the strokeWidth, fillOpacity, strokeOpacity, and strokeDash channels
                  (a field through the scale, a value as given) in preference to the mark definition, and give
                  each symbol its shape from the shape channel (a symbol name, a custom path being kept as
                  written), its angle from the angle channel, and its size from a quantize, quantile, threshold, or
                  ordinal size scale; and shall ignore the shape, angle, and strokeDash channels of a mark that does
                  not draw them.
                justification: |
                  These channels carry the remaining encodings that distinguish items without color, and a mark
                  that cannot draw one must not be altered by it.
                tests:
                  - MarkBuilder_Build_ShapeChannelChoosesTheSymbolOfEachRow
                  - MarkBuilder_Build_EveryShapeNameReachesTheSymbol
                  - MarkBuilder_Build_StrokeWidthChannelScalesAndOverridesTheMark
                  - MarkBuilder_Build_StrokeDashChannelChoosesThePatternOfEachRow
                  - MarkBuilder_Build_FillAndStrokeOpacityChannelsScaleIndependently
                  - MarkBuilder_Build_AngleChannelRotatesTheSymbols
                  - MarkBuilder_Build_SizeOnDiscretizingScalesUsesTheClassOfTheValue
                  - MarkBuilder_Build_NewChannelsAreDeterministic

              - id: CanvasNetVegaLite-Marks-MarkBuilder-ExpressionValues
                title: >-
                  The MarkBuilder unit shall, when it is given the compiled expressions and an evaluator,
                  evaluate each expression reference of the mark color, fill, stroke, opacity, strokeWidth,
                  and size (point, circle, and square) and of the value of the color, fill, stroke, opacity,
                  and size (point, circle, and square) channels once per row with the row as the datum, use a
                  text result as a color and a finite number as an opacity, a width, or a size, keep the
                  default for a result of any other kind, and draw the row exactly as before when no
                  expression is given.
                justification: |
                  Row-bound values make a calculated field drive the look of a mark; a wrong result must never
                  produce an invalid scene item.
                tests:
                  - MarkBuilder_Build_RowBoundExpressionReferencesAreEvaluatedPerRow

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Limits
                title: >-
                  The MarkBuilder unit shall fail with a located VegaLiteRenderException when the number of scene items
                  would exceed the scene-item limit, counting the marks group and each item before it is created (a row
                  that draws nothing costs nothing; a limit of N allows exactly N items), shall stop with an
                  OperationCanceledException when the cancellation token is canceled, shall fail with a located
                  VegaLiteRenderException for a dash pattern of more than 64 entries (of the mark, a channel value,
                  or a scale range), and shall build nothing for a mark
                  type it does not support.
                justification: |
                  Marks scale with the data, so their number and their time must be bounded.
                tests:
                  - MarkBuilder_Build_LimitsCancellationAndUnsupportedMarks
                  - MarkBuilder_Build_BudgetCountsOnlyTheItemsThatAreCreated
                  - MarkBuilder_Build_StackedAndBinnedMarksRespectTheBudgetAndCancellation
                  - MarkBuilder_Build_LongDashPatternsExceedTheLimit
                  - MarkBuilder_Build_NewChannelsHonorCancellationAndTheSceneBudget
                  - CanvasNetVegaLite_SystemIntegration_Limits_SceneItemLimitIsExactAtTheBoundary

              - id: CanvasNetVegaLite-Marks-MarkBuilder-LogScales
                title: >-
                  The MarkBuilder unit shall draw the marks of a log, pow, sqrt, or symlog scale at the transformed
                  positions, start the bars of a log axis at the start of the domain (not stacked), and leave out
                  a row whose value the scale cannot map (a number that is not above zero on a log scale) instead of
                  drawing it at a position that is not a number.
                justification: |
                  A bar or point must sit where the transformed scale puts its value, and a value outside the scale
                  must not produce an invalid scene item.
                tests:
                  - MarkBuilder_Build_LogScaleBarsStartAtTheBaselineAndSkipValuesTheLogCannotMap
                  - CanvasNetVegaLite_SystemIntegration_LogScale_BarsRiseByTheLogarithmOfTheirValue
                  - CanvasNetVegaLite_SystemIntegration_SqrtAndSymlogScales_PointsSitAtTheTransformedPositions

              - id: CanvasNetVegaLite-Marks-MarkBuilder-BinnedChannels
                title: >-
                  The MarkBuilder unit shall draw the marks of a binned field on a color, fill, stroke, size, or other
                  scale channel with the value of the scale at the start of the bin of the row (the color of the bin
                  for a bin-ordinal scale, the size of the start of the bin for a linear one), color the bars of a
                  histogram by the bin they count when the color channel bins the field as the x channel does, charge
                  the scene items before creating them, and observe the cancellation token.
                justification: |
                  The marks are what the reader sees of a binned encoding; each must carry the class of its own bin.
                tests:
                  - MarkBuilder_Build_BinnedColorGivesEachMarkTheColorOfItsBin
                  - MarkBuilder_Build_BinnedSizeUsesTheStartOfTheBin
                  - MarkBuilder_Build_HistogramBarsTakeTheColorOfTheirBin
                  - MarkBuilder_Build_BinnedColorMarksAreChargedAndCancellable

              - id: CanvasNetVegaLite-Marks-MarkBuilder-ConditionalEncodings
                title: >-
                  The MarkBuilder unit shall evaluate the test of each condition of a color, fill, stroke,
                  opacity, fill opacity, stroke opacity, stroke width, stroke dash, size, shape, or angle
                  channel for every row with the expression engine, give the row the value (or the scaled
                  field) of the first condition that holds, else the value or scale of the channel, else the
                  default of the mark, ignore the conditions on a parameter, charge the evaluation to the step
                  budget, observe the cancellation token, and give the same items on every call.
                justification: |
                  A conditional encoding is how a chart highlights the rows that match a test; the first match
                  must win and the rest must look exactly as they do without the condition.
                tests:
                  - MarkBuilder_Build_ValueConditionOverridesTheBaseValueWhereTheTestHolds
                  - MarkBuilder_Build_ConditionWithoutBaseValueLeavesTheMarkDefault
                  - MarkBuilder_Build_FirstConditionThatHoldsWins
                  - MarkBuilder_Build_FieldConditionUsesTheScaleOfItsFieldWhereTheTestHolds
                  - MarkBuilder_Build_FieldWithValueConditionMapsTheFieldElsewhere
                  - MarkBuilder_Build_NumericChannelConditionsGiveValuesAndKeepDefaults
                  - MarkBuilder_Build_FillAndStrokeOpacityConditionsApplyPerRow
                  - MarkBuilder_Build_ShapeAndDashConditionsApplyPerRow
                  - MarkBuilder_Build_PredicateObjectTestsAreEvaluated
                  - MarkBuilder_Build_TestReadsVariableParametersAndMissingFieldsDoNotHold
                  - MarkBuilder_Build_ParameterConditionIsNotApplied
                  - MarkBuilder_Build_ConditionsApplyToBarsTicksAndRules
                  - MarkBuilder_Build_SizeConditionGivesTheThicknessOfABar
                  - MarkBuilder_Build_TestEvaluationIsChargedToTheStepBudget
                  - MarkBuilder_Build_CanceledTokenStopsTheEvaluation
                  - MarkBuilder_Build_ConditionalMarksAreDeterministic

              - id: CanvasNetVegaLite-Marks-MarkBuilder-TimeUnitBands
                title: >-
                  The MarkBuilder unit shall draw a bar or rect of a field with a time unit on a time scale
                  over its whole unit - from the start field to the end field, reduced to the relative
                  size of the width band or of timeUnitBandSize (1 by default), with the bar spacing, the
                  minimum band size compared with the whole unit, and the half-pixel offset of the axis as for
                  a bin - draw a bar or rect over the band of an ordinal time unit as on any band scale, and
                  draw a bar of a time scale without a time unit at the continuous band size.
                justification: |
                  A bar over a month must span the month, whatever the length of the month or the zone, and
                  must look like the bar of a histogram; Vega-Lite specifies the geometry.
                tests:
                  - MarkBuilder_Time_YearMonthBars_SpanTheirMonths
                  - MarkBuilder_Time_RectSpansItsUnitWithoutSpacing
                  - MarkBuilder_Time_TimeUnitBandSize_Half
                  - MarkBuilder_Time_WidthBand_IsTheRelativeSize
                  - MarkBuilder_Time_MinBandSize_WidensAThinUnit
                  - MarkBuilder_Time_TimeScalePoints_AtTheirDates_AndBarsUseTheContinuousBandSize
                  - MarkBuilder_Time_OrdinalTimeUnit_BandsOfABandScale
                  - MarkBuilder_Time_Zone_BarsSpanLocalMonths
                  - VegaLiteTemporalScale_RangeBars_SpanFromStartToEnd

              - id: CanvasNetVegaLite-Marks-MarkBuilder-TimeUnitPositions
                title: >-
                  The MarkBuilder unit shall place a point, circle, square, rule, or tick of a field with a time
                  unit at the start of the unit, a tick and the marks with a band position at the point of the
                  unit that the band position names (0.5 is the middle, 0.25 a quarter of the way, and 0 the
                  start), place the marks of a time scale at their dates, and draw a rect-based mark whose
                  band position is not one half at one half, the feature catalog reporting it.
                justification: |
                  The marks that do not span a unit must still sit where Vega-Lite puts them for the axis to
                  read correctly.
                tests:
                  - MarkBuilder_Time_PointsAtTheStartOfTheUnit
                  - MarkBuilder_Time_TicksAtTheMiddle
                  - MarkBuilder_Time_BandPositionOnAPoint
                  - MarkBuilder_Time_RectBandPositionNotHalf_IsReported
                  - VegaLiteTemporalScale_Points_SitAtTheirDates
                  - VegaLiteTemporalScale_ColorOverDates_FollowsTheDates

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Lines
                title: >-
                  The MarkBuilder unit shall draw a line mark as one path item per group of rows that have the
                  same value of every grouping field (the color, detail, key, and other non-position channels
                  with a field, and the size) - the groups in the order of their first row, each with its points
                  sorted stably by the pixel position of the dimension (x, or y for a horizontal orient) or by the
                  order channel - as the curve of the interpolation through the points, stroked with the paint, the
                  stroke width (the size of the first row, or the strokeWidth property), the dash, and the opacity
                  of the first row of the group and not filled, and shall draw nothing for a group that has fewer
                  than two defined points.
                justification: |
                  A line chart with a color is one line for each category; Vega-Lite groups, sorts, and paints the
                  lines so, and the same chart must look the same.
                tests:
                  - MarkBuilder_Build_LineHasHandDerivedSegmentsAndPaint
                  - MarkBuilder_Build_LineGroupsByColorAndDetailInFirstSeenOrder
                  - MarkBuilder_Build_LineSortsByPixelXAndByTheOrderChannel
                  - MarkBuilder_Build_LineSizeIsTheStrokeWidthOfTheFirstRow

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Areas
                title: >-
                  The MarkBuilder unit shall draw an area mark as one closed path item per group, the outline
                  between the value and the baseline - the top edge forward and the baseline backward along the
                  same curve - where the baseline is zero (or the first value of the domain), the start of the
                  stack for a stacked channel (so that the layers meet, a layer having a vertex at every key of the
                  dimension because the missing keys are imputed with zero), or the second channel (y2 or x2) of a
                  range, vertical by default and horizontal when the orient or the encoding says so, filled with
                  the paint of the first row of the group.
                justification: |
                  A stacked area chart and a range band are the area marks of Vega-Lite; their layers must meet
                  and their baselines must follow the data.
                tests:
                  - MarkBuilder_Build_AreaPolygonRunsBetweenTheValueAndTheBaseline
                  - MarkBuilder_Build_StackedAreaLayersMeetAndImputeMissingKeys
                  - MarkBuilder_Build_HorizontalAreaAndRangeAreaFollowOrient

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Trails
                title: >-
                  The MarkBuilder unit shall draw a trail mark as one trail item per group whose points carry the
                  position and the size of their row (the size channel through the size scale, or the size
                  property, or the Vega default), splitting the trail into runs of defined points at each row that
                  is not valid and dropping a run of one point.
                justification: |
                  A trail is a line whose width carries a measure; a gap in the data must break it as it breaks a
                  line.
                tests:
                  - MarkBuilder_Build_TrailPointsCarryTheSizeChannel
                  - MarkBuilder_Build_TrailBreaksAtInvalidRows

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Interpolation
                title: >-
                  The MarkBuilder unit shall draw the paths of a line, area, or trail with the curve that the
                  interpolate property of the mark (or of the configuration) names and with the tension that the
                  tension property gives to the curves that use it (bundle, cardinal, and catmull-rom), through
                  the CurveBuilder unit, and shall draw an area whose interpolation is bundle with the linear
                  interpolation, the FeatureCatalog reporting it.
                justification: |
                  The interpolation is how a line chart is smoothed; the curves and the fallback for the one that
                  has no area must be what the specification and the report say.
                tests:
                  - MarkBuilder_Build_InterpolateAndTensionSelectTheCurve
                  - MarkBuilder_Build_AreaBundleFallsBackToLinear

              - id: CanvasNetVegaLite-Marks-MarkBuilder-InvalidData
                title: >-
                  The MarkBuilder unit shall treat a row of a path mark as invalid when a channel that has a
                  continuous scale has no finite number, break the path at an invalid row in every mode that
                  starts with break-paths (the default, break-paths-show-path-domains) and connect the neighbors of
                  the row in the filter mode, apply the default mode for show and null (which the FeatureCatalog
                  reports), take the mode from the mark, the mark configuration, and the global mark
                  configuration in that order, and keep the invalid rows in the domains of the scales in every
                  mode.
                justification: |
                  A gap in the data must not be drawn as a line to zero; Vega-Lite breaks the path by default and
                  the modes must change nothing else.
                tests:
                  - MarkBuilder_Build_DefaultInvalidModeBreaksThePath
                  - MarkBuilder_Build_InvalidFilterConnectsTheNeighbors
                  - MarkBuilder_Build_InvalidShowIsTheDefaultModeAndReported

              - id: CanvasNetVegaLite-Marks-MarkBuilder-StrokeProperties
                title: >-
                  The MarkBuilder unit shall give the stroke dash, the stroke dash offset, the stroke cap, the
                  stroke join, and the stroke miter limit of the mark definition (or the configuration) to every
                  item that it creates - bars, rects, symbols, rules, ticks, paths, trails, texts, and arcs.
                justification: |
                  These properties decide the look of every stroked mark and must not depend on the mark type.
                tests:
                  - MarkBuilder_Build_StrokeDashCapJoinMiterAndOffsetReachEveryItemType

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Overlays
                title: >-
                  The MarkBuilder unit shall draw the overlays of the path marks after the base items - a point
                  mark at every row of a line, area, trail, or rule whose point property is true, an object (which
                  replaces the properties of the filled point mark), or transparent (with an opacity of zero), and
                  a line along the top edge of an area whose line property is true or an object - with the base
                  encoding without the secondary channels, the stacked end of a stacked channel, the default
                  opacity of 0.7 for an area that has an overlay and no opacity of its own, and the overlays that
                  config.<mark>.point and config.<mark>.line enable.
                justification: |
                  A line with points and an area with a line are the common forms of the path marks; Vega-Lite
                  draws them as layers of the base mark and the overlay must match.
                tests:
                  - MarkBuilder_Build_PointOverlayDrawsSymbolsWithTheOverlayDefinition
                  - MarkBuilder_Build_AreaLineOverlayAndDefaultOpacity
                  - MarkBuilder_Build_OverlayFromConfigAndTransparentPoints

              - id: CanvasNetVegaLite-Marks-MarkBuilder-DrawOrder
                title: >-
                  The MarkBuilder unit shall draw the items of every mark other than a path in the order of the
                  order channel (a stable sort ascending or descending by its fields) when the encoding is not
                  stacked, in the order of the data otherwise and for an order of null (or false, as channel or
                  mark property), so that the item drawn last is on top.
                justification: |
                  Which mark is on top of which in a crowded chart is decided by the order channel.
                tests:
                  - MarkBuilder_Build_OrderChannelSortsTheDrawOrderOfAnyMark
                  - MarkBuilder_Build_OrderNullKeepsTheDataOrder

              - id: CanvasNetVegaLite-Marks-MarkBuilder-PathLimits
                title: >-
                  The MarkBuilder unit shall charge the scene items of a path (one, and the upper bound of its
                  segments by the CurveBuilder unit) before it generates the segments, charge the grouping, the
                  sorting, and the comparisons of the paths to the evaluation-step budget, poll the cancellation
                  token for each group (and while the curve is built), fail with a located
                  VegaLiteRenderException when a limit is exceeded, charge nothing for a group that has fewer
                  than two points, and treat a row whose position (or baseline, or trail size) is not finite or is
                  beyond the magnitude bound of the painter as an undefined row, counting the defined points
                  by the same rule as the curve generators.
                justification: |
                  The cost of a path is a multiple of its points; it must be bounded before the memory is spent
                  and a caller must be able to abandon it. A position that the painter would skip must not split
                  a run after its segments were charged.
                tests:
                  - MarkBuilder_Build_PathSegmentsAreChargedBeforeCreation
                  - MarkBuilder_Build_PathBuildPollsCancellationAndChargesSteps
                  - MarkBuilder_Build_GroupsWithoutTwoPointsCostNothing
                  - MarkBuilder_Build_PointsBeyondTheMagnitudeBoundBreakThePath

              - id: CanvasNetVegaLite-Marks-MarkBuilder-TextItems
                title: >-
                  The MarkBuilder unit shall draw a text mark as one text item per row at the position of the x and
                  y channels (the middle of the data rectangle when absent) with the Vega-Lite defaults - the
                  alignment center and the baseline middle - the dx and dy offsets, the angle (property or
                  channel), the font, the font size (the size channel through the size scale, the fontSize
                  property, or the configuration), the font style and weight, the limit, the ellipsis, and the
                  line height, and the paint of a filled mark (black by default), and shall offset the position
                  by the polar radius and theta of the mark when it has them.
                justification: |
                  Text marks label the data; their position, font, and paint must be what Vega-Lite resolves.
                tests:
                  - MarkBuilder_Build_TextHasPositionDefaultsAndPaint
                  - MarkBuilder_Build_TextOffsetsAnglesAndFontPropertiesReachTheItem
                  - MarkBuilder_Build_TextSizeChannelMapsToTheFontSize

              - id: CanvasNetVegaLite-Marks-MarkBuilder-TextContent
                title: >-
                  The MarkBuilder unit shall make the label of a row from the text channel (a field, a value, or a
                  datum) or the text property (a string or an array) - a number with the d3 number format of the
                  channel or the configuration, a date or a time unit with the d3 time format (the format, the
                  specifier of the unit, or the time format of the configuration), a binned field as its start and
                  end, any other value as the JavaScript text of the value (null as null) - split the label into
                  the lines of an array or of the lineBreak text, draw nothing for an empty label, and use the
                  default format for a custom format type, the FeatureCatalog reporting it.
                justification: |
                  The text of a label must read as Vega-Lite would print it, in every culture.
                tests:
                  - MarkBuilder_Build_TextFormatsNumbersTimesAndNulls
                  - MarkBuilder_Build_TextArraysAndLineBreakMakeLines
                  - MarkBuilder_Build_TextMarkPropertyAndValueChannelAreUsed
                  - MarkBuilder_Build_TextCustomFormatTypeFallsBackToTheDefault

              - id: CanvasNetVegaLite-Marks-MarkBuilder-TextLimits
                title: >-
                  The MarkBuilder unit shall fail with a located VegaLiteRenderException before it formats a label
                  that would exceed the string-length limit (or, summed over the marks, sixteen times the limit),
                  charge the characters and lines of the labels to the evaluation-step budget, charge each line
                  of a label as a scene item before the item is created, and skip a row whose font size,
                  position, or angle is not finite or is beyond the magnitude bound of the painter (and draw no
                  label for a mark whose dx, dy, or line height is beyond it), so that a font size such as 1e300
                  never reaches the text measurer.
                justification: |
                  A label comes from the data and can be arbitrarily long or have arbitrarily many lines; the cost
                  must be bounded before the memory is spent. A font size or offset from an untrusted
                  specification must not be able to make the renderer throw or spend seconds on one label.
                tests:
                  - MarkBuilder_Build_TextCharactersAreChargedBeforeFormatting
                  - MarkBuilder_Build_TextLinesAreChargedAsItems
                  - MarkBuilder_Build_TextBeyondTheMagnitudeBoundIsSkipped

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Arcs
                title: >-
                  The MarkBuilder unit shall draw an arc mark as one arc item per row - the center at the position
                  of the x and y channels (the middle of the data rectangle when absent), the angles from the
                  theta and theta2 channels (or the mark properties) through the scale that runs from 0 to a whole
                  turn and the radii from the radius and radius2 channels (or the mark properties, with
                  innerRadius and outerRadius as aliases) through the scale that runs from 0 to half of the smaller
                  side of the view - for a stacked channel from the start to the end of the stack (so that the
                  slices of a pie are in the order of the data), for a band scale across its band, with the
                  padAngle and cornerRadius of the mark and the paint of a filled mark, ordering the two ends of an
                  angle and of a radius so that the larger radius is the outer one.
                justification: |
                  The pie, donut, and radial charts are the arc marks of Vega-Lite; the angle and the area of each
                  slice are the proportions that the reader compares.
                tests:
                  - MarkBuilder_Build_PieSlicesHaveHandDerivedAnglesAndRadii
                  - MarkBuilder_Build_DonutRadialAndConstantRadiiUseTheMarkProperties
                  - MarkBuilder_Build_ArcPadAngleCornerRadiusAndPaintReachTheItem
                  - MarkBuilder_Build_ArcCenterFollowsXAndY

              - id: CanvasNetVegaLite-Marks-MarkBuilder-PolarText
                title: >-
                  The MarkBuilder unit shall place a label of a text mark that has a theta or a radius at the
                  polar offset from its anchor (x grows by the radius times the sine of the angle and y falls by the
                  radius times its cosine), the angle of a stacked theta or radius being the point of the slice
                  that the band position names (the middle by default) so that the labels of a pie sit in their
                  slices, and shall not draw a label whose theta or radius is not valid.
                justification: |
                  Labels on a pie or a donut are placed by the polar channels of the text mark.
                tests:
                  - MarkBuilder_Build_PieLabelsSitAtTheMiddleOfTheirSlice
                  - MarkBuilder_Build_PolarTextOffsetsFollowThetaAndRadius
                  - MarkBuilder_Build_TextConstantAndFieldRadiusAndThetaOffsetTheAnchor

              - id: CanvasNetVegaLite-Marks-MarkBuilder-ArcLimits
                title: >-
                  The MarkBuilder unit shall charge each arc as a scene item before the item is created (a row that
                  draws nothing costs nothing), charge the rows to the evaluation-step budget, and poll the
                  cancellation token every 1,024 rows.
                justification: |
                  The number of arcs is the number of rows; it must be bounded before the memory is spent.
                tests:
                  - MarkBuilder_Build_ArcsAreChargedPerSliceAndPollCancellation
