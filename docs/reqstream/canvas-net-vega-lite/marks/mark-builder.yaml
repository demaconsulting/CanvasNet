---
# Software Unit Requirements for MarkBuilder
#
# These requirements describe the design-level behavior of the MarkBuilder unit of the Marks subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Marks): the per-mark geometry of bar, rect, point,
# circle, square, rule, and tick, the stacked, binned, and ranged geometry that the implicit encoding pipeline
# and the secondary channels x2 and y2 produce, the resolution of the paint and size channels, and the limits. The
# geometry rules follow Vega-Lite behavior, attributed in
# src/DemaConsulting.CanvasNet.VegaLite/third-party/README.md. See
# docs/verification/canvas-net-vega-lite/marks/mark-builder.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Marks Requirements
        sections:
          - title: MarkBuilder Requirements
            requirements:
              - id: CanvasNetVegaLite-Marks-MarkBuilder-BarRect
                title: >-
                  The MarkBuilder unit shall build a bar or rect for each row spanning the band of a
                  discrete scale (the band width reduced by the padding, or centered at an explicit size)
                  or centered at the continuous band size on a continuous scale, and from the value to
                  zero (or to the first domain value when zero is outside the domain and the bar is not
                  stacked) along the measure axis, spanning the whole rectangle when a channel is absent.
                justification: |
                  Bars and rects are the most common marks, and their position and extent are what a
                  reader compares.
                tests:
                  - MarkBuilder_Build_BarAndRectPositionsMatchExpectedSceneItems

              - id: CanvasNetVegaLite-Marks-MarkBuilder-StackedLayers
                title: >-
                  The MarkBuilder unit shall draw each layer of a stacked channel from the stack start to the
                  stack end of its row (vertical and horizontal, with the offsets zero, center, and normalize,
                  and with no stack when the encoding says null) as a bar, rect, or rule, and place a point,
                  circle, square, or tick on a stacked channel at the stack end.
                justification: |
                  A stacked bar chart is only readable when each layer sits on the one below it.
                tests:
                  - MarkBuilder_Build_StackedLayersSpanFromTheStackStartToItsEnd
                  - MarkBuilder_Build_StackedAndBinnedMarksRespectTheBudgetAndCancellation

              - id: CanvasNetVegaLite-Marks-MarkBuilder-BinnedBars
                title: >-
                  The MarkBuilder unit shall draw a bar or rect on a binned continuous channel across its bin
                  - from the start to the end of the bin on the scale, reduced by the bin spacing (1 pixel for
                  a bar and 0 for a rect and a tick by default, from the mark or the configuration) and offset
                  by the half pixel of the axis - widening a bin thinner than the minimum band size to that
                  size, centering a bar with an explicit size on the middle of its bin, drawing the bins in
                  reverse for a reversed scale, extending an already binned field with a step to one step past
                  its start when it has no end field, and place a point, circle, square, rule, or tick on a
                  binned channel at the middle of its bin.
                justification: |
                  A histogram must show bars that fill their bins and touch only by the spacing; Vega-Lite
                  draws them so and the same chart must look the same.
                tests:
                  - MarkBuilder_Build_BinnedBarsSpanTheirBinsLessTheSpacing
                  - MarkBuilder_Build_PreBinnedRangesSpanFromTheStartToTheEndField
                  - MarkBuilder_Build_StackedAndBinnedMarksRespectTheBudgetAndCancellation

              - id: CanvasNetVegaLite-Marks-MarkBuilder-SecondaryChannels
                title: >-
                  The MarkBuilder unit shall draw a bar or rect whose x or y has an x2 or y2 (a field, a
                  datum, or a pixel value) as a range between the two ends instead of a bar to zero or a
                  centered thickness, draw a rule with a range on one channel between the two ends and with
                  ranges on both between the two points, let a pixel value of the secondary channel win over a
                  stack start, and draw nothing for a row whose end is not a number.
                justification: |
                  Ranges (a floating bar, an error bar, a timeline) are written with the secondary
                  channels and must be drawn between the two ends.
                tests:
                  - MarkBuilder_Build_SecondaryChannelsSpanARange
                  - MarkBuilder_Build_PreBinnedRangesSpanFromTheStartToTheEndField

              - id: CanvasNetVegaLite-Marks-MarkBuilder-MarkClip
                title: >-
                  The MarkBuilder unit shall clip the marks to the data rectangle only when the mark says clip
                  true, and shall not clip them because a scale has an explicit domain, so that a bar that
                  starts at zero outside an explicit domain is drawn as Vega-Lite draws it.
                justification: |
                  Vega-Lite clips marks only with the mark's clip property or for the extent of an interval
                  selection (scaleClip); an explicit domain alone does not clip.
                tests:
                  - MarkBuilder_Build_BarAndRectPositionsMatchExpectedSceneItems

              - id: CanvasNetVegaLite-Marks-MarkBuilder-SymbolsRuleTick
                title: >-
                  The MarkBuilder unit shall build a point, circle, or square at the center of the band
                  or value of each row with the size from the mark, the size scale, or the style, a rule
                  as a full-height vertical line for x only or a full-width horizontal line for y only or
                  from the value to zero along the measure axis for both, and a tick across the band with
                  the configured thickness, oriented by the orientation rule.
                justification: |
                  These marks show individual values and their positions must match analytic
                  expectations.
                tests:
                  - MarkBuilder_Build_PointCircleSquareRuleAndTickMatchExpectedSceneItems

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Channels
                title: >-
                  The MarkBuilder unit shall give each item its paint, size, and opacity from the color,
                  fill, stroke, size, and opacity channels (a field through the scale, a value as given,
                  fill winning over color), from the mark definition, and from the style, mark, and
                  Vega configuration in that order, apply the default opacity of 0.7 to point, tick,
                  circle, and square marks that configure none, and drop the rows whose continuous value is
                  null or not a number.
                justification: |
                  The channels carry additional data in a chart and their defaults decide its look.
                tests:
                  - MarkBuilder_Build_ColorSizeAndOpacityUseExpectedProperties

              - id: CanvasNetVegaLite-Marks-MarkBuilder-ExpressionValues
                title: >-
                  The MarkBuilder unit shall, when it is given the compiled expressions and an evaluator,
                  evaluate each expression reference of the mark color, fill, stroke, opacity, strokeWidth,
                  and size (point, circle, and square) and of the value of the color, fill, stroke, opacity,
                  and size (point, circle, and square) channels once per row with the row as the datum, use a
                  text result as a color and a finite number as an opacity, a width, or a size, keep the
                  default for a result of any other kind, and draw the row exactly as before when no
                  expression is given.
                justification: |
                  Row-bound values make a calculated field drive the look of a mark; a wrong result must never
                  produce an invalid scene item.
                tests:
                  - MarkBuilder_Build_RowBoundExpressionReferencesAreEvaluatedPerRow

              - id: CanvasNetVegaLite-Marks-MarkBuilder-Limits
                title: >-
                  The MarkBuilder unit shall fail with a located VegaLiteRenderException when the number of scene items
                  would exceed the scene-item limit, counting the marks group and each item before it is created (a row
                  that draws nothing costs nothing; a limit of N allows exactly N items), shall stop with an
                  OperationCanceledException when the cancellation token is canceled, and shall build nothing for a mark
                  type it does not support.
                justification: |
                  Marks scale with the data, so their number and their time must be bounded.
                tests:
                  - MarkBuilder_Build_LimitsCancellationAndUnsupportedMarks
                  - MarkBuilder_Build_BudgetCountsOnlyTheItemsThatAreCreated
                  - MarkBuilder_Build_StackedAndBinnedMarksRespectTheBudgetAndCancellation
                  - CanvasNetVegaLite_SystemIntegration_Limits_SceneItemLimitIsExactAtTheBoundary
