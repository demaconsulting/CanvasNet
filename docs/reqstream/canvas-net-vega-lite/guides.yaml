---
# Software Subsystem Requirements for Guides
#
# These requirements decompose the CanvasNetVegaLite system's guide responsibility into the Guides subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Guides): text measurement with the bundled fonts
# (TextMeasurer), the title and subtitle block (TitleBuilder), the axis guide with its grid, ticks, labels,
# domain line, and title (AxisBuilder), the shared rules for the labels of time guides (TimeLabels), the removal of
# overlapping labels (LabelOverlap), the label expressions of axes and legends (LabelExpressions), and the legend guides
# (LegendBuilder), including the header guides of composed views (the header properties and blocks of a facet, the
# axis built in a header, and the owner of a shared legend). Guides produce scene items and the extents they need;
# the layout places them. Each requirement here links down to the unit requirements that implement it. See
# docs/verification/canvas-net-vega-lite/guides.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Guides Requirements
        requirements:
          - id: CanvasNetVegaLite-Guides-TextMeasurement
            title: >-
              The Guides subsystem shall resolve a font family to a TrueType font from the bundled fonts
              by default - mapping generic and Arial-like names to Liberation Sans, serif names to
              Liberation Serif, and monospace names to Liberation Mono, with bold and italic selected
              from the weight and style - use additional directories or installed fonts only when the
              caller opts in, and measure text by the real advance widths of the resolved font.
            justification: |
              Text width drives the layout of every axis and title; the bundled fonts keep the layout
              identical on every machine.
            children:
              - CanvasNetVegaLite-Guides-TextMeasurer-BundledFonts
              - CanvasNetVegaLite-Guides-TextMeasurer-FontSelection
              - CanvasNetVegaLite-Guides-TextMeasurer-Measurement
            tests:
              - TextMeasurer_Resolve_DefaultUsesBundledFonts
              - TextMeasurer_Resolve_NamedFamilyNeedsSystemFontsOrDirectories
              - TextMeasurer_Measure_TruncatesAndSplitsLines

          - id: CanvasNetVegaLite-Guides-MissingGlyphs
            title: >-
              The Guides subsystem shall find the characters of a text item that neither the resolved font
              nor the bundled fallback fonts cover, so that the document can report them.
            justification: |
              A character that is drawn as a missing-glyph box should be named to the author.
            children:
              - CanvasNetVegaLite-Guides-TextMeasurer-MissingGlyphs
            tests:
              - TextMeasurer_FindMissingGlyphs_AndMeasureWidth_UseTheBundledFallbackChain
              - TextMeasurer_FindMissingGlyphs_ChecksOnlyTheTruncatedTextThatIsDrawn

          - id: CanvasNetVegaLite-Guides-Titles
            title: >-
              The Guides subsystem shall build the title and subtitle of a chart as scene items for the
              orientations top, bottom, left, and right, the anchors start, middle, and end, and the
              frames group and bounds, with the configured fonts, offset, padding, and limit, giving the
              extent the layout must reserve for them and placing the block over the data rectangle and
              the guides.
            justification: |
              Titles are part of nearly every chart, and their extent decides the size of the canvas.
            children:
              - CanvasNetVegaLite-Guides-TitleBuilder-Placement
              - CanvasNetVegaLite-Guides-TitleBuilder-Properties
            tests:
              - TitleBuilder_Build_OrientAnchorAndSubtitleProduceExpectedExtent
              - TitleBuilder_Build_PropertiesLinesConfigurationAndLimit
              - VegaLiteDocument_Render_TitleIsPaintedAboveThePlotAndCenteredOnIt

          - id: CanvasNetVegaLite-Guides-Axes
            title: >-
              The Guides subsystem shall build the axis of a linear, band, or point position scale as
              scene items - grid, ticks, labels, domain line, and title - with the tick values and
              labels of the d3 algorithms, the Vega-Lite defaults and configuration precedence, the
              documented axis properties, removal of overlapping labels, drawing order, and the extent
              the layout must reserve, failing with a located exception for an invalid property.
            justification: |
              Axes are what make a chart readable, and their geometry decides the data rectangle.
            children:
              - CanvasNetVegaLite-Guides-AxisBuilder-GridTicksLabelsTitles
              - CanvasNetVegaLite-Guides-AxisBuilder-Configuration
              - CanvasNetVegaLite-Guides-AxisBuilder-LabelOverlap
              - CanvasNetVegaLite-Guides-AxisBuilder-DrawingOrder
              - CanvasNetVegaLite-Guides-AxisBuilder-Errors
              - CanvasNetVegaLite-Guides-AxisBuilder-StaticProperties
            tests:
              - AxisBuilder_Build_LinearAxisUsesExpectedTickValuesAndLabels
              - AxisBuilder_Build_BandAxisUsesExpectedCategoriesAndGrid
              - AxisBuilder_Build_TitleAndExtentMatchAnalyticLayout

          - id: CanvasNetVegaLite-Guides-AggregateTitles
            title: >-
              The Guides subsystem shall title the axis of an aggregated, binned, or range channel with the
              Vega-Lite default title (Sum of x, Count of Records, x (binned), or the merged title of the two
              ends of a range) unless an explicit title is given, and shall draw the grid of an aggregated
              measure but not of a binned field.
            justification: |
              Without a default title a reader could not tell a sum from a raw value, and the grid of a binned
              axis would suggest boundaries that are not the bins.
            children:
              - CanvasNetVegaLite-Guides-AxisBuilder-AggregateTitles
            tests:
              - AxisBuilder_Build_TitlesFollowThePlanAndACountHasAGrid
              - CanvasNetVegaLite_SystemIntegration_Aggregation_SumBarsHaveHandDerivedGeometryAndTitles

          - id: CanvasNetVegaLite-Guides-BinnedAxes
            title: >-
              The Guides subsystem shall ask a binned axis for one tick per ten pixels of its length unless
              the axis gives a tick count or values, and shall label a normalized stack with the normalized
              number format of the configuration unless the axis gives a format.
            justification: |
              The ticks of a histogram should follow its bins, and the share of a normalized stack is read as a
              percentage.
            children:
              - CanvasNetVegaLite-Guides-AxisBuilder-BinnedAxes
            tests:
              - AxisBuilder_Build_BinnedAxisAsksForATickPerTenPixels
              - AxisBuilder_Build_NormalizedStackUsesTheNormalizedNumberFormat
              - CanvasNetVegaLite_SystemIntegration_Binning_HistogramCountsEveryBin

          - id: CanvasNetVegaLite-Guides-OverlapRemoval
            title: >-
              The Guides subsystem shall remove overlapping guide labels with Vega's parity and greedy methods, for
              the labels of an axis and of a gradient legend alike, keeping the last label visible and never
              removing a label that has no neighbor closer than the separation.
            justification: |
              Axes and legends of dense data would otherwise be unreadable.
            children:
              - CanvasNetVegaLite-Guides-LabelOverlap-Parity
              - CanvasNetVegaLite-Guides-LabelOverlap-Greedy
              - CanvasNetVegaLite-Guides-LabelOverlap-Conditions
              - CanvasNetVegaLite-Guides-LabelOverlap-Cancellation
            tests:
              - LabelOverlap_Hidden_ParityKeepsEveryOtherLabelUntilNothingOverlaps
              - LabelOverlap_Hidden_GreedyHidesLabelsThatOverlapTheLastOneKept
              - AxisBuilder_Build_OverlappingLabelsAreRemovedByParity

          - id: CanvasNetVegaLite-Guides-LabelExpressionGuides
            title: >-
              The Guides subsystem shall replace the text of the labels of an axis and of a legend (symbols, gradient,
              and discrete gradient, with the ellipsis entry) with the result of the labelExpr of the guide, or else
              of the axis configuration for an axis, as Vega-Lite 6.5 does (the legend configuration has no
              labelExpr), evaluating it with the datum of Vega (value, label, index,
              tickIndex, perc, and perc2 as the guide has them) and the limits and parameters of the call, before
              the labels are measured, laid out, and thinned for overlap, so that a replaced label decides the
              extent of the guide, the legend width, and which labels are removed; a result that is null is an empty
              label, an array a multi-line label, and any other value its JavaScript text.
            justification: |
              Label expressions are the way an author formats a guide beyond a format string (a percent sign, a
              blank for every other tick, the name of a category); the replaced text must size and thin the guide
              as the original text would.
            children:
              - CanvasNetVegaLite-Guides-LabelExpressions-Datum
              - CanvasNetVegaLite-Guides-LabelExpressions-Coercion
              - CanvasNetVegaLite-Guides-LabelExpressions-Resolution
              - CanvasNetVegaLite-Guides-LabelExpressions-Limits
              - CanvasNetVegaLite-Guides-AxisBuilder-LabelExpressions
              - CanvasNetVegaLite-Guides-LegendBuilder-LabelExpressions
            tests:
              - LabelExpressions_Evaluate_ValueAndLabelAreBound
              - LabelExpressions_Evaluate_ArrayGivesLinesWithElementsTrimmed
              - AxisBuilder_Build_LabelExprAppendsPercent
              - AxisBuilder_Build_LabelExprOverlapRemovalUsesTheReplacedText
              - LegendBuilder_Build_LabelExprSymbolLegendGivesIndexValueAndLabel
              - LegendBuilder_Build_LabelExprGradientLegendGivesPerc

          - id: CanvasNetVegaLite-Guides-Legends
            title: >-
              The Guides subsystem shall build the legends of the channels color, size, shape, fill, stroke,
              strokeDash, strokeWidth, and opacity as scene items - symbol legends with an entry per value,
              gradient legends for continuous color scales, and discrete gradients for discretizing ones - merging
              the legends of channels that share a domain, with the Vega-Lite defaults and configuration, bounded
              by the limits of the system, and giving the size of each legend box for the layout.
            justification: |
              A legend is what explains the color, size, and shape of the marks; the size of its box decides the
              size of the chart.
            children:
              - CanvasNetVegaLite-Guides-LegendBuilder-Planning
              - CanvasNetVegaLite-Guides-LegendBuilder-Merging
              - CanvasNetVegaLite-Guides-LegendBuilder-Symbols
              - CanvasNetVegaLite-Guides-LegendBuilder-PathMarkSymbols
              - CanvasNetVegaLite-Guides-LegendBuilder-Entries
              - CanvasNetVegaLite-Guides-LegendBuilder-Grid
              - CanvasNetVegaLite-Guides-LegendBuilder-Gradient
              - CanvasNetVegaLite-Guides-LegendBuilder-DiscreteGradient
              - CanvasNetVegaLite-Guides-LegendBuilder-Titles
              - CanvasNetVegaLite-Guides-LegendBuilder-TitleOrient
              - CanvasNetVegaLite-Guides-LegendBuilder-Limits
              - CanvasNetVegaLite-Guides-LegendBuilder-Determinism
            tests:
              - LegendBuilder_Symbol_NominalColorOnAPointDrawsStrokedCirclesInOneColumn
              - LegendBuilder_Build_LineMarkUsesAStrokeSymbolInTheMarkColor
              - LegendBuilder_Build_AreaArcAndTextMarksUseFilledCircles
              - LegendBuilder_Gradient_ContinuousColorDrawsAVerticalBarWithTickLabels
              - LegendBuilder_Discrete_QuantizeColorDrawsOneBandPerClass
              - LegendPlan_Merge_ChannelsOfTheSameDomainShareOneLegend
              - LegendBuilder_Limits_AreEnforcedBeforeAnythingIsCreated

          - id: CanvasNetVegaLite-Guides-TimeAxes
            title: >-
              The Guides subsystem shall build the axis of a time or UTC scale, and of a field with a time
              unit, with the d3 time ticks of the scale in its time zone (the tick count as a number, an
              interval, or an interval and a step, the Vega-Lite default count and minimum step, explicit
              values as dates), with labels chosen in the order of Vega-Lite (a d3 time format, a multi-format
              with overrides, the default format of the time unit, or the default multi-format), with the
              time defaults of Vega-Lite for the grid, the label flush, the overlap, and the rotation, in every
              culture identically, and with the ticks and the label text bounded by the limits.
            justification: |
              A time axis is the axis of most time charts; it must read like a Vega-Lite time axis, in the zone
              the caller chose.
            children:
              - CanvasNetVegaLite-Guides-AxisBuilder-TimeTicks
              - CanvasNetVegaLite-Guides-AxisBuilder-TimeLabels
              - CanvasNetVegaLite-Guides-AxisBuilder-TimeDefaults
              - CanvasNetVegaLite-Guides-TimeLabels-FormatChoice
              - CanvasNetVegaLite-Guides-TimeLabels-TickRequests
              - CanvasNetVegaLite-Guides-TimeLabels-Instants
              - CanvasNetVegaLite-Guides-TimeLabels-Limits
            tests:
              - AxisBuilder_Time_DefaultLabelsAreMultiFormat
              - AxisBuilder_Time_TickCountNumberObjectAndInterval
              - AxisBuilder_Time_LabelFlushAndOverlapDefaults
              - TimeLabels_Create_ChoosesTheFormatInTheOrderOfVegaLite
              - TimeLabels_UsesVegaDefaultCount_OnlyForSingleMonthHoursDayQuarter
              - CanvasNetVegaLite_SystemIntegration_Time_PointsSitAtTheirDatesOnAMultiFormatAxis

          - id: CanvasNetVegaLite-Guides-TemporalLegends
            title: >-
              The Guides subsystem shall build the legends of temporal fields - the gradient of a temporal
              color with labels at the time ticks of its scale, the symbols of a size or opacity on a time
              scale, and the symbols of an ordinal time unit field - labeling the dates with the legend format,
              else the default format of the time unit, else the time format of the configuration, in the time
              zone of the scale and bounded by the limits.
            justification: |
              A legend of dates must say which dates each color or size stands for.
            children:
              - CanvasNetVegaLite-Guides-LegendBuilder-TemporalLabels
            tests:
              - LegendBuilder_Time_TemporalGradient_LabelsUseConfigTimeFormat
              - LegendBuilder_Time_LegendFormatOverridesAndUnitSpecifier
              - LegendBuilder_Time_SizeOnTimeScale_TicksAndLabels
              - CanvasNetVegaLite_SystemIntegration_Time_TemporalColorLegendShowsDates

          - id: CanvasNetVegaLite-Guides-LayerGuides
            title: >-
              The Guides subsystem shall build the guides of a layered view as Vega-Lite does: one axis for
              the layers that share a position scale and an axis (the titles of the layers merged: a written
              title wins over a derived one, the others joined), an axis for
              each of the others with the second on the opposite side and only the first with a grid unless the
              axis object says otherwise, and one legend for the layers that share a legend, merging the titles
              of the layers in the same way.
            justification: |
              The guides are what tells the reader which layer a position or a color stands for; a layered
              chart with duplicated or overlapping guides cannot be read.
            children:
              - CanvasNetVegaLite-Guides-AxisBuilder-LayerAxes
              - CanvasNetVegaLite-Guides-LegendBuilder-LayerLegends
            tests:
              - AxisBuilder_Build_DefaultOrientAndGridApplyOnlyWhenTheAxisSaysNothing
              - LegendPlan_Create_SameFieldInTwoLayersIsOneLegend
              - LegendPlan_Create_WrittenTitleOfAnyLayerWinsOverDerivedTitles
              - LegendPlan_Create_LayersInDifferentScopesKeepTheirOwnLegends
              - LegendPlan_Create_PropertiesOfALaterLayerAreKeptWhenTheFirstIsSilent
              - LegendPlan_Create_ExplicitOrientConflictMakesTheLegendsIndependent

          - id: CanvasNetVegaLite-Guides-CompositionGuides
            title: >-
              The Guides subsystem shall build the guides that the views of a composition need: the label of a facet
              cell and the title of a facet channel in the styles and with the header properties of Vega-Lite (resolved
              over the header configuration of the channel and config.header), the header or footer group that holds
              the label and the axis that the cells share, that shared axis itself in the coordinates of its header,
              and the owner of each legend so that a legend that composed views share is planned once for the view that
              owns it.
            justification: |
              Faceted and concatenated charts draw their axes, labels, and legends once for the cells that share
              them; the guides must be buildable in the header's coordinates and the legends must be planned by owner
              before the pipeline composes them.
            children:
              - CanvasNetVegaLite-Guides-TitleBuilder-HeaderSettings
              - CanvasNetVegaLite-Guides-TitleBuilder-HeaderBlocks
              - CanvasNetVegaLite-Guides-AxisBuilder-HeaderAxes
              - CanvasNetVegaLite-Guides-LegendBuilder-LegendOwners
            tests:
              - HeaderSettings_Read_HeaderOverRowColumnConfigOverHeaderConfig
              - TitleBuilder_BuildHeaderBlock_LabelUsesGuideLabelStyleSizeTen
              - TitleBuilder_BuildHeader_FooterHoldsAxisAndLabelBelowIt
              - AxisBuilder_Build_InHeaderPlacesBottomAxisAtOriginAndKeepsExtents
              - LegendPlan_Create_OwnersAreTheHighestSharingAncestor
