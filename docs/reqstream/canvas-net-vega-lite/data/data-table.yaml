---
# Software Unit Requirements for DataTable
#
# These requirements describe the design-level behavior of the DataTable unit of the Data subsystem (internal
# namespace DemaConsulting.CanvasNet.VegaLite.Data): the immutable row table, its typed DataValue, the field
# path syntax, and the JavaScript-compatible number formatting that gives values their text form. See
# docs/verification/canvas-net-vega-lite/data/data-table.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Data Requirements
        sections:
          - title: DataTable Requirements
            requirements:
              - id: CanvasNetVegaLite-Data-DataTable-ImmutableRows
                title: >-
                  The DataTable unit shall create a table from field names and rows of typed values, or
                  from records, copying its input so that the table cannot change afterwards, taking the
                  union of record keys in ordinal order, filling a missing field with null, keeping rows
                  without fields, and rejecting invalid arguments.
                justification: |
                  Scales and marks read the table many times; it must be a stable snapshot that cannot be
                  changed by the caller's collections.
                tests:
                  - DataTable_Create_StoresTypedImmutableRows
                  - DataTable_FromRecords_UnionsKeysInOrdinalOrderAndFillsMissingWithNull
                  - DataTable_FromRecords_RowsWithoutFieldsAreKept
                  - DataTable_Create_InvalidArgumentsAreRejected

              - id: CanvasNetVegaLite-Data-DataTable-FieldPaths
                title: >-
                  The DataTable unit shall find a field by a path that supports dotted, bracketed, and
                  escaped forms, splitting and joining paths by the Vega rules, and shall give -1 for an
                  absent or malformed path.
                justification: |
                  Specifications name nested fields as paths, and a lookup that guessed would read the wrong
                  column.
                tests:
                  - DataTable_FindField_SupportsDottedBracketedAndEscapedPaths
                  - FieldPath_Parse_SplitsPathsLikeVega

              - id: CanvasNetVegaLite-Data-DataTable-Values
                title: >-
                  The DataTable unit shall give each value a JavaScript-compatible text form (including
                  the shortest round-trip number text and exponent form) that does not depend on the
                  culture, shall read a value as a quantitative number only when it is a finite number,
                  a date, a boolean, or a numeric string, and shall order and compare values by a total
                  order with null before boolean before number before date before string.
                justification: |
                  Category labels and domain order must be identical on every machine and match what
                  Vega-Lite users expect from the same data.
                tests:
                  - JsNumber_ToString_MatchesJavaScriptNumberFormatting
                  - JsNumber_RoundAndRadix_FollowJavaScript
                  - DataValue_TextOrderingEqualityAndQuantitativeReading_FollowTheDocumentedRules

              - id: CanvasNetVegaLite-Data-DataTable-DateValues
                title: >-
                  The DataTable unit shall hold a date as an instant in UTC in milliseconds since the
                  epoch, created from milliseconds or from a DateTime (a local time converted to UTC and an
                  unspecified time taken as UTC), independent of the host time zone and culture, with the
                  years 1 to 9999 as its range (rejecting any other instant), shall give it the ISO 8601
                  text form with milliseconds and a trailing Z, the milliseconds as its quantitative
                  reading, equality by instant with zero equal to negative zero, and a position between
                  numbers and strings in the total order.
                justification: |
                  Dates parsed from data files must mean the same instant on every machine and must scale
                  and sort predictably; the TimeCalendar, TimeFormat, and time scale units build on this
                  representation and share its range.
                tests:
                  - DataTable_DateValuesHaveDeterministicQuantitativeAndTextForms

              - id: CanvasNetVegaLite-Data-DataTable-CompositeValues
                title: >-
                  The DataTable unit shall let a value be an immutable array (copying its elements, with the
                  JavaScript text form), an immutable object (DataObject, with its keys in insertion order,
                  a repeated key keeping its first position and its last value), or an opaque regular
                  expression, shall compare these composite values only by identity (an empty array or object
                  is not equal to another empty one), shall order them after every scalar without changing the
                  order of the scalars, and shall keep the behavior of the scalar values unchanged.
                justification: |
                  Expression results can be arrays and objects, and a JavaScript-like identity is what the
                  evaluator's equality and the flatten transform rely on.
                tests:
                  - DataValue_FromArray_CopiesElementsAndFormatsLikeJavaScript
                  - DataValue_Composites_AreEqualOnlyToThemselves
                  - DataObject_Create_KeepsInsertionOrderAndLastValueOfARepeatedKey
                  - DataValue_FromRegExp_CarriesOpaquePayload
                  - DataValue_Compare_ScalarOrderIsUnchangedAndCompositesSortLast

              - id: CanvasNetVegaLite-Data-DataTable-SortedCells
                title: >-
                  The DataTable unit shall build a table from a field list that is already in ordinal order
                  and cells that are already laid out row by row, checking the shape and the limits, so that a
                  transform can create a derived table without sorting its fields again.
                justification: |
                  Derived tables are created for every transform; building them directly from a known layout
                  keeps the cost proportional to the cells.
                tests:
                  - DataTable_FromSortedCells_BuildsATableAndChecksTheShape

              - id: CanvasNetVegaLite-Data-DataTable-Limits
                title: >-
                  The DataTable unit shall reject a table whose row count or field count exceeds the
                  corresponding limit with a VegaLiteRenderException that carries the supplied location.
                justification: |
                  A table is the largest allocation of a rendering and must be bounded.
                tests:
                  - DataTable_Create_LimitsFailClosedWithLocation
