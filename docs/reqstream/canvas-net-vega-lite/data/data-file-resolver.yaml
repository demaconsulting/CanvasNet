---
# Software Unit Requirements for DataFileResolver
#
# These requirements describe the design-level behavior of the DataFileResolver unit of the Data subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Data): the resolver that finds and reads the local data
# files that a chart names with a local data url (DataFileResolver and the DataFile record). It is the only
# code of the system that touches the file system or calls the caller's file callback, and it does so only through
# the core file-access engine: a path on disk is judged by the file-access policy of the open options (file-system
# mode) and a logical path is handed to the caller's callback (resolver mode), reads are bounded and decoded as
# strict UTF-8, and nothing is ever fetched from the network. The engine is required and verified at the core
# units (CanvasNet-Files-FileReferenceResolver-* and CanvasNet-Files-FileAccessPolicy-*); the
# requirements here cover what is specific to Vega-Lite (search order, wording and location of each refusal, the
# file limit, strict decoding). Each
# "tests" entry cites an existing test method in the DemaConsulting.CanvasNet.VegaLite.Tests project; see
# docs/verification/canvas-net-vega-lite/data/data-file-resolver.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Data Requirements
        sections:
          - title: DataFileResolver Requirements
            requirements:
              - id: CanvasNetVegaLite-Data-DataFileResolver-Resolution
                title: >-
                  The DataFileResolver unit shall read the file that an absolute path names directly and
                  find the file that a relative path names by searching
                  the base directory first and then each data path in declaration order, taking the first
                  file that exists, shall normalize backslashes and dot segments so that every spelling of
                  a path names one file, and shall return the decoded text together with the path as the
                  specification wrote it.
                justification: |
                  Authors write paths in different styles on different platforms; one deterministic search
                  order makes a chart resolve identically everywhere, and the written path is what an
                  author can recognize in a message.
                tests:
                  - DataFileResolver_Load_RelativePathUsesBaseDirectoryThenDataPaths
                  - DataFileResolver_Load_DotDotInsideRootNormalizesAndEscapeIsRejected

              - id: CanvasNetVegaLite-Data-DataFileResolver-FileAccess
                title: >-
                  The DataFileResolver unit shall read every data file through the core file-access engine
                  under the file-access policy of the open options (by default every regular local file,
                  also through dot-dot and an absolute path), and shall report as a VegaLiteRenderException
                  located at the data url, before any file-system access or callback request, a path that
                  is never allowed (an empty or white-space path, a UNC path, an alternate data stream, a
                  control character, a path that is not valid on the platform, and in resolver mode an
                  absolute path or one whose dot-dot segments leave the logical root) and a configured
                  directory that is not a valid path, and as a located VegaLiteRenderException that names
                  the policy, its reason and its hint a file the policy denies, each with Vega-Lite wording
                  that names the path as the specification wrote it and never a host directory.
                justification: |
                  Data urls resolve the way Vega-Lite resolves them by default; a host that renders untrusted
                  specifications confines them with a policy, a data path must then never be a way to read a
                  file the policy denies, and the author must be told which rule the path broke.
                tests:
                  - DataFileResolver_Load_HostilePathTextIsRejectedWithoutAnyAccess
                  - DataFileResolver_Load_DotDotInsideRootNormalizesAndEscapeIsRejected
                  - DataFileResolver_Load_DotDotOutsideTheBase_IsReadByDefault
                  - DataFileResolver_Load_CallbackMode_AbsolutePathIsALocatedError
                  - DataFileResolver_Translate_EveryFailureKind_ProducesLocatedWording
                  - DataFileResolver_Load_InvalidConfiguredDirectoryIsLocatedFailure

              - id: CanvasNetVegaLite-Data-DataFileResolver-Links
                title: >-
                  In file-system mode the DataFileResolver unit shall follow a symbolic link or junction
                  under the default policy, refuse one the policy denies (a link under the no-links policy,
                  or a link whose target leaves the roots of a roots policy) as a VegaLiteRenderException
                  located at the data url, and report a dangling link as a missing file.
                justification: |
                  Links are common in checkouts and are followed by default; a host that refuses them must be
                  able to, and the author must be told why the file was not read.
                tests:
                  - DataFileResolver_Translate_EveryFailureKind_ProducesLocatedWording
                  - DataFileResolver_Load_RealLinksAreRejectedOrCapabilitySkipped
                  - DataFileResolver_Load_RealLinksAreFollowedByDefaultOrCapabilitySkipped
                  - DataFileResolver_Load_RealDanglingLinkIsNotFoundOrCapabilitySkipped

              - id: CanvasNetVegaLite-Data-DataFileResolver-ResolverCallback
                title: >-
                  When the open options supply a file resolver, the DataFileResolver unit shall use only
                  that callback and shall not touch the file system, shall pass it only normalized logical
                  paths (the logical root first, then each data path that is itself a valid logical path
                  as a prefix) on the calling thread, shall dispose the stream it returns exactly once, and
                  shall report a callback that throws, a failure while reading the stream, and a failure
                  while disposing the stream as a located VegaLiteRenderException (without copying the
                  callback's own message), while letting a cancellation pass through unchanged.
                justification: |
                  Hosts that serve data from memory, archives, or a database need to control file access
                  completely and must be able to trust that no other access happens; the callback is
                  untrusted code, so its failures must never leak through the render contract as raw
                  exceptions.
                tests:
                  - DataFileResolver_Load_ResolverModeUsesNormalizedLogicalPathsWithoutFileSystem
                  - DataFileResolver_Load_CallbackStreamReadFailureIsLocated
                  - DataFileResolver_Load_CallbackFailureIsLocatedReadFailure
                  - DataFileResolver_Load_StreamDisposeFailureIsLocatedReadFailure

              - id: CanvasNetVegaLite-Data-DataFileResolver-MissingFiles
                title: >-
                  The DataFileResolver unit shall fail with a VegaLiteRenderException located at the data
                  url, never with an empty result, when no file exists for a path and when the document
                  has no base directory, no data path, and no resolver at all, and shall report an
                  existing directory where a file is expected, and an existing file that cannot be opened
                  (an access or I/O failure, whatever an existence check reports), as a located "cannot be
                  read" failure that is never reported as missing and that ends the search, while a file
                  that the open itself reports as not found is missing and lets the search continue with
                  the next root; the file opening itself (read-only with FileShare.ReadWrite and
                  FileShare.Delete) is delegated to the core file-access engine.
                justification: |
                  A local data file that cannot be used must never be mistaken for an empty dataset, an
                  implicit current directory would make a chart depend on the host's working directory,
                  and a raw I/O exception must not escape the documented render contract. An inaccessible
                  file is not a missing one, so the author is told the real cause instead of being sent to
                  look for a typo. Permissive sharing keeps a concurrent writer or rename from failing the
                  render.
                tests:
                  - DataFileResolver_Load_MissingFileIsHardFailure
                  - DataFileResolver_Load_ExistingDirectoryAtFilePathIsLocatedReadFailure
                  - DataFileResolver_Load_StreamWithoutFileSourceThrows

              - id: CanvasNetVegaLite-Data-DataFileResolver-Cache
                title: >-
                  The DataFileResolver unit shall request each distinct candidate at most once per
                  instance, remembering a miss as well as a hit, and shall decode each distinct file once,
                  so that a chart that names a file repeatedly (under any spelling) reads it once.
                justification: |
                  Repeated reads would multiply the cost of a hostile chart and let a file change between two
                  reads of one call.
                tests:
                  - DataFileResolver_Load_CacheRequestsEachCandidateOncePerCall
                  - DataFileResolver_Load_FileSystemFilesAreCachedPerCall

              - id: CanvasNetVegaLite-Data-DataFileResolver-FileLimit
                title: >-
                  The DataFileResolver unit shall read at most the configured number of distinct data
                  files, counting a file when it is found and not when it is requested again or does not
                  exist, accepting exactly the limit, and failing with a VegaLiteRenderException that names
                  the limit for the first file over it, which is refused by the core file-access engine
                  before it is opened or the resolver callback is asked for it, whatever the policy.
                justification: |
                  The number of files bounds the work and the memory of the data stage.
                tests:
                  - DataFileResolver_Load_MaxDataFilesAtLimitAndOneOver
                  - DataFileResolver_Translate_EveryFailureKind_ProducesLocatedWording

              - id: CanvasNetVegaLite-Data-DataFileResolver-ByteLimit
                title: >-
                  The DataFileResolver unit shall read at most the configured number of bytes of a file,
                  from a real file and from a callback stream alike, accepting exactly the limit, failing
                  with a VegaLiteRenderException that names the limit for a longer file, and stopping a
                  stream that never ends one chunk past the limit.
                justification: |
                  A data file is untrusted input and a stream may never end; an unbounded read would
                  exhaust memory.
                tests:
                  - DataFileResolver_Load_MaxDataBytesAtLimitAndOneOver
                  - DataFileResolver_Load_EndlessStreamStopsAtBound

              - id: CanvasNetVegaLite-Data-DataFileResolver-StrictUtf8
                title: >-
                  The DataFileResolver unit shall decode a data file as strict UTF-8, removing one byte-order
                  mark, and shall fail with a located VegaLiteRenderException for bytes that are not valid
                  UTF-8 (including UTF-16 text) instead of replacing them.
                justification: |
                  Replacement characters would silently change the data; the specification text itself is
                  read with the same strictness.
                tests:
                  - DataFileResolver_Load_InvalidUtf8IsRejectedStrictly

              - id: CanvasNetVegaLite-Data-DataFileResolver-Cancellation
                title: >-
                  The DataFileResolver unit shall honor cancellation: it shall make no request and open no
                  file when the token is already canceled, throwing OperationCanceledException.
                justification: |
                  Reading may touch slow storage; a caller must be able to abandon it promptly.
                tests:
                  - DataFileResolver_Load_CanceledTokenStopsBeforeAnyRequest
