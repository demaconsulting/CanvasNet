---
# Software Subsystem Requirements for Scales
#
# These requirements decompose the CanvasNetVegaLite system's scaling responsibility into the Scales subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Scales): the immutable scale mappings (ScaleModel), the
# Vega-Lite inference of scales from the encoding and the data (ScaleResolver, including the time and UTC scales of
# Phase 8), the ports of the d3-array and d3-time tick algorithms (Ticks) and of the d3-format number formatter
# (NumberFormat), the catalog of Vega color schemes
# (ColorSchemes), and the color interpolation (ColorInterpolator). Ticks, NumberFormat, and ColorInterpolator
# are own C# ports of ISC-licensed d3 algorithms, and the colors of the schemes are published palette data;
# all are attributed in
# src/DemaConsulting.CanvasNet.VegaLite/third-party/README.md. Each requirement here links down to the unit
# requirements that implement it. See docs/verification/canvas-net-vega-lite/scales.md for the test-evidence
# mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Scales Requirements
        requirements:
          - id: CanvasNetVegaLite-Scales-Types
            title: >-
              The Scales subsystem shall infer the scale of each channel from its field type, mark, and
              scale properties - linear for quantitative positions, band or point for nominal and
              ordinal positions by mark, a time scale for a temporal field (a UTC scale for a utc time
              unit), a sequential scale for a quantitative color, an ordinal scale for a discrete color,
              shape, or stroke dash, and the documented continuous ranges for size and
              opacity - and shall infer the orientation of bar, tick, rule, line, area, trail, and arc marks.
            justification: |
              The scale type decides how every value is positioned; inferring it as Vega-Lite does is what
              makes the same specification produce the same chart.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-TypeInference
              - CanvasNetVegaLite-Scales-ScaleResolver-Orient
              - CanvasNetVegaLite-Scales-ScaleResolver-TemporalTypes
            tests:
              - ScaleResolver_Resolve_InfersQuantitativeNominalOrdinal
              - ScaleResolver_InferOrient_FollowsVegaLite
              - ScaleResolver_InferOrient_AreaRangeAndTemporalRulesFollowVegaLite
              - ScaleResolver_Temporal_XDefaultsToATimeScaleWithTheDataExtent

          - id: CanvasNetVegaLite-Scales-PolarScales
            title: >-
              The Scales subsystem shall resolve the theta and radius channels of the arc and text marks as
              scales - the angle over a whole turn and the radius over half of the smaller side of the view,
              linear by default with zero and no nice or padding, band or point for a discrete field, the
              explicit transformed types, and a domain that spans a stack - and shall give a channel a scale
              only for the marks that draw it.
            justification: |
              Pie, donut, and radial charts are drawn through the polar scales, and a channel that a mark does
              not draw must be ignored rather than resolved.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-PolarScales
              - CanvasNetVegaLite-Scales-ScaleResolver-ChannelGating
            tests:
              - ScaleResolver_Resolve_ThetaHasTheFullCircleRange
              - ScaleResolver_Resolve_StackedThetaDomainSpansTheStack
              - ScaleResolver_ChannelIsDrawn_FollowsTheSupportTable

          - id: CanvasNetVegaLite-Scales-Domains
            title: >-
              The Scales subsystem shall compute scale domains from the data or from an explicit domain,
              applying zero, nice, and sort as documented, reading the field that the encoding names (a
              derived field of a bin, an aggregate, or a stack included), taking the extent of the rows
              before the aggregate for an unaggregated domain, ordering discrete values ascending by default
              with a fixed order across value kinds, and shall fail with a located specification
              exception for an invalid scale property.
            justification: |
              The domain decides which values the chart shows and where they fall; invalid properties must
              stop the renderer with the location of the mistake.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-Domains
              - CanvasNetVegaLite-Scales-ScaleResolver-Validation
              - CanvasNetVegaLite-Scales-ScaleResolver-PlanFields
              - CanvasNetVegaLite-Scales-ScaleResolver-UnaggregatedDomain
            tests:
              - ScaleResolver_Resolve_AppliesZeroNiceDomainRangeAndPadding
              - ScaleResolver_Resolve_DiscreteDomainsFollowTheSortProperty
              - ScaleResolver_Resolve_UnaggregatedDomainReadsTheRawRows
              - ScaleResolver_Resolve_InvalidInputsFailWithLocation

          - id: CanvasNetVegaLite-Scales-TimeScales
            title: >-
              The Scales subsystem shall map dates with the time and UTC scales (the d3 scaleTime
              arithmetic over millisecond instants, with the domain of the extent of the dates, the end of
              the bars of a time unit included, no zero, no padding for the bars of a time unit, and nice
              only when asked, as a count, an interval, or an interval and a step), shall resolve the
              explicit domain, domainMin, domainMax, and datum of a temporal field from timestamps, date
              texts, datetime objects, and the part of a single unit, bounded by the scale domain limit, and
              shall give a nominal or ordinal field with a time unit a band, point, or ordinal scale over
              the unit starts in date order.
            justification: |
              Time charts are among the most common charts; the placement of a date must be exact, and the
              rules for the domain must be those of Vega-Lite.
            children:
              - CanvasNetVegaLite-Scales-ScaleModel-TimeScales
              - CanvasNetVegaLite-Scales-ScaleResolver-TemporalDomains
              - CanvasNetVegaLite-Scales-ScaleResolver-TimeNice
              - CanvasNetVegaLite-Scales-ScaleResolver-DiscreteTimeUnits
            tests:
              - ScaleModel_Time_MapsDatesLinearly
              - ScaleResolver_TimeUnitBarDomainIncludesTheEnd
              - ScaleResolver_DomainStringsAndDatetimeObjects
              - ScaleResolver_NiceTrueAndInterval
              - ScaleResolver_OrdinalTimeUnit_UsesABandScaleSortedByDate
              - CanvasNetVegaLite_SystemIntegration_Time_PointsSitAtTheirDatesOnAMultiFormatAxis

          - id: CanvasNetVegaLite-Scales-TemporalColors
            title: >-
              The Scales subsystem shall color a temporal field with a continuous scale over milliseconds
              with the range, scheme, and interpolation of a sequential scale, replacing a discretizing scale
              type that a temporal field does not accept.
            justification: |
              A chart that colors by date needs a continuous color scale; Vega-Lite does not discretize a
              temporal field.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-TemporalColor
            tests:
              - ScaleResolver_TemporalColor_IsSequentialOverMilliseconds
              - ScaleResolver_TemporalColorQuantile_Threshold_Quantize_FallBackToSequential
              - CanvasNetVegaLite_SystemIntegration_Time_TemporalColorLegendShowsDates
          - id: CanvasNetVegaLite-Scales-SortByAggregate
            title: >-
              The Scales subsystem shall order a discrete channel by an aggregate of a field of the rows
              (a sort object with an op, the shorthand of a channel, or the encoding of a channel), keeping
              categories with equal values in first-seen order and giving a category without a value the
              first position, as a stable, bounded, culture-independent sort.
            justification: |
              A bar chart ordered by its value is the most common use of an aggregate in a chart, and the
              order must be deterministic.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-SortByField
              - CanvasNetVegaLite-Scales-ScaleResolver-SortArrayLimits
            tests:
              - ScaleResolver_Resolve_SortByFieldUsesTheTransformedRows
              - ScaleResolver_Resolve_SortsByAnotherChannelsAggregate
              - ScaleResolver_Resolve_SortIsChargedBoundedAndCancellable
              - ScaleResolver_Resolve_SortArrayIsBoundedAndPollsCancellation

          - id: CanvasNetVegaLite-Scales-BinnedDomains
            title: >-
              The Scales subsystem shall give a binned position channel the domain of its bins (the start of
              the first to the stop of the last, or the extent of the start and end fields of already binned
              data, without a zero rule), and a discrete binned channel the bin texts in the order of the
              bins.
            justification: |
              The axis of a histogram must cover and label the bins.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-BinnedDomains
            tests:
              - ScaleResolver_Resolve_BinnedScalesHaveNoNiceUnlessAsked
              - ScaleResolver_Resolve_PreBinnedDomainIsTheUnionOfStartAndEnd
              - ScaleResolver_Resolve_OrdinalBinsSortByStartAndDescendingReverses

          - id: CanvasNetVegaLite-Scales-StackedDomains
            title: >-
              The Scales subsystem shall give a stacked position channel, and a channel with a second field,
              a domain that spans both ends of its marks (the start and end of the layers, or the two ends
              of a range), and the domain 0 to 1 for a normalized stack.
            justification: |
              The axis of a stacked chart must reach the total of the stack, and the axis of a range chart
              must show both ends.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-StackedDomains
            tests:
              - ScaleResolver_Resolve_RangeDomainIsTheUnionOfBothFields
              - ScaleResolver_Resolve_ScalesCarryThePlanFacts
              - ScaleResolver_Resolve_StackedDomainReachesTheTotalOfTheHighestStack
              - ScaleResolver_Resolve_StackedDomainIncludesNegativeLayers
              - ScaleResolver_Resolve_SignedStackDomainInBothOrientations
              - ScaleResolver_Resolve_NormalizedStackHasTheUnitDomain

          - id: CanvasNetVegaLite-Scales-Positions
            title: >-
              The Scales subsystem shall map data values to pixel positions with linear, band, and point scales using
              the d3-scale arithmetic - domain to range (piecewise for more than two entries), padding, alignment, band
              width and step, clamping, rounding, and reversal - and shall derive the ranges, paddings, and steps of the
              position, size, and opacity channels from the data rectangle and the configuration.
            justification: |
              Every mark and every tick is placed by these mappings, so they must match analytic
              expectations exactly.
            children:
              - CanvasNetVegaLite-Scales-ScaleModel-Mappings
              - CanvasNetVegaLite-Scales-ScaleResolver-Ranges
            tests:
              - ScaleModel_Map_LinearBandAndPointMatchAnalyticPositions
              - ScaleModel_Map_PiecewiseLinearFollowsD3Polymap
              - ScaleModel_Map_PiecewiseTruncatesToTheShorterOfDomainAndRange
              - ScaleResolver_Resolve_PiecewiseDomainAndRangeFollowD3
              - ScaleResolver_Resolve_PaddingsFollowMarkAndScaleProperties
              - ScaleResolver_Resolve_DiscreteSizesComeFromTheStep

          - id: CanvasNetVegaLite-Scales-CategoryColors
            title: >-
              The Scales subsystem shall assign categorical colors from the tableau10 scheme (or an
              explicit range, a scheme, or a configured named range) by cycling through the colors in
              domain order, shall sample a continuous scheme for the categories of an ordinal field, and
              shall find schemes by name ignoring case.
            justification: |
              The default categorical palette is part of the look of every colored chart and must be
              deterministic.
            children:
              - CanvasNetVegaLite-Scales-ColorSchemes-Tableau10
              - CanvasNetVegaLite-Scales-ColorSchemes-Lookup
              - CanvasNetVegaLite-Scales-ScaleModel-Ordinal
              - CanvasNetVegaLite-Scales-ScaleResolver-Colors
            tests:
              - ColorSchemes_Tableau10_ReturnsDocumentedCategoryColors
              - ScaleModel_MapOrdinal_CyclesThroughTheRange
              - ScaleResolver_Resolve_OrdinalColorsUseTheConfiguredRanges

          - id: CanvasNetVegaLite-Scales-ContinuousColors
            title: >-
              The Scales subsystem shall give a quantitative color field a sequential scale (diverging with a
              middle value) that maps a number to a color of the ramp, diverging, or heatmap range of the
              configuration, a named scheme with an extent and a reversal, or an explicit list of colors
              interpolated in the color space that interpolate names, with the zero, nice, domainMin,
              domainMax, domainMid, and clamp rules of Vega, and shall fail with a located specification error
              for an unknown scheme or range name.
            justification: |
              A continuous color encoding is one of the main reasons to draw a chart with a color scale; it must
              look as it does in Vega-Lite.
            children:
              - CanvasNetVegaLite-Scales-ScaleModel-Sequential
              - CanvasNetVegaLite-Scales-ScaleModel-Diverging
              - CanvasNetVegaLite-Scales-ScaleResolver-ColorScales
              - CanvasNetVegaLite-Scales-ScaleResolver-Schemes
              - CanvasNetVegaLite-Scales-ScaleResolver-ConfigRange
            tests:
              - ScaleModel_Sequential_MapsThroughTheInterpolator
              - ScaleModel_Diverging_UsesTheTwoSlopes
              - ScaleResolverColor_Default_QuantitativeColorIsSequentialWithTheRampScheme
              - ScaleResolverColor_Scheme_NamesObjectsAndExtents
              - ScaleResolverColor_ConfigRange_NamedRangesAreListsOrSchemes

          - id: CanvasNetVegaLite-Scales-DiscretizingScales
            title: >-
              The Scales subsystem shall classify values with quantize (equal-width intervals), quantile
              (R-7 quantiles of the sorted values), threshold (explicit boundaries), and bin-ordinal scales,
              with the class counts, scheme colors, and spread numbers of Vega and Vega-Lite, a located error
              for a range or count above the limit, a cancellable and step-charged read of the values, and
              deterministic results.
            justification: |
              Classified charts and legends depend on where the class boundaries fall and how many classes there are.
            children:
              - CanvasNetVegaLite-Scales-ScaleModel-Quantize
              - CanvasNetVegaLite-Scales-ScaleModel-Quantile
              - CanvasNetVegaLite-Scales-ScaleModel-Threshold
              - CanvasNetVegaLite-Scales-ScaleModel-BinOrdinal
              - CanvasNetVegaLite-Scales-ScaleResolver-Discretizing
              - CanvasNetVegaLite-Scales-ScaleResolver-ColorLimits
            tests:
              - ScaleModel_Quantize_ThresholdsAreEqualWidth
              - ScaleModel_Quantile_UsesR7Thresholds
              - ScaleModel_Threshold_Bisects
              - ScaleModel_BinOrdinal_MapsByBinIndex
              - ScaleResolverColor_Quantize_UsesFiveSchemeColorsOverEqualIntervals
              - ScaleResolverColor_Limits_AreEnforcedBeforeAnythingIsBuilt

          - id: CanvasNetVegaLite-Scales-ChannelRanges
            title: >-
              The Scales subsystem shall give the strokeWidth, fillOpacity, strokeOpacity, angle, shape, and
              strokeDash channels scales with Vega-Lite's default ranges (and the rangeMin and rangeMax overrides)
              for the marks that use them.
            justification: |
              These channels are drawn from their scales, so the defaults must match Vega-Lite.
            children:
              - CanvasNetVegaLite-Scales-ScaleResolver-NewChannels
            tests:
              - ScaleResolverColor_NewChannels_UseTheirDefaultRanges
              - ScaleResolverColor_Channels_AreDroppedForMarksThatDoNotUseThem

          - id: CanvasNetVegaLite-Scales-ColorSchemeCatalog
            title: >-
              The Scales subsystem shall provide the 68 Vega color schemes (15 categorical lists and 53
              continuous ramps) with the number of colors and the end colors of their published tables,
              shall turn a scheme into the range of a scale with the number of colors, extent, and
              reversal rules of Vega under a color limit and cancellation, and shall ship the license
              notices of the palettes with the package.
            justification: |
              A scheme name that Vega accepts must give the colors that Vega gives, and the ColorBrewer,
              Turbo, and cividis licenses require their notices to be distributed with the colors.
            children:
              - CanvasNetVegaLite-Scales-ColorSchemes-Catalog
              - CanvasNetVegaLite-Scales-ColorSchemes-Continuous
              - CanvasNetVegaLite-Scales-ColorSchemes-Discrete
              - CanvasNetVegaLite-Scales-ColorSchemes-RangeConfiguration
              - CanvasNetVegaLite-Scales-ColorSchemes-Limits
              - CanvasNetVegaLite-Scales-ColorSchemes-Determinism
              - CanvasNetVegaLite-Scales-ColorSchemes-Notices
            tests:
              - ColorSchemes_Catalog_HasSixtyEightSchemesWithUniqueNames
              - ColorSchemes_Interpolate_IsPiecewiseLinearInSrgb
              - ColorSchemes_Configure_ExtentAndReverse
              - ColorSchemes_Notices_ShipWithTheTablesAndNameEveryLicense

          - id: CanvasNetVegaLite-Scales-ColorInterpolation
            title: >-
              The Scales subsystem shall interpolate colors in sRGB (with a gamma), HSL, CIELAB, and HCL
              with whole 8-bit results, piecewise through a list of colors, and shall sample interpolators
              for discrete ranges, deterministically and under a cancellation check.
            justification: |
              Continuous color scales, scheme ranges, and the gradient of a legend all depend on one exact,
              deterministic color interpolation.
            children:
              - CanvasNetVegaLite-Scales-ColorInterpolator-Rgb
              - CanvasNetVegaLite-Scales-ColorInterpolator-Spaces
              - CanvasNetVegaLite-Scales-ColorInterpolator-Gamma
              - CanvasNetVegaLite-Scales-ColorInterpolator-Piecewise
              - CanvasNetVegaLite-Scales-ColorInterpolator-Quantize
              - CanvasNetVegaLite-Scales-ColorInterpolator-Conversions
              - CanvasNetVegaLite-Scales-ColorInterpolator-Determinism
            tests:
              - ColorInterpolator_Rgb_RoundsHalfAwayAndClamps
              - ColorInterpolator_Hsl_Lab_Hcl_Match_HandDerivedVectors
              - ColorInterpolator_Piecewise_ChoosesTheSegmentAndExtrapolates
              - ColorInterpolator_Interpolation_IsDeterministic

          - id: CanvasNetVegaLite-Scales-Ticks
            title: >-
              The Scales subsystem shall generate axis tick values, tick steps, and nice domains with a
              port of the d3-array ticks, tickStep, and nice algorithms, shall choose the default tick
              count from the axis length and the minimum step from the format as Vega-Lite does, and shall
              fail closed when a count would exceed the tick limit.
            justification: |
              The tick values are what an axis shows; matching the d3 algorithm is what makes an axis
              look like a Vega-Lite axis, and an unbounded count would exhaust memory.
            children:
              - CanvasNetVegaLite-Scales-Ticks-Generation
              - CanvasNetVegaLite-Scales-Ticks-Nice
              - CanvasNetVegaLite-Scales-Ticks-AxisCounts
              - CanvasNetVegaLite-Scales-Ticks-Limits
            tests:
              - Ticks_Ticks_LinearRangeMatchesHandDerivedExpectedVector
              - Ticks_TickStep_UsesHandDerivedExpectedStep
              - Ticks_Nice_ExpandsDomainToExpectedBoundaries

          - id: CanvasNetVegaLite-Scales-TimeTicks
            title: >-
              The Scales subsystem shall generate the ticks of a time or UTC scale with a port of the d3-time
              and d3-scale time tick algorithms (the interval whose duration is nearest the target, the
              boundaries of the time zone of the chart, an explicit interval or interval and step as the
              tick count), shall make a time domain nice to the boundary of an interval, shall reduce the count
              for the minimum step of a time unit, and shall fail closed when the ticks would exceed the
              tick limit.
            justification: |
              The ticks of a time axis are the boundaries of calendar units in the chart's zone; an
              unbounded count would exhaust memory.
            children:
              - CanvasNetVegaLite-Scales-Ticks-TimeTicks
              - CanvasNetVegaLite-Scales-Ticks-TimeNice
              - CanvasNetVegaLite-Scales-Ticks-TimeCounts
            tests:
              - Ticks_TimeTickInterval_FollowsD3Table
              - Ticks_TimeTicks_Month_Boundaries_InAZone
              - Ticks_TimeNice_WeekExample
              - Ticks_TimeTicks_MaxTicksExceeded_Throws
              - Ticks_ResolveTickCount_MinStep_CapsCount
          - id: CanvasNetVegaLite-Scales-Formatting
            title: >-
              The Scales subsystem shall format quantitative labels with a port of the d3-format
              specifier mini-language - fill, align, sign, symbol, zero, width, comma, precision, trim,
              and type - choosing the precision of tick labels from the tick step, using en-US separators
              and the minus sign U+2212 whatever the current culture, and limiting the width.
            justification: |
              Label text must match what Vega-Lite users expect, be identical on every machine, and not
              allow a format to demand unbounded memory.
            children:
              - CanvasNetVegaLite-Scales-NumberFormat-Specifier
              - CanvasNetVegaLite-Scales-NumberFormat-Formatting
              - CanvasNetVegaLite-Scales-NumberFormat-TickFormat
              - CanvasNetVegaLite-Scales-NumberFormat-Culture
              - CanvasNetVegaLite-Scales-NumberFormat-Limits
            tests:
              - NumberFormat_Format_QuantitativeLabelsMatchHandDerivedExpectedVector
              - NumberFormat_TickFormat_ChoosesThePrecisionFromTheTickStep
              - NumberFormat_Format_IgnoresTheCurrentCulture
