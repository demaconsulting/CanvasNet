---
# Software Unit Requirements for Ticks
#
# These requirements describe the design-level behavior of the Ticks unit of the Scales subsystem (internal
# namespace DemaConsulting.CanvasNet.VegaLite.Scales): the C# port of the d3-array ticks, tickStep, and
# tickIncrement algorithms and the d3-scale linear nice algorithm, and (in Ticks.Time.cs) the d3-time and d3-scale
# time ticks and time nice algorithms over the TimeCalendar unit, with the Vega-Lite default tick count and
# the Vega tick-count reduction. The port is an own implementation of the algorithms of d3-array 3.2.4, d3-time
# 3.1.0, and d3-scale 4.0.2 (ISC license); the attribution is in src/DemaConsulting.CanvasNet.VegaLite/third-party/ and
# the expected values in the tests are derived by hand, not copied from the d3 tests. See
# docs/verification/canvas-net-vega-lite/scales/ticks.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Scales Requirements
        sections:
          - title: Ticks Requirements
            requirements:
              - id: CanvasNetVegaLite-Scales-Ticks-Generation
                title: >-
                  The Ticks unit shall generate the tick values of a linear range and the signed tick
                  step for a start, a stop, and a count with the d3-array algorithm, giving the hand-derived
                  tick vector and step for the documented inputs, in either direction.
                justification: |
                  The tick values are what an axis shows; they must equal what the d3 algorithm gives.
                tests:
                  - Ticks_Ticks_LinearRangeMatchesHandDerivedExpectedVector
                  - Ticks_TickStep_UsesHandDerivedExpectedStep

              - id: CanvasNetVegaLite-Scales-Ticks-Nice
                title: >-
                  The Ticks unit shall expand a domain to nice boundaries with the d3-scale linear nice
                  algorithm for the requested count, keeping the direction of the domain and leaving a
                  domain unchanged when it cannot settle.
                justification: |
                  A nice domain makes the axis end on a tick, which is what a reader of a chart expects.
                tests:
                  - Ticks_Nice_ExpandsDomainToExpectedBoundaries

              - id: CanvasNetVegaLite-Scales-Ticks-AxisCounts
                title: >-
                  The Ticks unit shall provide the Vega-Lite default tick count of an axis of a given
                  length (the length divided by 40, rounded up), the default minimum tick step for an
                  integer format, and the Vega reduction of a count so that the tick step respects the
                  minimum step.
                justification: |
                  The default number of ticks decides how dense every axis is, and must be the number a
                  Vega-Lite user expects.
                tests:
                  - Ticks_DefaultAxisTickCountAndMinStep_FollowVegaLite
                  - Ticks_ResolveTickCount_ReducesCountToRespectTheMinimumStep

              - id: CanvasNetVegaLite-Scales-Ticks-TimeTicks
                title: >-
                  The Ticks unit shall generate the ticks of a time or UTC scale with the d3-scale time tick
                  algorithm - the interval table of seconds, minutes, hours, days, weeks, months, and years
                  (1, 5, 15, and 30 seconds and minutes; 1, 3, 6, and 12 hours; 1 and 2 days; 1 week; 1 and 3
                  months; 1 year), the interval whose duration is nearest the target by the d3 rule, the year
                  step by the tick step and the millisecond step below the table, the stop inclusive, a
                  reversed domain reversed, the boundaries of the zone (local midnights, local months), the
                  two-day ticks of a UTC scale counted from the epoch, and an explicit interval name or
                  interval and step as the tick count - returning the single instant of a degenerate domain
                  and failing with a VegaLiteRenderException instead of allocating when the ticks would
                  exceed the tick limit, observing the cancellation token while it lists them.
                justification: |
                  The ticks are what a time axis shows and what the grid and the labels hang on; they must be
                  the d3 ticks, in the calendar of the chart, and bounded.
                tests:
                  - Ticks_TimeTickInterval_FollowsD3Table
                  - Ticks_TimeTicks_TwoDays_UtcScaleCountsFromTheEpoch
                  - Ticks_TimeTicks_InclusiveStop_Utc
                  - Ticks_TimeTicks_Reversed
                  - Ticks_TimeTicks_Month_Boundaries_InAZone
                  - Ticks_TimeTicks_ExplicitInterval_Week_Step2
                  - Ticks_TimeTickRequest_TryFromInterval_ReadsNames
                  - Ticks_TimeTicks_DegenerateRequestsAndDomains
                  - Ticks_TimeTicks_MaxTicksExceeded_Throws
                  - Ticks_TimeTicks_PollCancellation
                  - Ticks_TimeTicks_InstantsOverload_MatchesTheModelOverload
                  - Ticks_Time_Culture_Invariant

              - id: CanvasNetVegaLite-Scales-Ticks-TimeNice
                title: >-
                  The Ticks unit shall expand a time or UTC domain to nice boundaries with the d3-scale time
                  nice algorithm (the floor and the ceiling of the interval of the tick count or of an
                  explicit interval, in the zone of the calendar, for a reversed domain too), leaving a
                  domain unchanged when it has no interval or an end would leave the supported years.
                justification: |
                  A nice time domain ends on a boundary a reader recognizes, such as a week or a month.
                tests:
                  - Ticks_TimeNice_WeekExample
                  - Ticks_TimeNice_ExplicitMonth
                  - Ticks_TimeNice_InAZone

              - id: CanvasNetVegaLite-Scales-Ticks-TimeCounts
                title: >-
                  The Ticks unit shall reduce a numeric tick count for a minimum step as Vega does and, for a
                  temporal scale, shall skip the tick step shrink loop that applies to numbers.
                justification: |
                  The minimum step of a time unit keeps a month axis from ticking between months; the shrink
                  loop of numbers does not apply to dates.
                tests:
                  - Ticks_ResolveTickCount_Temporal_SkipsTickStepLoop
                  - Ticks_ResolveTickCount_MinStep_CapsCount

              - id: CanvasNetVegaLite-Scales-Ticks-Limits
                title: >-
                  The Ticks unit shall fail with a VegaLiteRenderException instead of allocating when the
                  number of ticks would exceed the tick limit, and shall return no ticks, never a
                  non-finite tick value, for a span that overflows the double range or an infinite end.
                justification: |
                  A huge range with a huge count must not be able to exhaust memory, and an overflowing
                  range must not put a NaN position into the layout of a chart.
                tests:
                  - Ticks_Ticks_ResultOverTheLimitFailsClosed
                  - Ticks_Ticks_OverflowingSpanHasNoNonFiniteTicks

              - id: CanvasNetVegaLite-Scales-Ticks-LogTicks
                title: >-
                  The Ticks unit shall generate the ticks of a log scale with the algorithm of the d3 scaleLog
                  ticks method (the multiples of every power of the base inside the domain when the domain spans
                  fewer powers than the count, with exact decimals below one; the d3 ticks of the exponents as
                  powers when it spans more; the ordinary ticks when the multiples are fewer than half the count;
                  reflected ticks for a domain below zero; descending ticks for a descending domain; the other
                  bases), shall give no ticks for a domain that contains or crosses zero or a base that is not
                  usable, shall not lower the tick count of a log scale by the tick step, and shall dispatch by the
                  transform of a scale (log ticks for a log scale, the ordinary ticks of the domain for linear, pow,
                  sqrt, and symlog).
                justification: |
                  The ticks of a log axis are the multiples of the decades, not evenly spaced numbers; they must
                  equal what d3 and Vega give for the same domain.
                tests:
                  - Ticks_LogTicks_MatchHandDerivedD3Vectors
                  - Ticks_ResolveTickCount_LogarithmicScaleDoesNotLowerTheCountByTheStep
                  - Ticks_ModelTicks_DispatchesByTheTransform

              - id: CanvasNetVegaLite-Scales-Ticks-LogNice
                title: >-
                  The Ticks unit shall extend the domain of a log scale to the nearest powers of the base with the
                  d3 scaleLog nice method (floor of the first end and ceiling of the last, reflected below zero,
                  the direction of the domain kept) and shall leave a domain that the logarithm is not defined on
                  unchanged.
                justification: |
                  A nice log axis starts and ends on a power of the base.
                tests:
                  - Ticks_LogNice_ExtendsToPowersOfTheBase

              - id: CanvasNetVegaLite-Scales-Ticks-LogLabels
                title: >-
                  The Ticks unit shall provide the label filter of a log axis (Vega's tickLog: a tick is labeled
                  when its leading digit does not exceed max(1, base * count / ticks), judged on the magnitude so
                  that a negative domain is labeled by the same rule), and shall bound the work of the log ticks
                  by a hundred times the tick limit, poll the cancellation token, and fail with a
                  VegaLiteRenderException that names the limit when the ticks or the work exceed it.
                justification: |
                  Without the filter a log axis would label every multiple and be unreadable; the work of the
                  multiples must be bounded because the base comes from the specification.
                tests:
                  - Ticks_LogLabelTest_LabelsTheLeadingDigitsThatFit
                  - Ticks_LogTicks_LimitsAndCancellationAreEnforced
