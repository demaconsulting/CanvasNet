---
# Software Unit Requirements for ScaleResolver
#
# These requirements describe the design-level behavior of the ScaleResolver unit of the Scales subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Scales): the Vega-Lite inference of the scale of each
# channel of a single view from its encoding, the field types, the mark, the scale properties, the data, and
# the configuration - including the derived fields, domains, and sort orders of the implicit bin, aggregate, and
# stack that the EncodingPlan unit plans, and the colors, schemes, and ranges of the color and non-position channels,
# and the polar scales of theta and radius with the channel support table of the marks
# (ScaleResolver.cs, ScaleResolver.Plan.cs, ScaleResolver.Sort.cs, ScaleResolver.Color.cs, and
# ScaleResolver.Range.cs, and ScaleResolver.Time.cs for the temporal fields), and (Phase 10) the scales of the layers
# of a layered view - the shared scale with the combined domain, the independent scales of resolve, and the conflicts -
# in ScaleResolver.Layers.cs, and the nested scales of the xOffset and yOffset channels in ScaleResolver.Offsets.cs. See
# docs/verification/canvas-net-vega-lite/scales/scale-resolver.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Scales Requirements
        sections:
          - title: ScaleResolver Requirements
            requirements:
              - id: CanvasNetVegaLite-Scales-ScaleResolver-TypeInference
                title: >-
                  The ScaleResolver unit shall infer the scale kind of each channel from its type, as Vega-Lite's
                  defaultType does - linear for quantitative x and y, band for nominal and ordinal x and y of bar,
                  rect, rule, and tick marks, point for the other marks, a sequential scale for a quantitative color,
                  an ordinal scale for discrete color, shape, and stroke dash, and continuous (linear) or point scales
                  for size, opacity, stroke width, fill and stroke opacity, and angle - shall honor an explicit
                  scale type that both the channel and the field type accept (linear, sequential, quantile, quantize,
                  threshold, band, point, and ordinal) and otherwise use the default, and shall give a channel a scale
                  only for the marks that use it.
                justification: |
                  Which scale a channel gets decides how values are positioned and colored; it must follow the
                  Vega-Lite rules so the same specification gives the same chart.
                tests:
                  - ScaleResolver_Resolve_InfersQuantitativeNominalOrdinal
                  - ScaleResolverColor_Kind_FollowsTheVegaLiteTypeRules
                  - ScaleResolverColor_AcceptsScaleType_AppliesChannelAndFieldRules
                  - ScaleResolverColor_AcceptsScaleType_RejectsNullArguments
                  - ScaleResolverColor_Channels_AreDroppedForMarksThatDoNotUseThem

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Orient
                title: >-
                  The ScaleResolver unit shall infer the orientation of a bar, tick, rule, line, area, trail, or
                  arc mark from its encoding by the Vega-Lite rules (an area with y2 is vertical and with x2
                  horizontal, a binned secondary position reversing it; a temporal axis against a non-temporal
                  one makes the line, area, and tick follow the temporal axis; a line follows the measure; a trail
                  and an arc are vertical), honor an orientation given in the specification, and give none for
                  point-like marks.
                justification: |
                  The orientation decides which axis is the measure and which is the thickness of a mark, and
                  which way an area is filled.
                tests:
                  - ScaleResolver_InferOrient_FollowsVegaLite
                  - ScaleResolver_InferOrient_AreaRangeAndTemporalRulesFollowVegaLite
                  - ScaleResolver_InferOrient_LineFollowsTheMeasure

              - id: CanvasNetVegaLite-Scales-ScaleResolver-PolarScales
                title: >-
                  The ScaleResolver unit shall resolve the theta and radius channels of an arc or a text mark (and
                  theta2 and radius2 of an arc, which have no scale of their own) as scales with the default linear
                  type for a quantitative field, the band type for the arc and the point type for the text of a
                  discrete field, the explicit sqrt, pow, log, and symlog types, the zero rule of the
                  configuration, no nice and no padding, the range 0 to 2 pi for theta and 0 to half of the smaller
                  side of the view for radius (the explicit range, rangeMin, rangeMax, and reverse acting as for
                  x and y), and for a stacked channel the domain that spans the start and end of the stack.
                justification: |
                  The angle and the radius of a pie, a donut, and a radial chart are drawn through these scales,
                  and the proportions that they show are the data.
                tests:
                  - ScaleResolver_Resolve_ThetaHasTheFullCircleRange
                  - ScaleResolver_Resolve_RadiusRangeIsHalfTheSmallerSideWithRangeMin
                  - ScaleResolver_Resolve_PolarDefaultsAreLinearZeroNoNice
                  - ScaleResolver_Resolve_StackedThetaDomainSpansTheStack
                  - ScaleResolver_Resolve_PolarChannelsAreOnlyResolvedForArcAndText

              - id: CanvasNetVegaLite-Scales-ScaleResolver-ChannelGating
                title: >-
                  The ScaleResolver unit shall give a channel a scale only for the marks that draw it (theta and
                  radius for arc and text, theta2 and radius2 for arc, size for every mark but rect, area, arc,
                  and image, stroke dash for every mark but rect, area, trail, text, and arc, angle for point,
                  circle, square, and text, shape for point, and text for text) and, for a line, area, trail, or
                  rule that has a point overlay, also for the channels that the overlay points draw (shape, angle,
                  stroke dash, and size, the size of an area with the range of a point) and, for an area that has
                  a line overlay, for the channels of its line (stroke dash and size, with the range of the stroke
                  widths), so that the feature
                  catalog and the builders agree on which channels a mark ignores.
                justification: |
                  A channel that a mark does not draw must be ignored and reported, not resolved into a scale and a
                  legend that explain nothing; the points of a path overlay do draw it, and need its scale and
                  legend.
                tests:
                  - ScaleResolver_ChannelIsDrawn_FollowsTheSupportTable
                  - ScaleResolver_Resolve_ChannelsThatTheMarkDoesNotDrawHaveNoScale
                  - ScaleResolver_Resolve_PointOverlayBuildsTheScalesOfThePointChannels

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Domains
                title: >-
                  The ScaleResolver unit shall derive a continuous domain from the data extent (including zero by
                  default for bar-like measure axes), apply an explicit domain (all entries of a piecewise domain are
                  kept), zero, nice, padding, clamp, and reverse to the end entries as Vega does, and derive a discrete
                  domain from the distinct values in ascending order, in the order of an explicit domain, or in the
                  order of a sort array (where a value listed more than once counts at its first position), with values
                  missing from the sort array first, reading the values of a channel from the table that the encoding
                  stage produced.
                justification: |
                  The domain decides which values the chart shows and where they fall.
                tests:
                  - ScaleResolver_Resolve_AppliesZeroNiceDomainRangeAndPadding
                  - ScaleResolver_Resolve_DiscreteDomainsFollowTheSortProperty
                  - ScaleResolver_Resolve_ExplicitSortArrayUsesTheFirstIndexOfEachValue
                  - ScaleResolver_Resolve_PiecewiseDomainAndRangeFollowD3

              - id: CanvasNetVegaLite-Scales-ScaleResolver-SortByField
                title: >-
                  The ScaleResolver unit shall order the discrete domain of a channel by an aggregate of the
                  rows before the encoding's own aggregate when its sort is an object with an op (any
                  aggregate operation that gives a value to order by - count, valid, missing, distinct, sum,
                  product, mean, average, the variances and deviations, median, q1, q3, ci0, ci1, min, or max),
                  an optional field (the channel field by default), and an optional order (ascending by
                  default), when it is the shorthand "x" or "-y" of a channel, or when it is an object with
                  encoding and order - for another channel the aggregate of that channel (sum when it is the
                  stacked channel, else min) - computing the aggregate for each category, keeping categories
                  with equal values in the order of first appearance (a stable sort), giving a category
                  without a value the first position in both directions, bounding the number of categories and
                  charging the work to the evaluation-step budget, and leaving every other form of sort to
                  the existing rules and to the feature catalog.
                justification: |
                  Sorting a category by a value is common in charts built from aggregated data, and the order
                  must be deterministic, independent of the culture, and bounded in cost.
                tests:
                  - ScaleResolver_Resolve_SortByFieldUsesTheTransformedRows
                  - ScaleResolver_Resolve_SortByFieldIsStableForTies
                  - ScaleResolver_Resolve_SortByFieldPutsCategoriesWithoutValuesFirstInBothDirections
                  - ScaleResolver_Resolve_SortsByAnotherChannelsAggregate
                  - ScaleResolver_Resolve_SortByAPlainChannelUsesMinOrSumWhenStacked
                  - ScaleResolver_Resolve_SortsByAnOperationOfAField
                  - ScaleResolver_Resolve_SortOfAnAggregatedViewReadsTheRawRows
                  - ScaleResolver_Resolve_SortByAnAggregatedStackedChannelUsesTheRawSums
                  - ScaleResolver_Resolve_UnresolvableSortsAndPlainFormsKeepTheirOrder
                  - ScaleResolver_IsSupportedFieldSort_AcceptsOrderableOperations

              - id: CanvasNetVegaLite-Scales-ScaleResolver-SortArrayLimits
                title: >-
                  The ScaleResolver unit shall order a discrete domain by an explicit sort array in which a
                  value missing from the array comes first and a repeated value counts at its first position
                  (values of another kind not matching), shall fail with a VegaLiteRenderException located at the
                  array and naming the limit of VegaLiteLimits.MaxScaleDomainSize when the array has more items
                  than that limit, shall poll the cancellation token while it reads the array, and shall never
                  let an object or array item stand for the null category.
                justification: |
                  A specification of a few megabytes can hold millions of sort items; reading them must be
                  bounded and cancellable, and an item that is not a category must not silently position the
                  null category.
                tests:
                  - ScaleResolver_Resolve_ExplicitSortArrayUsesTheFirstIndexOfEachValue
                  - ScaleResolver_Resolve_SortArrayIsBoundedAndPollsCancellation
                  - ScaleResolver_Resolve_SortArrayNeverMapsNonScalarItemsToNull

              - id: CanvasNetVegaLite-Scales-ScaleResolver-PlanFields
                title: >-
                  The ScaleResolver unit shall read each channel from the field that the encoding plan names
                  (the derived field of a bin, an aggregate, or a stack end, or the field as written), resolve
                  a count of records without a field as a field definition, carry the second field of a range
                  or a stack, the default title, the kind of bin, and the stack offset into the resolved
                  scale, and leave a datum and a value without a field or a title.
                justification: |
                  The marks and axes draw what the scale was resolved from; the scale must therefore tell them
                  which field and which title belong to the channel.
                tests:
                  - ScaleResolver_Resolve_ScalesCarryThePlanFacts
                  - ScaleResolver_Resolve_InfersQuantitativeNominalOrdinal

              - id: CanvasNetVegaLite-Scales-ScaleResolver-BinnedDomains
                title: >-
                  The ScaleResolver unit shall give a position channel that the encoding bins the continuous
                  domain from the start of the first bin to the stop of the last (with no zero rule and no
                  nice unless the scale asks for it, and an explicit domain as given), give an already binned
                  field the extent of its start and end fields with no zero rule and no nice, and give a
                  nominal or ordinal binned channel the discrete domain of the bin texts (start - end, formatted
                  by the axis format or the number format, null for an invalid value) ordered by bin start
                  and reversed for a descending sort.
                justification: |
                  The axis of a histogram must cover the bins, not the data, and a discrete bin axis must read
                  in the order of the bins.
                tests:
                  - ScaleResolver_Resolve_BinnedScalesHaveNoNiceUnlessAsked
                  - ScaleResolver_Resolve_PreBinnedDomainIsTheUnionOfStartAndEnd
                  - ScaleResolver_Resolve_OrdinalBinsSortByStartAndDescendingReverses
                  - ScaleResolver_Resolve_OrdinalBinTextUsesTheAxisFormat

              - id: CanvasNetVegaLite-Scales-ScaleResolver-StackedDomains
                title: >-
                  The ScaleResolver unit shall give a stacked channel, and a position channel with a second
                  field, the continuous domain that spans the extent of both fields (the start and end of the
                  stack, or the two ends of the range), with the zero rule applied as for any bar measure, and
                  the domain 0 to 1 for a normalized stack.
                justification: |
                  The axis of a stacked chart must reach the total of the stack, and the axis of a range must
                  show both of its ends.
                tests:
                  - ScaleResolver_Resolve_RangeDomainIsTheUnionOfBothFields
                  - ScaleResolver_Resolve_ScalesCarryThePlanFacts
                  - ScaleResolver_Resolve_StackedDomainReachesTheTotalOfTheHighestStack
                  - ScaleResolver_Resolve_StackedDomainIncludesNegativeLayers
                  - ScaleResolver_Resolve_SignedStackDomainInBothOrientations
                  - ScaleResolver_Resolve_NormalizedStackHasTheUnitDomain

              - id: CanvasNetVegaLite-Scales-ScaleResolver-UnaggregatedDomain
                title: >-
                  The ScaleResolver unit shall, for a scale whose domain is "unaggregated" and whose
                  aggregate is mean, average, median, q1, q3, min, or max, derive the domain from the extent
                  of the field in the rows before the aggregate, and use the normal domain for any other
                  aggregate.
                justification: |
                  A mean with a range or a band is often shown against the spread of the data it summarizes.
                tests:
                  - ScaleResolver_Resolve_UnaggregatedDomainReadsTheRawRows

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Ranges
                title: >-
                  The ScaleResolver unit shall derive the range, padding, and step of each scale: the data
                  rectangle for positions, the mark and scale properties for inner and outer padding, the
                  step of a discrete position (reported as the discrete width or height of the view), and
                  the Vega-Lite default ranges for size and opacity.
                justification: |
                  The ranges connect the scales to the geometry of the view; the discrete size of a chart
                  comes from its step.
                tests:
                  - ScaleResolver_Resolve_PaddingsFollowMarkAndScaleProperties
                  - ScaleResolver_Resolve_SizeAndOpacityUseTheDefaultRanges
                  - ScaleResolver_Resolve_DiscreteSizesComeFromTheStep

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Colors
                title: >-
                  The ScaleResolver unit shall give discrete color, fill, and stroke fields an ordinal
                  scale whose colors come, in this order, from the scale's range, its scheme, or the named range
                  of config.range that Vega-Lite picks (category for a nominal field, ordinal for an ordinal one),
                  sampling a continuous scheme at i / (n + 1) for the n categories, using a categorical scheme
                  whole, and reversing the list on request.
                justification: |
                  Color is the most common reason for a second encoding; the colors a category gets must match
                  the ones Vega-Lite gives it.
                tests:
                  - ScaleResolver_Resolve_OrdinalColorsUseTheConfiguredRanges
                  - ScaleResolverColor_Ordinal_SchemesAreWholeListsOrSamples
                  - ScaleResolverColor_Precedence_RangeThenSchemeThenTheDefault

              - id: CanvasNetVegaLite-Scales-ScaleResolver-ColorScales
                title: >-
                  The ScaleResolver unit shall give a quantitative color, fill, or stroke field a sequential scale
                  over the extent of the data (no zero, no nice unless asked for), whose interpolator is the ramp
                  range (the heatmap range for a rect mark), a diverging scale with the diverging range when
                  domainMid inserts a middle value (or with the ramp range for an explicit domain of three entries),
                  shall apply zero, nice, domainMin, domainMax, clamp, and reverse as Vega's configureDomain does, and
                  shall fail with a located specification error for an explicit color domain of four or more
                  entries.
                justification: |
                  A continuous color scale is drawn with the same ramp and the same domain rules as in
                  Vega-Lite, so that equal data give equal colors.
                tests:
                  - ScaleResolverColor_Default_QuantitativeColorIsSequentialWithTheRampScheme
                  - ScaleResolverColor_Default_RectUsesTheHeatmapRangeAndDomainMidTheDivergingRange
                  - ScaleResolverColor_Domain_ThreeEntriesAreDivergingAndMoreAreRefused
                  - ScaleResolverColor_Domain_ZeroNiceMinMaxAndClamp
                  - ScaleResolverColor_UnsupportedProperties_AreIgnored

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Schemes
                title: >-
                  The ScaleResolver unit shall resolve the scheme of a color scale by name (ignoring case) or
                  object with a name, a count, and an extent, give the colors of an explicit range of colors
                  piecewise in the color space that interpolate names (a named scheme ignores it), reverse the
                  ramp on request, let the range win over the scheme and the scheme over the default, and fail
                  with a located specification error for an unknown scheme name, an unknown named range, an
                  empty list of colors, or a color that cannot be read (never replaced by the default range).
                justification: |
                  The scheme and the interpolation are what a color scale looks like; an unknown name must
                  stop the renderer as in Vega rather than give a plausible color.
                tests:
                  - ScaleResolverColor_Scheme_NamesObjectsAndExtents
                  - ScaleResolverColor_Reverse_FlipsTheRamp
                  - ScaleResolverColor_Range_ExplicitColorsInterpolatePiecewise
                  - ScaleResolverColor_Interpolate_ChoosesTheColorSpaceOfAList
                  - ScaleResolverColor_Scheme_UnknownNameIsASpecificationError
                  - ScaleResolverColor_InvalidColorList_IsASpecificationErrorNotTheDefault
                  - ScaleResolverColor_ConfiguredSchemeObject_MalformedCountOrExtentIsASpecificationError
              - id: CanvasNetVegaLite-Scales-ScaleResolver-ConfigRange
                title: >-
                  The ScaleResolver unit shall read the default ranges of color scales and the symbol list of shape
                  scales from config.range (a list of values or a scheme object with scheme, count, and extent), let a
                  range property name any entry of config.range, and fall back to Vega's own values when the
                  configuration removes one.
                justification: |
                  Authors restyle a whole chart through config.range; the lookup must follow Vega's parseScaleRange.
                tests:
                  - ScaleResolverColor_ConfigRange_NamedRangesAreListsOrSchemes
                  - ScaleResolverColor_Shape_RangeIsTheSymbolList

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Discretizing
                title: >-
                  The ScaleResolver unit shall resolve quantize scales over the data extent, quantile scales over all
                  the valid values in ascending order, and threshold scales over explicit thresholds (or the extent),
                  with five scheme colors by default (the explicit count otherwise, one more than the thresholds for
                  a threshold scale), the numbers of a discretizing size scale spread evenly (quantileCount and
                  quantizeCount of 4, one more than the thresholds), and the two-entry range for the other
                  numeric channels.
                justification: |
                  The number of classes decides what a classified chart and its legend show; the counts must
                  follow Vega and Vega-Lite.
                tests:
                  - ScaleResolverColor_Quantize_UsesFiveSchemeColorsOverEqualIntervals
                  - ScaleResolverColor_Quantile_ThresholdsComeFromTheSortedValues
                  - ScaleResolverColor_Threshold_ExplicitThresholdsOrTheExtent
                  - ScaleResolverColor_DiscretizingNumbers_SpreadTheRangeEvenly

              - id: CanvasNetVegaLite-Scales-ScaleResolver-NewChannels
                title: >-
                  The ScaleResolver unit shall resolve scales for the strokeWidth, fillOpacity, strokeOpacity, angle,
                  shape, and strokeDash channels - stroke widths from minStrokeWidth to maxStrokeWidth, opacities from
                  minOpacity to maxOpacity, angles from 0 to 360, the symbols of config.range.symbol, and five
                  dash patterns, or the explicit range of the scale - and shall let rangeMin and rangeMax replace the
                  first and the second entry of a default two-entry range.
                justification: |
                  These channels are drawn from their scales; the ranges are Vega-Lite's defaults.
                tests:
                  - ScaleResolverColor_NewChannels_UseTheirDefaultRanges
                  - ScaleResolverColor_Shape_RangeIsTheSymbolList
                  - ScaleResolverColor_StrokeDash_RangeIsFivePatterns
                  - ScaleResolverColor_RangeMinAndMax_ReplaceTheEntriesOfADefaultRange

              - id: CanvasNetVegaLite-Scales-ScaleResolver-ColorLimits
                title: >-
                  The ScaleResolver unit shall refuse, with a located render exception that names
                  VegaLiteLimits.MaxScaleDomainSize, a range, a domain, a scheme count, or a generated range of
                  more entries than the limit before it builds anything, shall count the values of a quantile
                  scale against the cell limit and charge reading and sorting them to the evaluation-step
                  budget, shall poll the cancellation token while it reads and sorts them, and shall give the
                  same scales for repeated and concurrent runs.
                justification: |
                  A specification can ask for an arbitrarily long range or domain; the memory and time must be
                  bounded, the caller must be able to stop the work, and equal inputs must give equal charts.
                tests:
                  - ScaleResolverColor_Limits_AreEnforcedBeforeAnythingIsBuilt
                  - ScaleResolverColor_ConfiguredArrays_AreBoundedLikeInlineOnes
                  - ScaleResolverColor_QuantileDomain_IsSortedChargedAndCancellable
                  - ScaleResolverColor_Resolve_IsDeterministicAcrossRepeatedAndConcurrentRuns

              - id: CanvasNetVegaLite-Scales-ScaleResolver-Validation
                title: >-
                  The ScaleResolver unit shall fail with a VegaLiteSpecException carrying the pointer,
                  line, and column of the property when a scale property has an invalid value, such as a
                  linear domain with fewer than two numbers, and shall observe the data limits and the
                  cancellation token, including the work of sorting a domain by an aggregate.
                justification: |
                  An invalid scale property must stop the renderer with the location of the mistake rather
                  than produce a plausible chart.
                tests:
                  - ScaleResolver_Resolve_InvalidInputsFailWithLocation
                  - ScaleResolver_Resolve_SortIsChargedBoundedAndCancellable

              - id: CanvasNetVegaLite-Scales-ScaleResolver-TransformedScales
                title: >-
                  The ScaleResolver unit shall resolve the scale types log, pow, sqrt, and symlog of a quantitative
                  field on a position, size, opacity, stroke width, angle, or color channel to a continuous scale with
                  the matching transform and its base (default 10), exponent (default 1; sqrt is the power 0.5),
                  or constant (default 1); shall apply Vega-Lite's defaults to them (no zero for a log scale, nice to
                  the powers of the base for a log scale, the padding in the transformed domain, domainMin,
                  domainMax, clamp, and an explicit domain as for a linear scale, one decade when a log scale has no
                  valid value); shall refuse a log domain that includes zero or crosses it with a located error
                  (a VegaLiteSpecException at the domain for an explicit domain, a VegaLiteRenderException at the
                  channel for the domain of the data); and shall use the default scale type instead of one that the
                  channel or the field type cannot use.
                justification: |
                  Log-family scales are part of the Vega-Lite scale set; a domain that the logarithm cannot map must
                  be reported where Vega would draw nothing.
                tests:
                  - ScaleResolver_Resolve_LogPowSqrtSymlogCarryTheirTransform
                  - ScaleResolver_Resolve_LogScaleDefaultsFollowVegaLite
                  - ScaleResolver_Resolve_LogDomainThatIncludesZeroFailsWithALocatedError
                  - ScaleResolver_Resolve_TransformTypesNeedAChannelAndFieldThatAcceptThem
                  - ScaleResolverColor_AcceptsScaleType_AppliesChannelAndFieldRules

              - id: CanvasNetVegaLite-Scales-ScaleResolver-BinOrdinal
                title: >-
                  The ScaleResolver unit shall resolve the bin-ordinal scale of a binned quantitative color, fill,
                  or stroke (the default of Vega-Lite, and the one an explicit bin-ordinal type asks for): the
                  domain is the edges of the bins of the encoding (one more than the bins), the range has one
                  color per bin from the scheme (ramp by default), the colors of the range or the reversal of the
                  specification, and a field without a finite value has no edge and no color; shall resolve the
                  other binned channels as Vega-Lite does (a continuous scale over the start of the first bin to
                  the stop of the last for a size, opacity, stroke width, or angle, or an explicit continuous
                  type of a color, and the text of the bins as the categories of an ordinal scale for a nominal
                  or ordinal field); shall use the default scale type instead of a bin-ordinal type that the
                  channel, the field type, or a missing bin cannot use; and shall bound the bins by the
                  scale-domain limit and the work by the evaluation-step budget with a located error.
                justification: |
                  A binned color is a classified color; the classes must be the bins that Vega-Lite makes, and a
                  scale type that cannot be drawn must fall back to the default rather than draw a wrong chart.
                tests:
                  - ScaleResolverBin_BinnedColor_DefaultsToBinOrdinalOverTheBinEdges
                  - ScaleResolverBin_Kind_FollowsTheVegaLiteTypeRulesForBinnedFields
                  - ScaleResolverBin_ContinuousScales_SpanTheBins
                  - ScaleResolverBin_BinOrdinal_UsesTheRangeAndTheReversalOfTheSpecification
                  - ScaleResolverBin_DiscreteBinnedColor_ReadsTheTextOfTheBins
                  - ScaleResolverBin_FieldWithoutNumbers_HasAnEmptyBinOrdinalScale
                  - ScaleResolverBin_Limits_AreEnforcedOnTheBinsOfAChannel
                  - ScaleResolverBin_Work_IsChargedToTheEvaluationBudget
                  - ScaleResolverColor_AcceptsScaleType_BinOrdinalNeedsABinnedQuantitativeColor

              - id: CanvasNetVegaLite-Scales-ScaleResolver-ConditionalFields
                title: >-
                  The ScaleResolver unit shall resolve the scale of a conditional channel from the field
                  definition that the plan names (its own, or the condition that holds a field), with the
                  type, scale options, and domain of that definition, and shall resolve no scale for a
                  channel whose conditions hold only values.
                justification: |
                  Vega-Lite builds the scale of a conditional channel from its field definition; conditions
                  that hold values must not create a scale that nothing reads.
                tests:
                  - ScaleResolverColor_Resolve_FieldInAConditionGivesTheChannelItsScale
                  - LegendPlan_Create_ValueConditionsCreateNoScaleAndNoLegend

              - id: CanvasNetVegaLite-Scales-ScaleResolver-TemporalTypes
                title: >-
                  The ScaleResolver unit shall give a temporal field a scale and choose its kind as Vega-Lite
                  does - a time scale (a UTC scale when the time unit is utc) for the position, size, opacity,
                  stroke width, and angle channels, a continuous color scale (drawn as a sequential scale
                  over milliseconds) for the color channels, and an ordinal scale for shape and stroke
                  dash - accept the explicit scale types time and utc for a temporal field (and only those),
                  replace any other type, an explicit time or utc type of a quantitative, nominal, or ordinal
                  field, and a temporal field on the shape and stroke dash channels by the default
                  with a report, and keep the other scale rules (range, reverse, clamp, round, and descending
                  sort) as for a linear scale, a vertical time axis running upward.
                justification: |
                  Which scale a temporal channel gets decides how dates are positioned; it must follow the
                  Vega-Lite rules so the same specification gives the same chart.
                tests:
                  - ScaleResolver_Temporal_XDefaultsToATimeScaleWithTheDataExtent
                  - ScaleResolver_UtcTimeUnit_GivesAUtcScale
                  - ScaleResolver_ExplicitTypeTimeAndUtc
                  - ScaleResolver_AcceptsScaleType_PinsTheTemporalTable
                  - ScaleResolver_TemporalSize_And_Opacity_UseTheTimeScale
                  - ScaleResolver_TimeScale_RangeReverseClampRound
                  - ScaleResolver_Resolve_InfersQuantitativeNominalOrdinal

              - id: CanvasNetVegaLite-Scales-ScaleResolver-TemporalDomains
                title: >-
                  The ScaleResolver unit shall derive the domain of a time scale from the extent of the dates
                  of its field (a bar or rect of a time unit with a band end also from the end field, a point
                  from the starts only), with no zero and no nice by default and no padding for the bars of a
                  time unit, an explicit domain whose entries are timestamps, date texts (read by the
                  JavaScript date rules), datetime objects, or, for a single local unit, the part of the
                  unit, domainMin, domainMax, and domainMid as timestamps or datetime objects, the default
                  domain 0 to 1 for a field without a valid date, the single instant of a datum, the entries
                  of an explicit domain and of a sort array bounded by the scale domain limit before any
                  of them is converted, and the calendar of the scale for the entries (UTC for a UTC scale).
                justification: |
                  The domain decides which dates the chart shows; each of these rules is a Vega-Lite rule, and
                  the limits keep a hostile domain from exhausting memory.
                tests:
                  - ScaleResolver_Temporal_EmptyDataGivesADefaultDomain
                  - ScaleResolver_TimeUnitBarDomainIncludesTheEnd
                  - ScaleResolver_TimeUnitPointDomainIsTheStartsOnly
                  - ScaleResolver_BarPaddingNotAppliedForTimeUnit
                  - ScaleResolver_DomainStringsAndDatetimeObjects
                  - ScaleResolver_DomainOfASingleUnit_NamesParts
                  - ScaleResolver_DomainMinMaxDatetime
                  - ScaleResolver_Datum_Temporal
                  - ScaleResolver_ConfigAndSpecArraysRespectMaxScaleDomainSize
                  - ScaleResolver_TimeUnit_InAZone_FollowsTheLocalDay
                  - ScaleResolver_Deterministic_UnderCultures

              - id: CanvasNetVegaLite-Scales-ScaleResolver-TimeNice
                title: >-
                  The ScaleResolver unit shall apply the nice property of a time scale as true, as a count,
                  as an interval name, or as an interval and a step to the domain with the time nice
                  algorithm in the zone of the scale (a UTC scale in UTC), leaving a time scale not nice
                  when nice is not given.
                justification: |
                  A nice time domain ends on a boundary a reader recognizes, and Vega-Lite does not make a
                  time domain nice by default.
                tests:
                  - ScaleResolver_NiceTrueAndInterval
                  - ScaleResolver_NiceInAZone_UsesLocalBoundaries

              - id: CanvasNetVegaLite-Scales-ScaleResolver-DiscreteTimeUnits
                title: >-
                  The ScaleResolver unit shall give a nominal or ordinal field with a time unit a band, point,
                  or ordinal scale over the dates of the derived start field, in the order of the dates (or
                  descending when the sort says so), with an explicit domain and a sort array converted by the
                  rule of the unit.
                justification: |
                  A bar chart over months as categories is a common chart; its categories must be the unit
                  starts in date order.
                tests:
                  - ScaleResolver_OrdinalTimeUnit_UsesABandScaleSortedByDate
                  - ScaleResolver_OrdinalTimeUnit_SortDescending
                  - ScaleResolver_SortArrayOfDatetimeObjects

              - id: CanvasNetVegaLite-Scales-ScaleResolver-TemporalColor
                title: >-
                  The ScaleResolver unit shall resolve a temporal field on a color channel as a continuous
                  scale over milliseconds with the range, scheme, interpolation, and domain rules of a
                  sequential scale, ignoring the zero property (as for a time scale, zero being meaningless
                  for dates), replacing the discretizing types quantile, quantize, and threshold,
                  which a temporal field does not accept, by the sequential scale, keeping the meaning of an
                  explicit utc type (the scale uses the UTC calendar and is flagged as a UTC scale, whatever
                  the time zone of the chart is), and shall let the legend and the marks read the calendar and
                  the time unit of the scale.
                justification: |
                  A chart that colors by date needs the scale to be a continuous color scale and the legend to
                  label dates; Vega-Lite does not discretize a temporal field, and a scale that was asked to be
                  UTC must not follow the zone of the chart.
                tests:
                  - ScaleResolver_TemporalColor_IsSequentialOverMilliseconds
                  - ScaleResolver_TemporalColor_ExplicitUtcType_UsesTheUtcCalendar
                  - ScaleResolver_TemporalColor_ZeroIsIgnored
                  - ScaleResolver_TemporalColorQuantile_Threshold_Quantize_FallBackToSequential

              - id: CanvasNetVegaLite-Scales-ScaleResolver-SharedScales
                title: >-
                  The ScaleResolver unit shall resolve the scales of the layers of a layered view, and of the
                  views of a composition (the children of a concatenation, the cells of a facet) that share a
                  channel, so that a channel
                  that two or more layers carry, and that resolve leaves shared (the default), has one scale
                  whose continuous domain is the union of the domains of the layers (each after its own zero rule;
                  explicit domains winning over implicit ones and, when they differ, all merged as Vega-Lite does
                  (the extent of all their values; equal explicit domains counted once)), whose discrete domain is the
                  union of the categories in layer order (sorted when every layer sorts the same way, the explicit
                  domains winning and merged in order of first appearance, and failing closed above the
                  scale-domain limit), whose kind is the band scale
                  rather than the point scale when the layers differ, whose step sizes the combined categories,
                  whose title joins the distinct titles of the layers (a, b), and whose discretizing kinds are those
                  of the first layer; shall give each layer that scale bound to the layer's own field, so that the
                  marks of all layers are placed by the same mapping; shall leave a channel that one layer carries,
                  and a layer without an encoding, as the layer's own result; and shall return exactly the result
                  for the single view for a view with one layer.
                justification: |
                  Layers drawn on one axis must line up: a line over bars is only meaningful when both are placed
                  by the same scale, and a single view must not change.
                tests:
                  - ScaleResolver_ResolveLayers_SingleLayerIsTheSingleViewResult
                  - ScaleResolver_ResolveLayers_SharedContinuousDomainIsTheUnion
                  - ScaleResolver_ResolveLayers_UnionIncludesTheZeroOfALayer
                  - ScaleResolver_ResolveLayers_ChannelOfOneLayerIsTheViewsScale
                  - ScaleResolver_ResolveLayers_DiscreteDomainIsTheSortedUnion
                  - ScaleResolver_ResolveLayers_DiscreteOrderFollowsTheLayersSorts
                  - ScaleResolver_ResolveLayers_ExplicitDiscreteDomainWins
                  - ScaleResolver_ResolveLayers_ExplicitContinuousDomainWins
                  - ScaleResolver_ResolveLayers_ExplicitContinuousDomainsAreMerged
                  - ScaleResolver_ResolveLayers_ExplicitDiscreteDomainsAreMerged
                  - ScaleResolver_ResolveLayers_ExplicitDomainsOfConcatChildrenAreCombined
                  - ScaleResolver_ResolveLayers_BandBeatsPointAndSizesTheView
                  - ScaleResolver_ResolveLayers_StepAppliesToTheCombinedCategories
                  - ScaleResolver_ResolveLayers_DiscretizingScaleIsTheFirstLayersOwn
                  - ScaleResolver_ResolveLayers_CombinedCategoriesAreLimited
                  - ScaleResolver_ResolveLayers_LayerWithoutEncodingHasNoScales
                  - ScaleResolver_ResolveLayers_ChecksItsArguments

              - id: CanvasNetVegaLite-Scales-ScaleResolver-IndependentScales
                title: >-
                  The ScaleResolver unit shall keep the scale of a channel apart for each layer (and give the
                  merged result no scale for that channel) when the resolve of a layered view makes the scale
                  independent, shall let the resolve of each layered view in a nest decide which layers below
                  it share, and shall report the groups of layers that share a scale so that the guides can be
                  built for each group.
                justification: |
                  Two layers with different measures on one chart need separate scales, and a nested layered view
                  may share what its parent keeps apart.
                tests:
                  - ScaleResolver_ResolveLayers_IndependentScaleStaysPerLayer
                  - ScaleResolver_ResolveLayers_NestedResolveDecidesWhichLayersShare

              - id: CanvasNetVegaLite-Scales-ScaleResolver-ScaleConflict
                title: >-
                  The ScaleResolver unit shall, when the scales of a shared channel cannot be merged (a continuous
                  with a discrete scale, a linear with a logarithmic, power, or time scale, or different
                  discretizing kinds), keep the scale of each incompatible view (layer, child, or cell) as its
                  own, and warn (vl-layer-scale-conflict, with a message that names the view) at the channel of
                  the view that was left out.
                justification: |
                  A merged scale that silently mixed incompatible kinds would place marks wrongly; the author
                  must be told that the views could not share the scale.
                tests:
                  - ScaleResolver_ResolveLayers_IncompatibleScalesKeepTheirOwnAndAreReported
                  - ScaleResolver_ResolveLayers_ConflictMessageNamesTheView

              - id: CanvasNetVegaLite-Scales-ScaleResolver-CompositionScales
                title: >-
                  The ScaleResolver unit shall resolve the scales across the unit views of a composition by the
                  same grouping as for layers, with the defaults of the kind of the view: the children of a
                  concatenation keep the x, y, xOffset, yOffset, theta, and radius scales independent (no scale of
                  the whole view, each child its own domain) and share the others (one scale over the union of
                  the domains, bound to each child's field) unless resolve says otherwise; the cells of a facet
                  share every scale except theta, one scale over the union of the cells' domains, unless resolve
                  makes it independent and then each cell has the domain of its own rows; and shall give the size
                  hints of one chart (LayeredScales.HintsFor): the natural extent - the step times the bandspace of the
                  categories - of the discrete x and y scale that all the layers of the chart use, so that a
                  shared step scale of a facet sizes every cell for the union of the categories of all the cells,
                  an independent one sizes each cell for its own, and a chart whose layers use several scales
                  of the channel, no scale of it, or a scale that no step sizes has none.
                justification: |
                  Concatenated charts keep their own axes but share a color legend, the cells of a facet are
                  compared on common scales, and each chart of a composition must be sized by its own scale.
                tests:
                  - ScaleResolver_ResolveLayers_ConcatChildrenKeepIndependentPositionScales
                  - ScaleResolver_ResolveLayers_ConcatChildrenShareColorAndUnionItsDomain
                  - ScaleResolver_ResolveLayers_ConcatChildrenResolveSharedXMergesDomains
                  - ScaleResolver_ResolveLayers_FacetCellsShareAllScalesByDefault
                  - ScaleResolver_ResolveLayers_FacetIndependentScaleGivesEachCellItsOwn
                  - ScaleResolver_ResolveLayers_FacetThetaIsIndependentByDefault
                  - ScaleResolver_ResolveLayers_HintsForGivesTheStepExtentOfTheChartsOwnGroup
                  - ScaleResolver_ResolveLayers_SharedStepAppliesToTheUnionOfAllCellCategories
                  - ScaleResolver_ResolveLayers_HintsForChecksItsArguments

              - id: CanvasNetVegaLite-Scales-ScaleResolver-OffsetDecision
                title: >-
                  The ScaleResolver unit shall give an xOffset or yOffset channel a scale only when its position
                  channel (x or y) is a nominal or ordinal field without a time unit (the discrete parent) or a
                  temporal field with a supported time unit (the time unit parent: the unit parses, is not binned
                  or maxbins, has a smallest part that is not the day of the week, and the mark is not a rect) and,
                  for a bar or an area, only when the offset field is not continuous; shall give no scale to an
                  offset with neither parent (a missing, quantitative, or temporal position without a time unit, a
                  day or weekday unit, a binned or maxbins unit, a rect mark, or a nominal or ordinal position with
                  a time unit) or to a continuous offset of a bar or an area, so that the offset is ignored; and
                  shall give a quantitative or temporal offset of the other marks a linear or time scale without
                  zero, nice, or pixel padding.
                justification: |
                  Vega-Lite nests an offset only in a band of a discrete position or inside the unit of a time scale;
                  the rest cannot be drawn meaningfully, and the decision must be one rule that the marks, the plan,
                  and the catalog share.
                tests:
                  - ScaleResolver_DecideOffset_FollowsTheRules
                  - ScaleResolver_Resolve_OffsetWithoutADiscreteParentHasNoScale
                  - ScaleResolver_Resolve_QuantitativeOffsetIsLinearWithoutZeroOrNice

              - id: CanvasNetVegaLite-Scales-ScaleResolver-OffsetScales
                title: >-
                  The ScaleResolver unit shall resolve the position scale that holds a nested offset as a band scale
                  (also for the marks that have a point scale otherwise and for an explicit point scale type) and
                  the nominal or ordinal offset as a band scale for the bar, rect, image, rule, and tick marks and
                  a point scale for the other marks, with the whole field as its domain in the sort of the
                  channel, the range of the scale spanning the bandwidth of the band of the position (honoring
                  reverse and round of the offset scale), for x and for y alike; and shall keep the position scale
                  of a time unit parent a time scale, giving the offset scale the range supplied by the marks (in
                  pixels, without the y flip) instead of the default range, with the range, rangeMin, rangeMax, and
                  reverse of the scale still applying.
                justification: |
                  Grouped bars and offset points are the standard way to compare subgroups side by side; the
                  nesting of the scales is what puts every subgroup in the band of its group or inside its unit.
                tests:
                  - ScaleResolver_Resolve_NominalXOffsetOfABarIsBandWithoutPaddingAndXHasNestedPaddings
                  - ScaleResolver_Resolve_PointMarkHasBandPositionAndPointOffset
                  - ScaleResolver_Resolve_ExplicitPointOnAPositionWithOffsetUsesBand
                  - ScaleResolver_Resolve_YOffsetNestsInTheBandOfY
                  - ScaleResolver_Resolve_OffsetDomainIsTheWholeFieldAndFollowsItsSort
                  - ScaleResolver_Resolve_OffsetScaleTakesRangeReverseAndRound
                  - ScaleResolver_Resolve_OffsetWithATimeUnitParentHasANominalOffsetScale
                  - ScaleResolver_CreateModel_NestedRangeReplacesTheDefaultRange

              - id: CanvasNetVegaLite-Scales-ScaleResolver-OffsetPaddings
                title: >-
                  The ScaleResolver unit shall pad the band of a position that holds a nested offset with the inner
                  and outer paddings of config.scale.bandWithNestedOffsetPaddingInner and
                  bandWithNestedOffsetPaddingOuter (0.2 each by default) unless the scale gives a padding or an
                  explicit paddingInner or paddingOuter, and shall pad a band offset scale with
                  config.scale.offsetBandPaddingInner and offsetBandPaddingOuter (0 by default) and a point offset
                  scale with an outer padding of one half, which together decide the size of the groups.
                justification: |
                  The gap between the groups and the gap inside them are what the reader sees in a grouped chart,
                  and Vega-Lite has dedicated configuration for them.
                tests:
                  - ScaleResolver_Resolve_PaddingsFollowTheScaleAndTheConfiguration
                  - ScaleResolver_Resolve_OffsetPaddingChangesThePositionStep

              - id: CanvasNetVegaLite-Scales-ScaleResolver-OffsetSteps
                title: >-
                  The ScaleResolver unit shall size a position that holds a discrete offset, for a width or height
                  given as a step (the default step included), so that the step applies to the offset scale unless
                  the step says for position: the step of the position is the step times the band space of the
                  offset categories divided by the share of the band that the padding leaves, so that the default
                  three categories of two groups give a step of 50 pixels, a width of 160 pixels, and bars of 20
                  pixels; and shall let the offset scale fill the bandwidth of the position for a fixed size.
                justification: |
                  A step is the space of one mark; for grouped bars the mark is the bar of a group, so the step
                  must apply to the groups in each band to keep the bars of a legible size.
                tests:
                  - ScaleResolver_Resolve_DefaultStepIsScaledByTheOffsetCount
                  - ScaleResolver_Resolve_FixedWidthLetsTheOffsetFillTheBandwidth
                  - ScaleResolver_Resolve_StepForPositionKeepsTheStep
                  - ScaleResolver_Resolve_StepForOffsetAppliesToTheHeightOfAHorizontalChart

              - id: CanvasNetVegaLite-Scales-ScaleResolver-OffsetLayers
                title: >-
                  The ScaleResolver unit shall merge the domains of a shared offset scale of the layers of a view
                  once, in the one pass that resolves the layered scales, and keep the own offset domain of each
                  layer whose offset scale is independent.
                justification: |
                  Layers of grouped bars must put the same group in the same place, and layers whose resolve keeps
                  the offset independent must not be forced onto the groups of the others.
                tests:
                  - ScaleResolver_ResolveLayers_SharedOffsetMergesTheDomainAndIndependentKeepsItsOwn
