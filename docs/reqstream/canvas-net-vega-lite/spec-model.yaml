---
# Software Subsystem Requirements for SpecModel
#
# These requirements decompose the CanvasNetVegaLite system's responsibility for the specification text into the
# SpecModel subsystem (internal namespace DemaConsulting.CanvasNet.VegaLite.SpecModel): the bounded JSON parser
# that builds an immutable tree with positions (SpecParser), the catalog that reports every recognized
# construct outside the supported subset (FeatureCatalog), and the configuration resolver (ConfigResolver).
# Phase 5 adds the compilation of expressions and the validation of parameters and transforms (SpecParser); Phase 6
# adds the validation of the aggregating transforms and of the aggregate, bin, stack, and sort of an encoding;
# Phase 8 adds the validation of the time units, datetime objects, and tick intervals and the translation of
# the time predicates, and retires the reports of the constructs that the time phase draws; Phase 9 adds the
# validation of the properties of the line, area, trail, text, and arc marks and of the impute of an encoding,
# and retires the reports of those marks and their channels.
# SpecModel knows everything about the specification text and nothing about data or pixels. Each requirement
# here links down to the unit requirements that implement it. See
# docs/verification/canvas-net-vega-lite/spec-model.md for the test-evidence mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: SpecModel Requirements
        requirements:
          - id: CanvasNetVegaLite-SpecModel-Parse
            title: >-
              The SpecModel subsystem shall parse specification text into an immutable tree of objects,
              arrays, strings, numbers, booleans, and nulls in a single bounded pass, tolerating a
              leading byte-order mark and a very large inline data array, and shall list the views of
              a specification parents first.
            justification: |
              Every later stage reads the tree rather than the text, so the tree must be complete,
              immutable, and cheap to build even for large inline data.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-JsonTree
            tests:
              - SpecParser_Parse_ValidInlineSpecRecordsJsonPointerAndLineColumn
              - SpecParser_Parse_AllValueKindsAndBomAreHandled
              - SpecParser_Parse_LargeInlineDataIsReadInOnePass

          - id: CanvasNetVegaLite-SpecModel-Locations
            title: >-
              The SpecModel subsystem shall record for every node its RFC 6901 JSON pointer and the
              one-based line and column of its value and key, counted in UTF-16 code units, and shall
              report the location of the first syntax problem it finds.
            justification: |
              Errors, warnings, and unsupported-feature reports are only useful when they point at the
              exact place in the author's text.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-LocationTracking
            tests:
              - SpecParser_Parse_MalformedJsonReportsFirstLocation
              - SpecParser_Parse_LocationsCountUtf16CodeUnits
              - FeatureCatalog_Visit_MarkReportCarriesLineAndColumn

          - id: CanvasNetVegaLite-SpecModel-StructuralValidation
            title: >-
              The SpecModel subsystem shall validate the shape of the Vega-Lite properties the renderer
              depends on, failing with a located specification exception at the first wrong value in
              document order, shall keep the last of a duplicate key and warn once, and shall warn once
              about properties Vega-Lite does not define without rejecting them.
            justification: |
              Failing on a wrong type protects the renderer from misreading the specification, while
              tolerating unknown properties keeps forward-compatible specifications usable.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-StructuralValidation
              - CanvasNetVegaLite-SpecModel-SpecParser-DataFormats
              - CanvasNetVegaLite-SpecModel-SpecParser-DuplicateAndUnknownKeys
            tests:
              - SpecParser_Parse_WrongTypeReportsPointer
              - SpecParser_Parse_Phase4DataFormsAreAccepted
              - SpecParser_Parse_DuplicateKeyLastWinsAndWarns
              - SpecParser_Parse_UnknownPropertiesWarnOnceAndValidKeysNeverWarn

          - id: CanvasNetVegaLite-SpecModel-Limits
            title: >-
              The SpecModel subsystem shall fail closed when the source text is longer than the
              source-length limit (with an InvalidDataException), when nesting exceeds the JSON-depth
              limit or a string exceeds the string-length limit (with a located specification
              exception), and shall accept a document exactly at a limit, without recursion on the call
              stack.
            justification: |
              Specifications are untrusted input; every dimension of the text must be bounded so that no
              input can overflow the stack or exhaust memory.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-Limits
            tests:
              - SpecParser_Parse_DepthAndSourceLimitsFailClosed
              - CanvasNetVegaLite_SystemIntegration_Limits_OversizedSourceAndDepthFailClosed

          - id: CanvasNetVegaLite-SpecModel-Metadata
            title: >-
              The SpecModel subsystem shall describe a specification from its text alone: its schema
              URL and major version, plain-text title, marks with their locations, data references, and
              parameter names.
            justification: |
              Tools list what a chart needs before they render it, without the cost or risk of rendering.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-Metadata
            tests:
              - SpecMetadata_Read_DescribesSchemaTitleMarksDataAndParameters
              - SpecParser_ParseSchemaMajorVersion_ParsesTheMajorVersion

          - id: CanvasNetVegaLite-SpecModel-FeatureReporting
            title: >-
              The SpecModel subsystem shall report every recognized construct outside the supported
              subset - data sources, marks, channels, types, encoding properties, scale types and
              properties, legends, guide properties, expressions, transforms, parameters, projections,
              compositions, and autosize modes - with a stable lower-case vl-* identifier, a message, and
              the location of the construct, sorted by position, once per feature and location, and
              shall report nothing for a construct the renderer supports.
            justification: |
              Unsupported features must be visible and distinguishable from mistakes, and a gap that the
              renderer does not report would be silently skipped.
            children:
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-StableIds
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-SupportedSilent
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-RemoteUrl
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-DataSources
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-MarksAndChannels
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-PathMarks
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-TextMark
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-ArcMark
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-ScalesAndGuides
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-TransformsAndCompositions
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-ExpressionConstructs
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-TransformParts
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-SortDiagnostics
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-TimeIds
            tests:
              - FeatureCatalog_Visit_RecognizedUnsupportedPropertiesReturnsStableIds
              - FeatureCatalog_Visit_SupportedSpecificationHasNoReports
              - FeatureCatalog_Visit_LocalUrlsAndPhase4FormatsAreSupported
              - FeatureCatalog_Visit_ReportsAreInDocumentOrder
              - FeatureCatalog_Visit_UnsupportedExpressionConstructsAreReportedAtTheExpression
              - FeatureCatalog_Visit_Phase6FeaturesAreNotReportedAndRemainingPartsAre
              - FeatureCatalog_Visit_SortOnAContinuousScaleIsIgnoredWithAWarning
              - FeatureCatalog_Visit_BinnedTimeUnitIsReportedAtTheValue
              - FeatureCatalog_Visit_CustomDateFormatIsSupportedAndReportsNothing
              - FeatureCatalog_Report_LineAreaTrailAreSupportedAndGeoshapeImageAreNot
              - FeatureCatalog_Report_ArcIsSupportedAndPolarChannelsAreGated
              - CanvasNetVegaLite_SystemIntegration_Unsupported_MarkAndTransformCarryPointerLineColumn

          - id: CanvasNetVegaLite-SpecModel-MarkValidation
            title: >-
              The SpecModel subsystem shall validate the properties of the line, area, trail, text, and arc
              marks (the interpolation, tension, overlays, invalid mode, text, font, and polar properties) and
              the impute of an encoding, failing with a located specification exception at the first wrong
              value and warning about an unknown key of an overlay object.
            justification: |
              The properties of the path, text, and arc marks decide the geometry and the memory of the marks;
              they must be checked, with the location of the mistake, before the builders rely on them.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-PathMarkRules
              - CanvasNetVegaLite-SpecModel-SpecParser-TextRules
              - CanvasNetVegaLite-SpecModel-SpecParser-ImputeRules
            tests:
              - SpecParser_Parse_RejectsABadInterpolateOrInvalidOrPointValue
              - SpecParser_Parse_ValidatesTextMarkProperties
              - SpecParser_Parse_RejectsABadImputeObjectWithItsLocation

          - id: CanvasNetVegaLite-SpecModel-TimeValidation
            title: >-
              The SpecModel subsystem shall validate, when a specification is parsed, the time units (a name
              or an object, wherever it is written), the datetime objects (in a domain, a value list, a
              predicate, a sort array, and a datum), the interval of a tick count or of nice, the length of a
              time format of a guide or of a data parse entry, the timeUnit
              transform, and the numeric time unit band properties of a mark, failing with a located
              specification exception at the offending value, shall translate a time predicate to a compiled
              expression, and shall classify the timeUnit transform as supported.
            justification: |
              A mistake in a time unit, a datetime object, or an interval must be found when the
              specification is opened, with its location, before any data is read.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-TimeUnits
              - CanvasNetVegaLite-SpecModel-SpecParser-DateTimeObjects
              - CanvasNetVegaLite-SpecModel-SpecParser-TickIntervals
              - CanvasNetVegaLite-SpecModel-SpecParser-TimeFormatLimits
              - CanvasNetVegaLite-SpecModel-SpecParser-TimePredicates
            tests:
              - SpecParser_TimeUnit_AcceptsEveryName
              - SpecParser_TimeUnit_UnknownUnitIsLocated
              - SpecParser_DateTimeObject_InDomainPredicateAndValues_Validated
              - SpecParser_TickCountInterval_Validated
              - SpecParser_TimeFormat_SpecifierLimitsAreSpecificationErrors
              - SpecParser_TimePredicates_AreCompiledOnceUnderThePredicate
              - PredicateSource_TimeUnit_Equal_Month

          - id: CanvasNetVegaLite-SpecModel-ExpressionValidation
            title: >-
              The SpecModel subsystem shall compile, when a specification is parsed, every expression that
              the renderer evaluates and validate the variable parameters and the supported transforms of
              every view, failing with a located specification exception - carrying the pointer, line, and
              column of the offending value and, for an expression, the offset inside its text - at the
              first problem in document order, and exposing the compiled expressions for the later stages.
            justification: |
              A mistake in an expression, a parameter, or a transform must be found when the specification
              is opened, before any data is read, and the later stages must evaluate only the text that was
              compiled and checked.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-Expressions
              - CanvasNetVegaLite-SpecModel-SpecParser-Parameters
              - CanvasNetVegaLite-SpecModel-SpecParser-Transforms
            tests:
              - SpecParser_Parse_ExpressionErrorsCarryTheLocationOfTheTextAndTheOffset
              - SpecParser_Parse_CompilesTheExpressionsOfSupportedSitesOnly
              - SpecParser_Parse_Phase5TransformsAndParametersAreAccepted
              - CanvasNetVegaLite_SystemIntegration_Expressions_ErrorsAndLimitsFailWhenTheDocumentIsOpened

          - id: CanvasNetVegaLite-SpecModel-AggregationValidation
            title: >-
              The SpecModel subsystem shall validate, when a specification is parsed, the shape of the
              transforms aggregate, joinaggregate, window, bin, stack, and impute and of the aggregate, bin,
              stack, sort, and order properties of an encoding - operation names, fields, parameters, frames,
              offsets, bin parameters, and sort forms - failing with a located specification exception at the
              first wrong value in document order and accepting every documented valid form.
            justification: |
              A mistake in an aggregation must be found when the specification is opened, with its location,
              before any data is read, and the later stages must be able to read these properties as given.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-AggregateTransforms
              - CanvasNetVegaLite-SpecModel-SpecParser-EncodingAggregates
              - CanvasNetVegaLite-SpecModel-SpecParser-SortValues
            tests:
              - SpecParser_Parse_AggregateTransformShapesArePinned
              - SpecParser_Parse_WindowTransformShapesArePinned
              - SpecParser_Parse_EncodingAggregateBinStackSortShapesArePinned
              - SpecParser_Parse_SortArrayAndObjectWarningsAreLocated
              - SpecParser_Parse_ValidAggregatingTransformsAreAccepted

          - id: CanvasNetVegaLite-SpecModel-ScaleValidation
            title: >-
              The SpecModel subsystem shall validate, when a specification is parsed, the structured options of
              a scale - the domain and range limits, the interpolate, the scheme with its name, count, and extent,
              and the bins - failing with a located specification exception at the offending value and warning
              about unknown keys of a scheme or an interpolate object.
            justification: |
              A color scheme or interpolation of the wrong shape must be found when the specification is opened,
              with its location, before any data is read.
            children:
              - CanvasNetVegaLite-SpecModel-SpecParser-ScaleOptions
              - CanvasNetVegaLite-SpecModel-SpecParser-LegendOptions
            tests:
              - SpecParser_Parse_WrongTypeReportsPointer
              - SpecParser_Parse_ColorScaleOptionsAreAcceptedAndUnknownKeysWarn
              - SpecParser_Parse_LegendPropertiesAreAcceptedAndUnknownKeysWarn

          - id: CanvasNetVegaLite-SpecModel-SchemaCompatibility
            title: >-
              The SpecModel subsystem shall read the Vega-Lite major version from the $schema URL and
              report the stable vl-schema-version warning for a version other than 5 or 6 or a URL
              that names no Vega-Lite version, while resolving version 5 and version 6 specifications
              with the same version 6 defaults.
            justification: |
              Version 5 specifications remain common; the effect of the version on the output must be
              defined and visible.
            children:
              - CanvasNetVegaLite-SpecModel-FeatureCatalog-SchemaVersion
            tests:
              - FeatureCatalog_Visit_SchemaVersionWarnsOutsideFiveAndSix
              - ConfigResolver_Resolve_SchemaV5UsesV6Defaults

          - id: CanvasNetVegaLite-SpecModel-ConfigDefaults
            title: >-
              The SpecModel subsystem shall resolve a merged configuration from the Vega-Lite version 6
              defaults, the specification's config, and the caller's configuration, in that order of
              increasing precedence, and shall resolve mark, view, title, and guide style properties
              through the Vega-Lite style chains.
            justification: |
              Every default size, color, and spacing of a chart comes from the configuration, and its
              precedence is the contract by which callers restyle charts.
            children:
              - CanvasNetVegaLite-SpecModel-ConfigResolver-V6Defaults
              - CanvasNetVegaLite-SpecModel-ConfigResolver-Precedence
              - CanvasNetVegaLite-SpecModel-ConfigResolver-StyleResolution
            tests:
              - ConfigResolver_Resolve_VegaLiteV6DefaultsAndOverrides
              - ConfigResolver_Resolve_CallerConfigOverridesSpecConfig
              - ConfigResolver_Resolve_MarkPropertiesFollowTheStylePrecedenceChain
