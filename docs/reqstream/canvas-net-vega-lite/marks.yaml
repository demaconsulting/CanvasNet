---
# Software Subsystem Requirements for Marks
#
# These requirements decompose the CanvasNetVegaLite system's mark responsibility into the Marks subsystem
# (internal namespace DemaConsulting.CanvasNet.VegaLite.Marks): the builder that turns the rows of a table, the
# scales, and the resolved configuration into the scene items of the marks bar, rect, point, circle, square,
# rule, tick, line, area, trail, text, and arc (MarkBuilder), and the curve generator that interpolates the
# paths of the line, area, and trail marks (CurveBuilder). Each requirement here links down to the unit
# requirements that implement it. See docs/verification/canvas-net-vega-lite/marks.md for the test-evidence
# mapping.

sections:
  - title: CanvasNetVegaLite Requirements
    sections:
      - title: Marks Requirements
        requirements:
          - id: CanvasNetVegaLite-Marks-SupportedSubset
            title: >-
              The Marks subsystem shall build the scene items of the marks bar, rect, point, circle,
              square, rule, tick, line, area, trail, text, and arc - one item per row (one path or trail per
              group for the path marks) - positioned by the x, y, theta, and radius scales with the
              documented thickness, size, and orientation rules, in a marks group, each item having a
              role that names its mark type.
            justification: |
              The marks are the data of the chart; their geometry must match analytic expectations.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-BarRect
              - CanvasNetVegaLite-Marks-MarkBuilder-SymbolsRuleTick
            tests:
              - MarkBuilder_Build_BarAndRectPositionsMatchExpectedSceneItems
              - MarkBuilder_Build_PointCircleSquareRuleAndTickMatchExpectedSceneItems

          - id: CanvasNetVegaLite-Marks-Properties
            title: >-
              The Marks subsystem shall resolve the color, fill, stroke, size, opacity, and other
              properties of each mark from the encoding (field, value, and datum forms), the mark
              definition, the styles, and the configuration, drawing filled marks with a fill and
              unfilled marks with a stroke, and shall drop the rows whose continuous value is missing.
            justification: |
              Color, size, and opacity are the channels that carry additional data and must be resolved
              as Vega-Lite resolves them.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-Channels
            tests:
              - MarkBuilder_Build_ColorSizeAndOpacityUseExpectedProperties

          - id: CanvasNetVegaLite-Marks-ContinuousColorsAndChannels
            title: >-
              The Marks subsystem shall color the marks from continuous, classified, and categorical color
              scales (the color of the ramp, of the class of the value, or of the category), and shall draw
              the shape, stroke width, stroke dash, fill opacity, stroke opacity, angle, and size channels
              from their scales or values, as the fill of a filled mark and the stroke of an unfilled one,
              ignoring the channels that a mark does not draw.
            justification: |
              A color ramp, a classified color, and the channels that vary a stroke or a symbol per value are
              the encodings that make a chart readable without a legend of its own, and must be drawn as
              Vega-Lite draws them.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-ContinuousColors
              - CanvasNetVegaLite-Marks-MarkBuilder-StrokeAndSymbolChannels
            tests:
              - MarkBuilder_Build_SequentialColorInterpolatesTheRange
              - MarkBuilder_Build_DiscretizedColorsGiveTheColorOfTheClass
              - MarkBuilder_Build_ShapeChannelChoosesTheSymbolOfEachRow

          - id: CanvasNetVegaLite-Marks-ExpressionValues
            title: >-
              The Marks subsystem shall evaluate the expression references of the mark definition and of the
              value channels of the drawn view once per row against the transformed row - the mark color,
              fill, stroke, opacity, strokeWidth, and (for point, circle, and square) size, and the value of
              the color, fill, stroke, opacity, and (for point, circle, and square) size channels - and keep
              the default for a result of the wrong kind, while the tests of the conditional encodings are
              evaluated by the Marks-MarkBuilder-ConditionalEncodings requirement.
            justification: |
              Expression-driven values are how a chart colors or sizes marks from calculated fields; their
              boundary must be explicit so that nothing else is implied to be evaluated.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-ExpressionValues
            tests:
              - MarkBuilder_Build_RowBoundExpressionReferencesAreEvaluatedPerRow
              - CanvasNetVegaLite_SystemIntegration_Expressions_RowBoundMarkValuesAreEvaluatedPerRow

          - id: CanvasNetVegaLite-Marks-StackedMarks
            title: >-
              The Marks subsystem shall draw the layers of a stacked measure each from its stack start to its
              stack end (vertical and horizontal, with the offsets zero, center, and normalize), so that the
              layers sit on one another, and shall place point-like marks on a stacked channel at the stack end.
            justification: |
              A bar chart with a color is a stacked bar chart; its layers must not overlap or start from zero.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-StackedLayers
              - CanvasNetVegaLite-Marks-MarkBuilder-SignedStacks
            tests:
              - MarkBuilder_Build_StackedLayersSpanFromTheStackStartToItsEnd
              - MarkBuilder_Build_SignedStacksHangBelowZeroInBothOrientations
              - CanvasNetVegaLite_SystemIntegration_Stacking_LayersAreDrawnBetweenTheirStackBounds

          - id: CanvasNetVegaLite-Marks-BinnedBars
            title: >-
              The Marks subsystem shall draw a bar or rect on a binned channel across its bin less the bin
              spacing (widening a bin thinner than the minimum band size), and a point-like mark on a binned
              channel at the middle of its bin, so that a histogram shows bars that fill their bins.
            justification: |
              A histogram is the chart that motivates binning, and its bars must fill their bins.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-BinnedBars
            tests:
              - MarkBuilder_Build_BinnedBarsSpanTheirBinsLessTheSpacing
              - CanvasNetVegaLite_SystemIntegration_Binning_HistogramBarsFillTheirBinsLessOnePixel

          - id: CanvasNetVegaLite-Marks-RangedMarks
            title: >-
              The Marks subsystem shall draw a bar, rect, or rule whose position channel has a second channel
              (x2 or y2) as a range between the two ends, including the bars over already binned data, and shall
              clip the marks to the data rectangle only when the mark says clip true.
            justification: |
              Ranges are written with the secondary channels, and Vega-Lite clips marks only on request (or for
              an interval selection), so an explicit domain does not clip.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-SecondaryChannels
              - CanvasNetVegaLite-Marks-MarkBuilder-MarkClip
            tests:
              - MarkBuilder_Build_SecondaryChannelsSpanARange
              - MarkBuilder_Build_PreBinnedRangesSpanFromTheStartToTheEndField
              - CanvasNetVegaLite_SystemIntegration_PreBinned_RangesAreBarsOverTheirRanges

          - id: CanvasNetVegaLite-Marks-Limits
            title: >-
              The Marks subsystem shall bound the number of scene items (and the segments of a path, the
              characters and lines of a label, and the work of grouping and sorting), failing closed with a
              located VegaLiteRenderException before the memory is spent, shall observe the cancellation token
              at bounded intervals, and shall build nothing for a mark that is not supported.
            justification: |
              Marks scale with the data, so they must be bounded and cancelable.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-Limits
              - CanvasNetVegaLite-Marks-MarkBuilder-PathLimits
              - CanvasNetVegaLite-Marks-MarkBuilder-TextLimits
              - CanvasNetVegaLite-Marks-MarkBuilder-ArcLimits
              - CanvasNetVegaLite-Marks-CurveBuilder-Limits
            tests:
              - MarkBuilder_Build_LimitsCancellationAndUnsupportedMarks
              - MarkBuilder_Build_LongDashPatternsExceedTheLimit
              - MarkBuilder_Build_PathSegmentsAreChargedBeforeCreation
              - MarkBuilder_Build_TextCharactersAreChargedBeforeFormatting
              - MarkBuilder_Build_ArcsAreChargedPerSliceAndPollCancellation
              - CurveBuilder_MaxSegments_IsAnUpperBoundForEveryKind
              - CurveBuilder_MaxSegments_IsolatedPointsAreChargedTheirOwnCost
              - MarkBuilder_Build_PointsBeyondTheMagnitudeBoundBreakThePath
              - MarkBuilder_Build_TextBeyondTheMagnitudeBoundIsSkipped

          - id: CanvasNetVegaLite-Marks-TimeUnitBands
            title: >-
              The Marks subsystem shall draw a bar or rect of a time unit over its whole unit, from the start to
              the end of the unit less the bar spacing and the share given by the band size (so that a month
              bar spans its month in the time zone of the chart), draw the marks that do not span a unit
              (points, ticks, and marks with a band position) at the point of their unit that the band position
              names, and place the marks of a time scale at their dates.
            justification: |
              A time chart reads correctly only when its bars cover the calendar unit they count and its points
              sit where the axis says.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-TimeUnitBands
              - CanvasNetVegaLite-Marks-MarkBuilder-TimeUnitPositions
            tests:
              - MarkBuilder_Time_YearMonthBars_SpanTheirMonths
              - MarkBuilder_Time_PointsAtTheStartOfTheUnit
              - MarkBuilder_Time_Zone_BarsSpanLocalMonths
              - CanvasNetVegaLite_SystemIntegration_Time_YearMonthBarsSpanTheirMonthsAndLabelTheMonths
              - CanvasNetVegaLite_SystemIntegration_Time_DstDayIsNot24Hours

          - id: CanvasNetVegaLite-Marks-PathMarks
            title: >-
              The Marks subsystem shall draw the line, area, and trail marks as paths - one for each group of
              rows that share the values of the grouping channels, in the order of the data, sorted by the
              position or the order channel, interpolated by the fifteen Vega-Lite curves (the area with its
              baseline along the same curve, stacked layers meeting, and ranges between two channels), with
              the point and line overlays, the dash, cap, join, and miter properties, and a width that varies
              with the data for a trail.
            justification: |
              Line and area charts are the most common charts after bars; their paths must be what Vega-Lite
              draws.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-Lines
              - CanvasNetVegaLite-Marks-MarkBuilder-Areas
              - CanvasNetVegaLite-Marks-MarkBuilder-Trails
              - CanvasNetVegaLite-Marks-MarkBuilder-Interpolation
              - CanvasNetVegaLite-Marks-MarkBuilder-StrokeProperties
              - CanvasNetVegaLite-Marks-MarkBuilder-Overlays
              - CanvasNetVegaLite-Marks-CurveBuilder-LinearAndStep
              - CanvasNetVegaLite-Marks-CurveBuilder-Basis
              - CanvasNetVegaLite-Marks-CurveBuilder-Cardinal
              - CanvasNetVegaLite-Marks-CurveBuilder-Splines
              - CanvasNetVegaLite-Marks-CurveBuilder-Area
              - CanvasNetVegaLite-Marks-CurveBuilder-Names
            tests:
              - MarkBuilder_Build_LineHasHandDerivedSegmentsAndPaint
              - MarkBuilder_Build_AreaPolygonRunsBetweenTheValueAndTheBaseline
              - MarkBuilder_Build_TrailPointsCarryTheSizeChannel
              - MarkBuilder_Build_InterpolateAndTensionSelectTheCurve
              - MarkBuilder_Build_PointOverlayDrawsSymbolsWithTheOverlayDefinition
              - CurveBuilder_Line_BasisFamilyMatchesTheHandDerivedBeziers
              - CurveBuilder_Area_VerticalAndHorizontalPolygonsMatchTheAnchors
              - CanvasNetVegaLite_SystemIntegration_Lines_PolylineHasTheDocumentedSegmentsAndPixels

          - id: CanvasNetVegaLite-Marks-InvalidDataAndOrder
            title: >-
              The Marks subsystem shall break (or, in the filter mode, connect) a path at a row that has no
              number on a continuous channel, keep such rows in the domains of the scales, and draw the items of
              every mark in the order of the order channel.
            justification: |
              A gap in the data must show as a gap, and the order of drawing decides which mark is on top.
            children:
              - CanvasNetVegaLite-Marks-CurveBuilder-DefinedGaps
              - CanvasNetVegaLite-Marks-MarkBuilder-InvalidData
              - CanvasNetVegaLite-Marks-MarkBuilder-DrawOrder
            tests:
              - CurveBuilder_Line_UndefinedPointsStartNewSubpaths
              - MarkBuilder_Build_DefaultInvalidModeBreaksThePath
              - MarkBuilder_Build_OrderChannelSortsTheDrawOrderOfAnyMark

          - id: CanvasNetVegaLite-Marks-TextMarks
            title: >-
              The Marks subsystem shall draw the text mark as one label per row, with the text formatted from
              the field (the d3 number and time formats and the text of the value), the lines of an array or of
              a line break, the position, offset, angle, alignment, baseline, font, and limit of the mark, and
              the paint of a filled mark.
            justification: |
              Labels make a chart readable; they must read as Vega-Lite would print them.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-TextItems
              - CanvasNetVegaLite-Marks-MarkBuilder-TextContent
            tests:
              - MarkBuilder_Build_TextHasPositionDefaultsAndPaint
              - MarkBuilder_Build_TextFormatsNumbersTimesAndNulls

          - id: CanvasNetVegaLite-Marks-ArcMarks
            title: >-
              The Marks subsystem shall draw the arc mark as one slice per row with the angles and radii of the
              theta and radius channels (a pie, a donut, and a radial chart, stacked slices in the order of the
              data) around the center of the view or the position of the row, and place the labels of a text
              mark by the same polar channels.
            justification: |
              Pie and donut charts are the polar charts of Vega-Lite and the labels that go with them.
            children:
              - CanvasNetVegaLite-Marks-MarkBuilder-Arcs
              - CanvasNetVegaLite-Marks-MarkBuilder-PolarText
            tests:
              - MarkBuilder_Build_PieSlicesHaveHandDerivedAnglesAndRadii
              - MarkBuilder_Build_PieLabelsSitAtTheMiddleOfTheirSlice
              - CanvasNetVegaLite_SystemIntegration_Arcs_PieAndDonutCoverTheirWedges
