---
# Software System Requirements for CanvasNetSvg
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.Svg
# package (namespace DemaConsulting.CanvasNet.Svg) from the perspective of its consumers, without
# specifying implementation details.
#
# CanvasNetSvg is an independent software system, distributed as its own NuGet package,
# depending on the core CanvasNet system (docs/reqstream/canvas-net.yaml) for its Canvas.Surface
# pixel buffer, Geometry path/flattening primitives, Drawing rasterization, and Fonts glyph
# outlines - see docs/design/canvas-net-svg.md's Dependencies section for details.
#
# cspell:ignore rasterizing letterboxing renderable Dasharray xlink Pillarboxes

sections:
  - title: SVG Codec API
    requirements:
      - id: CanvasNetSvg-Lib-SvgLoad
        title: >-
          The library shall load a Surface by rasterizing a supported SVG document, from either a
          stream or a file path, including basic shapes, the full path data mini-language,
          group/attribute inheritance and nested transforms, transform functions, presentation
          attributes, gradients (including href template inheritance), and the use element. The
          library shall propagate Surface's own ArgumentOutOfRangeException, unwrapped, when given
          a non-positive requested output width or height.
        tags: [system]
        justification: |
          Callers need to import SVG vector artwork as pixel buffers for further processing or
          display; SvgCodec is decode/rasterize-only (no Save), and its requested raster
          dimensions are ordinary API parameters rather than untrusted file data.
        children:
          - CanvasNetSvg-SvgCodec-LoadBasicShapes
          - CanvasNetSvg-SvgCodec-LoadPathCommands
          - CanvasNetSvg-SvgCodec-GroupTransformInheritance
          - CanvasNetSvg-SvgCodec-TransformFunctions
          - CanvasNetSvg-SvgCodec-PresentationAttributes
          - CanvasNetSvg-SvgCodec-Gradients
          - CanvasNetSvg-SvgCodec-GradientHrefInheritance
          - CanvasNetSvg-SvgCodec-UseElement
          - CanvasNetSvg-SvgCodec-ElementNestingDepthLimit
          - CanvasNetSvg-SvgCodec-TotalElementBudget
          - CanvasNetSvg-SvgCodec-TotalGeometryWorkBudget
          - CanvasNetSvg-SvgCodec-NumberListLengthBudget
          - CanvasNetSvg-SvgCodec-TotalDocumentElementBudget
          - CanvasNetSvg-SvgCodec-ValidationOutputDimensions
        tests:
          - CanvasNetSvg_SystemIntegration_SvgLoad_ReturnsExpectedPixel

      - id: CanvasNetSvg-Lib-SvgMarkerRendering
        title: >-
          The library shall rasterize marker elements referenced from a line, polyline, polygon,
          or path element's marker-start/marker-mid/marker-end presentation attributes, at the
          correct vertex, orientation, and scale (honoring an explicit preserveAspectRatio
          attribute on the marker itself, when present, and otherwise preserving the pre-existing
          default fit unchanged), and shall reject an unbounded marker-referencing-marker
          reference cycle the same way an unbounded use reference cycle is already rejected.
        tags: [system]
        justification: |
          Connector arrowheads and other per-vertex line decorations built via SVG's marker
          mechanism are common in real-world diagrams and flowcharts; callers need these to
          render rather than silently vanish, with the same bounded, predictable error-handling
          behavior already established for use reference cycles.
        children:
          - CanvasNetSvg-SvgCodec-MarkerRendering
          - CanvasNetSvg-SvgCodec-MarkerReferenceCycle
          - CanvasNetSvg-SvgCodec-MarkerPreserveAspectRatio
        tests:
          - CanvasNetSvg_SystemIntegration_SvgMarkerRendering_RendersMarkerAtLineEnd
          - SvgCodec_Load_MarkerEndOnLine_RendersArrowheadPastLineEnd
          - SvgCodec_Load_MarkerStartMidEndOnPolyline_RendersDistinctMarkersAtEachVertex
          - SvgCodec_Load_ArrowMarkersFixture_RendersArrowheadPastLineEnd
          - SvgCodec_Load_MarkerSelfReferenceCycle_ThrowsInvalidDataException
          - SvgCodec_Load_MarkerTwoElementReferenceCycle_ThrowsInvalidDataException
          - SvgCodec_Load_MarkerWithViewBox_FitsContentToMarkerWidthHeight
          - SvgCodec_Load_MarkerWithExplicitPreserveAspectRatioSlice_UsesLargerUniformScale

      - id: CanvasNetSvg-Lib-SvgFilterRendering
        title: >-
          The library shall rasterize filter elements referenced from any directly renderable
          shape or text element's filter presentation attribute, evaluating a bounded
          feFlood/feGaussianBlur/feOffset/feComposite/feMerge/feColorMatrix/
          feComponentTransfer/feMorphology/feConvolveMatrix/feDisplacementMap/feTile/
          feDropShadow/feImage/feDiffuseLighting/feSpecularLighting/feTurbulence/feBlend
          primitive chain against that element's own content within a bounded-size temporary
          offscreen surface, and shall tolerate a dangling filter reference, a genuinely
          unrecognized primitive type, and pathological filter-region, convolution-order,
          morphology-radius, or turbulence-octave inputs without failing or hanging.
        tags: [system]
        justification: |
          Real-world SVG documents use much more than the initial flood/blur/offset/composite
          subset: authored icons, diagrams, and illustration exports commonly add color-matrix
          stages, component-transfer ramps, morphology/convolution kernels, displacement, tiled
          subregions, drop shadows, and image-based filter inputs. The library therefore needs
          this broader primitive subset to reproduce common authored filter effects while
          keeping the same bounded, predictable resource-safety behavior already established for
          the codec's other reference-following and work-budget concerns.
        children:
          - CanvasNetSvg-SvgCodec-FilterRendering
          - CanvasNetSvg-SvgCodec-FilterResourceSafety
          - CanvasNetSvg-SvgCodec-GroupFilterRendering
          - CanvasNetSvg-SvgCodec-FeColorMatrix
          - CanvasNetSvg-SvgCodec-FeComponentTransfer
          - CanvasNetSvg-SvgCodec-FeMorphology
          - CanvasNetSvg-SvgCodec-FeConvolveMatrix
          - CanvasNetSvg-SvgCodec-FeDisplacementMap
          - CanvasNetSvg-SvgCodec-FeTile
          - CanvasNetSvg-SvgCodec-FeDropShadow
          - CanvasNetSvg-SvgCodec-FeImage
          - CanvasNetSvg-SvgCodec-FeDiffuseLighting
          - CanvasNetSvg-SvgCodec-FeSpecularLighting
          - CanvasNetSvg-SvgCodec-FeTurbulence
          - CanvasNetSvg-SvgCodec-FeBlend
          - CanvasNetSvg-SvgCodec-FilterPrimitiveResourceSafety
        tests:
          - CanvasNetSvg_SystemIntegration_SvgFilterRendering_AppliesFilterChainToShape
          - SvgCodec_Load_FeFloodFeGaussianBlurFeCompositeFilter_RendersBlurredHaloBehindContent
          - SvgCodec_Load_FeColorMatrixTypeHueRotate_RotatesHueByAngle
          - SvgCodec_Load_FeFuncATypeGamma_AppliesGammaCurveToAlpha
          - SvgCodec_Load_FeMorphologyOperatorDilate_GrowsOpaqueRegion
          - SvgCodec_Load_FeConvolveMatrixEdgeDetectKernel_ProducesExpectedEdgeResponse
          - SvgCodec_Load_FeDisplacementMapPositiveScaleWithRedChannelSelector_DisplacesSourcePixels
          - SvgCodec_Load_FeTileTilesUpstreamPrimitiveSubregionAcrossFilterRegion
          - SvgCodec_Load_FeDropShadow_MatchesManualBlurOffsetFloodCompositeChainEquivalent
          - SvgCodec_Load_FeImageElementReferenceHref_RendersReferencedElementOffscreen
          - SvgCodec_Load_FeSpecularLightingFlatAlphaDistantLightAt90DegreesElevation_ProducesUniformSpecularHighlight
          - SvgCodec_TurbulenceTablesRandom_10000thValueFromSeedOne_MatchesSpecPublishedTestVector
          - SvgCodec_Load_FeConvolveMatrixOrderExceedingCap_ThrowsInvalidDataException
          - SvgCodec_Load_FeMorphologyRadiusExceedingCap_ThrowsInvalidDataException
          - SvgCodec_Load_FeBlendSeparableMode_MatchesHandComputedFormula
          - SvgCodec_Load_InkscapeFiltersFixture_ToleratesFiltersAndRendersFlowerContent

      - id: CanvasNetSvg-Lib-SvgClipPathMaskRendering
        title: >-
          The library shall render clip-path and mask elements referenced from any directly
          renderable shape, text, or g/symbol/use element's own clip-path/mask presentation
          attribute, hard-clipping to the union of a clipPath element's own children and/or
          attenuating alpha by mask-content luminance, applying both before that element's own
          filter (per the ordering geometry -> fill/stroke -> clip -> mask -> filter -> group
          opacity), and shall bound clip/mask-related resource use with the same
          tolerant-fallback conventions already established for filter support.
        tags: [system]
        justification: |
          clip-path and mask are common SVG authoring mechanisms for revealing only part of an
          element's own content (a rounded-rectangle photo crop, a doughnut-hole cutout, a
          gradient-driven fade or vignette) that this library previously discarded entirely as an
          explicit out-of-scope simplification; callers relying on either common pattern need it
          to actually apply, in the SVG-specification-defined order relative to filter, with the
          same bounded, predictable resource-safety behavior already established for this
          library's other reference-following and work-budget concerns.
        children:
          - CanvasNetSvg-SvgCodec-ClipPathRendering
          - CanvasNetSvg-SvgCodec-MaskRendering
          - CanvasNetSvg-SvgCodec-EffectOrdering
          - CanvasNetSvg-SvgCodec-EffectResourceSafety
        tests:
          - CanvasNetSvg_SystemIntegration_SvgClipPathRendering_ClipsContentToReferencedShape
          - SvgCodec_Load_ClipPathUserSpaceOnUse_ClipsToAbsoluteCircle
          - SvgCodec_Load_ClipPathObjectBoundingBox_ScalesClipContentToReferenceBounds
          - SvgCodec_Load_MaskDefaultLuminance_WhiteRevealsBlackHides
          - SvgCodec_Load_MaskUnitsUserSpaceOnUse_ReadsRegionAsAbsoluteCoordinates
          - SvgCodec_Load_MaskContentUnitsObjectBoundingBox_ScalesMaskContentToReferenceBounds
          - SvgCodec_Load_ClipPathWithFilter_AppliesClipBeforeFilter
          - SvgCodec_Load_MaskWithFilter_AppliesMaskBeforeFilter
          - SvgCodec_Load_MaskReferenceCycle_ThrowsInvalidDataException

      - id: CanvasNetSvg-Lib-SvgPatternRendering
        title: >-
          The library shall render a pattern element referenced from any directly renderable
          shape's own fill/stroke presentation attribute, tiling the pattern's own resolved
          (possibly href-inherited) content across the painted region per
          patternUnits/patternContentUnits/patternTransform/viewBox, and shall bound
          pattern-related resource use with the same tolerant-fallback conventions already
          established for filter/clip-path/mask support.
        tags: [system]
        justification: |
          pattern is a common SVG authoring mechanism for a repeating tiled fill (a hatching, a
          texture, a repeated icon) that this library previously discarded entirely as an explicit
          out-of-scope simplification; callers relying on this common pattern need it to actually
          tile, with the same href-inheritance, cycle-rejection, and work-budget resource-safety
          behavior already established for this library's other reference-following paint-server
          (gradient) and effect (clip-path/mask) support.
        children:
          - CanvasNetSvg-SvgCodec-PatternRendering
          - CanvasNetSvg-SvgCodec-PatternHrefInheritance
          - CanvasNetSvg-SvgCodec-PatternResourceSafety
        tests:
          - CanvasNetSvg_SystemIntegration_SvgPatternRendering_TilesPatternAcrossShape
          - SvgCodec_Load_PatternDefaultUnits_TilesOnceAcrossShapeBoundingBox
          - SvgCodec_Load_PatternUserSpaceOnUseUnits_TilesRepeatedlyAcrossUserSpace
          - SvgCodec_Load_PatternContentUnitsObjectBoundingBox_MapsContentThroughShapeBoundingBox
          - SvgCodec_Load_PatternObjectBoundingBoxUnitsAndContentUnits_TilesAndContentBothScaleToBoundingBox
          - SvgCodec_Load_PatternTransformRotate180_RotatesTiledContentPlacement
          - SvgCodec_Load_PatternViewBox_FitsContentIntoTileBuffer
          - SvgCodec_Load_PatternStroke_PaintsStrokeOutlineWithTiledContent
          - SvgCodec_Load_PatternFillAndStroke_RenderIndependentPatterns
          - SvgCodec_Load_DanglingPatternReference_RendersUnfilled
          - SvgCodec_Load_FillReferencesNonPatternElement_RendersUnfilled
          - SvgCodec_Load_PatternZeroWidthOrHeight_RendersUnfilledWithoutThrowing
          - SvgCodec_Load_PatternContentWithGroupAndGradient_RendersViaRecursiveElementWalk
          - SvgCodec_Load_PatternHrefInheritance_InheritsContentFromTemplate
          - SvgCodec_Load_PatternHrefChainOfTwoHops_ResolvesToEventualContent
          - SvgCodec_Load_PatternHrefCycle_ThrowsInvalidDataException
          - SvgCodec_Load_PatternSelfReferencingContent_ThrowsInvalidDataException
          - SvgCodec_Load_PatternTileExceedsMaxDimension_FallsBackToUnfilledRendering
          - SvgCodec_Load_PatternReferencedByManyShapesExceedingCumulativeBudget_FallsBackToUnfilledForExcessShapes

      - id: CanvasNetSvg-Lib-SvgImageRendering
        title: >-
          The library shall rasterize an image element whose href/xlink:href is a base64-encoded
          data URI with a supported raster MIME type by decoding it through that format's own
          existing codec and drawing the decoded raster into the element's own placement rect per
          preserveAspectRatio, integrated with the same clip-path/mask/filter/opacity effects
          pipeline every other renderable element already uses, while treating an external
          (non-data:) href or a nested data:image/svg+xml document as a documented,
          security-conscious no-op, and bounding image-related resource use with the same
          tolerant-fallback, work-budget conventions already established for filter/clip-path/
          mask/pattern support.
        tags: [system]
        justification: |
          image is a common SVG authoring mechanism for embedding a raster asset (an icon, a
          photo, a texture) directly inside a vector document that this library previously
          discarded entirely as an explicit out-of-scope simplification; callers relying on this
          common element need its base64-embedded raster payload actually decoded and drawn, with
          the same effects-pipeline integration and work-budget resource-safety behavior already
          established for this library's other paint-server and effect support, while
          external-href resolution and nested-SVG recursion remain deliberately out of scope
          rather than introducing an unbounded or security-sensitive capability.
        children:
          - CanvasNetSvg-SvgCodec-ImageRendering
          - CanvasNetSvg-SvgCodec-ImageExternalHrefScope
          - CanvasNetSvg-SvgCodec-ImageResourceSafety
        tests:
          - CanvasNetSvg_SystemIntegration_SvgImageRendering_RendersEmbeddedRasterImage
          - SvgCodec_Load_ImageDataUriPng_RendersDecodedPixelsAtPlacementRect
          - SvgCodec_Load_ImageDataUriJpeg_RendersDecodedPixelsAtPlacementRect
          - SvgCodec_Load_ImagePreserveAspectRatioMeet_LettersOrPillarboxesNonMatchingAspect
          - SvgCodec_Load_ImagePreserveAspectRatioNone_StretchesNonUniformly
          - SvgCodec_Load_ImageWithClipPath_ClipsToClipPathShape
          - SvgCodec_Load_ImageWithMask_AttenuatesByMaskLuminance
          - SvgCodec_Load_ImageWithFilter_AppliesFilterToDecodedPixels
          - SvgCodec_Load_ImageWithOpacity_AppliesUniformAlphaToCompositedResult
          - SvgCodec_Load_ImageZeroWidthOrHeight_RendersNothingWithoutThrowing
          - SvgCodec_Load_ImageNoWidthOrHeightAttribute_RendersNothingWithoutThrowing
          - SvgCodec_Load_ImageExternalFileHref_RendersNothingWithoutFileAccess
          - SvgCodec_Load_ImageNestedSvgDataUri_RendersNothingWithoutRecursion
          - SvgCodec_Load_ImageMalformedBase64_SkipsElementWithoutThrowing
          - SvgCodec_Load_ImageTruncatedPngData_SkipsElementWithoutThrowing
          - SvgCodec_Load_ImageOversizedDeclaredDimensionsExceedingBudget_FallsBackToUnrenderedWithoutThrowing

      - id: CanvasNetSvg-Lib-SvgViewBoxFitting
        title: >-
          The library shall fit an SVG document's intrinsic viewBox into the requested raster size
          via preserveAspectRatio (defaulting to "xMidYMid meet", a "meet, centered", CSS
          object-fit: contain equivalent, transform, when absent), and shall apply the same fit
          algorithm to a use element referencing a symbol element with its own viewBox.
        tags: [system]
        justification: |
          Callers request a specific raster size that may not share the document's intrinsic
          aspect ratio; preserveAspectRatio is the SVG-specification-defined mechanism for
          controlling that mismatch, and reusing the same fit algorithm for symbol/use content
          keeps both reuse sites consistent and correct.
        children:
          - CanvasNetSvg-SvgCodec-ViewBoxFitting
          - CanvasNetSvg-SvgCodec-SymbolViewBoxFitting
        tests:
          - CanvasNetSvg_SystemIntegration_SvgViewBoxFitting_LetterboxesWideViewBox
          - SvgCodec_Load_WideViewBoxIntoSquareRaster_LetterboxesTopAndBottom
          - SvgCodec_Load_TallViewBoxIntoSquareRaster_LetterboxesLeftAndRight
          - SvgCodec_Load_RootPreserveAspectRatio_AppliesAlignAndMeetOrSlice
          - SvgCodec_Load_RootPreserveAspectRatioNone_StretchesNonUniformly
          - SvgCodec_Load_NoPreserveAspectRatioAttribute_MatchesExplicitXMidYMidMeet
          - SvgCodec_Load_UseReferencingSymbolWithViewBox_FitsContentToResolvedWidthHeight
          - SvgCodec_Load_UseReferencingSymbolWithPreserveAspectRatio_HonorsAlign

      - id: CanvasNetSvg-Lib-SvgPercentageGeometryResolution
        title: >-
          The library shall resolve a percentage value on a shape/text geometry attribute against
          the current SVG viewport (or, for font-size, the parent element's own font-size),
          rather than rejecting it.
        tags: [system]
        justification: |
          Real-world SVG documents commonly size geometry as a percentage of their containing
          viewport; resolving these against a well-defined, spec-aligned basis lets this codec
          render such documents correctly instead of rejecting them outright.
        children:
          - CanvasNetSvg-SvgCodec-PercentageGeometryResolved
        tests:
          - CanvasNetSvg_SystemIntegration_SvgPercentageGeometryResolution_ResolvesWidthPercentage
          - SvgCodec_Load_RectXPercentage_ResolvesAgainstViewportWidth
          - SvgCodec_Load_RectWidthPercentage_ResolvesAgainstViewportWidth
          - SvgCodec_Load_RectYHeightPercentage_ResolvesAgainstViewportHeight
          - SvgCodec_Load_CircleCxCyRPercentage_ResolvesAgainstHorizontalVerticalAndDiagonalBases
          - SvgCodec_Load_LineCoordinatePercentage_ResolvesAgainstViewport
          - SvgCodec_Load_GradientCoordinatePercentage_UnaffectedByViewportPercentageResolution
          - SvgCodec_Load_StrokeWidthPercentage_ResolvesAgainstDiagonalBasis
          - SvgCodec_Load_FontSizePercentage_ResolvesAgainstParentFontSize
          - SvgCodec_Load_StrokeDasharrayPercentage_ResolvesAgainstDiagonalBasis

      - id: CanvasNetSvg-Lib-SvgGetInfo
        title: >-
          The library shall report an SVG document's resolved intrinsic width, height, channel
          count, and alpha presence via GetInfo, given a stream or a file path, falling back from
          viewBox to width/height to a 300x150 default.
        tags: [system]
        justification: |
          Callers need to inspect an SVG document's intrinsic size before choosing a raster
          target size to load it into, even for documents that omit explicit sizing information.
        children:
          - CanvasNetSvg-SvgCodec-GetInfo
          - CanvasNetSvg-SvgCodec-GetInfoFallback
        tests:
          - CanvasNetSvg_SystemIntegration_SvgGetInfo_ReturnsViewBoxDimensions
          - SvgCodec_GetInfo_ViewBoxPresent_ReturnsViewBoxDimensions
          - SvgCodec_GetInfo_FromFilePath_ReturnsExpectedInfo
          - SvgCodec_GetInfo_NoViewBoxWidthHeightPresent_ReturnsWidthHeight
          - SvgCodec_GetInfo_NoViewBoxNoWidthHeight_ReturnsCssDefault300x150

      - id: CanvasNetSvg-Lib-SvgTextRendering
        title: >-
          The library shall render an SVG text element's characters as glyph outlines from a
          caller-supplied font, positioned and anchored according to its text-anchor, and shall
          silently skip text rendering when no matching font is available.
        tags: [system]
        justification: |
          Callers need text content in an SVG document rendered as recognizable glyph shapes
          using real font metrics, without a missing font turning an otherwise-renderable
          document into a failure.
        children:
          - CanvasNetSvg-SvgCodec-TextRendering
          - CanvasNetSvg-SvgCodec-TextFontFallbackSkipsSilently
          - CanvasNetSvg-SvgCodec-TextAnchor
        tests:
          - CanvasNetSvg_SystemIntegration_SvgTextRendering_RendersGlyphAtExpectedPosition
          - SvgCodec_Load_TextWithMatchingFont_RendersGlyphAtExpectedPosition
          - SvgCodec_Load_TextWithKerningPair_AppliesKerningBetweenGlyphs
          - SvgCodec_Load_TextFixtureWithRealFont_RendersVisibleGlyphInk
          - SvgCodec_Load_TextAnchorMiddle_CentersTextHorizontally
          - SvgCodec_Load_TextAnchorEnd_RightAlignsText
          - SvgCodec_Load_TextWithoutFontsDictionary_SkipsSilentlyWithoutThrowing
          - SvgCodec_Load_TextFontFamilyNoMatch_SkipsSilentlyWithoutThrowing
          - SvgCodec_Load_TextFontFamilyCommaSeparatedList_MatchesFirstAvailableFont

      - id: CanvasNetSvg-Lib-SvgFontWeightStyleMatching
        title: >-
          The library shall register more than one font face (varying in font-weight/font-style)
          per SVG text font-family and select the closest-matching registered face for each text
          element's own cascaded font-weight/font-style, while preserving the pre-existing
          single-font-per-family Load overload's behavior unchanged.
        tags: [system]
        justification: |
          Callers commonly need bold titles and italic keywords rendered with the correct
          distinct font face, rather than every element in a family always resolving to the
          same single font regardless of its requested weight/style; existing callers of the
          single-font-per-family overload must observe no behavior change.
        children:
          - CanvasNetSvg-SvgCodec-FontWeightStyleCascade
          - CanvasNetSvg-SvgCodec-FontFaceMatching
          - CanvasNetSvg-SvgCodec-LegacySingleFontCompatibility
        tests:
          - CanvasNetSvg_SystemIntegration_SvgFontWeightStyleMatching_SelectsBoldFaceOverNormalFace
          - SvgCodec_Load_TextFontWeightBold_SelectsBoldFaceOverNormalFace
          - SvgCodec_Load_TextFontStyleItalic_SelectsItalicFaceOverNormalFace
          - SvgCodec_Load_TextFontWeightAndStyleCombined_SelectsExactMatchAmongThreeFaces
          - SvgCodec_Load_GroupFontWeightInheritance_AppliesToChildTextWithoutOwnFontWeight
          - SvgCodec_Load_GroupFontStyleInheritance_AppliesToChildTextWithoutOwnFontStyle
          - SvgCodec_Load_TextLegacySingleFontOverload_IgnoresRequestedWeightAndStyle

      - id: CanvasNetSvg-Lib-SvgValidationNull
        title: >-
          The library shall reject null stream/path arguments to SVG Load and GetInfo operations
          with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to any SVG load or inspection operation is a programming error. Throwing
          ArgumentNullException immediately surfaces the mistake and prevents obscure failures
          deeper in the call stack.
        children:
          - CanvasNetSvg-SvgCodec-ValidationNull
        tests:
          - CanvasNetSvg_SystemIntegration_SvgValidationNull_NullStreamThrowsArgumentNullException
          - SvgCodec_Load_NullStream_ThrowsArgumentNullException
          - SvgCodec_Load_NullPath_ThrowsArgumentNullException
          - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException

      - id: CanvasNetSvg-Lib-SvgValidationEmptyPath
        title: >-
          The library shall reject an empty or whitespace-only path argument to SVG Load and
          GetInfo operations with ArgumentException.
        tags: [system]
        justification: |
          Passing an empty or whitespace-only path to any SVG load or inspection operation is a
          programming error. Throwing ArgumentException immediately surfaces the mistake and
          prevents an obscure file-system error.
        children:
          - CanvasNetSvg-SvgCodec-ValidationEmptyPath
        tests:
          - CanvasNetSvg_SystemIntegration_SvgValidationEmptyPath_EmptyPathThrowsArgumentException
          - SvgCodec_Load_EmptyPath_ThrowsArgumentException
          - SvgCodec_Load_WhitespacePath_ThrowsArgumentException
          - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

      - id: CanvasNetSvg-Lib-SvgUnsupportedFormatValidation
        title: >-
          The library shall reject malformed SVG data (non-well-formed XML, a malformed viewBox
          or transform attribute, or malformed path data) with InvalidDataException.
        tags: [system]
        justification: |
          Callers must be able to distinguish a genuinely malformed SVG document from a
          successful load, and receive a clear, actionable error rather than incorrect pixel
          data.
        children:
          - CanvasNetSvg-SvgCodec-MalformedXmlRejected
          - CanvasNetSvg-SvgCodec-MalformedPathDataRejected
        tests:
          - CanvasNetSvg_SystemIntegration_SvgUnsupportedFormatValidation_MalformedXmlThrowsInvalidDataException
          - SvgCodec_Load_MalformedXml_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedViewBoxWrongNumberCount_ThrowsInvalidDataException
          - SvgCodec_Load_ViewBoxNonPositiveWidth_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedTransformUnrecognizedFunction_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedPathDataUnknownCommand_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedPathDataMissingArguments_ThrowsInvalidDataException

      - id: CanvasNetSvg-Lib-SvgXxeHardening
        title: >-
          The library shall explicitly disable DTD processing and external entity resolution for
          SVG parsing (both Load and GetInfo), rejecting a document containing a DOCTYPE
          declaration with InvalidDataException.
        tags: [system, security]
        justification: |
          Defense-in-depth documentation clarity against XML External Entity (XXE) injection: a
          reader that processed a DOCTYPE or resolved an external entity could otherwise be
          tricked into reading arbitrary local files or making unexpected network requests merely
          by parsing a maliciously crafted SVG document.
        children:
          - CanvasNetSvg-SvgCodec-XxeHardening
        tests:
          - CanvasNetSvg_SystemIntegration_SvgXxeHardening_DoctypeDeclarationThrowsInvalidDataException
          - SvgCodec_Load_DocumentWithDoctypeDeclaration_ThrowsInvalidDataException
          - SvgCodec_Load_DocumentWithExternalEntityDoctype_ThrowsInvalidDataException
          - SvgCodec_GetInfo_DocumentWithExternalEntityDoctype_ThrowsInvalidDataException

      - id: CanvasNetSvg-Lib-SvgTolerateUnsupportedConstructs
        title: >-
          The library shall silently skip well-formed but out-of-scope SVG elements, continuing
          to render the rest of the document, rather than rejecting the entire document.
        tags: [system]
        justification: |
          Real-world SVG documents commonly include constructs outside this codec's supported
          subset (such as filters or masks); rejecting the entire document because of one such
          element would be needlessly strict when the rest of the document is renderable.
        children:
          - CanvasNetSvg-SvgCodec-UnsupportedConstructsIgnored
        tests:
          - CanvasNetSvg_SystemIntegration_SvgTolerateUnsupportedConstructs_StillRendersRestOfDocument
          - SvgCodec_Load_UnsupportedConstructs_StillRendersRestOfDocument
          - SvgCodec_Load_ToleratesUnsupportedConstructFixture_StillRendersRemainingContent

      - id: CanvasNetSvg-Lib-SvgGetInfoValidation
        title: >-
          The library shall reject invalid arguments passed to SVG GetInfo with the same
          exception contract as Load.
        tags: [system]
        justification: |
          Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
        children:
          - CanvasNetSvg-SvgCodec-ValidationNull
          - CanvasNetSvg-SvgCodec-ValidationEmptyPath
        tests:
          - CanvasNetSvg_SystemIntegration_SvgGetInfoValidation_NullStreamThrowsArgumentNullException
          - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException
          - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

      - id: CanvasNetSvg-Lib-SvgCssStyling
        title: >-
          The library shall render an SVG style element's CSS rules against every element's
          type, class, id, universal, and compound selectors (including comma-separated lists
          and descendant/child combinators), resolving each cascaded presentation property
          through standard CSS specificity/cascade-order rules and a 3-tier
          presentation-attribute/stylesheet/inline-style precedence.
        tags: [system]
        justification: |
          A style element with class/id/type selectors is a common, standard way real-world SVG
          documents centralize presentation; callers relying on CSS-driven styling need it to
          actually apply with standard CSS cascade/precedence semantics, rather than the style
          element being silently discarded as an out-of-scope construct.
        children:
          - CanvasNetSvg-SvgCodec-CssStyleElementParsing
          - CanvasNetSvg-SvgCodec-CssSelectorMatching
          - CanvasNetSvg-SvgCodec-CssCombinators
          - CanvasNetSvg-SvgCodec-CssSpecificityCascade
          - CanvasNetSvg-SvgCodec-CssThreeTierPrecedence
          - CanvasNetSvg-SvgCodec-CssResourceSafety
        tests:
          - CanvasNetSvg_SystemIntegration_SvgLoadWithCssStyleElement_ReturnsExpectedPixel
