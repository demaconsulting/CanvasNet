---
# Software System Requirements for CanvasNetVegaLite
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.VegaLite
# package (root namespace DemaConsulting.CanvasNet.VegaLite; internal subsystem namespaces SpecModel, Data,
# Expressions, Transforms, Scales, Guides, Layout, Marks, and Scenegraph) from the perspective of its
# consumers, without specifying implementation details.
#
# CanvasNetVegaLite is an independent software system distributed as its own NuGet package. It reads a
# Vega-Lite specification and renders a static, deterministic chart onto a CanvasNet Surface using only
# managed code and the public CanvasNet APIs: there is no JavaScript runtime, no network access, and no
# dependency on any Vega or d3 package. It supports a deliberately small, documented subset - a single view
# whose data is inline, a local CSV, TSV, DSV, or JSON file read from a sandbox, a named dataset, or a generated
# sequence, the transforms calculate, filter, fold, flatten, sample, pivot, lookup, aggregate, joinaggregate,
# window, bin, stack, and impute with a closed subset of the Vega expression language and static variable
# parameters, the aggregate, bin, and stack of an encoding, the marks bar, rect, point, circle, square,
# rule, and tick (with stacked, binned, and ranged geometry), linear, band, and point scales, axes, and
# titles - and reports every recognized construct outside that subset with a stable vl-* identifier instead of
# skipping it silently (see docs/design/canvas-net-vega-lite.md, Supported And Deferred Features). Remote data is
# never fetched. The tick generation and number formatting are ports of the d3-array and d3-format
# algorithms; the default configuration, view layout, and text layout follow Vega-Lite and Vega behavior.
# Both are attributed in the package's third-party notices (src/DemaConsulting.CanvasNet.VegaLite/third-party).
#
# Every requirement below links down to the subsystem and unit requirements that implement it; the test
# evidence is mapped in docs/verification/canvas-net-vega-lite.md.

sections:
  - title: CanvasNetVegaLite Requirements
    requirements:
      - id: CanvasNetVegaLite-Open
        title: >-
          The library shall parse Vega-Lite specification text supplied as a string, a readable stream,
          or a file path into a VegaLiteDocument that is identical whichever entry point is used, shall
          ignore a leading byte-order mark, and shall reject null arguments and unreadable sources with
          the documented exception contract.
        tags: [system]
        justification: |
          Callers hold specifications in different forms; every entry point must yield the same
          validated result, and invalid arguments must fail closed with a predictable exception rather
          than being coerced.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-ParseOpen
          - CanvasNetVegaLite-SpecModel-Parse
        tests:
          - CanvasNetVegaLite_SystemIntegration_Open_ParseStringOpenStreamAndOpenPathAgree
          - CanvasNetVegaLite_SystemIntegration_Limits_OversizedSourceAndDepthFailClosed

      - id: CanvasNetVegaLite-DocumentMetadata
        title: >-
          The library shall let a caller read what a specification declares - its schema URL and major
          version, plain-text title, mark types, data references, and parameter names - from a parsed
          document without rendering it and without opening any other file or the network.
        tags: [system]
        justification: |
          Tools list what a chart needs before they render it; the description must therefore be
          available from the text alone, cheaply and safely.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-PublicMetadata
          - CanvasNetVegaLite-SpecModel-Metadata
        tests:
          - VegaLiteDocument_Open_SupportedChartHasMetadataAndNoReports
          - SpecMetadata_Read_DescribesSchemaTitleMarksDataAndParameters

      - id: CanvasNetVegaLite-SpecErrors
        title: >-
          The library shall fail closed on a malformed or invalid specification with a
          VegaLiteSpecException that carries the source name, one-based line and column, and RFC 6901
          JSON pointer of the first problem - malformed JSON, a known property of the wrong type, or
          plain Vega instead of Vega-Lite - while treating properties it does not know as warnings, not
          errors.
        tags: [system]
        justification: |
          Authors need to find a mistake in a specification quickly, and a renderer that guesses at
          invalid input would produce a chart that silently differs from the author's intent.
        children:
          - CanvasNetVegaLite-SpecModel-Locations
          - CanvasNetVegaLite-SpecModel-StructuralValidation
          - CanvasNetVegaLite-VegaLiteDocument-ErrorContract
        tests:
          - CanvasNetVegaLite_SystemIntegration_Spec_MalformedJsonReportsLineAndColumn
          - VegaLiteDocument_Parse_WrongTypeFailsWithPointerAndSourceName

      - id: CanvasNetVegaLite-SchemaVersions
        title: >-
          The library shall accept a $schema of Vega-Lite version 5 or 6 and interpret both with the
          version 6 defaults, and shall render a specification of any other or unnamed version with the
          same defaults while reporting a stable schema-version warning.
        tags: [system]
        justification: |
          Specifications in the wild name version 5 or 6; the renderer implements one set of defaults, so
          the outcome must be well defined and visible for every version rather than depending on an
          unstated assumption.
        children:
          - CanvasNetVegaLite-SpecModel-SchemaCompatibility
        tests:
          - CanvasNetVegaLite_SystemIntegration_Schema_V5AndV6UseV6Defaults
          - FeatureCatalog_Visit_SchemaVersionWarnsOutsideFiveAndSix

      - id: CanvasNetVegaLite-Configuration
        title: >-
          The library shall resolve the effective configuration in the order Vega-Lite version 6
          defaults, then the specification's own config, then the caller's Config option, so that a
          caller can restyle a chart without editing its text.
        tags: [system]
        justification: |
          Hosts such as documentation builds must apply a house style on top of whatever a specification
          says, and the precedence must be defined.
        children:
          - CanvasNetVegaLite-SpecModel-ConfigDefaults
        tests:
          - CanvasNetVegaLite_SystemIntegration_Render_CallerConfigOverridesSpecificationConfig
          - ConfigResolver_Resolve_CallerConfigOverridesSpecConfig

      - id: CanvasNetVegaLite-ImmutableOptions
        title: >-
          The library shall let a caller supply immutable, validated open options (source name, base
          directory, data paths), render options (scale, background, container size, limits,
          configuration, parameters, datasets, time zone, fonts, and report handlers), font options, and
          limits, rejecting invalid values when they are set and never changing an options instance
          afterwards.
        tags: [system]
        justification: |
          Options that are validated at initialization let the document trust every instance it receives,
          and immutability makes a shared options instance safe to use from several threads.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-Options
        tests:
          - CanvasNetVegaLite_SystemIntegration_Options_AreValidatedAndImmutable

      - id: CanvasNetVegaLite-MeasureRender
        title: >-
          The library shall compute the size a chart renders at without drawing it (Measure), render the
          chart onto a new Surface at its natural size multiplied by the scale option, and render it onto
          a Surface of an exact width and height by scaling the natural chart uniformly to fit and
          centering it over the background, with Measure always reporting exactly the size Render
          returns.
        tags: [system]
        justification: |
          Hosts must size a page, a slide, or an image before they draw, and a fixed destination size
          must not distort the chart; the measured and rendered sizes must agree so that layout built on
          Measure is reliable.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-RenderContract
          - CanvasNetVegaLite-Layout-ViewGeometry
        tests:
          - CanvasNetVegaLite_SystemIntegration_Render_EmptyTitleViewHasDocumentedSizeAndColors
          - CanvasNetVegaLite_SystemIntegration_Render_ScaleAndExplicitSizeFit
          - CanvasNetVegaLite_SystemIntegration_Measure_MatchesNaturalRenderedSize
          - CanvasNetVegaLite_SystemIntegration_Render_WidthHeightUniformlyFitsAndCenters

      - id: CanvasNetVegaLite-InlineCharts
        title: >-
          The library shall render a single-view chart whose data is given inline - loading the rows,
          resolving the scales, drawing the axes, grid, tick labels, marks, and title, and laying them
          out on the view with the Vega-Lite version 6 default size, padding, background, and border -
          into a chart whose geometry and colors are the documented ones.
        tags: [system]
        justification: |
          Rendering inline-data charts is the purpose of the first delivery; the geometry must be
          specified by analytic expectations rather than inherited from another renderer.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-InlineChartPipeline
          - CanvasNetVegaLite-Data-InlineValues
          - CanvasNetVegaLite-Scales-Positions
          - CanvasNetVegaLite-Scales-CategoryColors
          - CanvasNetVegaLite-Guides-Axes
          - CanvasNetVegaLite-Guides-Titles
          - CanvasNetVegaLite-Layout-ViewAppearance
        tests:
          - CanvasNetVegaLite_SystemIntegration_Render_InlineBarHasExpectedSamplePixels
          - CanvasNetVegaLite_SystemIntegration_Render_PointRuleTickHaveExpectedSamplePixels
          - CanvasNetVegaLite_SystemIntegration_Render_ContainerWidthFillsTheContainer

      - id: CanvasNetVegaLite-SupportedSubset
        title: >-
          The library shall support exactly the documented subset of Vega-Lite - the marks bar, rect,
          point, circle, square, rule, and tick, the x, y, color, fill, stroke, size, and opacity
          channels (and the x2 and y2 ranges of bar, rect, and rule) with field, value, and datum forms,
          quantitative, nominal, and ordinal types, and
          linear, band, and point scales with their documented properties - and shall draw each
          supported construct without reporting it.
        tags: [system]
        justification: |
          A renderer that claims general Vega-Lite support but draws a subset misleads its users; the
          boundary must be explicit and the supported side must be exercised by tests.
        children:
          - CanvasNetVegaLite-Marks-SupportedSubset
          - CanvasNetVegaLite-Marks-Properties
          - CanvasNetVegaLite-Scales-Types
          - CanvasNetVegaLite-Scales-Domains
        tests:
          - CanvasNetVegaLite_SystemIntegration_Render_InlineBarHasExpectedSamplePixels
          - CanvasNetVegaLite_SystemIntegration_Render_PointRuleTickHaveExpectedSamplePixels
          - FeatureCatalog_Visit_SupportedSpecificationHasNoReports

      - id: CanvasNetVegaLite-InlineData
        title: >-
          The library shall report a data source it recognizes but does not read - a missing or empty
          values array (the stable vl-data-empty warning, an empty chart), text or GeoJSON values, and the
          geographic generators - as an empty table with its own stable vl-data-* identifier, never as an
          unexplained empty chart.
        tags: [system]
        justification: |
          The consumer must be told when a chart's data was not used instead of receiving an unexplained
          empty chart.
        children:
          - CanvasNetVegaLite-Data-EmptyAndRemote
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_RemoteUrlIsReportedNotFetched
          - DataLoader_Load_EmptyValuesReportsVlDataEmpty
          - DataLoader_Load_OtherSourcesAreEmptyTablesReportedByTheCatalog

      - id: CanvasNetVegaLite-DataFiles
        title: >-
          The library shall draw a chart whose data url is a relative local path from the CSV, TSV, DSV,
          or JSON file it names - found in the folder of an opened specification, the base directory,
          the data paths, or through the caller's file callback, and read as the format that format.type
          or else the file extension names, with an optional property path to the rows - so that the
          chart is pixel-identical to the same rows written inline, reading the files only while
          measuring or rendering, and failing with a located VegaLiteRenderException when a document with
          no folder, base directory, data path, or callback names a local file.
        tags: [system]
        justification: |
          Real charts keep their data in files; the library must read them predictably from where the
          specification lives, without a hidden dependency on the working directory.
        children:
          - CanvasNetVegaLite-Data-LocalFiles
          - CanvasNetVegaLite-VegaLiteDocument-DataSources
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_LocalFileLoadsFromOpenedSpecFolder
          - CanvasNetVegaLite_SystemIntegration_Data_StreamNeedsResolverForLocalFile
          - CanvasNetVegaLite_SystemIntegration_Render_FileBackedChartsMatchTheInlineChart

      - id: CanvasNetVegaLite-DataParsing
        title: >-
          The library shall type the values of a data file the way Vega does - applying no data-based
          type inference to delimited text unless format.parse is "auto" (so an absent or null parse keeps
          every cell a string, while quantitative encodings still coerce numeric text when they are
          drawn), converting only the fields that format.parse names to number, boolean, date, or string,
          and reading ISO 8601 dates in UTC independently of the host - shall make a value that an
          explicit conversion cannot read null with a located vl-data-parse-failed warning per field, and
          shall report a custom date format as the unsupported vl-data-parse-date-format while leaving the
          field as read.
        tags: [system]
        justification: |
          Scales, sorting, and labels depend on the type of a value, identifiers such as postal codes must
          not be silently converted, and the same file must draw the same chart on every machine and mean
          the same as in Vega; a conversion that fails must be visible.
        children:
          - CanvasNetVegaLite-Data-Parsing
          - CanvasNetVegaLite-SpecModel-FeatureReporting
          - CanvasNetVegaLite-SpecModel-StructuralValidation
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_ParseFailuresAreDeliveredAsWarnings
          - CanvasNetVegaLite_SystemIntegration_Data_DefaultDelimitedTextPreservesTextAndQuantitativeRenderCoerces
          - CanvasNetVegaLite_SystemIntegration_Render_FileBackedChartsMatchTheInlineChart
          - FeatureCatalog_Visit_CustomDateFormatReportsStableIdentifier

      - id: CanvasNetVegaLite-NamedDataAndSequences
        title: >-
          The library shall draw a chart whose data is a named dataset - taken from the caller's Datasets
          option first and the top-level datasets of the specification second - or a generated sequence
          (start, exclusive stop, step, and field name), without any report, and shall fail with a located
          VegaLiteRenderException when a data name is defined by nobody or when a sequence has a missing
          or non-finite start or stop, or a zero, non-finite, or non-numeric step.
        tags: [system]
        justification: |
          Hosts supply data without editing the specification, and generated data needs no file at all;
          an unusable sequence must be an error, not a silent default.
        children:
          - CanvasNetVegaLite-Data-NamedAndSequence
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_SequenceAndNamedDatasetsRender
          - DataLoader_Load_MissingNamedDataIsHardFailure
          - DataLoader_Load_SequenceZeroOrNonFiniteStepIsLocatedFailure

      - id: CanvasNetVegaLite-DataSandbox
        title: >-
          The library shall confine the reading of data files to the base directory, the data paths, or
          the caller's callback: it shall refuse an absolute, rooted, drive, UNC, empty, colon, or
          control-character path and a path that leaves its root, shall refuse a file reached through a
          symbolic link or junction below a root, shall never touch the file system while the callback is
          set, and shall treat a failure to decide as a refusal.
        tags: [system, security]
        justification: |
          A specification may come from an untrusted source; a data url must never become a way to read
          arbitrary files of the host.
        children:
          - CanvasNetVegaLite-Data-Sandbox
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_MissingOrBlockedFileThrowsRenderException
          - CanvasNetVegaLite_SystemIntegration_Data_LocalFileLoadsFromOpenedSpecFolder
          - DataFileResolver_Load_LinkedDirectoryIsRejectedBeforeOpen

      - id: CanvasNetVegaLite-DataErrors
        title: >-
          The library shall fail with a VegaLiteRenderException located at the data url or name, in
          lenient and strict mode alike, when a local data file is missing, refused by the sandbox,
          unreadable (including a directory in place of a file, an open failure, and a failing resolver
          callback or stream), not valid UTF-8, or not valid data, and shall never render such a chart as
          an empty one.
        tags: [system]
        justification: |
          A broken data reference is a deployment error; only remote data, which is never read, is
          reported and left empty.
        children:
          - CanvasNetVegaLite-Data-HardErrors
          - CanvasNetVegaLite-VegaLiteDocument-DataErrors
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_MissingOrBlockedFileThrowsRenderException
          - CanvasNetVegaLite_SystemIntegration_Data_StreamNeedsResolverForLocalFile

      - id: CanvasNetVegaLite-NoNetwork
        title: >-
          The library shall never use the network: a remote URL in the data of a specification - one with
          a scheme, or an absolute, rooted, drive, or network path - shall be reported with the stable
          vl-data-remote-url identifier as an unsupported feature, the data shall be treated as empty, and
          the URL shall never be fetched, opened, or given to the file callback.
        tags: [system]
        justification: |
          A renderer that follows URLs in untrusted specifications would be a request-forgery vector that
          can leak data, and its output would depend on the state of the network.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-NoNetwork
        tests:
          - CanvasNetVegaLite_SystemIntegration_Data_RemoteUrlIsReportedNotFetched
          - FeatureCatalog_Visit_RemoteUrlsRemainVlDataRemoteUrl

      - id: CanvasNetVegaLite-Diagnostics
        title: >-
          The library shall report recoverable problems - an unknown property, a duplicate key, an
          unrecognized schema version, and empty data - as located, de-duplicated warnings delivered to
          the caller's handler in document order, once, on the calling thread, before Measure or Render
          returns or throws, and shall bound how many it keeps.
        tags: [system]
        justification: |
          Authors need feedback on mistakes, but a chart with a mistake should still render; delivery on
          the calling thread in a defined order keeps the behavior testable and thread safe.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-Diagnostics
        tests:
          - VegaLiteDocument_Render_DeliversParseWarningsAndCatalogReportsInDocumentOrder
          - VegaLiteReportSink_Cap_CollapsesOverflowIntoOneNotice

      - id: CanvasNetVegaLite-UnsupportedFeatures
        title: >-
          The library shall report every recognized construct outside the supported subset - marks,
          channels, types, scale types and properties, legends, guide properties, expressions,
          transforms, parameters, compositions, and data sources - as an unsupported-feature report with
          a stable vl-* identifier, a message, and the RFC 6901 pointer with one-based line and column of
          the construct, once per feature and location, and shall never skip such a construct silently,
          while not reporting a construct that it draws (the aggregate, bin of x and y, and stack of an
          encoding, the aggregating transforms, and the secondary channels of bars, rects, and rules).
        tags: [system]
        justification: |
          Unsupported features are a different problem from mistakes and must be distinguishable from
          them; stable identifiers let tools and builds react to a specific gap.
        children:
          - CanvasNetVegaLite-SpecModel-FeatureReporting
        tests:
          - CanvasNetVegaLite_SystemIntegration_Unsupported_MarkIsReportedWithPointer
          - CanvasNetVegaLite_SystemIntegration_Unsupported_MarkAndTransformCarryPointerLineColumn
          - CanvasNetVegaLite_SystemIntegration_Aggregation_OnlyTheUnsupportedPartIsReported

      - id: CanvasNetVegaLite-StrictMode
        title: >-
          The library shall, when the caller sets ThrowOnUnsupportedFeature, abort at the first
          unsupported feature with a VegaLiteUnsupportedFeatureException that carries the feature
          identifier and location after delivering that report to the handler, and shall not abort for
          warnings.
        tags: [system]
        justification: |
          Builds that must never accept an approximate chart need a way to turn an unsupported feature
          into a failure.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-UnsupportedStrictness
        tests:
          - CanvasNetVegaLite_SystemIntegration_Strict_ThrowsAtFirstUnsupportedFeature
          - VegaLiteDocument_Render_StrictModeIgnoresWarningsAndThrowsAtTheFirstUnsupportedFeature

      - id: CanvasNetVegaLite-LimitsCancellation
        title: >-
          The library shall bound every resource a specification can consume - source length, JSON
          nesting, data rows, fields, files, and bytes, scale domain size, ticks, scene items, and
          reports - and shall fail closed with a located exception when a limit is exceeded, accepting
          exactly the limit, and shall observe a cancellation token before and during measuring and
          rendering by stopping with an unwrapped OperationCanceledException.
        tags: [system]
        justification: |
          Rendering untrusted specifications must not be able to exhaust memory or time, and callers need
          a way to abandon work that takes longer than they can afford.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-Limits
          - CanvasNetVegaLite-SpecModel-Limits
          - CanvasNetVegaLite-Data-Limits
          - CanvasNetVegaLite-Marks-Limits
        tests:
          - CanvasNetVegaLite_SystemIntegration_Limits_OversizedSourceAndDepthFailClosed
          - CanvasNetVegaLite_SystemIntegration_Limits_ChartFailuresCarryLocations
          - CanvasNetVegaLite_SystemIntegration_Data_LimitsFailBeforeSceneBudget
          - CanvasNetVegaLite_SystemIntegration_Cancellation_Honored

      - id: CanvasNetVegaLite-Determinism
        title: >-
          The library shall be deterministic: the same specification and options shall render
          byte-identical images and give identical reports on every platform, in every culture, on every
          thread, and for repeated and concurrent renders.
        tags: [system]
        justification: |
          Reproducibility is required for golden tests, caching, and trustworthy use of the results, and a
          shared document must be safe to render from several threads.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-Determinism
        tests:
          - CanvasNetVegaLite_SystemIntegration_Determinism_RepeatedAndConcurrentRendersAreByteIdentical
          - VegaLiteDocument_Render_TitledViewIsDeterministicAcrossThreadsAndFontOptions

      - id: CanvasNetVegaLite-BundledFonts
        title: >-
          The library shall measure and draw text with the fonts bundled with CanvasNet by default,
          resolving generic and Arial-like family names to the bundled Liberation family regardless of
          the fonts installed on the machine, and shall use additional font directories or installed
          system fonts only when the caller opts in through the font options.
        tags: [system]
        justification: |
          Text width drives the layout of every axis and title; using installed fonts would make the same
          chart a different size on different machines.
        children:
          - CanvasNetVegaLite-Guides-TextMeasurement
        tests:
          - CanvasNetVegaLite_SystemIntegration_Fonts_DefaultUsesBundledLiberation
          - VegaLiteFontOptions_Defaults_AreBundledOnly

      - id: CanvasNetVegaLite-UtcDefault
        title: >-
          The library shall use UTC as the default time zone, independent of the host's local time zone,
          and shall let the caller choose another time zone through the render options.
        tags: [system]
        justification: |
          Date handling that depended on the local time zone would make a chart differ between the
          machines that render it.
        children:
          - CanvasNetVegaLite-VegaLiteDocument-TimeZone
        tests:
          - VegaLiteRenderOptions_Defaults_AreDocumented
          - VegaLiteRenderOptions_ValidValues_AreStored

      - id: CanvasNetVegaLite-ScenePainting
        title: >-
          The library shall describe a chart as an immutable scene of groups, rectangles, rules, paths,
          symbols, and text with CSS-string colors, and paint that scene onto a CanvasNet Surface using
          only the public CanvasNet drawing APIs, with fill, stroke, dash, opacity, rotation, uniform
          scale, and clipping applied as documented.
        tags: [system]
        justification: |
          Separating the scene from the pixels lets geometry be asserted analytically and lets the
          painter be verified independently of the chart logic.
        children:
          - CanvasNetVegaLite-Scenegraph-Model
          - CanvasNetVegaLite-Scenegraph-Painting
          - CanvasNetVegaLite-Scenegraph-Colors
        tests:
          - CanvasNetVegaLite_SystemIntegration_Render_InlineBarHasExpectedSamplePixels
          - ScenePainter_Paint_RectAndRuleHonorsFillStrokeOpacity
          - SceneModel_Create_GroupsAndItemsPreservesDeterministicOrder

      - id: CanvasNetVegaLite-D3Ports
        title: >-
          The library shall generate axis ticks and format quantitative labels with its own C# ports of
          the d3-array tick, tick-step, and nice algorithms and the d3-format number-formatting
          algorithm, producing the same values as the documented algorithms, culture-independently, and
          shall distribute the BSD-3-Clause (Vega-Lite and Vega) and ISC (d3) notices of the ported
          behavior with the package.
        tags: [system]
        justification: |
          Matching d3's tick values and label text is what makes an axis look like a Vega-Lite axis; the
          algorithms are third-party works whose licenses require attribution in distributions, and no
          JavaScript runtime or package dependency is acceptable.
        children:
          - CanvasNetVegaLite-Scales-Ticks
          - CanvasNetVegaLite-Scales-Formatting
        tests:
          - Ticks_Ticks_LinearRangeMatchesHandDerivedExpectedVector
          - NumberFormat_Format_QuantitativeLabelsMatchHandDerivedExpectedVector
          - AxisBuilder_Build_LinearAxisUsesExpectedTickValuesAndLabels

      - id: CanvasNetVegaLite-ColorSchemes
        title: >-
          The library shall provide the 68 color schemes of Vega - categorical lists and continuous ramps,
          including the ColorBrewer, matplotlib, cividis, and Turbo colors - with the colors, counts, and
          interpolation of Vega (piecewise sRGB, with HSL, CIELAB, and HCL on request), culture-independently,
          and shall distribute the license notices of those palettes (ColorBrewer and Turbo Apache-2.0, the
          cividis license, the CC0 credit, and the d3 and Vega licenses) with the package.
        tags: [system]
        justification: |
          A scheme name in a specification must give the colors that Vega gives, and the licenses of the
          palettes require their notices to be reproduced in binary distributions.
        children:
          - CanvasNetVegaLite-Scales-ColorSchemeCatalog
          - CanvasNetVegaLite-Scales-ColorInterpolation
        tests:
          - ColorSchemes_Catalog_HasSixtyEightSchemesWithUniqueNames
          - ColorSchemes_Notices_ShipWithTheTablesAndNameEveryLicense
          - ColorInterpolator_Interpolation_IsDeterministic

      - id: CanvasNetVegaLite-ContinuousColor
        title: >-
          The library shall give a quantitative color, fill, or stroke field a continuous color scale as
          Vega-Lite does - a sequential scale over the extent of the data (a diverging one with a middle
          value) that maps a number to a color of the ramp, heatmap, or diverging range of the
          configuration, of a named scheme with its extent, count, and reversal, or of a list of colors
          interpolated in the color space that interpolate names - with the zero, nice, domain limit, and
          clamp rules of Vega, and shall refuse an unknown scheme name or a malformed scheme with a located
          specification error.
        tags: [system]
        justification: |
          A continuous color encoding must look as it does in Vega-Lite, and a scheme that is misspelled or
          malformed must be found where it is written rather than drawn as a guess.
        children:
          - CanvasNetVegaLite-Scales-ContinuousColors
          - CanvasNetVegaLite-SpecModel-ScaleValidation
          - CanvasNetVegaLite-Marks-ContinuousColorsAndChannels
        tests:
          - ScaleResolverColor_Default_QuantitativeColorIsSequentialWithTheRampScheme
          - ScaleResolverColor_Scheme_UnknownNameIsASpecificationError
          - MarkBuilder_Build_SequentialColorInterpolatesTheRange
          - CanvasNetVegaLite_SystemIntegration_Colors_RampColorAndShapeChannelsAreDrawnInStrictMode
          - CanvasNetVegaLite_SystemIntegration_Colors_DiagnosticsAreLocated

      - id: CanvasNetVegaLite-DiscretizingScales
        title: >-
          The library shall classify values with the quantize, quantile, threshold, and bin-ordinal scales
          of Vega-Lite - the class boundaries, the class counts, and the scheme colors, spread sizes,
          opacities, shapes, and dash patterns of each class - and shall give the strokeWidth, fillOpacity,
          strokeOpacity, angle, shape, and strokeDash channels their scales with the documented default
          ranges, under the scale-domain limit and the cancellation token.
        tags: [system]
        justification: |
          Classified charts and the channels that vary a mark property per value depend on where the class
          boundaries fall and on the default ranges, which must be those of Vega-Lite.
        children:
          - CanvasNetVegaLite-Scales-DiscretizingScales
          - CanvasNetVegaLite-Scales-ChannelRanges
        tests:
          - ScaleResolverColor_Quantize_UsesFiveSchemeColorsOverEqualIntervals
          - ScaleResolverColor_Limits_AreEnforcedBeforeAnythingIsBuilt

      - id: CanvasNetVegaLite-Legends
        title: >-
          The library shall explain the color, size, shape, fill, stroke, stroke dash, stroke width, and
          opacity channels of a chart with legends as Vega-Lite does - a symbol legend with an entry per
          value, a color gradient for a continuous color scale, and bands for a discretizing one - merging the
          legends of channels that share a domain, titling them like the axes, honoring the documented legend
          properties and configuration, thinning overlapping labels, and bounding every legend by the limits
          of the library and the cancellation token.
        tags: [system]
        justification: |
          A chart with a color, size, or shape encoding cannot be read without its key, and the key must look
          and measure as it does in Vega-Lite so that the chart around it is laid out the same.
        children:
          - CanvasNetVegaLite-Guides-Legends
          - CanvasNetVegaLite-Guides-OverlapRemoval
          - CanvasNetVegaLite-Layout-LegendPlacement
        tests:
          - LegendPlan_Merge_ChannelsOfTheSameDomainShareOneLegend
          - LegendBuilder_Symbol_NominalColorOnAPointDrawsStrokedCirclesInOneColumn
          - LegendBuilder_Gradient_ContinuousColorDrawsAVerticalBarWithTickLabels
          - LegendBuilder_Discrete_QuantizeColorDrawsOneBandPerClass
          - LegendBuilder_Limits_AreEnforcedBeforeAnythingIsCreated
          - CanvasNetVegaLite_SystemIntegration_Legend_SymbolLegendsStackRightOfTheDataRectangle
          - CanvasNetVegaLite_SystemIntegration_Legend_QuantitativeColorDrawsAGradient
          - CanvasNetVegaLite_SystemIntegration_Legend_DefaultColorRampOfAScatterPlotHasAGradientLegend
          - CanvasNetVegaLite_SystemIntegration_Legend_SharedFieldsMergeAndOthersStack
          - CanvasNetVegaLite_SystemIntegration_Legend_NullSwitchesTheLegendOff
          - CanvasNetVegaLite_SystemIntegration_Legend_UnsupportedPropertiesAreReportedWithLocations
          - CanvasNetVegaLite_SystemIntegration_Legend_LimitsAndCancellationApply
          - CanvasNetVegaLite_SystemIntegration_Legend_RendersAreDeterministicAcrossThreads

      - id: CanvasNetVegaLite-ExtendedScales
        title: >-
          The library shall draw quantitative fields on the log, pow, sqrt, and symlog scales of Vega-Lite
          with their base, exponent, and constant, the zero, nice, clamp, and domain rules of Vega-Lite, the
          log ticks and labels of d3, and axes and gradient legends that follow the transformed scale, and
          shall refuse a log scale whose domain includes or crosses zero with a located error that names
          the symlog scale, under the limits of the library and the cancellation token.
        tags: [system]
        justification: |
          Positions, ticks, and legends on a non-linear scale must be those of Vega-Lite, and a domain that
          a logarithm cannot draw must be found where it is written rather than drawn as an empty chart.
        children:
          - CanvasNetVegaLite-Scales-ScaleModel-Transforms
          - CanvasNetVegaLite-Scales-ScaleResolver-TransformedScales
          - CanvasNetVegaLite-Scales-Ticks-LogTicks
          - CanvasNetVegaLite-Scales-Ticks-LogNice
          - CanvasNetVegaLite-Scales-Ticks-LogLabels
          - CanvasNetVegaLite-Scales-NumberFormat-FormatFloat
          - CanvasNetVegaLite-Scales-NumberFormat-ZeroSpan
          - CanvasNetVegaLite-Guides-AxisBuilder-LogAxis
          - CanvasNetVegaLite-Guides-LegendBuilder-NonLinearScales
          - CanvasNetVegaLite-Marks-MarkBuilder-LogScales
        tests:
          - CanvasNetVegaLite_SystemIntegration_LogScale_BarsRiseByTheLogarithmOfTheirValue
          - CanvasNetVegaLite_SystemIntegration_LogScale_ZeroInTheDataIsALocatedErrorAndSymlogDrawsIt
          - CanvasNetVegaLite_SystemIntegration_SqrtAndSymlogScales_PointsSitAtTheTransformedPositions
          - CanvasNetVegaLite_SystemIntegration_LogScale_ColorLegendLabelsThePowers
          - CanvasNetVegaLite_SystemIntegration_LogScale_LimitsCancellationAndDeterminismApply

      - id: CanvasNetVegaLite-ExpressionLanguage
        title: >-
          The library shall evaluate a documented subset of the Vega expression language - literals, datum
          and parameter access, the unary, arithmetic, comparison, logical, and conditional operators with
          JavaScript coercion, array and object values, and a closed list of pure functions - once per row
          for the calculate and filter transforms and for the row-bound color, opacity, width, and size
          values of marks and encodings, so that an expression selects and computes exactly what the same
          expression does in Vega, with no access to the host.
        tags: [system]
        justification: |
          Calculated fields and filters are how most real charts derive what they draw; the semantics must
          be those of the language the author wrote the expression in, and the engine must be a closed world.
        children:
          - CanvasNetVegaLite-Expressions-Language
          - CanvasNetVegaLite-Expressions-Evaluation
          - CanvasNetVegaLite-Expressions-Functions
          - CanvasNetVegaLite-Data-CompositeValues
          - CanvasNetVegaLite-Marks-ExpressionValues
        tests:
          - CanvasNetVegaLite_SystemIntegration_Transforms_FilterAndCalculateSelectTheDrawnDots
          - CanvasNetVegaLite_SystemIntegration_Expressions_RowBoundMarkValuesAreEvaluatedPerRow

      - id: CanvasNetVegaLite-ExpressionSafety
        title: >-
          The library shall bound every resource that an expression can consume - its length, its nesting
          depth, the steps of its evaluation, the size of its strings, and the time of its regular
          expressions - accepting exactly a limit, never recursing in proportion to the text, never
          reaching a clock, a random source, the file system, the network, or reflection, and failing closed
          with a located exception when a limit is exceeded.
        tags: [system, security]
        justification: |
          A specification may come from an untrusted source; an expression must not be a way to exhaust the
          stack, memory, or time of the host or to reach anything beyond the chart.
        children:
          - CanvasNetVegaLite-Expressions-Bounds
        tests:
          - CanvasNetVegaLite_SystemIntegration_Expressions_ErrorsAndLimitsFailWhenTheDocumentIsOpened
          - CanvasNetVegaLite_SystemIntegration_Expressions_HostileEvaluationFailsClosed

      - id: CanvasNetVegaLite-StaticParameters
        title: >-
          The library shall support the static variable parameters of a specification - a value or an
          expression per parameter, evaluated once per call in dependency order, replaced by the caller's
          Parameters render option, and read by an expression or by a filter predicate - and shall report
          selection parameters, event bindings, and scale bindings as unsupported features.
        tags: [system]
        justification: |
          Hosts must be able to change a chart without editing its text, and an interactive parameter that
          cannot act on a static chart must be named, not ignored.
        children:
          - CanvasNetVegaLite-Transforms-Parameters
        tests:
          - CanvasNetVegaLite_SystemIntegration_Parameters_DefaultsOverridesAndFilterParam
          - CanvasNetVegaLite_SystemIntegration_Parameters_OverridesReachTheTransforms
          - FeatureCatalog_Visit_LaterPhaseTransformsConditionsAndSelectionsStayReported

      - id: CanvasNetVegaLite-RowTransforms
        title: >-
          The library shall apply the row transforms calculate, filter (an expression, or the predicates
          equal, lt, lte, gt, gte, range, oneOf, and valid composed with and, or, and not), fold, flatten,
          sample, pivot (sum and count), and lookup of the drawn view, together with the transforms
          aggregate, joinaggregate, window, bin, stack, and impute, in their written order to the loaded
          data before any scale is resolved, shall order a category by an aggregate of the transformed
          rows, and shall load the secondary source of a lookup through the same sandbox and budget as the
          main data, so that the chart draws the transformed rows.
        tags: [system]
        justification: |
          Charts rarely draw their data as it is stored; the supported transforms reshape and select it,
          and the later stages must see only the result.
        children:
          - CanvasNetVegaLite-Transforms-Pipeline
          - CanvasNetVegaLite-Transforms-RowOperations
          - CanvasNetVegaLite-Transforms-Reshaping
          - CanvasNetVegaLite-Transforms-Lookup
          - CanvasNetVegaLite-Transforms-Sampling
          - CanvasNetVegaLite-Data-LookupSources
          - CanvasNetVegaLite-Scales-Domains
          - CanvasNetVegaLite-VegaLiteDocument-TransformPipeline
        tests:
          - CanvasNetVegaLite_SystemIntegration_Transforms_FilterAndCalculateSelectTheDrawnDots
          - CanvasNetVegaLite_SystemIntegration_Transforms_FoldAndFlattenReshapeTheRows
          - CanvasNetVegaLite_SystemIntegration_Transforms_PivotAndLookupBuildTheScaledFields
          - CanvasNetVegaLite_SystemIntegration_Transforms_SampleAndSortAreDeterministic
          - CanvasNetVegaLite_SystemIntegration_Window_CumulativeTotalsAreBars

      - id: CanvasNetVegaLite-Aggregation
        title: >-
          The library shall draw a chart whose encoding aggregates a field (a sum, a count of records, a
          mean, or any other aggregate operation of Vega-Lite) or whose aggregate transform summarizes the
          rows, with one mark per group in first-seen order, the axes titled with the default title of the
          aggregate (such as Sum of x or Count of Records), without reporting the aggregate as unsupported.
        tags: [system]
        justification: |
          Most charts draw a summary of their data; an aggregate must therefore be computed, drawn, and
          titled as Vega-Lite does.
        children:
          - CanvasNetVegaLite-Transforms-Aggregation
          - CanvasNetVegaLite-Transforms-EncodingPipeline
          - CanvasNetVegaLite-Guides-AggregateTitles
          - CanvasNetVegaLite-SpecModel-AggregationValidation
        tests:
          - CanvasNetVegaLite_SystemIntegration_Aggregation_SumBarsHaveHandDerivedGeometryAndTitles
          - CanvasNetVegaLite_SystemIntegration_Aggregation_OnlyTheUnsupportedPartIsReported

      - id: CanvasNetVegaLite-Binning
        title: >-
          The library shall draw a histogram - a chart whose x or y channel bins a quantitative field - with
          the bins of the Vega bin algorithm, one bar per bin that fills its bin less the bar spacing, an axis
          that covers the bins with a default title, and a count or another aggregate per bin, and shall draw
          already binned data (a start and an end field) as bars over their ranges.
        tags: [system]
        justification: |
          A histogram is the standard picture of a distribution; its bins and bars must be those of
          Vega-Lite for the chart to read the same.
        children:
          - CanvasNetVegaLite-Transforms-Binning
          - CanvasNetVegaLite-Scales-BinnedDomains
          - CanvasNetVegaLite-Marks-BinnedBars
          - CanvasNetVegaLite-Marks-RangedMarks
          - CanvasNetVegaLite-Guides-BinnedAxes
        tests:
          - CanvasNetVegaLite_SystemIntegration_Binning_HistogramCountsEveryBin
          - CanvasNetVegaLite_SystemIntegration_Binning_HistogramBarsFillTheirBinsLessOnePixel
          - CanvasNetVegaLite_SystemIntegration_PreBinned_RangesAreBarsOverTheirRanges

      - id: CanvasNetVegaLite-Stacking
        title: >-
          The library shall draw a bar chart whose measure has several rows in a category as a stacked bar
          chart - each layer from its stack start to its stack end, ordered by the order channel or the
          layer fields, with the offsets zero, center, and normalize - with an axis that reaches the total of
          the stack, and shall leave a chart with one row per category exactly as it was drawn before stacking.
        tags: [system]
        justification: |
          A bar chart with a color is a stacked bar chart in Vega-Lite; the layers must not overlap or hide
          each other, and the charts that stack nothing must not change.
        children:
          - CanvasNetVegaLite-Transforms-Stacking
          - CanvasNetVegaLite-Scales-StackedDomains
          - CanvasNetVegaLite-Marks-StackedMarks
        tests:
          - CanvasNetVegaLite_SystemIntegration_Stacking_LayersAreStackedAndTheAxisReachesTheTotal
          - CanvasNetVegaLite_SystemIntegration_Stacking_LayersAreDrawnBetweenTheirStackBounds

      - id: CanvasNetVegaLite-SignedStacking
        title: >-
          The library shall draw a stack with negative values on both sides of the zero baseline - the
          positive layers stacking up (right) from zero and the negative layers down (left) from zero,
          separately, with an axis that reaches both ends - for a vertical and a horizontal bar chart, and
          shall give an area mark the same stack decision and rows.
        tags: [system]
        justification: |
          Charts of takings and outgoings, gains and losses, and signed differences are common; a negative
          layer must hang below zero and never overlap the positive layers.
        children:
          - CanvasNetVegaLite-Transforms-Stacking
          - CanvasNetVegaLite-Scales-StackedDomains
          - CanvasNetVegaLite-Marks-StackedMarks
        tests:
          - CanvasNetVegaLite_SystemIntegration_Stacking_SignedLayersAreDrawnOnBothSidesOfZero

      - id: CanvasNetVegaLite-GroupedTransforms
        title: >-
          The library shall draw the result of the transforms joinaggregate, window, and impute - group
          statistics on every row, running totals, ranks, moving averages, and filled gaps - exactly as the
          values that the transform computed, in the order of the input rows.
        tags: [system]
        justification: |
          Running totals and ranks are the standard way to chart a series against its own history; they must
          be computed and drawn as Vega-Lite does.
        children:
          - CanvasNetVegaLite-Transforms-GroupedTransforms
        tests:
          - CanvasNetVegaLite_SystemIntegration_Window_CumulativeTotalsAreBars

      - id: CanvasNetVegaLite-SortByAggregate
        title: >-
          The library shall order the categories of a discrete axis by an aggregate of a field (a sort object
          with an op, the shorthand of another channel, or the encoding of another channel), in ascending or
          descending order, keeping equal categories in first-seen order, and shall report only the sort forms
          that it does not compute.
        tags: [system]
        justification: |
          Ordering a bar chart by its value is the most common reason to sort a category axis.
        children:
          - CanvasNetVegaLite-Scales-SortByAggregate
        tests:
          - CanvasNetVegaLite_SystemIntegration_Transforms_SampleAndSortAreDeterministic
          - CanvasNetVegaLite_SystemIntegration_SortByAggregate_VerticalBarsFollowTheYShorthand
          - CanvasNetVegaLite_SystemIntegration_SortByAggregate_HorizontalBarsFollowTheXShorthand
          - CanvasNetVegaLite_SystemIntegration_SortByAggregate_ASortObjectOrdersBySumInBothDirections

      - id: CanvasNetVegaLite-SortValidation
        title: >-
          The library shall reject a sort array that holds an object or an array (other than a date-time of a
          temporal field) with a specification error located at the item, shall warn once, at the array, about a
          sort array that mixes kinds of values and about a sort that a continuous scale ignores, shall warn
          about a key a sort object does not define, shall report a sort by a channel the encoding does not have
          with a message that names the channel, and shall bound and cancel the reading of a sort array - and
          none of them shall crash the renderer or silently mis-sort a chart.
        tags: [system]
        justification: |
          A malformed sort is a mistake of the specification author; it must be reported where it is and must
          never be read as a different, plausible sort.
        children:
          - CanvasNetVegaLite-SpecModel-AggregationValidation
          - CanvasNetVegaLite-SpecModel-FeatureReporting
          - CanvasNetVegaLite-Scales-SortByAggregate
        tests:
          - CanvasNetVegaLite_SystemIntegration_Sort_MalformedSortReportsLocatedDiagnosticsAndNeverCrashes

      - id: CanvasNetVegaLite-TransformLimits
        title: >-
          The library shall bound the rows, fields, cells, string lengths, and evaluation steps that
          transforms and expressions create, counting the rows of a derived table and of a lookup source in
          the same budget as the loaded rows and reserving them before they are allocated, shall keep the
          data sandbox in force for a lookup source, shall fail closed with a located
          VegaLiteRenderException when a limit is exceeded, and shall observe the cancellation token between
          transforms and at least every 1,024 rows.
        tags: [system, security]
        justification: |
          Transforms can multiply the data of a chart; untrusted specifications must not be able to exhaust
          memory or time, and callers must be able to abandon the work.
        children:
          - CanvasNetVegaLite-Transforms-Limits
        tests:
          - CanvasNetVegaLite_SystemIntegration_Transforms_LimitsSandboxAndCancellationFailClosed

      - id: CanvasNetVegaLite-AggregationLimits
        title: >-
          The library shall bound what the aggregate, joinaggregate, window, bin, stack, and impute
          transforms and the aggregate, bin, and stack of an encoding create and compute - the groups and
          appended rows (counted in the shared row budget before they are allocated), the fields, the
          cells and values they keep, the bins, the sorts, the frames, and the bootstrap resamples (charged to
          the evaluation-step budget) - shall fail closed with a located VegaLiteRenderException when a limit is
          exceeded, and shall observe the cancellation token while it groups, sorts, and stacks.
        tags: [system, security]
        justification: |
          Grouping, windowing, and imputing can multiply or retain the data of a chart; untrusted
          specifications must not be able to exhaust memory or time, and callers must be able to abandon the
          work.
        children:
          - CanvasNetVegaLite-Transforms-AggregateTransforms-Limits
          - CanvasNetVegaLite-Transforms-AggregateTransforms-Cancellation
          - CanvasNetVegaLite-Transforms-EncodingPlan-Limits
          - CanvasNetVegaLite-Transforms-EncodingPlan-Cancellation
        tests:
          - CanvasNetVegaLite_SystemIntegration_Aggregation_LimitsAndCancellationApply
          - CanvasNetVegaLite_SystemIntegration_BinnedAndStacked_SceneBudgetAndDeterminismApply

      - id: CanvasNetVegaLite-TransformDeterminism
        title: >-
          The library shall give the same transformed rows, the same sampled rows, the same stable category
          order, and the same image for the same specification and options on every platform, in every
          culture and time zone, and for repeated and concurrent measure and render calls, with a measure
          that matches the render that follows and no dependence on a clock or a random source.
        tags: [system]
        justification: |
          Reproducibility is required for golden tests, caching, and trustworthy results; a sample or a sort
          that varied between runs would make that impossible.
        children:
          - CanvasNetVegaLite-Transforms-Determinism
          - CanvasNetVegaLite-Expressions-Determinism
        tests:
          - CanvasNetVegaLite_SystemIntegration_Transforms_MeasureMatchesRenderAndRendersAreByteIdentical
          - CanvasNetVegaLite_SystemIntegration_Transforms_SampleAndSortAreDeterministic

      - id: CanvasNetVegaLite-AggregationDeterminism
        title: >-
          The library shall give the same groups in the same first-seen order, the same statistics (the
          confidence intervals of a deterministic bootstrap included), the same bins, the same stacks, and the
          same image for the same specification and options on every platform, in every culture, and for
          repeated and concurrent measure and render calls, with a measure that matches the render that
          follows and no dependence on a clock or a random source.
        tags: [system]
        justification: |
          Reproducibility is required for golden tests and caching; a group order, a bin label, or an interval
          that varied between runs or cultures would make that impossible.
        children:
          - CanvasNetVegaLite-Transforms-AggregateTransforms-Determinism
          - CanvasNetVegaLite-Transforms-EncodingPlan-Determinism
        tests:
          - CanvasNetVegaLite_SystemIntegration_Aggregation_MeasureMatchesRenderAndRendersAreByteIdentical
          - CanvasNetVegaLite_SystemIntegration_BinnedAndStacked_SceneBudgetAndDeterminismApply

      - id: CanvasNetVegaLite-ExpressionDiagnostics
        title: >-
          The library shall fail closed when a specification is opened with a VegaLiteSpecException located
          at the offending value and naming the offset inside the expression for an expression syntax error,
          an undeclared parameter reference, an invalid or cyclic parameter, or a malformed transform; shall
          report as unsupported features, with the stable identifiers vl-expr-function-name (the name lower-cased),
          vl-expr-view-state, and vl-expr-construct-name, the expression constructs that it cannot run;
          shall keep reporting the transforms, parameters, conditional encodings, and functions of later
          phases; and shall let strict mode abort at the first such report.
        tags: [system]
        justification: |
          A mistake must be found with its location, and a construct that is not executed must be named so
          that a chart is never approximated silently.
        children:
          - CanvasNetVegaLite-Expressions-Locations
          - CanvasNetVegaLite-SpecModel-ExpressionValidation
          - CanvasNetVegaLite-VegaLiteDocument-ExpressionErrors
        tests:
          - CanvasNetVegaLite_SystemIntegration_Expressions_ErrorsAndLimitsFailWhenTheDocumentIsOpened
          - CanvasNetVegaLite_SystemIntegration_Parameters_InvalidDefinitionsFailWhenTheDocumentIsOpened
          - CanvasNetVegaLite_SystemIntegration_Diagnostics_ExpressionReportsAndStrictMode
          - CanvasNetVegaLite_SystemIntegration_Deferred_FeaturesAreStillReported
