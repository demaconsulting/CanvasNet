---
# Software System Requirements for CanvasNetPdf
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.Pdf
# package (namespace DemaConsulting.CanvasNet.Pdf) from the perspective of its consumers, without
# specifying implementation details.
#
# CanvasNetPdf is an independent software system, distributed as its own NuGet package, depending
# on the core CanvasNet system (docs/reqstream/canvas-net.yaml) for its Canvas.Surface pixel
# buffer and Codecs.UnsupportedImageFeatureException type - see docs/design/canvas-net-pdf.md's
# Dependencies section for details.
#
# CanvasNetPdf parses a PDF document's structure (cross-references in all supported forms,
# trailer, page tree with inheritance) and reports page count/size/rotation, then renders each
# page's content stream end to end: path construction/painting, device color, image XObjects,
# embedded-TrueType text (with Standard-14/system-font fallback substitution when no font is
# embedded), and a stream-filter set (FlateDecode/LZWDecode/ASCII85Decode/ASCIIHexDecode/
# RunLengthDecode) - see docs/design/canvas-net-pdf.md for the full current feature set and its
# documented, still-unsupported-feature boundary.
#
# cspell:ignore xref startxref devicergb Zapf subsetted

sections:
  - title: CanvasNetPdf Requirements
    requirements:
      - id: CanvasNetPdf-Open
        title: >-
          The library shall parse a well-formed PDF document exactly once, from either a stream or
          a file path, resolving its cross-reference data (classic table, cross-reference stream,
          object stream, and hybrid combinations of these, falling back to a linear scan of the
          document when normal cross-reference parsing fails or does not resolve to a valid
          catalog) and reject a null stream/path, an empty or whitespace-only path, or malformed
          document structure per the documented exception contract.
        tags: [system]
        justification: |
          Callers need a single, reliable entry point that turns raw PDF bytes into a usable,
          in-memory document regardless of which cross-reference form a given producer used, and
          must be able to distinguish a programming error (null/empty argument) from malformed
          input (corrupt document structure).
        children:
          - CanvasNetPdf-PdfDocument-Open
          - CanvasNetPdf-PdfDocument-Tokenizer
          - CanvasNetPdf-PdfDocument-ObjectModel
          - CanvasNetPdf-PdfDocument-ClassicXref
          - CanvasNetPdf-PdfDocument-XrefStream
          - CanvasNetPdf-PdfDocument-ObjectStream
          - CanvasNetPdf-PdfDocument-HybridXref
          - CanvasNetPdf-PdfDocument-LinearScanFallback
          - CanvasNetPdf-PdfDocument-PageTreeCycleRejection
        tests:
          - CanvasNetPdf_SystemIntegration_PdfOpen_ReturnsExpectedPageCount
          - CanvasNetPdf_SystemIntegration_PdfValidationNull_NullStreamThrowsArgumentNullException
          - CanvasNetPdf_SystemIntegration_PdfValidationEmptyPath_EmptyPathThrowsArgumentException

      - id: CanvasNetPdf-PageCount
        title: >-
          The library shall report the document's true resolved page count after traversing its
          page tree (including nested Kids arrays), regardless of which cross-reference form was
          used to locate the underlying objects.
        tags: [system]
        justification: |
          Callers need to know how many pages a document has before deciding which pages to
          inspect or render.
        children:
          - CanvasNetPdf-PdfDocument-PageTreeTraversal
        tests:
          - CanvasNetPdf_SystemIntegration_PdfOpen_ReturnsExpectedPageCount

      - id: CanvasNetPdf-GetPageInfo
        title: >-
          The library shall report each page's own display (rotation-adjusted) width and height
          plus its normalized effective rotation, inheriting an undeclared MediaBox/Rotate from
          the nearest ancestor that declares one, and shall reject an out-of-range page index with
          ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          Callers need each page's actual displayed dimensions (already accounting for rotation)
          to size a render target correctly, without independently re-implementing PDF's
          MediaBox/Rotate inheritance and rotation-swap rules themselves.
        children:
          - CanvasNetPdf-PdfDocument-GetPageInfo
          - CanvasNetPdf-PdfDocument-PageTreeInheritance
        tests:
          - CanvasNetPdf_SystemIntegration_PdfGetPageInfo_ReportsRotatedDimensions
          - CanvasNetPdf_SystemIntegration_PdfGetPageInfoValidation_OutOfRangePageIndexThrowsArgumentOutOfRangeException

      - id: CanvasNetPdf-Render
        title: >-
          The library shall return a correctly width x height-sized Surface for a valid page
          index, propagating Surface's own dimension contract unwrapped, and shall rasterize the
          page's own content stream (path geometry, device color, image XObjects, and text) onto
          that Surface, rejecting a lexically malformed content stream (an operator given the
          wrong operand count, or issued out of its required sequence) with InvalidDataException
          rather than silently mis-rendering it.
        tags: [system]
        justification: |
          Callers need a Surface-shaped render target sized to their own request (not derived from
          the page's MediaBox) that actually reflects the page's real visual content, and must be
          able to distinguish a genuinely malformed content stream from a well-formed one that
          simply renders as expected.
        children:
          - CanvasNetPdf-PdfDocument-Render
        tests:
          - CanvasNetPdf_SystemIntegration_PdfRender_ReturnsBlankSizedSurface
          - CanvasNetPdf_SystemIntegration_PdfUnsupportedFormatValidation_MalformedContentStreamThrowsInvalidDataException

      - id: CanvasNetPdf-Dispose
        title: >-
          The library shall make Dispose idempotent (safe to call more than once) and shall throw
          ObjectDisposedException from every other public member once the document has been
          disposed.
        tags: [system]
        justification: |
          Callers need standard, predictable IDisposable behavior - matching every other
          disposable type in CanvasNet - so that double-disposing (a common pattern with using
          declarations and manual disposal both present) never throws.
        children:
          - CanvasNetPdf-PdfDocument-Dispose
          - CanvasNetPdf-PdfDocument-ObjectDisposedException
        tests:
          - CanvasNetPdf_SystemIntegration_PdfDispose_ObjectDisposedExceptionAfterDispose

      - id: CanvasNetPdf-EncryptDetection
        title: >-
          The library shall detect an encrypted document (an /Encrypt key present in the trailer)
          and reject it with UnsupportedImageFeatureException rather than silently mis-parsing its
          (still-encrypted) bytes as plaintext content.
        tags: [system]
        justification: |
          Decrypting a PDF is out of scope for this library; silently treating encrypted bytes as
          plaintext would produce garbage results indistinguishable from a real (but malformed)
          document, so callers need a clear, well-formed-but-unsupported signal instead.
        children:
          - CanvasNetPdf-PdfDocument-EncryptDetection
        tests:
          - CanvasNetPdf_SystemIntegration_PdfEncryptDetection_EncryptedTrailerThrowsUnsupportedImageFeatureException

      - id: CanvasNetPdf-ContentStreamInterpreter
        title: >-
          The library shall dispatch every recognized content-stream operator through a single
          interpreter loop that maintains a graphics-state stack (q/Q), derives the current
          transformation matrix from the page's base CTM composed with any cm operators and the
          page's effective rotation, resolves a page's /Contents (whether a single stream or an
          array of streams concatenated with an intervening space), and constructs/paints path
          geometry via the path-construction and path-painting operators.
        tags: [system]
        justification: |
          Callers need a page's real drawn geometry to end up in the correct final device-pixel
          position regardless of how many nested q/Q save/restore pairs, cm transforms, or /Rotate
          value the page declares, and regardless of whether its content is one stream or several.
        children:
          - CanvasNetPdf-PdfDocument-ContentStreamDispatch
          - CanvasNetPdf-PdfDocument-ContentsResolution
          - CanvasNetPdf-PdfDocument-GraphicsStateStack
          - CanvasNetPdf-PdfDocument-CtmDerivation
          - CanvasNetPdf-PdfDocument-PathConstruction
          - CanvasNetPdf-PdfDocument-PathPainting
        tests:
          - CanvasNetPdf_SystemIntegration_PdfRender_FilledRectangleAndStrokedLine_PaintsExpectedPixels
          - CanvasNetPdf_SystemIntegration_PdfRender_RotatedPage_MapsGeometryToCorrectPixelPosition

      - id: CanvasNetPdf-DeviceColor
        title: >-
          The library shall support setting the current fill/stroke color via the device color
          operators (rg/g/k and their cs/scn color-space-selecting equivalents) and apply that
          color to every subsequently painted path until the next color-setting operator or a
          graphics-state restore (Q); it shall also resolve (but not yet consume at rendering
          time) a /FunctionType 0 sampled function, in preparation for a future shading-pattern-
          fill feature.
        tags: [system]
        justification: |
          Callers need paths to render in their document-specified color, not merely as an
          opaque-black silhouette, for the rendered output to be visually faithful to the source
          document. Resolving a /FunctionType 0 sampled function as unconsumed groundwork unblocks
          a future axial/radial shading-pattern-fill feature without re-deriving sampled-function
          evaluation later.
        children:
          - CanvasNetPdf-PdfDocument-DeviceColorOperators
          - CanvasNetPdf-PdfDocument-ColorSpaceOperators
          - CanvasNetPdf-PdfDocument-FunctionType0
        tests:
          - CanvasNetPdf_SystemIntegration_PdfRender_ColoredRectangleFill_PaintsExpectedRgbPixels

      - id: CanvasNetPdf-StreamFilters
        title: >-
          The library shall decode a stream (content stream or image XObject) through its declared
          /Filter chain, supporting FlateDecode, LZWDecode, ASCII85Decode, ASCIIHexDecode, and
          RunLengthDecode (individually or composed), before interpreting the decoded bytes.
        tags: [system]
        justification: |
          Real-world PDF producers routinely compress or ASCII-armor stream data with any of these
          filters; callers need the library to transparently decode whichever filter(s) a given
          producer chose, rather than requiring uncompressed input.
        children:
          - CanvasNetPdf-PdfDocument-FilterPipeline
          - CanvasNetPdf-PdfDocument-LzwDecodeFilter
          - CanvasNetPdf-PdfDocument-AsciiDecodeFilters
          - CanvasNetPdf-PdfDocument-RunLengthDecodeFilter
        tests:
          - CanvasNetPdf_SystemIntegration_PdfRender_LzwDecodeContentStream_PaintsExpectedPixels
          - CanvasNetPdf_SystemIntegration_PdfRender_Ascii85DecodeContentStream_PaintsExpectedPixels
          - CanvasNetPdf_SystemIntegration_PdfRender_AsciiHexDecodeContentStream_PaintsExpectedPixels
          - CanvasNetPdf_SystemIntegration_PdfRender_RunLengthDecodeContentStream_PaintsExpectedPixels

      - id: CanvasNetPdf-ImageXObjects
        title: >-
          The library shall decode a /Subtype /Image XObject (DeviceRGB, filtered per its declared
          /Filter chain) and composite it into the current path/CTM-derived device-space footprint
          when placed via the Do operator, per the current graphics state's CTM.
        tags: [system]
        justification: |
          Callers need embedded raster images to actually appear in their document-correct
          position/size in the rendered output, not merely be silently skipped.
        children:
          - CanvasNetPdf-PdfDocument-ImageXObjects
        tests:
          - CanvasNetPdf_SystemIntegration_PdfRender_ImageXObjectPlacement_CompositesExpectedPixels

      - id: CanvasNetPdf-TextRendering
        title: >-
          The library shall render simple (single-byte-encoded) font text: resolving a page's
          referenced fonts (falling back to a matching system or bundled font when no
          /FontFile2-embedded font data is present, but never substituting a symbolic font such as
          Symbol/ZapfDingbats with an unrelated font), applying the font's encoding and advance
          widths (declared /Widths, or the font's own metrics when undeclared), maintaining
          per-text-object state (Tf/Tr/text-positioning operators), and painting each shown
          glyph's outline at its correctly positioned/scaled device location.
        tags: [system]
        justification: |
          Callers need a document's text content to actually appear as recognizable glyph shapes
          in their document-correct position, whether or not the document embeds its own font
          data, while still failing closed (rather than rendering visually wrong substitute
          glyphs) for symbolic fonts with no embedded font data.
        children:
          - CanvasNetPdf-PdfDocument-FontResolution
          - CanvasNetPdf-PdfDocument-FontFallback
          - CanvasNetPdf-PdfDocument-FontEncoding
          - CanvasNetPdf-PdfDocument-FontWidths
          - CanvasNetPdf-PdfDocument-TextObjectState
          - CanvasNetPdf-PdfDocument-TextStateOperators
          - CanvasNetPdf-PdfDocument-Tf
          - CanvasNetPdf-PdfDocument-Tr
          - CanvasNetPdf-PdfDocument-TextPositioning
          - CanvasNetPdf-PdfDocument-TextShowing
          - CanvasNetPdf-PdfDocument-TextErrorHandling
        tests:
          - CanvasNetPdf_SystemIntegration_PdfRender_EmbeddedTrueTypeFontText_PaintsGlyphStrokesNotCounters
          - CanvasNetPdf_SystemIntegration_RenderStandard14HelveticaWithoutEmbeddedFont_PaintsVisibleGlyphInk
          - CanvasNetPdf_SystemIntegration_RenderSymbolFontWithoutEmbeddedFont_ThrowsUnsupportedImageFeatureException

      - id: CanvasNetPdf-CompositeFontTextRendering
        title: >-
          The library shall render Type0/Identity-H composite-font (2-byte-encoded CID) text:
          resolving a page's referenced Type0/CIDFontType2 composite fonts (requiring an embedded
          /FontFile2 on the descendant font, with no fallback substitution path), mapping each
          decoded CID to a glyph index via the descendant font's /CIDToGIDMap, and applying the
          descendant font's declared /DW/W advance widths, then painting each shown glyph's
          outline at its correctly positioned/scaled device location; it shall also resolve (but
          not yet consume at rendering time) a composite font's optional /ToUnicode CMap as a
          code-to-Unicode-codepoint map.
        tags: [system]
        justification: |
          Type0/Identity-H/CIDFontType2 composite fonts are the encoding real-world PDF producers
          (Microsoft Word, LibreOffice, and browser print-to-PDF among them) overwhelmingly emit
          for embedded subsetted TrueType text, so callers need this document text to actually
          appear as recognizable glyph shapes in their document-correct position, not merely be
          rejected as an unsupported font subtype. Resolving /ToUnicode as unconsumed groundwork
          unblocks a future text-extraction feature without re-deriving CMap-parsing primitives.
        children:
          - CanvasNetPdf-PdfDocument-CompositeFontResolution
          - CanvasNetPdf-PdfDocument-ToUnicodeCMap
        tests:
          - CanvasNetPdf_SystemIntegration_RenderType0CompositeFont_PaintsExpectedGlyphInk
