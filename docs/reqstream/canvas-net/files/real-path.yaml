---
# Software Unit Requirements for RealPath
#
# These requirements describe the design-level behavior of the RealPath unit of the Files subsystem (namespace
# DemaConsulting.CanvasNet.Files, internal): the per-operating-system open of a file and the facts of an open
# handle (whether it is a regular file, and its real path), the real location of a folder, and the path comparison
# rules shared by the resolvers and the policies. Scenarios that exist on one operating system only are linked
# with a source filter, so that only test runs on that system count as evidence. Each "tests" entry cites a test
# method in the DemaConsulting.CanvasNet.Tests project; see docs/verification/canvas-net/files/real-path.md.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Files Requirements
        sections:
          - title: RealPath Requirements
            requirements:
              - id: CanvasNet-Files-RealPath-FinalPath
                title: >-
                  The RealPath unit shall report, for an open file on Windows, Linux and macOS, the real path of the
                  file the handle refers to: the full path with symbolic links, junctions and (on Windows) short
                  names resolved, and (on macOS) the real location of linked system folders.
                justification: |
                  A race-free decision needs the real path of the open file, which .NET does not provide; every
                  supported operating system must supply it.
                tests:
                  - "windows@RealPath_Inspect_PlainFile_ReportsItsCanonicalPathAndARegularFile"
                  - "ubuntu@RealPath_Inspect_PlainFile_ReportsItsCanonicalPathAndARegularFile"
                  - "macos@RealPath_Inspect_PlainFile_ReportsItsCanonicalPathAndARegularFile"
                  - "windows@RealPath_Inspect_FileThroughADirectoryLink_ReportsTheTarget"
                  - "ubuntu@RealPath_Inspect_FileThroughADirectoryLink_ReportsTheTarget"
                  - "macos@RealPath_Inspect_FileThroughADirectoryLink_ReportsTheTarget"
                  - "windows@RealPath_Inspect_ShortNameSpelling_IsExpanded"
                  - "macos@RealPath_Inspect_TempFileOnMacOS_ReportsThePrivateLocation"

              - id: CanvasNet-Files-RealPath-Unavailable
                title: >-
                  The RealPath unit shall report no real path, rather than a wrong one, when the operating system
                  cannot tell it, including for a file deleted after it was opened on Linux, which it shall detect
                  from the open file rather than from its name.
                justification: |
                  A caller that needs the real path must be able to fail closed; a stale or invented path would
                  allow the wrong file. A live file may carry the text Linux appends to a deleted file in its own
                  name, so the name cannot tell deletion.
                tests:
                  - "ubuntu@RealPath_Inspect_DeletedFile_IsUnavailable"
                  - "windows@RealPath_Inspect_LiveFileNamedLikeADeletedOne_ReportsItsRealPath"
                  - "ubuntu@RealPath_Inspect_LiveFileNamedLikeADeletedOne_ReportsItsRealPath"
                  - "macos@RealPath_Inspect_LiveFileNamedLikeADeletedOne_ReportsItsRealPath"

              - id: CanvasNet-Files-RealPath-RegularFile
                title: >-
                  The RealPath unit shall report whether an open handle is a regular file, reporting a device and (on
                  Linux and macOS) a directory as not a regular file, while on Windows a directory cannot be opened
                  as a file at all.
                justification: |
                  The resolvers refuse anything that is not a regular file, which needs the type of the open handle
                  rather than of the name.
                tests:
                  - "windows@RealPath_Inspect_DirectoryAndDevice_AreNotRegularFiles"
                  - "ubuntu@RealPath_Inspect_DirectoryAndDevice_AreNotRegularFiles"
                  - "macos@RealPath_Inspect_DirectoryAndDevice_AreNotRegularFiles"

              - id: CanvasNet-Files-RealPath-NonBlockingOpen
                title: >-
                  The RealPath unit shall open a file for reading without blocking on Linux and macOS, so that a
                  named pipe without a writer returns at once, and shall report a missing file or folder with the
                  framework's "not found" exceptions.
                justification: |
                  A named pipe reached by a reference must not hang the reader, and callers tell a missing file from
                  an unreadable one by exception type.
                tests:
                  - "ubuntu@RealPath_OpenForRead_Fifo_DoesNotBlockAndIsNotRegular"
                  - "macos@RealPath_OpenForRead_Fifo_DoesNotBlockAndIsNotRegular"
                  - RealPath_OpenForRead_MissingFileAndMissingFolder_MapToNotFoundExceptions

              - id: CanvasNet-Files-RealPath-CanonicalDirectory
                title: >-
                  The RealPath unit shall report the real location of an existing folder (a linked folder reports its
                  target), including a folder the process may search but not read, and no location for a missing
                  folder.
                justification: |
                  Roots and anchors chosen by the host are compared with real paths, so they must be compared in their
                  real location too.
                tests:
                  - "windows@RealPath_TryGetCanonicalDirectory_LinkedDirectory_ReturnsTheTarget"
                  - "ubuntu@RealPath_TryGetCanonicalDirectory_LinkedDirectory_ReturnsTheTarget"
                  - "macos@RealPath_TryGetCanonicalDirectory_LinkedDirectory_ReturnsTheTarget"
                  - "ubuntu@RealPath_TryGetCanonicalDirectory_ExecuteOnlyDirectory_ReturnsItsLocation"
                  - "macos@RealPath_TryGetCanonicalDirectory_ExecuteOnlyDirectory_ReturnsItsLocation"

              - id: CanvasNet-Files-RealPath-NetworkLocation
                title: >-
                  On Windows the RealPath unit shall classify a full path as a network location when it is a UNC path
                  (also \\?\UNC\) or lies on a mapped network drive (also as an extended-length drive path), and any
                  other device path or a local drive as not.
                justification: |
                  The reference resolver refuses a local path whose opened file lies on a share, which needs both the
                  written and the real path classified the same way.
                tests:
                  - "windows@RealPath_IsNetworkLocation_UncAndLocalPaths_AreClassified"

              - id: CanvasNet-Files-RealPath-Comparison
                title: >-
                  The RealPath unit shall compare real paths exactly, letter case included, on every platform (on
                  macOS in the composed Unicode form), treating a folder as containing itself and what lies below its
                  separator but not a sibling that shares its name as a prefix and not a folder that differs only in
                  letter case, ignoring a trailing separator; shall compare paths as written under the platform's
                  rule (case-insensitive on Windows and macOS, exact elsewhere) for the written-path pre-check only;
                  and shall find the deepest folder two paths share by whole components compared exactly, with only
                  their roots compared under the platform's rule.
                justification: |
                  Every containment decision of the policies rests on these rules; a prefix match on text would let a
                  sibling folder pass. A folder may be case-sensitive even on Windows (per-directory case
                  sensitivity) and macOS (case-sensitive APFS), where two names that differ only in letter case are
                  two folders, so a case-insensitive comparison of real paths would treat a folder outside an allowed
                  root as inside it, and would trust a case-variant folder as the anchor of the no-symlinks rule.
                tests:
                  - RealPath_IsUnder_BoundaryIsTheSeparator
                  - RealPath_IsUnder_ComparesLetterCaseExactly
                  - RealPath_CommonAncestor_ComparesComponentsExactly

              - id: CanvasNet-Files-RealPath-ExactCase
                title: >-
                  The RealPath unit shall give a full path in the letter case its folders and its name have on disk:
                  each existing component in the spelling of the folder entry spelled exactly as written, else of the
                  single entry that matches it ignoring letter case, else as written (no entry, or several); the part
                  below a missing folder and a component of a folder that cannot be listed as written; a wildcard
                  character matching only itself; a drive letter in upper case and any other root unchanged; and
                  shall give the real location of a folder in that letter case.
                justification: |
                  Real paths are compared exactly, so a real path and the real location of a root must both be in
                  the spelling stored on disk; otherwise a root or a reference written in another letter case on a
                  case-insensitive volume, or a file system that reports the spelling used to open a file, would deny
                  files that are inside. Where the spelling is ambiguous it is kept as written, which can only deny.
                tests:
                  - RealPath_GetExactPathName_FolderAndFileInAnotherCase_GiveTheStoredCase
                  - RealPath_GetExactPathName_MissingTail_IsKeptAsWritten
                  - "ubuntu@RealPath_GetExactPathName_BothCaseVariantsExist_PrefersTheExactNameAndKeepsAnAmbiguousOne"
                  - "ubuntu@RealPath_GetExactPathName_WildcardCharactersInAName_MatchOnlyThatName"
                  - "macos@RealPath_GetExactPathName_WildcardCharactersInAName_MatchOnlyThatName"
                  - "windows@RealPath_GetExactPathName_DriveLetter_IsUpperCase"
                  - RealPath_ExactRoot_DriveRootsUpperCasedAndOtherRootsKept
                  - "windows@RealPath_TryGetExactCanonicalDirectory_FolderWrittenInAnotherCase_GivesTheStoredCase"
                  - "macos@RealPath_TryGetExactCanonicalDirectory_FolderWrittenInAnotherCase_GivesTheStoredCase"

              - id: CanvasNet-Files-RealPath-Identity
                title: >-
                  The RealPath unit shall confirm the on-disk spelling of the real path of an open file only when it
                  equals the reported real path or names the same file as the open handle (on Windows the 64-bit
                  volume serial number and 128-bit file identifier when both volumes report them, else the 32-bit
                  volume serial number and 64-bit file index of both, always compared like with like; the device and
                  inode on Linux and macOS) through no link (no link at its
                  last component, and no junction or link in one of its folders: on Windows and Linux the final path of
                  the file opened by that spelling is the spelling itself, on macOS it is opened with O_NOFOLLOW_ANY),
                  and shall report it unconfirmed when it names another file, a link, a file reached through a linked
                  folder, or a file whose identity cannot be read.
                justification: |
                  The on-disk spelling is found by name, after the open; another process could make it name another
                  file, or reach the open file through a linked folder from a place it is not. Confirming it against
                  the open handle, through no link, keeps the decision about the place of the file that is read, and an
                  unconfirmed spelling lets the caller fail closed. On ReFS the 64-bit file index does not name one
                  file, so the 128-bit identifier is compared where it is reported.
                tests:
                  - "windows@RealPath_TryConfirmExactPath_SpellingOfAnotherFile_IsUnconfirmed"
                  - "ubuntu@RealPath_TryConfirmExactPath_SpellingOfAnotherFile_IsUnconfirmed"
                  - "macos@RealPath_TryConfirmExactPath_SpellingOfAnotherFile_IsUnconfirmed"
                  - "windows@RealPath_TryConfirmExactPath_StoredSpellingOfARealPathInAnotherCase_IsConfirmed"
                  - "macos@RealPath_TryConfirmExactPath_StoredSpellingOfARealPathInAnotherCase_IsConfirmed"
                  - "windows@RealPath_TryConfirmExactPath_SpellingThroughALinkedFolder_IsUnconfirmed"
                  - "ubuntu@RealPath_TryConfirmExactPath_SpellingThroughALinkedFolder_IsUnconfirmed"
                  - "macos@RealPath_TryConfirmExactPath_SpellingThroughALinkedFolder_IsUnconfirmed"
                  - "ubuntu@RealPath_TryConfirmExactPath_LinkToTheOpenedFile_IsUnconfirmed"
                  - "macos@RealPath_TryConfirmExactPath_LinkToTheOpenedFile_IsUnconfirmed"
                  - "windows@RealPath_TryConfirmExactPath_WindowsFileSymbolicLink_IsUnconfirmedOrCapabilitySkipped"
                  - RealPath_WindowsFileId_IdsDifferingOnlyInTheHigh64Bits_AreDifferent
                  - RealPath_WindowsFileId_ByHandleInformation_DecodesSerialAndIndex
