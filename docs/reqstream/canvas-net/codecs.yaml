---
# Software Subsystem Requirements for Codecs
#
# cspell:ignore rasterizing letterboxing renderable
#
# These requirements decompose the CanvasNet system's image format support into the Codecs
# subsystem's own responsibility: providing loaders and savers for BMP, PNG, TIFF, and JPEG,
# each converting to and from a DemaConsulting.CanvasNet.Canvas.Surface pixel buffer. Each requirement here
# links down to the codec unit requirements that implement it.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Codecs Requirements
        requirements:
          - id: CanvasNet-Codecs-BmpSave
            title: >-
              The Codecs subsystem shall save a Surface as an uncompressed 24-bit or 32-bit BMP file, to
              either a stream or a file path.
            justification: |
              Callers need to persist rendered or loaded pixel data in a widely supported, uncompressed
              image format for interchange with other tools.
            children:
              - CanvasNet-Codecs-BmpCodec-SaveLoad24Bit
              - CanvasNet-Codecs-BmpCodec-SaveLoad32Bit
              - CanvasNet-Codecs-BmpCodec-RowPadding
              - CanvasNet-Codecs-BmpCodec-BottomUpOrientation
              - CanvasNet-Codecs-BmpCodec-SaveToPath
            tests:
              - CanvasNet_SystemIntegration_BmpSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-BmpLoad
            title: >-
              The Codecs subsystem shall load a Surface from an uncompressed 24-bit or 32-bit BMP file,
              from either a stream or a file path.
            justification: |
              Callers need to import existing BMP images as pixel buffers for further processing or
              display.
            children:
              - CanvasNet-Codecs-BmpCodec-SaveLoad24Bit
              - CanvasNet-Codecs-BmpCodec-SaveLoad32Bit
              - CanvasNet-Codecs-BmpCodec-LoadFromPath
            tests:
              - CanvasNet_SystemIntegration_BmpSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-BmpValidationNull
            title: >-
              The Codecs subsystem shall reject null Surface, stream, or path arguments to BMP save and
              load operations with ArgumentNullException.
            justification: |
              Passing null to any BMP save or load operation is a programming error. Throwing
              ArgumentNullException immediately surfaces the mistake and prevents obscure failures deeper
              in the call stack.
            children:
              - CanvasNet-Codecs-BmpCodec-SaveNullCanvas
              - CanvasNet-Codecs-BmpCodec-SaveNullStream
              - CanvasNet-Codecs-BmpCodec-SaveNullPath
              - CanvasNet-Codecs-BmpCodec-LoadNullStream
              - CanvasNet-Codecs-BmpCodec-LoadNullPath
            tests:
              - BmpCodec_Save_NullCanvas_ThrowsArgumentNullException
              - BmpCodec_Save_NullStream_ThrowsArgumentNullException
              - BmpCodec_Save_NullPath_ThrowsArgumentNullException
              - BmpCodec_Load_NullStream_ThrowsArgumentNullException
              - BmpCodec_Load_NullPath_ThrowsArgumentNullException

          - id: CanvasNet-Codecs-BmpValidationEmptyPath
            title: >-
              The Codecs subsystem shall reject an empty path argument to BMP save and load operations
              with ArgumentException.
            justification: |
              Passing an empty path to any BMP save or load operation is a programming error. Throwing
              ArgumentException immediately surfaces the mistake and prevents an obscure file-system
              error.
            children:
              - CanvasNet-Codecs-BmpCodec-SaveEmptyPath
              - CanvasNet-Codecs-BmpCodec-LoadEmptyPath
            tests:
              - BmpCodec_Save_EmptyPath_ThrowsArgumentException
              - BmpCodec_Load_EmptyPath_ThrowsArgumentException

          - id: CanvasNet-Codecs-BmpValidationBitDepth
            title: >-
              The Codecs subsystem shall reject an undefined bit depth argument to BMP save with
              ArgumentOutOfRangeException.
            justification: |
              An undefined bit depth cannot be encoded to a valid BMP file; rejecting it immediately
              prevents a malformed file from being written.
            children:
              - CanvasNet-Codecs-BmpCodec-SaveInvalidBitDepth
            tests:
              - BmpCodec_Save_UndefinedBitDepth_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Codecs-BmpUnsupportedFormatValidation
            title: >-
              The Codecs subsystem shall reject malformed or unsupported BMP data (bad signature,
              unsupported header size, unsupported compression, unsupported bit depth, top-down
              orientation, dimensions exceeding Surface.MaxDimension, or a truncated stream) with
              InvalidDataException.
            justification: |
              Callers must be able to distinguish a genuinely malformed or unsupported BMP file from a
              successful load, and receive a clear, actionable error rather than incorrect pixel data.
            children:
              - CanvasNet-Codecs-BmpCodec-LoadBadSignature
              - CanvasNet-Codecs-BmpCodec-LoadUnsupportedHeaderSize
              - CanvasNet-Codecs-BmpCodec-LoadUnsupportedCompression
              - CanvasNet-Codecs-BmpCodec-LoadUnsupportedBitDepth
              - CanvasNet-Codecs-BmpCodec-LoadUnsupportedTopDown
              - CanvasNet-Codecs-BmpCodec-LoadExceedsMaxDimension
              - CanvasNet-Codecs-BmpCodec-LoadTruncatedStream
            tests:
              - BmpCodec_Load_BadSignature_ThrowsInvalidDataException
              - BmpCodec_Load_Bitmapcoreheader12Bytes_ThrowsInvalidDataException
              - BmpCodec_Load_UnsupportedHeaderSizeV4_ThrowsInvalidDataException
              - BmpCodec_Load_RleCompression_ThrowsInvalidDataException
              - BmpCodec_Load_8BitPaletteDepth_ThrowsInvalidDataException
              - BmpCodec_Load_TopDownNegativeHeight_ThrowsInvalidDataException
              - BmpCodec_Load_WidthExceedsMaxDimension_ThrowsInvalidDataException
              - BmpCodec_Load_HeightExceedsMaxDimension_ThrowsInvalidDataException
              - BmpCodec_Load_TruncatedStream_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-BmpGetInfo
            title: >-
              The Codecs subsystem shall report a BMP's width, height, channel count, and alpha
              presence via GetInfo, given a stream or a file path, without decoding pixel data and
              without enforcing Surface.MaxDimension.
            justification: |
              Callers need to inspect a BMP's declared dimensions and channel layout without paying
              the cost of decoding the full pixel buffer.
            children:
              - CanvasNet-Codecs-BmpCodec-GetInfo
            tests:
              - BmpCodec_GetInfo_24Bit_ReturnsExpectedInfoWithoutAlpha
              - BmpCodec_GetInfo_32Bit_ReturnsExpectedInfoWithAlpha
              - BmpCodec_GetInfo_NeverReadsPixelData
              - BmpCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows

          - id: CanvasNet-Codecs-BmpGetInfoValidation
            title: >-
              The Codecs subsystem shall reject invalid arguments or malformed BMP data passed to
              GetInfo with the same exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
              - CanvasNet-Codecs-BmpCodec-GetInfoValidation
            tests:
              - BmpCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - BmpCodec_GetInfo_NullPath_ThrowsArgumentNullException
              - BmpCodec_GetInfo_EmptyPath_ThrowsArgumentException
              - BmpCodec_GetInfo_BadSignature_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-PngSave
            title: >-
              The Codecs subsystem shall save a Surface as an 8-bit-per-channel Truecolor (RGB) or
              Truecolor-with-alpha (RGBA) PNG file, to either a stream or a file path.
            justification: |
              Callers need to persist rendered or loaded pixel data in the widely supported PNG format
              for interchange with other tools.
            children:
              - CanvasNet-Codecs-PngCodec-SaveLoadRgb
              - CanvasNet-Codecs-PngCodec-SaveLoadRgba
              - CanvasNet-Codecs-PngCodec-SaveToPath
            tests:
              - CanvasNet_SystemIntegration_PngSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-PngLoad
            title: >-
              The Codecs subsystem shall load a Surface from an 8-bit-per-channel Truecolor (RGB) or
              Truecolor-with-alpha (RGBA) PNG file, from either a stream or a file path.
            justification: |
              Callers need to import existing PNG images as pixel buffers for further processing or
              display.
            children:
              - CanvasNet-Codecs-PngCodec-SaveLoadRgb
              - CanvasNet-Codecs-PngCodec-SaveLoadRgba
              - CanvasNet-Codecs-PngCodec-MultiIdatChunks
              - CanvasNet-Codecs-PngCodec-FilterReconstruction
              - CanvasNet-Codecs-PngCodec-LoadFromPath
              - CanvasNet-Codecs-PngCodec-PngSuiteSupported
            tests:
              - CanvasNet_SystemIntegration_PngSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-PngValidationNull
            title: >-
              The Codecs subsystem shall reject null Surface, stream, or path arguments to PNG save and
              load operations with ArgumentNullException.
            justification: |
              Passing null to any PNG save or load operation is a programming error. Throwing
              ArgumentNullException immediately surfaces the mistake and prevents obscure failures deeper
              in the call stack.
            children:
              - CanvasNet-Codecs-PngCodec-SaveNullCanvas
              - CanvasNet-Codecs-PngCodec-SaveNullStream
              - CanvasNet-Codecs-PngCodec-SaveNullPath
              - CanvasNet-Codecs-PngCodec-LoadNullStream
              - CanvasNet-Codecs-PngCodec-LoadNullPath
            tests:
              - PngCodec_Save_NullCanvas_ThrowsArgumentNullException
              - PngCodec_Save_NullStream_ThrowsArgumentNullException
              - PngCodec_Save_NullPath_ThrowsArgumentNullException
              - PngCodec_Load_NullStream_ThrowsArgumentNullException
              - PngCodec_Load_NullPath_ThrowsArgumentNullException

          - id: CanvasNet-Codecs-PngValidationEmptyPath
            title: >-
              The Codecs subsystem shall reject an empty path argument to PNG save and load operations
              with ArgumentException.
            justification: |
              Passing an empty path to any PNG save or load operation is a programming error. Throwing
              ArgumentException immediately surfaces the mistake and prevents an obscure file-system
              error.
            children:
              - CanvasNet-Codecs-PngCodec-SaveEmptyPath
              - CanvasNet-Codecs-PngCodec-LoadEmptyPath
            tests:
              - PngCodec_Save_EmptyPath_ThrowsArgumentException
              - PngCodec_Load_EmptyPath_ThrowsArgumentException

          - id: CanvasNet-Codecs-PngValidationColorType
            title: >-
              The Codecs subsystem shall reject an undefined color type argument to PNG save with
              ArgumentOutOfRangeException.
            justification: |
              An undefined color type cannot be encoded to a valid PNG file; rejecting it immediately
              prevents a malformed file from being written.
            children:
              - CanvasNet-Codecs-PngCodec-SaveInvalidColorType
            tests:
              - PngCodec_Save_UndefinedColorType_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Codecs-PngUnsupportedFormatValidation
            title: >-
              The Codecs subsystem shall reject malformed or unsupported PNG data (bad signature,
              unsupported color type, unsupported bit depth, interlacing, dimensions exceeding
              Surface.MaxDimension, corrupt chunk CRC-32, corrupt Adler-32 checksum, a chunk preceding
              IHDR, or a truncated stream) with InvalidDataException.
            justification: |
              Callers must be able to distinguish a genuinely malformed or unsupported PNG file from a
              successful load, and receive a clear, actionable error rather than incorrect pixel data.
            children:
              - CanvasNet-Codecs-PngCodec-LoadBadSignature
              - CanvasNet-Codecs-PngCodec-LoadUnsupportedColorType
              - CanvasNet-Codecs-PngCodec-LoadUnsupportedBitDepth
              - CanvasNet-Codecs-PngCodec-LoadUnsupportedInterlace
              - CanvasNet-Codecs-PngCodec-LoadExceedsMaxDimension
              - CanvasNet-Codecs-PngCodec-LoadCorruptCrc
              - CanvasNet-Codecs-PngCodec-AdlerValidation
              - CanvasNet-Codecs-PngCodec-LoadTruncatedStream
              - CanvasNet-Codecs-PngCodec-LoadChunkBeforeIhdr
              - CanvasNet-Codecs-PngCodec-PngSuiteUnsupported
              - CanvasNet-Codecs-PngCodec-PngSuiteCorrupt
            tests:
              - PngCodec_Load_BadSignature_ThrowsInvalidDataException
              - PngCodec_Load_UnsupportedColorTypeGrayscale_ThrowsInvalidDataException
              - PngCodec_Load_UnsupportedColorTypePalette_ThrowsInvalidDataException
              - PngCodec_Load_UnsupportedBitDepth_ThrowsInvalidDataException
              - PngCodec_Load_UnsupportedInterlaceAdam7_ThrowsInvalidDataException
              - PngCodec_Load_WidthExceedsMaxDimension_ThrowsInvalidDataException
              - PngCodec_Load_HeightExceedsMaxDimension_ThrowsInvalidDataException
              - PngCodec_Load_CorruptChunkCrc_ThrowsInvalidDataException
              - PngCodec_Load_CorruptAdlerTrailer_ThrowsInvalidDataException
              - PngCodec_Load_TruncatedStream_ThrowsInvalidDataException
              - PngCodec_Load_IendBeforeIhdr_ThrowsInvalidDataExceptionMentioningIhdr

          - id: CanvasNet-Codecs-PngGetInfo
            title: >-
              The Codecs subsystem shall report a PNG's width, height, channel count, and alpha
              presence via GetInfo, given a stream or a file path, by reading only the signature and
              IHDR chunk, without decoding IDAT pixel data and without enforcing Surface.MaxDimension.
              The first chunk's type and (for IHDR) declared length shall both be validated before any
              length-dependent allocation is attempted, so a crafted first chunk cannot force a large
              allocation on this fast probing path.
            justification: |
              Callers need to inspect a PNG's declared dimensions and color type without paying the
              cost of inflating and decoding the full pixel buffer.
            children:
              - CanvasNet-Codecs-PngCodec-GetInfo
            tests:
              - PngCodec_GetInfo_Rgb_ReturnsExpectedInfoWithoutAlpha
              - PngCodec_GetInfo_Rgba_ReturnsExpectedInfoWithAlpha
              - PngCodec_GetInfo_NeverReadsPastIhdr
              - PngCodec_GetInfo_SucceedsWithCorruptIdatRegion_ButLoadThrows
              - PngCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows
              - PngCodec_GetInfo_NonIhdrFirstChunkWithHugeDeclaredLength_ThrowsWithoutLargeAllocation
              - PngCodec_GetInfo_IhdrChunkWithWrongDeclaredLength_ThrowsWithoutLargeAllocation

          - id: CanvasNet-Codecs-PngGetInfoValidation
            title: >-
              The Codecs subsystem shall reject invalid arguments or malformed PNG data passed to
              GetInfo with the same exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
              - CanvasNet-Codecs-PngCodec-GetInfoValidation
            tests:
              - PngCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - PngCodec_GetInfo_NullPath_ThrowsArgumentNullException
              - PngCodec_GetInfo_EmptyPath_ThrowsArgumentException
              - PngCodec_GetInfo_BadSignature_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-TiffSave
            title: >-
              The Codecs subsystem shall save a Surface as an 8-bit RGBA TIFF file (with optional
              None/PackBits/LZW/Deflate compression), to either a stream or a file path.
            justification: |
              Callers need to persist rendered or loaded pixel data in the widely supported TIFF format
              for interchange with other tools.
            children:
              - CanvasNet-Codecs-TiffCodec-SaveLoadRgba
              - CanvasNet-Codecs-TiffCodec-CompressionNone
              - CanvasNet-Codecs-TiffCodec-CompressionPackBits
              - CanvasNet-Codecs-TiffCodec-CompressionLzw
              - CanvasNet-Codecs-TiffCodec-CompressionDeflate
              - CanvasNet-Codecs-TiffCodec-PredictorRoundTrip
              - CanvasNet-Codecs-TiffCodec-SaveToPath
            tests:
              - CanvasNet_SystemIntegration_TiffSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-TiffLoad
            title: >-
              The Codecs subsystem shall load a Surface from an 8-bit RGB, RGBA, or Grayscale TIFF file
              (either byte order, single- or multi-strip, with None/PackBits/LZW/Deflate compression),
              from either a stream or a file path.
            justification: |
              Callers need to import existing TIFF images as pixel buffers for further processing or
              display, including files produced by real-world third-party TIFF encoders.
            children:
              - CanvasNet-Codecs-TiffCodec-SaveLoadRgba
              - CanvasNet-Codecs-TiffCodec-LoadRgbForcesOpaqueAlpha
              - CanvasNet-Codecs-TiffCodec-LoadGrayscale
              - CanvasNet-Codecs-TiffCodec-LoadLittleEndian
              - CanvasNet-Codecs-TiffCodec-LoadBigEndian
              - CanvasNet-Codecs-TiffCodec-LoadMultiStrip
              - CanvasNet-Codecs-TiffCodec-LoadFromPath
              - CanvasNet-Codecs-TiffCodec-FixtureSupported
            tests:
              - CanvasNet_SystemIntegration_TiffSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-TiffValidationNull
            title: >-
              The Codecs subsystem shall reject null Surface, stream, or path arguments to TIFF save and
              load operations with ArgumentNullException.
            justification: |
              Passing null to any TIFF save or load operation is a programming error. Throwing
              ArgumentNullException immediately surfaces the mistake and prevents obscure failures deeper
              in the call stack.
            children:
              - CanvasNet-Codecs-TiffCodec-SaveNullCanvas
              - CanvasNet-Codecs-TiffCodec-SaveNullStream
              - CanvasNet-Codecs-TiffCodec-SaveNullPath
              - CanvasNet-Codecs-TiffCodec-LoadNullStream
              - CanvasNet-Codecs-TiffCodec-LoadNullPath
            tests:
              - TiffCodec_SaveStream_NullCanvas_ThrowsArgumentNullException
              - TiffCodec_SaveStream_NullStream_ThrowsArgumentNullException
              - TiffCodec_SavePath_NullCanvas_ThrowsArgumentNullException
              - TiffCodec_SavePath_NullPath_ThrowsArgumentNullException
              - TiffCodec_LoadStream_NullStream_ThrowsArgumentNullException
              - TiffCodec_LoadPath_NullPath_ThrowsArgumentNullException

          - id: CanvasNet-Codecs-TiffValidationEmptyPath
            title: >-
              The Codecs subsystem shall reject an empty path argument to TIFF save and load operations
              with ArgumentException.
            justification: |
              Passing an empty path to any TIFF save or load operation is a programming error. Throwing
              ArgumentException immediately surfaces the mistake and prevents an obscure file-system
              error.
            children:
              - CanvasNet-Codecs-TiffCodec-SaveEmptyPath
              - CanvasNet-Codecs-TiffCodec-LoadEmptyPath
            tests:
              - TiffCodec_SavePath_EmptyPath_ThrowsArgumentException
              - TiffCodec_LoadPath_EmptyPath_ThrowsArgumentException

          - id: CanvasNet-Codecs-TiffValidationCompression
            title: >-
              The Codecs subsystem shall reject an undefined TiffCompression argument to TIFF save with
              ArgumentOutOfRangeException.
            justification: |
              An undefined compression value cannot be encoded to a valid TIFF file; rejecting it
              immediately prevents a malformed file from being written.
            children:
              - CanvasNet-Codecs-TiffCodec-SaveInvalidCompression
            tests:
              - TiffCodec_SaveStream_UndefinedCompression_ThrowsArgumentOutOfRangeException
              - TiffCodec_SavePath_UndefinedCompression_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Codecs-TiffUnsupportedFormatValidation
            title: >-
              The Codecs subsystem shall reject malformed or unsupported TIFF data (bad byte-order mark,
              unsupported bit depth, dimensions exceeding Surface.MaxDimension, unsupported photometric
              interpretation, unsupported compression, Planar configuration, tiled layout, a missing
              mandatory tag, or a truncated stream) with InvalidDataException.
            justification: |
              Callers must be able to distinguish a genuinely malformed or unsupported TIFF file from a
              successful load, and receive a clear, actionable error rather than incorrect pixel data.
            children:
              - CanvasNet-Codecs-TiffCodec-LoadBadByteOrder
              - CanvasNet-Codecs-TiffCodec-LoadUnsupportedBitDepth
              - CanvasNet-Codecs-TiffCodec-LoadExceedsMaxDimension
              - CanvasNet-Codecs-TiffCodec-LoadUnsupportedPhotometric
              - CanvasNet-Codecs-TiffCodec-LoadUnsupportedCompression
              - CanvasNet-Codecs-TiffCodec-LoadPlanarConfiguration
              - CanvasNet-Codecs-TiffCodec-LoadTiled
              - CanvasNet-Codecs-TiffCodec-LoadMissingMandatoryTag
              - CanvasNet-Codecs-TiffCodec-LoadTruncatedStream
              - CanvasNet-Codecs-TiffCodec-TagValueBoundsValidation
              - CanvasNet-Codecs-TiffCodec-TagValueCountUpperBound
            tests:
              - TiffCodec_Load_BadByteOrderMark_ThrowsInvalidDataException
              - TiffCodec_Load_UnsupportedBitsPerSample_ThrowsInvalidDataException
              - TiffCodec_Load_WidthExceedsMaxDimension_ThrowsInvalidDataException
              - TiffCodec_Load_HeightExceedsMaxDimension_ThrowsInvalidDataException
              - TiffCodec_Load_UnsupportedPhotometricPalette_ThrowsInvalidDataException
              - TiffCodec_Load_UnsupportedCompression_ThrowsInvalidDataException
              - TiffCodec_Load_PlanarConfigurationPlanar_ThrowsInvalidDataException
              - TiffCodec_Load_TiledTiff_ThrowsInvalidDataException
              - TiffCodec_Load_MissingMandatoryTag_ThrowsInvalidDataException
              - TiffCodec_Load_TruncatedHeader_ThrowsInvalidDataException
              - TiffCodec_Load_TruncatedStripData_ThrowsInvalidDataException
              - TiffCodec_Load_ImageWidthZeroCount_ThrowsInvalidDataExceptionNotIndexOutOfRange
              - TiffCodec_Load_IfdOffsetAboveInt32Range_ThrowsInvalidDataExceptionNotOverflowException
              - TiffCodec_Load_OutOfLineTagOffsetAboveInt32Range_ThrowsInvalidDataExceptionNotOverflowException
              - TiffCodec_GetInfo_Seekable_MaliciousOutOfLineTagLength_ThrowsWithoutUnboundedAllocation
              - TiffCodec_GetInfo_Seekable_BitsPerSampleCountImplausiblyLarge_ThrowsWithoutLargeAllocation

          - id: CanvasNet-Codecs-TiffGetInfo
            title: >-
              The Codecs subsystem shall report a TIFF's width, height, samples-per-pixel, and alpha
              presence via GetInfo, given a stream or a file path, without decoding strip data and
              without enforcing Surface.MaxDimension, requiring a seekable stream and seeking
              directly to the IFD rather than buffering the whole file, rejecting a non-seekable
              stream immediately with NotSupportedException before reading any bytes, rejecting a
              tiled TIFF, and resolving stream-relative positions from wherever the caller's stream
              was actually positioned when GetInfo was invoked, identically to Load.
            justification: |
              Callers need to inspect a TIFF's declared dimensions and channel layout without paying
              the cost of decoding strip data, via a handful of small seeks rather than buffering
              the whole file. Unlike PNG/JPEG/BMP, a TIFF's IFD can legitimately be located
              anywhere in the file, so no bounded, purely sequential scan can reliably resolve
              every well-formed TIFF from a non-seekable source; requiring a seekable stream up front
              keeps GetInfo's behavior identical for every well-formed file regardless of stream
              capability, rather than risking a divergence a bounded fallback would otherwise
              introduce.
            children:
              - CanvasNet-Codecs-TiffCodec-GetInfo
              - CanvasNet-Codecs-TiffCodec-GetInfoTiledRejection
              - CanvasNet-Codecs-TiffCodec-GetInfoStreamBasePosition
            tests:
              - TiffCodec_GetInfo_Seekable_Rgb_ReturnsExpectedInfoWithoutAlpha
              - TiffCodec_GetInfo_Seekable_Rgba_ReturnsExpectedInfoWithAlpha
              - TiffCodec_GetInfo_Seekable_PositionStaysWellBelowFullLength
              - TiffCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows
              - TiffCodec_GetInfo_SucceedsWithTruncatedStripData_ButLoadThrows
              - TiffCodec_GetInfo_Seekable_TiledTiff_ThrowsInvalidDataException
              - TiffCodec_GetInfo_Seekable_StreamNotAtPositionZero_ReturnsCorrectImageInfo
              - TiffCodec_GetInfo_NonSeekableStream_ThrowsNotSupportedException
              - TiffCodec_GetInfo_NonSeekableStream_ThrowsBeforeReadingAnyBytes

          - id: CanvasNet-Codecs-TiffGetInfoValidation
            title: >-
              The Codecs subsystem shall reject invalid arguments or malformed TIFF data passed to
              GetInfo with the same exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
              - CanvasNet-Codecs-TiffCodec-GetInfoValidation
            tests:
              - TiffCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - TiffCodec_GetInfo_NullPath_ThrowsArgumentNullException
              - TiffCodec_GetInfo_EmptyPath_ThrowsArgumentException
              - TiffCodec_GetInfo_BadByteOrderMark_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-JpegSave
            title: >-
              The Codecs subsystem shall save a Surface as a baseline, 3-component YCbCr, 4:2:0
              chroma-subsampled JPEG file, to either a stream or a file path.
            justification: |
              Callers need to persist rendered or loaded pixel data in the widely supported JPEG format
              for interchange with other tools, with a caller-controlled quality setting.
            children:
              - CanvasNet-Codecs-JpegCodec-SaveLoadBaseline420
            tests:
              - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-JpegLoad
            title: >-
              The Codecs subsystem shall load a Surface from a supported JPEG file, from either a stream
              or a file path, including grayscale, baseline 4:4:4/4:2:2/4:2:0, and progressive JPEG.
            justification: |
              Callers need to import existing JPEG images as pixel buffers for further processing or
              display, including files produced by real-world third-party encoders.
            children:
              - CanvasNet-Codecs-JpegCodec-LoadBaseline444
              - CanvasNet-Codecs-JpegCodec-LoadBaseline422
              - CanvasNet-Codecs-JpegCodec-LoadProgressive
              - CanvasNet-Codecs-JpegCodec-LoadGrayscale
              - CanvasNet-Codecs-JpegCodec-FixtureSupported
              - CanvasNet-Codecs-JpegCodec-RestartMarkers
            tests:
              - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-JpegValidationNull
            title: >-
              The Codecs subsystem shall reject null Surface, stream, or path arguments to JPEG save and
              load operations with ArgumentNullException.
            justification: |
              Passing null to any JPEG save or load operation is a programming error. Throwing
              ArgumentNullException immediately surfaces the mistake and prevents obscure failures deeper
              in the call stack.
            children:
              - CanvasNet-Codecs-JpegCodec-SaveNullCanvas
              - CanvasNet-Codecs-JpegCodec-SaveNullStream
              - CanvasNet-Codecs-JpegCodec-SaveNullPath
              - CanvasNet-Codecs-JpegCodec-LoadNullStream
              - CanvasNet-Codecs-JpegCodec-LoadNullPath
            tests:
              - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-JpegValidationEmptyPath
            title: >-
              The Codecs subsystem shall reject an empty path argument to JPEG save and load operations
              with ArgumentException.
            justification: |
              Passing an empty path to any JPEG save or load operation is a programming error. Throwing
              ArgumentException immediately surfaces the mistake and prevents an obscure file-system
              error.
            children:
              - CanvasNet-Codecs-JpegCodec-SaveEmptyPath
              - CanvasNet-Codecs-JpegCodec-LoadEmptyPath
            tests:
              - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-JpegValidationQuality
            title: >-
              The Codecs subsystem shall reject a JPEG save quality value outside the inclusive range
              1-100 with ArgumentOutOfRangeException.
            justification: |
              An out-of-range quality value cannot be mapped to the encoder's documented quality scale
              and must be rejected rather than silently clamped.
            children:
              - CanvasNet-Codecs-JpegCodec-SaveInvalidQuality
            tests:
              - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-JpegUnsupportedFormatValidation
            title: >-
              The Codecs subsystem shall reject malformed or unsupported JPEG data (missing SOI,
              unsupported SOF marker, unsupported component count, dimensions exceeding
              Surface.MaxDimension, a missing mandatory segment, or a truncated stream) with
              InvalidDataException.
            justification: |
              Callers must be able to distinguish a genuinely malformed or unsupported JPEG file from a
              successful load, and receive a clear, actionable error rather than incorrect pixel data.
            children:
              - CanvasNet-Codecs-JpegCodec-RejectMalformedMarker
              - CanvasNet-Codecs-JpegCodec-RejectUnsupportedSof
              - CanvasNet-Codecs-JpegCodec-RejectFourComponent
              - CanvasNet-Codecs-JpegCodec-RejectExceedsMaxDimension
              - CanvasNet-Codecs-JpegCodec-RejectMissingSegments
              - CanvasNet-Codecs-JpegCodec-RejectTruncatedStream
              - CanvasNet-Codecs-JpegCodec-SimdMatchesScalar
            tests:
              - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

          - id: CanvasNet-Codecs-JpegGetInfo
            title: >-
              The Codecs subsystem shall report a JPEG's width, height, and component count via
              GetInfo, given a stream or a file path, by scanning markers incrementally for a
              supported SOF segment without entropy-decoding scan data, without requiring an SOS
              segment or entropy-coded data, and without enforcing Surface.MaxDimension, reading no
              more of the stream than necessary once the target SOF has been fully parsed and bounding
              the scan to a fixed maximum number of probed header bytes as a hard outer cap.
            justification: |
              Callers need to inspect a JPEG's declared dimensions and component count without paying
              the cost of entropy-decoding the scan data, without an unbounded scan over a
              pathological stream that never presents an SOF marker, and without unconditionally
              reading up to the full probe cap even when the SOF appears near the start of a much
              larger stream.
            children:
              - CanvasNet-Codecs-JpegCodec-GetInfo
            tests:
              - JpegCodec_GetInfo_Grayscale_ReturnsExpectedInfoWithoutSosOrEntropyData
              - JpegCodec_GetInfo_Color_ReturnsExpectedInfo
              - JpegCodec_GetInfoPath_ReturnsExpectedInfo
              - JpegCodec_GetInfo_LargeStream_NeverReadsPastProbeLimit
              - JpegCodec_GetInfo_SofNearStart_DoesNotReadFarBeyondWhatIsNeeded
              - JpegCodec_GetInfo_ProbeLimitExceededWithoutSof_ThrowsInvalidDataException
              - JpegCodec_GetInfo_OversizedDimensions_NotRejected_ButLoadThrows

          - id: CanvasNet-Codecs-JpegGetInfoValidation
            title: >-
              The Codecs subsystem shall reject invalid arguments or malformed JPEG data passed to
              GetInfo with the same exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
              - CanvasNet-Codecs-JpegCodec-GetInfoValidation
            tests:
              - JpegCodec_GetInfoStream_NullStream_ThrowsArgumentNullException
              - JpegCodec_GetInfoPath_NullPath_ThrowsArgumentNullException
              - JpegCodec_GetInfoPath_EmptyPath_ThrowsArgumentException
              - JpegCodec_GetInfo_MissingSoiMarker_ThrowsInvalidDataException
              - JpegCodec_GetInfo_TruncatedBeforeSofFound_ThrowsInvalidDataException
              - JpegCodec_GetInfo_SosBeforeSof_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-SvgLoad
            title: >-
              The Codecs subsystem shall load a Surface by rasterizing a supported SVG document,
              from either a stream or a file path, including basic shapes, the full path data
              mini-language, group/attribute inheritance and nested transforms, transform
              functions, presentation attributes, gradients (including href template
              inheritance), and the use element.
            justification: |
              Callers need to import SVG vector artwork as pixel buffers for further processing
              or display, since SvgCodec is decode/rasterize-only (no Save).
            children:
              - CanvasNet-Codecs-SvgCodec-LoadBasicShapes
              - CanvasNet-Codecs-SvgCodec-LoadPathCommands
              - CanvasNet-Codecs-SvgCodec-GroupTransformInheritance
              - CanvasNet-Codecs-SvgCodec-TransformFunctions
              - CanvasNet-Codecs-SvgCodec-PresentationAttributes
              - CanvasNet-Codecs-SvgCodec-Gradients
              - CanvasNet-Codecs-SvgCodec-GradientHrefInheritance
              - CanvasNet-Codecs-SvgCodec-UseElement
              - CanvasNet-Codecs-SvgCodec-ElementNestingDepthLimit
              - CanvasNet-Codecs-SvgCodec-ValidationOutputDimensions
            tests:
              - CanvasNet_SystemIntegration_SvgLoad_ReturnsExpectedPixel
              - SvgCodec_Load_NonPositiveWidth_PropagatesSurfaceArgumentOutOfRangeException

          - id: CanvasNet-Codecs-SvgViewBoxFitting
            title: >-
              The Codecs subsystem shall fit an SVG document's intrinsic viewBox into the
              requested raster size using a "meet, centered" (CSS object-fit: contain
              equivalent) transform.
            justification: |
              Callers request a specific raster size that may not share the document's
              intrinsic aspect ratio; centered letterboxing avoids distorting or clipping the
              document's content.
            children:
              - CanvasNet-Codecs-SvgCodec-ViewBoxFitting
            tests:
              - SvgCodec_Load_WideViewBoxIntoSquareRaster_LetterboxesTopAndBottom
              - SvgCodec_Load_TallViewBoxIntoSquareRaster_LetterboxesLeftAndRight

          - id: CanvasNet-Codecs-SvgGetInfo
            title: >-
              The Codecs subsystem shall report an SVG document's resolved intrinsic width,
              height, channel count, and alpha presence via GetInfo, given a stream or a file
              path, falling back from viewBox to width/height to a 300x150 default.
            justification: |
              Callers need to inspect an SVG document's intrinsic size before choosing a raster
              target size to load it into, even for documents that omit explicit sizing
              information.
            children:
              - CanvasNet-Codecs-SvgCodec-GetInfo
              - CanvasNet-Codecs-SvgCodec-GetInfoFallback
            tests:
              - SvgCodec_GetInfo_ViewBoxPresent_ReturnsViewBoxDimensions
              - SvgCodec_GetInfo_FromFilePath_ReturnsExpectedInfo
              - SvgCodec_GetInfo_NoViewBoxWidthHeightPresent_ReturnsWidthHeight
              - SvgCodec_GetInfo_NoViewBoxNoWidthHeight_ReturnsCssDefault300x150

          - id: CanvasNet-Codecs-SvgTextRendering
            title: >-
              The Codecs subsystem shall render an SVG text element's characters as glyph
              outlines from a caller-supplied font, positioned and anchored according to its
              text-anchor, and shall silently skip text rendering when no matching font is
              available.
            justification: |
              Callers need text content in an SVG document rendered as recognizable glyph shapes
              using real font metrics, without a missing font turning an otherwise-renderable
              document into a failure.
            children:
              - CanvasNet-Codecs-SvgCodec-TextRendering
              - CanvasNet-Codecs-SvgCodec-TextFontFallbackSkipsSilently
              - CanvasNet-Codecs-SvgCodec-TextAnchor
            tests:
              - SvgCodec_Load_TextWithMatchingFont_RendersGlyphAtExpectedPosition
              - SvgCodec_Load_TextWithKerningPair_AppliesKerningBetweenGlyphs
              - SvgCodec_Load_TextFixtureWithRealFont_RendersVisibleGlyphInk
              - SvgCodec_Load_TextAnchorMiddle_CentersTextHorizontally
              - SvgCodec_Load_TextAnchorEnd_RightAlignsText
              - SvgCodec_Load_TextWithoutFontsDictionary_SkipsSilentlyWithoutThrowing
              - SvgCodec_Load_TextFontFamilyNoMatch_SkipsSilentlyWithoutThrowing
              - SvgCodec_Load_TextFontFamilyCommaSeparatedList_MatchesFirstAvailableFont

          - id: CanvasNet-Codecs-SvgValidationNull
            title: >-
              The Codecs subsystem shall reject null stream/path arguments to SVG Load and
              GetInfo operations with ArgumentNullException.
            justification: |
              Passing null to any SVG load or inspection operation is a programming error.
              Throwing ArgumentNullException immediately surfaces the mistake and prevents
              obscure failures deeper in the call stack.
            children:
              - CanvasNet-Codecs-SvgCodec-ValidationNull
            tests:
              - SvgCodec_Load_NullStream_ThrowsArgumentNullException
              - SvgCodec_Load_NullPath_ThrowsArgumentNullException
              - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException

          - id: CanvasNet-Codecs-SvgValidationEmptyPath
            title: >-
              The Codecs subsystem shall reject an empty or whitespace-only path argument to SVG
              Load and GetInfo operations with ArgumentException.
            justification: |
              Passing an empty or whitespace-only path to any SVG load or inspection operation
              is a programming error. Throwing ArgumentException immediately surfaces the
              mistake and prevents an obscure file-system error.
            children:
              - CanvasNet-Codecs-SvgCodec-ValidationEmptyPath
            tests:
              - SvgCodec_Load_EmptyPath_ThrowsArgumentException
              - SvgCodec_Load_WhitespacePath_ThrowsArgumentException
              - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

          - id: CanvasNet-Codecs-SvgUnsupportedFormatValidation
            title: >-
              The Codecs subsystem shall reject malformed SVG data (non-well-formed XML, a
              malformed viewBox or transform attribute, or malformed path data) with
              InvalidDataException.
            justification: |
              Callers must be able to distinguish a genuinely malformed SVG document from a
              successful load, and receive a clear, actionable error rather than incorrect
              pixel data.
            children:
              - CanvasNet-Codecs-SvgCodec-MalformedXmlRejected
              - CanvasNet-Codecs-SvgCodec-MalformedPathDataRejected
            tests:
              - SvgCodec_Load_MalformedXml_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedViewBoxWrongNumberCount_ThrowsInvalidDataException
              - SvgCodec_Load_ViewBoxNonPositiveWidth_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedTransformUnrecognizedFunction_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedPathDataUnknownCommand_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedPathDataMissingArguments_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-SvgTolerateUnsupportedConstructs
            title: >-
              The Codecs subsystem shall silently skip well-formed but out-of-scope SVG elements,
              continuing to render the rest of the document, rather than rejecting the entire
              document.
            justification: |
              Real-world SVG documents commonly include constructs outside this codec's
              supported subset (such as filters, masks, or CSS styling); rejecting the entire
              document because of one such element would be needlessly strict when the rest of
              the document is renderable.
            children:
              - CanvasNet-Codecs-SvgCodec-UnsupportedConstructsIgnored
            tests:
              - SvgCodec_Load_UnsupportedConstructs_StillRendersRestOfDocument
              - SvgCodec_Load_ToleratesUnsupportedConstructFixture_StillRendersRemainingContent

          - id: CanvasNet-Codecs-SvgGetInfoValidation
            title: >-
              The Codecs subsystem shall reject invalid arguments passed to SVG GetInfo with the
              same exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
              - CanvasNet-Codecs-SvgCodec-ValidationNull
              - CanvasNet-Codecs-SvgCodec-ValidationEmptyPath
            tests:
              - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException
              - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException
