          - id: CanvasNet-Codecs-SvgMarkerRendering
            title: >-
              The Codecs subsystem shall rasterize marker elements referenced from a line,
              polyline, polygon, or path element's marker-start/marker-mid/marker-end
              presentation attributes, at the correct vertex, orientation, and scale (honoring an
              explicit preserveAspectRatio attribute on the marker itself, when present, and
              otherwise preserving the pre-existing default fit unchanged), and shall reject an
              unbounded marker-referencing-marker reference cycle the same way an unbounded use
              reference cycle is already rejected.
            justification: |
              Connector arrowheads and other per-vertex line decorations built via SVG's marker
              mechanism are common in real-world diagrams and flowcharts; callers need these to
              render rather than silently vanish, with the same bounded, predictable
              error-handling behavior already established for use reference cycles.
            children:
              - CanvasNet-Codecs-SvgCodec-MarkerRendering
              - CanvasNet-Codecs-SvgCodec-MarkerReferenceCycle
              - CanvasNet-Codecs-SvgCodec-MarkerPreserveAspectRatio
            tests:
              - SvgCodec_Load_MarkerEndOnLine_RendersArrowheadPastLineEnd
              - SvgCodec_Load_MarkerStartMidEndOnPolyline_RendersDistinctMarkersAtEachVertex
              - SvgCodec_Load_ArrowMarkersFixture_RendersArrowheadPastLineEnd
              - SvgCodec_Load_MarkerSelfReferenceCycle_ThrowsInvalidDataException
              - SvgCodec_Load_MarkerTwoElementReferenceCycle_ThrowsInvalidDataException
              - SvgCodec_Load_MarkerWithViewBox_FitsContentToMarkerWidthHeight
              - SvgCodec_Load_MarkerWithExplicitPreserveAspectRatioSlice_UsesLargerUniformScale

          - id: CanvasNet-Codecs-SvgFilterRendering
            title: >-
              The Codecs subsystem shall rasterize filter elements referenced from any directly
              renderable shape or text element's filter presentation attribute, evaluating a
              bounded feFlood/feGaussianBlur/feOffset/feComposite/feMerge/feColorMatrix/
              feComponentTransfer/feMorphology/feConvolveMatrix/feDisplacementMap/feTile/
              feDropShadow/feImage/feDiffuseLighting/feSpecularLighting/feTurbulence/feBlend
              primitive chain against that element's own content within a bounded-size temporary
              offscreen surface, and shall tolerate a dangling filter reference, a genuinely
              unrecognized primitive type, and pathological filter-region, convolution-order,
              morphology-radius, or turbulence-octave inputs without failing or hanging.
            justification: |
              Real-world SVG documents use much more than the initial flood/blur/offset/
              composite subset: authored icons, diagrams, and illustration exports commonly add
              color-matrix stages, component-transfer ramps, morphology/convolution kernels,
              displacement, tiled subregions, drop shadows, and image-based filter inputs. The
              codec therefore needs this broader primitive subset to reproduce common authored
              filter effects while keeping the same bounded, predictable resource-safety
              behavior already established for other reference-following and work-budget
              concerns.
            children:
              - CanvasNet-Codecs-SvgCodec-FilterRendering
              - CanvasNet-Codecs-SvgCodec-FilterResourceSafety
              - CanvasNet-Codecs-SvgCodec-GroupFilterRendering
              - CanvasNet-Codecs-SvgCodec-FeColorMatrix
              - CanvasNet-Codecs-SvgCodec-FeComponentTransfer
              - CanvasNet-Codecs-SvgCodec-FeMorphology
              - CanvasNet-Codecs-SvgCodec-FeConvolveMatrix
              - CanvasNet-Codecs-SvgCodec-FeDisplacementMap
              - CanvasNet-Codecs-SvgCodec-FeTile
              - CanvasNet-Codecs-SvgCodec-FeDropShadow
              - CanvasNet-Codecs-SvgCodec-FeImage
              - CanvasNet-Codecs-SvgCodec-FeDiffuseLighting
              - CanvasNet-Codecs-SvgCodec-FeSpecularLighting
              - CanvasNet-Codecs-SvgCodec-FeTurbulence
              - CanvasNet-Codecs-SvgCodec-FeBlend
              - CanvasNet-Codecs-SvgCodec-FilterPrimitiveResourceSafety
            tests:
              - SvgCodec_Load_FeFloodFeGaussianBlurFeCompositeFilter_RendersBlurredHaloBehindContent
              - SvgCodec_Load_FeColorMatrixTypeHueRotate_RotatesHueByAngle
              - SvgCodec_Load_FeFuncATypeGamma_AppliesGammaCurveToAlpha
              - SvgCodec_Load_FeMorphologyOperatorDilate_GrowsOpaqueRegion
              - SvgCodec_Load_FeConvolveMatrixEdgeDetectKernel_ProducesExpectedEdgeResponse
              - SvgCodec_Load_FeDisplacementMapPositiveScaleWithRedChannelSelector_DisplacesSourcePixels
              - SvgCodec_Load_FeTileTilesUpstreamPrimitiveSubregionAcrossFilterRegion
              - SvgCodec_Load_FeDropShadow_MatchesManualBlurOffsetFloodCompositeChainEquivalent
              - SvgCodec_Load_FeImageElementReferenceHref_RendersReferencedElementOffscreen
              - SvgCodec_Load_FeSpecularLightingFlatAlphaDistantLightAt90DegreesElevation_ProducesUniformSpecularHighlight
              - SvgCodec_TurbulenceTablesRandom_10000thValueFromSeedOne_MatchesSpecPublishedTestVector
              - SvgCodec_Load_FeConvolveMatrixOrderExceedingCap_ThrowsInvalidDataException
              - SvgCodec_Load_FeMorphologyRadiusExceedingCap_ThrowsInvalidDataException
              - SvgCodec_Load_FeTurbulenceNumOctavesExceedingCap_ThrowsInvalidDataException
              - SvgCodec_Load_FeBlendSeparableMode_MatchesHandComputedFormula
              - SvgCodec_Load_InkscapeFiltersFixture_ToleratesFiltersAndRendersFlowerContent

          - id: CanvasNet-Codecs-SvgClipPathMaskRendering
            title: >-
              The Codecs subsystem shall render clip-path and mask elements referenced from any
              directly renderable shape, text, or g/symbol/use element's own clip-path/mask
              presentation attribute, hard-clipping to the union of a clipPath element's own
              children and/or attenuating alpha by mask-content luminance, applying both before
              that element's own filter (per the ordering geometry -> fill/stroke -> clip -> mask
              -> filter -> group opacity), and shall bound clip/mask-related resource use with
              the same tolerant-fallback conventions already established for this subsystem's
              filter support.
            justification: |
              clip-path and mask are common SVG authoring mechanisms for revealing only part of
              an element's own content (a rounded-rectangle photo crop, a doughnut-hole cutout, a
              gradient-driven fade or vignette) that this subsystem previously discarded entirely
              as an explicit out-of-scope simplification; callers relying on either common
              pattern need it to actually apply, in the SVG-specification-defined order relative
              to filter, with the same bounded, predictable resource-safety behavior already
              established for this subsystem's other reference-following and work-budget
              concerns.
            children:
              - CanvasNet-Codecs-SvgCodec-ClipPathRendering
              - CanvasNet-Codecs-SvgCodec-MaskRendering
              - CanvasNet-Codecs-SvgCodec-EffectOrdering
              - CanvasNet-Codecs-SvgCodec-EffectResourceSafety
            tests:
              - SvgCodec_Load_ClipPathUserSpaceOnUse_ClipsToAbsoluteCircle
              - SvgCodec_Load_ClipPathObjectBoundingBox_ScalesClipContentToReferenceBounds
              - SvgCodec_Load_MaskDefaultLuminance_WhiteRevealsBlackHides
              - SvgCodec_Load_MaskUnitsUserSpaceOnUse_ReadsRegionAsAbsoluteCoordinates
              - SvgCodec_Load_MaskContentUnitsObjectBoundingBox_ScalesMaskContentToReferenceBounds
              - SvgCodec_Load_ClipPathWithFilter_AppliesClipBeforeFilter
              - SvgCodec_Load_MaskWithFilter_AppliesMaskBeforeFilter
              - SvgCodec_Load_MaskReferenceCycle_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-SvgPatternRendering
            title: >-
              The Codecs subsystem shall render a pattern element referenced from any directly
              renderable shape's own fill/stroke presentation attribute, tiling the pattern's own
              resolved (possibly href-inherited) content across the painted region per
              patternUnits/patternContentUnits/patternTransform/viewBox, and shall bound
              pattern-related resource use with the same tolerant-fallback conventions already
              established for this subsystem's filter/clip-path/mask support.
            justification: |
              pattern is a common SVG authoring mechanism for a repeating tiled fill (a hatching,
              a texture, a repeated icon) that this subsystem previously discarded entirely as an
              explicit out-of-scope simplification; callers relying on this common pattern need
              it to actually tile, with the same href-inheritance, cycle-rejection, and
              work-budget resource-safety behavior already established for this subsystem's other
              reference-following paint-server (gradient) and effect (clip-path/mask) support.
            children:
              - CanvasNet-Codecs-SvgCodec-PatternRendering
              - CanvasNet-Codecs-SvgCodec-PatternHrefInheritance
              - CanvasNet-Codecs-SvgCodec-PatternResourceSafety
            tests:
              - SvgCodec_Load_PatternDefaultUnits_TilesOnceAcrossShapeBoundingBox
              - SvgCodec_Load_PatternUserSpaceOnUseUnits_TilesRepeatedlyAcrossUserSpace
              - SvgCodec_Load_PatternContentUnitsObjectBoundingBox_MapsContentThroughShapeBoundingBox
              - SvgCodec_Load_PatternObjectBoundingBoxUnitsAndContentUnits_TilesAndContentBothScaleToBoundingBox
              - SvgCodec_Load_PatternTransformRotate180_RotatesTiledContentPlacement
              - SvgCodec_Load_PatternViewBox_FitsContentIntoTileBuffer
              - SvgCodec_Load_PatternStroke_PaintsStrokeOutlineWithTiledContent
              - SvgCodec_Load_PatternFillAndStroke_RenderIndependentPatterns
              - SvgCodec_Load_DanglingPatternReference_RendersUnfilled
              - SvgCodec_Load_FillReferencesNonPatternElement_RendersUnfilled
              - SvgCodec_Load_PatternZeroWidthOrHeight_RendersUnfilledWithoutThrowing
              - SvgCodec_Load_PatternContentWithGroupAndGradient_RendersViaRecursiveElementWalk
              - SvgCodec_Load_PatternHrefInheritance_InheritsContentFromTemplate
              - SvgCodec_Load_PatternHrefChainOfTwoHops_ResolvesToEventualContent
              - SvgCodec_Load_PatternHrefCycle_ThrowsInvalidDataException
              - SvgCodec_Load_PatternSelfReferencingContent_ThrowsInvalidDataException
              - SvgCodec_Load_PatternTileExceedsMaxDimension_FallsBackToUnfilledRendering
              - SvgCodec_Load_PatternReferencedByManyShapesExceedingCumulativeBudget_FallsBackToUnfilledForExcessShapes

          - id: CanvasNet-Codecs-SvgImageRendering
            title: >-
              The Codecs subsystem shall rasterize an image element whose href/xlink:href is a
              base64-encoded data URI with a supported raster MIME type by decoding it through
              that format's own existing codec and drawing the decoded raster into the element's
              own placement rect per preserveAspectRatio, integrated with the same clip-path/
              mask/filter/opacity effects pipeline every other renderable element already uses,
              while treating an external (non-data:) href or a nested data:image/svg+xml document
              as a documented, security-conscious no-op, and bounding image-related resource use
              with the same tolerant-fallback, work-budget conventions already established for
              this subsystem's other reference-following paint-server (pattern) and effect
              (filter/clip-path/mask) support.
            justification: |
              image is a common SVG authoring mechanism for embedding a raster asset (an icon, a
              photo, a texture) directly inside a vector document that this subsystem previously
              discarded entirely as an explicit out-of-scope simplification; callers relying on
              this common element need its base64-embedded raster payload actually decoded and
              drawn, with the same effects-pipeline integration and work-budget resource-safety
              behavior already established for this subsystem's other paint-server and effect
              support, while external-href resolution and nested-SVG recursion remain deliberately
              out of scope rather than introducing an unbounded or security-sensitive capability.
            children:
              - CanvasNet-Codecs-SvgCodec-ImageRendering
              - CanvasNet-Codecs-SvgCodec-ImageExternalHrefScope
              - CanvasNet-Codecs-SvgCodec-ImageResourceSafety
            tests:
              - SvgCodec_Load_ImageDataUriPng_RendersDecodedPixelsAtPlacementRect
              - SvgCodec_Load_ImageDataUriJpeg_RendersDecodedPixelsAtPlacementRect
              - SvgCodec_Load_ImagePreserveAspectRatioMeet_LettersOrPillarboxesNonMatchingAspect
              - SvgCodec_Load_ImagePreserveAspectRatioNone_StretchesNonUniformly
              - SvgCodec_Load_ImageWithClipPath_ClipsToClipPathShape
              - SvgCodec_Load_ImageWithMask_AttenuatesByMaskLuminance
              - SvgCodec_Load_ImageWithFilter_AppliesFilterToDecodedPixels
              - SvgCodec_Load_ImageWithOpacity_AppliesUniformAlphaToCompositedResult
              - SvgCodec_Load_ImageZeroWidthOrHeight_RendersNothingWithoutThrowing
              - SvgCodec_Load_ImageNoWidthOrHeightAttribute_RendersNothingWithoutThrowing
              - SvgCodec_Load_ImageExternalFileHref_RendersNothingWithoutFileAccess
              - SvgCodec_Load_ImageNestedSvgDataUri_RendersNothingWithoutRecursion
              - SvgCodec_Load_ImageMalformedBase64_SkipsElementWithoutThrowing
              - SvgCodec_Load_ImageTruncatedPngData_SkipsElementWithoutThrowing
              - SvgCodec_Load_ImageOversizedDeclaredDimensionsExceedingBudget_FallsBackToUnrenderedWithoutThrowing

          - id: CanvasNet-Codecs-SvgViewBoxFitting
            title: >-
              The Codecs subsystem shall fit an SVG document's intrinsic viewBox into the
              requested raster size via preserveAspectRatio (defaulting to "xMidYMid meet", a
              "meet, centered", CSS object-fit: contain equivalent, transform, when absent), and
              shall apply the same fit algorithm to a use element referencing a symbol element
              with its own viewBox.
            justification: |
              Callers request a specific raster size that may not share the document's
              intrinsic aspect ratio; preserveAspectRatio is the SVG-specification-defined
              mechanism for controlling that mismatch, and reusing the same fit algorithm for
              symbol/use content keeps both reuse sites consistent and correct.
            children:
              - CanvasNet-Codecs-SvgCodec-ViewBoxFitting
              - CanvasNet-Codecs-SvgCodec-SymbolViewBoxFitting
            tests:
              - SvgCodec_Load_WideViewBoxIntoSquareRaster_LetterboxesTopAndBottom
              - SvgCodec_Load_TallViewBoxIntoSquareRaster_LetterboxesLeftAndRight
              - SvgCodec_Load_RootPreserveAspectRatio_AppliesAlignAndMeetOrSlice
              - SvgCodec_Load_RootPreserveAspectRatioNone_StretchesNonUniformly
              - SvgCodec_Load_NoPreserveAspectRatioAttribute_MatchesExplicitXMidYMidMeet
              - SvgCodec_Load_UseReferencingSymbolWithViewBox_FitsContentToResolvedWidthHeight
              - SvgCodec_Load_UseReferencingSymbolWithPreserveAspectRatio_HonorsAlign

          - id: CanvasNet-Codecs-SvgGetInfo
            title: >-
              The Codecs subsystem shall report an SVG document's resolved intrinsic width,
              height, channel count, and alpha presence via GetInfo, given a stream or a file
              path, falling back from viewBox to width/height to a 300x150 default.
            justification: |
              Callers need to inspect an SVG document's intrinsic size before choosing a raster
              target size to load it into, even for documents that omit explicit sizing
              information.
            children:
              - CanvasNet-Codecs-SvgCodec-GetInfo
              - CanvasNet-Codecs-SvgCodec-GetInfoFallback
            tests:
              - SvgCodec_GetInfo_ViewBoxPresent_ReturnsViewBoxDimensions
              - SvgCodec_GetInfo_FromFilePath_ReturnsExpectedInfo
              - SvgCodec_GetInfo_NoViewBoxWidthHeightPresent_ReturnsWidthHeight
              - SvgCodec_GetInfo_NoViewBoxNoWidthHeight_ReturnsCssDefault300x150

          - id: CanvasNet-Codecs-SvgTextRendering
            title: >-
              The Codecs subsystem shall render an SVG text element's characters as glyph
              outlines from a caller-supplied font, positioned and anchored according to its
              text-anchor, and shall silently skip text rendering when no matching font is
              available.
            justification: |
              Callers need text content in an SVG document rendered as recognizable glyph shapes
              using real font metrics, without a missing font turning an otherwise-renderable
              document into a failure.
            children:
              - CanvasNet-Codecs-SvgCodec-TextRendering
              - CanvasNet-Codecs-SvgCodec-TextFontFallbackSkipsSilently
              - CanvasNet-Codecs-SvgCodec-TextAnchor
            tests:
              - SvgCodec_Load_TextWithMatchingFont_RendersGlyphAtExpectedPosition
              - SvgCodec_Load_TextWithKerningPair_AppliesKerningBetweenGlyphs
              - SvgCodec_Load_TextFixtureWithRealFont_RendersVisibleGlyphInk
              - SvgCodec_Load_TextAnchorMiddle_CentersTextHorizontally
              - SvgCodec_Load_TextAnchorEnd_RightAlignsText
              - SvgCodec_Load_TextWithoutFontsDictionary_SkipsSilentlyWithoutThrowing
              - SvgCodec_Load_TextFontFamilyNoMatch_SkipsSilentlyWithoutThrowing
              - SvgCodec_Load_TextFontFamilyCommaSeparatedList_MatchesFirstAvailableFont

          - id: CanvasNet-Codecs-SvgFontWeightStyleMatching
            title: >-
              The Codecs subsystem shall register more than one font face (varying in
              font-weight/font-style) per SVG text font-family and select the closest-matching
              registered face for each text element's own cascaded font-weight/font-style,
              while preserving the pre-existing single-font-per-family Load overload's behavior
              unchanged.
            justification: |
              Callers commonly need bold titles and italic keywords rendered with the correct
              distinct font face, rather than every element in a family always resolving to the
              same single font regardless of its requested weight/style; existing callers of the
              single-font-per-family overload must observe no behavior change.
            children:
              - CanvasNet-Codecs-SvgCodec-FontWeightStyleCascade
              - CanvasNet-Codecs-SvgCodec-FontFaceMatching
              - CanvasNet-Codecs-SvgCodec-LegacySingleFontCompatibility
            tests:
              - SvgCodec_Load_TextFontWeightBold_SelectsBoldFaceOverNormalFace
              - SvgCodec_Load_TextFontStyleItalic_SelectsItalicFaceOverNormalFace
              - SvgCodec_Load_TextFontWeightAndStyleCombined_SelectsExactMatchAmongThreeFaces
              - SvgCodec_Load_GroupFontWeightInheritance_AppliesToChildTextWithoutOwnFontWeight
              - SvgCodec_Load_GroupFontStyleInheritance_AppliesToChildTextWithoutOwnFontStyle
              - SvgCodec_Load_TextLegacySingleFontOverload_IgnoresRequestedWeightAndStyle

          - id: CanvasNet-Codecs-SvgValidationNull
            title: >-
              The Codecs subsystem shall reject null stream/path arguments to SVG Load and
              GetInfo operations with ArgumentNullException.
            justification: |
              Passing null to any SVG load or inspection operation is a programming error.
              Throwing ArgumentNullException immediately surfaces the mistake and prevents
              obscure failures deeper in the call stack.
            children:
              - CanvasNet-Codecs-SvgCodec-ValidationNull
            tests:
              - SvgCodec_Load_NullStream_ThrowsArgumentNullException
              - SvgCodec_Load_NullPath_ThrowsArgumentNullException
              - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException

          - id: CanvasNet-Codecs-SvgValidationEmptyPath
            title: >-
              The Codecs subsystem shall reject an empty or whitespace-only path argument to SVG
              Load and GetInfo operations with ArgumentException.
            justification: |
              Passing an empty or whitespace-only path to any SVG load or inspection operation
              is a programming error. Throwing ArgumentException immediately surfaces the
              mistake and prevents an obscure file-system error.
            children:
              - CanvasNet-Codecs-SvgCodec-ValidationEmptyPath
            tests:
              - SvgCodec_Load_EmptyPath_ThrowsArgumentException
              - SvgCodec_Load_WhitespacePath_ThrowsArgumentException
              - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

          - id: CanvasNet-Codecs-SvgUnsupportedFormatValidation
            title: >-
              The Codecs subsystem shall reject malformed SVG data (non-well-formed XML, a
              malformed viewBox or transform attribute, or malformed path data) with
              InvalidDataException.
            justification: |
              Callers must be able to distinguish a genuinely malformed SVG document from a
              successful load, and receive a clear, actionable error rather than incorrect
              pixel data.
            children:
              - CanvasNet-Codecs-SvgCodec-MalformedXmlRejected
              - CanvasNet-Codecs-SvgCodec-MalformedPathDataRejected
            tests:
              - SvgCodec_Load_MalformedXml_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedViewBoxWrongNumberCount_ThrowsInvalidDataException
              - SvgCodec_Load_ViewBoxNonPositiveWidth_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedTransformUnrecognizedFunction_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedPathDataUnknownCommand_ThrowsInvalidDataException
              - SvgCodec_Load_MalformedPathDataMissingArguments_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-SvgPercentageGeometryResolution
            title: >-
              The Codecs subsystem shall resolve a percentage value on a shape/text geometry
              attribute against the current SVG viewport (or, for font-size, the parent
              element's own font-size), rather than rejecting it.
            justification: |
              Real-world SVG documents commonly size geometry as a percentage of their
              containing viewport; resolving these against a well-defined, spec-aligned basis
              lets this codec render such documents correctly instead of rejecting them
              outright.
            children:
              - CanvasNet-Codecs-SvgCodec-PercentageGeometryResolved
            tests:
              - SvgCodec_Load_RectXPercentage_ResolvesAgainstViewportWidth
              - SvgCodec_Load_RectWidthPercentage_ResolvesAgainstViewportWidth
              - SvgCodec_Load_RectYHeightPercentage_ResolvesAgainstViewportHeight
              - SvgCodec_Load_CircleCxCyRPercentage_ResolvesAgainstHorizontalVerticalAndDiagonalBases
              - SvgCodec_Load_LineCoordinatePercentage_ResolvesAgainstViewport
              - SvgCodec_Load_GradientCoordinatePercentage_UnaffectedByViewportPercentageResolution
              - SvgCodec_Load_StrokeWidthPercentage_ResolvesAgainstDiagonalBasis
              - SvgCodec_Load_FontSizePercentage_ResolvesAgainstParentFontSize
              - SvgCodec_Load_StrokeDasharrayPercentage_ResolvesAgainstDiagonalBasis

          - id: CanvasNet-Codecs-SvgXxeHardening
            title: >-
              The Codecs subsystem shall explicitly disable DTD processing and external entity
              resolution for SVG parsing (both Load and GetInfo), rejecting a document containing
              a DOCTYPE declaration with InvalidDataException.
            justification: |
              Defense-in-depth documentation clarity against XML External Entity (XXE) injection:
              a reader that processed a DOCTYPE or resolved an external entity could otherwise be
              tricked into reading arbitrary local files or making unexpected network requests
              merely by parsing a maliciously crafted SVG document.
            children:
              - CanvasNet-Codecs-SvgCodec-XxeHardening
            tests:
              - SvgCodec_Load_DocumentWithDoctypeDeclaration_ThrowsInvalidDataException
              - SvgCodec_Load_DocumentWithExternalEntityDoctype_ThrowsInvalidDataException
              - SvgCodec_GetInfo_DocumentWithExternalEntityDoctype_ThrowsInvalidDataException

          - id: CanvasNet-Codecs-SvgTolerateUnsupportedConstructs
            title: >-
              The Codecs subsystem shall silently skip well-formed but out-of-scope SVG elements,
              continuing to render the rest of the document, rather than rejecting the entire
              document.
            justification: |
              Real-world SVG documents commonly include constructs outside this codec's
              supported subset (such as filters, masks, or CSS styling); rejecting the entire
              document because of one such element would be needlessly strict when the rest of
              the document is renderable.
            children:
              - CanvasNet-Codecs-SvgCodec-UnsupportedConstructsIgnored
            tests:
              - SvgCodec_Load_UnsupportedConstructs_StillRendersRestOfDocument
              - SvgCodec_Load_ToleratesUnsupportedConstructFixture_StillRendersRemainingContent

          - id: CanvasNet-Codecs-SvgGetInfoValidation
            title: >-
              The Codecs subsystem shall reject invalid arguments passed to SVG GetInfo with the
              same exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
              - CanvasNet-Codecs-SvgCodec-ValidationNull
              - CanvasNet-Codecs-SvgCodec-ValidationEmptyPath
            tests:
              - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
              - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException
              - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

          - id: CanvasNet-Codecs-SvgCssStyling
            title: >-
              The Codecs subsystem shall render a style element's CSS rules against every
              element's type, class, id, universal, and compound selectors (including
              comma-separated lists and descendant/child combinators), resolving each cascaded
              presentation property through standard CSS specificity/cascade-order rules and a
              3-tier presentation-attribute/stylesheet/inline-style precedence, with the same
              resource-safety and malformed-input tolerance already established for this
              subsystem's other document-wide pre-passes.
            justification: |
              A style element with class/id/type selectors is a common, standard way real-world
              SVG documents centralize presentation; this subsystem previously discarded style
              elements entirely as an explicit out-of-scope simplification, so callers relying on
              CSS-driven styling need it to actually apply, with the same document-order,
              resource-safety, and tolerant-malformed-input conventions already established for
              this subsystem's other whole-document pre-passes (for example its id index) and
              reference-following features (gradients, patterns, filters).
            children:
              - CanvasNet-Codecs-SvgCodec-CssStyleElementParsing
              - CanvasNet-Codecs-SvgCodec-CssSelectorMatching
              - CanvasNet-Codecs-SvgCodec-CssCombinators
              - CanvasNet-Codecs-SvgCodec-CssSpecificityCascade
              - CanvasNet-Codecs-SvgCodec-CssThreeTierPrecedence
              - CanvasNet-Codecs-SvgCodec-CssResourceSafety
            tests:
              - SvgCodec_Load_CssTypeSelector_AppliesToMatchingElementType
              - SvgCodec_Load_CssSpecificity_HigherSpecificityWinsEvenIfEarlierInStylesheet
              - SvgCodec_Load_CssPrecedenceTier3_InlineStyleOverridesStylesheet
              - SvgCodec_Load_CssMalformedRule_SkipsOnlyThatRuleAndStillLoads
              - SvgCodec_Load_CssStylingFixture_AppliesEverySelectorKindAndPrecedenceTier
