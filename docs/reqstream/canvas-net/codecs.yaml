            title: >-
              The Codecs subsystem shall reject invalid arguments or malformed GIF data (including
              a zero-dimensioned Logical Screen Descriptor) passed to GetInfo with the same
              exception contract as Load.
            justification: |
              Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
            children:
