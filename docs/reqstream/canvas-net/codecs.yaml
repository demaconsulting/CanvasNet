          - id: CanvasNet-Codecs-TiffGetInfo
            title: >-
              The Codecs subsystem shall report a TIFF's width, height, samples-per-pixel, and alpha
              presence via GetInfo, given a stream or a file path, without decoding strip data and
              without enforcing Surface.MaxDimension, seeking directly to the IFD for a seekable
              stream, buffering the whole stream (matching Load's own unconditional buffering) as a
              fallback for a non-seekable stream, rejecting a tiled TIFF, and resolving
              stream-relative positions from wherever the caller's stream was actually positioned when
              GetInfo was invoked, identically to Load.
            justification: |
              Callers need to inspect a TIFF's declared dimensions and channel layout without paying
              the cost of decoding strip data, via a handful of small seeks rather than buffering
              the whole file when the stream is seekable. Unlike PNG/JPEG/BMP, a TIFF's IFD can
              legitimately be located anywhere in the file, so no bounded, purely sequential scan can
              reliably resolve every well-formed TIFF from a non-seekable source; rather than
              rejecting a non-seekable stream outright, GetInfo upholds the invariant that it never
              throws for an input Load would successfully decode by falling back to Load's own
              buffering strategy only when the stream genuinely cannot seek.
            children:
              - CanvasNet-Codecs-TiffCodec-GetInfo
              - CanvasNet-Codecs-TiffCodec-GetInfoTiledRejection
              - CanvasNet-Codecs-TiffCodec-GetInfoStreamBasePosition
