---
# Software Subsystem Requirements for Canvas
#
# These requirements decompose the CanvasNet system's pixel-buffer responsibilities into the
# Canvas subsystem's own responsibility: providing a mutable, in-memory 32-bit RGBA pixel
# buffer (the Surface unit) and its pixel value type (the Rgba32 unit). Each requirement here
# links down to the Surface unit requirement that implements it.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Canvas Requirements
        requirements:
          - id: CanvasNet-Canvas-Construction
            title: The Canvas subsystem shall provide construction of a pixel buffer with a specified width and height.
            justification: |
              Callers must be able to allocate a pixel buffer of a chosen size before any pixel data
              can be stored or manipulated; this is the entry point for all Canvas subsystem
              functionality.
            children:
              - CanvasNet-Canvas-Surface-Construction
            tests:
              - Surface_Constructor_ValidDimensions_SetsWidthAndHeight

          - id: CanvasNet-Canvas-ZeroInitialized
            title: The Canvas subsystem shall initialize a newly constructed pixel buffer to fully transparent.
            justification: |
              A predictable, documented initial state (fully transparent black) lets callers rely on
              untouched regions contributing nothing to composited output, without needing to
              explicitly clear the buffer themselves.
            children:
              - CanvasNet-Canvas-Surface-ZeroInitialized
            tests:
              - Surface_Constructor_ValidDimensions_BufferIsAllZero

          - id: CanvasNet-Canvas-InvalidWidth
            title: The Canvas subsystem shall reject a non-positive width argument with ArgumentOutOfRangeException.
            justification: |
              A zero or negative width cannot back a valid pixel buffer; rejecting it at construction
              time prevents an unusable instance from ever being created.
            children:
              - CanvasNet-Canvas-Surface-InvalidWidth
            tests:
              - Surface_Constructor_ZeroWidth_ThrowsArgumentOutOfRangeException
              - Surface_Constructor_NegativeWidth_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-InvalidHeight
            title: The Canvas subsystem shall reject a non-positive height argument with ArgumentOutOfRangeException.
            justification: |
              A zero or negative height cannot back a valid pixel buffer; rejecting it at construction
              time prevents an unusable instance from ever being created.
            children:
              - CanvasNet-Canvas-Surface-InvalidHeight
            tests:
              - Surface_Constructor_ZeroHeight_ThrowsArgumentOutOfRangeException
              - Surface_Constructor_NegativeHeight_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-PixelGet
            title: The Canvas subsystem shall allow reading the pixel at a specified coordinate.
            justification: |
              Single-pixel inspection is a fundamental capability for callers that need to examine or
              verify individual pixel values without processing an entire row.
            children:
              - CanvasNet-Canvas-Surface-PixelGet
            tests:
              - Surface_Indexer_SetThenGet_ReturnsStoredPixel

          - id: CanvasNet-Canvas-PixelSet
            title: The Canvas subsystem shall allow writing the pixel at a specified coordinate.
            justification: |
              Single-pixel modification is a fundamental capability for callers that need to draw or
              update individual pixel values without processing an entire row.
            children:
              - CanvasNet-Canvas-Surface-PixelSet
            tests:
              - Surface_Indexer_SetThenGet_ReturnsStoredPixel

          - id: CanvasNet-Canvas-RowSpanBytes
            title: The Canvas subsystem shall expose a row's raw bytes as a mutable Span<byte>.
            justification: |
              Bulk, allocation-free access to a row's raw bytes is required for efficient pixel
              processing and for interoperating with byte-oriented APIs (for example the Codecs
              subsystem).
            children:
              - CanvasNet-Canvas-Surface-RowSpanBytes
            tests:
              - Surface_GetRowSpanBytes_WriteToSpan_IndexerReflectsChange

          - id: CanvasNet-Canvas-RowSpanPixels
            title: The Canvas subsystem shall expose a row's pixels as a mutable Span<Rgba32>.
            justification: |
              Bulk, allocation-free access to a row's pixels as strongly typed Rgba32 values is
              required for efficient pixel processing without manual byte-offset arithmetic.
            children:
              - CanvasNet-Canvas-Surface-RowSpanPixels
            tests:
              - Surface_GetRowSpan_WriteToSpan_IndexerReflectsChange

          - id: CanvasNet-Canvas-Crop
            title: The Canvas subsystem shall create a new pixel buffer containing a copy of a rectangular sub-region.
            justification: |
              Extracting a sub-region into its own buffer is required for callers that need to work
              with, save, or further process a portion of a larger surface independently.
            children:
              - CanvasNet-Canvas-Surface-Crop
            tests:
              - Surface_Crop_ValidRegion_ReturnsExpectedPixels

          - id: CanvasNet-Canvas-CropIndependent
            title: The Canvas subsystem shall ensure the buffer returned by Crop does not share storage with the source.
            justification: |
              Callers must be able to mutate either the cropped result or the original surface without
              unexpected side effects on the other; shared storage would violate this expectation.
            children:
              - CanvasNet-Canvas-Surface-CropIndependent
            tests:
              - Surface_Crop_ModifyResult_DoesNotAffectSource
              - Surface_Crop_ModifySource_DoesNotAffectResult

          - id: CanvasNet-Canvas-CropInvalidX
            title: The Canvas subsystem shall reject a negative x argument to Crop with ArgumentOutOfRangeException.
            justification: |
              A negative x coordinate cannot identify a valid region of the source surface; rejecting
              it prevents an out-of-bounds read.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidX
            tests:
              - Surface_Crop_NegativeX_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropInvalidY
            title: The Canvas subsystem shall reject a negative y argument to Crop with ArgumentOutOfRangeException.
            justification: |
              A negative y coordinate cannot identify a valid region of the source surface; rejecting
              it prevents an out-of-bounds read.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidY
            tests:
              - Surface_Crop_NegativeY_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropInvalidWidth
            title: >-
              The Canvas subsystem shall reject a non-positive width argument to Crop with
              ArgumentOutOfRangeException.
            justification: |
              A zero or negative width cannot describe a valid region to copy; rejecting it prevents
              an unusable or empty result buffer from being created.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidWidth
            tests:
              - Surface_Crop_ZeroWidth_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropInvalidHeight
            title: >-
              The Canvas subsystem shall reject a non-positive height argument to Crop with
              ArgumentOutOfRangeException.
            justification: |
              A zero or negative height cannot describe a valid region to copy; rejecting it prevents
              an unusable or empty result buffer from being created.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidHeight
            tests:
              - Surface_Crop_ZeroHeight_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropExceedsWidth
            title: >-
              The Canvas subsystem shall reject a Crop region whose x plus width exceeds the source
              width with ArgumentOutOfRangeException.
            justification: |
              A region extending past the right edge of the source surface would require reading
              out-of-bounds memory; rejecting it prevents an invalid or corrupted copy.
            children:
              - CanvasNet-Canvas-Surface-CropExceedsWidth
            tests:
              - Surface_Crop_WidthExceedsSourceBounds_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropExceedsHeight
            title: >-
              The Canvas subsystem shall reject a Crop region whose y plus height exceeds the source
              height with ArgumentOutOfRangeException.
            justification: |
              A region extending past the bottom edge of the source surface would require reading
              out-of-bounds memory; rejecting it prevents an invalid or corrupted copy.
            children:
              - CanvasNet-Canvas-Surface-CropExceedsHeight
            tests:
              - Surface_Crop_HeightExceedsSourceBounds_ThrowsArgumentOutOfRangeException
