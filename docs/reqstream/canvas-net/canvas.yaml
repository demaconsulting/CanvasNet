---
# cspell:ignore otsu bilinear ssim
# Software Subsystem Requirements for Canvas
#
# These requirements decompose the CanvasNet system's pixel-buffer responsibilities into the
# Canvas subsystem's own responsibility: providing a mutable, in-memory 32-bit RGBA pixel
# buffer (the Surface unit with its SurfaceAdjustments, SurfaceTransforms, SurfaceGeometry, SurfaceComparison, and
# SurfaceAnalysis parts), its pixel value type (the
# Rgba32 unit), and the shared CSS color parser (the
# CssColor unit). Each requirement here
# links down to the unit requirement that implements it.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Canvas Requirements
        requirements:
          - id: CanvasNet-Canvas-Construction
            title: The Canvas subsystem shall provide construction of a pixel buffer with a specified width and height.
            justification: |
              Callers must be able to allocate a pixel buffer of a chosen size before any pixel data
              can be stored or manipulated; this is the entry point for all Canvas subsystem
              functionality.
            children:
              - CanvasNet-Canvas-Surface-Construction
            tests:
              - Surface_Constructor_ValidDimensions_SetsWidthAndHeight

          - id: CanvasNet-Canvas-ZeroInitialized
            title: The Canvas subsystem shall initialize a newly constructed pixel buffer to fully transparent.
            justification: |
              A predictable, documented initial state (fully transparent black) lets callers rely on
              untouched regions contributing nothing to composited output, without needing to
              explicitly clear the buffer themselves.
            children:
              - CanvasNet-Canvas-Surface-ZeroInitialized
            tests:
              - Surface_Constructor_ValidDimensions_BufferIsAllZero

          - id: CanvasNet-Canvas-InvalidWidth
            title: The Canvas subsystem shall reject a non-positive width argument with ArgumentOutOfRangeException.
            justification: |
              A zero or negative width cannot back a valid pixel buffer; rejecting it at construction
              time prevents an unusable instance from ever being created.
            children:
              - CanvasNet-Canvas-Surface-InvalidWidth
            tests:
              - Surface_Constructor_ZeroWidth_ThrowsArgumentOutOfRangeException
              - Surface_Constructor_NegativeWidth_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-InvalidHeight
            title: The Canvas subsystem shall reject a non-positive height argument with ArgumentOutOfRangeException.
            justification: |
              A zero or negative height cannot back a valid pixel buffer; rejecting it at construction
              time prevents an unusable instance from ever being created.
            children:
              - CanvasNet-Canvas-Surface-InvalidHeight
            tests:
              - Surface_Constructor_ZeroHeight_ThrowsArgumentOutOfRangeException
              - Surface_Constructor_NegativeHeight_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-WidthExceedsMaximum
            title: >-
              The Canvas subsystem shall reject a width argument exceeding the maximum permitted
              dimension with ArgumentOutOfRangeException.
            justification: |
              A width beyond the maximum permitted dimension would make the row-stride and
              buffer-size arithmetic unsafe from plain int overflow; rejecting it at construction
              time prevents an instance from ever being created with an unsafe size.
            children:
              - CanvasNet-Canvas-Surface-WidthExceedsMaximum
            tests:
              - Surface_Constructor_WidthExceedsMaximum_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-HeightExceedsMaximum
            title: >-
              The Canvas subsystem shall reject a height argument exceeding the maximum permitted
              dimension with ArgumentOutOfRangeException.
            justification: |
              A height beyond the maximum permitted dimension would make the row-stride and
              buffer-size arithmetic unsafe from plain int overflow; rejecting it at construction
              time prevents an instance from ever being created with an unsafe size.
            children:
              - CanvasNet-Canvas-Surface-HeightExceedsMaximum
            tests:
              - Surface_Constructor_HeightExceedsMaximum_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-MaxDimensionPublic
            title: >-
              The Canvas subsystem shall expose its maximum permitted pixel-buffer dimension as a
              public constant.
            justification: |
              Callers probing untrusted or unknown-source image headers need to compare declared
              dimensions against the same maximum dimension the Canvas subsystem enforces, before
              allocating a pixel buffer.
            children:
              - CanvasNet-Canvas-Surface-MaxDimensionPublic
            tests:
              - Surface_MaxDimension_IsPubliclyAccessible_Equals8192

          - id: CanvasNet-Canvas-PixelGet
            title: The Canvas subsystem shall allow reading the pixel at a specified coordinate.
            justification: |
              Single-pixel inspection is a fundamental capability for callers that need to examine or
              verify individual pixel values without processing an entire row.
            children:
              - CanvasNet-Canvas-Surface-PixelGet
            tests:
              - Surface_Indexer_SetThenGet_ReturnsStoredPixel

          - id: CanvasNet-Canvas-PixelSet
            title: The Canvas subsystem shall allow writing the pixel at a specified coordinate.
            justification: |
              Single-pixel modification is a fundamental capability for callers that need to draw or
              update individual pixel values without processing an entire row.
            children:
              - CanvasNet-Canvas-Surface-PixelSet
            tests:
              - Surface_Indexer_SetThenGet_ReturnsStoredPixel

          - id: CanvasNet-Canvas-RowSpanBytes
            title: The Canvas subsystem shall expose a row's raw bytes as a mutable Span<byte>.
            justification: |
              Bulk, allocation-free access to a row's raw bytes is required for efficient pixel
              processing and for interoperating with byte-oriented APIs (for example the Codecs
              subsystem).
            children:
              - CanvasNet-Canvas-Surface-RowSpanBytes
            tests:
              - Surface_GetRowSpanBytes_WriteToSpan_IndexerReflectsChange

          - id: CanvasNet-Canvas-RowSpanPixels
            title: The Canvas subsystem shall expose a row's pixels as a mutable Span<Rgba32>.
            justification: |
              Bulk, allocation-free access to a row's pixels as strongly typed Rgba32 values is
              required for efficient pixel processing without manual byte-offset arithmetic.
            children:
              - CanvasNet-Canvas-Surface-RowSpanPixels
            tests:
              - Surface_GetRowSpan_WriteToSpan_IndexerReflectsChange

          - id: CanvasNet-Canvas-Crop
            title: The Canvas subsystem shall create a new pixel buffer containing a copy of a rectangular sub-region.
            justification: |
              Extracting a sub-region into its own buffer is required for callers that need to work
              with, save, or further process a portion of a larger surface independently.
            children:
              - CanvasNet-Canvas-Surface-Crop
            tests:
              - Surface_Crop_ValidRegion_ReturnsExpectedPixels

          - id: CanvasNet-Canvas-CropIndependent
            title: The Canvas subsystem shall ensure the buffer returned by Crop does not share storage with the source.
            justification: |
              Callers must be able to mutate either the cropped result or the original surface without
              unexpected side effects on the other; shared storage would violate this expectation.
            children:
              - CanvasNet-Canvas-Surface-CropIndependent
            tests:
              - Surface_Crop_ModifyResult_DoesNotAffectSource
              - Surface_Crop_ModifySource_DoesNotAffectResult

          - id: CanvasNet-Canvas-CropInvalidX
            title: The Canvas subsystem shall reject a negative x argument to Crop with ArgumentOutOfRangeException.
            justification: |
              A negative x coordinate cannot identify a valid region of the source surface; rejecting
              it prevents an out-of-bounds read.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidX
            tests:
              - Surface_Crop_NegativeX_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropInvalidY
            title: The Canvas subsystem shall reject a negative y argument to Crop with ArgumentOutOfRangeException.
            justification: |
              A negative y coordinate cannot identify a valid region of the source surface; rejecting
              it prevents an out-of-bounds read.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidY
            tests:
              - Surface_Crop_NegativeY_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropInvalidWidth
            title: >-
              The Canvas subsystem shall reject a non-positive width argument to Crop with
              ArgumentOutOfRangeException.
            justification: |
              A zero or negative width cannot describe a valid region to copy; rejecting it prevents
              an unusable or empty result buffer from being created.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidWidth
            tests:
              - Surface_Crop_ZeroWidth_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropInvalidHeight
            title: >-
              The Canvas subsystem shall reject a non-positive height argument to Crop with
              ArgumentOutOfRangeException.
            justification: |
              A zero or negative height cannot describe a valid region to copy; rejecting it prevents
              an unusable or empty result buffer from being created.
            children:
              - CanvasNet-Canvas-Surface-CropInvalidHeight
            tests:
              - Surface_Crop_ZeroHeight_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropExceedsWidth
            title: >-
              The Canvas subsystem shall reject a Crop region whose x plus width exceeds the source
              width with ArgumentOutOfRangeException.
            justification: |
              A region extending past the right edge of the source surface would require reading
              out-of-bounds memory; rejecting it prevents an invalid or corrupted copy.
            children:
              - CanvasNet-Canvas-Surface-CropExceedsWidth
            tests:
              - Surface_Crop_WidthExceedsSourceBounds_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CropExceedsHeight
            title: >-
              The Canvas subsystem shall reject a Crop region whose y plus height exceeds the source
              height with ArgumentOutOfRangeException.
            justification: |
              A region extending past the bottom edge of the source surface would require reading
              out-of-bounds memory; rejecting it prevents an invalid or corrupted copy.
            children:
              - CanvasNet-Canvas-Surface-CropExceedsHeight
            tests:
              - Surface_Crop_HeightExceedsSourceBounds_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-PremultiplyAlpha
            title: >-
              The Canvas subsystem shall convert a pixel buffer, in place, from straight alpha to
              premultiplied alpha.
            justification: |
              Premultiplied alpha is required for numerically correct alpha compositing and is a
              prerequisite building block for compositing; callers must be able to convert an
              in-memory buffer between the two representations.
            children:
              - CanvasNet-Canvas-Surface-PremultiplyAlpha
            tests:
              - Surface_PremultiplyAlpha_VariousValues_ComputesExpectedPixels

          - id: CanvasNet-Canvas-UnpremultiplyAlpha
            title: >-
              The Canvas subsystem shall convert a pixel buffer, in place, from premultiplied alpha
              back to straight alpha, defining R = G = B = 0 for fully transparent pixels.
            justification: |
              Callers that have premultiplied a buffer for compositing must be able to convert it
              back to the straight-alpha representation expected by codecs; the fully transparent
              case has no recoverable color information, so a documented, deterministic result is
              required.
            children:
              - CanvasNet-Canvas-Surface-UnpremultiplyAlpha
            tests:
              - Surface_UnpremultiplyAlpha_VariousValues_ComputesExpectedPixels
              - Surface_UnpremultiplyAlpha_AlphaZero_ResultIsZeroRgb

          - id: CanvasNet-Canvas-CompositeOverSurface
            title: >-
              The Canvas subsystem shall composite one pixel buffer "over" another in place, using
              standard Porter-Duff "over" alpha compositing.
            justification: |
              Alpha compositing of one buffer over another is a fundamental raster-graphics
              operation that callers need without hand-rolling the per-pixel math themselves.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverSurface
            tests:
              - Surface_CompositeOverSurface_OpaqueForeground_ReplacesBackground
              - Surface_CompositeOverSurface_TransparentForeground_LeavesBackgroundUnchanged
              - Surface_CompositeOverSurface_PartialAlpha_MatchesIndependentlyComputedResult

          - id: CanvasNet-Canvas-CompositeOverSurfaceNull
            title: >-
              The Canvas subsystem shall reject a null foreground argument to composite-over with
              ArgumentNullException.
            justification: |
              A null foreground buffer cannot supply pixel data to composite; rejecting it early
              prevents a confusing failure deeper in the implementation.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverSurfaceNull
            tests:
              - Surface_CompositeOverSurface_NullForeground_ThrowsArgumentNullException

          - id: CanvasNet-Canvas-CompositeOverSurfaceDimensionMismatch
            title: >-
              The Canvas subsystem shall reject a composite-over foreground argument whose
              dimensions do not match the target buffer with ArgumentException.
            justification: |
              Only equal-size, axis-aligned compositing is supported; a mismatched foreground
              buffer has no well-defined per-pixel correspondence, so it must be rejected rather
              than silently truncated or misaligned.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverSurfaceDimensionMismatch
            tests:
              - Surface_CompositeOverSurface_WidthMismatch_ThrowsArgumentException
              - Surface_CompositeOverSurface_HeightMismatch_ThrowsArgumentException

          - id: CanvasNet-Canvas-CompositeOverColor
            title: >-
              The Canvas subsystem shall composite a constant color "over" every pixel of a buffer
              in place, using standard Porter-Duff "over" alpha compositing.
            justification: |
              Tinting or overlaying a buffer with a single constant color is a common operation
              that should not require callers to allocate a full same-size buffer filled with that
              color.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverColor
            tests:
              - Surface_CompositeOverColor_OpaqueColor_ReplacesBackground
              - Surface_CompositeOverColor_TransparentColor_LeavesBackgroundUnchanged
              - Surface_CompositeOverColor_PartialAlpha_MatchesIndependentlyComputedResult

          - id: CanvasNet-Canvas-Clear
            title: >-
              The Canvas subsystem shall fill every pixel of a buffer with a constant color in
              place, overwriting rather than blending against existing pixel data.
            justification: |
              Establishing a solid background fill before drawing is a common operation that
              should be a single vectorized bulk fill rather than a per-pixel loop, and must
              overwrite rather than blend so it behaves predictably regardless of what pixel data
              a buffer previously held.
            children:
              - CanvasNet-Canvas-Surface-Clear
            tests:
              - Surface_Clear_MultiRowSurfaceWithNonAlignedWidth_OverwritesEveryPixel
              - Surface_Clear_AnyRgba32Value_NeverThrowsAndAppliesExactly
              - Surface_Clear_TransparentColorOverOpaqueBackground_OverwritesRatherThanBlending
              - CanvasNet_SystemIntegration_ClearSurfaceThenReadPixel_ReturnsExpectedColor

          - id: CanvasNet-Canvas-CompositeOverSpan
            title: >-
              The Canvas subsystem shall composite a constant color "over" a horizontal run of
              pixels within a single row in place, scaling the color's effective alpha at each
              pixel by a caller-supplied per-pixel coverage value, using standard Porter-Duff
              "over" alpha compositing.
            justification: |
              A per-pixel-coverage caller (for example the Drawing subsystem's antialiased fill
              rasterizer, which already consumes this method via `PathFiller.Fill`) needs to
              composite an arbitrary sub-range of a single row directly, without allocating a
              full-row or full-surface buffer merely to hold mostly-untouched pixels.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverSpan
              - CanvasNet-Canvas-Surface-CompositeOverSpanZeroCoveragePreservesBytes
              - CanvasNet-Canvas-Surface-SpanWorkspaceCache
            tests:
              - Surface_CompositeOverSpan_FullCoverage_MatchesCompositeOverColor
              - Surface_CompositeOverSpan_ZeroCoverage_LeavesBackgroundUnchanged
              - Surface_CompositeOverSpan_PartialCoverage_MatchesLinearInterpolationOracle
              - Surface_CompositeOverSpan_MultiPixelRun_AppliesPerPixelCoverage

          - id: CanvasNet-Canvas-CompositeOverSpanValidation
            title: >-
              The Canvas subsystem shall reject an out-of-range row or column argument to
              composite-over-span with ArgumentOutOfRangeException.
            justification: |
              A row outside the buffer's height, or a column range extending outside the buffer's
              width, cannot identify a valid run of pixels to composite; rejecting it prevents an
              out-of-bounds read or write.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverSpanValidation
            tests:
              - Surface_CompositeOverSpan_NegativeY_ThrowsArgumentOutOfRangeException
              - Surface_CompositeOverSpan_YAtHeight_ThrowsArgumentOutOfRangeException
              - Surface_CompositeOverSpan_NegativeX_ThrowsArgumentOutOfRangeException
              - Surface_CompositeOverSpan_RunExceedsWidth_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Canvas-CompositeOverSpanPerPixelColor
            title: >-
              The Canvas subsystem shall composite an independent color, supplied per pixel, "over"
              a horizontal run of pixels within a single row in place, scaling each pixel's own
              color's effective alpha by that same pixel's caller-supplied coverage value in
              [0, 1], producing results identical to the constant-color composite whenever every
              supplied color happens to be equal.
            justification: |
              A caller painting a per-pixel varying color source (for example a gradient) across a
              row needs to supply a distinct color for every pixel in the run, not only a single
              shared color, while remaining fully consistent with the existing constant-color
              composite-over-span capability.
            children:
              - CanvasNet-Canvas-Surface-CompositeOverSpanPerPixelColor
            tests:
              - Surface_CompositeOverSpan_PerPixelColors_MatchesConstantColorOverload_WhenAllColorsEqual
              - Surface_CompositeOverSpan_PerPixelColors_FullCoverage_AppliesEachPixelsOwnColor
              - Surface_CompositeOverSpan_PerPixelColors_LengthMismatch_ThrowsArgumentException

          - id: CanvasNet-Canvas-Rgba32
            title: >-
              The Canvas subsystem shall parse an Rgba32 pixel value from a "#RRGGBB" or
              "#AARRGGBB" hex color literal string, case-insensitively, via both a throwing
              Parse method and a non-throwing TryParse method, and render it as a readable
              "Rgba32(R, G, B, A)" string.
            justification: |
              Callers commonly author colors as web-style hex string literals (for example from
              configuration or markup); parsing them directly into Rgba32 avoids callers
              hand-decoding hex digits themselves. A stable readable rendering aids diagnostics.
            children:
              - CanvasNet-Canvas-Rgba32-ParseSixHex
              - CanvasNet-Canvas-Rgba32-ParseEightHex
              - CanvasNet-Canvas-Rgba32-ParseValidation
              - CanvasNet-Canvas-Rgba32-TryParse
              - CanvasNet-Canvas-Rgba32-ToString
            tests:
              - Rgba32_Parse_6HexUppercase_ReturnsExpectedRgbaWithAlpha255
              - Rgba32_TryParse_ValidInput_ReturnsTrueAndSetsResult

          - id: CanvasNet-Canvas-CssColor
            title: >-
              The Canvas subsystem shall parse CSS color text (hexadecimal forms, the 148 named colors
              and transparent, and the rgb, rgba, hsl, and hsla functions) into an Rgba32 pixel value
              with a throwing and a non-throwing method, expose the hexadecimal-digit and named-color
              parsers on their own, clamp and round half away from zero, and format an Rgba32 as CSS
              text.
            justification: |
              Colors are written as text in style sheets, chart specifications, scripts, and command
              lines; one shared grammar resolves the same text to the same pixel in every CanvasNet
              package, and consumers with a narrower grammar reuse its building blocks.
            children:
              - CanvasNet-Canvas-CssColor-ParseHex
              - CanvasNet-Canvas-CssColor-NamedColors
              - CanvasNet-Canvas-CssColor-Functions
              - CanvasNet-Canvas-CssColor-RoundingAndClamping
              - CanvasNet-Canvas-CssColor-InvalidText
              - CanvasNet-Canvas-CssColor-ToCss
            tests:
              - CssColor_TryParse_FunctionForms_MatchExpectedPixels
              - CssColor_TryGetNamedColor_Names_ReturnTheCssTableEntries

          - id: CanvasNet-Canvas-SurfaceCopy
            title: >-
              The Canvas subsystem shall create an independent copy of a surface and copy the pixels of one
              surface onto another at a position, opaquely and clipped to the destination.
            justification: |
              Working on a copy, and placing sheets, borders, and tiles into a larger surface, are needed by
              every renderer and by the image tools; one tested copy replaces the hand-written row loops each
              consumer would otherwise repeat.
            children:
              - CanvasNet-Canvas-Surface-Clone
              - CanvasNet-Canvas-Surface-CopyFrom
              - CanvasNet-Canvas-Surface-CopyFromClipped
              - CanvasNet-Canvas-Surface-CopyFromInvalid
            tests:
              - Surface_Clone_ValidSurface_ReturnsIdenticalPixels
              - Surface_CopyFrom_InsideDestination_ReplacesPixelsWithoutBlending
              - Surface_CopyFrom_PartlyOutside_ClipsToDestination

          - id: CanvasNet-Canvas-SurfaceAdjustments
            title: >-
              The Canvas subsystem shall adjust the tone and color of a surface in place (grayscale, invert, fixed
              and Otsu thresholds, levels, brightness, contrast, and auto-levels), with a fixed-point luma over
              white and results that do not depend on the number of cores.
            justification: |
              Reading and preparing photographs and scans needs tone adjustments whose arithmetic is documented
              and repeatable; offering them in the core library lets every package and library user share them.
            children:
              - CanvasNet-Canvas-SurfaceAdjustments-Luma
              - CanvasNet-Canvas-SurfaceAdjustments-Grayscale
              - CanvasNet-Canvas-SurfaceAdjustments-Invert
              - CanvasNet-Canvas-SurfaceAdjustments-Threshold
              - CanvasNet-Canvas-SurfaceAdjustments-Otsu
              - CanvasNet-Canvas-SurfaceAdjustments-Levels
              - CanvasNet-Canvas-SurfaceAdjustments-BrightnessContrast
              - CanvasNet-Canvas-SurfaceAdjustments-AutoLevels
              - CanvasNet-Canvas-SurfaceAdjustments-Deterministic
              - CanvasNet-Canvas-SurfaceAdjustments-Arguments
            tests:
              - Surface_Luma_OpaqueAndTranslucentPixels_UsesFixedPointWeightsOverWhite
              - Surface_Grayscale_ColorPixels_SetsEqualChannelsAndKeepsAlpha
              - Surface_AutoLevels_LowContrastImage_StretchesToFullRange

          - id: CanvasNet-Canvas-SurfaceTransforms
            title: >-
              The Canvas subsystem shall provide the pure whole-surface transformations flip, half turn, EXIF
              orientation, pad, trim, fit into a box, and flatten over a color, each returning a new surface and
              leaving the source unchanged.
            justification: |
              Mirroring, turning a camera photograph upright, margins, content cropping, box fitting, and
              transparency removal are the basic operations of image preparation; as pure functions of the core
              surface they are reusable and easy to verify.
            children:
              - CanvasNet-Canvas-SurfaceTransforms-Flip
              - CanvasNet-Canvas-SurfaceTransforms-ExifOrientation
              - CanvasNet-Canvas-SurfaceTransforms-Pad
              - CanvasNet-Canvas-SurfaceTransforms-Trim
              - CanvasNet-Canvas-SurfaceTransforms-FitInto
              - CanvasNet-Canvas-SurfaceTransforms-Flatten
              - CanvasNet-Canvas-SurfaceTransforms-Disposed
            tests:
              - Surface_Flip_Pixels_MirrorAboutTheAxes
              - Surface_Pad_Border_AddsColoredBorderAndCopiesPixels
              - Surface_FindTrimBounds_UniformBorder_ReturnsContentBox
              - Surface_ApplyExifOrientation_Orientation_MapsPixels

          - id: CanvasNet-Canvas-SurfaceGeometry
            title: >-
              The Canvas subsystem shall rotate a surface by any angle onto an expanded canvas with a fill color
              (nearest or bilinear sampling, refusing a canvas larger than the maximum surface size), and shall
              estimate the skew of the dominant near-horizontal lines of a surface, with exact, repeatable results
              that do not depend on the number of cores.
            justification: |
              A photograph of a page or a sketch is rarely level; estimating its tilt and rotating by an arbitrary
              angle without losing corners are the geometric steps that turn it into a usable picture, and the
              arithmetic belongs in the core library where every package and library user can share it.
            children:
              - CanvasNet-Canvas-SurfaceGeometry-RotatedSize
              - CanvasNet-Canvas-SurfaceGeometry-RotateMapping
              - CanvasNet-Canvas-SurfaceGeometry-RotateFill
              - CanvasNet-Canvas-SurfaceGeometry-RotateFilter
              - CanvasNet-Canvas-SurfaceGeometry-RotateLimit
              - CanvasNet-Canvas-SurfaceGeometry-SkewEstimate
              - CanvasNet-Canvas-SurfaceGeometry-SkewNoStructure
              - CanvasNet-Canvas-SurfaceGeometry-SkewDeterministic
              - CanvasNet-Canvas-SurfaceGeometry-Arguments
            tests:
              - Surface_RotateArbitrary_Corners_AreFillColor
              - Surface_EstimateSkew_TiltedLines_FindsAngleWithinTolerance

          - id: CanvasNet-Canvas-SurfaceComparison
            title: >-
              The Canvas subsystem shall compare two surfaces of the same size with exact, repeatable error and
              similarity measures and a grid of per-cell errors, and shall create a difference image, an overlay,
              and a side-by-side image of them.
            justification: |
              Judging how close a redraw is to its reference, and where it differs, needs numbers that agree
              between runs and pictures that show the difference; one tested implementation in the core library
              serves every package and library user.
            children:
              - CanvasNet-Canvas-SurfaceComparison-ErrorMetrics
              - CanvasNet-Canvas-SurfaceComparison-Ssim
              - CanvasNet-Canvas-SurfaceComparison-DiffPixels
              - CanvasNet-Canvas-SurfaceComparison-Grid
              - CanvasNet-Canvas-SurfaceComparison-DiffImage
              - CanvasNet-Canvas-SurfaceComparison-Overlay
              - CanvasNet-Canvas-SurfaceComparison-SideBySide
              - CanvasNet-Canvas-SurfaceComparison-Arguments
              - CanvasNet-Canvas-SurfaceComparison-Deterministic
            tests:
              - Surface_Compare_KnownDifference_ComputesMaeRmseAndPsnr
              - Surface_CreateDiff_Heat_MapsDeltaThroughHotRamp

          - id: CanvasNet-Canvas-SurfaceAnalysis
            title: >-
              The Canvas subsystem shall report the dominant colors and luma statistics of a surface, and the
              pixel at a point with the mean of its neighborhood, with exact results that are the same on every
              run.
            justification: |
              Choosing how to adjust or convert an image starts from what it contains; reporting its colors, its
              brightness distribution, and single pixels from the core library lets every package and library user
              ask without writing the counting code.
            children:
              - CanvasNet-Canvas-SurfaceAnalysis-Quantize
              - CanvasNet-Canvas-SurfaceAnalysis-Dominant
              - CanvasNet-Canvas-SurfaceAnalysis-Alpha
              - CanvasNet-Canvas-SurfaceAnalysis-LumaStats
              - CanvasNet-Canvas-SurfaceAnalysis-Sample
              - CanvasNet-Canvas-SurfaceAnalysis-Deterministic
              - CanvasNet-Canvas-SurfaceAnalysis-Arguments
            tests:
              - Surface_Analyze_FourBitBuckets_GroupNearbyShadesIntoOneColor
              - Surface_Sample_Radius_ReturnsClippedWindowAndMean

          - id: CanvasNet-Canvas-Resize
            title: >-
              The Canvas subsystem shall create a resampled copy of a surface at a requested size using a
              selectable filter.
            justification: |
              Enlarging and shrinking images with a quality filter is a core imaging operation, and
              the same engine serves the renderer packages that draw raster images.
            children:
              - CanvasNet-Canvas-Surface-Resize
              - CanvasNet-Canvas-Surface-ResizeIdentity
              - CanvasNet-Canvas-Surface-ResizeBoundedMemory
              - CanvasNet-Canvas-Surface-ResizePooledBuffers
              - CanvasNet-Canvas-Surface-DeviceResample
              - CanvasNet-Canvas-Surface-WrappedBilinear
            tests:
              - Resize_AllModes_ProduceRequestedSize

          - id: CanvasNet-Canvas-ResizeAlpha
            title: The Canvas subsystem shall resample in premultiplied alpha.
            justification: |
              Premultiplied filtering prevents color bleeding from transparent pixels.
            children:
              - CanvasNet-Canvas-Surface-ResizeAlphaPremultiplied
            tests:
              - Resize_AlphaEdge_HasNoColorFringe

          - id: CanvasNet-Canvas-ResizeValidation
            title: The Canvas subsystem shall reject invalid resize arguments and disposed surfaces.
            justification: |
              Invalid arguments must fail fast and predictably before any buffer is allocated.
            children:
              - CanvasNet-Canvas-Surface-ResizeInvalid
            tests:
              - Resize_InvalidDimensions_Throws

          - id: CanvasNet-Canvas-ResizeToFit
            title: The Canvas subsystem shall resize a surface to fit a bounding box while preserving its aspect ratio.
            justification: |
              Bounding-box sizing is the common way callers request thumbnails and previews.
            children:
              - CanvasNet-Canvas-Surface-ResizeToFit
              - CanvasNet-Canvas-Surface-ResizeToFitInvalidBox
            tests:
              - ResizeToFit_KeepsAspectAndFitsBox

          - id: CanvasNet-Canvas-PixelCompositing
            title: >-
              The Canvas subsystem shall provide a public single-pixel Porter-Duff "over" alpha-
              compositing helper on Rgba32 that yields the same result as Surface's own
              CompositeOver of a constant color for every pixel.
            justification: |
              Code that blends one sampled pixel at a time (for example an image resampler
              compositing each sample onto a destination Surface) needs the same result as the
              row-based surface operation; one tested public helper avoids each such caller
              keeping its own, divergent copy of the blending math.
            children:
              - CanvasNet-Canvas-Rgba32-CompositeOver
              - CanvasNet-Canvas-Surface-ImageResampling
              - CanvasNet-Canvas-Surface-BilinearSampling
            tests:
              - Rgba32_CompositeOver_PartiallyTransparentForegroundOverOpaqueBackground_BlendsExactly

          - id: CanvasNet-Canvas-Disposal
            title: >-
              The Canvas subsystem shall provide explicit resource-lifetime management for its
              pixel buffer, logically releasing it on demand and rejecting further use once
              released.
            justification: |
              Reserving the option to back the pixel buffer with a pooled (ArrayPool-rented)
              array in a future release - without another breaking API change - requires an
              explicit disposal contract to exist on the buffer type from the start.
            children:
              - CanvasNet-Canvas-Surface-Disposal
            tests:
              - Surface_Dispose_CalledOnce_DoesNotThrow
              - Surface_Dispose_CalledTwice_DoesNotThrow
              - Surface_IndexerGet_AfterDispose_ThrowsObjectDisposedException
              - Surface_IndexerSet_AfterDispose_ThrowsObjectDisposedException
              - Surface_GetRowSpanBytes_AfterDispose_ThrowsObjectDisposedException
              - Surface_GetRowSpan_AfterDispose_ThrowsObjectDisposedException
              - Surface_Crop_AfterDispose_ThrowsObjectDisposedException
              - Surface_Clone_AfterDispose_ThrowsObjectDisposedException
              - Surface_PremultiplyAlpha_AfterDispose_ThrowsObjectDisposedException
              - Surface_UnpremultiplyAlpha_AfterDispose_ThrowsObjectDisposedException
              - Surface_CompositeOverSurface_AfterDispose_ThrowsObjectDisposedException
              - Surface_CompositeOverSurface_ForegroundDisposed_ThrowsObjectDisposedException
              - Surface_CompositeOverColor_AfterDispose_ThrowsObjectDisposedException
              - Surface_CompositeOverSpan_AfterDispose_ThrowsObjectDisposedException
              - Surface_CompositeOverSpanPerPixelColors_AfterDispose_ThrowsObjectDisposedException
              - Surface_CompositeOverSpanWithWorkspace_AfterDispose_ThrowsObjectDisposedException
              - Surface_CompositeOverSpanWithWorkspacePerPixelColors_AfterDispose_ThrowsObjectDisposedException
              - Surface_Clear_AfterDispose_ThrowsObjectDisposedException
