---
# Software Subsystem Requirements for Drawing
#
# These requirements decompose the CanvasNet system's Drawing API responsibilities into the
# Drawing subsystem's own responsibility: antialiased scanline-coverage filling of closed
# Geometry.Path geometry with a solid color onto a Canvas.Surface (the PathFiller unit, which
# also covers the supporting FillRule, EdgeFlattener, and ScanlineRasterizer types). Each
# requirement here links down to the unit requirement that implements it.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Drawing Requirements
        requirements:
          - id: CanvasNet-Drawing-PathFill
            title: >-
              The Drawing subsystem shall fill a closed Path with a solid color onto a Surface,
              using an antialiased scanline-coverage rasterizer supporting both nonzero and
              even-odd fill rules, with a caller-adjustable curve-flattening tolerance.
            justification: |
              Solid-color fill of arbitrary vector geometry (straight lines, Bezier curves, and
              SVG-style arcs, potentially across multiple subpaths forming holes) is the
              foundational rendering operation future Drawing functionality (strokes, gradients,
              fonts) will build upon; callers need it available directly on a Surface without
              hand-rolling rasterization.
            children:
              - CanvasNet-Drawing-PathFiller-Fill
              - CanvasNet-Drawing-PathFiller-FillRule
              - CanvasNet-Drawing-PathFiller-ImplicitClose
              - CanvasNet-Drawing-PathFiller-Antialiasing
              - CanvasNet-Drawing-PathFiller-Holes
              - CanvasNet-Drawing-PathFiller-EdgeFlattenerConversion
              - CanvasNet-Drawing-PathFiller-EdgeFlattenerImplicitClose
              - CanvasNet-Drawing-PathFiller-ScanlineCoverageMath
              - CanvasNet-Drawing-PathFiller-ScanlineFillRuleResolution
              - CanvasNet-Drawing-PathFiller-ScanlineActiveEdgeList
              - CanvasNet-Drawing-PathFiller-ScanlineDegenerateInputNoOp
              - CanvasNet-Drawing-PathFiller-ScanlineCrossingEdges
            tests:
              - CanvasNet_SystemIntegration_BuildAndFillTrianglePath_ReturnsExpectedPixels

          - id: CanvasNet-Drawing-PathFillNoOp
            title: >-
              The Drawing subsystem shall silently no-op, without allocating a full-surface
              buffer or throwing, when filling an empty Path or a Path whose bounds do not
              intersect the target Surface.
            justification: |
              Callers building up scenes incrementally will routinely fill paths that are empty
              or fall entirely outside the visible surface (for example, off-screen geometry);
              this must be a cheap, well-defined no-op rather than a special case callers must
              detect and avoid themselves.
            children:
              - CanvasNet-Drawing-PathFiller-EmptyOrOutOfBoundsNoOp
            tests:
              - PathFiller_Fill_EmptyPath_NoOpLeavesSurfaceUnchanged
              - PathFiller_Fill_PathFullyOutsideSurfaceBounds_NoOpLeavesSurfaceUnchanged

          - id: CanvasNet-Drawing-PathFillValidation
            title: >-
              The Drawing subsystem shall reject a null Surface or Path argument with
              ArgumentNullException, a non-positive or non-finite flatten-tolerance argument
              with ArgumentOutOfRangeException, and an undefined fill-rule argument with
              ArgumentOutOfRangeException.
            justification: |
              A null surface or path cannot supply a valid fill target or geometry, a
              non-positive or non-finite flattening tolerance cannot bound curve subdivision to a
              meaningful accuracy, and an undefined fill-rule value has no defined
              winding-resolution meaning; rejecting these early prevents a confusing failure, an
              infinite/absurd amount of curve subdivision, or a silently mis-resolved fill rule,
              deeper in the implementation.
            children:
              - CanvasNet-Drawing-PathFiller-NullArguments
              - CanvasNet-Drawing-PathFiller-NonPositiveTolerance
              - CanvasNet-Drawing-PathFiller-InvalidFillRule
            tests:
              - PathFiller_Fill_NullSurface_ThrowsArgumentNullException
              - PathFiller_Fill_NullPath_ThrowsArgumentNullException
              - PathFiller_Fill_NonPositiveFlattenTolerance_ThrowsArgumentOutOfRangeException
              - PathFiller_Fill_UndefinedFillRule_ThrowsArgumentOutOfRangeException

          - id: CanvasNet-Drawing-PathStroke
            title: >-
              The Drawing subsystem shall convert a Path stroke into closed outline geometry whose
              rendered appearance reflects the configured width, cap shape, join shape, dash
              pattern, and curve-flattening tolerance.
            justification: |
              Solid-color stroke rendering is the natural companion to fill rendering; callers need
              the standard vector-stroke appearance controls without a second rasterization API.
            children:
              - CanvasNet-Drawing-PathStroker-Stroke
              - CanvasNet-Drawing-PathStroker-Caps
              - CanvasNet-Drawing-PathStroker-Joins
              - CanvasNet-Drawing-PathStroker-MiterLimit
              - CanvasNet-Drawing-PathStroker-Dashing
              - CanvasNet-Drawing-PathStroker-StyleValidation
              - CanvasNet-Drawing-PathStroker-OpenClosedPreservation
              - CanvasNet-Drawing-PathStroker-DashPhaseSemantics
            tests:
              - PathStroker_Stroke_HorizontalLineButtCap_FillsExactRectangleNoExtension
              - PathStroker_Stroke_HorizontalLineRoundCap_FillsRectanglePlusSemicircularEnds
              - PathStroker_Stroke_HorizontalLineSquareCap_FillsRectanglePlusHalfWidthExtension
              - PathStroker_Stroke_RightAngleCornerMiterJoin_FillsSharpMiteredCorner
              - PathStroker_Stroke_RightAngleCornerRoundJoin_FillsRoundedCorner
              - PathStroker_Stroke_RightAngleCornerBevelJoin_FillsFlatBeveledCorner
              - PathStroker_Stroke_DashedLine_FillsOnlyOnSegmentsLeavingGapsUnfilled

          - id: CanvasNet-Drawing-PathStrokeNoOp
            title: >-
              The Drawing subsystem shall return an empty path, without throwing, when stroking an
              empty Path or a Path whose visible stroke reduces entirely to omitted dash gaps or
              butt-capped zero-length segments.
            justification: |
              Callers routinely stroke conditional or partially constructed geometry; an empty
              stroke result must be a cheap, well-defined no-op rather than a special case callers
              must detect themselves.
            children:
              - CanvasNet-Drawing-PathStroker-DegenerateSubpaths
              - CanvasNet-Drawing-PathStroker-ClosedContours
              - CanvasNet-Drawing-PathStroker-EmptyNoOp
              - CanvasNet-Drawing-PathStroker-ShellWinding
            tests:
              - PathStroker_Stroke_ClosedRectangle_FillsRingLeavingInteriorAndExteriorUnfilled
              - PathStroker_Stroke_ZeroLengthSubpathRoundCap_FillsCircleOfRadiusHalfWidth
              - PathStroker_Stroke_ZeroLengthSubpathSquareCap_FillsSquareOfSideWidth
              - PathStroker_Stroke_ZeroLengthSubpathButtCap_ProducesNoFilledPixels
              - PathStroker_Stroke_SinglePointSubpath_MatchesZeroLengthSubpathBehavior
              - PathStroker_Stroke_EmptyPath_ReturnsEmptyPathNoOp

          - id: CanvasNet-Drawing-PathStrokeValidation
            title: >-
              The Drawing subsystem shall reject a null Path or stroke-style argument with
              ArgumentNullException, and shall reject a non-positive or non-finite
              flatten-tolerance argument with ArgumentOutOfRangeException.
            justification: |
              A null path or style cannot supply valid stroke geometry, and a non-positive or
              non-finite flattening tolerance cannot bound curve approximation meaningfully.
            children:
              - CanvasNet-Drawing-PathStroker-Validation
            tests:
              - PathStroker_Stroke_NullPath_ThrowsArgumentNullException
              - PathStroker_Stroke_NullStrokeStyle_ThrowsArgumentNullException
              - PathStroker_Stroke_NonPositiveFlattenTolerance_ThrowsArgumentOutOfRangeException
