---
# cspell:ignore embedder
# Software Unit Requirements for ImageSourceContract
#
# These requirements describe the design-level behavior of the ImageSourceContract unit of the ImageSources subsystem
# (namespace DemaConsulting.CanvasNet.ImageSources): the public types that let any application plug a format or a
# live source into the resolver - IImageSource, ImageSourceRequest, ImageSourceResult, ImageSourceDiagnostic,
# ImageDiagnosticSeverity, IImageResolver, EmbeddedImage, ImageSourceException, and the ImageSourceSet that composes
# sources and applies the precedence rule. Each "tests" entry cites an existing test method in the
# DemaConsulting.CanvasNet.Tests project; see docs/verification/canvas-net/image-sources/image-source-contract.md for
# the test-evidence mapping.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: ImageSources Requirements
        sections:
          - title: ImageSourceContract Requirements
            requirements:
              - id: CanvasNet-ImageSources-ImageSourceContract-SourceClaims
                title: >-
                  The ImageSourceSet class shall hold an ordered, immutable list of sources, validate what each source
                  claims when the set is built (extensions that are a dot followed by a name without separators;
                  schemes of two or more characters made of letters, digits, plus, minus and dot that start with a
                  letter; never the reserved schemes file and data; no null list, null source, or unnamed source),
                  record every claim in lower case, let the later source win when several claim the same extension or
                  scheme, find the source of a file name by its longest claimed suffix ignoring case and folders, find
                  the source of a scheme ignoring case, list all claimed extensions and schemes sorted without
                  duplicates, and return a new set from Add without changing the original.
                justification: |
                  A bad claim must fail where the set is composed, with the name of the source in the message; the
                  precedence rule is what lets an application override a built-in format; and an immutable set can be
                  shared by any number of resolvers.
                tests:
                  - ImageSourceSet_Constructor_SameClaims_LaterSourceWins
                  - ImageSourceSet_Add_ReturnsNewSetAndLeavesOriginalUnchanged
                  - ImageSourceSet_ExtensionsAndSchemes_AreReadOnly
                  - ImageSourceSet_FindByExtension_LongestSuffixCaseInsensitive
                  - ImageSourceSet_FindByScheme_CaseInsensitive
                  - ImageSourceSet_Constructor_InvalidExtension_ThrowsArgumentException
                  - ImageSourceSet_Constructor_InvalidSources_Throw
                  - ImageSourceSet_GetScheme_FollowsRfc3986WithDriveLetterException

              - id: CanvasNet-ImageSources-ImageSourceContract-Request
                title: >-
                  The ImageSourceRequest class shall carry the link as written; for a file-based request the bytes of
                  the file, its name relative to the folder of the resolver, and the full path of its folder; for a
                  scheme-claimed request no bytes, no name and no folder; the requested size, the resolver scoped to
                  the request, the strictness switch, and a cancellation token; and shall open the bytes as a
                  read-only seekable stream, failing with InvalidOperationException when the request has no file.
                  The request shall also carry the live shared pixel budget of the render (Budget, an ImageBudget;
                  RemainingPixels reads it live and is unlimited when none is set, as for a request built by hand)
                  and check a size against it with EnsureWithinBudget, which charges the size to the budget at that
                  moment, adds it to the pixels the request has charged (ChargedPixels), lets the sizes of several
                  calls accumulate, and throws ImageSourceBudgetException (carrying the requested pixels and the pixels
                  that were still free) without charging anything when the size does not fit.
                justification: |
                  A source implemented outside this repository can only be correct if the request says exactly what it
                  holds in each case, and a scheme-claimed source must not be handed a file it cannot have; a defined
                  live budget and refusal let every source, in or outside this repository, respect the pixel limit
                  without a stale number.
                tests:
                  - ImageSourceRequest_OpenContent_FileRequest_ReturnsReadOnlySeekableStream
                  - ImageSourceRequest_OpenContent_SchemeRequest_ThrowsInvalidOperationException
                  - ImageSourceRequest_EnsureWithinBudget_ChargesLiveBudgetAndThrowsOnlyWhenOver
                  - ImageSourceRequest_EnsureWithinBudget_SharedBudget_SeesChargesOfOtherRequests
                  - ImageBudget_Constructor_StartsFullAndRejectsNegative

              - id: CanvasNet-ImageSources-ImageSourceContract-SizeRule
                title: >-
                  The ImageSourceRequest class shall turn the natural size of a picture and the requested size into
                  the size to draw at: the natural size when nothing is requested, the requested dimension and the
                  other one in the aspect ratio of the picture when one is requested, the requested box (or, when
                  asked to fit inside, the largest size of the aspect ratio of the picture inside the box) when both
                  are requested, a requested dimension below one pixel as one pixel, every result limited to 1 through
                  the maximum surface dimension, and shall reject a natural size below one pixel.
                justification: |
                  Every source that draws vectors needs the same rule, and getting it wrong distorts or blurs the
                  picture.
                tests:
                  - ImageSourceRequest_SizeFor_AppliesSizingRule
                  - ImageSourceRequest_SizeFor_InvalidOrHugeNaturalSize_ThrowsOrClamps

              - id: CanvasNet-ImageSources-ImageSourceContract-Result
                title: >-
                  The ImageSourceResult record shall require a picture, carry the notes (each with source, severity,
                  code and message), the printed text, and an optional format name, default the notes and the text to
                  empty, copy the notes and the text it is given into read-only snapshots (so changing the original
                  lists afterwards, or casting the values, cannot change the result), and the EmbeddedImage record
                  shall describe a loaded image by link, format, size and depth.
                justification: |
                  The result is how a source reports everything besides the picture; a missing picture must fail at
                  once, the defaults keep simple sources simple, and an immutable result cannot be changed behind
                  the resolver's back.
                tests:
                  - ImageSourceResult_Constructor_RequiresSurfaceAndDefaultsToEmpty
                  - ImageSourceResult_Init_CopiesListsIntoReadOnlySnapshots
                  - ImageSourceContract_ValueTypes_HaveDocumentedShape

              - id: CanvasNet-ImageSources-ImageSourceContract-FailureReporting
                title: >-
                  The ImageSourceException class shall carry the link that was being loaded, the file that contains
                  the link (none for the top-level document), and the original failure of the source as its inner
                  exception.
                justification: |
                  A caller maps the original failure to its own error and uses the link and the embedding file to say
                  which files are involved.
                tests:
                  - ImageSourceException_Constructor_KeepsHrefEmbedderAndInner

              - id: CanvasNet-ImageSources-ImageSourceContract-ImageFragment
                title: >-
                  The ImageFragment class shall parse the raw text after the first number sign of a link without ever
                  throwing: split it into parameters at the ampersand (skipping empty segments), split each parameter
                  at its first equals sign (no equals sign gives an empty value), decode percent-encoding after the
                  split and never read a plus sign as a space, keep the order and the raw text, match names ignoring
                  ASCII case, return the last value of a name or of any of several names, read a whole number from one
                  (digits only, leading zeros allowed) and refuse any other value with an
                  ImageSourceRefusedException that carries the code image-fragment-invalid and a short message safe to
                  show, and, for a fragment of more than 2048 characters or more than 32 parameters, keep no
                  parameter and say why in Problem. An IFragmentImageSource shall declare the lower-case parameter
                  names a source uses.
                justification: |
                  A link is untrusted text; one grammar with hard limits, applied the same way by every source, keeps
                  a page choice predictable and a hostile fragment cheap.
                tests:
                  - ImageFragment_Parse_NullOrEmpty_IsEmpty
                  - ImageFragment_Parse_TwoParameters_KeepsOrderAndRaw
                  - ImageFragment_Parse_SingleParameter_SplitsBeforeDecoding
                  - ImageFragment_Parse_EmptySegments_AreSkipped
                  - ImageFragment_Parse_HashAndQuestionMark_StayInTheText
                  - ImageFragment_GetValue_CaseInsensitiveLastWins_AcrossAliases
                  - ImageFragment_GetValue_NullNames_ThrowsArgumentNullException
                  - ImageFragment_GetPositiveInt32_ValidValues_ReturnsNumber
                  - ImageFragment_GetPositiveInt32_UnusableValue_ThrowsRefusedWithInvalidCode
                  - ImageFragment_GetPositiveInt32_HostileValue_IsQuotedSafelyInMessage
                  - ImageFragment_Parse_TooLong_HasProblemAndNoParameters
                  - ImageFragment_Parse_AtTheLimits_IsParsed
                  - ImageFragment_Parse_TooManyParameters_HasProblemAndNoParameters
                  - ImageFragment_Parameters_AreReadOnly
                  - ImageSourceRequest_Fragment_DefaultsToEmptyAndNoOptions

              - id: CanvasNet-ImageSources-ImageSourceContract-FragmentPrefix
                title: >-
                  The ImageFragment class shall return, from GetPrefixed, the parameters whose name starts with a prefix
                  (matched ignoring ASCII case) and has at least one character after it, with the prefix removed from
                  the name and the rest of the name kept as written, in the order the names first appear and with the
                  last value of a name, and none for an empty fragment or a fragment with a problem and an argument
                  exception for a missing or empty prefix; and an IFragmentImageSource shall be able to declare, through
                  FragmentParameterPrefixes (empty by default, so a source written before it declares none), the
                  prefixes of the parameters it understands whatever follows them.
                justification: |
                  The variables of a model and the parameters of a chart are named by the author of the link, so a
                  source
                  cannot list them; a prefix keeps them from colliding with the names the source defines itself.
                tests:
                  - ImageFragment_GetPrefixed_ReturnsNamesWithoutPrefixInOrder
                  - ImageFragment_GetPrefixed_DuplicateName_LastValueWinsAtFirstPosition
                  - ImageFragment_GetPrefixed_EmptyFragmentOrBadPrefix
                  - IFragmentImageSource_FragmentParameterPrefixes_DefaultsToNone

              - id: CanvasNet-ImageSources-ImageSourceContract-ParameterValues
                title: >-
                  The ImageParameterValues class shall read the value of a model variable (true and false, a finite
                  number as a double, a value that starts with an opening bracket as a vector, a strict JSON array of
                  numbers, booleans, null, text and vectors that is refused when it is not valid JSON or holds an
                  object, anything else as text with
                  one pair of single or double quotes removed) and the value of a chart parameter (true, false, null, a
                  finite number, text that starts with a brace, a bracket or a double quote as strict JSON into plain
                  lists, dictionaries, strings, numbers and booleans, nested at most 32 levels and holding at most
                  65,536
                  values, anything else as text with one pair of single quotes removed) without throwing for a bad
                  value (it says why, in one line), and shall read every prefixed parameter of a fragment with either
                  grammar, refusing the link with an ImageSourceRefusedException that carries the code
                  image-fragment-invalid, names the parameter and shows the value for a value that is not usable.
                justification: |
                  The command line (-D, --param), the library and the fragment of a link must read one text the same
                  way, so an embedded model or chart is drawn exactly as the command line would draw it, and the
                  viewport variables of a model ($vpt and $vpr are vectors) can be fixed from either.
                tests:
                  - ImageParameterValues_TryParseVariable_ReadsTheGrammarOfDashD
                  - ImageParameterValues_TryParseVariable_Vector_IsAListOfValues
                  - ImageParameterValues_TryParseVariable_BadVector_IsRefused
                  - ImageParameterValues_TryParseParameter_ReadsScalarsAndText
                  - ImageParameterValues_TryParseParameter_Null_IsNull
                  - ImageParameterValues_TryParseParameter_JsonObjectAndArray_BecomePlainValues
                  - ImageParameterValues_TryParseParameter_BadJson_IsRefusedWithAReason
                  - ImageParameterValues_TryParseParameter_Limits
                  - ImageParameterValues_ReadVariables_ReadsPrefixedValues
                  - ImageParameterValues_ReadVariables_BadVector_IsRefusedAsInvalidFragment
                  - ImageParameterValues_ReadVariables_Vector_IsReadAsAList
                  - ImageParameterValues_ReadParameters_ReadsJsonAndRefusesMalformedValues

              - id: CanvasNet-ImageSources-ImageSourceContract-FragmentReview
                title: >-
                  The ImageFragment class shall review its parameters against the declaration of an image source
                  (ReviewParameters), giving a note with the code image-fragment-unknown-parameter for a parameter the
                  source does not declare (neither by name nor by prefix), once for each name in the order of first
                  appearance, and a note with the code image-fragment-duplicate-parameter for a declared parameter that
                  is given more than once with different values (the last value is the one used; aliases are never
                  duplicates of each other, and what follows a prefix is compared as written), naming the subject, the
                  link and the parameter in the message, and shall give none for an empty fragment; the
                  FolderImageResolver shall report exactly these notes for the links of a document.
                justification: |
                  The links of an SVG document and the input paths of the command line share one rule for what a
                  fragment may contain, so the same mistake has the same code and the same message in both.
                tests:
                  - ImageFragment_ReviewParameters_ReportsUnknownAndDuplicateParametersOnce
                  - ImageFragment_ReviewParameters_SourceWithoutDeclaration_ReportsEveryParameter

              - id: CanvasNet-ImageSources-ImageSourceContract-Refusal
                title: >-
                  The ImageSourceRefusedException class shall carry a non-empty code and a message and reject a
                  missing code or message, so that a source can decline the picture a link asks for (a page that does
                  not exist, a value it cannot use) without being treated as a broken file.
                justification: |
                  A source must return a picture; a defined refusal lets it say "not this one" in a way the resolver
                  reports as a note instead of an error.
                tests:
                  - ImageSourceRefusedException_Constructor_KeepsCodeAndMessageAndValidates

              - id: CanvasNet-ImageSources-ImageSourceContract-DiagnosticDetail
                title: >-
                  The ImageSourceDiagnostic record shall carry, besides source, severity, code, message and origin,
                  an optional Detail (the finer identifier when the code is generic), an optional Location (file,
                  line, column and JSON pointer, each optional, as the ImageDiagnosticLocation record) and an optional
                  1-based Page, and shall treat two notes as equal only when all of them are equal.
                justification: |
                  A generic code with a position in a file is enough to point at the line to fix; tools should not
                  parse message text to find it.
                tests:
                  - ImageSourceDiagnostic_Equals_ComparesDetailLocationAndPage
                  - ImageDiagnosticLocation_Equality_IsByValue
