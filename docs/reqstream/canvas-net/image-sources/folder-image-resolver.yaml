---
# cspell:ignore embedder
# Software Unit Requirements for FolderImageResolver
#
# These requirements describe the design-level behavior of the FolderImageResolver unit of the ImageSources subsystem
# (namespace DemaConsulting.CanvasNet.ImageSources): the resolver that loads the pictures a document links to from
# one folder, safely, through pluggable sources, together with its FolderImageResolverOptions. Each "tests" entry
# cites an existing test method in the DemaConsulting.CanvasNet.Tests project; see
# docs/verification/canvas-net/image-sources/folder-image-resolver.md for the test-evidence mapping.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: ImageSources Requirements
        sections:
          - title: FolderImageResolver Requirements
            requirements:
              - id: CanvasNet-ImageSources-FolderImageResolver-FileAccess
                title: >-
                  The FolderImageResolver class shall resolve a link without a URI scheme as a path relative to the
                  folder of the file that contains it (the folder it was created with for the top-level document), or
                  as an absolute or (on Windows) drive path, through the file-access engine under the policy of its
                  options (by default every regular local file, also through dot-dot, also percent-encoded, and
                  through a symbolic link or junction), shall report a link the policy denies, or cannot apply, as the
                  warning image-access-denied, and shall report as an unresolved warning, in both cases without
                  calling a source, a link that is a UNC path, an alternate data stream, contains a control character,
                  is not a valid local path on the platform, or names a file that does not exist.
                justification: |
                  Links resolve the way Pandoc resolves them by default; a host that renders untrusted documents
                  confines them with a policy, and no spelling of a path may then read a file the policy denies.
                tests:
                  - FolderImageResolver_Resolve_RelativeFile_PassesCompleteRequestToSource
                  - FolderImageResolver_Resolve_NeverAllowedReference_IsUnresolvedWarning
                  - FolderImageResolver_Resolve_EscapingReference_UnderRoots_IsAccessDeniedWarning
                  - FolderImageResolver_Resolve_EscapingReference_Default_IsDrawn
                  - "windows@FolderImageResolver_Resolve_DrivePath_IsLocalOnWindowsAndInvalidElsewhere"
                  - "ubuntu@FolderImageResolver_Resolve_DrivePath_IsLocalOnWindowsAndInvalidElsewhere"
                  - "macos@FolderImageResolver_Resolve_DrivePath_IsLocalOnWindowsAndInvalidElsewhere"
                  - FolderImageResolver_Resolve_SymbolicLink_NoSymlinks_IsAccessDeniedWarning
                  - FolderImageResolver_Resolve_DirectoryLink_NoSymlinks_IsAccessDeniedWarning
                  - FolderImageResolver_Resolve_SymbolicLink_Default_FollowsTheLink
                  - FolderImageResolver_Resolve_SymbolicLink_UnderRoots_LinkLeavingTheRootsIsDenied
                  - FolderImageResolver_Resolve_MissingAndUnknownFiles_AreWarnings

              - id: CanvasNet-ImageSources-FolderImageResolver-PolicyPropagation
                title: >-
                  The FolderImageResolver class shall set the file-access policy of every request it hands a source:
                  for a file link and a direct render the policy of its options judged from the folder the chain of
                  links started from (the folder of the resolver, or the folder of the top-level file of a render by
                  path), and for a scheme-claimed link the policy itself.
                justification: |
                  A source that reads further files (an include, a data file) must apply the same policy, and judging
                  from the outer origin keeps a nested folder swapped for a link from widening what is trusted.
                tests:
                  - FolderImageResolver_Resolve_FileRequest_CarriesThePolicyAnchoredAtTheChainOrigin
                  - FolderImageResolver_Render_Stream_RequestCarriesThePolicy
                  - FolderImageResolver_Resolve_RelativeFile_PassesCompleteRequestToSource

              - id: CanvasNet-ImageSources-FolderImageResolver-FileUri
                title: >-
                  The FolderImageResolver class shall read a file: URI without a host as its absolute local path,
                  judged by the policy like any other link (a URI with a host, localhost included, and a malformed URI
                  are unresolved warnings, never read), shall treat the file scheme as a local path even when sources
                  claim schemes, and shall decode percent-encoded characters of a relative path.
                justification: |
                  Documents written by tools use file: URIs and percent-encoded names; they must work like the paths
                  they stand for and must never reach a network share.
                tests:
                  - FolderImageResolver_Resolve_FileUriAndEncodedPath_InsideFolderIsDrawnOutsideIsNot
                  - FolderImageResolver_Resolve_FileUriOutsideFolder_Default_IsDrawn
                  - FolderImageResolver_Resolve_NeverAllowedReference_IsUnresolvedWarning
                  - FolderImageResolver_Resolve_FileUriWithControlCharacter_IsUnresolvedWarning
                  - FolderImageResolver_Resolve_FileScheme_IsHandledByResolverNotSources

              - id: CanvasNet-ImageSources-FolderImageResolver-UriReference
                title: >-
                  The FolderImageResolver class shall read a link without a URI scheme, and a file: URI, as a URI
                  reference: it shall cut off the query (from the first question mark before a number sign) and the
                  fragment (from the first number sign) before it decodes percent-encoding, so that an encoded %23 or
                  %3F stays a literal character of the file name; shall choose the source by the extension of what is
                  left and resolve it through the file-access engine with every refusal unchanged; shall report a link that is
                  nothing but a query or a fragment as an unresolved warning; shall hand the source the link as
                  written (the fragment parsed into the request, see the Fragment requirement); and shall hand a
                  link of a claimed scheme to its source as written, without cutting anything off.
                justification: |
                  Documents link files with cache-busting queries and fragments (image.png?v=2, report.pdf#page=2);
                  the order of stripping and decoding is what keeps an encoded character from changing the path and
                  keeps every escape of a confining policy refused.
                tests:
                  - FolderImageResolver_Resolve_RelativeLinkWithQueryOrFragment_NamesTheFile
                  - FolderImageResolver_Resolve_EncodedHash_IsLiteralCharacterOfTheFileName
                  - FolderImageResolver_Resolve_EncodedQuestionMark_IsLiteralCharacterNotAQuery
                  - FolderImageResolver_Resolve_FileUriWithQueryAndFragment_NamesTheFile
                  - FolderImageResolver_Resolve_FileUriOutsideFolderWithQuery_UnderRoots_IsStillDenied
                  - FolderImageResolver_Resolve_OnlyQueryOrFragment_IsUnresolved
                  - FolderImageResolver_Resolve_EscapingReferenceWithQueryOrFragment_UnderRoots_IsStillNotDrawn
                  - FolderImageResolver_Resolve_ParentReferenceWithQueryOrFragment_Default_NamesTheFile
                  - FolderImageResolver_Resolve_SchemeLinkWithQueryAndFragment_IsPassedAsIs
                  - FolderImageResolver_Resolve_UnclaimedSchemeWithQuery_IsUnresolved
                  - FolderImageResolver_Resolve_NestedLinkWithQueryAndFragment_ResolvesFromFolderOfEmbeddingFile
                  - FolderImageResolver_Resolve_QuestionMarkAfterHash_BelongsToFragment
                  - FolderImageResolver_Render_PathWithHash_IsNotInterpretedAsFragment
                  - FolderImageResolver_DecodeReference_CutsThenDecodes

              - id: CanvasNet-ImageSources-FolderImageResolver-Fragment
                title: >-
                  The FolderImageResolver class shall parse the fragment of a link into the ImageFragment of the
                  request it hands the source (the empty fragment when the link has none, and the parsed fragment
                  also for a link of a claimed scheme, whose link is still passed as written), shall refuse before it
                  calls a source, and without counting a file, a fragment over the limits as a note with the code
                  image-fragment-invalid, and shall give a direct render no link: its caller-defined options are passed
                  to the source in the request and are null for a link, so an embedded file never inherits the options
                  of its embedder.
                justification: |
                  The fragment chooses the page of a document; parsing it once in the resolver gives every source the
                  same grammar and limits, and a hostile link cannot flood a source with parameters.
                tests:
                  - FolderImageResolver_Resolve_FileLinkWithFragment_FragmentReachesSource
                  - FolderImageResolver_Resolve_LinkWithoutFragment_RequestHasEmptyFragment
                  - FolderImageResolver_Resolve_FragmentOverLimits_IsInvalidAndSourceNotCalledAndNotCounted
                  - FolderImageResolver_Resolve_SchemeLink_ReceivesRawHrefAndFragmentWithoutWarnings
                  - FolderImageResolver_Resolve_SchemeLinkFragmentOverLimit_IsInvalidAndSourceNotCalled
                  - FolderImageResolver_Render_PathWithOptions_PassesOptionsToSourceOnly
                  - FolderImageResolver_Render_StreamWithAndWithoutOptions_PassesOptionsOrNull

              - id: CanvasNet-ImageSources-FolderImageResolver-FragmentDiagnostics
                title: >-
                  The FolderImageResolver class shall report, before it calls the source and with the embedding file
                  as origin, a warning with the code image-fragment-unknown-parameter for every parameter name the
                  source does not declare through IFragmentImageSource (a source without the interface declares none,
                  so every parameter of a link to a file it draws is unknown, while a source that claims a URI scheme
                  and does not implement the interface owns its links and gets no warning), and a warning with the
                  code image-fragment-duplicate-parameter for a parameter given twice with different values (the last
                  wins; the same value twice and aliases of the same meaning are silent), keep the message of each
                  short and free of control characters whatever the link contains, and still draw the picture.
                justification: |
                  A misspelled or unsupported parameter must be visible without breaking the diagram, and a hostile
                  link must not be able to fill a report with its own text.
                tests:
                  - FolderImageResolver_Resolve_UnknownParameter_WarnsAndStillDraws
                  - FolderImageResolver_Resolve_SourceWithoutInterface_EveryParameterIsUnknown
                  - FolderImageResolver_Resolve_NullFragmentParameters_TreatedAsNone
                  - FolderImageResolver_Resolve_DuplicateParameter_WarnsOnlyWhenValuesDiffer
                  - FolderImageResolver_Resolve_AliasParameters_AreNotDuplicates
                  - FolderImageResolver_Resolve_UnknownRepeatedParameter_IsOnlyReportedAsUnknown
                  - FolderImageResolver_Resolve_HostileParameterName_IsSanitizedInMessage
                  - FolderImageResolver_Resolve_SchemeLinkWithInterface_WarnsAboutUnknownParameters

              - id: CanvasNet-ImageSources-FolderImageResolver-FragmentPrefixes
                title: >-
                  The FolderImageResolver class shall treat a parameter whose name starts with a prefix the source
                  declares through IFragmentImageSource.FragmentParameterPrefixes (and has a character after it) as
                  understood, so it reports no unknown-parameter warning for it, and still report a name that matches
                  neither a declared name nor a prefix (a bare prefix included) and a source that declares no prefix
                  (none declared, a null list, a null or empty entry), compare the part of a prefixed name after the
                  prefix as written (names that differ in case are different parameters) and the prefix ignoring case
                  when it looks for a duplicate, and give the source the parsed fragment.
                justification: |
                  A source that takes names from the link (a model variable) must not drown the report in warnings
                  for the names it understands, and a name that differs only in case is another variable.
                tests:
                  - FolderImageResolver_Resolve_DeclaredPrefix_UnderstandsEveryParameterWithIt
                  - FolderImageResolver_Resolve_DeclaredPrefix_DuplicatesCompareTheNameAsWritten
                  - FolderImageResolver_Resolve_NoDeclaredPrefix_PrefixedParameterIsUnknown

              - id: CanvasNet-ImageSources-FolderImageResolver-PageRefusal
                title: >-
                  The FolderImageResolver class shall turn an ImageSourceRefusedException of a source into a note with
                  the severity unsupported and the code of the exception, draw nothing, give back the pixels the request
                  charged and carry on, shall report a value the source reads and cannot use as a note with the code
                  image-fragment-invalid, shall not wrap the exception in an ImageSourceException, and shall let it
                  propagate from a direct render.
                justification: |
                  A source must return a picture, so a page that does not exist needs a way to say "not this picture"
                  that does not look like a broken file.
                tests:
                  - FolderImageResolver_Resolve_SourceRefuses_UnsupportedNoteNothingDrawnBudgetRefunded
                  - FolderImageResolver_Resolve_SourceReadsInvalidPage_IsInvalidFragmentNote
                  - FolderImageResolver_Resolve_NestedRefusal_HasOriginOfEmbeddingFile
                  - FolderImageResolver_Render_SourceRefuses_ExceptionPropagatesUnwrapped
                  - FolderImageResolver_Render_SourceRefusesAfterCharging_BudgetIsRefunded
                  - FolderImageResolver_Resolve_SourceNoteWithDetail_KeepsDetailLocationAndPage

              - id: CanvasNet-ImageSources-FolderImageResolver-Dispatch
                title: >-
                  The FolderImageResolver class shall choose the source of a file by the longest claimed extension of
                  its name, ignoring case (so a compound extension beats its last part), check the extension before
                  any file is read, report a file whose extension nobody claims as an unresolved warning that lists
                  the extensions that are claimed, and hand the source the file's bytes, its name relative to the
                  folder, the full path of its folder, the requested size, the scoped resolver, the strictness switch,
                  and the cancellation token.
                justification: |
                  The format of a file is decided by its name, so a file nobody can draw is never read and a source
                  receives everything it needs.
                tests:
                  - FolderImageResolver_Resolve_RelativeFile_PassesCompleteRequestToSource
                  - FolderImageResolver_Resolve_LongestSuffixAndCaseInsensitive_PicksSource
                  - FolderImageResolver_Resolve_MissingAndUnknownFiles_AreWarnings

              - id: CanvasNet-ImageSources-FolderImageResolver-Precedence
                title: >-
                  The FolderImageResolver class shall let the later source of the sequence it is given win when
                  several sources claim the same extension or scheme, use an ImageSourceSet it is given as it is, and
                  accept any sequence of sources.
                justification: |
                  A source that an application lists after the built-in ones overrides a built-in format without any
                  global state.
                tests:
                  - FolderImageResolver_Resolve_TwoSourcesClaimExtension_LaterWins
                  - FolderImageResolver_Resolve_ImageSourceSetWithAddedSource_OverridesEarlierSource

              - id: CanvasNet-ImageSources-FolderImageResolver-Schemes
                title: >-
                  The FolderImageResolver class shall hand a link whose URI scheme a source claims (RFC 3986 syntax; a
                  single letter is a drive, not a scheme) to that source exactly as written, in the case it was
                  written, with no content, no file name and no folder, without any file access and without a folder;
                  shall leave a link whose scheme nobody claims, including http and https for the built-in sources, as
                  an unresolved warning; shall leave every link without a scheme unresolved when the resolver has no
                  folder; and shall reject at construction a source that claims the schemes file or data, a single
                  letter, or a malformed scheme.
                justification: |
                  A source for a live or remote picture owns access and security for its own scheme; everything else
                  stays closed by default, so a network URL is never fetched unless an application says so.
                tests:
                  - FolderImageResolver_Resolve_ClaimedScheme_GivesSourceRawHrefWithoutFileAccess
                  - FolderImageResolver_Resolve_NoFolder_FilesAreUnresolvedButSchemesWork
                  - FolderImageResolver_Resolve_HttpAndHttps_UnresolvedByDefaultButClaimable
                  - FolderImageResolver_Resolve_UnclaimedScheme_IsUnresolvedWarning
                  - FolderImageResolver_Constructor_InvalidOrReservedScheme_ThrowsArgumentException

              - id: CanvasNet-ImageSources-FolderImageResolver-NestedScope
                title: >-
                  The FolderImageResolver class shall give each source a resolver scoped to its own request, so that a
                  relative link of an embedded file resolves against the folder of that file, a relative link of a
                  scheme-claimed picture resolves against the folder of the resolver, and the limits and the lists of
                  the whole render are shared by every level.
                justification: |
                  A source that draws a document with links of its own (an SVG file) can recurse correctly without
                  holding any state.
                tests:
                  - FolderImageResolver_Resolve_NestedRelativeLink_ResolvesFromFolderOfEmbeddingFile
                  - FolderImageResolver_Resolve_ClaimedSchemeNestedRelativeLink_ResolvesFromRootFolder

              - id: CanvasNet-ImageSources-FolderImageResolver-NaturalSize
                title: >-
                  The FolderImageResolver class, and the resolver it gives to each source, shall implement
                  IImageNaturalSizeResolver, reporting for the picture a call returned the IsNaturalSize that its
                  source set (true for a raster at its own pixel size, also when that size equals the request;
                  false for a picture drawn for the request and for a call that returns nothing), and the raster
                  source shall set it, so that a renderer never infers the kind of a picture from its size.
                justification: |
                  A raster whose pixel size equals the requested size looks like a vector drawing to a renderer that
                  compares sizes, and the Vega-Lite image mark would draw it at the wrong size.
                tests:
                  - ImageSourceResult_IsNaturalSize_IsSetByTheRasterSourceAndFalseByDefault
                  - FolderImageResolver_Resolve_ReportsTheKindOfThePictureNotItsSize
                  - FolderImageResolver_ScopedResolver_ReportsTheKindOfThePicture

              - id: CanvasNet-ImageSources-FolderImageResolver-Limits
                title: >-
                  The FolderImageResolver class shall stop a file that embeds itself directly, through other files or
                  through another spelling of its path such as a symbolic link or junction (a cycle, found by the real
                  path of the file, and before the depth for a scheme-claimed link), refuse to nest more than the
                  configured number of levels (four
                  by default) and to load more than the configured number of images in total (64 by default, counting
                  every call that reaches a source, including repeated links and scheme-claimed pictures), check the
                  depth and the image count before it opens the file of an embedded image (so an image over a limit
                  is never read), let the file-access engine read at most the configured number of images plus the
                  top-level file of a render by path, whatever the policy, and report
                  each as an unresolved warning while the render carries on.
                justification: |
                  A document tree can embed itself or fan out; the limits bound the work of one render, including the
                  files read.
                tests:
                  - FolderImageResolver_Resolve_Cycles_TerminateWithWarning
                  - FolderImageResolver_Resolve_TooDeep_TerminatesWithWarning
                  - FolderImageResolver_Resolve_TooMany_StopsAtLimitWithWarnings
                  - FolderImageResolver_Resolve_ClaimedSchemeCycleAndDepth_AreWarnings
                  - FolderImageResolver_Resolve_ClaimedSchemeLinks_CountAgainstImageLimit
                  - FolderImageResolver_Resolve_ImageCountExhausted_NeverReadsTheEmbeddedFile
                  - FolderImageResolver_Render_PathAndStream_SandboxFileSlotsMatchTheImageLimit
                  - FolderImageResolver_Resolve_LinkAliasCycle_StopsAtTheRealPath

              - id: CanvasNet-ImageSources-FolderImageResolver-PixelBudget
                title: >-
                  The FolderImageResolver class shall limit the pixels one resolver lets its sources allocate in total
                  with one live budget shared by every request, nested ones included
                  (FolderImageResolverOptions.MaxDecodedPixels, 64,000,000 by default; a negative value is rejected):
                  it shall clamp the requested size of every link to 1 through the maximum surface dimension per side
                  and refuse, before it calls a source, a link whose requested size does not fit in what is left
                  (charging nothing at that point); shall let the source charge what it allocates
                  (ImageSourceRequest.EnsureWithinBudget), charge after the call whatever the returned surface is
                  larger than the pixels the request charged, and give back the pixels a request charged when its
                  source throws, returns nothing or is refused, while leaving charged what nested pictures already
                  drew; shall discard and dispose a returned surface that does not fit; shall report each refusal as a
                  warning with the code svg-image-too-large (and not as an exception, and not as a loaded image);
                  shall throw ImageSourceBudgetException instead for a direct render; and shall expose the live part
                  of the budget that is still free as RemainingPixels.
                justification: |
                  A small placement can ask for a huge picture (an 8192 by 8192 raster in a 1 by 1 rectangle would
                  allocate 256 MiB, again for every link); one live budget that the sources charge when they allocate,
                  shared by every level, bounds the memory and time one render can cause, never goes stale as nested
                  pictures charge it, and a defined refusal lets a source outside this repository respect it.
                tests:
                  - FolderImageResolver_Resolve_HugeRasterAtTinyPlacement_IsRefusedBeforeDecoding
                  - FolderImageResolver_Resolve_ManyRasters_ExhaustBudgetAndLaterOnesAreRefused
                  - FolderImageResolver_Resolve_SourceNeverCharges_ReturnedSurfaceIsChargedAndRefusedWhenOverBudget
                  - FolderImageResolver_Resolve_SourceReturnsMoreThanRequested_ChargesReturnedSize
                  - FolderImageResolver_Resolve_SourceRefusesBeforeDrawing_IsWarningAndNotCharged
                  - FolderImageResolver_Resolve_PlacementLargerThanBudget_IsRefusedWithoutCallingSource
                  - FolderImageResolver_Resolve_RequestedSize_IsClampedPerSide
                  - FolderImageResolver_Resolve_RefusedForBudget_DoesNotCountAsLoadedImage
                  - FolderImageResolver_Resolve_NestedPictures_ShareTheBudget
                  - FolderImageResolver_Render_OverBudget_ThrowsBudgetException
                  - FolderImageResolver_Render_SourceReturnsTooMuch_ThrowsAndDiscardsSurface
                  - FolderImageResolver_Constructor_MaxDecodedPixels_DefaultNegativeAndZero
                  - FolderImageResolver_Resolve_NormalRaster_IsUnaffectedByTheBudget
                  - FolderImageResolver_Resolve_NestedAndLargerSurface_ShareLiveBudget
                  - FolderImageResolver_Resolve_LargerSurfaceThatFitsAfterNestedPicture_IsAcceptedAndSpendsTheBudget
                  - FolderImageResolver_Resolve_SourceChargingExactlyTheBudget_IsNotChargedTwice
                  - FolderImageResolver_Resolve_OwnSurfaceAfterNestedCharge_IsRefusedByLiveRemaining
                  - FolderImageResolver_Resolve_NestedSiblings_AccumulateCharges
                  - FolderImageResolver_Resolve_SourceFailsAfterCharging_RefundsTheCharge
                  - FolderImageResolver_Render_SourceFailsAfterCharging_RefundsTheCharge
                  - FolderImageResolver_RemainingPixels_StartsFullAndDecreasesAfterEmbed
              - id: CanvasNet-ImageSources-FolderImageResolver-Cancellation
                title: >-
                  The FolderImageResolver class shall check the cancellation token before every image it renders and
                  before every file it reads, pass it to every source, and let OperationCanceledException of the
                  file-access engine or a source pass through unchanged.
                justification: |
                  A caller must be able to abandon a render of many or slow pictures.
                tests:
                  - FolderImageResolver_Resolve_CanceledToken_ThrowsBeforeCallingSource
                  - FolderImageResolver_Resolve_SourceThrowsCancellation_IsNotWrapped

              - id: CanvasNet-ImageSources-FolderImageResolver-Diagnostics
                title: >-
                  The FolderImageResolver class shall collect, in render order, a warning with the code
                  svg-image-unresolved naming the link and the reason for every link that was not drawn, a warning with
                  the code image-access-denied for every link the file-access policy denied (naming the link, the
                  policy, its reason and its hint, with the requested and real paths only in the detail of the note),
                  a warning with the code svg-image-too-large for every picture over the pixel budget, and the notes
                  the sources return (with the embedding link and a colon in front of each message and the source,
                  severity and code kept), collect the printed text of the sources, and list every image that was
                  loaded with its link, format (the format the source reported or its name), size and depth.
                justification: |
                  When many files are embedded, every note must say where it came from, and a caller reports what was
                  drawn.
                tests:
                  - FolderImageResolver_Resolve_SourceWithNotes_ForwardsDiagnosticsEchoAndEmbedded
                  - FolderImageResolver_Resolve_NeverAllowedReference_IsUnresolvedWarning
                  - FolderImageResolver_Resolve_EscapingReference_UnderRoots_IsAccessDeniedWarning
                  - FolderImageResolver_Resolve_DeniedLink_ReportsPolicyReasonHintAndDetailWithoutReading
                  - FolderImageResolver_Resolve_TooDeep_TerminatesWithWarning

              - id: CanvasNet-ImageSources-FolderImageResolver-DiagnosticOrigin
                title: >-
                  The FolderImageResolver class shall give every note it collects an origin: the embedded files,
                  outermost first, that the note is about - for a note a source reported, the file that reported it
                  preceded by the files that embedded it, and for a link that was not drawn or was refused as too
                  large, the file that contains the link - naming a file link by its file name relative to the folder
                  and a scheme link by the link as written, leaving the origin empty for a note about the top-level
                  document, keeping the message of the note unchanged, and shall treat two notes with the same fields
                  and the same origin entries as equal.
                justification: |
                  A note that only says which link failed cannot be traced when the link sits several files deep; the
                  chain of files lets an author or a tool find the file to fix without parsing message text.
                tests:
                  - FolderImageResolver_Resolve_NestedSourceNote_OriginListsEmbeddingChain
                  - FolderImageResolver_Resolve_UnresolvedLinkInEmbeddedFile_OriginIsTheContainingFile
                  - FolderImageResolver_Resolve_TooLargeLinkInEmbeddedFile_OriginIsTheContainingFile
                  - FolderImageResolver_Resolve_SchemeLinkNote_OriginIsTheLinkAsWritten
                  - ImageSourceDiagnostic_Origin_DefaultsToEmptyAndIsComparedByEntries

              - id: CanvasNet-ImageSources-FolderImageResolver-Requested
                title: >-
                  The FolderImageResolver class shall list, in the order asked, every link a document asked for at any
                  level, whether or not it was drawn, with the files that contain it (the origin of a note about the
                  link) and, when it was drawn, the name it adds to the origin of its own links, and shall treat two
                  entries with the same link, name and origin entries as equal.
                justification: |
                  A link a document never shows is never asked for, so a caller that knows the links of an embedded
                  file (the SVG flattener) can report the ones the file did not show only if it can tell which links
                  each file asked for.
                tests:
                  - FolderImageResolver_Resolve_LinksAtEveryLevel_ListedInRequestedWithOriginAndName
                  - RequestedImage_Equals_ComparesOriginByEntries
                  - FolderImageResolver_Collections_AreReadOnly

              - id: CanvasNet-ImageSources-FolderImageResolver-Failures
                title: >-
                  The FolderImageResolver class shall report a file that is found but cannot be drawn as an
                  ImageSourceException that names the link and the embedding file (none at the top level), keeps the
                  original failure as its inner exception, keeps the innermost link and embedder when the failure
                  happened deeper, and shall not wrap cancellation.
                justification: |
                  A broken file is an error the author must fix, unlike a missing file; the caller needs both files and
                  the original failure to say so.
                tests:
                  - FolderImageResolver_Resolve_SourceThrows_WrapsInImageSourceException
                  - FolderImageResolver_Resolve_NestedSourceThrows_KeepsInnermostEmbedderAndHref
                  - FolderImageResolver_Resolve_SourceThrowsCancellation_IsNotWrapped

              - id: CanvasNet-ImageSources-FolderImageResolver-NoCaching
                title: >-
                  The FolderImageResolver class shall call the source again for every call that resolves a link,
                  returning a new picture each time, and shall document that the counts and lists belong to one
                  resolver, which serves one top-level render.
                justification: |
                  A live source, such as a video frame, must yield a fresh picture each time; per-render budgets need
                  a new resolver per render.
                tests:
                  - FolderImageResolver_Resolve_SameLinkTwice_InvokesSourceEachTimeWithoutCaching

              - id: CanvasNet-ImageSources-FolderImageResolver-DirectRender
                title: >-
                  The FolderImageResolver class shall draw a file by path (relative to the folder or absolute,
                  wherever it lies and without judging it by the file-access policy, while the links inside it are
                  judged from its own folder), or a file given as a stream (read up to 16 MiB), as the top-level
                  picture and return what the source returned with the format filled in, and shall fail with
                  FileNotFoundException for a missing file, FileReferenceException for a path that is not a regular
                  file, too large or unreadable, NotSupportedException (naming the extensions) when no source claims
                  the extension, ImageSourceException when the source fails, InvalidOperationException when there is
                  no folder for a path, and InvalidDataException for an oversize stream.
                justification: |
                  The caller chose the top-level file, so the policy that protects against the links of a document does
                  not judge it; a caller that renders one file wants the same sources, policy, and limits as embedding,
                  with errors instead of warnings.
                tests:
                  - FolderImageResolver_RenderPath_OutsideFolder_IsDrawnWhateverThePolicyButItsLinksAreChecked
                  - FolderImageResolver_RenderPath_File_ReturnsResultWithFormat
                  - FolderImageResolver_RenderPath_SourceWithoutFormat_UsesSourceName
                  - FolderImageResolver_RenderPath_Failures_ThrowSpecificExceptions
                  - FolderImageResolver_RenderPath_FileLinkingItself_StopsAsCycle
                  - FolderImageResolver_RenderStream_PassesBytesAndFolder_AndRejectsUnknownOrHuge
                  - FolderImageResolver_RenderStream_NoFolder_SourceHasNoDirectory

              - id: CanvasNet-ImageSources-FolderImageResolver-Configuration
                title: >-
                  The FolderImageResolver class shall list the extensions and schemes its sources claim, sorted and
                  without duplicates, shall take the file-access policy from its options (the allow-all policy by
                  default, null refused), and shall reject a null sequence, an empty or white-space folder, a negative
                  limit, a source that makes an invalid claim, and a null link.
                justification: |
                  Misconfiguration must fail at once, and callers need the list of what can be embedded for messages
                  and documentation.
                tests:
