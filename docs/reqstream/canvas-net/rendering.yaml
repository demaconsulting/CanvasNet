---
# Software Subsystem Requirements for Rendering
#
# The Rendering subsystem provides higher-level rendering primitives that compose Canvas,
# Geometry, Drawing, and Fonts into a transform-aware surface API (Canvas), text rendering
# (TextRenderer), convenience shape helpers (Shapes), and a font-independent line packer (WordWrap).

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Rendering Requirements
        requirements:
          - id: CanvasNet-Rendering-TransformStack
            title: >-
              The Rendering subsystem shall wrap a Surface with an affine transform stack
              (Save, Restore, Translate, RotateDegrees) composed in row-vector prepend order,
              and shall bake the current transform into every path fill/stroke while keeping
              output byte-identical to direct PathFiller/PathStroker calls at the identity
              transform.
            justification: |
              Callers building composed scenes need a per-instance transform state so nested
              drawing can be positioned and rotated without re-encoding coordinates; the
              byte-identical no-transform regression preserves existing renders when the new
              wrapper is adopted.
            children:
              - CanvasNet-Rendering-Canvas-Save
              - CanvasNet-Rendering-Canvas-Restore
              - CanvasNet-Rendering-Canvas-RestoreEmpty
              - CanvasNet-Rendering-Canvas-Translate
              - CanvasNet-Rendering-Canvas-RotateDegrees
              - CanvasNet-Rendering-Canvas-FillPath
              - CanvasNet-Rendering-Canvas-FillPathGradient
              - CanvasNet-Rendering-Canvas-StrokePath
              - CanvasNet-Rendering-Canvas-Identity
              - CanvasNet-Rendering-Canvas-Validation

          - id: CanvasNet-Rendering-Clear
            title: >-
              The Rendering subsystem shall provide a Canvas.Clear passthrough that fills every
              pixel of the wrapped Surface with a constant color, unaffected by the current
              transform.
            justification: |
              Clearing a Canvas's whole surface to a known background color is a common first
              step before drawing and involves no geometry to transform, so it is exposed as a
              thin, transform-independent passthrough rather than a transform-aware entry point
              like FillPath/StrokePath.
            children:
              - CanvasNet-Rendering-Canvas-Clear

          - id: CanvasNet-Rendering-TextRendering
            title: >-
              The Rendering subsystem shall measure and render TrueType text at a chosen pixel
              size, summing per-glyph advances plus kerning, honoring the Canvas current
              transform, and supporting Left/Center/Right alignment relative to the anchor
              x-coordinate with a baseline anchor y-coordinate, convert a run into a single
              outline path in the caller's coordinate space, and shorten a run to a width with an
              ellipsis.
            justification: |
              Text rendering is a standard higher-level primitive callers need alongside path
              rendering; measurement and drawing must agree on layout, and text must inherit
              any transform applied to the Canvas. Vector renderers additionally need the same
              layout as geometry, so they need not re-implement it, and labels must fit their
              allotted width without a private truncation rule in every renderer.
            children:
              - CanvasNet-Rendering-TextRenderer-Measure
              - CanvasNet-Rendering-TextRenderer-Draw
              - CanvasNet-Rendering-TextRenderer-Alignment
              - CanvasNet-Rendering-TextRenderer-TransformComposition
              - CanvasNet-Rendering-TextRenderer-Validation
              - CanvasNet-Rendering-TextRenderer-TextPath
              - CanvasNet-Rendering-TextRenderer-TextPathValidation
              - CanvasNet-Rendering-TextRenderer-TruncateToWidth
              - CanvasNet-Rendering-TextRenderer-TruncateToWidthValidation

          - id: CanvasNet-Rendering-Shapes
            title: >-
              The Rendering subsystem shall provide convenience fill and stroke helpers for
              axis-aligned rectangles, rounded rectangles, and circles, each honoring the
              Canvas current transform.
            justification: |
              Rectangles, rounded rectangles, and circles are the most common primitives; a
              caller should not have to construct a Path manually for each.
            children:
              - CanvasNet-Rendering-Shapes-Rect
              - CanvasNet-Rendering-Shapes-RoundRect
              - CanvasNet-Rendering-Shapes-Circle
              - CanvasNet-Rendering-Shapes-Validation

          - id: CanvasNet-Rendering-WordWrap
            title: >-
              The Rendering subsystem shall pack a paragraph's tokens into lines with a greedy word
              wrap that never splits a word group, keeps an oversized group whole on its own line,
              honors explicit line breaks, lets the caller classify and measure each token (the
              measure seeing the width already used on the line) in single or double precision, and
              validates its arguments.
            justification: |
              Document layout engines wrap text by the same rule whatever their font and unit
              system; one tested packer replaces the copies each carried and keeps their line
              breaks consistent.
            children:
              - CanvasNet-Rendering-WordWrap-Packing
              - CanvasNet-Rendering-WordWrap-LineBreaks
              - CanvasNet-Rendering-WordWrap-Measure
              - CanvasNet-Rendering-WordWrap-Validation
