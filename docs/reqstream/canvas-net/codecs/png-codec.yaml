---
# Software Unit Requirements for PngCodec
#
# These requirements describe the design-level behavior of the PngCodec unit.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Codecs Requirements
        sections:
          - title: PngCodec Requirements
            requirements:
              - id: CanvasNet-Codecs-PngCodec-SaveLoadRgb
                title: >-
                  The PngCodec class shall save a Surface to an 8-bit Truecolor (RGB) PNG stream and load
                  it back with matching RGB pixel values and fully opaque alpha.
                justification: |
                  Callers need a smaller, alpha-free PNG representation for surfaces whose transparency
                  is not needed, while still round-tripping color data exactly.
                tests:
                  - PngCodec_SaveThenLoad_Rgb_ReturnsExpectedPixelsWithOpaqueAlpha

              - id: CanvasNet-Codecs-PngCodec-SaveLoadRgba
                title: >-
                  The PngCodec class shall save a Surface to an 8-bit Truecolor-with-alpha (RGBA) PNG
                  stream and load it back with matching RGBA pixel values, including alpha.
                justification: |
                  Callers need a PNG representation that preserves the surface's alpha channel exactly for
                  full round-trip fidelity.
                tests:
                  - PngCodec_SaveThenLoad_Rgba_ReturnsExpectedPixelsIncludingAlpha

              - id: CanvasNet-Codecs-PngCodec-MultiIdatChunks
                title: >-
                  The PngCodec class shall concatenate a PNG's compressed image data across multiple IDAT
                  chunks before decompressing it.
                justification: |
                  The PNG format permits (and large images commonly require) IDAT data to be split across
                  several chunks; treating each chunk in isolation would corrupt the compressed stream.
                tests:
                  - PngCodec_Load_MultipleIdatChunks_ReturnsExpectedPixels

              - id: CanvasNet-Codecs-PngCodec-AdlerValidation
                title: >-
                  The PngCodec class shall validate the Adler-32 checksum of the decompressed zlib
                  payload against the trailer stored in the file.
                justification: |
                  A mismatched Adler-32 checksum indicates the decompressed scanline data is corrupt;
                  failing clearly here prevents returning a surface built from incorrect pixel data.
                tests:
                  - PngCodec_SaveThenLoad_Rgba_ReturnsExpectedPixelsIncludingAlpha
                  - PngCodec_Load_CorruptAdlerTrailer_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-FilterReconstruction
                title: >-
                  The PngCodec class shall reconstruct scanlines encoded with any of the five standard
                  PNG filter types (None, Sub, Up, Average, Paeth).
                justification: |
                  A compliant PNG decoder must support every standard filter type, since any encoder may
                  choose any filter type for any scanline; supporting only a subset would reject valid
                  PNG files produced by other tools.
                tests:
                  - PngCodec_Load_FilterTypeSub_ReconstructsExpectedPixels
                  - PngCodec_Load_FilterTypeUp_ReconstructsExpectedPixels
                  - PngCodec_Load_FilterTypeAverage_ReconstructsExpectedPixels
                  - PngCodec_Load_FilterTypePaeth_ReconstructsExpectedPixels

              - id: CanvasNet-Codecs-PngCodec-LoadFromPath
                title: The PngCodec class shall load a Surface from a PNG file given a file path.
                justification: |
                  Callers commonly have PNG images stored as files and need a convenient way to load them
                  without manually opening a stream.
                tests:
                  - PngCodec_Load_FromFilePath_ReturnsExpectedPixels

              - id: CanvasNet-Codecs-PngCodec-SaveToPath
                title: The PngCodec class shall save a Surface to a PNG file given a file path.
                justification: |
                  Callers commonly need to persist a surface as a PNG file without manually opening a
                  stream.
                tests:
                  - PngCodec_Load_FromFilePath_ReturnsExpectedPixels

              - id: CanvasNet-Codecs-PngCodec-SaveNullCanvas
                title: The PngCodec class shall reject a null surface argument to Save with ArgumentNullException.
                justification: |
                  A null surface has no pixel data to write; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - PngCodec_Save_NullCanvas_ThrowsArgumentNullException

              - id: CanvasNet-Codecs-PngCodec-SaveNullStream
                title: The PngCodec class shall reject a null stream argument to Save with ArgumentNullException.
                justification: |
                  A null stream cannot be written to; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - PngCodec_Save_NullStream_ThrowsArgumentNullException

              - id: CanvasNet-Codecs-PngCodec-SaveNullPath
                title: The PngCodec class shall reject a null path argument to Save with ArgumentNullException.
                justification: |
                  A null path cannot identify a destination file; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - PngCodec_Save_NullPath_ThrowsArgumentNullException

              - id: CanvasNet-Codecs-PngCodec-SaveEmptyPath
                title: The PngCodec class shall reject an empty path argument to Save with ArgumentException.
                justification: |
                  An empty path cannot identify a destination file; rejecting it immediately prevents an
                  obscure file-system error.
                tests:
                  - PngCodec_Save_EmptyPath_ThrowsArgumentException

              - id: CanvasNet-Codecs-PngCodec-SaveInvalidColorType
                title: >-
                  The PngCodec class shall reject an undefined PngColorType argument to Save with
                  ArgumentOutOfRangeException.
                justification: |
                  An undefined color type cannot be encoded to a valid PNG file; rejecting it immediately
                  prevents a malformed file from being written.
                tests:
                  - PngCodec_Save_UndefinedColorType_ThrowsArgumentOutOfRangeException

              - id: CanvasNet-Codecs-PngCodec-LoadNullStream
                title: The PngCodec class shall reject a null stream argument to Load with ArgumentNullException.
                justification: |
                  A null stream has no data to read; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - PngCodec_Load_NullStream_ThrowsArgumentNullException

              - id: CanvasNet-Codecs-PngCodec-LoadNullPath
                title: The PngCodec class shall reject a null path argument to Load with ArgumentNullException.
                justification: |
                  A null path cannot identify a source file; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - PngCodec_Load_NullPath_ThrowsArgumentNullException

              - id: CanvasNet-Codecs-PngCodec-LoadEmptyPath
                title: The PngCodec class shall reject an empty path argument to Load with ArgumentException.
                justification: |
                  An empty path cannot identify a source file; rejecting it immediately prevents an
                  obscure file-system error.
                tests:
                  - PngCodec_Load_EmptyPath_ThrowsArgumentException

              - id: CanvasNet-Codecs-PngCodec-LoadBadSignature
                title: >-
                  The PngCodec class shall reject a stream that does not begin with the standard 8-byte
                  PNG signature with InvalidDataException.
                justification: |
                  Data not beginning with the PNG signature is not a PNG file; failing clearly here
                  prevents attempting to interpret arbitrary data as chunk information.
                tests:
                  - PngCodec_Load_BadSignature_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadGrayscale
                title: >-
                  The PngCodec class shall load a Surface from an 8-bit Grayscale PNG, mapping each
                  gray sample to equal red, green, and blue channel values.
                justification: |
                  Grayscale is one of the five color types the PNG specification defines; callers
                  presenting grayscale source images need Load to decode them, not just the truecolor
                  color types.
                tests:
                  - PngCodec_Load_Grayscale8Bit_ReturnsExpectedGrayPixels

              - id: CanvasNet-Codecs-PngCodec-LoadGrayscaleAlpha
                title: >-
                  The PngCodec class shall load a Surface from an 8-bit Grayscale-with-alpha PNG,
                  mapping each gray sample to equal red, green, and blue channel values and preserving
                  the file's per-pixel alpha sample exactly.
                justification: |
                  Grayscale-with-alpha is one of the five color types the PNG specification defines;
                  callers presenting grayscale-with-alpha source images need Load to decode them with
                  their alpha channel preserved.
                tests:
                  - PngCodec_Load_GrayscaleAlpha8Bit_ReturnsExpectedPixels

              - id: CanvasNet-Codecs-PngCodec-LoadPalette
                title: >-
                  The PngCodec class shall load a Surface from an 8-bit Palette (indexed-color) PNG,
                  resolving each pixel's palette index to its corresponding color, and shall reject a
                  Palette PNG missing its required palette chunk, or containing an out-of-range palette
                  index, with InvalidDataException.
                justification: |
                  Palette/indexed color is one of the five color types the PNG specification defines;
                  callers presenting palette-encoded source images need Load to decode them. A palette
                  index cannot be resolved to a color without the file's palette data present and
                  covering every index used, so a missing or insufficient palette must be rejected
                  rather than silently producing an incorrect or out-of-bounds color.
                tests:
                  - PngCodec_Load_Palette8Bit_ResolvesIndicesThroughPlte
                  - PngCodec_Load_PaletteWithoutPlte_ThrowsInvalidDataExceptionMentioningPlte
                  - PngCodec_Load_PaletteIndexOutOfRange_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadTrnsPalette
                title: >-
                  The PngCodec class shall apply a Palette PNG's per-palette-entry transparency values
                  to every pixel using the corresponding palette index.
                justification: |
                  The PNG specification allows a Palette image to declare a distinct alpha value for
                  each palette entry; callers need those transparency values honored to reproduce the
                  image's intended appearance.
                tests:
                  - PngCodec_Load_PaletteWithTrns_AppliesPerIndexAlpha

              - id: CanvasNet-Codecs-PngCodec-LoadTrnsGrayscale
                title: >-
                  The PngCodec class shall make fully transparent every pixel of a Grayscale PNG whose
                  sample exactly matches its declared single-gray-value transparency key, comparing the
                  full-precision sample value (not a value already reduced to 8 bits) against the key.
                justification: |
                  The PNG specification allows a Grayscale image to declare one gray value as
                  fully transparent wherever it occurs (key-color transparency); comparing against the
                  full-precision sample, rather than a value already reduced for display, avoids
                  false-positive transparency matches at higher bit depths.
                tests:
                  - PngCodec_Load_GrayscaleWithTrns_MarksExactMatchTransparent
                  - PngCodec_Load_Grayscale16BitTrns_ComparesRawSampleBeforeDownshift

              - id: CanvasNet-Codecs-PngCodec-LoadTrnsTruecolor
                title: >-
                  The PngCodec class shall make fully transparent every pixel of a Truecolor PNG whose
                  red/green/blue samples exactly match its declared single-color transparency key.
                justification: |
                  The PNG specification allows a Truecolor image to declare one RGB color as fully
                  transparent wherever it occurs (key-color transparency); callers need this honored to
                  reproduce the image's intended appearance.
                tests:
                  - PngCodec_Load_TruecolorWithTrns_MarksExactMatchTransparent

              - id: CanvasNet-Codecs-PngCodec-LoadSubByteDepths
                title: >-
                  The PngCodec class shall load a Surface from a Grayscale or Palette PNG whose bit
                  depth is 1, 2, or 4 bits per sample, scaling Grayscale samples to the full 0-255
                  channel range.
                justification: |
                  The PNG specification permits Grayscale and Palette images to store samples more
                  compactly than one byte each; callers presenting such compactly-encoded images need
                  Load to decode them, with grayscale brightness scaled to a full display range rather
                  than left compressed into a few low bit values.
                tests:
                  - PngCodec_Load_Grayscale1BitDepth_ScalesSamplesAndUnpacksMsbFirst
                  - PngCodec_Load_Grayscale2BitDepth_ScalesSamples
                  - PngCodec_Load_Grayscale4BitDepth_ScalesSamples
                  - PngCodec_Load_Palette2BitDepth_UnpacksIndicesWithoutScaling

              - id: CanvasNet-Codecs-PngCodec-Load16BitDepth
                title: >-
                  The PngCodec class shall load a Surface from a Grayscale, Truecolor,
                  Grayscale-with-alpha, or Truecolor-with-alpha PNG whose bit depth is 16 bits per
                  sample, by using the high byte of each 16-bit sample as the 8-bit channel value.
                justification: |
                  The PNG specification permits any color type except Palette to store 16-bit-per-sample
                  data for higher precision than this library's 8-bit-per-channel Surface pixel format
                  retains; callers presenting such images need Load to decode them by using the high
                  byte of each 16-bit sample (discarding the low byte) as the 8-bit channel value,
                  rather than rejecting the file outright.
                tests:
                  - PngCodec_Load_Grayscale16BitDepth_DiscardsLowByte
                  - PngCodec_Load_TruecolorAlpha16BitDepth_DiscardsLowByteOfEveryChannel

              - id: CanvasNet-Codecs-PngCodec-LoadInvalidCombination
                title: >-
                  The PngCodec class shall reject a PNG whose bit depth and color type form a
                  combination the PNG specification does not define with InvalidDataException.
                justification: |
                  The PNG specification restricts which bit depths are legal for each color type (for
                  example, Palette images are never encoded at 16 bits per sample); such a combination
                  cannot represent any valid PNG image, so failing clearly here prevents attempting to
                  interpret data whose byte layout is undefined.
                tests:
                  - PngCodec_Load_InvalidBitDepthColorTypeCombination_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadUnsupportedInterlace
                title: >-
                  The PngCodec class shall reject an Adam7-interlaced PNG with InvalidDataException,
                  even though such a file is otherwise well-formed.
                justification: |
                  Adam7 interlacing reorders scanline data into seven sequential passes that this codec
                  does not decode; failing clearly here prevents silently producing a scrambled image.
                  This is the only remaining color-type/bit-depth/interlace combination Load refuses
                  that is not itself malformed per the PNG specification.
                tests:
                  - PngCodec_Load_UnsupportedInterlaceAdam7_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadExceedsMaxDimension
                title: >-
                  The PngCodec class shall reject a PNG whose IHDR width or height exceeds
                  Surface.MaxDimension with InvalidDataException.
                justification: |
                  A width or height beyond Surface's maximum permitted dimension would otherwise reach
                  the Surface constructor unchecked and surface as an ArgumentOutOfRangeException, and
                  would also make the row-byte-width (width * channels) arithmetic performed before the
                  Surface is constructed unsafe; validating it against the same bound immediately after
                  parsing IHDR keeps the documented InvalidDataException contract for all
                  malformed/unsupported PNG data.
                tests:
                  - PngCodec_Load_WidthExceedsMaxDimension_ThrowsInvalidDataException
                  - PngCodec_Load_HeightExceedsMaxDimension_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadCorruptCrc
                title: >-
                  The PngCodec class shall reject a PNG chunk whose CRC-32 does not match its type and
                  data with InvalidDataException.
                justification: |
                  A chunk with a mismatched CRC-32 is corrupt; failing clearly here prevents interpreting
                  corrupted bytes as valid image data.
                tests:
                  - PngCodec_Load_CorruptChunkCrc_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadTruncatedStream
                title: >-
                  The PngCodec class shall reject a stream that ends before all declared chunk data (and
                  the mandatory IEND chunk) has been read with InvalidDataException.
                justification: |
                  A truncated stream cannot supply a complete, valid PNG file; failing clearly here
                  prevents returning a surface built from incomplete data.
                tests:
                  - PngCodec_Load_TruncatedStream_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadChunkBeforeIhdr
                title: >-
                  The PngCodec class shall reject a PNG stream in which an IDAT or IEND chunk appears
                  before the mandatory IHDR chunk, with InvalidDataException naming IHDR as the cause.
                justification: |
                  IHDR is required by the PNG specification to be the first chunk and supplies the
                  width, height, and color type every later chunk depends on; encountering IDAT or IEND
                  first means no header has been parsed, so failing clearly here (rather than decoding
                  pixel data from default/uninitialized header fields) prevents returning an incorrect
                  surface.
                tests:
                  - PngCodec_Load_IendBeforeIhdr_ThrowsInvalidDataExceptionMentioningIhdr

              - id: CanvasNet-Codecs-PngCodec-LoadUnrecognizedCriticalChunk
                title: >-
                  The PngCodec class shall reject a PNG stream containing an unrecognized critical
                  chunk (a chunk type not IHDR/PLTE/tRNS/IDAT/IEND whose first type byte is an
                  uppercase ASCII letter) with InvalidDataException, while continuing to skip an
                  unrecognized ancillary chunk (lowercase first type byte) exactly as before.
                justification: |
                  Per the PNG specification, a chunk type's first byte's case marks it critical
                  (uppercase) or ancillary (lowercase); an unrecognized critical chunk may change how
                  pixel data must be interpreted, so a conforming decoder that does not understand it
                  must refuse to decode rather than risk silently producing incorrect pixels. An
                  unrecognized ancillary chunk carries no information required to decode pixels
                  correctly and remains safe to skip.
                tests:
                  - PngCodec_Load_UnrecognizedCriticalChunk_ThrowsInvalidDataException
                  - PngCodec_Load_UnrecognizedAncillaryChunk_StillLoadsSuccessfully

              - id: CanvasNet-Codecs-PngCodec-LoadPlteForbiddenForGrayscale
                title: >-
                  The PngCodec class shall reject a PLTE chunk on a grayscale (color type 0) or
                  grayscale-with-alpha (color type 4) PNG with InvalidDataException.
                justification: |
                  The PNG specification forbids a PLTE chunk for either grayscale color type, since
                  grayscale samples are sample magnitudes, never palette indices, and are therefore
                  never resolved through a palette; tolerating a PLTE chunk on such a file would mean
                  accepting a non-conforming file a correct encoder never produces.
                tests:
                  - PngCodec_Load_PlteOnGrayscale_ThrowsInvalidDataException
                  - PngCodec_Load_PlteOnGrayscaleAlpha_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadTrnsOrderRequiresPlteForPalette
                title: >-
                  The PngCodec class shall reject a tRNS chunk that precedes the PLTE chunk on an
                  indexed-color (color type 3) PNG with InvalidDataException naming PLTE as the cause.
                justification: |
                  A palette tRNS chunk's per-palette-entry alpha values are meaningless until the
                  palette they index into has been read; the PNG specification requires tRNS to follow
                  PLTE for indexed-color images, a stricter ordering than the existing
                  after-IHDR-and-before-IDAT check this codec already enforced.
                tests:
                  - PngCodec_Load_TrnsBeforePlteForIndexedColor_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-LoadTrnsForbiddenForAlphaColorTypes
                title: >-
                  The PngCodec class shall reject a tRNS chunk on a grayscale-with-alpha (color type
                  4) or Truecolor-with-alpha (color type 6) PNG with InvalidDataException.
                justification: |
                  Both color types already carry a full per-pixel alpha channel, leaving nothing for a
                  single-key-color transparency chunk to add; the PNG specification forbids tRNS for
                  these color types, so tolerating it would mean accepting a non-conforming file a
                  correct encoder never produces.
                tests:
                  - PngCodec_Load_TrnsOnGrayscaleAlpha_ThrowsInvalidDataException
                  - PngCodec_Load_TrnsOnTruecolorAlpha_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-GetInfo
                title: >-
                  The PngCodec class shall report a PNG's width, height, channel count, and alpha
                  presence via GetInfo, given a stream or a file path, by reading only the signature
                  and IHDR chunk, without decoding IDAT pixel data and without enforcing
                  Surface.MaxDimension. The first chunk's type, and (only once confirmed IHDR) its
                  declared length, shall both be validated to be IHDR / exactly 13 before any
                  length-dependent allocation or read of the chunk's data payload is attempted. For a
                  Palette PNG, the reported channel count and alpha presence shall describe the file's
                  raw palette-index encoding (one channel, no alpha), not the color Load produces after
                  resolving each index.
                justification: |
                  Callers need to inspect a PNG's declared dimensions and color type (for example to
                  reject unreasonably large images before allocating a Surface) without paying the cost
                  of inflating and decoding the full pixel buffer, and without GetInfo itself
                  preemptively rejecting dimensions that only Load's allocation path needs to guard
                  against. Because GetInfo exists specifically to let callers cheaply triage untrusted
                  input, a crafted first chunk declaring an attacker-controlled multi-gigabyte length
                  must never be allocated/read before its type and length are known to be valid. A
                  Palette file's raw encoding is a single index per pixel; reporting the post-resolution
                  channel count would misrepresent what GetInfo actually inspected (it never reads the
                  palette).
                tests:
                  - PngCodec_GetInfo_Rgb_ReturnsExpectedInfoWithoutAlpha
                  - PngCodec_GetInfo_Rgba_ReturnsExpectedInfoWithAlpha
                  - PngCodec_GetInfo_NeverReadsPastIhdr
                  - PngCodec_GetInfo_SucceedsWithCorruptIdatRegion_ButLoadThrows
                  - PngCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows
                  - PngCodec_GetInfo_NonIhdrFirstChunkWithHugeDeclaredLength_ThrowsWithoutLargeAllocation
                  - PngCodec_GetInfo_IhdrChunkWithWrongDeclaredLength_ThrowsWithoutLargeAllocation
                  - PngCodec_GetInfo_Grayscale_ReturnsExpectedInfoWithoutAlpha
                  - PngCodec_GetInfo_GrayscaleAlpha_ReturnsExpectedInfoWithAlpha
                  - PngCodec_GetInfo_Palette_ReturnsRawFileEncodingNotDecodedRgba

              - id: CanvasNet-Codecs-PngCodec-GetInfoAnyDecodability
                title: >-
                  The PngCodec class shall report a PNG's width and height via GetInfo for every file
                  whose IHDR chunk is well-formed, regardless of whether Load can decode that file's
                  color type, bit depth, or interlacing.
                justification: |
                  Probing a file's declared size is strictly safer than decoding its pixels, and is
                  exactly the operation a caller needs to reject an oversized or otherwise suspect file
                  before deciding whether to invoke Load at all; requiring a file to also be decodable
                  before GetInfo will report its size would defeat that purpose for the exact files most
                  worth probing first (unusually large or unfamiliar-format images).
                tests:
                  - PngCodec_GetInfo_SubByteGrayscaleBitDepth_ReturnsCorrectDimensions
                  - PngCodec_GetInfo_BitDepth16_ReturnsCorrectDimensions
                  - PngCodec_GetInfoAndLoad_InvalidBitDepth_BothThrowInvalidDataException
                  - PngCodec_GetInfoAndLoad_InvalidColorType_BothThrowInvalidDataException
                  - PngCodec_Load_UnsupportedInterlaceAdam7_ThrowsInvalidDataException
                  - PngSuiteUnsupportedFile_GetInfoStillSucceeds

              - id: CanvasNet-Codecs-PngCodec-GetInfoValidation
                title: >-
                  The PngCodec class shall reject null stream/path, empty path, and malformed-signature
                  arguments to GetInfo with the same exception contract as Load (ArgumentNullException,
                  ArgumentException, or InvalidDataException respectively).
                justification: |
                  Callers need GetInfo's failure behavior to be exactly as predictable as Load's, so
                  invalid arguments or unreadable PNG data are rejected the same way regardless of which
                  entry point is used.
                tests:
                  - PngCodec_GetInfo_NullStream_ThrowsArgumentNullException
                  - PngCodec_GetInfo_NullPath_ThrowsArgumentNullException
                  - PngCodec_GetInfo_EmptyPath_ThrowsArgumentException
                  - PngCodec_GetInfo_BadSignature_ThrowsInvalidDataException

              - id: CanvasNet-Codecs-PngCodec-PngSuiteSupported
                title: >-
                  The PngCodec class shall successfully load every well-formed, non-interlaced PngSuite
                  conformance file, covering every color type and bit depth combination the PNG
                  specification defines.
                justification: |
                  The PngSuite corpus is the industry-standard conformance suite for PNG decoders;
                  successfully loading every well-formed, non-interlaced file it contains demonstrates
                  interoperability with real-world encoder output across the full range of color
                  types and bit depths, not just hand-built test streams.
                tests:
                  - PngCodec_Load_PngSuiteSupportedFile_ReturnsCanvas

              - id: CanvasNet-Codecs-PngCodec-PngSuiteUnsupported
                title: >-
                  The PngCodec class shall reject every Adam7-interlaced PngSuite conformance file with
                  InvalidDataException, while still reporting its correct dimensions via GetInfo.
                justification: |
                  Adam7-interlaced files are structurally valid PNG files this codec's Load does not
                  reconstruct; the PngSuite corpus exercises every interlaced encoding this codec
                  produces and confirms each is rejected by Load clearly rather than silently
                  misinterpreted, while confirming GetInfo remains unaffected by the same limitation.
                tests:
                  - PngCodec_Load_PngSuiteUnsupportedFile_ThrowsInvalidDataException
                  - PngSuiteUnsupportedFile_GetInfoStillSucceeds

              - id: CanvasNet-Codecs-PngCodec-PngSuiteCorrupt
                title: >-
                  The PngCodec class shall reject every deliberately corrupt PngSuite conformance file
                  with InvalidDataException.
                justification: |
                  The PngSuite corpus includes files with deliberate corruption (bad signature, bad IHDR
                  CRC-32, invalid color-type/bit-depth combinations); confirming each is rejected clearly
                  demonstrates robustness against malformed real-world input.
                tests:
                  - PngCodec_Load_PngSuiteCorruptFile_ThrowsInvalidDataException
