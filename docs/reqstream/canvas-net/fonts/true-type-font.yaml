---
# Software Unit Requirements for TrueTypeFont
#
# These requirements describe the design-level behavior of the TrueTypeFont unit.
# cspell:ignore glyf sfnt cmap loca hmtx hhea maxp notdef
# cspell:ignore codepoint codepoints subtable subtables subsetted renderable

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Fonts Requirements
        sections:
          - title: TrueTypeFont Requirements
            requirements:
              - id: CanvasNet-Fonts-TrueTypeFont-LoadStream
                title: >-
                  The TrueTypeFont class shall load a TrueType font from a stream and expose its
                  UnitsPerEm, Ascender, Descender, LineGap, and GlyphCount metrics.
                justification: |
                  Callers need to load a font and inspect its top-level metrics before laying out or
                  rendering any text.
                tests:
                  - TrueTypeFont_Load_WellFormedFont_ExposesMetrics

              - id: CanvasNet-Fonts-TrueTypeFont-LoadPath
                title: The TrueTypeFont class shall load a TrueType font given a file path.
                justification: |
                  Callers commonly have font files stored on disk and need a convenient way to load
                  them without manually opening a stream.
                tests:
                  - TrueTypeFont_Load_Path_ReadsFromFile

              - id: CanvasNet-Fonts-TrueTypeFont-LoadNullStream
                title: The TrueTypeFont class shall reject a null stream argument to Load with ArgumentNullException.
                justification: |
                  A null stream has no data to read; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - TrueTypeFont_Load_NullStream_ThrowsArgumentNullException

              - id: CanvasNet-Fonts-TrueTypeFont-LoadNullPath
                title: The TrueTypeFont class shall reject a null path argument to Load with ArgumentNullException.
                justification: |
                  A null path cannot identify a source file; rejecting it immediately prevents a
                  NullReferenceException deeper in the call stack.
                tests:
                  - TrueTypeFont_Load_NullPath_ThrowsArgumentNullException

              - id: CanvasNet-Fonts-TrueTypeFont-LoadEmptyPath
                title: The TrueTypeFont class shall reject an empty path argument to Load with ArgumentException.
                justification: |
                  An empty path cannot identify a source file; rejecting it immediately prevents an
                  obscure file-system error.
                tests:
                  - TrueTypeFont_Load_EmptyPath_ThrowsArgumentException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectUnrecognizedVersion
                title: >-
                  The TrueTypeFont class shall reject a font whose declared format version is not
                  recognized as TrueType with InvalidDataException.
                justification: |
                  Data whose declared version is not a supported TrueType variant is not a font this
                  class can interpret; failing clearly here prevents misreading arbitrary data as a
                  table directory.
                tests:
                  - SfntContainer_Parse_UnrecognizedVersion_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectOttoWithoutCffTable
                title: >-
                  The TrueTypeFont class shall reject a font that declares CFF/OpenType outlines but
                  does not contain the required CFF table with InvalidDataException.
                justification: |
                  An OTTO-flavored font without its required CFF table has no glyph outline data
                  this class can read under either supported outline representation; failing
                  clearly here prevents silently producing empty or incorrect glyph outlines.
                tests:
                  - TrueTypeFont_Load_OttoFont_ThrowsInvalidDataException
                  - SfntContainer_Parse_OttoVersion_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectMissingRequiredTable
                title: >-
                  The TrueTypeFont class shall reject a font missing any required table (head, maxp,
                  hhea, hmtx, loca, or glyf) with InvalidDataException.
                justification: |
                  Every required table supplies metrics or glyph data this class must read; a font
                  missing one cannot be queried correctly, so failing at load time avoids returning an
                  object in a partially usable state.
                tests:
                  - TrueTypeFont_Load_MissingRequiredTable_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectUnsupportedGlyphOutlineVersion
                title: >-
                  The TrueTypeFont class shall reject a font whose glyph-count table uses an
                  unsupported version with InvalidDataException.
                justification: |
                  A glyph-count table using an unsupported version does not describe TrueType-style
                  outline data in the layout this class expects; failing clearly here prevents reading
                  fields at the wrong byte offsets.
                tests:
                  - TrueTypeFont_Load_MaxpVersion05_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectInvalidUnitsPerEm
                title: >-
                  The TrueTypeFont class shall reject a font declaring zero units per em with
                  InvalidDataException.
                justification: |
                  A zero units-per-em value cannot be used to scale glyph outlines to any point size;
                  failing clearly here prevents a caller from later dividing by zero.
                tests:
                  - TrueTypeFont_Load_ZeroUnitsPerEm_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectInvalidGlyphLocationFormat
                title: >-
                  The TrueTypeFont class shall reject a font declaring an unsupported glyph-location
                  table format with InvalidDataException.
                justification: |
                  Only the two documented glyph-location table formats have a defined byte layout;
                  failing clearly here prevents misinterpreting glyph offsets under an unrecognized
                  layout.
                tests:
                  - TrueTypeFont_Load_InvalidIndexToLocFormat_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectOutOfBoundsTable
                title: >-
                  The TrueTypeFont class shall reject a font whose table directory declares a table
                  offset or length outside the bounds of the font data, including combinations that
                  would overflow ordinary arithmetic, with InvalidDataException.
                justification: |
                  A table directory entry pointing outside the font data (or whose offset and length
                  would overflow) could otherwise cause an out-of-bounds read; failing clearly here
                  protects against malformed or malicious font files.
                tests:
                  - SfntContainer_Parse_TableDirectoryEntryOverflowsUint_ThrowsInvalidDataException
                  - SfntContainer_Parse_TableDirectoryEntryOutOfBounds_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectTruncatedStream
                title: >-
                  The TrueTypeFont class shall reject a font whose stream ends before its declared
                  table directory or table data has been fully read with InvalidDataException.
                justification: |
                  A truncated font stream cannot supply complete table data; failing clearly here
                  prevents returning a font object with partially read or missing data.
                tests:
                  - TrueTypeFont_Load_TruncatedStream_ThrowsInvalidDataException
                  - SfntContainer_Parse_TruncatedOffsetTable_ThrowsInvalidDataException
                  - SfntContainer_Parse_TruncatedTableDirectory_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphIndexBasicMultilingualPlane
                title: >-
                  The TrueTypeFont class shall map a Basic Multilingual Plane Unicode codepoint to its
                  glyph index via GetGlyphIndex when the font's character map supports it.
                justification: |
                  Callers most commonly need to render text made up of Basic Multilingual Plane
                  codepoints (for example Latin text), so this is the primary character-to-glyph
                  lookup path.
                tests:
                  - CmapTable_Format4_BmpLookup_ReturnsMappedGlyphIndex
                  - TrueTypeFont_Load_EndToEnd_GlyphIndexOutlineAdvanceAndKerning

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphIndexSupplementaryPlane
                title: >-
                  The TrueTypeFont class shall map a Unicode codepoint outside the Basic Multilingual
                  Plane to its glyph index via GetGlyphIndex when the font's character map supports it.
                justification: |
                  Callers rendering emoji or other supplementary-plane characters need those
                  codepoints resolved to glyph indices, not just codepoints within the Basic
                  Multilingual Plane.
                tests:
                  - CmapTable_Format12_SupplementaryPlaneLookup_ReturnsMappedGlyphIndex
                  - CmapTable_Format12_GroupRange_ReturnsOffsetGlyphIndex

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphIndexUnmappedFallback
                title: >-
                  The TrueTypeFont class shall return glyph index 0 from GetGlyphIndex for a codepoint
                  the font's character map does not map, without throwing.
                justification: |
                  An unmapped codepoint is a normal occurrence (for example a character the font does
                  not support); returning the conventional "missing glyph" index lets a caller render a
                  fallback rather than crash.
                tests:
                  - CmapTable_Format4_UnmappedCodepoint_ReturnsZero
                  - TrueTypeFont_GetGlyphIndex_UnmappedCodepoint_NeverThrows

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphIndexNoCharacterMap
                title: >-
                  The TrueTypeFont class shall return glyph index 0 from GetGlyphIndex for every
                  codepoint when the font has no usable character map, without throwing.
                justification: |
                  Some legitimately embedded or subsetted fonts omit a character map entirely, or use
                  only unsupported mapping schemes; degrading gracefully rather than rejecting the font
                  outright lets a caller still use the font by glyph index directly.
                tests:
                  - CmapTable_NoSupportedSubtable_GetGlyphIndexReturnsZero
                  - CmapTable_Empty_GetGlyphIndexReturnsZero
                  - TrueTypeFont_Load_NoCmapOrKern_FallsBackGracefully

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineSimple
                title: >-
                  The TrueTypeFont class shall decode a simple glyph's outline via GetGlyphOutline as
                  a Path made up of line segments and quadratic Bezier curves, in raw font design
                  units.
                justification: |
                  Callers need a renderable outline for the most common glyph shape (a directly
                  described contour), expressed using the curve types the Geometry namespace already
                  supports natively.
                tests:
                  - GlyfLocaReader_SimpleGlyph_AllOnCurve_ProducesLineSegments
                  - GlyfLocaReader_SimpleGlyph_ConsecutiveOffCurvePoints_ProducesImpliedMidpointQuadratics
                  - GlyfLocaReader_SimpleGlyph_MixedOnAndOffCurve_ProducesQuadraticToRealOnCurvePoint

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineEmpty
                title: >-
                  The TrueTypeFont class shall return an empty Path from GetGlyphOutline for a glyph
                  with no contour data, such as the space character.
                justification: |
                  A glyph with no visible marks (for example space) is a normal, valid glyph; a caller
                  filling its outline should simply render nothing rather than receive an error.
                tests:
                  - GlyfLocaReader_EmptyGlyph_ZeroContours_ProducesEmptyPath
                  - GlyfLocaReader_ZeroLengthGlyph_ProducesEmptyPath

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineComposite
                title: >-
                  The TrueTypeFont class shall decode a composite glyph's outline via GetGlyphOutline
                  by resolving and transforming (translating, scaling, and/or rotating/skewing via a
                  2x2 matrix) each of its referenced component glyphs.
                justification: |
                  Many accented and compound characters are defined by referencing and positioning
                  simpler glyphs rather than repeating their outlines; supporting this is required to
                  render such characters correctly.
                tests:
                  - GlyfLocaReader_CompositeGlyph_SingleComponent_ProducesTranslatedOutline
                  - GlyfLocaReader_CompositeGlyph_ScaledComponent_ScalesOutline
                  - GlyfLocaReader_CompositeGlyph_TwoByTwoTransform_TransformsOutline
                  - GlyfLocaReader_CompositeGlyph_MultipleComponents_ProducesMultipleSubpaths
                  - GlyfLocaReader_CompositeGlyph_ScaledComponentOffset_TransformsTranslation

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineNestedComposite
                title: >-
                  The TrueTypeFont class shall decode a composite glyph via GetGlyphOutline whose own
                  components are themselves composite glyphs, resolving the full nesting correctly.
                justification: |
                  Some fonts build compound characters from components that are themselves composite,
                  not just simple, glyphs; correctly resolving this nesting is required for those
                  characters to render.
                tests:
                  - GlyfLocaReader_CompositeGlyph_NestedComposite_ResolvesRecursively

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineRejectsCircularComposite
                title: >-
                  The TrueTypeFont class shall reject a composite glyph that references itself,
                  directly or indirectly, with InvalidDataException rather than hanging or crashing.
                justification: |
                  A malformed or malicious font could define a composite glyph that references itself;
                  detecting and rejecting this deterministically prevents an unbounded recursion from
                  hanging or crashing the calling process.
                tests:
                  - GlyfLocaReader_CompositeGlyph_SelfReferentialCycle_ThrowsInvalidDataExceptionViaDepthCap

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineRejectsExcessiveComposite
                title: >-
                  The TrueTypeFont class shall reject a composite glyph that would resolve to an
                  excessive total number of components with InvalidDataException rather than hanging
                  or crashing.
                justification: |
                  A malformed or malicious font could define composite glyphs that reference each
                  other in a way that multiplies out to an enormous number of components without ever
                  forming a literal cycle; bounding the total resolved component count prevents this
                  from hanging or crashing the calling process.
                tests:
                  - GlyfLocaReader_CompositeGlyph_ExponentialBlowUp_ThrowsInvalidDataExceptionViaComponentCap

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineRejectsExcessivePoints
                title: >-
                  The TrueTypeFont class shall reject a composite glyph that would resolve to an
                  excessive total number of outline points/commands with InvalidDataException
                  rather than hanging or crashing.
                justification: |
                  A malformed or malicious font could define a composite glyph that references a
                  single large simple glyph many times, without the reference count alone exceeding
                  the total-component bound; bounding the total resolved point/command count
                  prevents this amplified geometry from hanging or crashing the calling process.
                tests:
                  - GlyfLocaReader_CompositeGlyph_LargeSimpleGlyphReferencedTwice_ThrowsInvalidDataExceptionViaPointBudget

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineRejectsPointMatchedComponent
                title: >-
                  The TrueTypeFont class shall reject a composite glyph component that positions
                  itself by matching points rather than by an explicit offset, with
                  InvalidDataException.
                justification: |
                  Point-matched component positioning is not supported by this class; rejecting it
                  clearly prevents silently mis-positioning the component instead of producing an
                  incorrect but seemingly valid outline.
                tests:
                  - GlyfLocaReader_CompositeGlyph_PointMatchedComponent_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphOutlineRejectsMalformedGlyphData
                title: >-
                  The TrueTypeFont class shall reject malformed or truncated glyph outline data,
                  including an out-of-range referenced component glyph index and an invalid declared
                  contour count, with InvalidDataException.
                justification: |
                  Malformed glyph data cannot be decoded into a correct outline; failing clearly here
                  prevents producing a garbled or partially decoded outline that a caller could
                  mistake for valid glyph geometry.
                tests:
                  - GlyfLocaReader_CompositeGlyph_OutOfRangeComponentGlyphIndex_ThrowsInvalidDataException
                  - GlyfLocaReader_TruncatedGlyphHeader_ThrowsInvalidDataException
                  - GlyfLocaReader_InvalidContourCount_ThrowsInvalidDataException
                  - GlyfLocaReader_Parse_LocaEntryExceedsGlyfBounds_ThrowsInvalidDataException
                  - GlyfLocaReader_Parse_NonMonotonicLocaEntries_ThrowsInvalidDataException
                  - GlyfLocaReader_Parse_TruncatedLoca_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-GlyphIndexValidation
                title: >-
                  The TrueTypeFont class shall reject an out-of-range glyph index argument to
                  GetGlyphOutline with ArgumentOutOfRangeException.
                justification: |
                  An out-of-range glyph index does not identify any glyph in the font; rejecting it
                  immediately prevents an out-of-bounds read deeper in the call stack.
                tests:
                  - TrueTypeFont_GetGlyphOutline_NegativeGlyphIndex_ThrowsArgumentOutOfRangeException
                  - TrueTypeFont_GetGlyphOutline_GlyphIndexTooLarge_ThrowsArgumentOutOfRangeException
                  - GlyfLocaReader_GetGlyphOutline_NegativeGlyphIndex_ThrowsArgumentOutOfRangeException
                  - GlyfLocaReader_GetGlyphOutline_GlyphIndexTooLarge_ThrowsArgumentOutOfRangeException

              - id: CanvasNet-Fonts-TrueTypeFont-AdvanceWidth
                title: >-
                  The TrueTypeFont class shall report a glyph's horizontal advance width via
                  GetAdvanceWidth, reusing the font's last explicit advance-width entry for any glyph
                  index beyond the font's declared count of explicit entries.
                justification: |
                  Callers need each glyph's advance width to lay out successive glyphs along a line;
                  many fonts declare explicit advance widths only up to a certain glyph index and
                  expect the last one reused for the remainder, per the format's own convention.
                tests:
                  - HmtxHheaReader_Parse_ExposesMetrics
                  - HmtxHheaReader_GetAdvanceWidth_TailGlyph_ReusesLastEntry
                  - TrueTypeFont_Load_EndToEnd_GlyphIndexOutlineAdvanceAndKerning

              - id: CanvasNet-Fonts-TrueTypeFont-AdvanceWidthValidation
                title: >-
                  The TrueTypeFont class shall reject an out-of-range glyph index argument to
                  GetAdvanceWidth with ArgumentOutOfRangeException.
                justification: |
                  An out-of-range glyph index does not identify any glyph in the font; rejecting it
                  immediately prevents an out-of-bounds read deeper in the call stack.
                tests:
                  - TrueTypeFont_GetAdvanceWidth_GlyphIndexTooLarge_ThrowsArgumentOutOfRangeException

              - id: CanvasNet-Fonts-TrueTypeFont-KerningLookup
                title: >-
                  The TrueTypeFont class shall report the pairwise kerning adjustment between two
                  glyphs via GetKerning when the font's kerning table defines one for that pair.
                justification: |
                  Callers positioning successive glyphs need any pair-specific spacing adjustment the
                  font designer defined, beyond each glyph's own advance width, to reproduce the
                  font's intended letter spacing.
                tests:
                  - KernTable_Format0_KnownPair_ReturnsValue
                  - TrueTypeFont_Load_EndToEnd_GlyphIndexOutlineAdvanceAndKerning

              - id: CanvasNet-Fonts-TrueTypeFont-KerningMissOrAbsentFallback
                title: >-
                  The TrueTypeFont class shall return 0 from GetKerning, without throwing, for a glyph
                  pair the font's kerning table does not define, for any glyph index (including
                  out-of-range indices), and when the font has no kerning table at all.
                justification: |
                  Most glyph pairs have no special kerning adjustment, and many fonts have no kerning
                  table at all; returning a well-defined "no adjustment" value lets a caller always
                  call GetKerning unconditionally without special-casing its absence, and never risk a
                  crash from an out-of-range index used purely for a kerning lookup.
                tests:
                  - KernTable_Format0_UnknownPair_ReturnsZero
                  - KernTable_Empty_GetKerningReturnsZero
                  - TrueTypeFont_GetKerning_OutOfRangeGlyphIndex_NeverThrows

              - id: CanvasNet-Fonts-TrueTypeFont-KerningMalformedTableTolerant
                title: >-
                  The TrueTypeFont class shall return 0 from GetKerning, without throwing, when the
                  font's kerning table is malformed, uses only unsupported subtable formats, or is
                  otherwise unusable.
                justification: |
                  A malformed or unsupported kerning table does not prevent the rest of the font from
                  being used correctly; failing the entire load over an optional, best-effort table
                  would be excessively strict.
                tests:
                  - KernTable_NoPairs_ReturnsZero
                  - KernTable_ZeroLengthTable_IsTolerant_ReturnsZero
                  - KernTable_TruncatedTable_IsTolerant_ReturnsZero
                  - KernTable_MalformedPairCount_IsTolerant_ReturnsZero
                  - KernTable_UnsupportedFormat2Subtable_IsTolerant_ReturnsZero
                  - KernTable_CrossStreamCoverage_IsSkipped_ReturnsZero

              - id: CanvasNet-Fonts-TrueTypeFont-LoadCffOutlines
                title: >-
                  The TrueTypeFont class shall load a CFF/OpenType (OTTO-flavored) font that
                  contains a well-formed CFF table, exposing the same UnitsPerEm, Ascender,
                  Descender, LineGap, GlyphCount, GetGlyphIndex, GetGlyphOutline, GetAdvanceWidth,
                  and GetKerning behavior as a glyf-flavored font.
                justification: |
                  Callers must be able to use the exact same TrueTypeFont API against either
                  supported outline flavor without any type-checking or flavor-specific handling of
                  their own.
                tests:
                  - TrueTypeFont_Load_OttoFontWithCffTable_Succeeds
                  - SfntContainer_Parse_OttoVersionWithCffTable_Succeeds
                  - TrueTypeFont_RealSourceSans3OtfFont_RendersCffGlyphOutlineAsVisibleInk

              - id: CanvasNet-Fonts-TrueTypeFont-RejectCffGlyphCountMismatch
                title: >-
                  The TrueTypeFont class shall reject a CFF-flavored font whose CFF CharStrings
                  INDEX glyph count disagrees with the glyph-count table's declared GlyphCount with
                  InvalidDataException.
                justification: |
                  A disagreement between the two glyph counts indicates the font's tables are
                  internally inconsistent; failing clearly here prevents glyph indices resolved
                  against one count from silently reading past or short of the other table's data.
                tests:
                  - TrueTypeFont_Load_CffGlyphCountMismatchesMaxp_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-RejectCidKeyedCff
                title: >-
                  The TrueTypeFont class shall reject a CID-keyed CFF font (one whose Top DICT
                  declares a ROS operator) with InvalidDataException.
                justification: |
                  CID-keyed CFF data uses a different (FDArray/FDSelect-based) private-DICT and
                  subroutine addressing scheme than the name-keyed layout this class supports;
                  failing clearly here prevents misinterpreting glyph data under the wrong scheme.
                tests:
                  - CffTable_Parse_CidKeyedRos_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-CffTableParsing
                title: >-
                  The CffTable class shall parse a CFF table's Header, Name INDEX, Top DICT INDEX,
                  String INDEX, Global Subr INDEX, Private DICT, Local Subr INDEX, and CharStrings
                  INDEX, exposing a glyph count and per-glyph outline access, decoding each glyph
                  lazily so that one corrupt glyph's charstring does not prevent any other glyph in
                  the same font from decoding, and rejecting structurally malformed or truncated
                  CFF data with InvalidDataException.
                justification: |
                  Every one of these CFF structures must be correctly located and decoded before any
                  glyph outline can be extracted, and a single corrupt or malicious glyph must never
                  be allowed to prevent every other (otherwise well-formed) glyph in the same font
                  from being used, mirroring GlyfLocaReader's equivalent per-glyph isolation.
                tests:
                  - CffTable_Parse_WellFormedFont_ExposesGlyphCountAndOutlines
                  - CffTable_Parse_NoPrivateDict_SucceedsWithNoLocalSubrs
                  - CffTable_GetGlyphOutline_OutOfRangeIndex_ThrowsArgumentOutOfRangeException
                  - CffTable_GetGlyphOutline_OneCorruptGlyph_DoesNotBreakOtherGlyphs
                  - CffTable_Parse_MissingCharStringsOperator_ThrowsInvalidDataException
                  - CffTable_Parse_UnsupportedMajorVersion_ThrowsInvalidDataException
                  - CffTable_Parse_TruncatedTable_ThrowsInvalidDataException
                  - CffTable_Parse_EmptyCharStringsIndex_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-CffStemHints
                title: >-
                  The CffCharstringInterpreter class shall interpret the hstem, vstem, hstemhm, and
                  vstemhm operators to accumulate the glyph's total stem-hint count, and the
                  hintmask and cntrmask operators to skip exactly one mask byte per every 8 stems
                  (rounded up), including stems declared implicitly by operand pairs left on the
                  stack before the first mask operator.
                justification: |
                  A hintmask/cntrmask operator's variable-length mask byte count depends entirely on
                  the number of stem hints declared so far; miscounting it would misalign every
                  subsequent operator's byte offset in the charstring, corrupting the rest of the
                  glyph's decode.
                tests:
                  - CffCharstringInterpreter_HStem_VStem_AccumulateStemCountForHintMask
                  - CffCharstringInterpreter_HintMask_ImplicitVStem_CountsTowardMaskBytes
                  - CffCharstringInterpreter_HintMask_TruncatedMaskBytes_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-CffMoveTo
                title: >-
                  The CffCharstringInterpreter class shall interpret the rmoveto, hmoveto, and
                  vmoveto operators to start a new subpath at a relative offset from the current
                  point, correctly consuming an optional leading width operand only on the first
                  stack-clearing operator in the charstring, and rejecting an operand count that
                  does not match the operator's expected arity with InvalidDataException.
                justification: |
                  Every subpath in a Type 2 charstring begins with exactly one of these three
                  moveto operators, and the first one may carry an extra leading glyph-width operand
                  that must be recognized and discarded rather than misread as a coordinate.
                tests:
                  - CffCharstringInterpreter_RMoveTo_LineTo_Endchar_ProducesClosedContour
                  - CffCharstringInterpreter_RMoveTo_WithLeadingWidth_IgnoresWidthOperand
                  - CffCharstringInterpreter_HMoveTo_VMoveTo_MoveAlongSingleAxis
                  - CffCharstringInterpreter_RMoveTo_WrongOperandCount_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-CffLineTo
                title: >-
                  The CffCharstringInterpreter class shall interpret the rlineto, hlineto, and
                  vlineto operators to append straight line segments to the current subpath,
                  alternating axis on each successive operand pair or value for hlineto/vlineto, and
                  rejecting an operand count incompatible with the operator's expected arity with
                  InvalidDataException.
                justification: |
                  Straight-line glyph segments are one of the two path segment kinds a Type 2
                  charstring can produce; hlineto/vlineto's alternating-axis operand packing must be
                  decoded correctly to reproduce the intended zig-zag polyline.
                tests:
                  - CffCharstringInterpreter_HLineTo_VLineTo_AlternateAxes
                  - CffCharstringInterpreter_RLineTo_OddOperandCount_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-CffCurveTo
                title: >-
                  The CffCharstringInterpreter class shall interpret the rrcurveto, hhcurveto,
                  vvcurveto, hvcurveto, and vhcurveto operators to append cubic Bezier curve
                  segments to the current subpath, correctly applying each operator's own leading-
                  operand and alternating-tangent conventions.
                justification: |
                  Curved glyph segments are the other of the two path segment kinds a Type 2
                  charstring can produce; each curve operator packs its operands under a distinct
                  convention that must be decoded exactly to reproduce the intended curve geometry.
                tests:
                  - CffCharstringInterpreter_RRCurveTo_ProducesCubicBezier
                  - CffCharstringInterpreter_HHCurveTo_VVCurveTo_ProduceCubicBeziers
                  - CffCharstringInterpreter_HHCurveTo_LeadingOperand_AppliesToFirstCurveOnly
                  - CffCharstringInterpreter_HVCurveTo_VHCurveTo_AlternateStartTangent
                  - CffCharstringInterpreter_HVCurveTo_TrailingOperand_SuppliesFinalAxisDelta

              - id: CanvasNet-Fonts-TrueTypeFont-CffSubroutines
                title: >-
                  The CffCharstringInterpreter class shall interpret the callsubr and callgsubr
                  operators to invoke a local or global subroutine respectively (applying the
                  correct bias of 107, 1131, or 32768 depending on that subroutine INDEX's own
                  count) and the return operator to resume the calling charstring, bounding
                  recursion by both call depth and total executed step count, and rejecting an
                  out-of-range subroutine index with InvalidDataException.
                justification: |
                  Subroutine calls let a font compactly reuse common charstring fragments across
                  many glyphs; the bias formula must be applied correctly for the interpreter to
                  resolve the intended subroutine, and both depth and step bounding are required to
                  prevent a malicious or corrupt font from causing unbounded recursion or looping.
                tests:
                  - CffCharstringInterpreter_CallSubr_AppliesBias_AndReturns
                  - CffCharstringInterpreter_CallGSubr_AppliesGlobalBias
                  - CffCharstringInterpreter_CallSubr_OutOfRangeIndex_ThrowsInvalidDataException
                  - CffCharstringInterpreter_CallSubr_ExceedsMaxDepth_ThrowsInvalidDataException
                  - CffTable_Parse_WithLocalSubrs_DecodesGlyphUsingCallSubr
                  - CffTable_Parse_WithGlobalSubrs_DecodesGlyphUsingCallGSubr

              - id: CanvasNet-Fonts-TrueTypeFont-CffEndChar
                title: >-
                  The CffCharstringInterpreter class shall interpret the endchar operator to close
                  and finish the glyph's outline, producing an empty path for a charstring
                  consisting only of endchar, and shall reject the legacy 4-leftover-operand
                  ("seac-style" accented-character composition) form of endchar, and any other
                  unexpected leftover operand count, with InvalidDataException.
                justification: |
                  Every charstring must end with endchar; its legacy seac-style accented-character
                  composition form is outside this library's supported feature set and must fail
                  clearly rather than silently produce an incomplete or incorrect outline.
                tests:
                  - CffCharstringInterpreter_EmptyCharstring_ProducesEmptyPath
                  - CffCharstringInterpreter_EndChar_SeacStyleFourOperands_ThrowsInvalidDataException
                  - CffCharstringInterpreter_EndChar_UnexpectedOperandCount_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-CffUnsupportedOperatorRejection
                title: >-
                  The CffCharstringInterpreter class shall reject any Type 2 charstring operator
                  outside its supported operator set (including the two-byte flex escape operators)
                  and any charstring that ends before its declared operator or operand data has been
                  fully read, with InvalidDataException, while correctly decoding every supported
                  fixed-point and integer operand encoding.
                justification: |
                  A fixed, well-defined operator subset keeps this interpreter's behavior fully
                  specified and auditable; any operator or operand encoding outside that subset must
                  fail clearly rather than be silently ignored or misinterpreted, and a truncated
                  charstring must never be read past its own end.
                tests:
                  - CffCharstringInterpreter_UnsupportedOperator_ThrowsInvalidDataException
                  - CffCharstringInterpreter_FlexEscapeOperator_ThrowsInvalidDataException
                  - CffCharstringInterpreter_FixedPointOperand_DecodesCorrectly
                  - CffCharstringInterpreter_TruncatedCharstring_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-GetFaceCountPlainSfnt
                title: >-
                  The TrueTypeFont class shall report a face count of 1 via GetFaceCount for an
                  ordinary (non-ttcf) single-face SFNT font, from both a stream and a file path,
                  without parsing that font's full table directory.
                justification: |
                  Callers need a single, uniform way to discover a file's face count regardless of
                  whether it is a collection, without paying the cost of a full font load just to
                  find out there is only one face.
                tests:
                  - TrueTypeFont_GetFaceCount_PlainSfnt_ReturnsOne

              - id: CanvasNet-Fonts-TrueTypeFont-GetFaceCountTtc
                title: >-
                  The TrueTypeFont class shall report the actual number of faces declared by a
                  ttcf container's header via GetFaceCount, from both a stream and a file path,
                  parsing only the container's tag and face count rather than its full table
                  directories.
                justification: |
                  Callers need to discover how many faces a TrueType Collection contains before
                  deciding which face index (or indices) to load, as cheaply as possible.
                tests:
                  - TrueTypeFont_GetFaceCount_TtcContainer_ReturnsFaceCount
                  - TrueTypeFont_GetFaceCount_Path_ReadsFromFile
                  - SfntContainer_TryReadTtcHeader_WellFormedContainer_ReturnsFaceOffsets
                  - SfntContainer_TryReadTtcHeader_EachFaceIndependentlyParsable

              - id: CanvasNet-Fonts-TrueTypeFont-LoadTtcDefaultsFaceZero
                title: >-
                  The TrueTypeFont class shall transparently select face 0 when Load(Stream) or
                  Load(string) is given a file whose tag is ttcf.
                justification: |
                  Most callers loading a collection only want its first (typically Regular-weight)
                  face; defaulting to face 0 lets the existing Load overloads keep working unchanged
                  against a ttcf file without requiring every caller to learn the new face-index API.
                tests:
                  - TrueTypeFont_Load_TtcContainer_DefaultsToFaceZero
                  - SfntContainer_TryReadTtcHeader_NonTtcFont_ReturnsFalse

              - id: CanvasNet-Fonts-TrueTypeFont-LoadTtcExplicitFaceIndex
                title: >-
                  The TrueTypeFont class shall load a specific face from a ttcf container given its
                  zero-based face index via the new Load(Stream, int) and Load(string, int)
                  overloads.
                justification: |
                  Callers that need a specific non-default face of a collection (for example a Bold
                  or Italic variant sharing the same container) must be able to select it explicitly
                  by index.
                tests:
                  - TrueTypeFont_Load_TtcContainer_ExplicitFaceIndex_SelectsThatFace
                  - TrueTypeFont_Load_TtcContainer_Path_FaceIndex_ReadsFromFile
                  - TrueTypeFont_RealTtcContainer_FaceOne_RendersCffGlyphOutlineAsVisibleInk
                  - TrueTypeFont_RealTtcContainer_FaceZero_RendersGlyfGlyphOutlineAsVisibleInk

              - id: CanvasNet-Fonts-TrueTypeFont-RejectFaceIndexOutOfRange
                title: >-
                  The TrueTypeFont class shall reject a faceIndex argument to Load(Stream, int) or
                  Load(string, int) that is negative, or is not less than the file's own face count
                  (1 for an ordinary SFNT font, or the ttcf header's declared face count for a
                  collection), with ArgumentOutOfRangeException.
                justification: |
                  A face index outside the file's actual range does not identify any real face;
                  rejecting it immediately with a precise exception prevents a caller from silently
                  receiving the wrong face or an obscure downstream parsing failure.
                tests:
                  - TrueTypeFont_Load_TtcContainer_FaceIndexOutOfRange_ThrowsArgumentOutOfRangeException
                  - TrueTypeFont_Load_NonTtcFont_FaceIndexOne_ThrowsArgumentOutOfRangeException
                  - TrueTypeFont_Load_NegativeFaceIndex_ThrowsArgumentOutOfRangeException

              - id: CanvasNet-Fonts-TrueTypeFont-FaceIndexZeroBehavesAsLoad
                title: >-
                  The TrueTypeFont class shall make Load(Stream, 0) and Load(string, 0) against an
                  ordinary (non-ttcf) font behave identically to the existing Load(Stream) and
                  Load(string) overloads.
                justification: |
                  Callers that always pass an explicit face index (for example because they do not
                  know in advance whether a file is a collection) must get exactly the same result
                  for an ordinary single-face font as they would from the original Load overloads.
                tests:
                  - TrueTypeFont_Load_NonTtcFont_FaceIndexZero_BehavesIdenticallyToLoad

              - id: CanvasNet-Fonts-TrueTypeFont-RejectMalformedTtcHeader
                title: >-
                  The TrueTypeFont class shall reject a file whose ttcf header is truncated,
                  declares zero fonts, or whose per-face offset table is truncated, with
                  InvalidDataException.
                justification: |
                  A malformed ttcf header cannot reliably identify any real face's start offset;
                  failing clearly here prevents reading a table directory from an arbitrary,
                  attacker- or corruption-controlled byte offset.
                tests:
                  - TrueTypeFont_Load_MalformedTtcHeader_ThrowsInvalidDataException
                  - SfntContainer_TryReadTtcHeader_TruncatedHeader_ThrowsInvalidDataException
                  - SfntContainer_TryReadTtcHeader_ZeroFonts_ThrowsInvalidDataException
                  - SfntContainer_TryReadTtcHeader_TruncatedFaceOffsetTable_ThrowsInvalidDataException

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoResolvesTypographicNames
                title: >-
                  The TrueTypeFont class shall prefer the name table's typographic family
                  (nameID 16) and typographic subfamily (nameID 17) records over the standard
                  family (nameID 1) and subfamily (nameID 2) records when both are present, when
                  resolving GetNameInfo's FamilyName and SubfamilyName.
                justification: |
                  The typographic name records exist specifically to carry the font's preferred
                  display family/subfamily (for example distinguishing a full weight axis from the
                  coarser legacy four-style model); callers asking for a font's name should get the
                  more accurate typographic value whenever the font author has supplied one.
                tests:
                  - TrueTypeFont_GetNameInfo_TypographicNamesPresent_PrefersNameId16And17

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoFallsBackToStandardNames
                title: >-
                  The TrueTypeFont class shall fall back to the name table's standard family
                  (nameID 1) and subfamily (nameID 2) records when resolving GetNameInfo's
                  FamilyName and SubfamilyName if the typographic (nameID 16/17) records are
                  absent.
                justification: |
                  Most real-world fonts (including every fixture bundled with this repository) only
                  supply the standard name records; GetNameInfo must still resolve a usable
                  family/subfamily name for them.
                tests:
                  - TrueTypeFont_GetNameInfo_TypographicNamesAbsent_FallsBackToNameId1And2

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoPlatformPreference
                title: >-
                  The TrueTypeFont class shall prefer a Windows platform (platformID 3) name
                  record over a Macintosh platform (platformID 1) name record for the same nameID
                  when both are present, when resolving GetNameInfo.
                justification: |
                  Windows platform records use Unicode (UTF-16BE) encoding, which unambiguously
                  round-trips any codepoint, whereas Macintosh platform records use a legacy 8-bit
                  encoding whose repertoire is far more limited; preferring the Windows record
                  yields a more faithful string whenever both are available.
                tests:
                  - TrueTypeFont_GetNameInfo_WindowsAndMacintoshRecordsPresent_PrefersWindowsRecord

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoMacintoshFallback
                title: >-
                  The TrueTypeFont class shall resolve GetNameInfo's name strings from a
                  Macintosh platform (platformID 1, encoding 0, Mac Roman) name record when no
                  Windows platform record exists for that nameID.
                justification: |
                  Some fonts (particularly older ones) only supply Macintosh platform name records;
                  GetNameInfo must still decode and expose their strings correctly rather than
                  treating the font as nameless.
                tests:
                  - TrueTypeFont_GetNameInfo_OnlyMacintoshRecordPresent_ResolvesFromMacintoshRecord

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoMissingRecordTolerant
                title: >-
                  The TrueTypeFont class shall return null for any single FontNameInfo member
                  (for example PostScriptName) whose corresponding nameID has no resolvable
                  record in the name table, without affecting resolution of the other members.
                justification: |
                  Not every font supplies every name string (a PostScript name record in
                  particular is optional); a missing individual record must not prevent the other,
                  present name strings from being resolved and returned.
                tests:
                  - TrueTypeFont_GetNameInfo_PostScriptNameRecordMissing_ReturnsNullPostScriptName

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoNoNameTableTolerant
                title: >-
                  The TrueTypeFont class shall return a FontNameInfo with every member null,
                  rather than throwing, when GetNameInfo is called on a font that has no name
                  table at all.
                justification: |
                  The name table is optional per the OpenType specification; a font's absence of
                  this table must degrade gracefully to an all-null result rather than being
                  treated as a load-time or query-time error.
                tests:
                  - TrueTypeFont_GetNameInfo_NoNameTable_ReturnsAllNullFontNameInfo

              - id: CanvasNet-Fonts-TrueTypeFont-GetNameInfoMalformedRecordTolerant
                title: >-
                  The TrueTypeFont class shall ignore an individual name table record whose
                  declared string offset/length falls outside the table's own bounds, rather than
                  throwing or discarding the entire name table's other well-formed records.
                justification: |
                  A single corrupted or truncated record must not prevent every other, independently
                  well-formed record in the same name table from being resolved and returned.
                tests:
                  - TrueTypeFont_GetNameInfo_MalformedNameRecord_IgnoresRecordWithoutThrowing

              - id: CanvasNet-Fonts-TrueTypeFont-StyleFromOs2FsSelection
                title: >-
                  The TrueTypeFont class shall derive IsBold true from the OS/2 table's
                  fsSelection bold bit (bit 5) and IsItalic true from its italic bit (bit 0) when
                  the OS/2 table is present and long enough to contain fsSelection.
                justification: |
                  The OS/2 table's fsSelection field is the OpenType specification's primary,
                  purpose-built source for a font's bold/italic classification; callers need
                  IsBold/IsItalic to reflect it directly.
                tests:
                  - TrueTypeFont_IsBold_Os2FsSelectionBoldBitSet_ReturnsTrue
                  - TrueTypeFont_IsItalic_Os2FsSelectionItalicBitSet_ReturnsTrue

              - id: CanvasNet-Fonts-TrueTypeFont-StyleFromOs2WeightClass
                title: >-
                  The TrueTypeFont class shall derive IsBold true from the OS/2 table's
                  usWeightClass being at least 600 (Semibold or heavier) when fsSelection's own
                  bold bit is not set.
                justification: |
                  Some fonts convey boldness only through usWeightClass rather than the
                  fsSelection bold bit; a heavier weight class is itself evidence of a visually
                  bold font and should also be reflected in IsBold.
                tests:
                  - TrueTypeFont_IsBold_Os2WeightClassAtLeast600_ReturnsTrue

              - id: CanvasNet-Fonts-TrueTypeFont-StyleFromPostItalicAngle
                title: >-
                  The TrueTypeFont class shall derive IsItalic true from the post table's
                  italicAngle being non-zero when the post table is present and long enough to
                  contain italicAngle.
                justification: |
                  A non-zero slant angle recorded in the post table is itself direct, independent
                  evidence that a font is italic/oblique, and should be reflected in IsItalic even
                  when other sources are silent or absent.
                tests:
                  - TrueTypeFont_IsItalic_PostItalicAngleNonZero_ReturnsTrue

              - id: CanvasNet-Fonts-TrueTypeFont-StyleFallsBackToMacStyleWhenOs2Absent
                title: >-
                  The TrueTypeFont class shall derive IsBold and IsItalic from the head table's
                  macStyle bits 0 and 1 respectively when the OS/2 table is absent, and shall
                  always OR the macStyle-derived booleans into IsBold/IsItalic even when OS/2 is
                  present.
                justification: |
                  The head table's macStyle field is mandatory (head is always present), making it
                  a reliable fallback when the optional OS/2 table is missing; because either
                  source can independently indicate a bold or italic font, combining both with OR
                  avoids a false negative when only one of the two sources reflects the truth.
                tests:
                  - TrueTypeFont_Style_Os2TableAbsent_FallsBackToHeadMacStyle

              - id: CanvasNet-Fonts-TrueTypeFont-IsFixedPitchFromPostTable
                title: >-
                  The TrueTypeFont class shall derive IsFixedPitch true from the post table's
                  isFixedPitch field being non-zero when the post table is present and long
                  enough to contain that field.
                justification: |
                  The post table's isFixedPitch field is the OpenType specification's dedicated
                  source for a font's fixed-pitch (monospace) classification.
                tests:
                  - TrueTypeFont_IsFixedPitch_PostIsFixedPitchNonZero_ReturnsTrue

              - id: CanvasNet-Fonts-TrueTypeFont-IsFixedPitchAbsentPostTableTolerant
                title: >-
                  The TrueTypeFont class shall return IsFixedPitch false, rather than throwing,
                  when the post table is absent or too short to contain isFixedPitch.
                justification: |
                  The post table is optional per the OpenType specification and has no reliable
                  alternate source for fixed-pitch classification; a font lacking it must default
                  to IsFixedPitch false rather than the query failing.
                tests:
                  - TrueTypeFont_IsFixedPitch_PostTableAbsent_ReturnsFalseWithoutThrowing
