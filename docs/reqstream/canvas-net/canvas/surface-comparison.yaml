---
# cspell:ignore psnr rmse ssim luma
# Software Unit Requirements for SurfaceComparison
#
# These requirements describe the design-level behavior of the SurfaceComparison unit of the Canvas subsystem: the
# comparison of a Surface with another of the same size (exact, deterministic metrics on opaque RGB: mean absolute
# error, root mean square error, peak signal-to-noise ratio, the fraction of pixels that differ by more than a
# tolerance, the largest channel difference, and a windowed structural similarity of the luma, plus a per-cell grid of
# the error) and the creation of a difference image, an overlay, and a side-by-side image. See
# docs/verification/canvas-net/canvas/surface-comparison.md for the test-evidence mapping.

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Canvas Requirements
        sections:
          - title: SurfaceComparison Requirements
            requirements:
              - id: CanvasNet-Canvas-SurfaceComparison-ErrorMetrics
                title: >-
                  The Surface class shall compare two surfaces of the same size on opaque RGB, ignoring alpha, and
                  report the mean absolute error (the sum of the channel differences over three times the pixel
                  count), the root mean square error, the peak signal-to-noise ratio (20 log10 of 255 over the
                  RMSE, absent when the images are identical), the largest channel difference, and whether the
                  images are identical.
                justification: |
                  A caller that redraws an image needs numbers that say how far the result is from the reference,
                  and that do not change with the way they were computed: the sums are exact integers and only the
                  final division, square root, and logarithm use floating point.
                tests:
                  - Surface_Compare_IdenticalImages_ReportsZeroErrorIdenticalAndInfinitePsnr
                  - Surface_Compare_KnownDifference_ComputesMaeRmseAndPsnr
                  - Surface_Compare_SingleChannelDifference_AveragesOverThreeChannels
                  - Surface_Compare_MaxChannelDifference_IsLargestChannelDelta
                  - Surface_Compare_AlphaChannel_IsIgnored

              - id: CanvasNet-Canvas-SurfaceComparison-Ssim
                title: >-
                  The Surface class shall compute the structural similarity of the integer luma
                  (77 R + 150 G + 29 B + 128 shifted right by 8) as the mean of uniform windows of at most 8 by 8
                  pixels (origins every 4 pixels plus a final window flush with the right and bottom edges, a
                  single window for an image smaller than the window), using the standard formula with the
                  constants (0.01 * 255) squared and (0.03 * 255) squared computed from exact integer sums, so
                  that identical images have a similarity of exactly 1 and a difference confined to the last
                  column or row is still seen.
                justification: |
                  Error metrics cannot tell a small shift of a sharp edge from noise; a structural measure can.
                  Covering every pixel with a window, and fixing the window layout, makes the number the same for
                  every caller and every run.
                tests:
                  - Surface_Ssim_IdenticalImages_IsOne
                  - Surface_Ssim_ConstantBrightnessShift_MatchesClosedForm
                  - Surface_Ssim_InvertedGradient_IsLow
                  - Surface_Ssim_ImageSmallerThanWindow_UsesOneWindow
                  - Surface_Ssim_DifferenceOnlyInLastColumnAndRow_IsDetectedByEdgeWindows

              - id: CanvasNet-Canvas-SurfaceComparison-DiffPixels
                title: >-
                  The Surface class shall count the pixels whose largest channel difference is above a tolerance
                  (0 to 255), so that a difference equal to the tolerance is not counted and a tolerance of 0
                  counts any change, and report the count and its fraction of all pixels.
                justification: |
                  Anti-aliasing and compression move pixels by a few levels; a tolerance lets the fraction of
                  visibly different pixels be asked for without counting that noise, and the boundary must be
                  unambiguous.
                tests:
                  - Surface_Compare_Tolerance_CountsOnlyPixelsAboveTolerance
                  - Surface_Compare_KnownDifference_ComputesMaeRmseAndPsnr

              - id: CanvasNet-Canvas-SurfaceComparison-Grid
                title: >-
                  The Surface class shall divide the image into a grid of columns by rows (1 to 64 each, no larger
                  than the image) whose cell boundaries are the integer divisions floor(i * size / count) so that
                  the cells partition the image exactly, report for each cell its position, size, MAE, RMSE, and
                  differing-pixel fraction (0-based column and row, row-major order), and list the worst cells:
                  those with an RMSE above zero, the largest first, ties in row-major order.
                justification: |
                  A single number does not say where an image is wrong; the cell errors point at the region to
                  fix, and exact boundaries make the cells reproducible.
                tests:
                  - Surface_Compare_Grid_Boundaries_PartitionTheImageExactly
                  - Surface_Compare_Grid_DifferenceInOneQuadrant_IsLocatedInThatCell
                  - Surface_Compare_Grid_WorstCells_AreOrderedByRmseThenPosition

              - id: CanvasNet-Canvas-SurfaceComparison-DiffImage
                title: >-
                  The Surface class shall create an opaque difference image of the size of the inputs in which each
                  pixel's amplified difference (the gain, 0.1 to 255, times the delta, rounded half away from zero
                  and clamped to 255) is drawn either through a hot ramp from black through red and yellow to
                  white (the heat style, driven by the largest channel difference, identical pixels being pure
                  black) or per channel (the absolute style).
                justification: |
                  A picture of where and how much two images differ is the fastest way to see what to correct;
                  amplification makes small differences visible, and integer arithmetic keeps the picture
                  reproducible.
                tests:
                  - Surface_CreateDiff_Heat_MapsDeltaThroughHotRamp
                  - Surface_CreateDiff_HeatSmallDelta_IsDarkRed
                  - Surface_CreateDiff_Abs_AmplifiesEachChannelAndClamps

              - id: CanvasNet-Canvas-SurfaceComparison-Overlay
                title: >-
                  The Surface class shall create an opaque overlay that blends two surfaces with the weight of the
                  second (0 to 1) rounded to a byte and each channel computed in integer arithmetic as
                  (a * (255 - w) + b * w + 127) / 255, so that weight 0 gives the colors of the first and weight 1
                  the colors of the second exactly.
                justification: |
                  An onion-skin blend shows misalignment between a reference and a redraw that a side-by-side view
                  hides; an exact rule makes the picture predictable at the ends and reproducible.
                tests:
                  - Surface_CreateOverlay_Weight_BlendsWithIntegerRule

              - id: CanvasNet-Canvas-SurfaceComparison-SideBySide
                title: >-
                  The Surface class shall create a side-by-side image of the surface, a second surface, and a
                  difference image, left to right, separated by gaps of 8 pixels of gray (#808080) and without
                  labels, and when three panels and the gaps would be wider or higher than MaxDimension shall first
                  scale the panels down uniformly with the area filter so that the sheet fits.
                justification: |
                  One picture that holds both inputs and the difference is the most compact thing to show; the
                  fixed order and gaps make it readable without labels, and the size limit must not turn a valid
                  comparison into an error.
                tests:
                  - Surface_CreateSideBySide_PlacesPanelsInOrderSeparatedByGaps
                  - Surface_CreateSideBySide_TooWide_ScalesPanelsToFitMaximum

              - id: CanvasNet-Canvas-SurfaceComparison-Arguments
                title: >-
                  The Surface class shall reject a null surface, surfaces of different sizes (naming both sizes), a
                  tolerance outside 0 to 255, a grid outside 1 to 64 per side or larger than the image, a gain
                  outside 0.1 to 255, a weight outside 0 to 1, and an undefined diff style, all before anything is
                  allocated, and shall reject a disposed surface, as either operand, with
                  ObjectDisposedException.
                justification: |
                  Each of these is a defect of the caller and must fail fast and clearly instead of producing a
                  meaningless number or picture.
                tests:
                  - Surface_Compare_SizeMismatch_ThrowsArgumentException
                  - Surface_Compare_InvalidToleranceOrGrid_ThrowsArgumentOutOfRange
                  - Surface_ComparisonMethods_NullArguments_ThrowArgumentNullException
                  - Surface_ComparisonMethods_AfterDispose_ThrowObjectDisposedException
                  - Surface_CreateImages_SizeMismatch_ThrowsArgumentException

              - id: CanvasNet-Canvas-SurfaceComparison-Deterministic
                title: >-
                  The Surface class shall give the same metrics, grid, and picture pixels when the same images are
                  compared twice.
                justification: |
                  Results are compared, cached, and checked into source control; they must not change from run to
                  run.
                tests:
                  - Surface_Compare_SameInputTwice_ReturnsEqualResults
                  - Surface_CreateImages_SameInputTwice_ProduceIdenticalPixels
