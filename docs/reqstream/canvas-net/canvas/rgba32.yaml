---
# Software Unit Requirements for Rgba32

sections:
  - title: CanvasNet Requirements
    sections:
      - title: Canvas Requirements
        sections:
          - title: Rgba32 Requirements
            requirements:
              - id: CanvasNet-Canvas-Rgba32-ParseSixHex
                title: >-
                  The Rgba32 struct shall parse a "#RRGGBB" hex string, case-insensitively, into
                  the corresponding red, green, blue channels and set alpha to 255.
                justification: |
                  The six-hex form is the most common web-style color literal; parsing lets
                  callers author colors as strings without hand-decoding hex.
                tests:
                  - Rgba32_Parse_6HexUppercase_ReturnsExpectedRgbaWithAlpha255
                  - Rgba32_Parse_6HexLowercase_ReturnsExpectedRgbaWithAlpha255
                  - Rgba32_Parse_6HexMixedCase_ReturnsExpectedRgba

              - id: CanvasNet-Canvas-Rgba32-ParseEightHex
                title: >-
                  The Rgba32 struct shall parse a "#AARRGGBB" hex string, case-insensitively,
                  into the corresponding alpha, red, green, blue channels.
                justification: |
                  The eight-hex form allows a caller to specify alpha directly as part of the
                  literal.
                tests:
                  - Rgba32_Parse_8HexUppercase_ReturnsExpectedArgb
                  - Rgba32_Parse_8HexLowercase_ReturnsExpectedArgb

              - id: CanvasNet-Canvas-Rgba32-ParseValidation
                title: >-
                  The Rgba32 Parse method shall throw ArgumentNullException on a null argument
                  and FormatException on any other invalid input (missing '#', wrong length,
                  short forms, non-hex characters), with a message that identifies the specific
                  problem — naming the accepted formats for length/short-form mismatches, the
                  missing '#' prefix by name, and the offending character for a non-hex
                  character.
                justification: |
                  Fail-fast validation gives callers a specific, actionable error rather than
                  silently accepting garbage.
                tests:
                  - Rgba32_Parse_MissingHash_ThrowsFormatException
                  - Rgba32_Parse_MissingHashPrefixAtValidLength_MessageIdentifiesMissingHash
                  - Rgba32_Parse_3HexShortForm_ThrowsFormatException
                  - Rgba32_Parse_4HexArgbShortForm_ThrowsFormatException
                  - Rgba32_Parse_7Hex_ThrowsFormatException
                  - Rgba32_Parse_9Hex_ThrowsFormatException
                  - Rgba32_Parse_NonHexCharacter_ThrowsFormatException
                  - Rgba32_Parse_NonHexCharacter_MessageIncludesOffendingCharacter
                  - Rgba32_Parse_Null_ThrowsArgumentNullException
                  - Rgba32_Parse_EmptyString_ThrowsFormatException
                  - Rgba32_Parse_ExceptionMessage_ContainsFormatGuidance

              - id: CanvasNet-Canvas-Rgba32-TryParse
                title: >-
                  The Rgba32 struct shall provide a TryParse method returning true and populating
                  the result on a valid input string, or returning false and setting the result
                  to default on any invalid input including null.
                justification: |
                  TryParse is the exception-free counterpart of Parse, expected by callers
                  parsing user input or configuration.
                tests:
                  - Rgba32_TryParse_ValidInput_ReturnsTrueAndSetsResult
                  - Rgba32_TryParse_InvalidInput_ReturnsFalseAndSetsResultToDefault
                  - Rgba32_TryParse_Null_ReturnsFalse

              - id: CanvasNet-Canvas-Rgba32-CompositeOver
                title: >-
                  The Rgba32 struct shall provide an internal single-pixel CompositeOver helper
                  computing the standard Porter-Duff "over" alpha-compositing formula (straight
                  alpha in and out, outA = fgA + bgA * (1 - fgA), each color channel outC =
                  (fgC * fgA + bgC * bgA * (1 - fgA)) / outA when outA != 0 else 0,
                  round-half-away-from-zero, clamped to [0, 255]) identical to Surface's own
                  per-row CompositeOver formula, exposed cross-assembly to
                  DemaConsulting.CanvasNet.Pptx and DemaConsulting.CanvasNet.Pdf for their own
                  one-sampled-pixel-at-a-time image-compositing loops.
                justification: |
                  Both sibling renderer packages composite a decoded source image onto a
                  destination Surface one sampled pixel at a time; sharing one tested helper
                  rather than duplicating the blending math independently in both assemblies
                  avoids a second, divergent implementation of the same formula drifting out of
                  sync with Surface's own CompositeOver(Rgba32) row-based formula. This fixes a
                  confirmed real-world bug where both renderers previously overwrote the
                  destination pixel outright with the raw sampled source pixel, ignoring its
                  alpha channel entirely.
                tests:
                  - Rgba32_CompositeOver_FullyTransparentForeground_ReturnsBackgroundUnchanged
                  - Rgba32_CompositeOver_FullyOpaqueForeground_ReturnsForegroundExactly
                  - Rgba32_CompositeOver_PartiallyTransparentForegroundOverOpaqueBackground_BlendsExactly
                  - Rgba32_CompositeOver_BothBackgroundAndForegroundPartiallyTransparent_BlendsExactly
                  - Rgba32_CompositeOver_BothBackgroundAndForegroundFullyTransparent_ReturnsZeroedResult
