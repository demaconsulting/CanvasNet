---
# cspell:ignore uncatchable Underflowing
# Software Unit Requirements for ScadDocument
#
# These requirements describe the design-level behavior of the ScadDocument unit, the sole direct
# unit of the CanvasNetScad system outside the ScadLanguage and ScadEvaluation subsystems. It comprises
# the public types in the DemaConsulting.CanvasNet.Scad namespace: ScadDocument (Parse and Open entry
# points, SourceName, Directives, ModuleNames, FunctionNames, and the Evaluate method), ScadOpenOptions,
# ScadSourceLocation, ScadSyntaxException (a FormatException), ScadDirective, ScadDirectiveKind, and the
# Phase 5 evaluation contract - ScadEvaluationOptions, ScadEvaluationResult, ScadLimits, ScadDiagnostic,
# ScadUnsupportedFeature, ScadUnsupportedFeatureException, and ScadEvaluationException - and the Phase 6
# geometry and rendering contract: the BuildScene and Render methods (ScadDocument.Render.cs) and the
# ScadRenderOptions class (camera, view, scene options, flat-shape thickness, composed evaluation
# options); ScadLimits additionally bounds the generated geometry (MaxTriangles).
#
# Delivery status: Phase 4 delivered parsing; Phase 5 added Evaluate (headless evaluation: echo,
# diagnostics, unsupported features, and the number of module instances; no geometry); Phase 6 adds
# BuildScene and Render, which build a Render3D scene (through the internal ScadGeometry subsystem) and
# draw it to a Surface. Every "tests" entry below cites an existing test method in the
# DemaConsulting.CanvasNet.Scad.Tests project; see docs/verification/canvas-net-scad/scad-document.md for
# the test-evidence mapping.

sections:
  - title: CanvasNetScad Requirements
    sections:
      - title: ScadDocument Requirements
        requirements:
          - id: CanvasNetScad-ScadDocument-ParseString
            title: >-
              The ScadDocument Parse method shall parse source text into a document, rejecting a
              null source with ArgumentNullException, treating empty, whitespace-only, and
              comment-only text as a valid empty document, and ignoring a leading byte-order mark.
            justification: |
              Parsing text already held in memory is the primary entry point; its edge cases (no
              source, nothing but trivia, a decoded file's BOM) must behave predictably.
            tests:
              - ScadDocument_Parse_NullSource_ThrowsArgumentNullException
              - ScadDocument_Parse_EmptyOrCommentOnlySource_ReturnsEmptyDocument
              - ScadDocument_Parse_LeadingBom_IsIgnored

          - id: CanvasNetScad-ScadDocument-OpenStream
            title: >-
              The ScadDocument Open(Stream) method shall read the stream from its current position
              as UTF-8 with byte-order-mark detection, leave the stream open, reject a null stream
              with ArgumentNullException and an unreadable stream with ArgumentException, and stop
              reading a stream that exceeds the maximum source length with InvalidDataException so
              that a non-terminating stream cannot consume unbounded memory.
            justification: |
              Callers need to parse source from any stream without the library taking ownership of
              it, and must not let an adversarial or endless stream exhaust available memory.
            tests:
              - ScadDocument_Open_NullStream_ThrowsArgumentNullException
              - ScadDocument_Open_UnreadableStream_ThrowsArgumentException
              - ScadDocument_Open_Utf8WithAndWithoutBom_Parses
              - ScadDocument_Open_Stream_IsLeftOpen
              - ScadDocument_Open_NonTerminatingStream_ThrowsInvalidDataException

          - id: CanvasNetScad-ScadDocument-OpenPath
            title: >-
              The ScadDocument Open(string) method shall read the named file as UTF-8, reject a
              null path with ArgumentNullException and an empty or whitespace path with
              ArgumentException, let a missing file or directory surface its natural
              FileNotFoundException or DirectoryNotFoundException, name the source by the path as
              supplied unless overridden, and default the effective base directory to the folder of
              the file's full path.
            justification: |
              Opening a file by path is the most common use; the defaults for the source name and
              base directory are the contract that later include/use resolution builds on.
            tests:
              - ScadDocument_Open_NullPath_ThrowsArgumentNullException
              - ScadDocument_Open_WhitespacePath_ThrowsArgumentException
              - ScadDocument_Open_FixtureFile_ParsesAndNamesSource
              - ScadDocument_Open_MissingFile_ThrowsFileNotFoundException
              - ScadDocument_Open_DefaultBaseDirectory_IsFileFolder

          - id: CanvasNetScad-ScadDocument-SourceName
            title: >-
              The ScadDocument SourceName property shall report the name supplied through the
              options or, for a file, the path, and null for an unnamed document, and the name
              shall appear in the location of every syntax error raised for that document.
            justification: |
              A diagnostic that names its file is actionable; an unnamed in-memory document must
              not invent a name.
            tests:
              - ScadDocument_SourceName_FromOptionsOrPath_ReflectsSupplier
              - ScadDocument_Parse_SourceNameOption_AppearsInErrorLocation

          - id: CanvasNetScad-ScadDocument-Directives
            title: >-
              The ScadDocument Directives property shall list the file-scope include and use
              directives, each with its kind, path, and source location, in source order as a
              read-only list, and parsing shall never invoke a file resolver or open a file (files
              are opened only by Evaluate).
            justification: |
              Recording dependencies without resolving them lets a caller inspect a document
              safely and keeps resolution policy out of the parser.
            tests:
              - ScadDocument_Directives_IncludeAndUse_AreRecordedInOrder
              - ScadDocument_Directives_ReadOnlyList
              - ScadDocument_Directives_FileResolverNotInvokedDuringParse

          - id: CanvasNetScad-ScadDocument-Definitions
            title: >-
              The ScadDocument ModuleNames and FunctionNames properties shall list the names of the
              file-scope module and function definitions in source order, keeping duplicates,
              excluding definitions nested inside other definitions or blocks, as read-only lists.
            justification: |
              A caller discovering what a library file offers needs its top-level names without
              evaluating the program.
            tests:
              - ScadDocument_ModuleAndFunctionNames_FileScopeOnly_InOrder
              - ScadDocument_ModuleAndFunctionNames_Duplicates_AreKept

          - id: CanvasNetScad-ScadDocument-SyntaxException
            title: >-
              The ScadSyntaxException class shall be a FormatException that exposes the
              ScadSourceLocation of the error, prefixes its message with that location when it is
              known, leaves the message unprefixed when it is not, and provides the standard
              exception constructors; a syntax error in parsed source shall be reported as this
              exception.
            justification: |
              A typed exception with a structured location lets a caller distinguish bad source
              from other failures and point at the exact position.
            tests:
              - ScadSyntaxException_IsFormatException
              - ScadSyntaxException_Location_MessageFormat
              - ScadSyntaxException_UnknownLocation_MessageHasNoPrefix
              - ScadSyntaxException_StandardConstructors_SetMessageAndInnerException
              - ScadDocument_Parse_SyntaxError_ThrowsScadSyntaxExceptionWithLocation

          - id: CanvasNetScad-ScadDocument-SourceLocation
            title: >-
              The ScadSourceLocation type shall be a value-equal record struct of file, one-based
              line, and one-based column whose ToString renders file:line:column, line:column
              without a file, or a question mark for the default (unknown, line zero) value.
            justification: |
              A single, culture-independent location representation keeps diagnostics consistent
              across the lexer, the parser, and callers.
            tests:
              - ScadSourceLocation_Equality_SameComponents_AreEqual
              - ScadSourceLocation_ToString_WithAndWithoutFile_FormatsCoordinates
              - ScadSourceLocation_Default_IsUnknown

          - id: CanvasNetScad-ScadDocument-OpenOptions
            title: >-
              The ScadOpenOptions class shall be immutable with init-only properties BaseDirectory,
              LibraryPaths, FileResolver, and SourceName, shall validate each value when it is
              initialized (null or non-whitespace for the text values; a non-null list with no
              null or whitespace entries for LibraryPaths), shall copy the supplied library paths,
              and shall default to unset values and an empty list; the base directory, library
              paths, and file resolver are not consumed by parsing - they govern include and use
              resolution when the document is evaluated.
            justification: |
              Validated, immutable options let every consumer trust an instance, and keeping the
              evaluation-time options out of parsing keeps parsing free of file access.
            tests:
              - ScadOpenOptions_Defaults_AreUnsetAndEmpty
              - ScadOpenOptions_ValidValues_AreStored
              - ScadOpenOptions_InvalidValues_Throw
              - ScadOpenOptions_NullLibraryPaths_ThrowArgumentNullException
              - ScadOpenOptions_NullTextValues_AreAccepted
              - ScadOpenOptions_LibraryPaths_AreCopied
              - ScadOpenOptions_EvaluationOnlySettings_DoNotAffectParse
              - ScadOpenOptions_Properties_AreInitOnly

          - id: CanvasNetScad-ScadDocument-SourceLimit
            title: >-
              The ScadDocument entry points shall reject source longer than 4,194,304 UTF-16
              characters with an InvalidDataException, whether the source is a string or is read
              from a stream.
            justification: |
              The size of the syntax tree grows with the size of the source, so the source size is
              the first line of defense against resource exhaustion by hostile input.
            tests:
              - ScadDocument_Parse_OverLimit_ThrowsInvalidDataException
              - ScadDocument_Open_OverLimitStream_ThrowsInvalidDataException

          - id: CanvasNetScad-ScadDocument-Evaluate
            title: >-
              The ScadDocument Evaluate method shall evaluate a parsed document - whether it came from
              Parse, Open(Stream), or Open(string) - with default options when none are supplied,
              returning the echo output, the diagnostics, the unsupported-feature reports, and the
              instance count, resolving include and use directives through the document's open
              options (relative to a file's folder for a path, through the resolver for a stream),
              reporting a missing included file as a warning, a syntax error in an included file as a
              ScadSyntaxException that names that file, and an include with nowhere to look as an
              evaluation error, and shall be safe to call repeatedly and from several threads on one
              document.
            justification: |
              Evaluate is the library's one execution entry point; callers hold documents from
              different origins and must get the same behavior, with failures reported by type.
            tests:
              - ScadDocument_Evaluate_DefaultOptions_ReturnsEchoDiagnosticsAndInstanceCount
              - ScadDocument_Evaluate_NullOptions_BehavesLikeDefaults
              - ScadDocument_Evaluate_OpenPath_ResolvesRelativeIncludeAndUse
              - ScadDocument_Evaluate_OpenStreamWithResolver_UsesTheResolver
              - ScadDocument_Evaluate_IncludeWithoutBaseOrResolver_ThrowsEvaluationException
              - ScadDocument_Evaluate_MissingInclude_IsWarning
              - ScadDocument_Evaluate_SyntaxErrorInIncludedFile_ThrowsSyntaxExceptionWithFileName
              - ScadDocument_Evaluate_ConcurrentCalls_AreIndependentAndIdentical
              - ScadFixtureEvaluation_GoldenFixtures_AreDiscoveredWithExpectedOutput
              - ScadFixtureEvaluation_ExpectedFiles_HaveAFixture
              - ScadFixtureEvaluation_Evaluate_MatchesExpectedEcho
              - ScadFixtureEvaluation_Evaluate_MatchesExpectedDiagnostics
              - ScadFixtureEvaluation_Evaluate_MatchesExpectedInstanceTree

          - id: CanvasNetScad-ScadDocument-EvaluationResult
            title: >-
              The ScadEvaluationResult class shall expose the echo lines (each with its echo prefix),
              the diagnostics, the unsupported-feature reports, and the number of module instances
              (groups included) as read-only values that the caller cannot turn into mutable
              collections.
            justification: |
              A result that cannot be altered can be cached and shared without defensive copying.
            tests:
              - ScadDocument_Evaluate_DefaultOptions_ReturnsEchoDiagnosticsAndInstanceCount
              - ScadDocument_Evaluate_InstanceCount_CountsModuleInstancesAndGroups
              - ScadDocument_Evaluate_ResultLists_AreReadOnly

          - id: CanvasNetScad-ScadDocument-EvaluationHandlers
            title: >-
              The ScadDocument Evaluate method shall deliver echo lines, warnings, and
              unsupported-feature reports to the handlers of the options, in the order they occurred
              and equal to the result, on the calling thread only (even when the evaluation had to
              restart on a larger stack), also deliver the events recorded before a failure while
              letting the failure win over an exception thrown by a handler, let a handler exception
              on success propagate, and abort at the first unsupported feature when the options ask
              for it, after delivering the earlier events.
            justification: |
              Handlers run caller code; it must run in a predictable order, on a predictable thread,
              and never mask the real failure.
            tests:
              - ScadDocument_Evaluate_Handlers_ReceiveEventsInOrderAndMatchResult
              - ScadDocument_Evaluate_Failure_StillDeliversEventsToHandlers
              - ScadDocument_Evaluate_HandlerThrowsOnSuccess_Propagates
              - ScadDocument_Evaluate_HandlerThrowsOnFailure_EvaluationFailureWins
              - ScadDocument_Evaluate_Handlers_RunOnCallerThread_EvenAfterStackRestart
              - ScadDocument_Evaluate_ThrowOnUnsupportedFeature_ThrowsAfterDeliveringEarlierEvents

          - id: CanvasNetScad-ScadDocument-EvaluationOptions
            title: >-
              The ScadEvaluationOptions class shall be immutable with init-only properties Variables,
              Time, Limits, EchoHandler, WarningHandler, UnsupportedFeatureHandler, and
              ThrowOnUnsupportedFeature, shall default to no variables, time zero, the default
              limits, no handlers, and no throwing, shall reject a non-finite time, a null limits
              value, a variable name that is not a valid identifier or special-variable name, and a
              variable value that is not a supported kind, is nested too deeply, or is an endless or
              self-referential sequence, and shall keep a name-ordered copy of the variables with
              sequences captured once.
            justification: |
              Options validated when set let the evaluator trust every instance, and a snapshot of
              the variables makes later changes by the caller harmless.
            tests:
              - ScadEvaluationOptions_Defaults_AreEmptyAndDefaultLimits
              - ScadEvaluationOptions_Time_NonFiniteIsRejected
              - ScadEvaluationOptions_Limits_NullIsRejectedAndValueKept
              - ScadEvaluationOptions_Handlers_AreStored
              - ScadEvaluationOptions_Variables_AreCopiedAndOrderedByKey
              - ScadEvaluationOptions_Variables_SequencesAreSnapshotted
              - ScadEvaluationOptions_Variables_AcceptSupportedKinds
              - ScadEvaluationOptions_Variables_InvalidNameIsRejected
              - ScadEvaluationOptions_Variables_ValidNameIsAccepted
              - ScadEvaluationOptions_Variables_UnsupportedValueIsRejected
              - ScadEvaluationOptions_Variables_TooDeepNestingIsRejected
              - ScadEvaluationOptions_Variables_EndlessAndSelfReferentialSequencesAreRejected
              - ScadEvaluationOptions_Variables_NullMeansNone
              - ScadDocument_Evaluate_Variables_InvalidValueIsRejectedByOptions

          - id: CanvasNetScad-ScadDocument-VariableOverrides
            title: >-
              The ScadDocument Evaluate method shall apply the Variables of the options as overrides:
              each replaces every top-level assignment of the same name in the document (including
              assignments brought in by include but not those of used libraries) and creates the
              variable when absent, every supported kind of value is converted, special variables can
              be overridden, the Time option sets the animation time, and the result does not depend
              on the order in which the variables were supplied.
            justification: |
              Callers parameterize a model from outside the source text, as with a command-line
              definition.
            tests:
              - ScadDocument_Evaluate_Variables_ReplaceAndCreateAssignments
              - ScadDocument_Evaluate_Variables_ConvertEverySupportedKind
              - ScadDocument_Evaluate_Variables_ReplaceIncludedAssignmentsButNotUsedLibraries
              - ScadDocument_Evaluate_Variables_SpecialVariablesAndOrderIndependence
              - ScadDocument_Evaluate_Time_SetsSpecialVariable
              - ScadFixtureEvaluation_Overrides_MatchExpectedEcho

          - id: CanvasNetScad-ScadDocument-IncludeUse
            title: >-
              The ScadDocument Evaluate method shall confine file access during include and use
              resolution to the base directory and library paths of the open options, or, when a
              resolver is supplied, shall pass the resolver only normalized logical paths and shall
              never let a hostile path reach it, shall reject a path that escapes its root with an
              evaluation error, and shall reject include cycles and excessive include depth or file
              counts with an evaluation error.
            justification: |
              A document may come from an untrusted source; include resolution is the one place where
              evaluation reaches outside the document, so its public behavior must be confined and
              verifiable.
            tests:
              - ScadDocument_Evaluate_FileSystemSandbox_EscapesAreRejected
              - ScadDocument_Evaluate_FileSystemSandbox_LibraryPathIsAllowedRoot
              - ScadDocument_Evaluate_ResolverSandbox_HostilePathsNeverReachTheCallback
              - ScadDocument_Evaluate_ResolverMode_RequestsNormalizedLogicalPaths
              - ScadDocument_Evaluate_IncludeLimitsAndCycles_ThrowEvaluationException
              - ScadFixtureEvaluation_IncludeMain_ThroughResolver_MatchesExpectedEcho

          - id: CanvasNetScad-ScadDocument-Cancellation
            title: >-
              The ScadDocument Evaluate method shall throw OperationCanceledException before any work
              (and before any resolver call) when its cancellation token is already canceled, and
              shall stop promptly, delivering the events recorded so far, when the token is canceled
              during evaluation or while include files are being loaded.
            justification: |
              A caller must be able to abandon an evaluation it can no longer afford.
            tests:
              - ScadDocument_Evaluate_PreCanceledToken_ThrowsBeforeAnyWork
              - ScadDocument_Evaluate_CanceledDuringRun_StopsPromptlyAndDeliversEarlierEvents
              - ScadDocument_Evaluate_CanceledDuringIncludeLoading_StopsBeforeNextFile

          - id: CanvasNetScad-ScadDocument-Limits
            title: >-
              The ScadLimits class shall be immutable with init-only limits for recursion depth,
              evaluation steps, loop iterations, list length, string length, include depth, included
              files, instances, output length, diagnostics, and generated triangles, with documented
              defaults, shall reject a value outside its permitted range when it is set, and the
              Evaluate method shall fail with a located ScadEvaluationException when any limit is
              exceeded while accepting a program exactly at the limit.
            justification: |
              The caller owns the trade-off between permissiveness and safety; limits must be
              validated, immutable, and enforced at their exact values.
            tests:
              - ScadLimits_Default_HasDocumentedValues
              - ScadLimits_Initialization_AcceptsValidValues
              - ScadLimits_MaxTriangles_MustBeAtLeastOne
              - ScadLimits_MaxRecursionDepth_IsRangeChecked
              - ScadLimits_MaxIncludeDepth_IsRangeChecked
              - ScadLimits_PositiveLimits_RejectZeroAndNegative
              - ScadLimits_Properties_AreInitOnly
              - ScadDocument_Evaluate_Limit_ThrowsEvaluationExceptionWithLocation
              - ScadDocument_Evaluate_Limit_AtLimitSucceedsOneOverFails
              - ScadDocument_BuildScene_Limits_ArePassedThrough

          - id: CanvasNetScad-ScadDocument-StackSafety
            title: >-
              The ScadDocument Evaluate method shall not overflow the call stack: a program at the
              recursion limit, including the largest permitted limit, shall evaluate on a thread with
              a small stack, a program over the limit shall fail with the same error on any stack
              size, and a program shall give identical results on a small and on a normal stack.
            justification: |
              Callers invoke Evaluate from threads of any stack size; an uncatchable stack overflow
              would terminate their process.
            tests:
              - ScadDocument_Evaluate_DeepRecursionOnSmallStack_AtLimitSucceedsAndOverLimitFailsIdentically
              - ScadDocument_Evaluate_MaximumRecursionLimitOnSmallStack_Succeeds
              - ScadDocument_Evaluate_SmallAndNormalStack_ProduceIdenticalResults

          - id: CanvasNetScad-ScadDocument-Determinism
            title: >-
              The ScadDocument Evaluate method shall give identical results for the same document and
              options when called repeatedly, concurrently, under a different culture, or on a small
              stack.
            justification: |
              Reproducible results allow caching and golden-output verification.
            tests:
              - ScadDocument_Evaluate_RepeatedAndCultureIndependent_ProducesIdenticalResults
              - ScadDocument_Evaluate_ConcurrentCalls_AreIndependentAndIdentical
              - ScadFixtureEvaluation_Evaluate_OnSmallStackUnderGermanCulture_MatchesExpectedOutput
              - ScadFixtureEvaluation_Evaluate_TwiceIsDeterministic

          - id: CanvasNetScad-ScadDocument-Diagnostic
            title: >-
              The ScadDiagnostic record shall carry a message and a source location with value
              equality, and its ToString shall prefix the message with the location in a way that does
              not depend on the culture.
            justification: |
              A warning must say where it applies, in a form that is the same on every machine.
            tests:
              - ScadDiagnostic_Properties_AreExposedWithValueEquality
              - ScadDiagnostic_ToString_PrefixesLocation
              - ScadDiagnostic_ToString_IsCultureInvariant

          - id: CanvasNetScad-ScadDocument-UnsupportedFeature
            title: >-
              The ScadUnsupportedFeature record shall carry a feature identifier, a message, and a
              source location, and the ScadUnsupportedFeatureException class shall be an IOException
              that exposes the feature and location, prefixes its message with the location when it
              is known, and provides the standard constructors; Evaluate shall report each
              unsupported feature once per location and continue unless told to throw.
            justification: |
              Unsupported features are reported through a typed, structured channel so that callers
              can decide whether to continue.
            tests:
              - ScadUnsupportedFeature_Record_ExposesMembersAndFormats
              - ScadUnsupportedFeatureException_Location_PrefixesMessage
              - ScadUnsupportedFeatureException_UnknownLocation_MessageHasNoPrefix
              - ScadUnsupportedFeatureException_StandardConstructors_SetMessageAndInnerException
              - ScadDocument_Evaluate_UnsupportedFeatures_ReportedOncePerLocation
              - ScadDocument_Evaluate_UnsupportedFeature_WithoutThrowFlag_Continues

          - id: CanvasNetScad-ScadDocument-EvaluationException
            title: >-
              The ScadEvaluationException class shall be an InvalidOperationException that exposes the
              ScadSourceLocation of the failure, prefixes its message with that location when it is
              known, leaves the message unprefixed when it is not, and provides the standard
              exception constructors; a failed assertion, an exceeded limit, and a violated include
              rule shall be reported as this exception.
            justification: |
              A typed exception with a structured location lets a caller tell a failed evaluation
              from other failures and point at the exact place.
            tests:
              - ScadEvaluationException_Inheritance_DerivesFromInvalidOperationException
              - ScadEvaluationException_Location_MessageFormat
              - ScadEvaluationException_UnknownLocation_MessageHasNoPrefix
              - ScadEvaluationException_StandardConstructors_SetMessageAndInnerException
              - ScadDocument_Evaluate_Limit_ThrowsEvaluationExceptionWithLocation

          - id: CanvasNetScad-ScadDocument-BuildScene
            title: >-
              The ScadDocument BuildScene method shall evaluate the document and return a Render3D
              scene of its geometry - the implicit union of the top-level instances, or of the marked
              subtrees when the program uses the show-only modifier - using the variable overrides and
              animation time of the supplied evaluation options, applying the flat-shape thickness to
              2D shapes that are not extruded, returning a scene with an empty root for a model without
              geometry, and returning a new, independent scene from each call, including when called
              concurrently.
            justification: |
              The scene is the interchange form between the language front end and the renderer; a
              caller that wants to inspect, measure, or render the model itself needs it without a
              surface, and the result must depend only on the document and the options.
            tests:
              - ScadDocument_BuildScene_DefaultOptions_BuildsSceneOfTheModel
              - ScadDocument_BuildScene_VariablesAndTime_ChangeTheGeometry
              - ScadDocument_BuildScene_FlatShapeThickness_SetsSlabHeight
              - ScadDocument_BuildScene_ConcurrentBuilds_AreEqual

          - id: CanvasNetScad-ScadDocument-Render
            title: >-
              The ScadDocument Render method shall validate the requested size (1 to the maximum
              surface dimension in each direction, ArgumentOutOfRangeException otherwise) and the
              supplied camera (ArgumentException when invalid) before evaluating anything, and shall
              draw the model onto a new surface of exactly the requested size that the caller owns -
              with the view fitted to the model when no camera is supplied (an isometric perspective
              view by default, equal to the renderer's fitted view of the same scene, adjustable by
              azimuth, elevation, and projection), with the supplied camera otherwise, and with a
              white background and neutral gray surfaces unless the model or the scene options say
              otherwise - and a model without geometry shall render as the background only.
            justification: |
              Rendering a model to pixels in one call is the purpose of the package; invalid
              arguments must fail before any expensive work, and the default view must show the whole
              model without the caller computing a camera.
            tests:
              - ScadDocument_Render_InvalidSize_ThrowsBeforeEvaluating
              - ScadDocument_Render_InvalidCamera_ThrowsBeforeEvaluating
              - ScadDocument_Render_EmptyModel_IsBackgroundOnlyAtRequestedSize
              - ScadDocument_Render_DefaultFittedView_EqualsRenderFittedOfSameMesh
              - ScadDocument_Render_ExplicitOrthographicTopCamera_CoversExactFootprint
              - ScadDocument_Render_FittedViewOptions_ChangeTheImage
              - ScadDocument_Render_DefaultColorOption_IsHonored

          - id: CanvasNetScad-ScadDocument-RenderOptions
            title: >-
              The ScadRenderOptions class shall be immutable with init-only properties Evaluation,
              Camera, ViewAzimuthDegrees, ViewElevationDegrees, Projection, SceneOptions,
              FlatShapeThickness, HighlightColor, GhostColor, and FontResolution, shall default to no evaluation options
              (the defaults apply), a fitted view at the isometric azimuth and elevation with a
              perspective projection, the default scene options, a flat-shape thickness of 0.1, a
              translucent pink highlight (255, 64, 128, alpha 110), a translucent gray ghost (128,
              128, 128, alpha 80), and no font resolution options (the installed fonts are searched
              for an explicitly named font), shall accept any alpha for the two overlay colors and use them for
              the  # and % overlays, shall pass the font resolution options (the use of installed fonts
              and a copied, validated list of additional font directories, rejecting a null, empty, or
              white-space directory when it is set) to the text module, and shall reject a non-finite view angle,
              an undefined projection, and a flat-shape thickness that is not finite and positive when it is set.
            justification: |
              Options validated at initialization let the document trust every instance, and
              immutability makes a shared options instance safe to use from several threads; composing
              the evaluation options keeps one definition of variables, limits, handlers, and strict
              mode; the look of the two modifier overlays is a look-and-feel setting like the others;
              the font resolution options let a build that needs reproducible lettering control where
              explicitly named fonts come from.
            tests:
              - ScadRenderOptions_New_HasDocumentedDefaults
              - ScadRenderOptions_Initialization_AcceptsValidValues
              - ScadRenderOptions_HighlightColorAndGhostColor_DefaultsAndOverrideChangeTheLook
              - ScadRenderOptions_ViewAngles_NonFinite_Throw
              - ScadRenderOptions_Projection_Undefined_Throws
              - ScadRenderOptions_FlatShapeThickness_MustBeFiniteAndPositive
              - ScadRenderOptions_Properties_AreInitOnly
              - ScadRenderOptions_Evaluation_IsComposedAndOptional
              - ScadRenderOptions_FontResolution_DefaultsAndCopiesDirectories
              - ScadRenderOptions_FontResolution_InvalidDirectoriesAreRejected

          - id: CanvasNetScad-ScadDocument-RenderReporting
            title: >-
              The ScadDocument BuildScene and Render methods shall deliver the echo lines, warnings,
              and unsupported-feature reports of every stage (evaluation, geometry building, and, for
              Render, the renderer's operand checks) to the handlers of the evaluation options, once,
              in the order they occurred, on the calling thread, mapping a renderer report back to the
              source location of the module that produced the mesh; shall also deliver the events
              recorded before a failure while letting the failure win over an exception thrown by a
              handler; shall let a handler exception on success propagate (disposing the surface
              Render had drawn); shall stop at the first unsupported feature of any stage, after
              delivering the earlier events, when the options ask for it; shall ignore the
              unsupported-feature handler and strict flag of the scene options; and shall report the
              renderer's fragment-budget overflow as a ScadEvaluationException.
            justification: |
              Every problem the model has must reach the caller through one channel with one
              ordering and one strict-mode switch, regardless of which stage found it, and caller code
              in a handler must never mask the real failure or leak a surface.
            tests:
              - ScadDocument_BuildScene_Handlers_ReceiveAllStagesOnceInOrder
              - ScadDocument_BuildScene_StrictMode_ThrowsAndStillDeliversEvents
              - ScadDocument_BuildScene_FailingHandler_PropagatesOnlyOnSuccess
              - ScadDocument_Render_ReportsThroughEvaluationHandlersOnly
              - ScadDocument_Render_StrictMode_ThrowsForUnsupportedFeature
              - ScadDocument_Render_EvaluationFailure_PropagatesAfterDeliveringEvents
              - ScadDocument_Render_FailingHandlerOnSuccess_Propagates
              - ScadDocumentRenderReport_AllStages_AreDeliveredInOrderOnTheCallingThread
              - ScadDocumentRenderReport_StrictMode_ThrowsTheMappedOperandReport
              - ScadDocumentRenderReport_FragmentBudgetExceeded_IsAnEvaluationException

          - id: CanvasNetScad-ScadDocument-RenderOperandReports
            title: >-
              The ScadDocument Render method shall, when a handler is set or strict mode is on and the
              model has a difference or intersection, report each operand defect the renderer finds
              (open mesh, non-manifold edge, inconsistent winding, degenerate triangle, inverted mesh,
              and collapsed world transform) as an unsupported feature whose identifier replaces the
              renderer's prefix with scad- and whose location is that of the module that produced the
              mesh (including the file of a used or included library), reporting a repeated operand
              once, and shall report nothing when there is no boolean, no handler, or only BuildScene
              is called.
            justification: |
              A boolean on a mesh the renderer cannot resolve faithfully gives a wrong picture; the
              author needs to know which module in which file to fix, not an internal mesh node.
            tests:
              - ScadDocumentRenderReport_OpenPolyhedronInDifference_IsReportedAtThePolyhedron
              - ScadDocumentRenderReport_MeshDefects_AreMappedWithTheirFeature
              - ScadDocumentRenderReport_InvertedShellNextToCorrectShell_IsReported
              - ScadDocumentRenderReport_UnderflowingWorldTransform_IsReportedPerOperand
              - ScadDocumentRenderReport_RepeatedOperand_IsReportedOnce
              - ScadDocumentRenderReport_DefectInUsedFile_CarriesTheFile
              - ScadDocumentRenderReport_NoBooleanOrNoHandler_ReportsNothing
              - ScadDocumentRenderReport_BuildScene_DoesNotValidateOperands
              - ScadDocumentRenderReport_MapFeature_MapsEveryRenderToken

          - id: CanvasNetScad-ScadDocument-RenderCancellation
            title: >-
              The ScadDocument BuildScene and Render methods shall throw OperationCanceledException
              before any work (and before any resolver call) when the cancellation token is already
              canceled, and shall stop promptly when it is canceled during the evaluation, the
              geometry building, or the rendering.
            justification: |
              Building and drawing a large model can take long; a caller must be able to abandon it.
            tests:
              - ScadDocument_BuildScene_AlreadyCanceled_ThrowsBeforeAnyResolverCall
              - ScadDocument_Render_AlreadyCanceled_ThrowsBeforeAnyResolverCall
              - ScadDocumentRenderReport_CanceledDuringEvaluation_StopsBuildAndRender
              - ScadDocumentRenderReport_CanceledDuringRendering_StopsTheRender

          - id: CanvasNetScad-ScadDocument-RenderDeterminism
            title: >-
              The ScadDocument Render method shall produce byte-identical images for the same document
              and options when called repeatedly, concurrently, and with any degree of parallelism,
              including for models with boolean operations and extrusions, and shall not overflow the
              call stack when a deeply nested model is built and drawn on a thread with a small stack.
            justification: |
              Reproducible pixels make image comparison, caching, and cross-machine use possible, and
              callers invoke Render from threads of any stack size; an uncatchable stack overflow
              would terminate their process.
            tests:
              - ScadDocument_Render_IsDeterministicForEveryParallelism
              - ScadDocument_Render_ConcurrentRenders_AreIdentical
              - ScadDocument_Render_DeepModuleChain_OnSmallStack_MatchesBigStack
              - ScadDocument_Render_CsgModel_IsDeterministicForEveryParallelism
              - ScadDocument_Render_DeepDifferenceChain_OnSmallStack_MatchesBigStack

          - id: CanvasNetScad-ScadDocument-RenderGeometry
            title: >-
              The ScadDocument Render method shall draw boolean models, extruded 2D shapes, and
              revolved profiles so that a difference shows its cut-out, an intersection shows only the
              overlap, a color applies to the geometry it wraps, an extruded difference of 2D shapes
              looks the same as the difference of the extruded shapes, and a revolved profile has the
              silhouette of the profile.
            justification: |
              The pixels are the product of the package; the boolean and extrusion semantics must be
              visible in the picture, not only in the scene.
            tests:
              - ScadDocument_Render_CubeWithCylinderHole_ShowsTheHole
              - ScadDocument_Render_FlatDifference_ShowsTheHole
              - ScadDocument_Render_FlatIntersection_ShowsTheOverlapOnly
              - ScadDocument_Render_CubeSphereIntersection_IsClippedByTheCube
              - ScadDocument_Render_ColoredDifference_UsesTheColor
              - ScadDocument_Render_ExtrudedRing_ShowsTheAnnulus
              - ScadDocument_Render_RevolvedVase_HasTheProfileSilhouette
              - ScadDocument_Render_ExtrudedDifference_EqualsTheHandBuiltDifferenceOfExtrusions
              - ScadDocument_Render_RevolvedDifference_EqualsTheHandBuiltDifferenceOfRevolutions
              - ScadDocument_Render_ColoredAndTwistedExtrusions_AreVisible
