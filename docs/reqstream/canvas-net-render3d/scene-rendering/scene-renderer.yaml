---
# cspell:ignore binner
#
# Software Unit Requirements for SceneRenderer
#
# These requirements describe the design-level behavior of the SceneRenderer unit: the public static
# SceneRenderer class, SceneRenderOptions type and diagnostic types (RenderBudgetExceededException,
# SceneRenderUnsupportedFeature and its exception), the internal CsgOperandValidator, and the internal
# TileBinner, SampleResolver, and TileWorkspace types, in the DemaConsulting.CanvasNet.Render3D.SceneRendering
# namespace. Output is a new core Surface owned (and disposed) by the caller. The alpha of a node
# appearance and of an overlay color is honored (translucent surfaces are composited front to back);
# the alpha of the default, back-face and light colors is ignored; background alpha is honored. A
# scene with a difference or intersection, an overlay or a translucent appearance is rendered through
# the fragment-list path (see csg-resolver.yaml and fragment-buffer.yaml); every other scene uses the
# z-buffer path.

sections:
  - title: CanvasNetRender3D Requirements
    sections:
      - title: SceneRendering Requirements
        sections:
          - title: SceneRenderer Requirements
            requirements:
              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Validation
                title: >-
                  The SceneRenderer Render method shall reject a null scene or camera, a
                  non-positive or over-limit width or height with ArgumentOutOfRangeException, an
                  orthographic camera without a height with ArgumentException, and an unsupported
                  supersampling value.
                justification: |
                  The renderer is the public entry point and must fail predictably, before doing
                  any work, on invalid input.
                tests:
                  - SceneRenderer_Render_NullSceneOrCamera_Throws
                  - SceneRenderer_Render_InvalidDimensions_ThrowsArgumentOutOfRange
                  - SceneRenderer_Render_OrthographicWithoutHeight_ThrowsArgumentException
                  - SceneRenderer_Render_InvalidSupersampling_Throws

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-OutputSize
                title: >-
                  The SceneRenderer Render method shall return a Surface of exactly the requested
                  width and height, including sizes that are not a multiple of the tile size.
                justification: |
                  Output dimensions are part of the public contract, and partial edge tiles are a
                  likely source of off-by-one errors.
                tests:
                  - SceneRenderer_Render_ReturnsSurfaceOfRequestedSize
                  - SceneRenderer_Render_NonTileMultipleSize_RendersPartialTiles

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Background
                title: >-
                  The SceneRenderer shall fill every pixel not covered by geometry with the
                  configured background color, including the entire image for an empty scene.
                justification: |
                  The background defines the output's appearance outside the model and the
                  transparency of the result when composited.
                tests:
                  - SceneRenderer_Render_EmptyScene_FillsBackgroundColor
                  - SceneRenderer_Render_PixelsOutsideSilhouette_AreBackground

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Tiling
                title: >-
                  The SceneRenderer shall bin each triangle into every 32 by 32 pixel tile it
                  overlaps in ascending triangle order, and shall render geometry straddling tile
                  boundaries without seams, covering exactly the analytically expected pixels for a
                  box aligned to the sample grid.
                justification: |
                  Tiling bounds per-worker memory independent of image size and enables
                  parallelism; it must be invisible in the output.
                tests:
                  - TileBinner_Bin_TriangleSpanningTiles_AppearsInEachOverlappedTileInAscendingOrder
                  - SceneRenderer_Render_QuadStraddlingTileBoundaries_HasNoSeams
                  - SceneRenderer_Render_OrthoCubeOnDyadicGrid_CoversExactly32By32Pixels

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Supersampling
                title: >-
                  The SceneRenderer shall render with k by k ordered-grid supersampling and resolve
                  each pixel as the box-filter average of its samples, so that supersampling of 1
                  produces no intermediate edge colors and larger values do.
                justification: |
                  Supersampling is the antialiasing mechanism; its resolve must average correctly
                  and be switchable off.
                tests:
                  - SampleResolver_Resolve_HalfCoveredPixelTwoByTwo_AveragesColors
                  - SceneRenderer_Render_Supersampling1_HasNoIntermediateEdgeColors
                  - SceneRenderer_Render_Supersampling3_ProducesIntermediateEdgeColors

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-AlphaResolve
                title: >-
                  The SampleResolver shall average samples in premultiplied-alpha arithmetic so that
                  a half-covered pixel over a transparent background resolves to half alpha with the
                  surface's own color.
                justification: |
                  Averaging straight-alpha colors would darken antialiased edges over a transparent
                  background.
                tests:
                  - SampleResolver_Resolve_TransparentBackgroundHalfCovered_PremultipliedAverageKeepsColor

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Parallelism
                title: >-
                  The SceneRenderer shall render tiles in parallel by default, honoring the
                  MaxDegreeOfParallelism option (1 meaning sequential), producing output
                  byte-identical to sequential rendering and across repeated renders, and shall
                  reject a degree of parallelism of zero or below minus one.
                justification: |
                  Parallel tiles scale rendering across cores; determinism and option validation
                  make that safe.
                tests:
                  - SceneRenderer_Render_ParallelismOneVersusMany_ByteIdentical
                  - SceneRenderer_Render_RepeatedRender_ByteIdentical
                  - SceneRenderOptions_MaxDegreeOfParallelism_ZeroOrBelowMinusOne_Throws

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Cancellation
                title: >-
                  The SceneRenderer shall throw OperationCanceledException (never wrapped in an
                  AggregateException, in both sequential and parallel modes) when the supplied
                  CancellationToken is canceled, including before any scene processing begins in
                  both Render and RenderFitted, and shall release the partially rendered Surface.
                justification: |
                  Callers must be able to abandon a long render promptly and handle a single,
                  well-known exception type.
                tests:
                  - SceneRenderer_Render_PreCancelledToken_ThrowsOperationCanceledException
                  - SceneRenderer_Render_PreCancelledToken_Parallel_ThrowsOperationCanceledNotAggregate
                  - SceneRenderer_Render_PreCancelledToken_ThrowsBeforeProcessingScene
                  - SceneRenderer_RenderFitted_PreCancelledToken_ThrowsBeforeComputingBounds

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Options
                title: >-
                  The SceneRenderOptions type shall default to a neutral gray surface color, a white
                  background, and three-by-three supersampling, shall use the default light rig when
                  its light list is null, and shall copy a caller-supplied light list defensively.
                justification: |
                  Sensible defaults make the common case a one-line call, and immutability keeps
                  shared options safe for concurrent renders.
                tests:
                  - SceneRenderOptions_Defaults_AreNeutralGrayWhiteBackgroundThreeSamples
                  - SceneRenderOptions_Lights_Null_UsesDefaultRig
                  - SceneRenderOptions_Lights_CopiedDefensively

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-CsgOptions
                title: >-
                  The SceneRenderOptions type shall provide a per-tile fragment budget
                  (MaxFragmentsPerTile) defaulting to 4 Mi (4194304) fragments and rejecting a
                  value below one or above the maximum array length with
                  ArgumentOutOfRangeException, and an unsupported-feature handler and strict flag
                  that default to no handler and tolerant (non-throwing) behavior.
                justification: |
                  The budget bounds the memory of per-pixel fragment resolution and must be
                  validated when set so an options instance is always valid, and the handler and
                  strict flag follow the unsupported-feature convention of the sibling render
                  options so callers can choose between reporting and failing.
                tests:
                  - SceneRenderOptions_CsgDefaults_BudgetFourMiAndTolerant
                  - SceneRenderOptions_MaxFragmentsPerTile_OutOfRange_Throws
                  - SceneRenderOptions_UnsupportedFeatureSettings_StoredAsGiven

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Diagnostics
                title: >-
                  The SceneRenderer shall provide the public RenderBudgetExceededException
                  (carrying the exceeded budget and a tile-independent message), the
                  SceneRenderUnsupportedFeature report (feature token, message and optional mesh
                  node) and the SceneRenderUnsupportedFeatureException (feature token and optional
                  mesh node), each with the standard exception constructors.
                justification: |
                  A caller must be able to tell a budget overflow or an unsupported scene feature
                  from a programming error without string-matching a message, and a message that
                  does not depend on which tile or thread detected the overflow keeps failures
                  deterministic.
                tests:
                  - RenderBudgetExceededException_Budget_CarriesBudgetAndStandardMessage
                  - RenderBudgetExceededException_StandardConstructors_UseDefaultBudget
                  - SceneRenderUnsupportedFeature_Record_ExposesValues
                  - SceneRenderUnsupportedFeatureException_FeatureConstructor_CarriesFeatureAndNode
                  - SceneRenderUnsupportedFeatureException_StandardConstructors_HaveEmptyFeature

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Precision
                title: >-
                  The SceneRenderer shall render a cube (and its camera) translated one million
                  units from the origin identically to the same cube at the origin, in both
                  orthographic and perspective projection.
                justification: |
                  A single-precision pipeline cannot pass this test, so it proves that the
                  camera-relative double-precision view transform is effective end to end.
                tests:
                  - SceneRenderer_Render_CubeOneMillionUnitsAway_IdenticalToCubeAtOrigin

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Mirrored
                title: >-
                  The SceneRenderer shall render an instance under a negative-determinant (mirror or
                  negative-scale) transform with correct winding, so that a mirrored symmetric cube
                  is identical to the original, a mirrored asymmetric solid equals the same mesh
                  with the mirror baked into its vertices without showing a single back-face
                  pixel (negative scale on one, two or three axes, and a double mirror), and its
                  faces are front-facing.
                justification: |
                  Mirrored parts are common in CAD assemblies; without winding compensation they
                  would render inside out in the back-face color, and a symmetric test object
                  cannot detect a swapped front/back classification.
                tests:
                  - SceneRenderer_Render_MirroredSymmetricCube_IdenticalToOriginal
                  - SceneRenderer_Render_NegativeScaleInGroup_FacesAreFrontFacing
                  - SceneRenderer_Render_MirroredAsymmetricSolid_MatchesBakedMirrorWithNoBackFaces
                  - SceneRenderer_Render_DoubleMirroredAsymmetricSolid_FacesStayFrontFacing

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-CsgFastPath
                title: >-
                  The SceneRenderer shall render a scene without a difference or intersection of two
                  or more operands, without an overlay and without a translucent appearance
                  (including a union CsgNode) through the z-buffer path without any
                  fragment storage, ignoring the fragment budget and never validating operands, with
                  output identical to the equivalent group and, for closed solids, to the
                  fragment-list path forced onto the same scene (up to grazing silhouette
                  samples whose front and back surfaces lie within the depth tolerance).
                justification: |
                  Most scenes are plain unions; keeping them on the existing z-buffer path preserves
                  their output and cost, and proving the two paths agree on closed solids validates
                  the fragment-list algorithm against the established renderer.
                tests:
                  - SceneRenderer_Render_UnionCsgNode_IdenticalToGroupNode
                  - SceneRenderer_RenderWithFragmentPath_UnionOnlyScenes_IdenticalToZBuffer
                  - SceneRenderer_Render_UnionOnlyScene_IgnoresFragmentBudget

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-CsgSurfaces
                title: >-
                  The SceneRenderer shall render a scene containing a difference or intersection by
                  collecting and resolving the fragments of every tile, so that a cut surface shows
                  the subtrahend's own color lit from the flipped normal (never the back-face
                  color), an intersection shows the clipped silhouette, nested operations equal an
                  analytic box-CSG oracle (a fixed set of seeded random trees included), coincident
                  and nearly coincident faces leave no speckle (nearly coincident walls seen edge-on
                  may leave at most a few isolated pixels, tolerated up to 12 in the stress test),
                  and a camera inside solid material
                  sees only back-face shading, with the viewer outside the solid unaffected.
                justification: |
                  These are the behaviors that make CSG output correct and usable: exact per-pixel
                  results against an independent oracle, stable results where faces coincide, and
                  consistent shading of cut surfaces.
                tests:
                  - SceneRenderer_Render_CubeMinusSphere_ShowsCavityInSubtrahendColor
                  - SceneRenderer_Render_CubeMinusSphereOblique_CutSurfaceUsesFlippedNormal
                  - SceneRenderer_Render_CubeIntersectSphere_SilhouetteIsSquareClippedByDisc
                  - SceneRenderer_Render_NestedDifferenceOfDifferences_MatchesOracle
                  - SceneRenderer_Render_RandomBoxTrees_MatchOracle
                  - SceneRenderer_Render_CoincidentFaceDifference_HasNoSpeckle
                  - SceneRenderer_Render_NearlyCoincidentFaceDifference_HasNoSpeckle
                  - SceneRenderer_Render_NearlyCoincidentFacesAcrossPlacements_HaveNoSpeckle
                  - SceneRenderer_Render_PerspectiveCameraInsideSolid_ShowsBackFaceEverywhere
                  - SceneRenderer_Render_OrthographicCameraInsideSolid_ShowsBackFaceEverywhere
                  - SceneRenderer_Render_FittedCameraOutsideSolid_ShowsMinuendAndCavity

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Budget
                title: >-
                  The SceneRenderer shall throw RenderBudgetExceededException, carrying
                  MaxFragmentsPerTile and a message that does not depend on the tile, when any
                  tile of a fragment-list render needs more fragments than the budget, identically
                  for sequential and parallel rendering and never wrapped in an AggregateException
                  (cancellation taking precedence), and shall render successfully with a budget
                  exactly equal to the largest tile's need.
                justification: |
                  Fragment memory grows with depth complexity; a hard, deterministic limit turns
                  an unbounded allocation into an actionable error, and a parallel render must not
                  report a different failure than a sequential one.
                tests:
                  - SceneRenderer_Render_BudgetExceeded_ThrowsDeterministicException
                  - SceneRenderer_Render_ExactBudgetBoundary_RendersAndOneLessThrows
                  - SceneRenderer_Render_CancelledAndOverBudget_ThrowsOperationCanceled

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-OperandReporting
                title: >-
                  For a scene rendered through the fragment-list path, the SceneRenderer shall, before
                  any rendering work and observing cancellation, validate every mesh node once in scene
                  pre-order and report each open mesh, non-manifold edge, inconsistent winding,
                  degenerate triangle (a repeated index or a zero-area triangle that the renderer
                  would discard) and inside-out (inverted) mesh, where inversion means a connected
                  shell of the position-welded mesh whose orientation disagrees with its nesting
                  (an outermost shell or a solid nested at even depth must be outward, a cavity wall
                  inward) so that hollow solids are valid, and an unwelded closed mesh is not open,
                  as a SceneRenderUnsupportedFeature
                  with a stable feature token to the handler, or throw
                  SceneRenderUnsupportedFeatureException for the first problem in strict mode, while
                  rendering tolerantly otherwise; it shall additionally check every mesh instance
                  (not only every node) after its world transform is composed and report a singular
                  (zero-determinant or non-finite) world transform, or triangles that are degenerate
                  after the transform by the renderer's own discard criterion, naming the offending
                  node; it shall judge inversion independently of a mirroring
                  transform, neither report nor reject an explicit near plane or a camera inside an
                  operand, and neither
                  analyze nor report anything for opaque union-only scenes or when neither a handler nor
                  strict mode is set.
                justification: |
                  A non-solid operand silently produces a wrong image; naming the problem with a
                  machine-matchable token lets callers (such as a language front end) translate it into
                  their own diagnostics, while the tolerant default keeps rendering robust. A
                  shell wound against its nesting is dropped or inverted in the image even when the
                  total volume is positive, whereas hollow solids and STL-style unwelded closed
                  meshes render correctly and must not be reported.
                tests:
                  - CsgOperandValidator_Validate_DefectKind_ReportsFeatureAndRendersAnyway
                  - CsgOperandValidator_Validate_HealthyOperands_ReportsNothing
                  - CsgOperandValidator_Validate_StrictMode_ThrowsTypedException
                  - CsgOperandValidator_Validate_StrictModeWithoutHandler_Throws
                  - CsgOperandValidator_Validate_NoHandlerNoStrict_RendersTolerantly
                  - CsgOperandValidator_Validate_UnionOnlyScene_ReportsNothing
                  - CsgOperandValidator_Validate_AllInstances_DeduplicatedInPreOrder
                  - CsgOperandValidator_Validate_MirroredOperands_InversionIsIndependentOfDeterminant
                  - CsgOperandValidator_Validate_MirroredInvertedOperand_RendersLikeBakedMesh
                  - CsgOperandValidator_Validate_ExplicitNearPlaneInFrontOfOperands_ReportsNothing
                  - CsgOperandValidator_Validate_DisjointInvertedShell_ReportsInvertedMesh
                  - CsgOperandValidator_Validate_HollowSolid_ReportsNothing
                  - CsgOperandValidator_Validate_NestedThreeLevelShells_JudgedByNestingParity
                  - CsgOperandValidator_Validate_UnweldedClosedCube_NotOpenAndInversionDetected
                  - CsgOperandValidator_Validate_UnweldedOpenCube_StillReportsOpenMesh
                  - SceneRenderer_Render_CameraInsideHollowRoomWithExplicitNearPlane_StrictModeShowsCavityWall
                  - SceneRenderer_Render_UnweldedOperands_RenderIdenticallyToWelded
                  - CsgOperandValidator_Validate_RunsBeforeRendering
                  - CsgOperandValidator_Validate_CancelledFromHandler_ThrowsOperationCanceled
                  - CsgOperandValidator_ValidateTransformed_ZeroScaleOperand_Reported
                  - CsgOperandValidator_ValidateTransformed_ZeroScaleOperand_StrictModeThrows
                  - CsgOperandValidator_ValidateTransformed_SharedNodeOneSingularInstance_ReportedOnce
                  - CsgOperandValidator_ValidateTransformed_ValidTransformedOperands_ReportNothing
                  - CsgOperandValidator_ValidateTransformed_UnionOnlyScene_ReportsNothing
                  - CsgOperandValidator_ValidateTransformed_DegenerateInViewSpace_ReportedWithRendererCriterion
                  - CsgOperandValidator_ValidateTransformed_MirroredInvertedOperand_OnlyInvertedReported
                  - CsgOperandValidator_NullArguments_Throw

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-MirroredCsg
                title: >-
                  The SceneRenderer shall classify the crossings of mirrored CSG operands with the
                  corrected facing, so that a mirrored operand (negative scale on one, two or
                  three axes) and a mirror on the CsgNode itself or on an ancestor, alone or split
                  over several nodes, render byte-identically to the same operands with the mirror
                  baked into their vertices and never show a back-face pixel.
                justification: |
                  Constructive solid geometry counts front and back crossings, so a swapped
                  classification of a mirrored operand would invert it (its inside would become its
                  outside); only asymmetric operands and several mirror configurations can prove it.
                tests:
                  - SceneRenderer_Render_MirroredCsgOperand_MatchesBakedMirror
                  - SceneRenderer_Render_MirrorAboveCsgNode_MatchesBakedMirror

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-CsgDeterminism
                title: >-
                  The SceneRenderer shall produce byte-identical output for a CSG scene with
                  coincident faces, a mirrored operand and several leaves across tile parallelism
                  (sequential, two-way, automatic) and repeated runs, at each supersampling factor.
                justification: |
                  Per-sample resolution is a pure function of the fragment set and tiles are
                  independent, so parallel rendering must reproduce the sequential image exactly;
                  this is the contract that makes CSG output usable for regression comparison.
                tests:
                  - SceneRenderer_Render_CsgScene_ParallelAndSequentialAreByteIdentical

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-Transparency
                title: >-
                  The SceneRenderer shall honor the alpha of a NodeAppearance color by resolving a
                  scene with a translucent appearance through the fragment-list path (even without
                  a boolean node) and compositing the surface layers of each sample front to back
                  over the background color: a translucent solid shows its far wall through its
                  front, members of one union merge so that only the union's boundary is visible,
                  the cut surface of a translucent difference shows the subtrahend's own color and
                  alpha, an alpha of zero is invisible but still solid, a transparent background
                  keeps the layer color with the accumulated alpha, edges are antialiased, a camera
                  inside a translucent solid renders the exit surface with the appearance alpha, and
                  the alpha of the default and back-face colors is ignored.
                justification: |
                  Translucency lets a model show what lies behind or inside a part; resolving it in
                  the same fragment pipeline as constructive solid geometry gives an exact,
                  order-independent composite, while keeping the documented limits (merged unions,
                  ignored default-color alpha) explicit and tested.
                tests:
                  - SceneRenderer_Render_TranslucentBox_BlendsAppearanceColorWithBackground
                  - SceneRenderer_Render_TranslucentBoxOverOpaqueBox_ShowsBlend
                  - SceneRenderer_Render_TranslucentBox_ShowsBackWallThroughFront
                  - SceneRenderer_Render_TranslucentUnion_MergesOverlappingSolids_NoInteriorFaces
                  - SceneRenderer_Render_TranslucentDifference_ShowsCutSurfaceWithSubtrahendColor
                  - SceneRenderer_Render_AlphaZeroAppearance_IsInvisibleButSolid
                  - SceneRenderer_Render_TransparentBackground_ResolvesToPartialAlphaWithLayerColor
                  - SceneRenderer_Render_TranslucentEdges_AreAntialiased
                  - SceneRenderer_Render_CameraInsideTranslucentSolid_RendersWithoutFailure
                  - SceneRenderer_Render_DefaultColorAndBackFaceColorAlpha_AreStillIgnored

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-OverlayRendering
                title: >-
                  The SceneRenderer shall render each OverlayNode body as an independent solid with
                  the overlay's color and alpha, depth-composited with the rest of the scene: in
                  front of an opaque body it tints it, behind one it is hidden, it neither subtracts
                  from nor intersects an enclosing boolean, a subtrahend that is also drawn as an
                  overlay shows its overlay through the cut, an opaque overlay is an
                  independent opaque body, and a camera inside an overlay body sees the exit in
                  the back-face color at the overlay alpha, like a camera inside a translucent
                  solid.
                justification: |
                  Ghosts and highlights must be visible without changing the solid they annotate;
                  rendering them as independent bodies in the same composite keeps them correct
                  at any depth and with any camera.
                tests:
                  - SceneRenderer_Render_OverlayInFrontOfOpaque_Tints
                  - SceneRenderer_Render_OverlayBehindOpaque_Hidden
                  - SceneRenderer_Render_OverlayDoesNotParticipateInEnclosingDifference
                  - SceneRenderer_Render_HighlightPattern_SubtractedBodyShowsAsOverlayThroughCut
                  - SceneRenderer_Render_OverlayOpaqueColor_ActsAsIndependentBody
                  - SceneRenderer_Render_CameraInsideOverlay_ShowsBackFaceColorAtOverlayAlpha
                  - SceneRenderer_Render_CameraInsideOverlayInsideTranslucentSolid_CompositesBothExits
                  - SceneRenderer_Render_CameraOutsideOverlay_KeepsOwnColorFarWall

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-OpaqueUnchanged
                title: >-
                  The SceneRenderer shall keep an opaque scene without overlays unchanged: an
                  opaque union-only scene stays on the z-buffer path (the fragment budget and
                  operand validation are never consulted, an open mesh is not reported) and agrees
                  with the fragment-list path, and an opaque constructive-solid-geometry scene renders
                  exactly its pure appearance colors.
                justification: |
                  Transparency support must cost nothing and change nothing for the existing opaque
                  scenes, which are the overwhelming majority of use.
                tests:
                  - SceneRenderer_Render_OpaqueUnionScene_StillUsesZBufferAndIsByteIdenticalToFragmentPath
                  - SceneRenderer_Render_OpaqueCsgScene_IsUnchangedByTransparencySupport
                  - SceneRenderer_Render_OpaqueOpenMeshUnion_IsStillNotValidated

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-TransparencyBudget
                title: >-
                  The SceneRenderer shall subject a translucent or overlay scene to the per-tile
                  fragment budget, counting overlay and translucent triangles like any other
                  fragment, and throw RenderBudgetExceededException when a tile needs more.
                justification: |
                  Translucent and overlay triangles are stored as ordinary fragments, so the same
                  memory bound must hold for them; an overlay of the same size doubles the fragments
                  of its tile.
                tests:
                  - SceneRenderer_Render_TranslucentScene_ExceedingFragmentBudget_ThrowsRenderBudgetExceeded
                  - SceneRenderer_Render_OverlayFragments_CountTowardTheBudget

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-TransparencyValidation
                title: >-
                  The SceneRenderer shall validate the meshes of a translucent or overlay scene
                  (overlay bodies included) like constructive-solid-geometry operands, reporting an
                  open mesh with the same feature token to the handler or throwing in strict mode.
                justification: |
                  Translucent surfaces and overlays are resolved with signed crossing counters, so
                  an open mesh produces a visibly wrong image exactly as it does in a difference;
                  the caller must be told.
                tests:
                  - SceneRenderer_Render_TranslucentOpenMesh_IsReportedAndStrictThrows
                  - CsgOperandValidator_Validate_OverlayMeshes_AreChecked

              - id: CanvasNetRender3D-SceneRendering-SceneRenderer-TransparencyDeterminism
                title: >-
                  The SceneRenderer shall produce byte-identical output for a translucent scene
                  with a translucent difference and an overlay across tile parallelism and repeated
                  runs at each supersampling factor, and shall honor cooperative cancellation with
                  OperationCanceledException.
                justification: |
                  Layer compositing is integer arithmetic over a totally ordered fragment list and
                  tiles are independent, so parallel output must equal sequential output exactly;
                  cancellation must work on the fragment path as on the z-buffer path.
                tests:
                  - SceneRenderer_Render_TranslucentScene_ParallelAndSequentialAreByteIdentical
                  - SceneRenderer_Render_TranslucentScene_RepeatedRendersAreByteIdentical
                  - SceneRenderer_Render_TranslucentScene_CancellationThrowsOperationCanceled
