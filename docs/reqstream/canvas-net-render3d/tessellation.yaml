---
# cspell:ignore tessellator
#
# Software Subsystem Requirements for Tessellation
#
# These requirements decompose the CanvasNetRender3D system's primitive-mesh responsibility into the
# Tessellation subsystem (namespace DemaConsulting.CanvasNet.Render3D.Tessellation). Each
# requirement here links down to the unit requirements (PrimitiveTessellator, PolygonTriangulator,
# Extruder, ConvexHull, MinkowskiSum) that implement it.

sections:
  - title: CanvasNetRender3D Requirements
    sections:
      - title: Tessellation Requirements
        requirements:
          - id: CanvasNetRender3D-Tessellation-PrimitiveMeshes
            title: >-
              The Tessellation subsystem shall convert box, sphere, and cylinder/cone/frustum
              descriptions into welded, closed, outward-oriented meshes, shall build a polyhedron
              mesh from caller-supplied points and faces while preserving the supplied faces and
              winding (closure and outward orientation being the caller's responsibility), and
              shall reject invalid dimensions, segment counts, and indices.
            justification: |
              Primitive meshes are the basic building blocks of CAD-style scenes; the topological
              soundness and orientation contract of the analytic primitives determine correct
              shading and back-face behavior downstream, while caller-supplied polyhedra are
              reproduced faithfully so the caller keeps control of their geometry.
            children:
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Box
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Sphere
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Cylinder
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Cone
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Polyhedron
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Validation
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-ClosedOutward
            tests:
              - Tessellation_AllPrimitives_AreClosedAndOutwardOriented
              - Tessellation_Polyhedron_OpenFaceSet_IsPreservedWithoutClosureOrReorientation

          - id: CanvasNetRender3D-Tessellation-PolygonExtrusion
            title: >-
              The Tessellation subsystem shall provide validated 2D polygon regions (rectangle,
              ellipse, circle, and polygon with holes, with invalid polygons rejected by an
              ArgumentException), an exact ear-clipping triangulator with hole bridging, and linear
              (optionally twisted and scaled, with an apex when the scale is zero) and rotational
              extrusion of those regions into closed, outward-oriented meshes that are valid
              constructive-solid-geometry operands, with a hole extruded as a single connected shell
              with a through-hole and a profile that crosses the rotation axis rejected.
            justification: |
              Extruded 2D profiles are the other half of CAD-style modeling alongside primitives;
              the exactness of the triangulation and the closed, outward, welded guarantee of every
              extruded mesh are what let the renderer and the constructive solid geometry path treat
              them like any other solid, and failing closed on invalid polygons keeps defective
              meshes from ever being produced.
            children:
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-RegionModel
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-RegionValidation
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-ExactCoverage
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-Holes
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-CollinearAndDuplicatePoints
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-ExactPredicates
              - CanvasNetRender3D-Tessellation-PolygonTriangulator-Determinism
              - CanvasNetRender3D-Tessellation-Extruder-LinearPrism
              - CanvasNetRender3D-Tessellation-Extruder-LinearHoles
              - CanvasNetRender3D-Tessellation-Extruder-LinearScale
              - CanvasNetRender3D-Tessellation-Extruder-LinearApex
              - CanvasNetRender3D-Tessellation-Extruder-LinearTwist
              - CanvasNetRender3D-Tessellation-Extruder-LinearValidation
              - CanvasNetRender3D-Tessellation-Extruder-RotateFull
              - CanvasNetRender3D-Tessellation-Extruder-RotatePartial
              - CanvasNetRender3D-Tessellation-Extruder-RotateAxis
              - CanvasNetRender3D-Tessellation-Extruder-RotateValidation
              - CanvasNetRender3D-Tessellation-Extruder-ValidOperand
              - CanvasNetRender3D-Tessellation-Extruder-EmptyRegion
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Rectangle
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Ellipse
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Polygon2D
              - CanvasNetRender3D-Tessellation-PrimitiveTessellator-Shapes2DValidation
            tests:
              - Tessellation_PolygonExtrusion_AllResults_AreClosedAndValidCsgOperands
              - Tessellation_PolygonRegion_InvalidPolygon_IsRejected

          - id: CanvasNetRender3D-Tessellation-ConvexHullMinkowski
            title: >-
              The Tessellation subsystem shall compute the exact convex hull of a point set as a closed,
              outward-oriented triangle mesh whose vertices are exactly the strictly extreme points (and
              as a strictly convex planar polygon), handling degenerate input and rejecting flat or
              invalid input with an exception, and the Minkowski sum of two convex solid meshes as the
              hull of their pairwise vertex sums, verifying that each operand is a closed convex solid
              and rejecting any other operand with a NotSupportedException instead of approximating it;
              all results shall be reproducible, valid constructive-solid-geometry operands, and all work
              shall be bounded and cancellable.
            justification: |
              The hull is the foundation of the OpenSCAD hull and minkowski operations; exact
              predicates, a sound convexity test and an explicit failure for unsupported operands keep
              the results correct for the inputs that are accepted, and bounded, cancellable work keeps
              untrusted input from running unchecked.
            children:
              - CanvasNetRender3D-Tessellation-ConvexHull-Hull3DSolid
              - CanvasNetRender3D-Tessellation-ConvexHull-ExtremePoints
              - CanvasNetRender3D-Tessellation-ConvexHull-DegenerateInput
              - CanvasNetRender3D-Tessellation-ConvexHull-InvalidInput
              - CanvasNetRender3D-Tessellation-ConvexHull-ExactPredicates
              - CanvasNetRender3D-Tessellation-ConvexHull-Determinism
              - CanvasNetRender3D-Tessellation-ConvexHull-ValidOperand
              - CanvasNetRender3D-Tessellation-ConvexHull-Hull2D
              - CanvasNetRender3D-Tessellation-ConvexHull-Bounds
              - CanvasNetRender3D-Tessellation-MinkowskiSum-ConvexSum
              - CanvasNetRender3D-Tessellation-MinkowskiSum-ConvexityDetection
              - CanvasNetRender3D-Tessellation-MinkowskiSum-Validation
              - CanvasNetRender3D-Tessellation-MinkowskiSum-Determinism
              - CanvasNetRender3D-Tessellation-MinkowskiSum-ValidOperand
              - CanvasNetRender3D-Tessellation-MinkowskiSum-Cancellation
            tests:
              - Tessellation_ConvexHull_OfPrimitiveVertices_IsClosedAndAValidCsgOperand
              - Tessellation_MinkowskiSum_OfPrimitives_IsClosedValidAndRejectsNonConvexOperands
