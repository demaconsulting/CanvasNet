---
# Software Unit Requirements for SceneGraph
#
# These requirements describe the design-level behavior of the SceneGraph unit: the public
# SceneNode, MeshNode, GroupNode, CsgNode, CsgOperation, NodeAppearance, and Scene types (and the
# internal SceneInstance record) in the DemaConsulting.CanvasNet.Render3D.SceneModel namespace. A
# group's semantics is the implicit union of its children; boolean operations (difference,
# intersection) are expressed with CsgNode.

sections:
  - title: CanvasNetRender3D Requirements
    sections:
      - title: SceneModel Requirements
        sections:
          - title: SceneGraph Requirements
            requirements:
              - id: CanvasNetRender3D-SceneModel-SceneGraph-NodeConstruction
                title: >-
                  The MeshNode, GroupNode, and Scene constructors shall reject null arguments
                  (including a null child element), defensively copy a group's children, and allow
                  an empty group.
                justification: |
                  A scene graph must be valid and immutable by construction, with an empty group
                  being a legitimate (empty) assembly.
                tests:
                  - MeshNode_Constructor_NullMesh_Throws
                  - GroupNode_Constructor_NullChildren_Throws
                  - GroupNode_Constructor_NullChildElement_Throws
                  - GroupNode_Constructor_CopiesChildren
                  - GroupNode_Constructor_Empty_Allowed
                  - Scene_Constructor_NullRoot_Throws

              - id: CanvasNetRender3D-SceneModel-SceneGraph-TransformValidation
                title: >-
                  A SceneNode's Transform shall default to the identity matrix and shall reject a
                  non-finite matrix with ArgumentException.
                justification: |
                  A default-constructed matrix is the zero matrix, so an explicit identity default
                  is required, and a non-finite transform would poison every descendant.
                tests:
                  - SceneNode_Transform_NonFiniteMatrix_ThrowsArgumentException
                  - SceneNode_Transform_DefaultIsIdentity

              - id: CanvasNetRender3D-SceneModel-SceneGraph-HierarchyComposition
                title: >-
                  The Scene shall enumerate mesh instances by depth-first pre-order traversal,
                  composing each instance's world transform as its own transform followed by its
                  ancestors' transforms, assigning each instance a stable pre-order index used as
                  its draw priority, and enumerating a child shared by several parents once per
                  path.
                justification: |
                  Correct transform composition order and a stable draw order are required for
                  correct placement and for deterministic resolution of coincident faces.
                tests:
                  - Scene_EnumerateInstances_NestedTransforms_ComposeChildThenParent
                  - Scene_EnumerateInstances_PreOrderIndexIsStable
                  - Scene_EnumerateInstances_SharedChild_EnumeratedPerPath

              - id: CanvasNetRender3D-SceneModel-SceneGraph-AppearanceInheritance
                title: >-
                  The Scene shall resolve each mesh instance's appearance as that of its innermost
                  enclosing node that specifies one, and report no appearance when none does.
                justification: |
                  Innermost-wins inheritance lets a caller color an assembly and override a single
                  part.
                tests:
                  - Scene_EnumerateInstances_InnermostAppearanceWins
                  - Scene_EnumerateInstances_NoAppearance_ReportsNull

              - id: CanvasNetRender3D-SceneModel-SceneGraph-SceneBounds
                title: >-
                  The Scene ComputeBounds method shall return the tight world-space bounding box
                  obtained by transforming every instance's vertices in double precision, an empty
                  box for an empty scene, and the same result on repeated calls.
                justification: |
                  Exact scene bounds give the camera a tight framing and the renderer an accurate
                  depth range.
                tests:
                  - Scene_ComputeBounds_TransformedGroup_MatchesAnalytic
                  - Scene_ComputeBounds_EmptyGroup_IsEmpty
                  - Scene_ComputeBounds_CalledTwice_ReturnsSame

              - id: CanvasNetRender3D-SceneModel-SceneGraph-DeepNesting
                title: >-
                  The Scene traversal shall use an explicit stack rather than recursion so that a
                  scene nested ten thousand groups deep is enumerated without stack overflow.
                justification: |
                  Generated models (for example from CAD import) can nest very deeply, and a stack
                  overflow cannot be caught by the caller.
                tests:
                  - Scene_EnumerateInstances_TenThousandNestedGroups_DoesNotOverflowStack

              - id: CanvasNetRender3D-SceneModel-SceneGraph-CsgNode
                title: >-
                  The CsgNode constructor shall accept a defined CsgOperation (Union, Difference,
                  or Intersection) and a sequence of child nodes, reject an undefined operation
                  with ArgumentOutOfRangeException, a null sequence with ArgumentNullException, and
                  a null child element with ArgumentException, defensively copy the children,
                  allow an empty node (which is empty for every operation), and validate its
                  Transform like every other node.
                justification: |
                  Constructive solid geometry needs an immutable, validated boolean node that keeps
                  the closed scene-node hierarchy, and a defined meaning for a node without
                  children so that generated models never meet an undefined case.
                tests:
                  - CsgNode_Constructor_NullChildren_Throws
                  - CsgNode_Constructor_NullChildElement_Throws
                  - CsgNode_Constructor_UndefinedOperation_Throws
                  - CsgNode_Constructor_KeepsOperationAndCopiesChildren
                  - CsgNode_Constructor_Empty_AllowedAndEmptyForEveryOperation
                  - CsgNode_Transform_NonFiniteMatrix_ThrowsArgumentException

              - id: CanvasNetRender3D-SceneModel-SceneGraph-CsgEnumeration
                title: >-
                  The Scene shall enumerate every operand of a CsgNode exactly like the children of
                  a group (depth-first pre-order, child-then-parent transform composition,
                  innermost-appearance inheritance, once per path for a shared child, without
                  recursion for ten thousand nested nodes), report for each instance the MeshNode
                  it came from, and include every operand in the scene bounds.
                justification: |
                  The renderer recovers the boolean structure from the same traversal that yields
                  the instances; a node kind the traversal silently skipped would vanish from the
                  render and from the bounds, and the source node lets diagnostics point back to
                  the model.
                tests:
                  - Scene_EnumerateInstances_CsgNode_DescendsIntoOperandsInPreOrder
                  - Scene_EnumerateInstances_CsgNode_SharedChild_EnumeratedPerPath
                  - Scene_EnumerateInstances_CsgNode_ComposesTransformAndInheritsAppearance
                  - CsgNode_SingleChild_EnumeratesThatChild
                  - Scene_ComputeBounds_CsgNode_IncludesAllOperands
                  - Scene_EnumerateInstances_TenThousandNestedCsgNodes_DoesNotOverflowStack
