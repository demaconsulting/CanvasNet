---
# Software System Requirements for CanvasNetPlantUml
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.PlantUml package (root
# namespace DemaConsulting.CanvasNet.PlantUml; internal subsystem namespaces Syntax, Styling, Scenegraph, and
# Sequence) from the perspective of its consumers, without specifying implementation details.
#
# CanvasNetPlantUml is an independent software system distributed as its own NuGet package. It reads PlantUML diagram
# text and renders a static, deterministic picture onto a CanvasNet Surface using only managed code, the public
# CanvasNet APIs, and the fonts bundled with CanvasNet: there is no Java, no Graphviz, and no network access. Every
# PlantUML diagram type is recognized; the types this version does not draw are reported as unsupported with a stable
# plantuml-* identifier instead of failing or drawing a guess (see docs/design/canvas-net-plant-uml.md, Known
# Differences, and the Phase Plan). The ported look and geometry of the MIT-licensed distribution of PlantUML are
# attributed in the package's third-party notice (src/DemaConsulting.CanvasNet.PlantUml/third-party).
#
# Every requirement below links down to the subsystem and unit requirements that implement it; the test evidence is
# described in docs/verification/canvas-net-plant-uml.md.

sections:
  - title: CanvasNetPlantUml Requirements
    requirements:
      - id: CanvasNetPlantUml-Open
        title: >-
          The library shall parse PlantUML diagram text supplied as a string, a readable stream, or a file path into
          a PlantUmlDocument that is identical whichever entry point is used, shall take the first @startuml block of
          the text (or the whole text when it has no @start tag) as the diagram, shall ignore a leading byte-order
          mark, shall refuse text that is not valid UTF-8, and shall reject null arguments and unreadable sources with
          the documented exception contract.
        tags: [system]
        justification: |
          Callers hold diagrams in different forms (a code block without tags, an embedded resource, a file with
          tags); every entry point must yield the same validated result, and invalid arguments must fail closed with
          a predictable exception rather than being coerced.
        children:
          - CanvasNetPlantUml-PlantUmlDocument-ParseOpen
          - CanvasNetPlantUml-Syntax-Framing
        tests:
          - CanvasNetPlantUml_Open_StringStreamAndPath_Agree

      - id: CanvasNetPlantUml-LocatedErrors
        title: >-
          The library shall refuse text that holds no diagram, an unknown @start tag, or a statement its diagram type
          cannot read with a syntax exception that carries a stable plantuml-* code, the file, line, and column of
          the problem in the original text, and a hint.
        tags: [system]
        justification: |
          Diagrams are written by hand and checked in builds; an author or an agent can only fix an error that
          points into the text that was written, and a tool can only react to a stable code.
        children:
          - CanvasNetPlantUml-Syntax-Detection
          - CanvasNetPlantUml-Syntax-Locations
          - CanvasNetPlantUml-PlantUmlDocument-Records
        tests:
          - CanvasNetPlantUml_Open_InvalidText_FailsLocated

      - id: CanvasNetPlantUml-DiagramTypes
        title: >-
          The library shall recognize every PlantUML diagram type, from its @start tag or, inside @startuml, from its
          statements in the order PlantUML tries them, and shall name the type of a document whether or not this
          version draws it.
        tags: [system]
        justification: |
          A host must be able to tell a sequence diagram from a class diagram without rendering it, so that it can
          report a type that is not drawn instead of a syntax error.
        children:
          - CanvasNetPlantUml-Syntax-Detection
          - CanvasNetPlantUml-PlantUmlDocument-Metadata
        tests:
          - CanvasNetPlantUml_OtherDiagramTypes_AreRecognized

      - id: CanvasNetPlantUml-Preprocessor
        title: >-
          The library shall apply the supported subset of the PlantUML preprocessor (comments, continued lines,
          !define without parameters, !undef, and !$variable assignments) before it reads the diagram, shall report
          every other directive as unsupported instead of failing, and shall never read a URL or the network.
        tags: [system, security]
        justification: |
          Real diagrams use macros and variables for names and labels; directives outside the subset must not stop
          a diagram from being drawn, and an offline renderer must never fetch remote content that a text names.
        children:
          - CanvasNetPlantUml-Syntax-Preprocessing
          - CanvasNetPlantUml-PlantUmlDocument-Reports
        tests:
          - CanvasNetPlantUml_Preprocessor_SubsetIsApplied

      - id: CanvasNetPlantUml-Limits
        title: >-
          The library shall bound the resources that reading an untrusted text can consume, refusing a text longer
          than the size limit with an InvalidDataException and a structural limit with a located exception whose
          code is plantuml-limit-exceeded.
        tags: [system, security]
        justification: |
          PlantUML text often comes from untrusted documents; a hostile text must fail closed rather than exhaust
          memory, time, or the call stack.
        children:
          - CanvasNetPlantUml-PlantUmlDocument-TextLimit
          - CanvasNetPlantUml-PlantUmlDocument-Limits
          - CanvasNetPlantUml-Syntax-Preprocessing
        tests:
          - CanvasNetPlantUml_Limits_OversizedText_IsRefused
