---
# Software Unit Requirements for PdfDocument
#
# cspell:ignore xref startxref endobj endstream ObjStm MediaBox Zapf Nonsymbolic subsetted
#
# These requirements describe the design-level behavior of the PdfDocument unit.
#
# Packaging note: PdfDocument is distributed as the separate DemaConsulting.CanvasNet.Pdf NuGet
# package (namespace DemaConsulting.CanvasNet.Pdf), which references the core
# DemaConsulting.CanvasNet package. PdfDocument is the sole unit of the CanvasNetPdf system.

sections:
  - title: CanvasNetPdf Requirements
    sections:
      - title: PdfDocument Requirements
        requirements:
          - id: CanvasNetPdf-PdfDocument-Tokenizer
            title: >-
              The PdfDocument class shall tokenize a PDF byte stream into numbers (integer and
              real, including leading-plus and bare-dot forms), literal strings (including nested
              parentheses and backslash/octal escapes), hexadecimal strings (padding an odd digit
              count with a trailing zero nibble), names (decoding  # xx hash escapes), array and
              dictionary delimiters, and the reserved keywords, while skipping %-comments.
            justification: |
              Every later parsing stage (object model, cross-reference tables/streams, page tree)
              depends on a correct, spec-conformant token stream; a tokenizer defect would corrupt
              every downstream feature silently.
            tests:
              - PdfDocument_Tokenizer_Numbers_ParsesIntegerAndRealForms
              - PdfDocument_Tokenizer_LiteralString_HandlesNestedParensAndEscapes
              - PdfDocument_Tokenizer_HexString_DecodesFullBytes
              - PdfDocument_Tokenizer_HexString_PadsOddDigitCountWithTrailingZero
              - PdfDocument_Tokenizer_Name_DecodesHashEscapes
              - PdfDocument_Tokenizer_Delimiters_RecognizesArrayAndDictionaryBrackets
              - PdfDocument_Tokenizer_Comments_AreSkipped
              - PdfDocument_Tokenizer_Keywords_AreRecognizedVerbatim
              - PdfDocument_Tokenizer_EndOfInput_ReturnsEndOfFileToken

          - id: CanvasNetPdf-PdfDocument-ObjectModel
            title: >-
              The PdfDocument class shall parse a token stream into its internal object model
              (dictionaries with nested entries, arrays of mixed element kinds, and indirect
              references), distinguishing a bare number followed by an object-definition header
              from an indirect reference.
            justification: |
              PDF's dictionary/array/reference object model is the structural backbone every
              cross-reference and page-tree feature is built on; it must be parsed correctly and
              distinctly from a superficially similar bare-number-then-keyword sequence.
            tests:
              - PdfDocument_ObjectModel_Dictionary_ParsesNestedEntries
              - PdfDocument_ObjectModel_Array_ParsesMixedElementTypes
              - PdfDocument_ObjectModel_IndirectReference_ParsesObjectAndGenerationNumbers
              - PdfDocument_ObjectModel_BareNumber_IsNotMisreadAsReference

          - id: CanvasNetPdf-PdfDocument-ClassicXref
            title: >-
              The PdfDocument class shall parse a classic xref table and trailer dictionary,
              resolving the catalog and every page object it references.
            justification: |
              The classic xref/trailer form is the original, still-common cross-reference format
              and must be supported for broad real-world document compatibility.
            tests:
              - PdfDocument_Open_ClassicXref_ResolvesRootAndPage

          - id: CanvasNetPdf-PdfDocument-XrefStream
            title: >-
              The PdfDocument class shall parse a /Type /XRef cross-reference stream (with no
              classic table present), decoding its /W width-triplet-driven binary fields, and
              resolve the catalog and every page object it references.
            justification: |
              Modern PDF producers commonly emit cross-reference streams instead of classic
              tables; without this support, a large class of real-world documents would fail to
              open.
            tests:
              - PdfDocument_Open_XrefStream_ResolvesRootAndPage

          - id: CanvasNetPdf-PdfDocument-ObjectStream
            title: >-
              The PdfDocument class shall decompress a /Type /ObjStm object stream (FlateDecode)
              and resolve an indirect object compressed within it, using the stream's /N and
              /First header fields.
            justification: |
              Object streams let producers compactly store many small objects (such as page
              dictionaries) inside one compressed stream; without support for resolving objects
              compressed this way, many modern documents' pages would be unreachable.
            tests:
              - PdfDocument_Open_ObjectStream_DecompressesAndResolvesCompressedPage

          - id: CanvasNetPdf-PdfDocument-HybridXref
            title: >-
              The PdfDocument class shall resolve an object described only by a hybrid document's
              supplementary /XRefStm cross-reference stream, even though the document's classic
              trailer marks that object number as free.
            justification: |
              Hybrid-reference files let old readers use the classic table while modern readers
              use the supplementary stream to reach objects (such as ones compressed in an object
              stream) the classic table cannot describe; without this, such documents would appear
              to be missing objects a modern reader should be able to find.
            tests:
              - PdfDocument_Open_HybridXref_ResolvesCompressedEntryViaXRefStm

          - id: CanvasNetPdf-PdfDocument-LinearScanFallback
            title: >-
              The PdfDocument class shall fall back to a linear scan of the document for "N G obj"
              markers, reconstructing an object-offset table directly, when startxref is absent,
              unreadable, or the parsed cross-reference chain does not resolve to a valid catalog.
            justification: |
              Real-world PDF producers occasionally emit documents with a missing or corrupt
              startxref/cross-reference section; a linear-scan fallback lets such otherwise
              well-formed documents still be opened instead of always failing outright.
            tests:
              - PdfDocument_Open_MalformedStartxref_FallsBackToLinearScan

          - id: CanvasNetPdf-PdfDocument-PageTreeTraversal
            title: >-
              The PdfDocument class shall traverse the document's page tree, from the catalog's
              /Pages root through recursively nested /Kids arrays, reporting every /Type /Page
              leaf found, in document order.
            justification: |
              Callers need every page in a document reported, regardless of how deeply the
              document's own page tree happens to be nested.
            tests:
              - PdfDocument_PageTree_Traversal_ReportsAllPagesInDocumentOrder

          - id: CanvasNetPdf-PdfDocument-PageTreeInheritance
            title: >-
              The PdfDocument class shall inherit a page's /MediaBox and /Rotate from the nearest
              ancestor page-tree node that declares one (defaulting to US Letter [0 0 612 792] and
              rotation 0 when wholly undeclared in the ancestry), and shall swap the reported
              width and height when the normalized effective rotation is 90 or 270 degrees.
            justification: |
              PDF pages routinely omit their own /MediaBox/Rotate, relying on an ancestor /Pages
              node's declaration; callers need the correct, already-inherited and rotation-adjusted
              size without independently re-implementing this inheritance and swap logic.
            tests:
              - PdfDocument_PageTree_Inheritance_ExplicitMediaBoxAndNoRotationIsUnchanged
              - PdfDocument_PageTree_Inheritance_Rotation90SwapsDisplayedWidthAndHeight
              - PdfDocument_PageTree_Inheritance_MediaBoxInheritedFromPagesNodeWhenPageOmitsIt

          - id: CanvasNetPdf-PdfDocument-PageTreeCycleRejection
            title: >-
              The PdfDocument class shall detect and reject an unbounded page-tree reference cycle
              (a /Kids entry referencing one of its own ancestors) with InvalidDataException.
            justification: |
              A malformed or adversarial document's page tree could otherwise cause an unbounded
              traversal loop; rejecting the cycle keeps parsing bounded and predictable.
            tests:
              - PdfDocument_PageTree_CycleRejection_ThrowsInvalidDataException

          - id: CanvasNetPdf-PdfDocument-EncryptDetection
            title: >-
              The PdfDocument class shall detect an /Encrypt key in the trailer and throw
              UnsupportedImageFeatureException with feature token "pdf-encrypted", without
              attempting to resolve or decrypt the referenced encryption dictionary.
            justification: |
              Treating still-encrypted bytes as plaintext would silently produce meaningless
              results; a clear, well-formed-but-unsupported signal lets callers distinguish this
              case from a genuinely malformed document.
            tests:
              - PdfDocument_Open_EncryptedTrailer_ThrowsUnsupportedImageFeatureException

          - id: CanvasNetPdf-PdfDocument-Open
            title: >-
              The PdfDocument class shall expose Open(Stream) and Open(string) overloads that
              fully buffer their input and parse it identically, rejecting a null stream or path
              with ArgumentNullException and an empty or whitespace-only path with
              ArgumentException, without taking ownership of (or disposing) a caller-supplied
              stream.
            justification: |
              Callers need a predictable, symmetric entry point regardless of whether their PDF
              data already lives in a stream or only exists as a file on disk, and must retain
              ownership of any stream they pass in themselves.
            tests:
              - PdfDocument_Open_NullStream_ThrowsArgumentNullException
              - PdfDocument_Open_NullPath_ThrowsArgumentNullException
              - PdfDocument_Open_EmptyOrWhitespacePath_ThrowsArgumentException

          - id: CanvasNetPdf-PdfDocument-GetPageInfo
            title: >-
              The PdfDocument class shall reject a GetPageInfo call with a negative page index or
              one greater than or equal to PageCount with ArgumentOutOfRangeException.
            justification: |
              Callers need a clear, standard validation error rather than an out-of-bounds crash
              or a silently wrong result when passing an invalid page index.
            tests:
              - PdfDocument_GetPageInfo_OutOfRangeIndex_ThrowsArgumentOutOfRangeException

          - id: CanvasNetPdf-PdfDocument-Render
            title: >-
              The PdfDocument class shall return a Surface of the caller-specified width and
              height for a valid page index, painting it with the page's interpreted content-
              stream geometry (see CanvasNetPdf-PdfDocument-ContentStreamDispatch and its sibling
              requirements below) or, when the page declares no /Contents at all, a fully
              transparent surface; it shall validate the page index the same way GetPageInfo does,
              and propagate Surface's own width/height validation unwrapped rather than
              duplicating it.
            justification: |
              Phase 1 established Render's final call shape (page index plus caller-chosen output
              size) so Phase 2's real content-stream rendering could be added without a breaking
              API change; callers need a correctly sized, correctly painted result.
            tests:
              - PdfDocument_Render_ValidPageIndex_ReturnsCorrectlySizedBlankSurface
              - PdfDocument_Render_OutOfRangePageIndex_ThrowsArgumentOutOfRangeException
              - PdfDocument_Render_InvalidWidth_PropagatesSurfaceArgumentOutOfRangeException
              - PdfDocument_ContentStream_NoContents_RendersBlankSurface

          - id: CanvasNetPdf-PdfDocument-ContentStreamDispatch
            title: >-
              The PdfDocument class shall tokenize and dispatch a page's resolved content-stream
              bytes over a fixed set of recognized path-construction/painting and graphics-state
              operators, silently skipping any other keyword (color, text, image, clipping, and
              any other operator not yet implemented) rather than throwing, and shall throw
              InvalidDataException when a recognized operator's own operand count/type does not
              match its documented requirement.
            justification: |
              Real-world content streams routinely contain operators outside this phase's scope
              (color, text, images, clipping); a lenient-toward-the-unrecognized, strict-toward-
              the-malformed-recognized dispatch loop lets such streams still render their in-scope
              geometry instead of failing outright.
            tests:
              - PdfDocument_ContentStream_UnknownOperator_IsSkippedWithoutThrowing
              - CanvasNetPdf_SystemIntegration_PdfRender_FilledRectangleAndStrokedLine_PaintsExpectedPixels

          - id: CanvasNetPdf-PdfDocument-ContentsResolution
            title: >-
              The PdfDocument class shall resolve a page's /Contents entry to fully decoded
              content-stream bytes whether declared as a single stream or as an array of streams,
              concatenating array entries with a single space byte between each so adjacent tokens
              from different streams can never merge into one, and shall throw
              InvalidDataException when /Contents is neither a stream nor an array of streams, or
              when an array entry does not itself resolve to a stream.
            justification: |
              The PDF specification explicitly requires the space separator between concatenated
              /Contents array entries; omitting it can silently corrupt otherwise well-formed
              geometry by merging two numeric operands from adjacent streams into one.
            tests:
              - PdfDocument_ContentStream_ContentsArray_ConcatenatesStreamsWithSpaceSeparator

          - id: CanvasNetPdf-PdfDocument-GraphicsStateStack
            title: >-
              The PdfDocument class shall maintain a graphics-state stack via the q/Q operators
              (tolerating an unbalanced Q with no matching prior q as a no-op), compose the
              current transformation matrix via the cm operator by right-multiplying the supplied
              matrix onto the current transform, and store the line width/cap/join/miter-limit/
              dash-pattern operands of w/J/j/M/d on the current graphics state, all with
              InvalidDataException thrown for a malformed operand count.
            justification: |
              Nested q/cm/Q blocks are the standard PDF idiom for scoping a coordinate-space or
              stroke-style change to one part of a content stream; without a correctly composing,
              correctly restoring stack, every subsequently drawn path's position/appearance could
              be silently wrong.
            tests:
              - PdfDocument_GraphicsState_QPushCmThenQPop_RestoresPriorTransform
              - PdfDocument_GraphicsState_NestedQQ_ComposesTransformsInOrder
              - PdfDocument_GraphicsState_UnbalancedQWithNoMatchingPush_DoesNotThrow
              - PdfDocument_GraphicsState_MalformedCmOperandCount_ThrowsInvalidDataException

          - id: CanvasNetPdf-PdfDocument-CtmDerivation
            title: >-
              The PdfDocument class shall derive each page's base (pre-content-stream) current
              transformation matrix from its raw /MediaBox origin, effective /Rotate, and the
              caller's requested render width/height, mapping PDF user-space coordinates (origin
              bottom-left, y-axis up) to device pixel-space coordinates (origin top-left, y-axis
              down) with the correct rotation and independent X/Y scaling to the requested size.
            justification: |
              An incorrect CTM derivation would silently misplace every rendered page's geometry;
              this is most reliably proven with a deliberately asymmetric fixture at a non-zero
              rotation, where any rotation-sign or origin-offset error produces a detectably wrong
              pixel position rather than a merely-shifted-but-plausible one.
            tests:
              - CanvasNetPdf_SystemIntegration_PdfRender_RotatedPage_MapsGeometryToCorrectPixelPosition

          - id: CanvasNetPdf-PdfDocument-PathConstruction
            title: >-
              The PdfDocument class shall build the current path from the m/l/c/v/y/h/re path-
              construction operators exactly as the PDF specification documents (v's first control
              point defaults to the current point; y's second control point defaults to the
              curve's own endpoint; re appends an independently closed rectangular subpath), baking
              the current transformation matrix into every emitted point, requiring an already-open
              subpath for every operator except m/re, and throwing InvalidDataException for a
              malformed operand count or a draw operator issued before the first m/re.
            justification: |
              Path construction is the geometric foundation every fill/stroke operator paints;
              each operator (especially the v/y curve shorthands, whose control-point defaulting
              rules are easy to get backwards) must build exactly the curve/line/rectangle the
              specification documents.
            tests:
              - PdfDocument_PathOps_MoveLineRectCurve_BuildExpectedGeometry
              - PdfDocument_PathOps_MalformedOperandCount_ThrowsInvalidDataException
              - PdfDocument_PathOps_DrawBeforeMoveTo_ThrowsInvalidDataException

          - id: CanvasNetPdf-PdfDocument-PathPainting
            title: >-
              The PdfDocument class shall paint the current path via the f/F/f*/S/s/B/B*/b/b*/n
              path-painting operators (choosing the nonzero or even-odd fill rule as documented,
              closing the current subpath first for s/b/b*, and never painting anything for n)
              using the current graphics state's fill/stroke color, and shall always clear the
              current path afterward while leaving the surrounding graphics state, including its
              CTM, stroke style, and color, unaffected by that clear.
            justification: |
              Callers need every documented fill-rule/stroke/close-first combination and the
              path-clearing-but-state-preserving behavior between consecutive painted paths to
              behave exactly as the specification requires, or subsequent paths in the same
              content stream could silently paint with a stale path or a reset graphics state.
            tests:
              - PdfDocument_PathOps_FillNonZero_PaintsExpectedPixels
              - PdfDocument_PathOps_FillEvenOdd_PaintsExpectedPixels
              - PdfDocument_PathOps_Stroke_PaintsExpectedPixels
              - PdfDocument_PathOps_CloseAndFillAndStroke_PaintsExpectedPixels
              - PdfDocument_PathOps_NoOp_DiscardsPathWithoutPainting
              - PdfDocument_PathOps_PaintOperator_ClearsPathButPreservesGraphicsState

          - id: CanvasNetPdf-PdfDocument-Dispose
            title: >-
              The PdfDocument class shall make Dispose idempotent, safe to call more than once
              without throwing.
            justification: |
              Callers commonly combine a using declaration with manual disposal (or dispose more
              than once for other reasons); Dispose must tolerate this without throwing.
            tests:
              - PdfDocument_Dispose_CalledTwice_DoesNotThrow

          - id: CanvasNetPdf-PdfDocument-ObjectDisposedException
            title: >-
              The PdfDocument class shall throw ObjectDisposedException from PageCount,
              GetPageInfo, and Render once the document has been disposed.
            justification: |
              Callers must not be able to read stale or released parsed state through a disposed
              PdfDocument instance.
            tests:
              - PdfDocument_PageCount_AfterDispose_ThrowsObjectDisposedException
              - PdfDocument_GetPageInfo_AfterDispose_ThrowsObjectDisposedException
              - PdfDocument_Render_AfterDispose_ThrowsObjectDisposedException

          - id: CanvasNetPdf-PdfDocument-DeviceColorOperators
            title: >-
              The PdfDocument class shall implement the g/G/rg/RG/k/K device color operators,
              setting the current fill/stroke color from clamped-to-[0,1] gray/RGB/CMYK
              components (CMYK converted via R = 255 * (1 - C) * (1 - K), and the equivalent
              formulas for G/B), clamping any component outside [0,1] rather than rejecting it,
              and throwing InvalidDataException for a malformed operand count or type.
            justification: |
              Real device color is the direct Phase 3 successor to Phase 2's fixed opaque-black
              painting; every filled/stroked path must reflect the color a content stream
              actually requests, converted per the PDF specification's own documented formulas.
            tests:
              - PdfDocument_Color_SetGrayFill_SetsExpectedRgbaColor
              - PdfDocument_Color_SetGrayStroke_SetsExpectedRgbaColor
              - PdfDocument_Color_SetRgbFill_SetsExpectedRgbaColor
              - PdfDocument_Color_SetRgbStroke_SetsExpectedRgbaColor
              - PdfDocument_Color_SetCmykFill_ConvertsToExpectedRgbaColor
              - PdfDocument_Color_SetCmykStroke_ConvertsToExpectedRgbaColor
              - PdfDocument_Color_ComponentValuesOutsideZeroToOne_AreClamped
              - PdfDocument_Color_MalformedOperandCount_ThrowsInvalidDataException

          - id: CanvasNetPdf-PdfDocument-ColorSpaceOperators
            title: >-
              The PdfDocument class shall implement the cs/CS operators, resolving DeviceGray/
              DeviceRGB/DeviceCMYK directly or via the current page's /Resources/ColorSpace
              dictionary and resetting color to opaque black, and the sc/SC/scn/SCN operators,
              setting color from the current color space's required component count; any other
              resolved color space (Indexed/Separation/DeviceN/ICCBased/CalRGB/CalGray/Lab, an
              undeclared name, or a scn/SCN /Pattern name) shall throw
              UnsupportedImageFeatureException rather than being silently mis-rendered.
            justification: |
              A content stream that selects an unsupported color space or a pattern color must be
              rejected explicitly (fail closed), not silently mis-rendered with the wrong number
              of components or an incorrect color, so a caller can detect the unsupported feature
              rather than receiving a plausible-looking but wrong image.
            tests:
              - PdfDocument_Color_SetColorSpaceFill_DeviceNames_ResetsColorToBlack
              - PdfDocument_Color_SetColorSpaceStroke_DeviceNames_ResetsColorToBlack
              - PdfDocument_Color_SetColorFillUsingCurrentColorSpace_Sc_PaintsExpectedColor
              - PdfDocument_Color_SetColorStrokeUsingCurrentColorSpace_SC_PaintsExpectedColor
              - PdfDocument_Color_ScnWithPatternName_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Color_UnsupportedNamedColorSpace_ThrowsUnsupportedImageFeatureException
              - CanvasNetPdf_SystemIntegration_PdfRender_ColoredRectangleFill_PaintsExpectedRgbPixels

          - id: CanvasNetPdf-PdfDocument-FilterPipeline
            title: >-
              The PdfDocument class shall generalize stream decoding into an ordered /Filter/
              /DecodeParms pipeline, supporting FlateDecode and LZWDecode (each optionally
              followed by a PNG /Predictor 10-15 or TIFF /Predictor 2 predictor reversal) and
              ASCII85Decode/ASCIIHexDecode/RunLengthDecode (which never accept a predictor),
              while preserving the existing bare-FlateDecode behavior for cross-reference
              streams, object streams, and page /Contents; any other filter name shall throw
              UnsupportedImageFeatureException, and a malformed /Filter//DecodeParms shape or an
              unrecognized /Predictor value shall throw InvalidDataException.
            justification: |
              Image XObjects commonly use a PNG or TIFF predictor alongside FlateDecode or
              LZWDecode to improve compression; without predictor reversal, such an image would
              decode to incorrect pixel data rather than failing closed or decoding correctly,
              and every existing Phase 1/2 stream-decoding call site must continue to behave
              identically.
            tests:
              - PdfDocument_Images_FlateDecodePngPredictor_DecodesExpectedPixels
              - PdfDocument_Images_FlateDecodeTiffPredictor_DecodesExpectedPixels
              - PdfDocument_Images_LzwDecodePngPredictor_DecodesExpectedPixels
              - PdfDocument_Images_UnsupportedFilter_ThrowsUnsupportedImageFeatureException

          - id: CanvasNetPdf-PdfDocument-LzwDecodeFilter
            title: >-
              The PdfDocument class shall implement the PDF-variant LZWDecode filter per ISO
              32000-1/2 section 7.4.4: an initial 258-entry table (codes 0-255 literal, 256
              Clear, 257 EOD), MSB-first variable 9-12 bit code packing, code-width growth timing
              controlled by /DecodeParms /EarlyChange (default 1, one code early; 0, one code
              later), and mid-stream Clear-code table reinitialization; a missing EOD marker, an
              invalid or out-of-range code, or a truncated bit stream shall throw
              InvalidDataException rather than silently producing truncated or incorrect output.
            justification: |
              LZWDecode is a commonly produced PDF stream filter (content streams and image
              XObjects alike); an incorrect early-change interpretation, code-width growth
              timing, or truncation-tolerant decoder would silently corrupt decoded data rather
              than failing closed or decoding correctly, matching ISO 32000-1's own worked Table
              7/Example 2 vector.
            tests:
              - PdfDocument_Filters_LzwDecode_SpecExampleTable7_DecodesExpectedBytes
              - PdfDocument_Filters_LzwDecode_EarlyChangeDefault_GrowsCodeWidthOneCodeEarly
              - PdfDocument_Filters_LzwDecode_EarlyChangeZero_GrowsCodeWidthOneCodeLater
              - PdfDocument_Filters_LzwDecode_ClearCodeMidStream_ReinitializesTable
              - PdfDocument_Filters_LzwDecode_MissingEodCode_ThrowsInvalidDataException
              - PdfDocument_Filters_LzwDecode_InvalidCode_ThrowsInvalidDataException
              - PdfDocument_Images_DoOperator_DeviceGrayLzwDecode_PlacesExpectedPixels
              - CanvasNetPdf_SystemIntegration_PdfRender_LzwDecodeContentStream_PaintsExpectedPixels

          - id: CanvasNetPdf-PdfDocument-AsciiDecodeFilters
            title: >-
              The PdfDocument class shall implement the ASCII85Decode filter (base-85 groups of
              5 characters decoding to 4 bytes, the z shorthand for an all-zero 4-byte group at a
              group boundary only, the final-partial-group n+1-character padding rule, and the
              ~> EOD marker) and the ASCIIHexDecode filter (hex-digit pairs decoding to bytes,
              ignoring whitespace, the > EOD marker, and an odd trailing digit implicitly padded
              with a zero nibble) per ISO 32000-1/2 sections 7.4.2/7.4.3; an invalid character, a
              z occurring mid-group, an out-of-range 5-character group value, a final partial
              group of exactly one character, or a missing EOD marker shall throw
              InvalidDataException.
            justification: |
              ASCII85Decode and ASCIIHexDecode are the two ASCII-armoring filters PDF producers
              commonly layer over a binary compression filter (frequently LZWDecode); decoding
              either incorrectly would corrupt every stream layered beneath it, and malformed
              input must fail closed rather than silently decode to the wrong bytes.
            tests:
              - PdfDocument_Filters_Ascii85Decode_ZeroGroup_DecodesToFourZeroBytes
              - PdfDocument_Filters_Ascii85Decode_FullGroup_DecodesExpectedBytes
              - PdfDocument_Filters_Ascii85Decode_PartialFinalGroup_AppliesPaddingRule
              - PdfDocument_Filters_Ascii85Decode_WhitespaceIgnored_DecodesExpectedBytes
              - PdfDocument_Filters_Ascii85Decode_ZInMiddleOfGroup_ThrowsInvalidDataException
              - PdfDocument_Filters_Ascii85Decode_ValueExceedsRange_ThrowsInvalidDataException
              - PdfDocument_Filters_Ascii85Decode_MissingEodMarker_ThrowsInvalidDataException
              - PdfDocument_Filters_AsciiHexDecode_HexDigitPairs_DecodesExpectedBytes
              - PdfDocument_Filters_AsciiHexDecode_OddTrailingDigit_PadsWithZeroNibble
              - PdfDocument_Filters_AsciiHexDecode_WhitespaceIgnored_DecodesExpectedBytes
              - PdfDocument_Filters_AsciiHexDecode_InvalidCharacter_ThrowsInvalidDataException
              - PdfDocument_Filters_AsciiHexDecode_MissingEodMarker_ThrowsInvalidDataException
              - CanvasNetPdf_SystemIntegration_PdfRender_Ascii85DecodeContentStream_PaintsExpectedPixels
              - CanvasNetPdf_SystemIntegration_PdfRender_AsciiHexDecodeContentStream_PaintsExpectedPixels

          - id: CanvasNetPdf-PdfDocument-RunLengthDecodeFilter
            title: >-
              The PdfDocument class shall implement the RunLengthDecode filter per ISO 32000-1/2
              section 7.4.5: a length byte 0-127 copies the following length+1 bytes literally,
              a length byte 129-255 repeats the following single byte 257-length times, and a
              length byte of 128 denotes EOD; a run requiring more source bytes than remain shall
              throw InvalidDataException rather than silently producing truncated output.
            justification: |
              RunLengthDecode is a simple, commonly used filter for monochrome image data; a
              truncated or malformed run must fail closed, not silently decode to the wrong byte
              count.
            tests:
              - PdfDocument_Filters_RunLengthDecode_LiteralRun_CopiesBytesVerbatim
              - PdfDocument_Filters_RunLengthDecode_RepeatRun_RepeatsSingleByte
              - PdfDocument_Filters_RunLengthDecode_EodMarker_StopsDecoding
              - PdfDocument_Filters_RunLengthDecode_TruncatedRun_ThrowsInvalidDataException
              - CanvasNetPdf_SystemIntegration_PdfRender_RunLengthDecodeContentStream_PaintsExpectedPixels

          - id: CanvasNetPdf-PdfDocument-ImageXObjects
            title: >-
              The PdfDocument class shall implement the Do operator for a /Subtype /Image
              XObject, decoding a bare /Filter /DCTDecode image via Codecs.JpegCodec.Load or
              interpreting raw DeviceGray/DeviceRGB/DeviceCMYK 8-bit samples, and compositing the
              decoded image onto the destination surface through the current transformation
              matrix (nearest-neighbor sampling, treating every image as fully opaque); Do on a
              /Subtype /Form XObject, an unsupported /ColorSpace, or an unsupported
              /BitsPerComponent shall throw UnsupportedImageFeatureException rather than being
              silently skipped or mis-rendered, and a malformed operand count/type or an
              undeclared XObject name shall throw InvalidDataException.
            justification: |
              Image XObjects are a common, visually significant PDF content type; callers need
              them decoded and correctly positioned, and need every explicitly out-of-scope
              construct (Form XObjects, unsupported color spaces/bit depths) to fail closed with a
              distinguishable exception rather than being silently skipped or mis-rendered.
            tests:
              - PdfDocument_Images_DoOperator_DeviceGrayFlateDecode_PlacesExpectedPixels
              - PdfDocument_Images_DoOperator_DeviceRgbFlateDecode_PlacesExpectedPixels
              - PdfDocument_Images_DoOperator_DeviceCmykFlateDecode_PlacesExpectedPixels
              - PdfDocument_Images_DoOperator_DctDecodeJpeg_PlacesExpectedPixels
              - PdfDocument_Images_UnsupportedBitsPerComponent_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Images_UnsupportedColorSpace_ThrowsUnsupportedImageFeatureException

          - id: CanvasNetPdf-PdfDocument-FontResolution
            title: >-
              The PdfDocument class shall resolve a /Resources/Font entry naming a /Subtype
              /TrueType simple font with an embedded /FontDescriptor/FontFile2 stream, loading it
              via Fonts.TrueTypeFont.Load, and caching the resolved font by font-dictionary object
              identity for the duration of a single Render call; a font whose /Subtype is
              /Type1, /MMType1, or /Type3 shall throw UnsupportedImageFeatureException, a
              /Subtype /TrueType font lacking an embedded /FontFile2 shall instead be resolved via
              system/bundled font-fallback substitution (see CanvasNetPdf-PdfDocument-FontFallback),
              a /Subtype /Type0 composite font shall instead be resolved via
              CanvasNetPdf-PdfDocument-CompositeFontResolution, and a Tf operator naming a font
              absent from /Resources/Font shall throw InvalidDataException.
            justification: |
              Type 1/CFF fonts and Type 3 fonts remain explicitly out of this phase's scope and
              must fail closed with a distinguishable exception; a non-embedded /Subtype
              /TrueType simple font, however, is common enough in real-world PDFs (referencing a
              standard-14 name, or an installed system font, without embedding it) that silently
              refusing to render it is a worse outcome than a best-effort visual substitute, and
              repeatedly selecting the same font resource within one render must not repeatedly
              re-decode its embedded font bytes.
            tests:
              - PdfDocument_Fonts_UnsupportedSubtype_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Fonts_UndefinedFontName_ThrowsInvalidDataException
              - PdfDocument_BuildResolvedFont_EmbeddedFontFileTakesPriorityOverFallback

          - id: CanvasNetPdf-PdfDocument-CompositeFontResolution
            title: >-
              The PdfDocument class shall resolve a /Resources/Font entry naming a /Subtype
              /Type0 composite font whose /Encoding is the name /Identity-H and whose
              /DescendantFonts is a single-element array naming a /Subtype /CIDFontType2
              descendant font with an embedded /FontDescriptor/FontFile2 stream: decoding each
              shown 2-byte code directly as a CID, mapping it to a glyph index via the
              descendant's /CIDToGIDMap (the identity map when absent or the name /Identity, or
              an explicit big-endian uint16-per-CID lookup table for a stream, with an
              out-of-range CID mapping to glyph 0/.notdef), and resolving its advance width from
              the descendant's /DW (defaulting to 1000) and /W (supporting both the
              "c [w1 w2 ... wn]" individual-width sub-form and the "cFirst cLast w" range
              sub-form) entries; any other /Encoding (including /Identity-V and predefined CJK
              encodings) or descendant /Subtype (including /CIDFontType0) shall throw
              UnsupportedImageFeatureException, and a missing/malformed /DescendantFonts,
              /CIDToGIDMap, /W array, missing/non-embedded descendant /FontFile2, or an odd-byte-
              length shown string shall throw InvalidDataException.
            justification: |
              Type0/Identity-H/CIDFontType2 composite fonts are the encoding real-world PDF
              producers (Microsoft Word, LibreOffice, and browser print-to-PDF among them)
              overwhelmingly emit for embedded subsetted TrueType text, so continuing to reject
              every /Type0 font unconditionally is a significant real-world compatibility gap;
              /CIDFontType0 (CFF-flavored) descendant fonts, vertical writing (/Identity-V),
              predefined CJK encodings, and custom CMap-based /Encoding streams remain explicitly
              out of this phase's scope and must fail closed with a distinguishable exception
              rather than being silently mis-rendered, and a composite font with no embedded
              descendant font has no fallback substitution path (unlike a simple TrueType font -
              see CanvasNetPdf-PdfDocument-FontFallback), so it must fail closed too.
            tests:
              - PdfDocument_Fonts_Type0_IdentityHCidFontType2_ResolvesEmbeddedFont
              - PdfDocument_Fonts_Type0_CidToGidMapIdentity_UsesCidAsGid
              - PdfDocument_Fonts_Type0_CidToGidMapStream_RemapsCidToGid
              - PdfDocument_Fonts_Type0_CidToGidMapStream_OutOfRangeCid_MapsToNotdef
              - PdfDocument_Fonts_Type0_NonIdentityHEncoding_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Fonts_Type0_CidFontType0Subtype_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Fonts_Type0_MissingDescendantFonts_ThrowsInvalidDataException
              - PdfDocument_Fonts_Type0_DescendantFontsNotSingleElement_ThrowsInvalidDataException
              - PdfDocument_Fonts_Type0_NoEmbeddedFontFile_ThrowsInvalidDataException
              - PdfDocument_Fonts_Type0_Widths_DwDefault1000_DeterminesAdvance
              - PdfDocument_Fonts_Type0_Widths_WArrayIndividualForm_DeterminesAdvance
              - PdfDocument_Fonts_Type0_Widths_WArrayRangeForm_DeterminesAdvance
              - PdfDocument_Fonts_Type0_Widths_MalformedWArray_ThrowsInvalidDataException
              - PdfDocument_ShowText_Type0_OddByteLengthString_ThrowsInvalidDataException
              - PdfDocument_ShowText_Type0_TwoByteCodes_ShowsEachGlyphAtCorrectPosition
              - CanvasNetPdf_SystemIntegration_RenderType0CompositeFont_PaintsExpectedGlyphInk

          - id: CanvasNetPdf-PdfDocument-FontFallback
            title: >-
              The PdfDocument class shall, for a /Subtype /TrueType simple font lacking an
              embedded /FontDescriptor/FontFile2 stream, resolve a substitute font by mapping a
              recognized Standard-14 /BaseFont name to its documented serif/fixed-pitch/bold/
              italic flavor, or else deriving that flavor from /FontDescriptor/Flags and
              /FontWeight/ItalicAngle, matching that flavor and the (subset-tag- and style-
              suffix-stripped) family name against Fonts.SystemFontCatalog.FindBestMatch and, if
              no system font matches, against Fonts.SystemFontCatalog.LoadBundledFallback; a
              /BaseFont of Symbol or ZapfDingbats, or any font whose /FontDescriptor/Flags marks
              it Symbolic without also marking it Nonsymbolic, shall throw
              UnsupportedImageFeatureException rather than being substituted, and every resolved
              fallback TrueTypeFont instance shall be cached by (file path, face index) for the
              process lifetime.
            justification: |
              A symbol/dingbats font's glyphs are not addressed by any standard Latin-text
              encoding, so silently substituting an unrelated text font for one would render
              wrong, misleading glyph shapes rather than failing visibly; every other non-embedded
              simple font, by contrast, can be reasonably approximated by a same-flavor
              substitute, and resolving a fallback font requires directory-scanning and parsing
              real font files, which must not be repeated for every occurrence of the same
              substitute font within or across renders.
            tests:
              - PdfDocument_BuildResolvedFont_Standard14NoEmbeddedFont_ResolvesViaFallback
              - PdfDocument_BuildResolvedFont_NonStandard14FlagsOnlyUnmatchedFamily_ResolvesViaBundledFallback
              - PdfDocument_BuildResolvedFont_SymbolFont_ThrowsSymbolicNotEmbeddedException
              - PdfDocument_BuildResolvedFont_ZapfDingbatsFont_ThrowsSymbolicNotEmbeddedException
              - PdfDocument_BuildResolvedFont_SymbolicFlagWithoutEmbeddedFont_ThrowsSymbolicNotEmbeddedException
              - CanvasNetPdf_SystemIntegration_RenderStandard14HelveticaWithoutEmbeddedFont_PaintsVisibleGlyphInk
              - CanvasNetPdf_SystemIntegration_RenderSymbolFontWithoutEmbeddedFont_ThrowsUnsupportedImageFeatureException

          - id: CanvasNetPdf-PdfDocument-FontEncoding
            title: >-
              The PdfDocument class shall resolve a font dictionary's /Encoding into a full
              256-entry code-to-Unicode-codepoint map, defaulting to /WinAnsiEncoding when
              /Encoding is absent, supporting /WinAnsiEncoding and /MacRomanEncoding as named
              base encodings (throwing UnsupportedImageFeatureException for any other base
              encoding name), and applying an /Encoding/Differences array's code-then-glyph-name
              run-length overrides via a standard Adobe-glyph-name-to-Unicode-codepoint mapping,
              throwing InvalidDataException for an unrecognized glyph name or for /Differences
              beginning with a glyph name before any starting code.
            justification: |
              WinAnsi and MacRoman are the two base encodings a simple TrueType font's /Encoding
              commonly names, and /Differences overrides are the standard mechanism a PDF
              producer uses to remap individual codes to nonstandard glyphs; every one of these
              must resolve to the correct Unicode codepoint for painted text to match the
              document's intent, and any other base encoding or unrecognized glyph name must fail
              closed rather than be silently mis-mapped.
            tests:
              - PdfDocument_Fonts_UnrecognizedEncoding_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Fonts_DefaultEncoding_IsWinAnsiEncoding
              - PdfDocument_Fonts_MacRomanEncoding_DiffersFromWinAnsiEncoding
              - PdfDocument_Fonts_Differences_OverridesBaseEncodingCode
              - PdfDocument_Fonts_Differences_Absent_LeavesBaseEncodingCodeUnmapped
              - PdfDocument_Fonts_Differences_UnrecognizedGlyphName_ThrowsInvalidDataException
              - PdfDocument_Fonts_Differences_NameBeforeStartingCode_ThrowsInvalidDataException

          - id: CanvasNetPdf-PdfDocument-FontWidths
            title: >-
              The PdfDocument class shall resolve each shown code's advance width with a
              documented priority: an explicit /FirstChar-/Widths array entry for that code
              first, else the font descriptor's /MissingWidth, else (when the font declares
              neither) the embedded font's own GetAdvanceWidth/UnitsPerEm metric.
            justification: |
              A PDF producer may declare per-glyph widths explicitly, fall back to a single
              /MissingWidth default, or omit width information entirely and expect the font's own
              metrics to be used; painted text must advance by the mathematically correct amount
              in every case for subsequent glyphs (and any caller measuring text) to land in the
              correct position. The same declared/default-width priority also applies to
              composite fonts, using the shown code's CID as the lookup key and /DW as the
              default width instead of /MissingWidth - see
              CanvasNetPdf-PdfDocument-CompositeFontResolution for its own dedicated width tests.
            tests:
              - PdfDocument_Fonts_Widths_ExplicitEntry_DeterminesAdvance
              - PdfDocument_Fonts_Widths_MissingWidthFallback_DeterminesAdvance
              - PdfDocument_Fonts_Widths_FontOwnAdvanceFallback_DeterminesAdvance

          - id: CanvasNetPdf-PdfDocument-TextObjectState
            title: >-
              The PdfDocument class shall implement BT/ET, resetting only the text matrix (Tm)
              and line matrix (Tlm) to identity while leaving every other text-state parameter
              (font, size, character/word spacing, horizontal scaling, leading, render mode, text
              rise) unaffected as part of the persistent graphics state, so that state is saved
              and restored by q/Q exactly like every other graphics-state parameter.
            justification: |
              The PDF specification defines Tm/Tlm as local to a text object while every other
              text parameter persists as ordinary graphics state; painting a second text object
              in the same content stream must not silently lose the first text object's font,
              size, or other text-state configuration, and a q/Q pair must save/restore text
              state exactly like line width or color.
            tests:
              - PdfDocument_Text_BeginText_ResetsTextMatrixButPreservesFontAndTextState
              - PdfDocument_Text_PushPopGraphicsState_RestoresFontSize

          - id: CanvasNetPdf-PdfDocument-TextStateOperators
            title: >-
              The PdfDocument class shall implement the Tc, Tw, Tz, TL, and Ts text-state
              operators, storing character spacing, word spacing (applied only to the
              single-byte code 32 of a simple font, never to any code decoded from a composite
              font even one numerically equal to 32), horizontal scaling percentage, leading, and
              text rise respectively, each affecting subsequent glyph placement/advance as
              documented by the PDF specification.
            justification: |
              These parameters directly control inter-character spacing, word spacing, horizontal
              stretch, line-to-line displacement, and vertical baseline offset; each must be
              applied with the specification's own exact formula for painted text layout to match
              the document's intent. Word spacing in particular must be gated on the selected
              font's code-byte-width, not just the decoded code's numeric value, since a
              composite /Identity-H font's 2-byte code can numerically equal 32 without being the
              single-byte space code the specification's word-spacing rule addresses.
            tests:
              - PdfDocument_Text_Tc_AddsToGlyphAdvance
              - PdfDocument_Text_Tw_AppliesOnlyToCode32
              - PdfDocument_Text_Tz_ScalesHorizontalShapeAndAdvance
              - PdfDocument_ShowText_Type0_WordSpacingCode32_IsNotAppliedToCompositeFont

          - id: CanvasNetPdf-PdfDocument-Tf
            title: >-
              The PdfDocument class shall implement the Tf operator (a font resource name then a
              size), resolving the named font resource via font resolution and storing it
              alongside the requested size as the currently selected font for subsequent
              text-showing operators.
            justification: |
              Tf is the sole mechanism a content stream uses to select which embedded font and
              size subsequent glyphs are painted with; it must correctly resolve the named
              resource and reject an undeclared name.
            tests:
              - PdfDocument_Text_ShowText_PaintsGlyphAtComposedTextRenderingMatrix

          - id: CanvasNetPdf-PdfDocument-Tr
            title: >-
              The PdfDocument class shall implement the Tr (text-rendering mode) operator,
              supporting mode 0 (fill, the default) and mode 3 (invisible - glyphs still advance
              the text position but are not painted), throwing UnsupportedImageFeatureException
              for stroke/clip modes 1, 2, and 4-7, and InvalidDataException for any other numeric
              value.
            justification: |
              Stroke and clip text-rendering modes are explicitly out of this phase's scope; a
              content stream requesting one must fail closed rather than being silently
              mis-rendered as a fill, while invisible text (commonly used for an OCR text layer
              beneath a scanned image) must still correctly advance the text position without
              painting any ink.
            tests:
              - PdfDocument_Text_RenderMode3_Invisible_DoesNotPaintGlyph
              - PdfDocument_Text_RenderMode3_Invisible_StillAdvancesTextPosition
              - PdfDocument_Text_RenderMode_UnsupportedDefinedMode_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Text_RenderMode_OutOfDefinedRange_ThrowsInvalidDataException

          - id: CanvasNetPdf-PdfDocument-TextPositioning
            title: >-
              The PdfDocument class shall implement the Td, TD, Tm, and T* text-positioning
              operators, per the PDF specification's line-matrix-relative displacement (Td/TD, TD
              additionally setting leading to -ty) versus direct-replacement (Tm) semantics, with
              T* equivalent to "0 -TL Td".
            justification: |
              Correct line/paragraph layout depends entirely on these operators composing the
              text and line matrices exactly per specification; an incorrect composition would
              silently misplace every subsequent line of text.
            tests:
              - PdfDocument_Text_Td_OffsetsLineMatrixNotLastTextMatrix
              - PdfDocument_Text_TD_SetsLeadingToNegativeTy
              - PdfDocument_Text_Tm_ReplacesTextAndLineMatrix
              - PdfDocument_Text_TStar_UsesCurrentLeading

          - id: CanvasNetPdf-PdfDocument-TextShowing
            title: >-
              The PdfDocument class shall implement the Tj, ' (quote), " (double-quote), and TJ
              text-showing operators - Tj shows a string as-is; ' performs T* then Tj; " sets Tw
              and Tc then performs ' ; and TJ shows an array of strings interleaved with
              thousandths-of-text-space position adjustments applied between glyphs - painting
              each resolved glyph's outline via the composed text-rendering matrix and
              Drawing.PathFiller.Fill with the current fill color (mode 0) or skipping painting
              entirely (mode 3), and advancing the text matrix by each glyph's resolved width.
            justification: |
              These are the operators that actually place visible ink on the page; each must
              resolve every shown byte through the selected font's encoding, paint the correct
              glyph outline at the correct position, and advance by the mathematically correct
              amount, including TJ's per-adjustment position correction.
            tests:
              - PdfDocument_Text_ShowText_PaintsGlyphAtComposedTextRenderingMatrix
              - PdfDocument_Text_TJ_AppliesPositionAdjustments
              - PdfDocument_Text_TJ_ArrayEntryNotStringOrNumber_ThrowsInvalidDataException
              - PdfDocument_Text_QuoteOperator_MovesToNextLineThenShows
              - PdfDocument_Text_DoubleQuoteOperator_SetsSpacingThenMovesAndShows
              - CanvasNetPdf_SystemIntegration_PdfRender_EmbeddedTrueTypeFontText_PaintsGlyphStrokesNotCounters

          - id: CanvasNetPdf-PdfDocument-TextErrorHandling
            title: >-
              The PdfDocument class shall throw InvalidDataException for a text-showing operator
              (Tj/'/"/TJ) invoked with no font currently selected, or for a malformed operand
              count/type for any text operator.
            justification: |
              A content stream that attempts to show text before any Tf call, or that supplies a
              malformed operand list to a text operator, is malformed input and must be rejected
              explicitly rather than silently ignored or causing an unhandled internal exception.
            tests:
              - PdfDocument_Text_ShowText_NoFontSelected_ThrowsInvalidDataException
              - PdfDocument_Text_MalformedOperandCount_ThrowsInvalidDataException
              - PdfDocument_Images_DoOperator_UndefinedXObjectName_ThrowsInvalidDataException
              - PdfDocument_Images_DoOperator_FormXObject_ThrowsUnsupportedImageFeatureException
              - PdfDocument_Images_DoOperator_MalformedOperandCount_ThrowsInvalidDataException
              - CanvasNetPdf_SystemIntegration_PdfRender_ImageXObjectPlacement_CompositesExpectedPixels
