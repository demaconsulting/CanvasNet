---
# Software System Requirements for CanvasNet
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.
# cspell:ignore glyf sfnt cmap loca hmtx hhea maxp notdef
# cspell:ignore codepoint codepoints subtable subtables subsetted renderable formedness
# cspell:ignore rasterizing letterboxing

sections:
  - title: Canvas API
    requirements:
      - id: CanvasNet-Lib-CanvasConstruction
        title: >-
          The library shall allow constructing a 2D RGBA pixel buffer with a given width and
          height, initialized fully transparent.
        tags: [system]
        justification: |
          A pixel buffer is the foundational primitive for any drawing, rendering, or codec
          functionality the library will provide; callers need a predictable, ready-to-use
          starting state.
        children:
          - CanvasNet-Canvas-Construction
          - CanvasNet-Canvas-ZeroInitialized
          - CanvasNet-Canvas-InvalidWidth
          - CanvasNet-Canvas-InvalidHeight
          - CanvasNet-Canvas-WidthExceedsMaximum
          - CanvasNet-Canvas-HeightExceedsMaximum
        tests:
          - CanvasNet_SystemIntegration_CanvasConstructAndSetPixel_ReturnsExpectedPixel

      - id: CanvasNet-Lib-CanvasPixelAccess
        title: The library shall provide get and set access to individual pixels in 32-bit RGBA format.
        tags: [system]
        justification: |
          Callers need a simple, direct way to inspect or modify a single pixel without working
          with raw byte offsets.
        children:
          - CanvasNet-Canvas-PixelGet
          - CanvasNet-Canvas-PixelSet
        tests:
          - CanvasNet_SystemIntegration_CanvasConstructAndSetPixel_ReturnsExpectedPixel

      - id: CanvasNet-Lib-CanvasSpanAccess
        title: >-
          The library shall provide allocation-free Span-based access to pixel rows, both as raw
          bytes and as RGBA pixels.
        tags: [system]
        justification: |
          High-performance pixel processing (for example future drawing primitives or codecs)
          requires bulk, allocation-free access to whole rows rather than repeated single-pixel
          calls.
        children:
          - CanvasNet-Canvas-RowSpanBytes
          - CanvasNet-Canvas-RowSpanPixels
        tests:
          - CanvasNet_SystemIntegration_CanvasConstructAndSetPixel_ReturnsExpectedPixel

      - id: CanvasNet-Lib-CanvasCrop
        title: The library shall allow extracting an independent copy of a rectangular sub-region of a pixel buffer.
        tags: [system]
        justification: |
          Callers frequently need to isolate and work with a portion of a larger surface (for
          example a sprite or tile) as its own independent buffer.
        children:
          - CanvasNet-Canvas-Crop
          - CanvasNet-Canvas-CropIndependent
        tests:
          - CanvasNet_SystemIntegration_CanvasCrop_ReturnsIndependentSubRegion

      - id: CanvasNet-Lib-CanvasCropValidation
        title: The library shall reject invalid crop parameters with ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          Invalid crop parameters (negative coordinates, non-positive sizes, or regions exceeding
          the source bounds) cannot describe a valid sub-region and must be rejected immediately
          to prevent out-of-bounds reads.
        children:
          - CanvasNet-Canvas-CropInvalidX
          - CanvasNet-Canvas-CropInvalidY
          - CanvasNet-Canvas-CropInvalidWidth
          - CanvasNet-Canvas-CropInvalidHeight
          - CanvasNet-Canvas-CropExceedsWidth
          - CanvasNet-Canvas-CropExceedsHeight
        tests:
          - CanvasNet_SystemIntegration_CanvasCrop_ReturnsIndependentSubRegion

      - id: CanvasNet-Lib-CanvasPremultiply
        title: >-
          The library shall convert a pixel buffer, in place, between straight (unassociated) and
          premultiplied alpha representations.
        tags: [system]
        justification: |
          Premultiplied alpha is required for numerically correct alpha compositing; callers
          performing custom pixel math need to convert an in-memory buffer between the two
          representations.
        children:
          - CanvasNet-Canvas-PremultiplyAlpha
          - CanvasNet-Canvas-UnpremultiplyAlpha
        tests:
          - CanvasNet_SystemIntegration_PremultiplyAlpha_ReturnsExpectedPixel
          - CanvasNet_SystemIntegration_UnpremultiplyAlpha_ReturnsExpectedPixel

      - id: CanvasNet-Lib-CanvasComposite
        title: >-
          The library shall composite a pixel buffer, or a constant color, "over" a pixel buffer
          in place, using standard Porter-Duff "over" alpha compositing.
        tags: [system]
        justification: |
          Alpha compositing (layering a semi-transparent overlay onto a background, or tinting a
          buffer with a constant color) is a fundamental raster-graphics operation callers need
          without hand-rolling the per-pixel math themselves.
        children:
          - CanvasNet-Canvas-CompositeOverSurface
          - CanvasNet-Canvas-CompositeOverColor
          - CanvasNet-Canvas-CompositeOverSpan
          - CanvasNet-Canvas-CompositeOverSpanPerPixelColor
        tests:
          - CanvasNet_SystemIntegration_CompositeColorOverSurface_ReturnsExpectedPixel
          - CanvasNet_SystemIntegration_CompositeSurfaceOverSurface_ReturnsExpectedPixel

      - id: CanvasNet-Lib-CanvasCompositeValidation
        title: >-
          The library shall reject an invalid CompositeOver(Surface) call, or an invalid
          CompositeOverSpan call, with ArgumentNullException or ArgumentException.
        tags: [system]
        justification: |
          A null foreground, or a foreground whose dimensions do not match the target buffer,
          cannot be composited via CompositeOver(Surface); and a CompositeOverSpan call whose row
          (y) falls outside the buffer's height, or whose starting column (x) combined with the
          coverage span's length would extend past the buffer's width, cannot be composited
          either. Rejecting these immediately prevents an out-of-bounds or otherwise ill-defined
          operation.
        children:
          - CanvasNet-Canvas-CompositeOverSurfaceNull
          - CanvasNet-Canvas-CompositeOverSurfaceDimensionMismatch
          - CanvasNet-Canvas-CompositeOverSpanValidation
        tests:
          - Surface_CompositeOverSurface_NullForeground_ThrowsArgumentNullException
          - Surface_CompositeOverSurface_WidthMismatch_ThrowsArgumentException
          - Surface_CompositeOverSurface_HeightMismatch_ThrowsArgumentException

      - id: CanvasNet-Lib-CanvasClear
        title: >-
          The library shall fill every pixel of a pixel buffer, or of a Canvas's wrapped buffer,
          with a constant color in place, overwriting rather than blending against existing pixel
          data.
        tags: [system]
        justification: |
          Establishing a solid background fill before drawing is a common operation that should
          be a single vectorized bulk fill rather than a per-pixel loop or a misuse of
          CompositeOver's blend formula, which would incorrectly blend rather than overwrite when
          the buffer already holds non-matching pixel data.
        children:
          - CanvasNet-Canvas-Clear
          - CanvasNet-Rendering-Clear
        tests:
          - CanvasNet_SystemIntegration_ClearSurfaceThenReadPixel_ReturnsExpectedColor
          - CanvasNet_SystemIntegration_CanvasClearThenReadWrappedSurfacePixel_ReturnsExpectedColor

      - id: CanvasNet-Lib-CanvasMaxDimensionPublic
        title: >-
          The library shall expose the maximum permitted pixel-buffer dimension as a public
          constant (Surface.MaxDimension).
        tags: [system]
        justification: |
          Callers probing untrusted or unknown-source image headers (via each codec's GetInfo) need
          to compare the reported dimensions against the same maximum dimension the library itself
          enforces, before ever allocating a pixel buffer; a public constant removes the need to
          hard-code or guess this value.
        children:
          - CanvasNet-Canvas-MaxDimensionPublic
        tests:
          - Surface_MaxDimension_IsPubliclyAccessible_Equals8192

      - id: CanvasNet-Lib-CanvasRgba32ParseHex
        title: >-
          The library shall parse an Rgba32 pixel value from a "#RRGGBB" or "#AARRGGBB" hex
          color literal string, case-insensitively, via both a throwing Parse method and a
          non-throwing TryParse method.
        tags: [system]
        justification: |
          Callers commonly author colors as web-style hex string literals (for example from
          configuration or markup); parsing them directly into Rgba32 avoids callers
          hand-decoding hex digits themselves.
        children:
          - CanvasNet-Canvas-Rgba32
        tests:
          - CanvasNet_SystemIntegration_ParseHexColorAndSetSurfacePixel_ReturnsExpectedPixel

  - title: BMP Codec API
    requirements:
      - id: CanvasNet-Lib-BmpSave
        title: >-
          The library shall save a Surface as an uncompressed 24-bit or 32-bit BMP file, to either
          a stream or a file path.
        tags: [system]
        justification: |
          Callers need to persist rendered or loaded pixel data in a widely supported,
          uncompressed image format for interchange with other tools.
        children:
          - CanvasNet-Codecs-BmpSave
        tests:
          - CanvasNet_SystemIntegration_BmpSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-BmpLoad
        title: >-
          The library shall load a Surface from an uncompressed 24-bit or 32-bit BMP file, from
          either a stream or a file path.
        tags: [system]
        justification: |
          Callers need to import existing BMP images as pixel buffers for further processing or
          display.
        children:
          - CanvasNet-Codecs-BmpLoad
        tests:
          - CanvasNet_SystemIntegration_BmpSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-BmpValidationNull
        title: >-
          The library shall reject null Surface, stream, or path arguments to BMP save and load
          operations with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to any BMP save or load operation is a programming error. Throwing
          ArgumentNullException immediately surfaces the mistake and prevents obscure failures
          deeper in the call stack.
        children:
          - CanvasNet-Codecs-BmpValidationNull
        tests:
          - BmpCodec_Save_NullCanvas_ThrowsArgumentNullException
          - BmpCodec_Save_NullStream_ThrowsArgumentNullException
          - BmpCodec_Save_NullPath_ThrowsArgumentNullException
          - BmpCodec_Load_NullStream_ThrowsArgumentNullException
          - BmpCodec_Load_NullPath_ThrowsArgumentNullException

      - id: CanvasNet-Lib-BmpValidationEmptyPath
        title: >-
          The library shall reject an empty path argument to BMP save and load operations with
          ArgumentException.
        tags: [system]
        justification: |
          Passing an empty path to any BMP save or load operation is a programming error. Throwing
          ArgumentException immediately surfaces the mistake and prevents an obscure file-system
          error.
        children:
          - CanvasNet-Codecs-BmpValidationEmptyPath
        tests:
          - BmpCodec_Save_EmptyPath_ThrowsArgumentException
          - BmpCodec_Load_EmptyPath_ThrowsArgumentException

      - id: CanvasNet-Lib-BmpValidationBitDepth
        title: The library shall reject an undefined bit depth argument to BMP save with ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          An undefined bit depth cannot be encoded to a valid BMP file; rejecting it immediately
          prevents a malformed file from being written.
        children:
          - CanvasNet-Codecs-BmpValidationBitDepth
        tests:
          - BmpCodec_Save_UndefinedBitDepth_ThrowsArgumentOutOfRangeException

      - id: CanvasNet-Lib-BmpUnsupportedFormatValidation
        title: >-
          The library shall reject malformed or unsupported BMP data (bad signature, unsupported
          header size, unsupported compression, unsupported bit depth, top-down orientation, or a
          truncated stream) with InvalidDataException.
        tags: [system]
        justification: |
          Callers must be able to distinguish a genuinely malformed or unsupported BMP file from a
          successful load, and receive a clear, actionable error rather than incorrect pixel data.
        children:
          - CanvasNet-Codecs-BmpUnsupportedFormatValidation
        tests:
          - BmpCodec_Load_BadSignature_ThrowsInvalidDataException
          - BmpCodec_Load_Bitmapcoreheader12Bytes_ThrowsInvalidDataException
          - BmpCodec_Load_UnsupportedHeaderSizeV4_ThrowsInvalidDataException
          - BmpCodec_Load_RleCompression_ThrowsInvalidDataException
          - BmpCodec_Load_8BitPaletteDepth_ThrowsInvalidDataException
          - BmpCodec_Load_TopDownNegativeHeight_ThrowsInvalidDataException
          - BmpCodec_Load_TruncatedStream_ThrowsInvalidDataException

      - id: CanvasNet-Lib-BmpGetInfo
        title: >-
          The library shall report a BMP's width, height, channel count, and alpha presence via
          GetInfo, given a stream or a file path, without decoding pixel data and without
          enforcing the maximum permitted dimension.
        tags: [system]
        justification: |
          Callers need to inspect a BMP's declared dimensions and channel layout - for example to
          reject unreasonably large images before allocating a Surface - without paying the cost
          of decoding the full pixel buffer.
        children:
          - CanvasNet-Codecs-BmpGetInfo
        tests:
          - BmpCodec_GetInfo_24Bit_ReturnsExpectedInfoWithoutAlpha
          - BmpCodec_GetInfo_32Bit_ReturnsExpectedInfoWithAlpha
          - BmpCodec_GetInfo_NeverReadsPixelData
          - BmpCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows

      - id: CanvasNet-Lib-BmpGetInfoValidation
        title: >-
          The library shall reject invalid arguments or malformed BMP data passed to GetInfo with
          the same exception contract as Load.
        tags: [system]
        justification: |
          Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
        children:
          - CanvasNet-Codecs-BmpGetInfoValidation
        tests:
          - BmpCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - BmpCodec_GetInfo_NullPath_ThrowsArgumentNullException
          - BmpCodec_GetInfo_EmptyPath_ThrowsArgumentException
          - BmpCodec_GetInfo_BadSignature_ThrowsInvalidDataException

  - title: PNG Codec API
    requirements:
      - id: CanvasNet-Lib-PngSave
        title: >-
          The library shall save a Surface as an 8-bit-per-channel Truecolor (RGB) or
          Truecolor-with-alpha (RGBA) PNG file, to either a stream or a file path.
        tags: [system]
        justification: |
          Callers need to persist rendered or loaded pixel data in the widely supported PNG
          format for interchange with other tools.
        children:
          - CanvasNet-Codecs-PngSave
        tests:
          - CanvasNet_SystemIntegration_PngSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-PngLoad
        title: >-
          The library shall load a Surface from a non-interlaced PNG file, from either a stream or
          a file path, for every color type and bit depth combination the PNG specification
          defines, honoring the file's transparency chunk where the specification defines one.
        tags: [system]
        justification: |
          Callers need to import existing PNG images as pixel buffers for further processing or
          display, across the full range of color types and bit depths PNG-producing tools may
          emit, not only truecolor images.
        children:
          - CanvasNet-Codecs-PngLoad
        tests:
          - CanvasNet_SystemIntegration_PngSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-PngValidationNull
        title: >-
          The library shall reject null Surface, stream, or path arguments to PNG save and load
          operations with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to any PNG save or load operation is a programming error. Throwing
          ArgumentNullException immediately surfaces the mistake and prevents obscure failures
          deeper in the call stack.
        children:
          - CanvasNet-Codecs-PngValidationNull
        tests:
          - PngCodec_Save_NullCanvas_ThrowsArgumentNullException
          - PngCodec_Save_NullStream_ThrowsArgumentNullException
          - PngCodec_Save_NullPath_ThrowsArgumentNullException
          - PngCodec_Load_NullStream_ThrowsArgumentNullException
          - PngCodec_Load_NullPath_ThrowsArgumentNullException

      - id: CanvasNet-Lib-PngValidationEmptyPath
        title: >-
          The library shall reject an empty path argument to PNG save and load operations with
          ArgumentException.
        tags: [system]
        justification: |
          Passing an empty path to any PNG save or load operation is a programming error. Throwing
          ArgumentException immediately surfaces the mistake and prevents an obscure file-system
          error.
        children:
          - CanvasNet-Codecs-PngValidationEmptyPath
        tests:
          - PngCodec_Save_EmptyPath_ThrowsArgumentException
          - PngCodec_Load_EmptyPath_ThrowsArgumentException

      - id: CanvasNet-Lib-PngValidationColorType
        title: >-
          The library shall reject an undefined color type argument to PNG save with
          ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          An undefined color type cannot be encoded to a valid PNG file; rejecting it immediately
          prevents a malformed file from being written.
        children:
          - CanvasNet-Codecs-PngValidationColorType
        tests:
          - PngCodec_Save_UndefinedColorType_ThrowsArgumentOutOfRangeException

      - id: CanvasNet-Lib-PngUnsupportedFormatValidation
        title: >-
          The library shall reject malformed PNG data (bad signature, an invalid bit depth or
          color type, a bit-depth/color-type combination the PNG specification does not define,
          corrupt chunk CRC-32, corrupt Adler-32 checksum, or a truncated stream), and
          Adam7-interlaced PNG data, with InvalidDataException.
        tags: [system]
        justification: |
          Callers must be able to distinguish a genuinely malformed PNG file, or one using Adam7
          interlacing (the only PNG feature this library's Load does not decode), from a
          successful load, and receive a clear, actionable error rather than incorrect pixel data.
        children:
          - CanvasNet-Codecs-PngUnsupportedFormatValidation
        tests:
          - PngCodec_Load_BadSignature_ThrowsInvalidDataException
          - PngCodec_Load_InvalidBitDepthColorTypeCombination_ThrowsInvalidDataException
          - PngCodec_Load_UnsupportedInterlaceAdam7_ThrowsInvalidDataException
          - PngCodec_Load_CorruptChunkCrc_ThrowsInvalidDataException
          - PngCodec_Load_CorruptAdlerTrailer_ThrowsInvalidDataException
          - PngCodec_Load_TruncatedStream_ThrowsInvalidDataException

      - id: CanvasNet-Lib-PngGetInfo
        title: >-
          The library shall report a PNG's width, height, channel count, and alpha presence via
          GetInfo, given a stream or a file path, by reading only the signature and IHDR chunk,
          without decoding IDAT pixel data and without enforcing the maximum permitted dimension.
        tags: [system]
        justification: |
          Callers need to inspect a PNG's declared dimensions and color type - for example to
          reject unreasonably large images before allocating a Surface - without paying the cost
          of inflating and decoding the full pixel buffer.
        children:
          - CanvasNet-Codecs-PngGetInfo
        tests:
          - PngCodec_GetInfo_Rgb_ReturnsExpectedInfoWithoutAlpha
          - PngCodec_GetInfo_Rgba_ReturnsExpectedInfoWithAlpha
          - PngCodec_GetInfo_NeverReadsPastIhdr
          - PngCodec_GetInfo_SucceedsWithCorruptIdatRegion_ButLoadThrows
          - PngCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows

      - id: CanvasNet-Lib-PngGetInfoAnyDecodability
        title: >-
          The library shall report a PNG's width and height via GetInfo for every file whose IHDR
          chunk is well-formed, regardless of whether Load can decode that file's color type, bit
          depth, or interlacing.
        tags: [system]
        justification: |
          Probing a file's declared size before deciding whether to invoke Load is exactly the
          operation that matters most for large or unfamiliar-format images; requiring
          decodability first would defeat that purpose.
        children:
          - CanvasNet-Codecs-PngGetInfoAnyDecodability
        tests:
          - PngCodec_GetInfo_SubByteGrayscaleBitDepth_ReturnsCorrectDimensions
          - PngCodec_GetInfo_BitDepth16_ReturnsCorrectDimensions
          - PngCodec_GetInfoAndLoad_InvalidBitDepth_BothThrowInvalidDataException
          - PngCodec_GetInfoAndLoad_InvalidColorType_BothThrowInvalidDataException
          - PngSuiteUnsupportedFile_GetInfoReturnsCorrectDimensions
          - PngCodec_PngSuiteCorruptAfterIhdrFile_GetInfoReturnsCorrectDimensions_ButLoadThrows

      - id: CanvasNet-Lib-PngGetInfoValidation
        title: >-
          The library shall reject invalid arguments or malformed PNG data passed to GetInfo with
          the same exception contract as Load.
        tags: [system]
        justification: |
          Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
        children:
          - CanvasNet-Codecs-PngGetInfoValidation
        tests:
          - PngCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - PngCodec_GetInfo_NullPath_ThrowsArgumentNullException
          - PngCodec_GetInfo_EmptyPath_ThrowsArgumentException
          - PngCodec_GetInfo_BadSignature_ThrowsInvalidDataException
          - PngCodec_GetInfo_PngSuiteCorruptFile_ThrowsInvalidDataException

  - title: TIFF Codec API
    requirements:
      - id: CanvasNet-Lib-TiffSave
        title: >-
          The library shall save a Surface as an 8-bit RGBA TIFF file (with optional
          None/PackBits/LZW/Deflate compression), to either a stream or a file path.
        tags: [system]
        justification: |
          Callers need to persist rendered or loaded pixel data in the widely supported TIFF
          format for interchange with other tools.
        children:
          - CanvasNet-Codecs-TiffSave
        tests:
          - CanvasNet_SystemIntegration_TiffSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-TiffLoad
        title: >-
          The library shall load a Surface from an 8-bit RGB, RGBA, or Grayscale TIFF file (either
          byte order, single- or multi-strip, with None/PackBits/LZW/Deflate compression), from
          either a stream or a file path.
        tags: [system]
        justification: |
          Callers need to import existing TIFF images as pixel buffers for further processing or
          display, including files produced by real-world third-party TIFF encoders.
        children:
          - CanvasNet-Codecs-TiffLoad
        tests:
          - CanvasNet_SystemIntegration_TiffSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-TiffValidationNull
        title: >-
          The library shall reject null Surface, stream, or path arguments to TIFF save and load
          operations with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to any TIFF save or load operation is a programming error. Throwing
          ArgumentNullException immediately surfaces the mistake and prevents obscure failures
          deeper in the call stack.
        children:
          - CanvasNet-Codecs-TiffValidationNull
        tests:
          - TiffCodec_SaveStream_NullCanvas_ThrowsArgumentNullException
          - TiffCodec_SaveStream_NullStream_ThrowsArgumentNullException
          - TiffCodec_SavePath_NullCanvas_ThrowsArgumentNullException
          - TiffCodec_SavePath_NullPath_ThrowsArgumentNullException
          - TiffCodec_LoadStream_NullStream_ThrowsArgumentNullException
          - TiffCodec_LoadPath_NullPath_ThrowsArgumentNullException

      - id: CanvasNet-Lib-TiffValidationEmptyPath
        title: >-
          The library shall reject an empty path argument to TIFF save and load operations with
          ArgumentException.
        tags: [system]
        justification: |
          Passing an empty path to any TIFF save or load operation is a programming error.
          Throwing ArgumentException immediately surfaces the mistake and prevents an obscure
          file-system error.
        children:
          - CanvasNet-Codecs-TiffValidationEmptyPath
        tests:
          - TiffCodec_SavePath_EmptyPath_ThrowsArgumentException
          - TiffCodec_LoadPath_EmptyPath_ThrowsArgumentException

      - id: CanvasNet-Lib-TiffValidationCompression
        title: >-
          The library shall reject an undefined TiffCompression argument to TIFF save with
          ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          An undefined compression value cannot be encoded to a valid TIFF file; rejecting it
          immediately prevents a malformed file from being written.
        children:
          - CanvasNet-Codecs-TiffValidationCompression
        tests:
          - TiffCodec_SaveStream_UndefinedCompression_ThrowsArgumentOutOfRangeException
          - TiffCodec_SavePath_UndefinedCompression_ThrowsArgumentOutOfRangeException

      - id: CanvasNet-Lib-TiffUnsupportedFormatValidation
        title: >-
          The library shall reject malformed or unsupported TIFF data (bad byte-order mark,
          unsupported bit depth, unsupported photometric interpretation, unsupported compression,
          Planar configuration, tiled layout, a missing mandatory tag, or a truncated stream)
          with InvalidDataException.
        tags: [system]
        justification: |
          Callers must be able to distinguish a genuinely malformed or unsupported TIFF file from
          a successful load, and receive a clear, actionable error rather than incorrect pixel
          data.
        children:
          - CanvasNet-Codecs-TiffUnsupportedFormatValidation
        tests:
          - TiffCodec_Load_BadByteOrderMark_ThrowsInvalidDataException
          - TiffCodec_Load_UnsupportedBitsPerSample_ThrowsInvalidDataException
          - TiffCodec_Load_UnsupportedPhotometricPalette_ThrowsInvalidDataException
          - TiffCodec_Load_UnsupportedCompression_ThrowsInvalidDataException
          - TiffCodec_Load_PlanarConfigurationPlanar_ThrowsInvalidDataException
          - TiffCodec_Load_TiledTiff_ThrowsInvalidDataException
          - TiffCodec_Load_MissingMandatoryTag_ThrowsInvalidDataException
          - TiffCodec_Load_TruncatedHeader_ThrowsInvalidDataException
          - TiffCodec_Load_TruncatedStripData_ThrowsInvalidDataException

      - id: CanvasNet-Lib-TiffGetInfo
        title: >-
          The library shall report a TIFF's width, height, samples-per-pixel, and alpha presence
          via GetInfo, given a stream or a file path, without decoding strip data and without
          enforcing the maximum permitted dimension. GetInfo shall seek directly to the IFD for a
          seekable stream, and shall fall back to buffering the whole stream (matching Load's own
          unconditional buffering) for a non-seekable stream, so GetInfo succeeds rather than
          rejecting a non-seekable stream.
        tags: [system]
        justification: |
          Callers need to inspect a TIFF's declared dimensions and channel layout - for example to
          reject unreasonably large images before allocating a Surface - without paying the cost
          of decoding strip data, via a handful of small seeks when the stream is seekable. Unlike
          PNG/JPEG/BMP, a TIFF's IFD can legitimately be located anywhere in the file, so no
          bounded, purely sequential scan can reliably resolve every well-formed TIFF from a
          non-seekable source; rather than rejecting a non-seekable stream outright, GetInfo
          upholds the invariant that it never throws for an input Load would successfully decode
          by falling back to Load's own buffering strategy.
        children:
          - CanvasNet-Codecs-TiffGetInfo
        tests:
          - TiffCodec_GetInfo_Seekable_Rgb_ReturnsExpectedInfoWithoutAlpha
          - TiffCodec_GetInfo_Seekable_Rgba_ReturnsExpectedInfoWithAlpha
          - TiffCodec_GetInfo_Seekable_PositionStaysWellBelowFullLength
          - TiffCodec_GetInfo_OversizedDimensions_ReturnsRawValue_ButLoadThrows
          - TiffCodec_GetInfo_SucceedsWithTruncatedStripData_ButLoadThrows
          - TiffCodec_GetInfo_NonSeekableStream_SucceedsAndMatchesLoadResult
          - CanvasNet_SystemIntegration_TiffGetInfoOnNonSeekableStream_ReturnsExpectedInfo

      - id: CanvasNet-Lib-TiffGetInfoValidation
        title: >-
          The library shall reject invalid arguments or malformed TIFF data passed to GetInfo with
          the same exception contract as Load.
        tags: [system]
        justification: |
          Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
        children:
          - CanvasNet-Codecs-TiffGetInfoValidation
        tests:
          - TiffCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - TiffCodec_GetInfo_NullPath_ThrowsArgumentNullException
          - TiffCodec_GetInfo_EmptyPath_ThrowsArgumentException
          - TiffCodec_GetInfo_BadByteOrderMark_ThrowsInvalidDataException

  - title: JPEG Codec API
    requirements:
      - id: CanvasNet-Lib-JpegSave
        title: >-
          The library shall save a Surface as a baseline, 3-component YCbCr, 4:2:0
          chroma-subsampled JPEG file, to either a stream or a file path.
        tags: [system]
        justification: |
          Callers need to persist rendered or loaded pixel data in the widely supported JPEG
          format for interchange with other tools, with a caller-controlled quality setting.
        children:
          - CanvasNet-Codecs-JpegSave
        tests:
          - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-JpegLoad
        title: >-
          The library shall load a Surface from a supported JPEG file, from either a stream or a
          file path, including grayscale, baseline 4:4:4/4:2:2/4:2:0, and progressive JPEG.
        tags: [system]
        justification: |
          Callers need to import existing JPEG images as pixel buffers for further processing or
          display, including files produced by real-world third-party encoders.
        children:
          - CanvasNet-Codecs-JpegLoad
        tests:
          - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-JpegValidationNull
        title: >-
          The library shall reject null Surface, stream, or path arguments to JPEG save and load
          operations with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to any JPEG save or load operation is a programming error. Throwing
          ArgumentNullException immediately surfaces the mistake and prevents obscure failures
          deeper in the call stack.
        children:
          - CanvasNet-Codecs-JpegValidationNull
        tests:
          - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-JpegValidationEmptyPath
        title: >-
          The library shall reject an empty path argument to JPEG save and load operations with
          ArgumentException.
        tags: [system]
        justification: |
          Passing an empty path to any JPEG save or load operation is a programming error.
          Throwing ArgumentException immediately surfaces the mistake and prevents an obscure
          file-system error.
        children:
          - CanvasNet-Codecs-JpegValidationEmptyPath
        tests:
          - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-JpegValidationQuality
        title: >-
          The library shall reject a JPEG save quality value outside the inclusive range 1-100
          with ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          An out-of-range quality value cannot be mapped to the encoder's documented quality scale
          and must be rejected rather than silently clamped.
        children:
          - CanvasNet-Codecs-JpegValidationQuality
        tests:
          - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-JpegUnsupportedFormatValidation
        title: >-
          The library shall reject malformed or unsupported JPEG data (missing SOI, unsupported
          SOF marker, unsupported component count, a missing mandatory segment, or a truncated
          stream) with InvalidDataException.
        tags: [system]
        justification: |
          Callers must be able to distinguish a genuinely malformed or unsupported JPEG file from
          a successful load, and receive a clear, actionable error rather than incorrect pixel
          data.
        children:
          - CanvasNet-Codecs-JpegUnsupportedFormatValidation
        tests:
          - CanvasNet_SystemIntegration_JpegSaveThenLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-JpegGetInfo
        title: >-
          The library shall report a JPEG's width, height, and component count via GetInfo, given
          a stream or a file path, by scanning markers for an SOF0/SOF2 segment without
          entropy-decoding scan data, without requiring an SOS segment or entropy-coded data, and
          without enforcing the maximum permitted dimension. GetInfo shall treat a fixed maximum
          number of probed header bytes as a soft cap on its fast incremental scan only,
          continuing to scan past that cap - reading no more of the stream than each successive
          marker/segment boundary actually requires - rather than throwing once that cap would
          otherwise be exceeded. GetInfo shall throw InvalidDataException if the stream genuinely
          ends without an SOF0/SOF2 marker ever being found, and shall also throw
          InvalidDataException, without reading further, if either an explicit hard byte ceiling
          or an explicit hard segment-count ceiling on the post-soft-cap scan is reached first.
          Load shall enforce these same two ceilings on its own pre-SOF marker-segment walk, and
          throw the same InvalidDataException for the same condition, so GetInfo and Load agree
          consistently on this input shape rather than diverging.
        tags: [system]
        justification: |
          Callers need to inspect a JPEG's declared dimensions and component count - for example
          to reject unreasonably large images before allocating a Surface - without paying the
          cost of entropy-decoding the scan data, and without an unbounded scan over a
          pathological stream that never presents an SOF marker. GetInfo must not throw merely
          because a well-formed file's leading segments happen to exceed the soft cap - but it
          must still throw, rather than reading without bound, once either of its two independent
          hard ceilings is reached without an SOF0/SOF2 marker ever being found. Because Load
          enforces the same two ceilings on its own pre-SOF marker-segment walk, a pathological
          file whose leading marker-segment data exceeds either ceiling is rejected consistently
          by both GetInfo and Load - true parity, not a documented exception.
        children:
          - CanvasNet-Codecs-JpegGetInfo
        tests:
          - JpegCodec_GetInfo_Grayscale_ReturnsExpectedInfoWithoutSosOrEntropyData
          - JpegCodec_GetInfo_Color_ReturnsExpectedInfo
          - JpegCodec_GetInfoPath_ReturnsExpectedInfo
          - JpegCodec_GetInfo_LargeStream_NeverReadsPastProbeLimit
          - JpegCodec_GetInfo_NoSofAnywhereEvenBeyondProbeCap_ThrowsInvalidDataException
          - JpegCodec_GetInfo_LargeLeadingAppSegments_SucceedsAndMatchesLoadResult
          - JpegCodec_GetInfo_SofShortlyAfterProbeCap_StopsAtSofWithoutDrainingStream
          - JpegCodec_GetInfoVsLoad_LeadingMetadataExceedsHardLimit_BothThrowConsistently
          - JpegCodec_GetInfoVsLoad_LeadingSegmentCountExceedsLimit_BothThrowConsistently
          - JpegCodec_GetInfoVsLoad_SofSegmentStraddlesHardLimit_BothThrowConsistently
          - JpegCodec_GetInfoVsLoad_SosBeforeSofAtSegmentCountBoundary_BothThrowSosMessageNotSegmentLimit
          - JpegCodec_GetInfo_OversizedDimensions_NotRejected_ButLoadThrows
          - CanvasNet_SystemIntegration_JpegGetInfoWithLargeLeadingSegments_ReturnsExpectedInfo

      - id: CanvasNet-Lib-JpegGetInfoValidation
        title: >-
          The library shall reject invalid arguments or malformed JPEG data passed to GetInfo with
          the same exception contract as Load.
        tags: [system]
        justification: |
          Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
        children:
          - CanvasNet-Codecs-JpegGetInfoValidation
        tests:
          - JpegCodec_GetInfoStream_NullStream_ThrowsArgumentNullException
          - JpegCodec_GetInfoPath_NullPath_ThrowsArgumentNullException
          - JpegCodec_GetInfoPath_EmptyPath_ThrowsArgumentException
          - JpegCodec_GetInfo_MissingSoiMarker_ThrowsInvalidDataException
          - JpegCodec_GetInfo_TruncatedBeforeSofFound_ThrowsInvalidDataException
          - JpegCodec_GetInfo_SosBeforeSof_ThrowsInvalidDataException

  - title: SVG Codec API
    requirements:
      - id: CanvasNet-Lib-SvgLoad
        title: >-
          The library shall load a Surface by rasterizing a supported SVG document, from either a
          stream or a file path, including basic shapes, the full path data mini-language,
          group/attribute inheritance and nested transforms, transform functions, presentation
          attributes, gradients (including href template inheritance), and the use element. The
          library shall propagate Surface's own ArgumentOutOfRangeException, unwrapped, when given
          a non-positive requested output width or height.
        tags: [system]
        justification: |
          Callers need to import SVG vector artwork as pixel buffers for further processing or
          display; SvgCodec is decode/rasterize-only (no Save), and its requested raster
          dimensions are ordinary API parameters rather than untrusted file data.
        children:
          - CanvasNet-Codecs-SvgLoad
        tests:
          - CanvasNet_SystemIntegration_SvgLoad_ReturnsExpectedPixel

      - id: CanvasNet-Lib-SvgViewBoxFitting
        title: >-
          The library shall fit an SVG document's intrinsic viewBox into the requested raster size
          using a "meet, centered" (CSS object-fit: contain equivalent) transform.
        tags: [system]
        justification: |
          Callers request a specific raster size that may not share the document's intrinsic
          aspect ratio; centered letterboxing avoids distorting or clipping the document's
          content.
        children:
          - CanvasNet-Codecs-SvgViewBoxFitting
        tests:
          - SvgCodec_Load_WideViewBoxIntoSquareRaster_LetterboxesTopAndBottom
          - SvgCodec_Load_TallViewBoxIntoSquareRaster_LetterboxesLeftAndRight

      - id: CanvasNet-Lib-SvgGetInfo
        title: >-
          The library shall report an SVG document's resolved intrinsic width, height, channel
          count, and alpha presence via GetInfo, given a stream or a file path, falling back from
          viewBox to width/height to a 300x150 default.
        tags: [system]
        justification: |
          Callers need to inspect an SVG document's intrinsic size before choosing a raster
          target size to load it into, even for documents that omit explicit sizing information.
        children:
          - CanvasNet-Codecs-SvgGetInfo
        tests:
          - SvgCodec_GetInfo_ViewBoxPresent_ReturnsViewBoxDimensions
          - SvgCodec_GetInfo_FromFilePath_ReturnsExpectedInfo
          - SvgCodec_GetInfo_NoViewBoxWidthHeightPresent_ReturnsWidthHeight
          - SvgCodec_GetInfo_NoViewBoxNoWidthHeight_ReturnsCssDefault300x150

      - id: CanvasNet-Lib-SvgTextRendering
        title: >-
          The library shall render an SVG text element's characters as glyph outlines from a
          caller-supplied font, positioned and anchored according to its text-anchor, and shall
          silently skip text rendering when no matching font is available.
        tags: [system]
        justification: |
          Callers need text content in an SVG document rendered as recognizable glyph shapes
          using real font metrics, without a missing font turning an otherwise-renderable
          document into a failure.
        children:
          - CanvasNet-Codecs-SvgTextRendering
        tests:
          - SvgCodec_Load_TextWithMatchingFont_RendersGlyphAtExpectedPosition
          - SvgCodec_Load_TextWithKerningPair_AppliesKerningBetweenGlyphs
          - SvgCodec_Load_TextFixtureWithRealFont_RendersVisibleGlyphInk
          - SvgCodec_Load_TextAnchorMiddle_CentersTextHorizontally
          - SvgCodec_Load_TextAnchorEnd_RightAlignsText
          - SvgCodec_Load_TextWithoutFontsDictionary_SkipsSilentlyWithoutThrowing
          - SvgCodec_Load_TextFontFamilyNoMatch_SkipsSilentlyWithoutThrowing
          - SvgCodec_Load_TextFontFamilyCommaSeparatedList_MatchesFirstAvailableFont

      - id: CanvasNet-Lib-SvgValidationNull
        title: >-
          The library shall reject null stream/path arguments to SVG Load and GetInfo operations
          with ArgumentNullException.
        tags: [system]
        justification: |
          Passing null to any SVG load or inspection operation is a programming error. Throwing
          ArgumentNullException immediately surfaces the mistake and prevents obscure failures
          deeper in the call stack.
        children:
          - CanvasNet-Codecs-SvgValidationNull
        tests:
          - SvgCodec_Load_NullStream_ThrowsArgumentNullException
          - SvgCodec_Load_NullPath_ThrowsArgumentNullException
          - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException

      - id: CanvasNet-Lib-SvgValidationEmptyPath
        title: >-
          The library shall reject an empty or whitespace-only path argument to SVG Load and
          GetInfo operations with ArgumentException.
        tags: [system]
        justification: |
          Passing an empty or whitespace-only path to any SVG load or inspection operation is a
          programming error. Throwing ArgumentException immediately surfaces the mistake and
          prevents an obscure file-system error.
        children:
          - CanvasNet-Codecs-SvgValidationEmptyPath
        tests:
          - SvgCodec_Load_EmptyPath_ThrowsArgumentException
          - SvgCodec_Load_WhitespacePath_ThrowsArgumentException
          - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

      - id: CanvasNet-Lib-SvgUnsupportedFormatValidation
        title: >-
          The library shall reject malformed SVG data (non-well-formed XML, a malformed viewBox
          or transform attribute, or malformed path data) with InvalidDataException.
        tags: [system]
        justification: |
          Callers must be able to distinguish a genuinely malformed SVG document from a
          successful load, and receive a clear, actionable error rather than incorrect pixel
          data.
        children:
          - CanvasNet-Codecs-SvgUnsupportedFormatValidation
        tests:
          - SvgCodec_Load_MalformedXml_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedViewBoxWrongNumberCount_ThrowsInvalidDataException
          - SvgCodec_Load_ViewBoxNonPositiveWidth_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedTransformUnrecognizedFunction_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedPathDataUnknownCommand_ThrowsInvalidDataException
          - SvgCodec_Load_MalformedPathDataMissingArguments_ThrowsInvalidDataException

      - id: CanvasNet-Lib-SvgXxeHardening
        title: >-
          The library shall explicitly disable DTD processing and external entity resolution for
          SVG parsing (both Load and GetInfo), rejecting a document containing a DOCTYPE
          declaration with InvalidDataException.
        tags: [system, security]
        justification: |
          Defense-in-depth documentation clarity against XML External Entity (XXE) injection: a
          reader that processed a DOCTYPE or resolved an external entity could otherwise be
          tricked into reading arbitrary local files or making unexpected network requests merely
          by parsing a maliciously crafted SVG document.
        children:
          - CanvasNet-Codecs-SvgXxeHardening
        tests:
          - SvgCodec_Load_DocumentWithDoctypeDeclaration_ThrowsInvalidDataException
          - SvgCodec_Load_DocumentWithExternalEntityDoctype_ThrowsInvalidDataException
          - SvgCodec_GetInfo_DocumentWithExternalEntityDoctype_ThrowsInvalidDataException

      - id: CanvasNet-Lib-SvgTolerateUnsupportedConstructs
        title: >-
          The library shall silently skip well-formed but out-of-scope SVG elements, continuing
          to render the rest of the document, rather than rejecting the entire document.
        tags: [system]
        justification: |
          Real-world SVG documents commonly include constructs outside this codec's supported
          subset (such as filters, masks, or CSS styling); rejecting the entire document because
          of one such element would be needlessly strict when the rest of the document is
          renderable.
        children:
          - CanvasNet-Codecs-SvgTolerateUnsupportedConstructs
        tests:
          - SvgCodec_Load_UnsupportedConstructs_StillRendersRestOfDocument
          - SvgCodec_Load_ToleratesUnsupportedConstructFixture_StillRendersRemainingContent

      - id: CanvasNet-Lib-SvgGetInfoValidation
        title: >-
          The library shall reject invalid arguments passed to SVG GetInfo with the same
          exception contract as Load.
        tags: [system]
        justification: |
          Callers need GetInfo's failure behavior to be exactly as predictable as Load's.
        children:
          - CanvasNet-Codecs-SvgGetInfoValidation
        tests:
          - SvgCodec_GetInfo_NullStream_ThrowsArgumentNullException
          - SvgCodec_GetInfo_NullPath_ThrowsArgumentNullException
          - SvgCodec_GetInfo_EmptyPath_ThrowsArgumentException

  - title: Geometry API
    requirements:
      - id: CanvasNet-Lib-GeometryRect
        title: >-
          The library shall provide an axis-aligned bounding rectangle type (position plus size),
          supporting union, intersection, matrix transformation, containment testing, and value
          equality, with an empty sentinel that acts as a union identity.
        tags: [system]
        justification: |
          Axis-aligned bounds are a foundational primitive for vector geometry (for example,
          computing a path's bounding box) that must compose correctly across zero or more
          contributing regions without special-casing "nothing yet".
        children:
          - CanvasNet-Geometry-Rect
        tests:
          - CanvasNet_SystemIntegration_BuildFlattenAndBoundPath_ReturnsExpectedBounds

      - id: CanvasNet-Lib-GeometryPath
        title: >-
          The library shall provide an immutable vector path type, built via a mutable, fluent
          builder supporting move, line, quadratic and cubic Bezier, SVG-style elliptical arc, and
          close-subpath commands, and shall compute an axis-aligned bounding rectangle for a path
          in either a conservative or a tighter, flattening-based mode.
        tags: [system]
        justification: |
          A vector path is the foundational shape-description primitive future drawing/rendering
          functionality in this library will consume; callers need to build one incrementally,
          using a single reusable builder instance, and to reason about its extent.
        children:
          - CanvasNet-Geometry-Path
        tests:
          - CanvasNet_SystemIntegration_BuildFlattenAndBoundPath_ReturnsExpectedBounds

      - id: CanvasNet-Lib-GeometryBezierFlattening
        title: >-
          The library shall provide adaptive flattening of quadratic and cubic Bezier curves into
          polylines within a caller-specified tolerance, writing into a caller-supplied output
          collection.
        tags: [system]
        justification: |
          Rendering and precise bounds computation both require converting smooth curves into
          straight-line segments within a controllable accuracy budget, without an allocation per
          flattening call in hot rendering loops.
        children:
          - CanvasNet-Geometry-BezierFlattening
        tests:
          - CanvasNet_SystemIntegration_BuildFlattenAndBoundPath_ReturnsExpectedBounds

      - id: CanvasNet-Lib-GeometrySvgArcConverter
        title: >-
          The library shall convert SVG-style endpoint-parameterized elliptical arcs into cubic
          Bezier curves, following the SVG 1.1 Appendix F algorithm, including its documented
          degenerate cases, without throwing for any SVG-valid input.
        tags: [system]
        justification: |
          PathBuilder.ArcTo stores raw SVG arc parameters without pre-converting them; callers (or the
          library's own bounds computation) that need Bezier segments from an arc require a
          spec-faithful conversion available on demand.
        children:
          - CanvasNet-Geometry-SvgArcConverter
        tests:
          - CanvasNet_SystemIntegration_BuildFlattenAndBoundPath_ReturnsExpectedBounds

      - id: CanvasNet-Lib-GeometryCornerRoundEffect
        title: >-
          The library shall provide a path-level effect that replaces polyline corners with
          tangent-radius arcs of a caller-specified radius, clamped per-corner to half of the
          shorter adjacent segment, leaving curved corners unchanged.
        tags: [system]
        justification: |
          Rounded polyline corners are a common effect; applying it as a pre-processing pass on
          the immutable Path composes cleanly with downstream fill, stroke, and dashing without
          requiring corner-aware stroke logic.
        children:
          - CanvasNet-Geometry-CornerRoundEffect
        tests:
          - CanvasNet_SystemIntegration_RoundPathCornersAndFillOntoSurface_ClipsSharpCorner

  - title: Drawing API
    requirements:
      - id: CanvasNet-Lib-DrawingPathFill
        title: >-
          The library shall fill a closed Path with a solid color onto a Surface, using an
          antialiased scanline-coverage rasterizer supporting both nonzero and even-odd fill
          rules, with a caller-adjustable curve-flattening tolerance.
        tags: [system]
        justification: |
          Solid-color fill of arbitrary vector geometry is the foundational rendering operation
          future Drawing functionality (strokes, gradients, fonts) will build upon; callers need
          it available directly without hand-rolling rasterization.
        children:
          - CanvasNet-Drawing-PathFill
        tests:
          - CanvasNet_SystemIntegration_BuildAndFillTrianglePath_ReturnsExpectedPixels

      - id: CanvasNet-Lib-DrawingPathFillNoOp
        title: >-
          The library shall silently no-op, without throwing, when filling an empty Path or a
          Path whose bounds do not intersect the target Surface.
        tags: [system]
        justification: |
          Callers building up scenes incrementally will routinely fill paths that are empty or
          fall entirely outside the visible surface; this must be a cheap, well-defined no-op
          rather than a special case callers must detect and avoid themselves.
        children:
          - CanvasNet-Drawing-PathFillNoOp
        tests:
          - CanvasNet_SystemIntegration_FillEmptyOrOutOfBoundsPath_NoOpLeavesSurfaceUnchanged

      - id: CanvasNet-Lib-DrawingPathFillValidation
        title: >-
          The library shall reject a null Surface or Path argument to the fill operation with
          ArgumentNullException, a non-positive or non-finite flatten-tolerance argument with
          ArgumentOutOfRangeException, and an undefined fill-rule argument with
          ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          A null surface or path cannot supply a valid fill target or geometry, a non-positive
          or non-finite flattening tolerance cannot bound curve subdivision to a meaningful
          accuracy, and an undefined fill-rule value has no defined winding-resolution meaning;
          rejecting these early prevents a confusing failure, or a silently mis-resolved fill
          rule, deeper in the implementation.
        children:
          - CanvasNet-Drawing-PathFillValidation
        tests:
          - PathFiller_Fill_NullSurface_ThrowsArgumentNullException
          - PathFiller_Fill_NullPath_ThrowsArgumentNullException
          - PathFiller_Fill_NonPositiveFlattenTolerance_ThrowsArgumentOutOfRangeException
          - PathFiller_Fill_UndefinedFillRule_ThrowsArgumentOutOfRangeException

      - id: CanvasNet-Lib-DrawingPathStroke
        title: >-
          The library shall convert a Path stroke into a new closed Path suitable for nonzero-rule
          filling, reflecting the configured width, cap shape, join shape, dash pattern, and
          curve-flattening tolerance.
        tags: [system]
        justification: |
          Stroke-to-fill conversion exposes standard vector stroking behavior while keeping one
          rendering pipeline for both fills and strokes; callers can stroke a path, inspect or
          reuse the returned outline geometry, then render it through the existing fill API.
        children:
          - CanvasNet-Drawing-PathStroke
        tests:
          - PathStroker_Stroke_HorizontalLineButtCap_FillsExactRectangleNoExtension
          - PathStroker_Stroke_HorizontalLineRoundCap_FillsRectanglePlusSemicircularEnds
          - PathStroker_Stroke_HorizontalLineSquareCap_FillsRectanglePlusHalfWidthExtension
          - PathStroker_Stroke_RightAngleCornerMiterJoin_FillsSharpMiteredCorner
          - PathStroker_Stroke_RightAngleCornerRoundJoin_FillsRoundedCorner
          - PathStroker_Stroke_RightAngleCornerBevelJoin_FillsFlatBeveledCorner
          - PathStroker_Stroke_DashedLine_FillsOnlyOnSegmentsLeavingGapsUnfilled
          - PathStroker_Stroke_ClosedRectangle_FillsRingLeavingInteriorAndExteriorUnfilled
          - PathStroker_Stroke_ZeroLengthSubpathRoundCap_FillsCircleOfRadiusHalfWidth
          - PathStroker_Stroke_ZeroLengthSubpathSquareCap_FillsSquareOfSideWidth
          - PathStroker_Stroke_SinglePointSubpath_MatchesZeroLengthSubpathBehavior

      - id: CanvasNet-Lib-DrawingPathStrokeNoOp
        title: >-
          The library shall return an empty Path, without throwing, when stroking an empty Path or
          when the requested stroke contributes no visible area.
        tags: [system]
        justification: |
          Callers routinely stroke optional or partially constructed geometry; an empty result
          must be a cheap, well-defined no-op rather than a special case callers must detect.
        children:
          - CanvasNet-Drawing-PathStrokeNoOp
        tests:
          - PathStroker_Stroke_ZeroLengthSubpathButtCap_ProducesNoFilledPixels
          - PathStroker_Stroke_EmptyPath_ReturnsEmptyPathNoOp

      - id: CanvasNet-Lib-DrawingPathStrokeValidation
        title: >-
          The library shall reject a null Path or stroke-style argument to the stroke operation
          with ArgumentNullException, and shall reject a non-positive or non-finite
          flatten-tolerance argument with ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          A null path or style cannot supply valid stroke geometry, and a non-positive or
          non-finite flattening tolerance cannot bound curve approximation meaningfully.
        children:
          - CanvasNet-Drawing-PathStrokeValidation
        tests:
          - PathStroker_Stroke_NullPath_ThrowsArgumentNullException
          - PathStroker_Stroke_NullStrokeStyle_ThrowsArgumentNullException
          - PathStroker_Stroke_NonPositiveFlattenTolerance_ThrowsArgumentOutOfRangeException

      - id: CanvasNet-Lib-DrawingGradientPaint
        title: >-
          The library shall fill a closed Path with a linear or radial gradient color ramp, varying
          color smoothly or in sharp steps across the filled area according to caller-supplied
          color stops, spread method, and transform.
        tags: [system]
        justification: |
          A gradient color ramp is standard 2D vector graphics paint functionality alongside
          solid-color fill and stroke; callers need it available directly without hand-rolling
          per-pixel color interpolation themselves.
        children:
          - CanvasNet-Drawing-GradientPaint
        tests:
          - PathFiller_Fill_Gradient_HorizontalRectangleWithHorizontalLinearGradient_VariesLeftToRight
          - EvaluatePoint_Radial_TwoCircle_DistinctCentersAndRadii_ResolvesAlongSweptFamily

      - id: CanvasNet-Lib-DrawingGradientPaintValidation
        title: >-
          The library shall reject a null surface, path, or gradient paint argument to the gradient
          fill operation with ArgumentNullException, and shall reject a non-positive or non-finite
          flatten-tolerance argument or an undefined fill-rule argument with
          ArgumentOutOfRangeException.
        tags: [system]
        justification: |
          Gradient fill validation must fail exactly as consistently and predictably as
          solid-color fill validation, so callers do not need to learn a second set of
          invalid-input rules for the gradient overload.
        children:
          - CanvasNet-Drawing-GradientPaintValidation
        tests:
          - PathFiller_Fill_Gradient_NullSurface_ThrowsArgumentNullException
          - PathFiller_Fill_Gradient_NullPath_ThrowsArgumentNullException
          - PathFiller_Fill_Gradient_NullPaint_ThrowsArgumentNullException
          - PathFiller_Fill_Gradient_NonPositiveFlattenTolerance_ThrowsArgumentOutOfRangeException
          - PathFiller_Fill_Gradient_UndefinedFillRule_ThrowsArgumentOutOfRangeException

  - title: Fonts API
    requirements:
      - id: CanvasNet-Lib-FontsLoad
        title: >-
          The library shall load a TrueType font from a stream or a file path, exposing its
          metrics, and validating its input arguments and structural well-formedness with a
          predictable exception contract.
        tags: [system]
        justification: |
          Callers need a reliable, self-contained way to load a TrueType font file before
          extracting any glyph geometry or metrics from it, with clear failure behavior for
          invalid arguments or malformed/unsupported font data.
        children:
          - CanvasNet-Fonts-Load
        tests:
          - CanvasNet_SystemIntegration_LoadFontAndQueryMetrics_ReturnsExpectedValues

      - id: CanvasNet-Lib-FontsGlyphMapping
        title: >-
          The library shall map a Unicode codepoint, including codepoints outside the Basic
          Multilingual Plane, to a glyph index, falling back to the conventional "missing glyph"
          index without throwing when the codepoint is unmapped or the font has no usable
          character map.
        tags: [system]
        justification: |
          Callers rendering text need every codepoint resolved to a glyph index before any
          outline can be extracted, including the common cases of unsupported characters or a
          font with no (or only a partially supported) character map.
        children:
          - CanvasNet-Fonts-GlyphMapping
        tests:
          - CanvasNet_SystemIntegration_LoadFontAndFillGlyphOutline_ReturnsExpectedPixels

      - id: CanvasNet-Lib-FontsGlyphOutlineExtraction
        title: >-
          The library shall extract a glyph's outline as vector path geometry, including simple
          glyphs, empty glyphs, and composite glyphs built from transformed (and possibly nested)
          component glyphs, never hanging or crashing on a malformed or malicious composite-glyph
          cycle, excessive composite blow-up, point-matched component, or otherwise malformed
          glyph data.
        tags: [system]
        justification: |
          Callers need renderable outline geometry for every glyph shape a TrueType font may
          define, while a malformed or malicious font's glyph data must never be able to hang or
          crash the calling process.
        children:
          - CanvasNet-Fonts-GlyphOutlineExtraction
        tests:
          - CanvasNet_SystemIntegration_LoadFontAndFillGlyphOutline_ReturnsExpectedPixels

      - id: CanvasNet-Lib-FontsMetrics
        title: >-
          The library shall report each glyph's horizontal advance width and the pairwise
          kerning adjustment between two glyphs, validating the glyph index argument to the
          advance-width query and always returning a well-defined "no adjustment" value for
          kerning, including when the font has no kerning table at all.
        tags: [system]
        justification: |
          Callers laying out successive glyphs along a line need each glyph's advance width and
          any font-defined pairwise kerning adjustment, with kerning always safely queryable
          regardless of whether the font actually defines any.
        children:
          - CanvasNet-Fonts-Metrics
        tests:
          - CanvasNet_SystemIntegration_LoadFontAndQueryMetrics_ReturnsExpectedValues

  - title: Rendering API
    requirements:
      - id: CanvasNet-Lib-RenderingTransformStack
        title: >-
          The library shall wrap a pixel buffer with an affine transform stack (Save, Restore,
          Translate, RotateDegrees) composed in row-vector prepend order, and shall bake the
          current transform into every path fill/stroke while keeping output byte-identical to
          direct fill/stroke calls at the identity transform.
        tags: [system]
        justification: |
          Callers building composed scenes need a per-instance transform state so nested drawing
          can be positioned and rotated without re-encoding coordinates; the byte-identical
          no-transform regression preserves existing renders when the new wrapper is adopted.
        children:
          - CanvasNet-Rendering-TransformStack
        tests:
          - Canvas_Save_ThenRestore_RestoresPreviousTransform
          - Canvas_FillPath_NoTransform_ProducesByteIdenticalOutputToPathFillerFill

      - id: CanvasNet-Lib-RenderingTextRendering
        title: >-
          The library shall measure and render TrueType text at a chosen pixel size, summing
          per-glyph advances plus kerning, honoring the current transform, and supporting
          Left/Center/Right alignment relative to the anchor x-coordinate with a baseline anchor
          y-coordinate.
        tags: [system]
        justification: |
          Text rendering is a standard higher-level primitive callers need alongside path
          rendering; measurement and drawing must agree on layout, and text must inherit any
          transform applied to the target.
        children:
          - CanvasNet-Rendering-TextRendering
        tests:
          - TextRenderer_MeasureText_SingleGlyph_ReturnsAdvanceWidthScaledBySize
          - TextRenderer_DrawText_LeftAlign_RendersGlyphsWithoutThrowing
          - CanvasNet_SystemIntegration_DrawAndMeasureTextViaCanvas_RendersAndMeasuresExpectedResult

      - id: CanvasNet-Lib-RenderingShapes
        title: >-
          The library shall provide convenience fill and stroke helpers for axis-aligned
          rectangles, rounded rectangles, and circles, each honoring the current transform.
        tags: [system]
        justification: |
          Rectangles, rounded rectangles, and circles are the most common primitives; a caller
          should not have to construct a Path manually for each.
        children:
          - CanvasNet-Rendering-Shapes
        tests:
          - CanvasNet_SystemIntegration_FillRoundRectUnderTranslatedCanvas_MatchesDirectPlacement
