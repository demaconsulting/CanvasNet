---
# Commands Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasNetTool Commands subsystem
# - The Commands subsystem spans the ICommand contract and the CommandRegistry unit (command
#   table, resolution, dispatch, and help rendering) and the command units DiscoveryCommands
#   (formats and info), RenderCommand (render and convert, and the verbs crop, resize, rotate, flip,
#   and pad), CompareCommand (compare), MontageCommand (montage), and InspectCommand (inspect)
# - Subsystem requirements describe the externally visible command-dispatch behavior

sections:
  - title: Commands Subsystem Requirements
    requirements:
      - id: CanvasNetTool-Commands-Dispatch
        title: >-
          The Commands subsystem shall run the registered command selected by name or alias with
          its arguments, and shall report an unknown command as a usage error that suggests the
          closest command name.
        justification: |
          A command-line interface with subcommands needs a single place that resolves what the
          user typed to a command, runs it, and gives actionable feedback when the name is wrong.
        children:
          - CanvasNetTool-Commands-CommandRegistry-Registration
          - CanvasNetTool-Commands-CommandRegistry-Dispatch
          - CanvasNetTool-Commands-CommandRegistry-UnknownCommand
          - CanvasNetTool-Commands-CommandRegistry-ErrorContext
        tests:
          - CommandsSubsystem_Dispatch_RegisteredCommand_RunsWithItsArguments
          - CommandsSubsystem_Dispatch_GlobalOptionsMixedIn_AreNotPassedToCommand
          - CommandsSubsystem_Dispatch_CommandThrowsToolException_RecordsCommandName
          - CommandsSubsystem_UnknownCommand_Mistyped_ReportsUsageErrorWithSuggestion

      - id: CanvasNetTool-Commands-Help
        title: >-
          The Commands subsystem shall render help that lists the commands and the global
          options, and help for each command listing its usage, summary, and options.
        justification: |
          The tool must be learnable from its own output, by people and by AI agents; the help is
          generated from the registered commands so it cannot drift from what the commands accept.
        children:
          - CanvasNetTool-Commands-CommandRegistry-Help
        tests:
          - CommandsSubsystem_Help_TopLevel_ListsRegisteredCommands
          - CommandsSubsystem_Help_CommandHelp_ShownByFlagAndByHelpCommand
          - CommandsSubsystem_Help_UnknownCommand_ReportsUsageError

      - id: CanvasNetTool-Commands-Formats
        title: >-
          The Commands subsystem shall provide the formats command, which lists what the tool can
          read and write as text, or as one JSON document when the JSON option is given.
        justification: |
          Before using a tool, people and agents need to know what it supports; the formats command
          answers that from the tool itself, so the answer always matches the installed version.
        children:
          - CanvasNetTool-Commands-DiscoveryCommands-Formats
          - CanvasNetTool-Commands-DiscoveryCommands-FormatsJson
          - CanvasNetTool-Commands-DiscoveryCommands-FormatsArguments
          - CanvasNetTool-Commands-DiscoveryCommands-FormatTables
        tests:
          - CommandsSubsystem_Formats_DefaultRegistry_RunsFormatsCommand
          - CommandsSubsystem_Formats_DefaultRegistry_ListedInHelp

      - id: CanvasNetTool-Commands-Info
        title: >-
          The Commands subsystem shall provide the info command, which describes one file without
          rendering it, as text or as one JSON document when the JSON option is given.
        justification: |
          Before rendering a file, people and agents need to know what it is and how large it is; the
          info command answers that from the file header.
        children:
          - CanvasNetTool-Commands-DiscoveryCommands-Info
          - CanvasNetTool-Commands-DiscoveryCommands-InfoJson
          - CanvasNetTool-Commands-DiscoveryCommands-InfoPages
          - CanvasNetTool-Commands-DiscoveryCommands-InfoModel
          - CanvasNetTool-Commands-DiscoveryCommands-InfoErrors
        tests:
          - CommandsSubsystem_Imaging_DefaultRegistry_RunsInfoAndRender
          - CommandsSubsystem_Imaging_DefaultRegistry_ListedInHelp

      - id: CanvasNetTool-Commands-Render
        title: >-
          The Commands subsystem shall provide the render command (alias convert), which loads an
          image or drawing, applies the ordered image pipeline (including the photo tools), and writes it as PNG,
          JPEG, BMP, or TIFF, reporting the result as text or as
          one JSON document when the JSON option is given.
        justification: |
          Rendering and converting an image is the tool's central task; one command with one grammar
          serves both names and every input format.
        children:
          - CanvasNetTool-Commands-RenderCommand-Options
          - CanvasNetTool-Commands-RenderCommand-Source
          - CanvasNetTool-Commands-RenderCommand-Pages
          - CanvasNetTool-Commands-RenderCommand-Strict
          - CanvasNetTool-Commands-RenderCommand-Scad
          - CanvasNetTool-Commands-RenderCommand-Pipeline
          - CanvasNetTool-Commands-RenderCommand-PhotoOptions
          - CanvasNetTool-Commands-RenderCommand-Output
          - CanvasNetTool-Commands-RenderCommand-Result
          - CanvasNetTool-Commands-RenderCommand-Overwrite
          - CanvasNetTool-Commands-RenderCommand-Errors
        tests:
          - CommandsSubsystem_Imaging_DefaultRegistry_RunsInfoAndRender
          - CommandsSubsystem_Imaging_DefaultRegistry_ListedInHelp

      - id: CanvasNetTool-Commands-TransformCommands
        title: >-
          The Commands subsystem shall provide the commands crop, resize, rotate (by any angle), flip, and pad, each of
          which applies one transformation, named by a positional operand after the input, to an image,
          drawing, or document page and writes the result, with every option of the render command.
        justification: |
          A single transformation is the most frequent request; a command for each, sharing the
          implementation of the render command, gives a natural grammar without a second code path.
        children:
          - CanvasNetTool-Commands-RenderCommand-Verbs
        tests:
          - CommandsSubsystem_TransformVerbs_DefaultRegistry_RunAndAreListedInHelp

      - id: CanvasNetTool-Commands-Compare
        title: >-
          The Commands subsystem shall provide the compare command, which measures how much two images,
          drawings, or document pages differ (error measures, structural similarity, and the error of each
          cell of a grid), optionally writes pictures of the differences, and fails with the expected error
          threshold-failed, after writing its result, when a requested threshold is not met, reporting the
          result as text or as one JSON document when the JSON option is given.
        justification: |
          Checking a redraw against a reference is a central task of an agent that produces images; one
          command that returns the numbers, the pictures, and a gate in one run serves it.
        children:
          - CanvasNetTool-Commands-CompareCommand-Options
          - CanvasNetTool-Commands-CompareCommand-Sources
          - CanvasNetTool-Commands-CompareCommand-Sizing
          - CanvasNetTool-Commands-CompareCommand-Metrics
          - CanvasNetTool-Commands-CompareCommand-Grid
          - CanvasNetTool-Commands-CompareCommand-Outputs
          - CanvasNetTool-Commands-CompareCommand-Thresholds
          - CanvasNetTool-Commands-CompareCommand-Result
          - CanvasNetTool-Commands-CompareCommand-Overwrite
          - CanvasNetTool-Commands-CompareCommand-Errors
          - CanvasNetTool-Commands-CompareCommand-Determinism
        tests:
          - CommandsSubsystem_Comparison_DefaultRegistry_RunsCompareAndMontage
          - CommandsSubsystem_Comparison_DefaultRegistry_ListedInHelp

      - id: CanvasNetTool-Commands-Montage
        title: >-
          The Commands subsystem shall provide the montage command, which composes images, drawings, and the
          pages of documents into one labeled contact sheet and reports it as text or as one JSON document
          when the JSON option is given.
        justification: |
          Looking at many images or every page of a deck at once is a frequent need; one command with one
          grammar serves every input kind.
        children:
          - CanvasNetTool-Commands-MontageCommand-Options
          - CanvasNetTool-Commands-MontageCommand-Inputs
          - CanvasNetTool-Commands-MontageCommand-Layout
          - CanvasNetTool-Commands-MontageCommand-Fit
          - CanvasNetTool-Commands-MontageCommand-Labels
          - CanvasNetTool-Commands-MontageCommand-Result
          - CanvasNetTool-Commands-MontageCommand-Overwrite
          - CanvasNetTool-Commands-MontageCommand-Errors
          - CanvasNetTool-Commands-MontageCommand-Determinism
        tests:
          - CommandsSubsystem_Comparison_DefaultRegistry_RunsCompareAndMontage
          - CommandsSubsystem_Comparison_DefaultRegistry_ListedInHelp

      - id: CanvasNetTool-Commands-Inspect
        title: >-
          The Commands subsystem shall provide the inspect command with the subcommands colors and pixel, which load
          an image, drawing, or document page, apply the same image pipeline as render, and report the dominant colors
          and luma statistics, or the pixel at a point and its neighborhood, as text or as one JSON document when the
          JSON option is given, without writing a file.
        justification: |
          Before an agent transforms a photograph it must be able to ask what the photograph contains; a read-only
          command with the options of render answers it without an intermediate file.
        children:
          - CanvasNetTool-Commands-InspectCommand-Subcommands
          - CanvasNetTool-Commands-InspectCommand-Options
          - CanvasNetTool-Commands-InspectCommand-Colors
          - CanvasNetTool-Commands-InspectCommand-Pixel
          - CanvasNetTool-Commands-InspectCommand-Pipeline
          - CanvasNetTool-Commands-InspectCommand-Sources
          - CanvasNetTool-Commands-InspectCommand-ReadOnly
          - CanvasNetTool-Commands-InspectCommand-Errors
          - CanvasNetTool-Commands-InspectCommand-Deterministic
        tests:
          - CommandsSubsystem_Inspect_DefaultRegistry_RunsInspectAndIsListedInHelp
