---
# Software Unit Requirements for the PictureAttributes Class
#
# The PictureAttributes class reads the attributes of a picture or a code block (Mermaid, PlantUML, MathML, Vega-Lite,
# or OpenSCAD marked draw) for the Pandoc filter: it
# decides which kind of input a picture names, checks every drawing attribute with the messages of the Lua filter
# (version 16), adds the defaults of each kind, writes the sorted tool options, and keeps the attributes that stay on
# the picture. It also names code blocks for messages and splits off their caption. The supporting records
# PictureOptions (the sorted options and the kept attributes) and BlockClass (a code-block class and its kind)
# belong to it.

sections:
  - title: PictureAttributes Unit Requirements
    requirements:
      - id: CanvasNetTool-PandocFilter-PictureAttributes-Kinds
        title: >-
          The PictureAttributes unit shall classify a picture by the end of its name, in any letter case, as a
          Vega-Lite chart (.vl.json, .vl), an OpenSCAD model (.scad), a Visio drawing (.vsdx), a PowerPoint
          presentation (.pptx), a PDF document (.pdf), a Mermaid diagram (.mmd, .mermaid), a PlantUML diagram (.puml,
          .plantuml, .pu), or a local SVG drawing
          (.svg), and shall leave alone a name with a URL scheme of two or more characters or any other name end.
        justification: |
          The filter must draw only the local inputs the tool reads and must leave web pictures and ordinary images
          untouched; a drive letter such as C: is a local path, not a URL scheme.
        tests:
          - PictureAttributes_KindOf_FileNameEnd_GivesTheKind
          - PictureAttributes_IsSvg_LocalSvgOnly

      - id: CanvasNetTool-PandocFilter-PictureAttributes-Registry
        title: >-
          The PictureAttributes unit shall list the picture name ends the filter may change (.svg, then the ends of the
          inputs it draws), the code-block classes it draws (mermaid, plantuml, mathml, vega-lite, and vegalite,
          compared exactly), and the code-block classes it draws only when the block also has the class draw
          (openscad), and shall give a code block the kind of the first listed class it has (an opt-in class counting
          only with draw), leaving a block without one alone.
        justification: |
          One table decides both what the engine draws and what the shim's fast path starts the tool for, so the two
          cannot drift apart.
        tests:
          - PictureAttributes_PictureSuffixesAndBlockClasses_AreWhatTheEngineDraws
          - PictureAttributes_BlockOf_OpenScadNeedsTheDrawClass

      - id: CanvasNetTool-PandocFilter-PictureAttributes-Checks
        title: >-
          The PictureAttributes unit shall check the size, scale, background, page, dpi, view, azimuth, elevation,
          projection, theme, define-NAME, and param-NAME attributes against their documented grammar and range, shall
          refuse an empty value or a value with a control character, shall refuse size together with scale, and shall
          report each refusal as the error pandoc-filter-error with the message of the Lua filter that names the
          picture, the attribute, and what is expected.
        justification: |
          A mistyped attribute must stop the build with a message the author can act on, rather than draw a picture
          that silently ignores it; keeping the messages of the Lua filter keeps existing documentation builds and
          their expectations unchanged.
        tests:
          - PictureAttributes_Build_InvalidAttribute_ThrowsTheLuaMessage
          - PictureAttributes_Build_SizeAndScale_ThrowsUseOneOfThem

      - id: CanvasNetTool-PandocFilter-PictureAttributes-ApplicableKinds
        title: >-
          The PictureAttributes unit shall refuse, as the error pandoc-filter-error, an attribute written on a kind it
          does not apply to: page and dpi outside .vsdx, .pptx, and .pdf files, view, azimuth, elevation, projection,
          and define-NAME outside .scad models, theme outside Mermaid diagrams, and param-NAME outside Vega-Lite charts.
        justification: |
          An attribute of another input type is a mistake in the document; ignoring it would hide the mistake and
          produce a picture other than the one the author asked for.
        tests:
          - PictureAttributes_Build_InvalidAttribute_ThrowsTheLuaMessage

      - id: CanvasNetTool-PandocFilter-PictureAttributes-Defaults
        title: >-
          The PictureAttributes unit shall draw a .scad model at size 1600x1200 unless size or scale is given, on a
          white background unless one is given, with a triangle budget of 2000000, and shall draw page 1 of a .vsdx,
          .pptx, or .pdf file unless a page is given.
        justification: |
          A model has no natural size or background, and a budget keeps a model that previews from failing the build;
          a paged document needs a page, and the first page is what an author expects by default.
        tests:
          - PictureAttributes_Build_Model_AddsDefaultsAndSortsByBytes
          - PictureAttributes_Build_Document_NormalizesPageAndNumbers

      - id: CanvasNetTool-PandocFilter-PictureAttributes-Options
        title: >-
          The PictureAttributes unit shall write the drawing attributes as tool options of the form --name=value with
          normalized values (words in lowercase, whole numbers without leading zeros, and other numbers as C's %.15g
          writes them), one --define or --param option per variable or parameter, sorted by their bytes so that the
          order of the attributes does not change the options.
        justification: |
          The options are part of the picture's cache key; writing equal attributes as equal options lets an unchanged
          picture be reused whatever the order or spelling of its attributes, as the Lua filter did.
        tests:
          - PictureAttributes_Build_Model_AddsDefaultsAndSortsByBytes
          - PictureAttributes_Build_Document_NormalizesPageAndNumbers
          - PictureAttributes_FormatNumber_MatchesPrintfG15

      - id: CanvasNetTool-PandocFilter-PictureAttributes-Keep
        title: >-
          The PictureAttributes unit shall keep every attribute that is not a drawing attribute on the picture, in its
          original order, with a repeated key in its first position and with its last value.
        justification: |
          Attributes such as width, an id, or a class shape the picture in the output document and must survive the
          replacement of the picture's source; the order and the last-value rule match the Lua filter.
        tests:
          - PictureAttributes_Build_Model_AddsDefaultsAndSortsByBytes
          - PictureAttributes_BuildSvg_ReadsScaleOnly

      - id: CanvasNetTool-PandocFilter-PictureAttributes-Svg
        title: >-
          The PictureAttributes unit shall read only the scale attribute of an SVG drawing, as one --scale option per
          scale attribute in their order, and shall keep every other attribute of the drawing.
        justification: |
          An SVG drawing is flattened, not drawn, so only the scale of the replaced pictures applies; the other
          attributes belong to the drawing in the output document.
        tests:
          - PictureAttributes_BuildSvg_ReadsScaleOnly

      - id: CanvasNetTool-PandocFilter-PictureAttributes-MermaidBlocks
        title: >-
          The PictureAttributes unit shall draw a code block of class mermaid or plantuml (exact, the first of the two
          the
          block has) as that kind, shall name it in messages as mermaid block  # id or plantuml block  # id when it has
          an
          identifier and otherwise by its first non-blank line, trimmed and cut to 40 characters followed by ..., and
          shall split the last caption attribute off the other attributes of the block.
        justification: |
          A code block has no file name, so a message needs another way to point the author at the block; the caption
          becomes the caption of the figure rather than an attribute of the picture.
        tests:
          - PictureAttributes_BlockNameAndCaption_FollowTheLuaFilter

      - id: CanvasNetTool-PandocFilter-PictureAttributes-MathMl
        title: >-
          The PictureAttributes unit shall classify a picture whose name ends in .mml, in any letter case, as a MathML
          equation and draw a code block of class mathml (exact) as one, listing .mml among the picture name ends and
          mathml among the code-block classes; shall draw an equation at scale 2 unless size or scale is given, keeping
          an author's size, scale, and background as written; shall refuse theme, page, dpi, and the attributes of the
          other kinds on an equation with the message of the filter; and shall tell the engine to show an equation at
          its natural size only when none of size, width, and height is given, as an attribute or as a declaration of
          its style (property names in any letter case).
        justification: |
          An equation printed at twice its natural pixel size stays sharp on paper; showing it at its natural size
          keeps it at the size of the text around it whatever scale it was drawn at, while an author who sizes an
          equation, by attribute or by style, keeps that size.
        tests:
          - PictureAttributes_KindOf_Mml_IsMathMl
          - PictureAttributes_Build_MathMlPicture_DefaultsToScaleTwo
          - PictureAttributes_Build_MathMlTheme_IsRefused
          - PictureAttributes_PictureSuffixesAndBlockClasses_AreWhatTheEngineDraws
          - PictureAttributes_BlockNameAndCaption_FollowTheLuaFilter

      - id: CanvasNetTool-PandocFilter-PictureAttributes-EquationSize
        title: >-
          The PictureAttributes unit shall give an equation shown at its natural size the attribute width of its
          natural width in em of the 16 pixel font size it is measured at (the renderer's default font size), after
          the attributes that stay and with no height; and for an equation in running text shall also set the
          attribute style to display:inline;margin:0;vertical-align: minus its depth below the baseline in em (0 when
          it has none), followed by the author's own style declarations trimmed of a trailing semicolon.
        justification: |
          Pandoc's HTML writer turns a width in em into a style that browsers and WeasyPrint honor without
          presentational hints (a width in pixels becomes an HTML attribute that WeasyPrint ignores), and LaTeX and
          Word read it too; in em the equation follows the size of the text around it, in a 10 point PDF as in a
          16 pixel browser. Leaving out the height keeps the aspect ratio when a narrow column limits the width. In
          running text the style keeps the equation in the line even under a style sheet that makes pictures blocks
          and puts its baseline on the text's, and the author's declarations come later so they win.
        tests:
          - PictureAttributes_WithNaturalSize_DisplayAndRunningText_AreInEm
          - PictureAttributes_WithNaturalSize_AuthorStyleEndingInSemicolon_IsTrimmed
          - PictureAttributes_MathMlFontSize_IsTheRenderersDefault
          - PictureAttributes_Build_MathMlPicture_DefaultsToScaleTwo

      - id: CanvasNetTool-PandocFilter-PictureAttributes-VegaLiteBlocks
        title: >-
          The PictureAttributes unit shall draw a code block of class vega-lite or its alias vegalite (exact) as a
          Vega-Lite chart that takes the attributes of a .vl.json picture (size, scale, background, and param-NAME),
          and shall name it in messages by the class the author wrote (vega-lite block or vegalite block).
        justification: |
          A small chart is often clearer written in place than kept in a separate file, and both spellings of the
          format's name are in common use; naming the block by its own class points the author at the block as
          written.
        tests:
          - PictureAttributes_BlockOf_VegaLiteAndItsAlias_AreCharts
          - PictureAttributes_BlockName_NamesTheClassTheAuthorWrote

      - id: CanvasNetTool-PandocFilter-PictureAttributes-OpenScadBlocks
        title: >-
          The PictureAttributes unit shall draw a code block of class openscad (exact) as an OpenSCAD model only when
          the block also has the class draw (exact), taking the attributes and defaults of a .scad picture, shall leave
          a block of class openscad without draw alone, and shall name a drawn block in messages as an openscad block.
        justification: |
          Documentation often shows OpenSCAD source as highlighted code, so drawing every openscad block would replace
          examples their authors meant to show as code; the class draw makes the picture an explicit choice.
        tests:
          - PictureAttributes_BlockOf_OpenScadNeedsTheDrawClass
          - PictureAttributes_BlockName_NamesTheClassTheAuthorWrote
