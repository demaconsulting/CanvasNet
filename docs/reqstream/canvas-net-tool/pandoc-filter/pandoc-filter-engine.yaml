---
# Software Unit Requirements for the PandocFilterEngine Class
#
# The PandocFilterEngine class runs the logic of the former Lua filter (version 16) once for a whole Pandoc document:
# it plans every picture in the order Pandoc's Lua filter visited the elements (every Image, then every CodeBlock),
# looks each one up in the picture cache, draws the pictures that miss the cache (up to a number of jobs at once)
# through the IPictureDrawer seam (ToolPictureDrawer runs the render and flatten commands in-process), rewrites the
# elements in document order, and returns the warnings in the document metadata. A failure is the one of the lowest
# position, whatever the number of jobs.

sections:
  - title: PandocFilterEngine Unit Requirements
    requirements:
      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-Cache
        title: >-
          The PandocFilterEngine unit shall draw a picture that is not in the cache folder, use a picture already in
          the cache folder without drawing it again, and point the element at the cached picture with a src relative
          to the output while keeping the attributes that are not tool options.
        justification: |
          A documentation build redraws only the pictures whose inputs changed, and the same document produces the same
          output on every build; the attributes Pandoc understands (such as width) must reach the output.
        tests:
          - PandocFilterEngine_Run_CacheHit_DrawsNothing
          - PandocFilterEngine_Run_SvgDrawings_PlainMarkerAndFlattenedCopy

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-DuplicateKeys
        title: >-
          The PandocFilterEngine unit shall draw two or more pictures with the same cache key once, point all of them
          at the same file, and report the tool's notes only for the first of them.
        justification: |
          A picture used twice in a document must not be drawn twice, nor written by two jobs at the same time, and its
          notes must not be repeated.
        tests:
          - PandocFilterEngine_Run_DuplicateKey_DrawsOnce

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-UnsupportedDiagram
        title: >-
          The PandocFilterEngine unit shall leave a Mermaid or PlantUML diagram whose own type the tool does not draw
          (mermaid-diagram-unsupported or plantuml-diagram-unsupported) as written,
          warn that it is left as written and not drawn, record it in the cache so that a later build gives the same
          warning without drawing, and treat the same report about a picture embedded in a diagram as an ordinary
          warning.
        justification: |
          A diagram type CanvasNet does not draw must not break the build; the document keeps the code, and the author
          is told on every build, without the cost of starting the drawing again.
        tests:
          - PandocFilterEngine_Run_UnsupportedDiagram_LeftAsWrittenWithMarker
          - PandocFilterEngine_Run_PlantUmlBlocks_BecomeFigureOrAreLeftAsWritten

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-SvgDrawings
        title: >-
          The PandocFilterEngine unit shall point an SVG drawing that links a file only CanvasNet draws at its
          flattened copy, and leave a drawing the tool finds nothing to flatten in as written, with the tool's
          warnings on one line each recorded in the cache and reported again by a later build without drawing.
        justification: |
          An SVG drawing that links a diagram or model shows it in every reader only once flattened; a drawing with
          nothing to flatten stays a vector picture, and a broken link in it is reported on every build.
        tests:
          - PandocFilterEngine_Run_SvgDrawings_PlainMarkerAndFlattenedCopy

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-MermaidBlocks
        title: >-
          The PandocFilterEngine unit shall replace a code block of class mermaid with its drawn picture: a figure that
          carries the block's identifier and a Markdown placeholder for its caption attribute, or, without a caption, a
          paragraph whose picture carries the identifier; the other classes and the kept attributes stay on the picture.
        justification: |
          A diagram written inline in the document is published as a picture with its caption, its cross-reference
          identifier, and its layout attributes, as the Lua filter published it.
        tests:
          - PandocFilterEngine_Run_MermaidBlocks_BecomeFigureOrParagraph

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-PlantUmlBlocks
        title: >-
          The PandocFilterEngine unit shall replace a code block of class plantuml with its drawn picture as it replaces
          a Mermaid block (a figure with the caption and the identifier, or a paragraph), writing its text to the cache
          folder as a .puml file, dropping only the class plantuml and keeping the other classes and attributes, and
          naming the block plantuml block in its messages and in the scale hint of an oversized picture
          ({.plantuml scale=...}).
        justification: |
          A sequence or activity diagram written inline in the document is published like a Mermaid diagram, with its
          caption, cross-reference identifier, and layout attributes, and a message points at the right kind of block.
        tests:
          - PandocFilterEngine_Run_PlantUmlBlocks_BecomeFigureOrAreLeftAsWritten
          - PandocFilter_Run_PlantUmlPictureAndBlock_DrawnAndRedrawnWhenAnIncludeChanges

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-MathMlBlocks
        title: >-
          The PandocFilterEngine unit shall draw a .mml picture and replace a code block of class mathml with its drawn
          picture as it replaces a Mermaid block (a figure with the caption and the identifier, or a paragraph), writing
          its text to the cache folder as a .mml file and dropping only the class mathml; and shall give an equation
          whose attributes set no size, width, or height (as an attribute or in its style) the kept attribute
          width="Nem", N being the natural width of the equation (its width at scale 1 and the 16 pixel font size, read
          by a probe that does not draw it) over 16, on every run whether the picture is drawn or found in the cache,
          keeping an author's width, height, size, or sizing style without adding one, and leaving the attributes as
          written when the equation cannot be measured (the draw then reports the failure).
        justification: |
          An equation drawn at twice its natural size for print would show at twice the font size of the text if the
          document showed it at its pixel size; showing it at its natural width in em keeps every equation at the size
          of the text around it in every output (Pandoc writes an em width as a style that browsers and WeasyPrint
          honor), and the key of the cache does not depend on it, so a picture is never drawn again for it.
        tests:
          - PandocFilterEngine_Run_MathMlPictureAndBlock_AreDrawnAtTheirNaturalWidth
          - PandocFilterEngine_Run_MathMlWithWidth_KeepsTheAuthorsWidth
          - PandocFilterEngine_Run_MathMlPlainAndWithWidth_ShareOneDrawAndCacheFile
          - PandocFilter_Run_MathMlBlockWithCaption_BecomesAFigure

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-InlineEquations
        title: >-
          The PandocFilterEngine unit shall also set an equation picture that it shows at its natural size and that
          stands in running text (an image among other text or pictures of its line) inline on the text's baseline,
          using the depth below the baseline read by the same probe and keeping the author's style declarations after
          the filter's, and shall give a picture alone in its paragraph or figure and a code block the width only.
        justification: |
          An equation in a sentence must sit on the line of text at the text's height rather than break the line or
          float above it, in every downstream document built with Pandoc and WeasyPrint, without the author writing
          any style; an equation on its own is shown as a block, as the document's style sheet places pictures.
        tests:
          - PandocFilterEngine_Run_MathMlInASentence_SitsOnTheBaseline
          - PandocFilter_Run_MathMlBlockWithCaption_BecomesAFigure

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-MathElements
        title: >-
          The PandocFilterEngine unit shall replace each inline Code element of class canvasnet-math (which the Lua shim
          makes of a Math element when the document sets canvasnet-math to true, holding the MathML of the LaTeX, with
          the LaTeX in the attribute tex and display in the attribute display) with an equation picture drawn like a
          .mml picture, described by the LaTeX, sized at its natural width, and for inline math in running text placed
          on the text's baseline, while display math gets the width only.
        justification: |
          Pandoc already parses the LaTeX of a document and writes its MathML; drawing that MathML through the existing
          equation path gives every output format the same sized equations without a second math engine, and an
          equation that cannot be drawn is an error like any other picture.
        tests:
          - PandocFilterEngine_Run_MathElements_BecomeEquationPictures

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-VegaLiteBlocks
        title: >-
          The PandocFilterEngine unit shall replace a code block of class vega-lite or vegalite with its drawn picture
          as it replaces a Mermaid block (a figure with the caption and the identifier, or a paragraph), writing its
          text to the cache folder as a .vl.json file, passing its parameters to the tool, and dropping only the class
          that made it a picture.
        justification: |
          A chart written in place in a document is drawn like a chart file, so it takes the same attributes and cache;
          the other classes and attributes shape the picture in the output.
        tests:
          - PandocFilterEngine_Run_VegaLiteBlocks_BecomeFigureFromAVlJsonFile
          - PandocFilter_Run_VegaLiteAndOpenScadBlocks_DrawnWithTheirAttributes

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-OpenScadBlocks
        title: >-
          The PandocFilterEngine unit shall replace a code block of classes openscad and draw with its drawn picture as
          it replaces a Mermaid block, writing its text to the cache folder as a .scad file, drawing it with the model
          defaults, and dropping the classes openscad and draw; shall leave a code block of class openscad without
          draw exactly as written, writing and drawing nothing for it; and shall name both classes in the scale hint of
          an oversized model block ({.openscad .draw scale=...}).
        justification: |
          A plain openscad block is source an author shows as code, so it must stay code; a block marked draw is a
          picture, and a hint that can be pasted as is must keep the class that asks for the picture.
        tests:
          - PandocFilterEngine_Run_OpenScadBlocks_DrawnOnlyWithTheDrawClass
          - PandocFilterEngine_Run_OversizedOpenScadBlock_HintNamesBothClasses
          - PandocFilter_Run_VegaLiteAndOpenScadBlocks_DrawnWithTheirAttributes

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-BlockFiles
        title: >-
          The PandocFilterEngine unit shall stop the run with the code pandoc-filter-error, before anything is written
          or drawn, for a Vega-Lite code block that names a local data file or picture and for an OpenSCAD code block
          marked draw that includes or uses a file, with a message that names the block, the file, and its line, and
          says to put the source in a file and link it as a picture; and shall leave a remote data URL to the tool.
        justification: |
          The text of a code block is drawn from the cache folder, so a relative file name would be looked up there and
          the picture would silently miss its data or library; a located error with the fix lets the author move the
          source to a file picture, which finds its files beside it.
        tests:
          - PandocFilterEngine_Run_BlockNamingAFile_StopsWithAHintToUseAPicture
      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-Warnings
        title: >-
          The PandocFilterEngine unit shall return the warnings of a run, each the picture's name and a message, in the
          order the Lua filter visited the pictures (every image, then every code block), in the metadata key
          canvasnet-warnings.
        justification: |
          The Lua shim prints the warnings as Pandoc warnings; a fixed order lets the author compare builds.
        tests:
          - PandocFilterEngine_Run_DuplicateKey_DrawsOnce
          - PandocFilterEngine_Run_UnsupportedDiagram_LeftAsWrittenWithMarker
          - PandocFilterEngine_Run_SvgDrawings_PlainMarkerAndFlattenedCopy
          - PandocFilterEngine_Run_OneAndFourJobs_AreIdentical

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-Failures
        title: >-
          The PandocFilterEngine unit shall stop the run on a picture that cannot be drawn with a message that starts
          with drawing (or flattening) and the picture's name and ends with the tool's message and hint, with the
          tool's error code; on a picture a restrictive file-access mode denied with the code file-access-denied; and
          on an attribute error with the code pandoc-filter-error.
        justification: |
          A document must not be published with a picture silently missing or wrong; the message names the picture and
          the code tells a script what went wrong.
        tests:
          - PandocFilterEngine_Run_RestrictiveDenial_StopsTheBuild
          - PandocFilterEngine_Run_TwoFailures_ReportsTheLowestPosition
          - PandocFilterEngine_Run_PlanningAndDrawingFailures_LowestPositionWins

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-OversizedPicture
        title: >-
          When a picture lays out larger than the maximum image size and the tool names the scale that fits, the
          PandocFilterEngine unit shall stop the run with the code size-limit, the tool's message (the laid-out size,
          the limit, and that scale), and a hint that names the scale attribute of the code block or the picture
          instead of the command-line options.
        justification: |
          An author fixes an oversized diagram in the document, not on a command line, so the error must say which
          attribute to set and to what, for example {.mermaid scale=0.56}.
        tests:
          - PandocFilterEngine_Run_OversizedPicture_HintNamesTheScaleAttribute
          - PandocFilterEngine_Run_OversizedOpenScadBlock_HintNamesBothClasses

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-LowestPositionWins
        title: >-
          When several pictures fail, the PandocFilterEngine unit shall report the failure of the lowest position,
          whether it is a planning or a drawing failure and whatever the number of jobs.
        justification: |
          The Lua filter stopped at the first failure; drawing in parallel must not change which error the author sees.
        tests:
          - PandocFilterEngine_Run_TwoFailures_ReportsTheLowestPosition
          - PandocFilterEngine_Run_PlanningAndDrawingFailures_LowestPositionWins

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-WarningsBeforeFailure
        title: >-
          When a run fails, the PandocFilterEngine unit shall expose the warnings of the pictures before the failure, in
          document order and without those of later pictures, and shall expose none after a run that succeeds.
        justification: |
          The Lua filter printed the warnings of the earlier pictures before its error; the command prints them so the
          author sees the same output.
        tests:
          - PandocFilterEngine_Run_FailureAfterWarnings_KeepsTheEarlierWarnings

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-Determinism
        title: >-
          The PandocFilterEngine unit shall produce the same document, warnings, cache files, and reported failure for
          one job as for several jobs, committing pictures and markers into the cache strictly in document order and
          only below the first failure, and removing the temporary files of the jobs after it.
        justification: |
          Drawing in parallel is an optimization; a build must not depend on the number of processors, and a failed
          build must not leave pictures in the cache that a build with one job would not have drawn.
        tests:
          - PandocFilterEngine_Run_OneAndFourJobs_AreIdentical
          - PandocFilterEngine_Run_FailureWithOneAndFourJobs_LeavesTheSameCache
          - PandocFilterEngine_Run_TwoFailures_ReportsTheLowestPosition
          - PandocFilterEngine_Run_FailureAfterWarnings_KeepsTheEarlierWarnings

      - id: CanvasNetTool-PandocFilter-PandocFilterEngine-OtherPictures
        title: >-
          The PandocFilterEngine unit shall stop the run with an error that names the source for a missing picture of a
          kind it draws (not an SVG drawing), leave a missing SVG drawing, other pictures, remote pictures, and
          code blocks of other classes to Pandoc unchanged, and pass the rest of the document through unchanged.
        justification: |
          A missing diagram or model is an author's mistake to report; a missing SVG drawing is reported by Pandoc
          itself, and everything the filter does not handle must reach Pandoc exactly as it was.
        tests:
          - PandocFilterEngine_Run_MissingSourcesAndOtherPictures_FollowTheLuaFilter
          - PandocFilterEngine_Run_PicturesItDoesNotDraw_PassThroughUntouched
