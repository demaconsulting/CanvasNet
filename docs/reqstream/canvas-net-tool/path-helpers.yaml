---
# Software Unit Requirements for the PathHelpers Class
#
# The PathHelpers class provides safe path-combination utilities that protect against path-traversal
# attacks by rejecting relative paths whose combined, normalized path escapes the base directory
# (resolves outside it, or is rooted). A ".." segment that stays under the base directory (such as
# "a/../b") is allowed.

sections:
  - title: PathHelpers Unit Requirements
    requirements:
      - id: CanvasNetTool-PathHelpers-SafeCombine
        title: >-
          The PathHelpers class shall combine paths safely, rejecting a relative path whose combined,
          normalized path escapes the base directory.
        justification: |
          Prevents path-traversal vulnerabilities when constructing file paths from caller-supplied
          inputs. A relative path is rejected when the combined, normalized path resolves outside the
          base directory or is rooted; a ".." segment that stays under the base directory (such as
          "a/../b") is allowed because it cannot escape.
        tests:
          - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
          - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
          - PathHelpers_SafePathCombine_DoubleDotsInMiddle_ThrowsArgumentException
          - PathHelpers_SafePathCombine_AbsolutePath_ThrowsArgumentException
          - PathHelpers_SafePathCombine_NestedPaths_CombinesCorrectly
          - PathHelpers_SafePathCombine_CurrentDirectoryReference_CombinesCorrectly
          - PathHelpers_SafePathCombine_EmptyRelativePath_ReturnsBasePath
          - PathHelpers_SafePathCombine_DotDotPrefixedName_CombinesCorrectly
          - PathHelpers_SafePathCombine_DotDotThatStaysUnderBase_CombinesCorrectly
          - PathHelpers_SafePathCombine_NullBasePath_ThrowsArgumentNullException
          - PathHelpers_SafePathCombine_NullRelativePath_ThrowsArgumentNullException
