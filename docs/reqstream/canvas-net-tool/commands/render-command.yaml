---
# cspell:ignore scad openscad grayscale deskew
# Software Unit Requirements for the RenderCommand Class
#
# The RenderCommand class is the render command (alias convert) and the verb commands crop, resize,
# rotate, flip, and pad (the same class constructed with a verb): it loads an input file, applies the
# source options and the image pipeline (including the photo tools), and writes the result as PNG, JPEG, BMP,
# or TIFF, reporting it as one text line or one JSON document. The command is a shell: it parses the options
# (the transformation options with the ImagePipelineParser type of this unit) and prints the result, and the
# loading, the pipeline, and the writing are done by the ImageRenderer unit of the Viewer library.

sections:
  - title: RenderCommand Unit Requirements
    requirements:
      - id: CanvasNetTool-Commands-RenderCommand-Options
        title: >-
          The render command shall declare its options (page, all-pages, dpi, scale, width, height,
          size, background, no-auto-orient, strict, the model options view, azimuth, elevation,
          projection, define, time, default-color, and max-triangles, the chart option param, the diagram option theme,
          the pipeline options crop,
          resize, fit, allow-upscale, rotate, rotate-fill, flip, pad, pad-color, grayscale, invert,
          threshold, levels, brightness, contrast, auto-levels, auto-levels-clip, deskew, trim,
          trim-tolerance, grid, and filter, output, format,
          quality, and no-clobber) in one table that also drives the help (and is shared by the verb
          commands and the inspect command), shall read the source options in one reusable routine, and
          shall be registered under the names render and convert.
        justification: |
          Declaring the options once keeps the help from drifting from what the command accepts, and the
          alias lets users who think in terms of conversion find the command.
        tests:
          - RenderCommand_Metadata_DescribesCommandAndOptions
          - RenderCommand_DefaultRegistry_RegistersRenderAndConvert
          - RenderCommand_Usage_DescribesModelOptionsAndIncludeRule
          - RenderCommand_Help_ListsPipelineOptionsAndVerbs
          - RenderCommand_ReadSourceOptions_SameAsBefore

      - id: CanvasNetTool-Commands-RenderCommand-Pipeline
        title: >-
          The render command shall apply the operations crop, resize, fit, rotate, flip, and pad given as
          options to every page it loads, in the order they were written, after the source options have
          sized the source (so a vector source is never scaled twice) and before the output is written,
          using one decode and one encode; shall take the border color from the pad-color option, else
          from the background option, else white for a vector source and transparent for a raster; shall
          pass the background option on to the pipeline as the fill of a rotation; shall
          list each operation in order with its parameters and result size between the operations of
          the loader and the flattening of a JPEG; shall read every operation before anything is decoded
          so that a mistake in one is reported first, and shall write nothing, and leave an existing
          output untouched, when an operation fails.
        justification: |
          Agents combine operations (crop a region, shrink it, add a border) and expect the order of the
          options to be the order of the effects, in one pass over the pixels; the report says what was
          done, and a failure part way must never leave a partly transformed file.
        tests:
          - RenderCommand_Run_MultiOpJson_ListsOperationsInOrder
          - RenderCommand_Run_OperationOrder_CropThenResizeDiffersFromResizeThenCrop
          - RenderCommand_Run_RasterWithWidthAndCrop_LoaderResizesFirst
          - RenderCommand_Run_FilterWithRasterWidth_IsReportedWhenChosen
          - RenderCommand_Run_VectorWithWidthAndCrop_SizesOnceThenCrops
          - RenderCommand_Run_PadOnRaster_DefaultsToTransparentThenBackground
          - RenderCommand_Run_PadOnVector_DefaultsToTheBackgroundOfThePage
          - RenderCommand_Run_Fit_ShrinksOnlyUnlessUpscaleAllowed
          - RenderCommand_Run_ExifJpegThenRotate_RotatesTheUprightImage
          - RenderCommand_Run_MultiOpChain_EveryInputKind_WritesExpectedSize
          - RenderCommand_Run_AllPagesWithPipeline_AppliesToEveryPage
          - RenderCommand_Run_MultiOp_IsDeterministic
          - RenderCommand_Run_IdentityOperations_KeepThePixels
          - RenderCommand_Run_BadPipeline_IsExpectedErrorAndWritesNothing
          - RenderCommand_Run_FailingStep_LeavesExistingOutputUntouched
          - RenderCommand_Run_PadBeyondMaxDimension_IsRefusedWithSizeLimit
          - RenderCommand_Run_RotateFillAndBackground_ChooseFill

      - id: CanvasNetTool-Commands-RenderCommand-PhotoOptions
        title: >-
          The render command shall apply the photo operations grayscale, invert, threshold, levels,
          brightness, contrast, auto-levels (with auto-levels-clip), deskew, trim (with trim-tolerance), and
          grid, and the settings rotate-fill and filter of a rotation, given as options in the same
          ordered pipeline as the operations above, and shall report the angle and the confidence that
          deskew found, with every other parameter of each operation, in the JSON result.
        justification: |
          A photographed sketch is cleaned up by a chain of these operations in one invocation, and the
          numbers the operations chose (the threshold level, the skew angle) are the facts an agent needs
          from the result.
        tests:
          - RenderCommand_Run_PhotoOptions_AppearInHelpAndRunInOrder
          - RenderCommand_Run_DeskewJson_ReportsAngleAndConfidence

      - id: CanvasNetTool-Commands-RenderCommand-Verbs
        title: >-
          The commands crop, resize, rotate, flip, and pad shall each be the render command with one
          operation placed first, taken from a positional operand after the input (a geometry, a size,
          an angle (any number of degrees), an axis, or a border), shall accept every option of render, shall apply the
          operations given as options after the operand's, in the order written wherever they stand on
          the line, shall write exactly the file that the equivalent render invocation writes, shall
          report the verb as the command of a JSON result, and shall report a missing, extra, or
          malformed operand as a usage error.
        justification: |
          A single transformation is the most frequent request; a natural grammar for it spares the
          caller the output of a multi-option render command, while sharing the implementation guarantees
          the two always agree.
        tests:
          - RenderCommand_Verb_Metadata_DescribesVerbAndSharesRenderOptions
          - RenderCommand_Verb_UnknownVerb_ThrowsArgumentException
          - RenderCommand_Verb_EqualsRenderEquivalent_WritesIdenticalFiles
          - RenderCommand_Verb_ExtraPipelineOptions_AreAppliedAfterTheVerbOperation
          - RenderCommand_Verb_SameOptionAlsoGiven_VerbOperationIsFirst
          - RenderCommand_Verb_Json_NamesTheVerbAndListsItsOperation
          - RenderCommand_Verb_EveryInputKind_RotatesNaturalSize
          - RenderCommand_Verb_DocumentPageAndDpi_AreHonored
          - RenderCommand_Verb_MissingOrExtraArguments_AreUsageErrors
          - RenderCommand_Run_RotateVerbAnyAngle_MatchesRenderEquivalent

      - id: CanvasNetTool-Commands-RenderCommand-Scad
        title: >-
          The render command shall pass the view, azimuth, elevation, projection, variable definitions
          (repeatable, -D being the short name of define), time, default color, and triangle limit to the
          source loader for an OpenSCAD model, passing a view only when the view, azimuth, or elevation
          option is given (so that without one the SCAD library chooses the view: iso for a model with
          3D objects, top for a model that is entirely 2D, and the model's own view when it sets one),
          shall describe what it drew (the view that was used, its angles, the projection,
          size, background, definitions, and limits) in the render operation of the result, shall report
          the warnings, unsupported features, and echoed text of the model in the diagnostics and echo of
          the result (and, without the JSON option, on standard error), shall reject a view or projection
          that does not exist, a value that is malformed or
          out of range, and a model option given for an input that is not a model, and shall write no
          output for a model that fails.
        justification: |
          The options must reach the loader as typed, the result must say what picture was drawn so that an
          agent can reproduce or vary it (including the view that the library chose when none was asked
          for), and a model option that would be silently ignored on another kind
          of input is a mistake that deserves an error.
        tests:
          - RenderCommand_Run_ScadDefaults_Writes800SquareImage
          - RenderCommand_Run_EachView_WritesItsOwnImage
          - RenderCommand_Run_ViewAzimuthElevationProjection_AreReportedInTheOperation
          - RenderCommand_Run_ViewDefaultsDependOnTheDimensionsOfTheModel
          - RenderCommand_Run_FlatModelWithoutView_IsDrawnFlatFromTheTop
          - RenderCommand_Run_ModelSettingTheViewport_IsReportedAsACustomView
          - RenderCommand_Run_ViewOption_WinsOverTheModelViewport
          - RenderCommand_Run_Defines_ChangeTheImageAndAreReported
          - RenderCommand_Run_TimeDefaultColorAndMaxTriangles_AreReported
          - RenderCommand_Run_ScadDiagnosticsAndEcho_AreInTheJsonResult
          - RenderCommand_Run_ScadDiagnosticsAndEcho_AreWrittenToStandardErrorInTextMode
          - RenderCommand_Run_StrictWithUnsupportedFeature_FailsWithoutOutput
          - RenderCommand_Run_MaxTrianglesExceeded_FailsWithBudgetExceeded
          - RenderCommand_Run_ScadSizeOptions_FollowTheNaturalSize
          - RenderCommand_Run_ScadBackground_IsAppliedAndFlattenedForJpeg
          - RenderCommand_Run_ScadToEachOutputFormat_WritesDecodableFile
          - RenderCommand_Run_ScadTwice_WritesIdenticalBytes
          - RenderCommand_Run_BadModelOption_ThrowsUsageError
          - RenderCommand_Run_UnknownView_ListsTheViews
          - RenderCommand_Run_ModelOptionOnAnotherKind_ThrowsUsageError
          - RenderCommand_Run_PageTwoOfAModel_ThrowsPageOutOfRange
          - RenderCommand_Run_ModelWithSyntaxError_ThrowsScadError

      - id: CanvasNetTool-Commands-RenderCommand-VegaLite
        title: >-
          The render command shall render a Vega-Lite chart (a .vl.json or .vl file, or a .json file with a
          Vega-Lite schema) at the size the size options ask for (its laid-out natural size by default) over
          its own background, white by default, or the background color given, with no option of its own for a
          chart; shall read the local data files of a chart from the folder of its specification and below it
          only, with no option for another data folder and no network access; shall set the parameters of a chart
          only through the --param option (see the ChartParams requirement); shall describe what it drew (the
          size, the time zone, the background when given, and the parameters when given) in the
          render operation and the natural size in the input of the result; shall report the warnings and
          unsupported features of the chart in the diagnostics of the result (and, without the JSON option, on
          standard error) and, with the strict switch, fail
          with unsupported-feature and write no output; shall report an invalid chart as vega-lite-error; and
          shall name Vega-Lite charts in its usage text.
        justification: |
          A chart is rendered like any other vector source, so no new option is needed (the data files of a
          chart are those beside its specification); the result must say
          what picture was drawn so that an agent can reproduce it, the gaps of the renderer must be reported
          rather than silently skipped, and a bad chart must be a concise, coded error.
        tests:
          - RenderCommand_Run_VegaLite_WritesPngAndReportsFormat
          - RenderCommand_Run_VegaLiteSizeOptions_FollowTheNaturalSize
          - RenderCommand_Run_VegaLiteToEachOutputFormat_WritesDecodableFile
          - RenderCommand_Run_VegaLiteTwice_WritesIdenticalBytes
          - RenderCommand_Run_VegaLiteDiagnosticsAndStrict_AreReportedOrFail
          - RenderCommand_Run_VegaLiteDiagnostics_AreWrittenToStandardErrorInTextMode
          - RenderCommand_Run_VegaLiteError_UsesStableErrorCode
          - RenderCommand_Run_VegaLiteWithPageTwoOrModelOption_Fails
          - RenderCommand_Run_VegaLiteLocalDataResolvesRelativeToSpecFolder
          - RenderCommand_Usage_NamesVegaLite

      - id: CanvasNetTool-Commands-RenderCommand-ChartParams
        title: >-
          The render command, its verb commands and the inspect command shall accept the repeatable --param
          name=value option for a Vega-Lite chart (read by ArgumentReader.ParseParams), replace the default
          value of the parameter of that name in the specification with the value, lay the chart out again with the
          values before the size options are applied (so the natural size of the result and the picture are those of the
          parameterized chart), list the parameters in the params member of the render operation (in name order,
          the values as JSON), fail with vega-lite-error, naming the parameter and listing the declared names, for a
          name the specification does not declare, refuse the option for an input that is not a chart with a usage
          error that names the kind, and keep the model options (-D) a usage error for a chart; shall describe the
          option in the option table, the usage text and the vega-lite topic.
        justification: |
          A chart is parameterized (a threshold, the initial brush of a selection) without editing its file, and a
          mistake in a name must be loud on a command line; a separate option keeps -D, whose grammar is the one of
          the variables of a model (a vector is a list of numbers, not an object), for the variables of a model.
        tests:
          - RenderCommand_Run_ParamScalar_SetsTheParameterAndTheNaturalSize
          - RenderCommand_Run_ParamSelectionAndRepeat_TakeJsonAndLastWins
          - RenderCommand_Run_ParamUnknownName_IsVegaLiteErrorListingTheDeclaredNames
          - RenderCommand_Run_ParamErrors_AreReported
          - RenderCommand_Run_ParamOnAnotherKind_ThrowsUsageError
          - RenderCommand_Run_DefineOnAChart_StaysAUsageError
          - ToolHost_Invoke_ParamOnVerbAndInspect_IsAccepted
          - RenderCommand_OptionTable_DeclaresParam
          - RenderCommand_Usage_MentionsParamAndItsExampleRuns

      - id: CanvasNetTool-Commands-RenderCommand-Mermaid
        title: >-
          The render command shall render a Mermaid diagram (a .mmd or .mermaid file) at the size the size options ask
          for (the size Mermaid lays it out at by default) over white, or the background color given, with the theme
          option of the Theme requirement as its only option of its own; shall describe what it drew (the drawn size,
          the background, and the theme when one is set) in the render operation and the natural size and the mermaid
          format in the input of the result; shall report the warnings of the diagram (mermaid-warning with the
          specific code in detail and the line and column in location) and the constructs it does not draw (a diagram
          type that is not drawn yet is the diagnostic mermaid-diagram-unsupported with an empty picture) in the
          diagnostics of the result (and, without the JSON option, on standard error) and, with the strict switch, fail
          with unsupported-feature and write no output; shall report invalid text as mermaid-error with the hint of the
          library; and shall name Mermaid diagrams in its usage text.
        justification: |
          A diagram is rendered like any other vector source; the result must say what picture was drawn so that an
          agent can reproduce it, the diagram types that are not drawn yet must be reported rather than silently left
          empty, and a bad diagram must be a concise, coded error that says how to fix it.
        tests:
          - RenderCommand_Run_Mermaid_WritesTheDiagramAndDescribesIt
          - RenderCommand_Run_MermaidPie_IsUnsupportedDiagnosticThenStrictError
          - RenderCommand_Run_MermaidSequence_DrawsTheParticipants
          - RenderCommand_Run_MermaidClass_DrawsTheClassBoxes
          - RenderCommand_Run_MermaidWarningAndSyntaxError_FollowTheContract
          - RenderCommand_Metadata_DescribesCommandAndOptions

      - id: CanvasNetTool-Commands-RenderCommand-Theme
        title: >-
          The render command, its verb commands and the inspect command shall accept the --theme name option for a
          Mermaid diagram (one of default, base, dark, forest, and neutral, in any case, reported by its canonical
          name), draw the diagram in that theme unless the theme fragment of the input names another one (the fragment
          wins over the option) or the text of the diagram sets a theme itself (the text wins over both), refuse a name
          that is not a theme with a usage error that lists the themes, refuse the option for an input that is not a
          diagram with a usage error that names the kind, before anything is drawn, and describe the option in the
          option table, the usage text and the mermaid topic.
        justification: |
          A diagram is drawn in a theme the way Mermaid's own command line draws it, without editing its file, and a
          mistake in the name, or an option that would be silently ignored on another kind of input, must be loud on a
          command line.
        tests:
          - RenderCommand_Run_MermaidTheme_OptionFragmentAndTextPrecedence
          - RenderCommand_Run_MermaidThemeMistakes_AreUsageErrors
          - InspectCommand_Run_MermaidTheme_ReportsTheThemedColors
          - RenderCommand_Metadata_DescribesCommandAndOptions

      - id: CanvasNetTool-Commands-RenderCommand-InputFragments
        title: >-
          The render command and its verb commands shall read an input path that ends in a URL fragment
          (part.scad#view=top&def.width=20, report.pdf#page=3, chart.vl.json#param.cutoff=5, flow.mmd#theme=dark) with
          the grammar and the checks of the link of an SVG image (InputReference and SourceLoader.Probe), treating a
          number sign as the start of a fragment only when no file has that exact name, let the fragment override
          --page, --all-pages, --view, -D, --param and --theme for that input (variables and parameters by name), draw
          the page the fragment names as the only page, name the input with its fragment in the text result and report
          it in the fragment member of the input object of the JSON result, fail with the code image-fragment-invalid
          for a fragment or a value that cannot be used and with page-out-of-range for a page the file does not have
          (writing nothing), report a parameter the kind does not use, a parameter given twice and a chart parameter the
          chart does not declare as the warnings image-fragment-unknown-parameter, image-fragment-duplicate-parameter
          and vl-param-unknown (never as errors, not even with --strict), and describe the fragment in the usage text.
        justification: |
          A command line names a file the way a link does, so a page, a view, a variable or a chart parameter can be
          chosen without an option for each input, and a list of inputs (a montage of the versions of one model) can
          choose differently for each.
        tests:
          - InputFragment_RenderAndVerb_PageFragment_ChoosesThePage
          - InputFragment_TextResultAndInfo_NameTheFragment
          - InputFragment_OverridesTheCommandOptions_ForItsInput
          - InputFragment_VectorVariable_WorksByFragmentAndByOption
          - InputFragment_Render_VpdVariable_SetsTheScale
          - InputFragment_Chart_ParamFragment_SetsParametersAndWarnsAboutUnknownNames
          - InputFragment_UnknownAndDuplicateParameters_AreWarnings
          - InputFragment_RealFileWithHash_WinsAndLongestExistingFileIsThePath
          - InputFragment_MissingFile_IsInputNotFoundWithAHint
          - InputFragment_EveryCommand_MalformedFragment_FailsWithTheCode
          - InputFragment_OverTheLimits_IsInvalid
          - RenderCommand_Run_MermaidTheme_OptionFragmentAndTextPrecedence
          - InputFragment_Grammar_IsTheGrammarOfALink

      - id: CanvasNetTool-Commands-RenderCommand-Source
        title: >-
          The render command shall pass the size options (scale, width, height, or an exact size), the
          background color, the auto-orientation switch, the page, the resolution, and the strict
          switch to the source loader, and shall reject a size option combined with another way of
          choosing the size, a malformed or out-of-range value, and a size larger than 8192 pixels.
        justification: |
          The options must reach the loader unchanged, and contradictory or malformed ones must be
          reported as usage errors before any work is done.
        tests:
          - RenderCommand_Run_SizeOption_ResizesRaster
          - RenderCommand_Run_WidthAndHeightWithEquals_AreExact
          - RenderCommand_Run_InvalidSizeOrBackground_ThrowsUsageError
          - RenderCommand_Run_SizeBeyondMaximum_ThrowsSizeLimit
          - RenderCommand_Run_BackgroundTransparent_KeepsAlpha
          - RenderCommand_Run_JpegWithExif_AutoOrientUnlessDisabled
          - RenderCommand_Run_DpiAndSizeOptions_SizeThePage
          - RenderCommand_Run_TransparentBackground_KeepsAlphaInPngAndFlattensJpeg

      - id: CanvasNetTool-Commands-RenderCommand-Pages
        title: >-
          The render command shall render the page chosen with the page option (the first by default),
          or every page with the all-pages option, where the output names a directory (files named
          after the input and the page) or contains the placeholder {page}, which is replaced by the
          page number; shall report a page that does not exist, both page options together, and an
          output that would be the same file for every page, before any page is rendered; and shall
          render and encode every page to temporary files before touching any target, so that a render
          or encode failure on any page leaves no new or partial output and every existing output
          untouched, and then publish the outputs all or nothing (if a move fails, the targets already
          published are removed, every replaced target is restored, and the error is reported).
        justification: |
          Agents look at one slide or at every page of a document; one run with a predictable file
          naming spares them a loop, and checking every output first and touching no target until all
          pages are encoded leaves no half-written set of pages after a render or encode failure.
          Publishing through backups with rollback keeps the set all or nothing; each target is only ever
          replaced by a complete image, and only a failure to restore a backup itself can leave a
          previous file under its backup name, which is reported.
        tests:
          - RenderCommand_Run_DocumentDefaults_WritesFirstPage
          - RenderCommand_Run_AllPagesWithPlaceholder_WritesOneFilePerPage
          - RenderCommand_Run_AllPagesToDirectory_NamesFilesAfterInputAndPage
          - RenderCommand_Run_AllPagesWithoutPlaceholder_ThrowsUsageError
          - RenderCommand_Run_AllPagesOfSingleImage_WritesTheOutputAsGiven
          - RenderCommand_Run_PlaceholderWithPage_IsReplacedByThatPage
          - RenderCommand_Run_AllPagesWithOneExistingOutputAndNoClobber_WritesNothing
          - RenderCommand_Run_AllPagesWithLaterPageFailure_LeavesOutputsUntouched
          - RenderCommand_Run_AllPagesWithLaterPageFailureToNewFolder_WritesNoFile
          - RenderCommand_Run_AllPagesSucceeding_PublishesAllAndReplacesExisting
          - RenderCommand_Run_BadPageOptions_ThrowExpectedErrors

      - id: CanvasNetTool-Commands-RenderCommand-Strict
        title: >-
          The render command shall report the notes about pictures and constructs the libraries skip or
          approximate in the diagnostics of the result, with the page of each (and, without the JSON option, on
          standard error, each ending with the input and page), and with the strict
          option shall fail with the error code unsupported-feature instead and write no output.
        justification: |
          A caller must be able to choose between an image that is drawn as well as it can be, with a
          list of what is missing, and no image at all.
        tests:
          - RenderCommand_Run_UnsupportedFeature_IsReportedOrFailsWhenStrict
          - RenderCommand_Run_DocumentDiagnosticsInTextMode_NameTheInputAndPage
          - RenderCommand_Run_StrictWithUnsupportedFeature_FailsWithoutOutput
          - RenderCommand_Run_SvgEmbeddingOutsideFolder_WarnsAndDrawsTheRest
          - RenderCommand_Run_SvgEmbeddingMissingFile_WritesWarningLineToStandardError
          - RenderCommand_Run_SvgEmbeddingStrictUnresolved_FailsWithUnsupportedFeature
          - RenderCommand_Run_SvgEmbeddingModelWithUnsupportedFeature_IsNoteThenStrictError
          - RenderCommand_Run_SvgEmbeddingTooLargePicture_WarnsWithTooLargeCodeAndDrawsTheRest
          - RenderCommand_Run_SvgEmbeddingStrictTooLargePicture_FailsWithUnsupportedFeature
          - RenderCommand_Run_SvgEmbeddingPageBeyondTheLast_IsUnsupportedNoteAndDrawsTheRest
          - RenderCommand_Run_SvgEmbeddingStrictPageProblem_FailsWithUnsupportedFeature
          - RenderCommand_Run_SvgEmbeddingUnknownAndDuplicateParameters_AreWarningsEvenWhenStrict

      - id: CanvasNetTool-Commands-RenderCommand-SvgEmbed
        title: >-
          The render command shall render an SVG file whose image elements name a model, a chart, a diagram, another SVG
          file, a document page, or a raster in the folder of the SVG file or below it, choose the page of a
          document (or the view of a model) from the fragment of the link and draw page 1 without one, list each
          embedded file as an embed operation of the result with the link as written, report a page that does not
          exist (image-page-out-of-range) and a fragment that cannot be used (image-fragment-invalid) as unsupported
          notes that fail with unsupported-feature under the strict option while an unknown or duplicate parameter
          stays a warning, and fail with the error code of an embedded file that is found but broken (naming both
          files) and with no output written.
        justification: |
          The picture of a diagram is rendered by one command from the files beside it, a diagram can place any page
          of a document, and a broken part fails the whole picture with a message that says which file is at fault.
        tests:
          - RenderCommand_Run_SvgEmbeddingModelChartAndPicture_DrawsAllAndListsEmbeds
          - RenderCommand_Run_SvgEmbeddingHrefWithQuery_DrawsTheFile
          - RenderCommand_Run_SvgEmbeddingPageFragments_DrawsTheChosenPages
          - RenderCommand_Run_SvgEmbeddingBrokenModel_FailsWithScadErrorNamingBothFiles
          - RenderCommand_Run_SvgWithoutEmbeddedFiles_IsUnchangedAndStrictSafe

      - id: CanvasNetTool-Commands-RenderCommand-DiagnosticExtras
        title: >-
          The render, inspect, compare, and montage commands shall write the optional members detail, location, and
          origin of each diagnostic in the JSON result (through the ResultWriter) after the members they already
          wrote, shall write them for the notes of a model, a chart, and an embedded file, and shall leave a note
          without them, and the text output, unchanged.
        justification: |
          Every command that reports notes reports the same facts, so a caller reads them the same way whatever
          command produced them.
        tests:
          - RenderCommand_Run_ScadWarning_WritesDetailAndLocation
          - RenderCommand_Run_ScadUnsupportedFeature_WritesLocationWithoutDetail
          - RenderCommand_Run_VegaLiteWarning_WritesDetail
          - RenderCommand_Run_SvgEmbeddingNotes_WriteOriginAndOnlyWhatIsKnown
          - RenderCommand_Run_PlainNote_HasNoExtraMembers
          - InspectCommand_Run_ScadWarning_WritesDetailAndLocation
          - CompareCommand_Run_ScadWarning_WritesDetailAndLocation
          - MontageCommand_Run_ScadWarning_WritesDetailAndLocation

      - id: CanvasNetTool-Commands-RenderCommand-Output
        title: >-
          The render command shall write the output in the format of the output extension or of the
          format option, at the quality given (1 to 100, default 90), creating a missing output
          directory, and shall flatten transparency over the background (white by default) for JPEG.
        justification: |
          The output must be exactly what the caller asked for, and a JPEG has no transparency.
        tests:
          - RenderCommand_Run_PngToPng_WritesFileAndTextLine
          - RenderCommand_Run_Quality_ChangesJpegSizeAndIsValidated
          - RenderCommand_Run_FormatOption_OverridesExtension
          - RenderCommand_Run_TransparentToJpeg_FlattensOverBackground
          - RenderCommand_Run_OutputInNewDirectory_CreatesDirectory

      - id: CanvasNetTool-Commands-RenderCommand-Result
        title: >-
          The render command shall report the result as one text line for each output naming the
          output, its size, format, and bytes, the input, and for a document the page; or, with the JSON
          option, as one document with the tool, the input (with the page and the page count of a
          document), the operations applied, the outputs, the diagnostics, and the echoed text.
        justification: |
          A person needs a one-line confirmation, and an agent needs a stable structure that says what
          was done to produce the image.
        tests:
          - RenderCommand_Run_PngToPng_WritesFileAndTextLine
          - RenderCommand_Run_Json_HasDocumentedShape
          - RenderCommand_Run_SvgJson_ListsRenderAndFlattenOperations
          - RenderCommand_Run_DocumentJson_DescribesPageAndOperations
          - RenderCommand_Run_RasterJson_HasNoPageFields

      - id: CanvasNetTool-Commands-RenderCommand-Overwrite
        title: >-
          The render command shall overwrite an existing output by default, refuse it when no-clobber is
          given, refuse an output that is the input, and report an output problem before decoding the
          input.
        justification: |
          Agents iterate on an output file, but must never lose the input or a file they asked to keep;
          reporting the problem first avoids wasted work.
        tests:
          - RenderCommand_Run_ExistingOutput_OverwrittenUnlessNoClobber
          - RenderCommand_Run_OutputProblemWithHugeInput_ReportsOutputProblemFirst
          - RenderCommand_Run_OutputIsInput_ThrowsSameInputOutput

      - id: CanvasNetTool-Commands-RenderCommand-Errors
        title: >-
          The render command shall report a missing, corrupt, or unsupported input (including a damaged
          document) as an expected error
          and write no output, shall report a missing output, a wrong number of inputs, or an unknown
          option as a usage error, and shall reject null arguments.
        justification: |
          Mistakes must produce stable, actionable errors, and a failed render must not leave a partial
          output.
        tests:
          - RenderCommand_Run_BadInput_ThrowsToolExceptionAndWritesNothing
          - RenderCommand_Run_TruncatedDocument_ThrowsCorruptInputAndWritesNothing
          - RenderCommand_Run_CommandLineMistakes_ThrowUsageError
          - RenderCommand_Run_NullArguments_ThrowsArgumentNullException

      - id: CanvasNetTool-Commands-RenderCommand-ScadAnchors
        title: >-
          The render command shall write, in the JSON result of an OpenSCAD model only, an anchors array with
          the name, the world point, the pixel (rounded to three decimals, or null when unknown), and the
          inside flag of every anchor in echo order, with the pixels of the written image (moved through the
          pipeline steps and scaling with the size of the render) and inside tested against the size of the
          written image, an empty array for a model without anchors and no member for any other input, and
          shall leave the text output unchanged, with the echo lines on standard error only.
        justification: |
          The written image is what a callout is drawn on, so the numbers are given for it, and a result that
          is not a model keeps exactly the document it had.
        tests:
          - RenderCommand_Run_ScadAnchors_JsonListsAnchorsThatMatchTheWrittenImage
          - RenderCommand_Run_ScadWithoutAnchorsAndOtherSources_EmptyArrayOrNoMember
          - RenderCommand_Run_ScadMalformedAnchor_IsADiagnosticAndNotInTheArray
          - RenderCommand_Run_ScadAnchorsInTextMode_StdOutIsUnchangedAndEchoGoesToStdErr
          - RenderCommand_Run_ScadAnchorsWithLargerSize_ScalePixels
          - RenderCommand_Run_ScadAnchorsThroughPipelineSteps_MoveWithThePixels
          - RenderCommand_Run_ScadAnchorsThroughRightAngleRotation_MoveWithThePixels
          - RenderCommand_Run_ScadAnchorsThroughArbitraryRotation_StayOnTheExpandedCanvas
          - RenderCommand_Run_ScadAnchorOutsideTheCrop_IsNotInside
          - RenderCommand_Run_ScadAnchorBehindThePerspectiveEye_HasNullPixel
