---
# Software Unit Requirements for the HelpTopics Class
#
# The HelpTopics class is the command-line layer of the help cards. The cards about the drawing and file formats (what
# a file may contain, style, composition, positions, errors, limits, and file access) are the library catalog of the
# Viewer (the HelpCatalog unit of the CanvasNetViewer Help subsystem), which a library host reads programmatically.
# The tool layers on that catalog its own cards (the json result documents and the pandoc filter) and, for library
# cards, overlays that add the command-line sections (the flags, the command examples, shell quoting, and the commands
# that render, inspect, compare, montage, and flatten), so that a command-line user sees one card per subject. The class
# keeps the seventeen help topics in their fixed order, resolves a card by its path of names or aliases with a usage
# error for an unknown card, writes the links of a card as the canvasnet help commands that print their targets, and
# renders a card, the tree, and the examples as plain text or as the help JSON documents.

sections:
  - title: HelpTopics Unit Requirements
    requirements:
      - id: CanvasNetTool-Commands-HelpTopics-Catalog
        title: >-
          The HelpTopics class shall provide a tree of help cards made of the library help catalog of the Viewer, the
          tool's own cards, and the tool's command-line sections of library cards, whose root cards are the seventeen
          topics scad, vega-lite, mermaid, plantuml, svg, pdf, pptx, vsdx, raster, style, composition, positions, json,
          errors, limits, files, and pandoc, in that fixed order, each card with a title, a one-line summary, tags, and
          a body, shall resolve a card by a path of names or aliases (a root, then a card below each previous one,
          ignoring case, with the words separate or joined by a slash), and shall give no root a name or alias that is
          the name or alias of another root, of a command, or of the help subjects help and topics.
        justification: |
          A person or an agent learns the formats and the limits of the tool from the tool itself, offline and in the
          version it has installed; the knowledge about the formats is shared with the library, and stable names and
          aliases that never collide make every path select exactly one card.
        tests:
          - HelpTopics_All_EveryCardLoads_WithTitleSummaryAndBody
          - HelpTopics_Find_EveryAlias_ResolvesIgnoringCase
          - HelpTopics_Names_DoNotCollideWithCommandsHelpOrEachOther
          - HelpTopics_ChildNames_AreUniqueAmongSiblings
          - HelpTopics_Resolve_PathsAndAliases_FindTheCard
          - HelpTopics_Resolve_UnknownChild_ThrowsUsageErrorListingChildren
          - HelpTopics_Text_HasNoUnresolvedTokens

      - id: CanvasNetTool-Commands-HelpTopics-Overlays
        title: >-
          The HelpTopics class shall ship as its own card files only cards of the json and pandoc topics and overlays
          that extend the library card at their own path, shall show for a card an overlay extends the library card's
          body with its links written as commands followed by the overlay's body (which starts with the Command line
          section), the related cards and examples of the library card followed by the overlay's, and the overlay's
          title and summary where it gives them, and shall keep every command example in its own card files.
        justification: |
          The library cards describe the formats in library terms, so the command-line details must come from the tool;
          appending them to the same card keeps one card per subject, as rich on the command line as before, without
          the library carrying command-line text.
        tests:
          - HelpTopics_ToolResources_AreOverlaysOfLibraryCardsOrToolCards
          - HelpTopics_OverlayCards_BodyIsTheLibraryBodyThenTheOverlayBody
          - HelpTopics_Tree_ResourcesAreExactlyTheToolCardsAndOverlays
          - HelpTopics_Examples_NamesUniqueKindsValidAndSourcesNonEmpty

      - id: CanvasNetTool-Commands-HelpTopics-CommandLineLinks
        title: >-
          The HelpTopics class shall write every link of a card body as the command that prints its target (canvasnet
          help a b for a card, canvasnet help a b --example name for an example of a card, and --example name for an
          example of the card being read), in the text and in the JSON documents, never as link markup or in the words
          of the library.
        justification: |
          A command-line reader follows a link by running it; a link that states its exact command lets an agent follow
          it without guessing.
        tests:
          - HelpTopics_CommandLineText_WritesLinksAsHelpCommands
          - HelpTopics_OverlayCards_BodyIsTheLibraryBodyThenTheOverlayBody

      - id: CanvasNetTool-Commands-HelpTopics-TreeIntegrity
        title: >-
          The HelpTopics class shall load exactly the embedded tool card files, shall require every child and related
          card of the combined tree to name another card once, so that every card is reachable from a topic, and shall
          keep a card body free of a top-level heading and of the headings of the generated footer, with every fenced
          code block closed and naming its language.
        justification: |
          A link that leads nowhere, a card that no path reaches, or a body that breaks the footer would make the help
          lie about its own structure; checking the combined tree keeps every path and link valid.
        tests:
          - HelpTopics_Tree_ChildrenAndSeeAlsoResolve
          - HelpTopics_Tree_ResourcesAreExactlyTheToolCardsAndOverlays
          - HelpTopics_ChildNames_AreUniqueAmongSiblings
          - HelpTopics_Bodies_DoNotUseReservedHeadingsOrTopLevelHeadings

      - id: CanvasNetTool-Commands-HelpTopics-SizeBudget
        title: >-
          The HelpTopics class shall keep the text of every card, with its command-line section, at most 7,000
          characters, the text of a root card that has cards below it at most 4,000 characters, and every summary on
          one line of at most 60 characters for a root card and 100 characters for any other card.
        justification: |
          The readers are mostly agents with a limited context: a short card costs few tokens, and a short index card
          lets them find the right card before reading it; the command-line section adds a little to the library card.
        tests:
          - HelpTopics_Cards_FitTheSizeBudget

      - id: CanvasNetTool-Commands-HelpTopics-FormatContent
        title: >-
          The HelpTopics class shall give the cards of each input format (scad, vega-lite, mermaid, plantuml, svg, pdf,
          pptx, vsdx, and raster) the sections of what is supported, what is not supported, the options that apply,
          the diagnostics and how the strict option treats them, and the known differences from the original program,
          and at least two examples, command examples included.
        justification: |
          Whether a feature will render, and how to ask for it on the command line, is the first question about a
          format; an answer that always has the same parts can be found without trial and error.
        tests:
          - HelpTopics_FormatTopics_SubtreesHaveSupportedUnsupportedOptionsDiagnosticsDifferencesAndExamples

      - id: CanvasNetTool-Commands-HelpTopics-Examples
        title: >-
          The HelpTopics class shall give each example of a card a name unique below its root and a kind (source text,
          a command line that starts with canvasnet, or a snippet), shall find an example of a card or of a card below
          it, shall return the source text of an example exactly as it ships, or the command line of a command example,
          shall print every example of a card in full (its name, kind, file name, description, and content in a code
          fence that its content cannot end) followed by the cards below it that have examples, each with the command
          that prints them, shall report an unknown example name as a usage error listing the names of the examples,
          and shall ship command lines (in examples and in the code blocks of a card) that use known commands, options,
          and help cards.
        justification: |
          A tiny example that is known to work is the fastest way to start with a format; an example that is printed
          alone can be saved to a file and used as it is, and a command line that is verified cannot mislead.
        tests:
          - HelpTopics_Examples_NamesUniqueKindsValidAndSourcesNonEmpty
          - HelpTopics_CommandExamples_UseKnownCommandsAndOptions
          - HelpTopics_RenderExample_UnknownName_ThrowsUsageErrorListingNames
          - HelpTopics_RenderExample_Source_ReturnsExactEmbeddedContent
          - HelpTopics_RenderExamples_CardWithExamples_PrintsEachExampleInFull
          - HelpTopics_RenderExamples_IndexCard_ListsCardsBelowWithExamples
          - HelpTopics_CodeFence_IsLongerThanAnyBacktickRunInTheContent

      - id: CanvasNetTool-Commands-HelpTopics-Rendering
        title: >-
          The HelpTopics class shall render a card as plain text without color codes and with the same bytes every
          time - its title, summary, aliases, and body, followed by the cards below it, its examples, and its See also
          links, each link with the command that prints the target and the summary of the target - with the generated
          lines wrapped to a fixed width without splitting a word; shall render the whole tree as one line per card
          with its path and summary; and shall render a card as a JSON document with the kind card and the id, aliases,
          tags, title, summary, body, children, seeAlso, and examples of the card, in that order, the tree as a JSON
          document with the kind topics whose entries carry the tags of each card, the examples of a card as a JSON
          document with the kind examples, and one example as a JSON document, all of schema version 2.
        justification: |
          The text is read in terminals and pasted into other tools, so it must be plain and stable; agents parse the
          JSON, so its shape is a versioned contract, and the tags are added to it without breaking a reader of the
          earlier documents.
        tests:
          - HelpTopics_RenderText_IsDeterministicPlainAndWrapped
          - HelpTopics_AppendWrapped_LongWord_IsNotSplit
          - HelpTopics_RenderJson_HasTheDocumentedShape
          - HelpTopics_RenderTopics_ListsEveryCard
          - HelpTopics_RenderExamplesJson_HasTheDocumentedShape

      - id: CanvasNetTool-Commands-HelpTopics-Consistency
        title: >-
          The HelpTopics class shall state on the command line only facts verified against the tool: the options named
          in a card shall be options of the render command or global options, the merged errors codes card shall list
          every error code with the codes only the tool reports (operation-failed, threshold-failed, and
          pandoc-filter-error) in its command-line section, the diagnostic identifiers cited in the tool's cards and
          overlays shall be identifiers the library cards cite, the file types the svg embedding card lists shall be
          those the formats command lists, the json diagnostics card shall describe the detail, location, and origin
          members of a diagnostic, and the scad and vega-lite cards, the formats listing, and the render usage shall
          point to the image linking of the svg cards.
        justification: |
          Help that disagrees with the program is worse than no help; checking the command-line content against the
          tool makes every statement of it a tested statement, as the library does for its cards.
        tests:
          - HelpTopics_OptionTerms_ExistInTheRenderOptionTable
          - HelpTopics_ErrorsTopic_ListsEveryErrorCode
          - HelpTopics_ToolCards_CiteOnlyDiagnosticIdsTheLibraryCites
          - HelpTopics_SvgTopic_ImageHrefFileTypes_MatchTheFormatsCommand
          - HelpTopics_JsonDiagnosticsCard_DocumentsDetailLocationAndOrigin
          - HelpTopics_ImageHrefLinking_IsCrossReferencedFromScadVegaLiteFormatsAndRender
          - HelpTopics_Text_HasNoUnresolvedTokens

      - id: CanvasNetTool-Commands-HelpTopics-ParamAndFragmentPrefixes
        title: >-
          The HelpTopics class shall document in the vega-lite options card the --param option (its value grammar, that
          an unknown name is a vega-lite-error, that only a chart takes it, and the matching fragment of a link), in the
          svg fragments card the prefixed fragment parameters (def.name sets a model variable like -D, param.name sets a
          chart parameter like --param, the case rules, and the codes image-fragment-invalid, vl-param-unknown, and
          image-fragment-unknown-parameter), in the svg options card that the last of the warnings stays a warning under
          the strict option, and in the scad views and svg fragments cards that def.$vpr=[90-elevation,0,azimuth] draws
          what the azimuth and elevation options draw, with the quoting of the $ in a shell.
        justification: |
          The model variables and the chart parameters of an embedded file are set from the link, where nothing else
          shows that they exist; an agent finds them and their command-line equivalents in the cards of the file type
          and of the link.
        tests:
          - HelpTopics_ParamOptionAndFragmentPrefixes_AreDocumented
          - HelpTopics_ScadViewsAdvice_VprFragment_EqualsAzimuthAndElevation

      - id: CanvasNetTool-Commands-HelpTopics-InputFragments
        title: >-
          The HelpTopics class shall document the fragment of an input path in the svg fragments card (the grammar of a
          link, the rule for the number sign, the quoting in a shell, the overrides of the options of the command, the
          codes and that the warnings stay warnings), a fixed camera for a montage in the scad cards, the page fragment
          in the cards of the document formats, the param fragment in the vega-lite cards and the code
          image-fragment-invalid in the errors cards, and the usage text of every command that takes an input shall
          mention it.
        justification: |
          A fragment on a path is not visible in any option table; an agent finds it from the cards of the file type
          and from the usage of the command it runs.
        tests:
          - HelpTopics_InputFragments_AreDocumentedInTopicsAndUsages
          - HelpTopics_ErrorsTopic_ListsEveryErrorCode

      - id: CanvasNetTool-Commands-HelpTopics-CommandLineGuidance
        title: >-
          The HelpTopics class shall give in the command-line sections the commands that carry out the advice of the
          library cards: in the svg framed-figure card the read-positions command, whose reported pixel of a node in
          the picture rendered at the size of its box is on the node, and the commands that render the picture at the
          size of its box with a labeled grid and read a pixel with inspect pixel on the source at that size, which
          reads the same pixel as the picture rendered alone; and in the positions selectors card the quoting of a
          selector for bash, PowerShell 7.3 or later, and cmd, which reaches the tool as the selector itself.
        justification: |
          An agent follows the commands of a card literally; a command that is checked by running it lands the callout
          on the feature and survives the shell.
        tests:
          - HelpTopics_FramedFigureAdvice_ReadPositions_PixelIsOnTheNode
          - HelpTopics_FramedFigureAdvice_GridAndInspectPixel_ReadThePictureAtTheBoxSize
          - HelpTopics_PositionsSelectors_ShellQuoting_ReachesTheToolIntact

      - id: CanvasNetTool-Commands-HelpTopics-FlattenGuideParity
        title: >-
          The HelpTopics class shall give in the svg flatten card, bullet for bullet and in order (the library's
          Reference bullets, then the Command line bullets), the same terms and meanings as the flatten reference list
          of the tool user guide, word for word, and shall document the flatten command in the json and limits cards.
        justification: |
          People read the guide and agents read the help; both must describe what flatten replaces, keeps, and refuses
          in the same words, and a row added to one and not the other would tell one of them something untrue.
        tests:
          - HelpTopics_SvgTopic_FlattenItems_MatchUserGuide
          - HelpTopics_CommandExamples_UseKnownCommandsAndOptions

      - id: CanvasNetTool-Commands-HelpTopics-FileAccess
        title: >-
          The HelpTopics class shall provide the files card (aliases file-access and links) with the sections Modes,
          Options, In every mode, Diagnostics, Command line, and The Pandoc filter, describing the modes any, roots,
          no-symlinks, and roots,no-symlinks, the options `--file-access` and `--allow-root`, what holds in every mode,
          the diagnostics image-access-denied and file-access-denied (with their live codes), and the variables
          CANVASNET_FILE_ACCESS and CANVASNET_ROOTS that the Pandoc filter reads; and the svg and errors cards shall
          point to it.
        justification: |
          A user or an agent about to process a document it does not trust must learn from the tool itself which files
          a document can make it read and how to confine them; the codes and variables are verified against the code
          and the filter, so the card cannot promise what the tool does not do.
        tests:
          - HelpTopics_FilesTopic_DocumentsModesOptionsDiagnosticsAndPandoc
          - HelpTopics_Find_EveryAlias_ResolvesIgnoringCase
          - HelpTopics_OptionTerms_ExistInTheRenderOptionTable
          - HelpTopics_CommandExamples_UseKnownCommandsAndOptions

      - id: CanvasNetTool-Commands-HelpTopics-FileAccessGuideParity
        title: >-
          The HelpTopics class shall give every bullet of the files card, in order, the term and text of an item of the
          File Access Reference list of the tool user guide, word for word.
        justification: |
          The guide and the card are two views of the same reference; a test that compares them bullet by bullet keeps
          them from drifting apart.
        tests:
          - HelpTopics_FilesTopic_Items_MatchUserGuide
