---
# cspell:ignore luma otsu grayscale gamma percentile percentiles midtone midtones
# Software Unit Requirements for the ImageAdjustments Class
#
# The ImageAdjustments class adjusts the tone and color of the pixels of a surface in place: luma, grayscale, invert,
# fixed and Otsu thresholds, levels, brightness, and contrast tables, and the auto-levels stretch. It works on
# surfaces only: it knows nothing of files, options, or commands. Its arithmetic is exact integer arithmetic wherever a
# number decides a pixel, its parallel loops write disjoint rows, and its histograms are summed in fixed blocks, so the
# results are the same on any number of cores.

sections:
  - title: ImageAdjustments Unit Requirements
    requirements:
      - id: CanvasNetTool-Imaging-ImageAdjustments-Luma
        title: >-
          The ImageAdjustments class shall calculate the luma of an opaque pixel as (77 R + 150 G + 29 B + 128)
          shifted right by 8 bits, and the luma of a translucent pixel as the luma of the pixel flattened over
          white, (Y A + 255 (255 - A) + 127) divided by 255 with integer division, so that a fully transparent
          pixel has the luma 255.
        justification: |
          Every tone operation, the histogram, and the skew estimation must agree on one brightness of a pixel;
          fixed-point weights give the same number on every machine, and flattening over white treats transparent
          paper as the white it will look like.
        tests:
          - ImageAdjustments_Luma_OpaqueAndTranslucentPixels_UsesFixedPointWeightsOverWhite

      - id: CanvasNetTool-Imaging-ImageAdjustments-Grayscale
        title: >-
          The ImageAdjustments class shall replace the red, green, and blue of each pixel with the luma of its own
          color, leaving the alpha unchanged and a gray pixel unchanged.
        justification: |
          A gray copy of a photograph is the first step of reading ink strokes; keeping the alpha channel means the
          operation never makes a transparent area visible.
        tests:
          - ImageAdjustments_Grayscale_ColorPixels_SetsEqualChannelsAndKeepsAlpha
          - ImageAdjustments_Grayscale_AlreadyGray_IsUnchanged

      - id: CanvasNetTool-Imaging-ImageAdjustments-Invert
        title: >-
          The ImageAdjustments class shall replace each of the red, green, and blue channels of each pixel with
          its complement from 255, leaving the alpha unchanged, so that inverting twice restores the original.
        justification: |
          Light marks on a dark ground must be turned into dark marks on a light ground for the operations that
          assume the latter, and an inversion that is its own inverse is easy to reason about and to verify.
        tests:
          - ImageAdjustments_Invert_Pixels_ComplementsColorAndKeepsAlpha
          - ImageAdjustments_Invert_Twice_RestoresOriginal

      - id: CanvasNetTool-Imaging-ImageAdjustments-Threshold
        title: >-
          The ImageAdjustments class shall turn each pixel into opaque white when its luma over white is greater
          than a level from 0 to 255, and into opaque black otherwise.
        justification: |
          A pure black and white picture is the clearest input for reading strokes; basing the decision on the
          luma over white makes a translucent pixel behave as it looks, and an opaque result needs no further
          flattening.
        tests:
          - ImageAdjustments_Threshold_FixedLevel_WhiteOnlyAboveLevel
          - ImageAdjustments_Threshold_TranslucentPixel_UsesLumaOverWhiteAndIsOpaque

      - id: CanvasNetTool-Imaging-ImageAdjustments-Otsu
        title: >-
          The ImageAdjustments class shall choose the automatic threshold of a 256-bin luma histogram as the level
          from 0 to 254 that maximizes the between-class variance, calculated with exact 64-bit integer sums,
          taking the middle of the first and last of the levels that tie ((first + last) / 2 with integer
          division) and returning 127 when no level has pixels on both sides.
        justification: |
          Otsu's method picks a threshold from the image itself, so that a photograph needs no trial and error;
          exact sums and a rule for ties make the chosen level, which the tool reports, the same on every machine.
        tests:
          - ImageAdjustments_OtsuThreshold_TwoLevels_ReturnsMiddleOfGap
          - ImageAdjustments_OtsuThreshold_SingleLevel_ReturnsFallback127
          - ImageAdjustments_OtsuThreshold_UnevenClasses_SeparatesModes

      - id: CanvasNetTool-Imaging-ImageAdjustments-Levels
        title: >-
          The ImageAdjustments class shall build a 256-entry levels table from a black level from 0 to 254, a white
          level from 1 to 255 above it, and a gamma from 0.1 to 10, in which the entry for a level v is 255 times
          the clamped fraction (v - black) / (white - black) raised to 1 / gamma, rounded half away from zero, and
          shall reject a value outside these ranges.
        justification: |
          Levels are the standard way of stretching the useful range of a photograph and of lifting its midtones;
          a documented formula lets a user and a test predict every output level.
        tests:
          - ImageAdjustments_BuildLevelsTable_BlackWhiteGamma_MapsEndpointsAndMidtone
          - ImageAdjustments_BuildLevelsTable_InvalidRange_Throws

      - id: CanvasNetTool-Imaging-ImageAdjustments-BrightnessContrast
        title: >-
          The ImageAdjustments class shall build a brightness table that adds an amount from -255 to 255 to each
          level and clamps, and a contrast table for a contrast from -100 to 100 that maps a level v to the
          clamped, rounded value of f (v - 128) + 128 with f = 259 (C + 255) / (255 (259 - C)) and
          C = contrast * 255 / 100 (the identity at 0, pivoting at 128), and shall apply any 256-entry table to
          the red, green, and blue of every pixel in place, leaving the alpha unchanged.
        justification: |
          Brightness and contrast are the two adjustments a user reaches for first; table-based application
          makes all tone operations cost one pass and keeps a gray pixel gray.
        tests:
          - ImageAdjustments_BuildBrightnessTable_ShiftsAndClamps
          - ImageAdjustments_BuildContrastTable_PivotsAtMidGray
          - ImageAdjustments_ApplyTable_Pixels_MapsRgbAndKeepsAlpha

      - id: CanvasNetTool-Imaging-ImageAdjustments-AutoLevels
        title: >-
          The ImageAdjustments class shall find the auto-levels black and white points of a luma histogram as the
          smallest level whose cumulative count from black, and the largest level whose cumulative count from
          white, is at least k = max(1, ceil(N p / 100)) pixels for N pixels and a clip p from 0 to 20 percent,
          shall report a flat image (points less than one level apart, or no pixels) as having no range, and shall
          stretch the red, green, and blue of an image from the points to 0 and 255 with a levels table of gamma 1.
        justification: |
          A photograph taken in poor light uses a narrow band of levels; a percentile stretch ignores a few specks
          at either end, follows luma so that hues are preserved, and leaves an image with no contrast alone
          instead of amplifying noise.
        tests:
          - ImageAdjustments_AutoLevelsRange_ClipPercent_PicksPercentilePoints
          - ImageAdjustments_AutoLevelsRange_FlatImage_ReturnsNull
          - ImageAdjustments_AutoLevels_LowContrastImage_StretchesToFullRange

      - id: CanvasNetTool-Imaging-ImageAdjustments-Deterministic
        title: >-
          The ImageAdjustments class shall give the same pixels and the same histogram when the same operations are
          applied to the same pixels twice, on any number of cores, by processing rows in parallel with disjoint
          output and summing histograms in fixed blocks of 64 rows merged in block order.
        justification: |
          Results are compared, cached, and checked into source control; they must not depend on how many cores
          ran the work or on how it was scheduled.
        tests:
          - ImageAdjustments_Operations_SameInputTwice_ProduceIdenticalPixels
          - ImageAdjustments_LumaHistogram_LargeImage_MatchesSequentialReference
          - ImageAdjustments_ApplyTable_LargeImage_MatchesPerPixelReference

      - id: CanvasNetTool-Imaging-ImageAdjustments-Arguments
        title: >-
          The ImageAdjustments class shall reject a null surface, a threshold outside 0 to 255, a brightness outside
          -255 to 255, a contrast that is not a number from -100 to 100, a clip that is not a number from 0 to 20,
          and a table or histogram that does not have 256 entries (or has a negative count).
        justification: |
          Each of these is a defect of the caller (the pipeline validates user input first) and must fail fast and
          clearly.
        tests:
          - ImageAdjustments_NullOrOutOfRangeArguments_Throw
