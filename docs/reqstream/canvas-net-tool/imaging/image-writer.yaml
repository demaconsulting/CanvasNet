---
# Software Unit Requirements for the ImageWriter Class
#
# The ImageWriter class writes pixels to a PNG, JPEG, BMP, or TIFF file. It decides the format from the
# --format option or the file name extension, flattens transparency for JPEG, writes through a temporary
# file so that an output is never half written, and applies the overwrite policy: an existing output is
# replaced unless no-clobber is requested, and an output that is the input is always refused.

sections:
  - title: ImageWriter Unit Requirements
    requirements:
      - id: CanvasNetTool-Imaging-ImageWriter-FormatResolution
        title: >-
          The ImageWriter class shall take the output format from the format option when it is given
          (png, jpeg, jpg, bmp, tiff, or tif, in any case) and otherwise from the file name extension,
          and shall report an unknown format name, a missing extension, or an unknown extension as a
          usage error.
        justification: |
          The output format must be predictable from what the caller typed, and a mistake must be
          reported before any work is done.
        tests:
          - ImageWriter_ResolveFormat_Extension_SelectsFormat
          - ImageWriter_ResolveFormat_FormatOption_WinsOverExtension
          - ImageWriter_ResolveFormat_UnknownFormat_ThrowsUsageError
          - ImageWriter_ExtensionFormats_AreWellFormed
          - ImageWriter_Write_FormatOption_EncodesThatFormat

      - id: CanvasNetTool-Imaging-ImageWriter-Lossless
        title: >-
          The ImageWriter class shall write PNG, BMP, and TIFF files that decode to exactly the pixels
          written, including transparency.
        justification: |
          The lossless formats exist to preserve pixels; any change would make comparison and iteration
          on an image unreliable.
        tests:
          - ImageWriter_Write_LosslessFormat_KeepsEveryPixelIncludingAlpha

      - id: CanvasNetTool-Imaging-ImageWriter-Jpeg
        title: >-
          The ImageWriter class shall write JPEG files at the requested quality (1 to 100, default 90),
          flattening transparent pixels over the flatten background (white by default) because JPEG has
          no transparency, and shall reject a quality outside that range.
        justification: |
          JPEG is the compact format for photographs; flattening avoids the black background that some
          encoders produce for transparent pixels.
        tests:
          - ImageWriter_Write_JpegOfOpaqueImage_IsCloseAndNotFlattened
          - ImageWriter_Write_JpegOfTransparentImage_FlattensOverBackground
          - ImageWriter_Write_JpegQuality_ChangesFileSize
          - ImageWriter_WriteOptionsDefault_HasDocumentedDefaults
          - ImageWriter_Write_InvalidArguments_Throw

      - id: CanvasNetTool-Imaging-ImageWriter-AtomicWrite
        title: >-
          The ImageWriter class shall encode to a temporary file in the target directory (with a name
          that does not depend on the length of the target's name) and move it over the target, leaving
          no temporary file behind, creating a missing target directory, and reporting a file or
          directory that cannot be written as output-write-failed.
        justification: |
          A failed write must never leave a half-written output or clutter the directory, and an
          existing output must only ever be replaced by a complete one. A valid long file name must not
          fail only because the temporary file's name is longer.
        tests:
          - ImageWriter_Write_ExistingOutput_IsOverwrittenWithoutLeftovers
          - ImageWriter_Write_MissingDirectory_IsCreated
          - ImageWriter_Write_DirectoryCannotBeCreated_ThrowsOutputWriteFailed
          - ImageWriter_Write_LongFileName_IsWritten

      - id: CanvasNetTool-Imaging-ImageWriter-PublishAll
        title: >-
          The ImageWriter class shall publish several staged outputs all or nothing: an existing target
          is first renamed to a unique backup in its directory and the temporary file is moved into
          place, and when any step fails every published target is removed, every backup is restored,
          the temporary files are deleted, and the original error is reported; on success the backups
          are deleted.
        justification: |
          A command that writes several outputs (every page, every comparison picture) must not leave
          a mix of new and old files when one move fails. Only a failure to restore a backup itself can
          leave a previous file under its backup name, which is reported.
        tests:
          - ImageWriter_PublishAll_FailureOnLaterMove_RestoresEverything
          - ImageWriter_PublishAll_Success_ReplacesAllAndLeavesNoBackups

      - id: CanvasNetTool-Imaging-ImageWriter-Overwrite
        title: >-
          The ImageWriter class shall overwrite an existing output by default, and shall refuse it with
          the error code output-exists, leaving the file untouched, when no-clobber is requested.
        justification: |
          Agents iterate on an output file, so replacing it is the useful default; no-clobber protects a
          file that must not be lost.
        tests:
          - ImageWriter_Write_ExistingOutput_IsOverwrittenWithoutLeftovers
          - ImageWriter_Write_NoClobberAndExistingOutput_ThrowsOutputExistsAndKeepsFile
          - ImageWriter_Write_NoClobberAndNewOutput_WritesFile

      - id: CanvasNetTool-Imaging-ImageWriter-SamePath
        title: >-
          The ImageWriter class shall refuse an output that is the same file as the input (identical
          paths after full-path normalization and symbolic link or junction resolution, including
          through links to the file or to any folder on the way, also when a link's target itself goes
          through a link), an output that is an existing directory, and an output that is not a usable
          path (invalid, or below a file), before writing anything, and shall offer the same check
          without writing so that a command can report it before loading the input.
        justification: |
          Writing over the input would destroy it before the render is complete, and a path that can
          never be written should be an expected error reported before any pixels are decoded.
          Hard links are not detected, and need not be: the input is read completely before any output
          is written, and the output is a new temporary file moved over the target name, so a
          hard-linked output name receives a new file and the input keeps its content.
        tests:
          - ImageWriter_Write_OutputIsInput_ThrowsSameInputOutput
          - ImageWriter_CheckTarget_Problems_AreReported
          - ImageWriter_CheckTarget_LinkedDirectory_IsSameFile
          - ImageWriter_CheckTarget_LinkTargetThroughLink_IsSameFile
          - ImageWriter_CheckTarget_UnusablePath_IsOutputWriteFailed

      - id: CanvasNetTool-Imaging-ImageWriter-MultipleTargets
        title: >-
          The ImageWriter class shall check every output of a command against every input in one step,
          without writing anything, refusing an output that is any one of the inputs
          (same-input-output), two outputs that are the same file (usage-error), an existing output when
          no-clobber is requested (output-exists), and an output that is a directory or not a usable
          path (output-write-failed).
        justification: |
          A command with several inputs and outputs (a comparison writing three images, a contact sheet
          of many files) must report every mistake in its targets before it loads or writes anything,
          and must never write one output over another or over any of its inputs.
        tests:
          - ImageWriter_CheckTargets_OutputIsAnyInput_ThrowsSameInputOutput
          - ImageWriter_CheckTargets_TwoOutputsSameFile_ThrowsUsageError
          - ImageWriter_CheckTargets_DistinctPaths_Passes
          - ImageWriter_CheckTargets_NoClobberAndExistingOutput_ThrowsOutputExists

      - id: CanvasNetTool-Imaging-ImageWriter-Deterministic
        title: >-
          The ImageWriter class shall write the same bytes for the same pixels and options.
        justification: |
          Reproducible output makes results comparable and lets scripts detect real change.
        tests:
          - ImageWriter_Write_SamePixelsTwice_WritesIdenticalBytes
