---
# cspell:ignore luma otsu percentiles
# Software Unit Requirements for the ImageAnalysis Class
#
# The ImageAnalysis class reads what an image contains: its dominant colors, the statistics of its luma, and the pixels
# around a point. It works on surfaces only and never changes them: it knows nothing of files, options, or commands.
# Its arithmetic is exact integer arithmetic, its pass over the pixels is sequential, and its ordering rules have
# explicit tie-breaks, so the result is the same on every run.

sections:
  - title: ImageAnalysis Unit Requirements
    requirements:
      - id: CanvasNetTool-Imaging-ImageAnalysis-Quantize
        title: >-
          The ImageAnalysis class shall count the pixels of an image in 4096 color buckets of the top four bits of each
          channel of the pixel flattened over the background, and shall sum the flattened channels of each bucket so
          that a color is the mean of its pixels.
        justification: |
          A photograph has millions of nearly equal shades; counting buckets keeps the analysis to one fast pass,
          and reporting the mean of the pixels gives a color that is really present rather than a bucket corner.
        tests:
          - ImageAnalysis_Analyze_FourBitBuckets_GroupNearbyShadesIntoOneColor

      - id: CanvasNetTool-Imaging-ImageAnalysis-Dominant
        title: >-
          The ImageAnalysis class shall report the dominant colors as clusters of buckets, taking the buckets in order
          of pixel count (ties by bucket index) and adding each to the first cluster whose leader is within 2 bucket
          units on every channel or else starting a new cluster, ordering the clusters by pixels (ties by leader
          bucket),
          reporting at most the requested number of colors (1 to 32) with their pixel counts and their fractions of all
          pixels rounded to 6 decimals.
        justification: |
          A gradient of paper shades must be one color, not twenty; fixed ordering and tie-break rules make the
          reported list the same on every run and every machine.
        tests:
          - ImageAnalysis_Analyze_TwoColorImage_ReportsBothInPixelOrderWithFractions
          - ImageAnalysis_Analyze_EqualCounts_OrderedByBucketIndex
          - ImageAnalysis_Analyze_CountLimit_ReportsOnlyTheMostCommon
          - ImageAnalysis_Analyze_Gradient_MergesWithinClusterRadiusAndAveragesMembers

      - id: CanvasNetTool-Imaging-ImageAnalysis-Alpha
        title: >-
          The ImageAnalysis class shall flatten every translucent pixel over an opaque background color, as
          (c a + bg (255 - a) + 127) / 255 for each channel, before it counts or measures the pixel.
        justification: |
          The colors a reader sees are those of the picture on its background; counting the hidden color of a
          transparent pixel would report colors that cannot be seen.
        tests:
          - ImageAnalysis_Analyze_TransparentPixels_AreFlattenedOverBackground

      - id: CanvasNetTool-Imaging-ImageAnalysis-LumaStats
        title: >-
          The ImageAnalysis class shall report the luma statistics of the flattened pixels from the same pass: the mean
          to 2 decimals, the smallest and largest level that occurs, the percentiles 1, 50, and 99 (the smallest level
          whose cumulative count is at least ceil(N p / 100)), the Otsu threshold of the 256-bin histogram, and a 16-bin
          histogram of the level divided by 16.
        justification: |
          These numbers let a user choose levels and threshold values for a photograph without trial and error, and the
          Otsu level is the one the automatic threshold would choose.
        tests:
          - ImageAnalysis_Analyze_Luma_ReportsMeanMinMaxPercentilesOtsuAndHistogram

      - id: CanvasNetTool-Imaging-ImageAnalysis-Sample
        title: >-
          The ImageAnalysis class shall report the pixel at a point and its luma and, for a radius from 1 to 8, the
          window of the points within the radius clipped to the image with its actual rectangle, its pixels, and the
          mean of each channel (alpha included) rounded half up, and shall reject a point outside the image with a
          usage error that names the point and the image size.
        justification: |
          Reading one pixel and its surroundings is how a user checks a stroke or the color of a mark; a window that
          is clipped, and says so, is correct at the edges, and an outside point is a mistake the user can fix.
        tests:
          - ImageAnalysis_Sample_Point_ReturnsColorAndLuma
          - ImageAnalysis_Sample_Radius_ReturnsClippedWindowAndMean
          - ImageAnalysis_Sample_OutsideImage_Throws

      - id: CanvasNetTool-Imaging-ImageAnalysis-Deterministic
        title: >-
          The ImageAnalysis class shall give the same statistics when the same pixels are analyzed twice.
        justification: |
          Results are compared, cached, and checked into source control; they must not depend on scheduling or on
          the order of equal counts.
        tests:
          - ImageAnalysis_Analyze_SameInputTwice_ReturnsIdenticalResult

      - id: CanvasNetTool-Imaging-ImageAnalysis-Arguments
        title: >-
          The ImageAnalysis class shall reject a null surface, a translucent background, a color count outside 1 to
          32, and a window radius outside 0 to 8.
        justification: |
          Each of these is a defect of the caller (the command validates user input first) and must fail fast and
          clearly.
        tests:
          - ImageAnalysis_NullOrOutOfRangeArguments_Throw
