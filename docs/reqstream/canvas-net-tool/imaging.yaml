---
# cspell:ignore scad openscad ssim otsu grayscale deskew deskewed
# Imaging Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasNetTool Imaging subsystem
# - The Imaging subsystem turns files into pixels (SourceLoader), transforms pixels (ImagePipeline), adjusts
#   tone and color (ImageAdjustments), rotates and trims (ImageGeometry), draws a coordinate grid (GridOverlay),
#   measures colors (ImageAnalysis), compares
#   two images and draws their differences (ImageComparison), composes a contact sheet (ContactSheet), and
#   turns pixels into files (ImageWriter); it is free of command-line concerns apart from the parsing of
#   the operations
# - Subsystem requirements describe the externally visible load, compare, compose, and write behavior and are
#   verified by the subsystem tests, which run the loader, the comparison and the contact sheet, and the writer
#   together on every input and output format

sections:
  - title: Imaging Subsystem Requirements
    requirements:
      - id: CanvasNetTool-Imaging-Load
        title: >-
          The Imaging subsystem shall load a PNG, JPEG, BMP, TIFF, GIF, JPEG 2000, SVG, PDF, PPTX,
          VSDX, SCAD, or Vega-Lite file (a chosen page of a document, a named view of a model, a chart)
          into pixels at the size and resolution the options ask for, and shall report the facts of a
          file, including the pages of a document, the declarations of a model, and the marks, data, and
          parameters of a chart, without decoding or rendering it.
        justification: |
          Every command needs one place that recognizes a file, reads its header, and produces the
          pixels, so that the formats behave consistently.
        children:
          - CanvasNetTool-Imaging-SourceLoader-Detect
          - CanvasNetTool-Imaging-SourceLoader-Probe
          - CanvasNetTool-Imaging-SourceLoader-Raster
          - CanvasNetTool-Imaging-SourceLoader-Svg
          - CanvasNetTool-Imaging-SourceLoader-Documents
          - CanvasNetTool-Imaging-SourceLoader-PageSelection
          - CanvasNetTool-Imaging-SourceLoader-Resolution
          - CanvasNetTool-Imaging-SourceLoader-Diagnostics
          - CanvasNetTool-Imaging-SourceLoader-Strict
          - CanvasNetTool-Imaging-SourceLoader-Scad
          - CanvasNetTool-Imaging-SourceLoader-ScadVariables
          - CanvasNetTool-Imaging-SourceLoader-ScadDiagnostics
          - CanvasNetTool-Imaging-SourceLoader-ScadLimits
          - CanvasNetTool-Imaging-SourceLoader-ScadIncludes
          - CanvasNetTool-Imaging-SourceLoader-ScadErrors
          - CanvasNetTool-Imaging-SourceLoader-VegaLiteDetection
          - CanvasNetTool-Imaging-SourceLoader-VegaLiteProbe
          - CanvasNetTool-Imaging-SourceLoader-VegaLiteRender
          - CanvasNetTool-Imaging-SourceLoader-VegaLiteData
          - CanvasNetTool-Imaging-SourceLoader-VegaLiteErrors
          - CanvasNetTool-Imaging-SourceLoader-Sizing
          - CanvasNetTool-Imaging-SourceLoader-Background
          - CanvasNetTool-Imaging-SourceLoader-Exif
          - CanvasNetTool-Imaging-SourceLoader-Arguments
          - CanvasNetTool-Imaging-SourceLoader-BoxFit
        tests:
          - Imaging_Convert_InputKindToOutputFormat_WritesTheSourcePixels
          - Imaging_Convert_RequestedSize_WritesThatSize
          - Imaging_Convert_DocumentPages_WritesEachPageWithItsPixels
          - Imaging_Convert_ScadViewToOutputFormat_WritesTheLibraryPixels

      - id: CanvasNetTool-Imaging-Write
        title: >-
          The Imaging subsystem shall write pixels as a PNG, JPEG, BMP, or TIFF file, with transparency
          flattened for JPEG, through a temporary file, honoring the overwrite policy.
        justification: |
          Every command writes images the same way, so that formats, quality, and overwrite behavior are
          the same everywhere.
        children:
          - CanvasNetTool-Imaging-ImageWriter-FormatResolution
          - CanvasNetTool-Imaging-ImageWriter-Lossless
          - CanvasNetTool-Imaging-ImageWriter-Jpeg
          - CanvasNetTool-Imaging-ImageWriter-AtomicWrite
          - CanvasNetTool-Imaging-ImageWriter-Overwrite
          - CanvasNetTool-Imaging-ImageWriter-PublishAll
          - CanvasNetTool-Imaging-ImageWriter-SamePath
          - CanvasNetTool-Imaging-ImageWriter-MultipleTargets
        tests:
          - Imaging_Convert_InputKindToOutputFormat_WritesTheSourcePixels
          - Imaging_Convert_TransparentPng_FlattensOnlyForJpeg

      - id: CanvasNetTool-Imaging-Transform
        title: >-
          The Imaging subsystem shall transform loaded pixels with an ordered pipeline of operations
          (crop, resize, fit, rotate by any angle, flip, pad, tone adjustment, deskew, trim, and grid) applied in
          the order written, and shall give the same transformed pixels when the same operations are applied
          twice.
        justification: |
          Every command that changes an image applies the same operations the same way, in one decode and
          one encode, so that the order of the options is the order of the effects.
        children:
          - CanvasNetTool-Imaging-ImagePipeline-Order
          - CanvasNetTool-Imaging-ImagePipeline-Crop
          - CanvasNetTool-Imaging-ImagePipeline-Resize
          - CanvasNetTool-Imaging-ImagePipeline-Rotate
          - CanvasNetTool-Imaging-ImagePipeline-RotateAngle
          - CanvasNetTool-Imaging-ImagePipeline-Flip
          - CanvasNetTool-Imaging-ImagePipeline-Pad
          - CanvasNetTool-Imaging-ImagePipeline-Adjustments
          - CanvasNetTool-Imaging-ImagePipeline-Deskew
          - CanvasNetTool-Imaging-ImagePipeline-Trim
          - CanvasNetTool-Imaging-ImagePipeline-Grid
          - CanvasNetTool-Imaging-ImagePipeline-Ownership
          - CanvasNetTool-Imaging-ImagePipeline-SizeLimit
          - CanvasNetTool-Imaging-ImagePipeline-Arguments
        tests:
          - Imaging_Pipeline_LoadedSource_TransformedAndWrittenOnce
          - Imaging_Photo_SameInputsTwice_WriteIdenticalBytes

      - id: CanvasNetTool-Imaging-Compare
        title: >-
          The Imaging subsystem shall compare two loaded images of the same size, giving exact, repeatable
          error and similarity measures, the error of each cell of a grid, and the check of those measures
          against thresholds, and shall create a difference image, an overlay, and a side-by-side image that
          the image writer writes as files, loading a vector source at the size of the reference.
        justification: |
          Comparing a redraw with its reference is the same chain for every command: the loader produces
          pixels of one size, the comparison measures and draws them, and the writer writes the pictures, so
          that the numbers and the pictures agree between commands and runs.
        children:
          - CanvasNetTool-Imaging-ImageComparison-ErrorMetrics
          - CanvasNetTool-Imaging-ImageComparison-Ssim
          - CanvasNetTool-Imaging-ImageComparison-DiffPixels
          - CanvasNetTool-Imaging-ImageComparison-Grid
          - CanvasNetTool-Imaging-ImageComparison-DiffImage
          - CanvasNetTool-Imaging-ImageComparison-Overlay
          - CanvasNetTool-Imaging-ImageComparison-SideBySide
          - CanvasNetTool-Imaging-ImageComparison-Thresholds
          - CanvasNetTool-Imaging-ImageComparison-Arguments
          - CanvasNetTool-Imaging-ImageComparison-Deterministic
        tests:
          - Imaging_Compare_LoadedSourcesAreComparedAndVisualized
          - Imaging_Compare_SameInputsTwice_WriteIdenticalBytes

      - id: CanvasNetTool-Imaging-Montage
        title: >-
          The Imaging subsystem shall compose loaded sources of several kinds into one contact sheet, one
          source at a time, in cells whose layout is calculated from the number of sources and the options,
          with labels drawn in the bundled font, and shall refuse a sheet larger than the maximum image size
          before any source is loaded.
        justification: |
          A contact sheet is built from whatever the loader can open; composing one source at a time keeps the
          memory in use to the sheet plus one source, and a fixed layout lets a caller find a cell.
        children:
          - CanvasNetTool-Imaging-ContactSheet-Layout
          - CanvasNetTool-Imaging-ContactSheet-SizeLimit
          - CanvasNetTool-Imaging-ContactSheet-Placement
          - CanvasNetTool-Imaging-ContactSheet-Labels
          - CanvasNetTool-Imaging-ContactSheet-Appearance
          - CanvasNetTool-Imaging-ContactSheet-Arguments
          - CanvasNetTool-Imaging-ContactSheet-Deterministic
        tests:
          - Imaging_Montage_LoadedSourcesAreComposedAndWritten

      - id: CanvasNetTool-Imaging-Adjust
        title: >-
          The Imaging subsystem shall adjust the tone and color of pixels in place (grayscale, invert, a fixed or
          automatic threshold, levels, brightness, contrast, and an auto-levels stretch), with exact, repeatable
          results that do not depend on the number of cores.
        justification: |
          A photograph of a sketch is cleaned up with the same few tone operations whatever its source; doing the
          arithmetic in one unit, in integers wherever a number decides a pixel, makes the operations predictable,
          reportable, and comparable between runs.
        children:
          - CanvasNetTool-Imaging-ImageAdjustments-Luma
          - CanvasNetTool-Imaging-ImageAdjustments-Grayscale
          - CanvasNetTool-Imaging-ImageAdjustments-Invert
          - CanvasNetTool-Imaging-ImageAdjustments-Threshold
          - CanvasNetTool-Imaging-ImageAdjustments-Otsu
          - CanvasNetTool-Imaging-ImageAdjustments-Levels
          - CanvasNetTool-Imaging-ImageAdjustments-BrightnessContrast
          - CanvasNetTool-Imaging-ImageAdjustments-AutoLevels
          - CanvasNetTool-Imaging-ImageAdjustments-Deterministic
          - CanvasNetTool-Imaging-ImageAdjustments-Arguments
        tests:
          - Imaging_Photo_LoadedSourceAdjustedDeskewedTrimmedAndWritten

      - id: CanvasNetTool-Imaging-Geometry
        title: >-
          The Imaging subsystem shall rotate pixels by any angle onto an expanded canvas with a chosen fill color
          (nearest or bilinear sampling, refusing a canvas larger than the maximum image size), shall find the
          bounds of the content inside a uniform border, and shall estimate the skew of the dominant
          near-horizontal lines of an image, with exact, repeatable results that do not depend on the number of
          cores.
        justification: |
          A photograph of a sketch is rarely level or tightly framed; estimating its tilt, rotating by an arbitrary
          angle without losing corners, and cropping to the content are the geometric steps that turn it into a
          usable picture.
        children:
          - CanvasNetTool-Imaging-ImageGeometry-RotatedSize
          - CanvasNetTool-Imaging-ImageGeometry-RotateMapping
          - CanvasNetTool-Imaging-ImageGeometry-RotateFill
          - CanvasNetTool-Imaging-ImageGeometry-RotateFilter
          - CanvasNetTool-Imaging-ImageGeometry-RotateLimit
          - CanvasNetTool-Imaging-ImageGeometry-Trim
          - CanvasNetTool-Imaging-ImageGeometry-SkewEstimate
          - CanvasNetTool-Imaging-ImageGeometry-SkewNoStructure
          - CanvasNetTool-Imaging-ImageGeometry-SkewDeterministic
          - CanvasNetTool-Imaging-ImageGeometry-Arguments
        tests:
          - Imaging_Photo_LoadedSourceAdjustedDeskewedTrimmedAndWritten

      - id: CanvasNetTool-Imaging-Annotate
        title: >-
          The Imaging subsystem shall draw a labeled coordinate grid over pixels, with one-pixel lines at the multiples
          of a spacing, labels that give the pixel coordinates and stay inside the picture, and exact, repeatable
          blending.
        justification: |
          A reader of a photographed sketch needs to turn what is seen into pixel positions and sizes; a grid with
          coordinates on the picture itself does that without further tools.
        children:
          - CanvasNetTool-Imaging-GridOverlay-Lines
          - CanvasNetTool-Imaging-GridOverlay-Blend
          - CanvasNetTool-Imaging-GridOverlay-Labels
          - CanvasNetTool-Imaging-GridOverlay-Result
          - CanvasNetTool-Imaging-GridOverlay-Deterministic
          - CanvasNetTool-Imaging-GridOverlay-Arguments

      - id: CanvasNetTool-Imaging-Analyze
        title: >-
          The Imaging subsystem shall report the dominant colors and luma statistics of an image, and the pixel at a
          point with the mean of its neighborhood, with exact results that are the same on every run.
        justification: |
          An agent or a user must be able to ask what an image contains, for example the colors of a region or the
          value of one pixel, before it chooses how to transform it.
        children:
          - CanvasNetTool-Imaging-ImageAnalysis-Quantize
          - CanvasNetTool-Imaging-ImageAnalysis-Dominant
          - CanvasNetTool-Imaging-ImageAnalysis-Alpha
          - CanvasNetTool-Imaging-ImageAnalysis-LumaStats
          - CanvasNetTool-Imaging-ImageAnalysis-Sample
          - CanvasNetTool-Imaging-ImageAnalysis-Deterministic
          - CanvasNetTool-Imaging-ImageAnalysis-Arguments

      - id: CanvasNetTool-Imaging-Determinism
        title: >-
          The Imaging subsystem shall produce the same output bytes when the same input is loaded and
          written twice with the same options.
        justification: |
          Reproducible output makes results comparable and lets scripts detect real change.
        children:
          - CanvasNetTool-Imaging-ImageWriter-Deterministic
        tests:
          - Imaging_Convert_SameInputTwice_WritesIdenticalBytes

      - id: CanvasNetTool-Imaging-Errors
        title: >-
          The Imaging subsystem shall report a missing, unsupported, truncated, corrupt, or oversized
          input, and a page that does not exist, as an expected error before anything is written.
        justification: |
          A failed conversion must not leave a partial output, and the failure must be a stable,
          concise error that a caller can act on.
        children:
          - CanvasNetTool-Imaging-SourceLoader-DetectErrors
          - CanvasNetTool-Imaging-SourceLoader-SizeLimit
          - CanvasNetTool-Imaging-SourceLoader-CorruptInput
        tests:
          - Imaging_Convert_CorruptInput_LeavesNoOutput
          - Imaging_Convert_PageOutOfRange_LeavesNoOutput
