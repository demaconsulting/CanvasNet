---
# System-Level Platform Requirements
#
# These requirements specify the platforms and runtimes the tool must support.
# They ensure the tool works across the required execution environments.
#
# Test links can include a source filter prefix (e.g. "windows@", "ubuntu@", "dotnet10.x@") to restrict
# which test results count as evidence for a requirement. This is critical for platform and runtime
# requirements - removing these filters invalidates the evidence-based proof. The evidence comes from
# the self-validation results that the integration-test job of the build workflow writes, per
# platform and runtime, from the installed tool.
#
# Source filter prefixes:
#   windows@TestName      - proves the test passed on a Windows platform
#   ubuntu@TestName       - proves the test passed on a Linux (Ubuntu) platform
#   macos@TestName        - proves the test passed on a macOS platform
#   dotnet10.x@TestName   - proves the self-validation test ran with .NET 10.x runtime
#   dotnet11.x@TestName   - proves the self-validation test ran with .NET 11.x runtime

sections:
  - title: Platform Support
    requirements:
      - id: CanvasNetTool-Platform-Windows
        title: The tool shall execute successfully on Windows platforms.
        tags: [system]
        justification: |
          DEMA Consulting tools must support Windows as a major development platform.
        tests:
          # Tests link to "windows" to ensure results come from Windows platform
          - "windows@CanvasNetTool_VersionDisplay"
          - "windows@CanvasNetTool_HelpDisplay"

      - id: CanvasNetTool-Platform-Linux
        title: The tool shall execute successfully on Linux platforms.
        tags: [system]
        justification: |
          DEMA Consulting tools must support Linux for CI/CD and containerized environments.
        tests:
          # Tests link to "ubuntu" to ensure results come from Linux platform
          - "ubuntu@CanvasNetTool_VersionDisplay"
          - "ubuntu@CanvasNetTool_HelpDisplay"

      - id: CanvasNetTool-Platform-MacOS
        title: The tool shall execute successfully on macOS platforms.
        tags: [system]
        justification: |
          DEMA Consulting tools must support macOS for developers using Apple platforms.
        tests:
          # Tests link to "macos" to ensure results come from macOS platform
          - "macos@CanvasNetTool_VersionDisplay"
          - "macos@CanvasNetTool_HelpDisplay"

      - id: CanvasNetTool-Platform-Net10
        title: The tool shall support .NET 10 runtime.
        tags: [system]
        justification: |
          .NET 10 is the current Long-Term Support (LTS) release. Supporting this runtime provides
          a stable, long-term supported target for users who prefer LTS releases.
        tests:
          - "dotnet10.x@CanvasNetTool_VersionDisplay"
          - "dotnet10.x@CanvasNetTool_HelpDisplay"

      - id: CanvasNetTool-Platform-Net11
        title: The tool shall support .NET 11 runtime.
        tags: [system]
        justification: |
          .NET 11 is the latest release in the .NET platform roadmap. Supporting this runtime
          ensures the tool works for users as they adopt the newest .NET version.
        tests:
          - "dotnet11.x@CanvasNetTool_VersionDisplay"
          - "dotnet11.x@CanvasNetTool_HelpDisplay"
