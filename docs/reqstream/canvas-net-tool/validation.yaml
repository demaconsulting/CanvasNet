---
# cspell:ignore scad openscad
# Software Unit Requirements for the Validation Class
#
# The Validation class provides the self-validation framework, running tests that demonstrate the
# tool is functioning correctly in the deployment environment. It supports writing results to TRX
# (MSTest) or JUnit XML format.

sections:
  - title: Validation Unit Requirements
    requirements:
      - id: CanvasNetTool-Validation-Qualification
        title: >-
          The Validation class shall run the self-validation tests, name them as the platform
          evidence tests, and print a summary.
        justification: |
          Provides a built-in mechanism to verify the tool is functioning correctly in the
          deployment environment. The names of the version and help self-tests are contractual:
          the platform requirements are proven by the results the installed tool writes on each
          platform and runtime.
        tests:
          - Validation_Run_NotSilent_PrintsSummary
          - Validation_Run_WithSilentContext_ExitCodeIsZero
          - Validation_Run_NullContext_ThrowsArgumentNullException

      - id: CanvasNetTool-Validation-Header
        title: >-
          The Validation class shall print a header table of tool and environment information at
          the heading depth requested.
        justification: |
          Qualification evidence must identify the tool version and the environment it ran in, and
          must embed at the right level in a larger report.
        tests:
          - Validation_Run_WithDepth_UsesHeadingDepth

      - id: CanvasNetTool-Validation-ResultsOutput
        title: >-
          The Validation class shall write the results to a TRX file when the results path ends
          with .trx and to a JUnit XML file when it ends with .xml.
        justification: |
          TRX format is compatible with MSTest and ReqStream requirements traceability tools; JUnit
          XML is compatible with many CI tools (Jenkins, GitHub Actions, GitLab CI).
        tests:
          - Validation_Run_WithTrxResultsFile_WritesTrxFile
          - Validation_Run_WithXmlResultsFile_WritesXmlFile

      - id: CanvasNetTool-Validation-InvalidExtension
        title: >-
          The Validation class shall report an error, set exit code 1, and write no file when the
          results file path has an unsupported extension.
        justification: |
          Provides a clear failure signal when an unrecognized results file extension is supplied,
          preventing silent evidence loss and enabling CI/CD pipelines to surface output
          configuration errors automatically.
        tests:
          - Validation_Run_WithUnsupportedResultsFormat_DoesNotWriteFile

      - id: CanvasNetTool-Validation-Formats
        title: >-
          The Validation class shall run the formats self-test, which runs the formats command with
          JSON output in-process and checks that the document is valid and lists PNG.
        justification: |
          The formats self-test proves, in the deployment environment, that command dispatch, the
          argument reader, and the JSON result writer work together; its name is a contract with
          the qualification evidence.
        tests:
          - Validation_Run_FormatsSelfTest_PassesAndIsRecorded
          - CanvasNetTool_Formats

      - id: CanvasNetTool-Validation-ImagingSelfTests
        title: >-
          The Validation class shall run the imaging self-tests, which generate a PNG, an SVG, a
          PDF document, and an OpenSCAD model and run the render, convert, info, crop, resize, rotate,
          flip, and pad commands on them in-process, checking the decoded pixels, sizes, and JSON
          documents.
        justification: |
          The imaging self-tests prove, in the deployment environment, that the codecs, the SVG, PDF, and
          SCAD renderers, the loader, the image pipeline, the writer, and the commands work together; their
          names are a contract with the qualification evidence.
        tests:
          - Validation_Run_ImagingSelfTests_PassAndAreRecorded
          - CanvasNetTool_RenderPng
          - CanvasNetTool_ConvertFormats
          - CanvasNetTool_Info
          - CanvasNetTool_RenderSvg
          - CanvasNetTool_PdfMinimal
          - CanvasNetTool_RenderScad
          - CanvasNetTool_CropResize
          - CanvasNetTool_RotateFlipPad

      - id: CanvasNetTool-Validation-CompareMontageSelfTests
        title: >-
          The Validation class shall run the compare and montage self-tests, which generate PNG images and run
          the compare command on identical and on differing images (checking the metrics, the difference
          picture, the side-by-side picture, and the expected failure of an unmet threshold) and the montage
          command on two images (checking the sheet geometry, the placement of the cells, and the label)
          in-process.
        justification: |
          The compare and montage self-tests prove, in the deployment environment, that the comparison
          metrics, the picture creators, the contact sheet with its bundled-font labels, and the commands
          work together; their names are a contract with the qualification evidence. They are smoke tests:
          the detailed coverage is in the unit and subsystem tests, and the self-validation suite is kept
          small.
        tests:
          - Validation_Run_CompareMontageSelfTests_PassAndAreRecorded
          - CanvasNetTool_Compare
          - CanvasNetTool_Montage
