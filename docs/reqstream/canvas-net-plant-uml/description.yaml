---
# Software Subsystem Requirements for Description
#
# These requirements decompose the CanvasNetPlantUml system's description diagrams (use case, component, and
# deployment diagrams) into the Description subsystem (internal namespace
# DemaConsulting.CanvasNet.PlantUml.Description): the reader of the statements (DescriptionParser), the diagram with
# its elements and containers and its lowering to the Svek engine (DescriptionModel), and the drawing of the elements
# and containers (DescriptionRenderer). Each requirement here links down to the unit requirements that implement it. See
# docs/verification/canvas-net-plant-uml/description.md for the test-evidence mapping.

sections:
  - title: CanvasNetPlantUml Requirements
    sections:
      - title: Description Requirements
        requirements:
          - id: CanvasNetPlantUml-Description-Reading
            title: >-
              The Description subsystem shall read the statements of a description diagram (elements of every symbol
              with display names, stereotypes, colors, and multi-line descriptions; the shorthands of components,
              interfaces, use cases, and actors; containers; links; notes; the page texts, the direction, the scale,
              and the skin parameters) into a model, report the statements it reads but does not draw, and refuse a
              malformed statement, a redeclaration with another symbol, or a statement of another diagram with a
              located syntax error.
            justification: |
              Use case and component diagrams are common graph diagrams; their statements must be read as PlantUML
              reads them, and what is not drawn must be said, not silently dropped. The parser is complete for the
              deployment diagrams too, which share the statements.
            children:
              - CanvasNetPlantUml-Description-DescriptionParser-Declarations
              - CanvasNetPlantUml-Description-DescriptionParser-Containers
              - CanvasNetPlantUml-Description-DescriptionParser-Names
              - CanvasNetPlantUml-Description-DescriptionParser-Links
              - CanvasNetPlantUml-Description-DescriptionParser-Notes
              - CanvasNetPlantUml-Description-DescriptionParser-Common
              - CanvasNetPlantUml-Description-DescriptionParser-Unsupported
              - CanvasNetPlantUml-Description-DescriptionParser-Errors
            tests:
              - PlantUmlDescription_ReadLayoutRender_DrawsTheModel
              - PlantUmlDescription_SkinAndReports_ReachTheDrawing
              - PlantUmlDescription_UseCase_DrawsActorsAndUseCases

          - id: CanvasNetPlantUml-Description-Layout
            title: >-
              The Description subsystem shall lower the diagram to the Svek engine (containers as clusters with their
              images, leaf elements with their images, notes, and links with their settings), lay it out, and decorate
              it with its page texts at its own scale, and shall count its leaf elements, links, and containers for the
              document's facts.
            justification: |
              The model is what the document measures, renders, and reports; the shared engine places it like the
              other graph diagrams.
            children:
              - CanvasNetPlantUml-Description-DescriptionModel-Facts
              - CanvasNetPlantUml-Description-DescriptionModel-Lowering
              - CanvasNetPlantUml-Description-DescriptionModel-Layout
            tests:
              - PlantUmlDescription_ReadLayoutRender_DrawsTheModel

          - id: CanvasNetPlantUml-Description-Drawing
            title: >-
              The Description subsystem shall draw a component, an interface, an actor, a use case, their business
              forms, and the node, rectangle, folder, package, frame, cloud, database, and card symbols with
              PlantUML's shapes and margins, every other symbol as a rectangle, and the containers with PlantUML's
              container symbols, in the look of the diagram's skin parameters.
            justification: |
              The shapes are what makes a use case or a component diagram look like PlantUML's picture.
            children:
              - CanvasNetPlantUml-Description-DescriptionRenderer-Components
              - CanvasNetPlantUml-Description-DescriptionRenderer-Interfaces
              - CanvasNetPlantUml-Description-DescriptionRenderer-Actors
              - CanvasNetPlantUml-Description-DescriptionRenderer-UseCases
              - CanvasNetPlantUml-Description-DescriptionRenderer-Symbols
              - CanvasNetPlantUml-Description-DescriptionRenderer-Containers
            tests:
              - PlantUmlDescription_ReadLayoutRender_DrawsTheModel
              - PlantUmlDescription_SkinAndReports_ReachTheDrawing
              - PlantUmlDescription_UseCase_DrawsActorsAndUseCases

          - id: CanvasNetPlantUml-Description-Limits
            title: >-
              The Description subsystem shall bound a diagram by the node, edge, label length, and nesting limits
              while reading it, failing at the statement that crosses a limit with a located plantuml-limit-exceeded
              error that names the limit.
            justification: |
              Description diagrams come from untrusted text; a huge diagram must fail closed before it is laid out.
            children:
              - CanvasNetPlantUml-Description-DescriptionParser-Limits
            tests:
              - PlantUmlDescriptionParser_Limits_FailClosedAtTheLine
