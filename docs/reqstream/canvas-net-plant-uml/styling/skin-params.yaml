---
# Software Unit Requirements for SkinParams
#
# These requirements describe the design-level behavior of the SkinParams unit of the Styling subsystem (internal
# namespace DemaConsulting.CanvasNet.PlantUml.Styling): the line and block forms of the skinparam statement, the
# supported subset, PlantUML's colors, and the reports of what has no effect. See
# docs/verification/canvas-net-plant-uml/styling/skin-params.md for the test-evidence mapping.

sections:
  - title: CanvasNetPlantUml Requirements
    sections:
      - title: Styling Requirements
        sections:
          - title: SkinParams Requirements
            requirements:
              - id: CanvasNetPlantUml-Styling-SkinParams-Forms
                title: >-
                  The SkinParams unit shall read a skin parameter written on one line and the parameters of a block,
                  whose inner names are joined to the block's name, each located at its statement.
                justification: |
                  PlantUML accepts both forms, and a report about a parameter must point at its line.
                tests:
                  - PlantUmlSkinParams_TryRead_LineAndBlockForms

              - id: CanvasNetPlantUml-Styling-SkinParams-Subset
                title: >-
                  The SkinParams unit shall apply, without regard to case, the document settings (background color,
                  default font name, size, and color, round corners, shadowing), the sequence settings (arrow
                  thickness, message alignment, response below arrow, maximum message size, foot box), and the colors,
                  fonts, and line widths of the participant kinds, arrows, life lines, notes, groups, boxes, dividers,
                  activities, swimlanes, partitions, title, header, footer, legend, and caption.
                justification: |
                  These are the skin parameters that diagrams commonly use to set their look.
                tests:
                  - PlantUmlSkinParams_Apply_SupportedSubset_ChangesTheme

              - id: CanvasNetPlantUml-Styling-SkinParams-GraphSubset
                title: >-
                  The SkinParams unit shall apply, in the diagrams that PlantUML lays out with Graphviz only, the
                  colors, fonts, and line widths of classes, their stereotypes and members, objects, maps, and
                  packages, the class settings classAttributeIconSize and circledCharacterRadius, and the arrow
                  settings to their links, and shall report the same parameters as ignored in sequence and activity
                  diagrams.
                justification: |
                  Class diagrams set their look with these parameters; a sequence diagram does not draw classes, so the
                  parameters must not be silently accepted there.
                tests:
                  - PlantUmlSkinParams_Apply_GraphSubset_OnlyInGraphDiagrams

              - id: CanvasNetPlantUml-Styling-SkinParams-StateSubset
                title: >-
                  The SkinParams unit shall apply, in the diagrams that PlantUML lays out with Graphviz only, the
                  colors, fonts, and line widths of states and of their descriptions, and stateStartColor and
                  stateEndColor to both the fill and the line of the start and end circles, and shall report the same
                  parameters as ignored in sequence and activity diagrams.
                justification: |
                  State diagrams set their look with these parameters; a sequence diagram does not draw states, so the
                  parameters must not be silently accepted there.
                tests:
                  - PlantUmlSkinParams_Apply_StateSubset_OnlyInGraphDiagrams

              - id: CanvasNetPlantUml-Styling-SkinParams-DescriptionSubset
                title: >-
                  The SkinParams unit shall apply, in description diagrams only, the colors, fonts, and line widths of
                  the component, interface, node, rectangle, folder, frame, cloud, card, artifact, storage, file, stack,
                  agent, hexagon, person, label, and usecase symbols (and of the database, actor, queue, boundary,
                  control, entity, and collections symbols, shared with sequence diagrams), and shall report the same
                  symbol parameters as ignored in class and state diagrams.
                justification: |
                  Use case, component, and deployment diagrams set their look with these parameters; a class diagram
                  does not draw these symbols, so the parameters must not be silently accepted there.
                tests:
                  - PlantUmlSkinParams_Apply_DescriptionSubset_OnlyInDescriptionDiagrams

              - id: CanvasNetPlantUml-Styling-SkinParams-Colors
                title: >-
                  The SkinParams unit shall read PlantUML's colors: HTML color names with or without a hash,
                  `#RRGGBB`, `#RRGGBBAA`, `#RGB`, a single hexadecimal digit for a gray, transparent, and the first
                  color of a gradient.
                justification: |
                  Colors appear in skin parameters and on participants, notes, and boxes, in all of PlantUML's forms.
                tests:
                  - PlantUmlSkinParams_TryParseColor_ReadsPlantUmlForms

              - id: CanvasNetPlantUml-Styling-SkinParams-Ignored
                title: >-
                  The SkinParams unit shall report a skin parameter outside the subset, a stereotyped parameter, and a
                  value that cannot be read as the warning plantuml-skinparam-ignored at its line without changing the
                  look, and a style block as plantuml-style-unsupported, skipping it to its end.
                justification: |
                  An author must learn which settings were not applied, and an unknown setting must not change the
                  look.
                tests:
                  - PlantUmlSkinParams_Apply_Ignored_ReportsWarnings
                  - PlantUmlSkinParams_TrySkipStyle_ReportsAndSkips
