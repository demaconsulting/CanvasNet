---
# Software Unit Requirements for DiagramDetector
#
# These requirements describe the design-level behavior of the DiagramDetector unit of the Syntax subsystem (internal
# namespace DemaConsulting.CanvasNet.PlantUml.Syntax): the diagram type from the @start tag or from the statements in
# PlantUML's order (sequence, activity, class, legacy activity, description, state), the recognized types that are not
# drawn, and the errors. See
# docs/verification/canvas-net-plant-uml/syntax/diagram-detector.md for the test-evidence mapping.

sections:
  - title: CanvasNetPlantUml Requirements
    sections:
      - title: Syntax Requirements
        sections:
          - title: DiagramDetector Requirements
            requirements:
              - id: CanvasNetPlantUml-Syntax-DiagramDetector-Tags
                title: >-
                  The DiagramDetector unit shall name the type of a block from its @start tag other than @startuml,
                  and refuse an unknown tag with a located plantuml-unknown-diagram error whose hint names the nearest
                  known tag.
                justification: |
                  A misspelled tag is a common mistake, and the nearest tag tells the author how to fix it.
                tests:
                  - PlantUmlDiagramDetector_Detect_OtherTag_NamesType
                  - PlantUmlDiagramDetector_Detect_UnknownTag_ThrowsWithNearestTag
                  - PlantUmlDiagramDetector_EditDistance_CountsEdits

              - id: CanvasNetPlantUml-Syntax-DiagramDetector-FactoryOrder
                title: >-
                  The DiagramDetector unit shall detect a sequence diagram when every statement outside multi-line text
                  blocks (notes, legends, page texts, references, skin parameter blocks, and style blocks, each closed
                  by its own end keyword written with or without a space) is a sequence statement (a message to or
                  from the diagram border, written with [, ], or ? and an optional circle or cross at that end,
                  included), and otherwise an activity diagram of the new syntax when every statement is an activity
                  statement. A skin parameter block, with its nested blocks and its closing brace, is one statement
                  that every type accepts.
                justification: |
                  PlantUML tries the sequence diagram first, so a text both types could read is a sequence diagram; the
                  lines of a text block are text, not statements. PlantUML reads a found or lost message as a sequence
                  statement, so a diagram that uses one is a sequence diagram. A skinparam block styles any type, so
                  its closing brace must not decide the type (a sequence diagram must not become a class diagram).
                tests:
                  - PlantUmlDiagramDetector_Detect_SequenceStatements_IsSequence
                  - PlantUmlDiagramDetector_Detect_ActivityStatements_IsActivity
                  - PlantUmlDiagramDetector_BlockClosers_AreRecognized
                  - PlantUmlDiagramDetector_Detect_BorderMessages_IsSequence
                  - PlantUmlDiagramDetector_IsBorderMessage_ReadsTheBorderEnds
                  - PlantUmlDiagramDetector_Detect_SkinParamBlock_KeepsTheType

              - id: CanvasNetPlantUml-Syntax-DiagramDetector-GraphFamilies
                title: >-
                  The DiagramDetector unit shall detect, after the sequence and activity diagrams and in PlantUML's
                  factory order, a class diagram when every statement is a class statement (an object diagram when an
                  object or a map is declared before any class), then a legacy activity diagram, then a description
                  diagram (a use case diagram when any statement uses a use case construct, else a component diagram
                  when any statement uses a component construct, else a deployment diagram), then a state diagram, and
                  shall draw the class, object, state, use case, component, and deployment diagrams. A line :x whose
                  action is never closed refuses the activity diagram when a graph family reads the text (it is a
                  statement, such as the actor :Guest:), and is the activity diagram's unclosed action otherwise; the
                  statements after an action that is never closed are found visiting each statement at most twice.
                justification: |
                  A text that several families could read must be the diagram PlantUML draws from it: a plain message is
                  a sequence diagram, a class relationship a class diagram, a class mixed with an actor a class
                  diagram whose parser refuses the actor, and an actor written :Guest: a use case diagram (PlantUML's
                  multi-line action needs its ending ;). The work of reading untrusted text must grow linearly with it.
                tests:
                  - PlantUmlDiagramDetector_Detect_ClassFamily_IsDrawn
                  - PlantUmlDiagramDetector_Detect_ComponentDiagram_IsDrawn
                  - PlantUmlDiagramDetector_Detect_UseCaseDiagram_IsDrawn
                  - PlantUmlDiagramDetector_Detect_DeploymentDiagram_IsDrawn
                  - PlantUmlDiagramDetector_Detect_UnclosedActionOfActivity_IsActivity
                  - PlantUmlDiagramDetector_Detect_GraphFamilies_FollowPlantUmlOrder
                  - PlantUmlDiagramDetector_OuterStatements_ManyUnclosedActions_VisitEachAtMostTwice

              - id: CanvasNetPlantUml-Syntax-DiagramDetector-OtherTypes
                title: >-
                  The DiagramDetector unit shall name the type of a diagram that no drawn type reads from the first
                  statement that only another type uses (legacy activity, timing, gantt), as a
                  type that is not drawn, with a hint that lists the drawn types. A first word that is the whole left
                  end of an arrow (Agent -> : x) is a name, not a declaration keyword of another type or of a graph
                  family (agent, node, file, card, class, object, state, ...), so that an unreadable message from a
                  participant with such a name is a located sequence syntax error at the message, while a declaration
                  followed by a link keeps naming its type.
                justification: |
                  A diagram of a type that is not drawn must be reported as such, not as a syntax error. Participants
                  are often named Agent, Node, or File: one broken message from such a participant must point at that
                  message, not turn the whole diagram into a deployment, class, or state diagram whose parser then
                  refuses a valid participant declaration.
                tests:
                  - PlantUmlDiagramDetector_Detect_OtherTypeKeyword_IsRecognized
                  - PlantUmlDiagramDetector_UnsupportedHint_ListsDrawnTypes
                  - PlantUmlDiagramDetector_Detect_BadMessageFromKeywordNamedParticipant_IsSequenceErrorAtTheMessage
                  - PlantUmlDiagramDetector_Detect_MessagesFromKeywordNamedParticipants_AreSequence
                  - PlantUmlDiagramDetector_Detect_KeywordDeclarationsWithLinks_KeepTheirType
                  - PlantUmlDiagramDetector_StartsWithArrowFromFirstWord_ReadsTheLeftEnd

              - id: CanvasNetPlantUml-Syntax-DiagramDetector-Errors
                title: >-
                  The DiagramDetector unit shall refuse a diagram with nothing to draw, and a diagram whose statements
                  no type accepts at the first statement the more likely type refuses, with located syntax errors.
                justification: |
                  PlantUML reports such text as a syntax error at a line; the error must point at the statement to fix.
                tests:
                  - PlantUmlDiagramDetector_Detect_EmptyDiagram_Throws
                  - PlantUmlDiagramDetector_Detect_UnknownStatement_ThrowsAtStatement
