---
# Software Unit Requirements for SceneModel
#
# These requirements describe the design-level behavior of the SceneModel unit of the Scenegraph subsystem (internal
# namespace DemaConsulting.CanvasNet.PlantUml.Scenegraph): the shapes a diagram draws, the bounds of a scene, and the
# device path of a shape. See docs/verification/canvas-net-plant-uml/scenegraph/scene-model.md for the test-evidence
# mapping.

sections:
  - title: CanvasNetPlantUml Requirements
    sections:
      - title: Scenegraph Requirements
        sections:
          - title: SceneModel Requirements
            requirements:
              - id: CanvasNetPlantUml-Scenegraph-SceneModel-Shapes
                title: >-
                  The SceneModel unit shall build the outlines of rectangles with square or rounded corners, ellipses,
                  closed polygons, open polylines, and lines, and turn them into device paths at a scale and offset.
                justification: |
                  These are the shapes of PlantUML's sequence, activity, and graph diagrams.
                tests:
                  - PlantUmlSceneModel_Shapes_HaveTheirBounds
                  - PlantUmlSceneModel_ToPath_ScalesAndTranslates

              - id: CanvasNetPlantUml-Scenegraph-SceneModel-Bounds
                title: >-
                  The SceneModel unit shall give the bounds of a set of items as the union of their shapes and the
                  boxes of their text lines, and no bounds for no items.
                justification: |
                  A layout sizes its picture from the bounds of what it draws.
                tests:
                  - PlantUmlSceneModel_BoundsOf_CombinesPathsAndText

              - id: CanvasNetPlantUml-Scenegraph-SceneModel-PageTexts
                title: >-
                  The SceneModel unit shall place the page texts of a diagram around its body as PlantUML does: the
                  header and the title above it, the legend, the caption, and the footer below it, with their
                  alignments, the body centered in the widest of them, the spacing of the diagram type (an activity
                  diagram's page is 5 pixels wider around its header, title, and footer, and its body counts 5 pixels
                  shorter; a graph diagram's header is at the top, its title 10 below it, its centered texts centered 6
                  left of the middle, and its legend 6 below the body), and a body without page texts unchanged.
                justification: |
                  Every diagram type has the same page texts, so they are placed once for all of them.
                tests:
                  - PlantUmlSceneModel_ScenePage_PlacesPageTexts
                  - PlantUmlSceneModel_ScenePage_NoTextsAndTranslate
                  - PlantUmlSceneModel_ScenePage_ActivitySpacing
                  - PlantUmlSceneModel_ScenePage_SvekSpacing
