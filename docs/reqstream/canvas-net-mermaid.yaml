      - id: CanvasNetMermaid-LayoutFidelity
        title: >-
          The library shall lay out a flowchart as Mermaid does - the same view box, node centers and sizes,
          subgraph rectangles, edge routes, and edge label positions - and a sequence diagram as Mermaid does - the
          same view box, participants, lifelines, messages and their markers, notes, activations, frames, rect
          backgrounds, boxes, and menus - and a class diagram as Mermaid does - the same view box, class boxes and
          their parts, namespace rectangles and titles, relation routes, labels, and cardinalities, and title - and a
          state diagram as Mermaid does - the same view box, states and their parts, composite state rectangles,
          inner areas, and titles, concurrent regions, notes, transition routes, labels, and title - and an entity
          relationship diagram as Mermaid does - the same view box, entity tables with their rows, cells, and
          dividers, subgraph rectangles and titles, relationship routes, roles, and title - and a pie chart as Mermaid
          does - the same view box, outer circle, slice paths, percentage labels, title, and legend entries - and a
          gantt chart as Mermaid does for the same clock - the same view box, section rows, bars, milestones, vertical
          markers, task texts, section titles, excluded days, axes and their ticks, today line, and title - and a
          mindmap as Mermaid does - the same view box, node sizes, centers, and paint, and edge routes and paint, the
          layout equal bit for bit to Mermaid's for the same node sizes - and a packet diagram as Mermaid does - the
          same view box, block rectangles, labels, bit numbers, and title - and a git graph as Mermaid does - the same
          view box, branch lines and labels, arrows, commit bullets, commit labels, tags, and title - within the
          tolerance documented in the system design when Mermaid measures text with the same bundled fonts.
        tags: [system]
        justification: |
          A picture that differs in layout from the one the author previewed in Mermaid breaks the author's
          intent (crossing links, moved groups); comparing against Mermaid's own output is the only objective
          measure of fidelity.
        children:
          - CanvasNetMermaid-Graphlib-GraphStructure
