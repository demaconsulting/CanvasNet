---
# Software System Requirements for CanvasNetMermaid
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.Mermaid package (root
# namespace DemaConsulting.CanvasNet.Mermaid; internal subsystem namespaces Syntax, Configuration, Graphlib, Dagre,
# Rendering, Scenegraph, Flowchart, Sequence, Class, State, Er, Pie, Gantt, Mindmap, Cose, Packet, and GitGraph) from
# the perspective of its consumers, without specifying implementation details.
#
# CanvasNetMermaid is an independent software system distributed as its own NuGet package. It reads Mermaid diagram text
# and renders a static, deterministic picture onto a CanvasNet Surface using only managed code and the public CanvasNet
# APIs: there is no browser, no JavaScript runtime, no network access, and no dependency on any Mermaid, dagre, or d3
# package. This version draws flowcharts (the flowchart and graph keywords) with Mermaid's own layout (a port of dagre)
# and Mermaid's own shapes, labels, edges, themes, and styles, sequence diagrams (the sequenceDiagram keyword) with a
# port of Mermaid's sequence renderer, class diagrams (the classDiagram keyword) with the same layout and Mermaid's
# class boxes, markers, and cardinalities, state diagrams (the stateDiagram keyword) with the same layout and Mermaid's
# state shapes, composite states, and notes, and entity relationship diagrams (the erDiagram keyword) with the same
# layout and Mermaid's entity tables and cardinality markers, pie charts (the pie keyword) with a port of Mermaid's pie
# renderer, gantt charts (the gantt keyword) with a port of Mermaid's gantt renderer and of the d3 time scale and the
# dayjs date functions it uses, with today taken only from the caller, mindmaps (the mindmap keyword) with a port of
# Mermaid's mindmap renderer laid out by a port of the cose-bilkent layout, packet diagrams (the packet and
# packet-beta keywords) with a port of Mermaid's packet renderer, and git graphs (the gitGraph keyword) with a port of
# Mermaid's git graph database and renderer; every other Mermaid diagram type is
# recognized and reported as unsupported with a stable mermaid-* identifier instead of failing or drawing a guess (see
# docs/design/canvas-net-mermaid.md, Fidelity and Known Differences, and the Phase Plan). The ported behavior of
# Mermaid, the Mermaid parser package and Langium, dagre, graphlib, d3, dayjs, cytoscape, cytoscape-cose-bilkent,
# cose-base, layout-base, khroma, js-yaml, lodash, marked, and sanitize-url is attributed in the package's third-party
# notices (src/DemaConsulting.CanvasNet.Mermaid/third-party).
#
# Every requirement below links down to the subsystem and unit requirements that implement it; the test evidence is
# described in docs/verification/canvas-net-mermaid.md.

sections:
  - title: CanvasNetMermaid Requirements
    requirements:
      - id: CanvasNetMermaid-Open
        title: >-
          The library shall parse Mermaid diagram text supplied as a string, a readable stream, or a file path into
          a MermaidDocument that is identical whichever entry point is used, shall ignore a leading byte-order mark,
          shall refuse text that is not valid UTF-8, and shall reject null arguments and unreadable sources with the
          documented exception contract.
        tags: [system]
        justification: |
          Callers hold diagrams in different forms (a code block, an embedded resource, a file); every entry point
          must yield the same validated result, and invalid arguments must fail closed with a predictable exception
          rather than being coerced.
        children:
          - CanvasNetMermaid-MermaidDocument-ParseOpen
          - CanvasNetMermaid-Syntax-Preprocessing
          - CanvasNetMermaid-Flowchart-Language
          - CanvasNetMermaid-Sequence-Language
          - CanvasNetMermaid-Class-Language
          - CanvasNetMermaid-State-Language
          - CanvasNetMermaid-Er-Language
          - CanvasNetMermaid-Pie-Language
          - CanvasNetMermaid-Gantt-Language
          - CanvasNetMermaid-Mindmap-Language
          - CanvasNetMermaid-Packet-Language
          - CanvasNetMermaid-GitGraph-Language
        tests:
          - CanvasNetMermaid_Open_StringStreamAndPath_Agree
          - CanvasNetMermaid_Flowchart_Fixture_RendersStrictly

      - id: CanvasNetMermaid-DiagramMetadata
        title: >-
          The library shall let a caller read what a diagram declares - its diagram type, whether this version
          draws it, its title, its accessible title, its direction, and its node, edge, and subgraph counts (for a
          sequence diagram its participants, messages, and boxes; for a class diagram its classes, relations, and
          the namespaces it draws; for a state diagram its states, transitions, and composite states; for an entity
          relationship diagram its drawn entities, relationships, and subgraphs; for a pie chart its sections; for a
          gantt chart its tasks and the sections it draws; for a mindmap its nodes and their links; for a packet diagram
          its blocks as written; for a git graph its commits and the links to their parents) - from a parsed document
          without rendering it and without opening any other file or the network.
        tags: [system]
        justification: |
          Tools describe a diagram before they render it (the canvasnet info command, a documentation filter that
          decides whether to draw a code block); the description must be available from the text alone, cheaply
          and safely.
        children:
          - CanvasNetMermaid-MermaidDocument-Metadata
          - CanvasNetMermaid-Syntax-Preprocessing
          - CanvasNetMermaid-Syntax-Detection
          - CanvasNetMermaid-Configuration-Detection
          - CanvasNetMermaid-Flowchart-Metadata
          - CanvasNetMermaid-Sequence-Metadata
          - CanvasNetMermaid-Class-Metadata
          - CanvasNetMermaid-State-Metadata
          - CanvasNetMermaid-Er-Metadata
          - CanvasNetMermaid-Pie-Metadata
          - CanvasNetMermaid-Gantt-Metadata
          - CanvasNetMermaid-Mindmap-Metadata
          - CanvasNetMermaid-Packet-Metadata
          - CanvasNetMermaid-GitGraph-Metadata
        tests:
          - CanvasNetMermaid_Metadata_Flowchart_DescribesTheDiagram
          - CanvasNetMermaid_Render_OtherKnownTypes_AreUnsupportedWithHint
          - CanvasNetMermaid_ClassDiagram_Metadata_CountsClassesRelationsAndNamespaces
          - CanvasNetMermaid_ClassDiagram_Metadata_CountsTheDrawnNamespaces
          - CanvasNetMermaid_StateDiagram_Metadata_CountsStatesTransitionsAndComposites
          - CanvasNetMermaid_ErDiagram_Metadata_CountsEntitiesRelationshipsAndSubgraphs
          - CanvasNetMermaid_PieChart_Metadata_CountsTheSections
          - CanvasNetMermaid_GanttChart_Metadata_CountsTasksAndSections
          - CanvasNetMermaid_Mindmap_Metadata_CountsNodesAndEdges
          - CanvasNetMermaid_PacketDiagram_Metadata_CountsTheBlocks
          - CanvasNetMermaid_GitGraph_Metadata_CountsCommitsAndParentLinks

      - id: CanvasNetMermaid-SyntaxErrors
        title: >-
          The library shall fail closed on invalid diagram text with a MermaidSyntaxException that carries a stable
          mermaid-* code, the source name and the one-based line and column of the problem in the original text
          (including inside the frontmatter), a hint that suggests the fix, and the tokens that were expected, and
          shall name the nearest known keyword when the diagram keyword is unknown.
        tags: [system]
        justification: |
          Authors and agents need to find and fix a mistake in a diagram quickly; a renderer that guessed at
          invalid text would draw a picture that silently differs from the author's intent, as a browser would
          draw an error picture instead.
        children:
          - CanvasNetMermaid-MermaidDocument-ErrorContract
          - CanvasNetMermaid-MermaidDocument-DiagnosticCodes
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-Detection
          - CanvasNetMermaid-Syntax-Yaml
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Flowchart-FailClosed
          - CanvasNetMermaid-Sequence-FailClosed
          - CanvasNetMermaid-Class-FailClosed
          - CanvasNetMermaid-State-FailClosed
          - CanvasNetMermaid-Er-FailClosed
          - CanvasNetMermaid-Pie-FailClosed
          - CanvasNetMermaid-Gantt-FailClosed
          - CanvasNetMermaid-Mindmap-FailClosed
          - CanvasNetMermaid-Packet-FailClosed
          - CanvasNetMermaid-GitGraph-FailClosed
        tests:
          - CanvasNetMermaid_SyntaxErrors_AreLocatedCodedAndHinted
          - CanvasNetMermaid_Hardening_MutatedFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedClassFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedStateFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedErFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedPieFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedGanttFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedMindmapFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedPacketFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_Hardening_MutatedGitGraphFixtures_ThrowOnlyDocumentedExceptions
          - CanvasNetMermaid_PieChart_NegativeValue_FailsLocated
          - CanvasNetMermaid_Mindmap_SecondRoot_FailsLocated
          - CanvasNetMermaid_PacketDiagram_GapBetweenBlocks_FailsLocated
          - CanvasNetMermaid_GitGraph_RejectedMerge_FailsLocated

      - id: CanvasNetMermaid-Configuration
        title: >-
          The library shall resolve the effective configuration of a diagram in Mermaid's order - the Mermaid
          defaults, then the caller's site configuration and theme, then the configuration of the frontmatter, then
          the init directives of the text - shall never let the text change a secure key of the site, and shall
          report a configuration key it does not know or a value of the wrong type instead of failing.
        tags: [system]
        justification: |
          A documentation build applies a house style on top of whatever a diagram says, while a diagram must keep
          the right to choose its own theme and spacing, exactly as it does in Mermaid; untrusted text must not
          raise what the host has locked.
        children:
          - CanvasNetMermaid-MermaidDocument-Options
          - CanvasNetMermaid-Syntax-Preprocessing
          - CanvasNetMermaid-Syntax-Yaml
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-Reports
          - CanvasNetMermaid-Configuration-Detection
          - CanvasNetMermaid-Flowchart-LayoutData
          - CanvasNetMermaid-Sequence-Layout
          - CanvasNetMermaid-Class-Layout
          - CanvasNetMermaid-State-Layout
          - CanvasNetMermaid-Er-Layout
        tests:
          - CanvasNetMermaid_Configuration_TextOverridesTheCaller
          - CanvasNetMermaid_ErDiagram_TopLevelNodeSpacing_WinsOverTheErSpacing

      - id: CanvasNetMermaid-Themes
        title: >-
          The library shall draw with the five Mermaid themes default, base, dark, forest, and neutral, deriving
          every theme color as Mermaid does from the theme and its themeVariables overrides, so that a diagram has
          the same colors as in Mermaid.
        tags: [system]
        justification: |
          A diagram's colors are part of its meaning and its house style; readers expect a CanvasNet picture of a
          Mermaid diagram to look like the one Mermaid draws.
        children:
          - CanvasNetMermaid-MermaidDocument-Options
          - CanvasNetMermaid-Configuration-Themes
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Rendering-NodeShapes
          - CanvasNetMermaid-Sequence-Drawing
          - CanvasNetMermaid-Class-Drawing
          - CanvasNetMermaid-State-Drawing
          - CanvasNetMermaid-Er-Drawing
          - CanvasNetMermaid-Pie-Drawing
          - CanvasNetMermaid-Gantt-Drawing
          - CanvasNetMermaid-Mindmap-Drawing
          - CanvasNetMermaid-Packet-Drawing
          - CanvasNetMermaid-GitGraph-Drawing
        tests:
          - CanvasNetMermaid_Flowchart_DefaultTheme_PaintsMermaidsColors
          - CanvasNetMermaid_Flowchart_Theme_ChangesTheNodeFill
          - CanvasNetMermaid_Sequence_DefaultTheme_PaintsMermaidsColors
          - CanvasNetMermaid_Sequence_Theme_ChangesTheParticipantFill
          - CanvasNetMermaid_ClassDiagram_DefaultTheme_PaintsMermaidsColors
          - CanvasNetMermaid_ClassDiagram_Theme_ChangesTheBoxFill
          - CanvasNetMermaid_StateDiagram_DefaultTheme_PaintsMermaidsColors
          - CanvasNetMermaid_StateDiagram_ConcurrentRegion_IsFilledWithTheAlternateBackground
          - CanvasNetMermaid_StateDiagram_Theme_ChangesTheStateFill
          - CanvasNetMermaid_ErDiagram_DefaultTheme_PaintsTheRowsInTurn
          - CanvasNetMermaid_ErDiagram_DefaultTheme_StrokesTheTableInTheNodeBorder
          - CanvasNetMermaid_ErDiagram_ZeroMarker_IsAWhiteCircle
          - CanvasNetMermaid_ErDiagram_Theme_ChangesTheEntityFill
          - CanvasNetMermaid_PieChart_DefaultTheme_PaintsSlicesAndLegend
          - CanvasNetMermaid_PieChart_Theme_ChangesTheSectionColors
          - CanvasNetMermaid_GanttChart_DefaultTheme_PaintsTheTaskStates
          - CanvasNetMermaid_GanttChart_Theme_ChangesTheBarColors
          - CanvasNetMermaid_Mindmap_DefaultTheme_PaintsRootAndSections
          - CanvasNetMermaid_Mindmap_Theme_ChangesTheColors
          - CanvasNetMermaid_PacketDiagram_Pixels_CarryTheThemeColors
          - CanvasNetMermaid_GitGraph_Pixels_CarryTheThemeColors

      - id: CanvasNetMermaid-Flowcharts
        title: >-
          The library shall draw flowchart diagrams (the flowchart and graph keywords) with every documented node
          shape and its aliases and bracket forms, every link form (strokes, heads, lengths, labels, ids, chains),
          nested subgraphs with their own directions, the four directions, classDef, class, style, and linkStyle
          declarations, markdown, HTML, and plain labels, the documented curves and markers, and the frontmatter
          title.
        tags: [system]
        justification: |
          Flowcharts are the most used Mermaid diagram type and the one this version delivers end to end; an
          author must be able to use the whole flowchart language without checking which parts are drawn.
        children:
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-Yaml
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Configuration-Declarations
          - CanvasNetMermaid-Graphlib-GraphStructure
          - CanvasNetMermaid-Dagre-Layout
          - CanvasNetMermaid-Rendering-Layout
          - CanvasNetMermaid-Rendering-NodeShapes
          - CanvasNetMermaid-Rendering-Edges
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-Flowchart-Language
          - CanvasNetMermaid-Flowchart-LayoutData
          - CanvasNetMermaid-Flowchart-Drawing
        tests:
          - CanvasNetMermaid_Flowchart_Fixture_RendersStrictly
          - CanvasNetMermaid_Flowchart_ClassDefAndStyle_PaintTheNodes
          - CanvasNetMermaid_SystemIntegration_Gallery_HoldsEveryDrawnDiagramType
          - CanvasNetMermaid_SystemIntegration_Gallery_RendersStrictWithoutWarnings

      - id: CanvasNetMermaid-SequenceDiagrams
        title: >-
          The library shall draw sequence diagrams (the sequenceDiagram keyword) with the eight participant types,
          aliases, participant metadata, links, and properties, every arrow of messages, activations, notes, the loop,
          alt, opt, par, par_over, critical, break, and rect blocks, boxes, created and destroyed participants,
          sequence numbers, the sequence configuration settings, and the title.
        tags: [system]
        justification: |
          Sequence diagrams are the second most used Mermaid diagram type and describe how parts of a system talk to
          each other; an author must be able to use the whole sequence language without checking which parts are
          drawn.
        children:
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Model
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-Sequence-Language
          - CanvasNetMermaid-Sequence-Layout
          - CanvasNetMermaid-Sequence-Drawing
        tests:
          - CanvasNetMermaid_Sequence_Fixture_RendersStrictly
          - CanvasNetMermaid_Sequence_DefaultTheme_PaintsMermaidsColors
          - CanvasNetMermaid_SystemIntegration_Gallery_HoldsEveryDrawnDiagramType
          - CanvasNetMermaid_SystemIntegration_Gallery_RendersStrictWithoutWarnings

      - id: CanvasNetMermaid-ClassDiagrams
        title: >-
          The library shall draw class diagrams (the classDiagram and classDiagram-v2 keywords, and the legacy class
          renderer setting) with classes and their labels, generics, members, methods, visibility, static and abstract
          classifiers, and annotations, the relation forms with their markers, cardinalities, and labels, two-way
          relations, lollipop interfaces, nested and dotted namespaces, notes, the directions, classDef, cssClass,
          and style declarations, the class configuration settings, and the frontmatter title, and shall open the
          click, link, and callback statements without drawing them.
        tags: [system]
        justification: |
          Class diagrams describe the structure of software and are among the most used Mermaid diagram types; an
          author must be able to use the whole class language without checking which parts are drawn.
        children:
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Configuration-Declarations
          - CanvasNetMermaid-Dagre-Layout
          - CanvasNetMermaid-Rendering-Layout
          - CanvasNetMermaid-Rendering-NodeShapes
          - CanvasNetMermaid-Rendering-Edges
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Model
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-Class-Language
          - CanvasNetMermaid-Class-Layout
          - CanvasNetMermaid-Class-Drawing
          - CanvasNetMermaid-Class-InteractionIgnored
        tests:
          - CanvasNetMermaid_ClassDiagram_Fixture_RendersStrictly
          - CanvasNetMermaid_ClassDiagram_ClassifiersAndStyles_StyleTheBox
          - CanvasNetMermaid_ClassDiagram_LegacyRenderer_IsDrawnTheSame
          - CanvasNetMermaid_SystemIntegration_Gallery_HoldsEveryDrawnDiagramType
          - CanvasNetMermaid_SystemIntegration_Gallery_RendersStrictWithoutWarnings

      - id: CanvasNetMermaid-StateDiagrams
        title: >-
          The library shall draw state diagrams (the stateDiagram-v2 and stateDiagram keywords, and the legacy state
          renderer setting) with states and their descriptions, transitions and their labels, the start and end
          states, nested composite states with their own directions, concurrent regions, the fork, join, and choice
          states, notes, the directions, classDef, class, and style declarations, the state configuration settings,
          and the frontmatter title; shall open the click statements without drawing them; and shall fail, located,
          on the state diagrams that Mermaid's render fails on (a note on a state that appears nowhere before it,
          composite states inside each other).
        tags: [system]
        justification: |
          State diagrams describe the behavior of software and devices and are among the most used Mermaid diagram
          types; an author must be able to use the whole state language without checking which parts are drawn, and a
          diagram Mermaid cannot draw must not be drawn as a guess.
        children:
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Configuration-Declarations
          - CanvasNetMermaid-Dagre-Layout
          - CanvasNetMermaid-Rendering-Layout
          - CanvasNetMermaid-Rendering-NodeShapes
          - CanvasNetMermaid-Rendering-Edges
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-State-Language
          - CanvasNetMermaid-State-Layout
          - CanvasNetMermaid-State-Drawing
          - CanvasNetMermaid-State-LegacyRenderer
        tests:
          - CanvasNetMermaid_StateDiagram_Fixture_RendersStrictly
          - CanvasNetMermaid_StateDiagram_StylesAndClasses_FillTheState
          - CanvasNetMermaid_StateDiagram_NestedNoteMarkup_IsSanitized
          - CanvasNetMermaid_StateDiagram_LegacyRenderer_IsReportedAndDrawnTheSame
          - CanvasNetMermaid_StateDiagram_MermaidRenderFailures_AreLocated
          - CanvasNetMermaid_SystemIntegration_Gallery_HoldsEveryDrawnDiagramType
          - CanvasNetMermaid_SystemIntegration_Gallery_RendersStrictWithoutWarnings

      - id: CanvasNetMermaid-ErDiagrams
        title: >-
          The library shall draw entity relationship diagrams (the erDiagram keyword) with entities, their aliases,
          and their attribute tables with types (generic types drawn with angle brackets), names, keys, and comments,
          the relationships with the markers of every cardinality in symbols and words, identifying and
          non-identifying lines, and roles, nested subgraphs with their own directions, the directions, classDef,
          class, and style declarations, the entity relationship configuration settings, and the frontmatter title;
          and shall fail, located, on the entity relationship diagrams that Mermaid's render fails on (a relationship
          end that is not drawn, a subgraph inside itself).
        tags: [system]
        justification: |
          Entity relationship diagrams describe the data of software and are among the most used Mermaid diagram
          types; an author must be able to use the whole entity relationship language without checking which parts
          are drawn, and a diagram Mermaid cannot draw must not be drawn as a guess.
        children:
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Configuration-Declarations
          - CanvasNetMermaid-Dagre-Layout
          - CanvasNetMermaid-Rendering-Layout
          - CanvasNetMermaid-Rendering-NodeShapes
          - CanvasNetMermaid-Rendering-Edges
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-Er-Language
          - CanvasNetMermaid-Er-Layout
          - CanvasNetMermaid-Er-Drawing
        tests:
          - CanvasNetMermaid_ErDiagram_Fixture_RendersStrictly
          - CanvasNetMermaid_ErDiagram_Markers_FollowTheCardinalities
          - CanvasNetMermaid_ErDiagram_StylesAndClasses_FillTheNameAndEvenRows
          - CanvasNetMermaid_ErDiagram_GenericTypes_AreDrawnWithAngleBrackets
          - CanvasNetMermaid_ErDiagram_MermaidRenderFailures_AreLocated
          - CanvasNetMermaid_SystemIntegration_Gallery_HoldsEveryDrawnDiagramType
          - CanvasNetMermaid_SystemIntegration_Gallery_RendersStrictWithoutWarnings

      - id: CanvasNetMermaid-PieCharts
        title: >-
          The library shall draw pie charts (the pie keyword) with their sections in order (a repeated label keeping
          its first value), the showData flag, the title, the accessibility statements, the slices with their
          percentage labels (a section under one percent of the sum not drawn as a slice), the legend in each of
          Mermaid's positions, the donut hole, the highlighted slice, the text position, and the colors of the theme;
          and shall fail, located, on a negative value, as Mermaid does.
        tags: [system]
        justification: |
          Pie charts are among the most used Mermaid diagram types in documentation; an author must be able to use the
          whole pie language and its settings without checking which parts are drawn, and a value Mermaid refuses must
          not be drawn as a guess.
        children:
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-Pie-Language
          - CanvasNetMermaid-Pie-FailClosed
          - CanvasNetMermaid-Pie-Drawing
        tests:
          - CanvasNetMermaid_PieChart_Fixture_RendersStrictly
          - CanvasNetMermaid_PieChart_DefaultTheme_PaintsSlicesAndLegend
          - CanvasNetMermaid_PieChart_NegativeValue_FailsLocated
          - CanvasNetMermaid_SystemIntegration_Gallery_HoldsEveryDrawnDiagramType
          - CanvasNetMermaid_SystemIntegration_Gallery_RendersStrictWithoutWarnings

      - id: CanvasNetMermaid-GanttCharts
        title: >-
          The library shall draw gantt charts (the gantt keyword) with their sections, tasks with their tags (active,
          done, crit, milestone, and vert), ids, starts, ends, and durations, after and until references, the
          dateFormat, axisFormat, tickInterval, weekday, excludes, includes, weekend, inclusiveEndDates, and
          todayMarker statements, the compact display mode, the click statements (kept as data, never drawn as links),
          the title, the accessibility statements, and the gantt configuration settings, with every date in UTC; shall
          take today only from the time the caller gives as the clock of the render (MermaidRenderOptions.Now), never
          from the system clock, and without it draw no today line and report with mermaid-gantt-today-unavailable
          what needs today; shall report with mermaid-gantt-ticks-skipped and mermaid-gantt-excludes-skipped the
          ticks and excluded days that Mermaid leaves out; and shall fail, located, on the gantt charts that Mermaid's
          render fails on (a date it cannot read, a first task without a start, excluded days that never end, tasks
          whose references never resolve).
        tags: [system]
        justification: |
          Gantt charts plan projects in documentation; an author must be able to use the whole gantt language without
          checking which parts are drawn. A render must be the same on every machine and every day, so the time zone
          is fixed and the host decides the clock; a chart Mermaid cannot draw must not be drawn as a guess.
        children:
          - CanvasNetMermaid-MermaidDocument-Options
          - CanvasNetMermaid-Syntax-ParserInput
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Configuration-Precedence
          - CanvasNetMermaid-Configuration-StyleSheet
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Painting
          - CanvasNetMermaid-Gantt-Language
          - CanvasNetMermaid-Gantt-FailClosed
          - CanvasNetMermaid-Gantt-Dates
          - CanvasNetMermaid-Gantt-Clock
          - CanvasNetMermaid-Gantt-Drawing
        tests:
          - CanvasNetMermaid_GanttChart_Fixture_RendersStrictly
          - CanvasNetMermaid_GanttChart_DefaultTheme_PaintsTheTaskStates
          - CanvasNetMermaid_GanttChart_Now_DrawsTheTodayLineOrReports
