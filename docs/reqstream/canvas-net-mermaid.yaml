      - id: CanvasNetMermaid-UnsupportedFeatures
        title: >-
          The library shall report every construct it recognizes but does not draw - a diagram type other than a
          flowchart, a sequence diagram, a class diagram, a state diagram, an entity relationship diagram, a pie chart,
          a gantt chart, a mindmap, a packet diagram, or a git graph (drawn as an empty transparent picture), the
          hand-drawn look, a layout other than dagre (for a mindmap, other than cose-bilkent), the legacy state
          renderer, icons, math, style declarations outside the supported subset, and HTML elements outside the
          supported subset - with a stable mermaid-* code, a message, a hint, and the location, delivered once, in
          order, on the calling thread to the caller's handlers, and shall throw a MermaidUnsupportedFeatureException at
          the first one in strict mode.
