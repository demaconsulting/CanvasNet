        title: >-
          The library shall check every link a diagram keeps (the link and click href of a class diagram, the link
          and links of a sequence diagram, the click and click href of a state diagram, the click href of a gantt
          chart) exactly as the pinned
          Mermaid checks it at its strict security level, whatever the configured security level, so that a
          javascript, data, or vbscript link in any encoding is kept only as about:blank, and shall never expose a
          link as written in any output.
        tags: [system, security]
        justification: |
          Links are kept as data for a host that reads the diagram; a link whose scheme hides behind character
          references, control characters, or percent escapes would run code where it is used, as a partial check
          would let it through.
        children:
          - CanvasNetMermaid-Syntax-UntrustedInput
          - CanvasNetMermaid-Class-InteractionIgnored
          - CanvasNetMermaid-Sequence-Language
          - CanvasNetMermaid-State-Language
          - CanvasNetMermaid-Gantt-Language
        tests:
          - CanvasNetMermaid_Hardening_EncodedUnsafeLinks_AppearInNoOutput

      - id: CanvasNetMermaid-Determinism
        title: >-
          The library shall produce identical pixels and identical reports for the same document and options on
          every render, on every thread, and on every supported platform, measuring and drawing text only with the
          fonts bundled with CanvasNet, computing dates in UTC, making no random choice in a layout, computing the
          transcendental functions of a layout without the host's math library, and never reading the system clock (a
          gantt chart takes today only from the render options).
        tags: [system]
        justification: |
          Documentation builds cache and compare pictures; a picture that changed with the machine, the installed
          fonts, or the thread would break caching and reviews.
        children:
          - CanvasNetMermaid-Configuration-Themes
          - CanvasNetMermaid-Graphlib-KeyOrder
          - CanvasNetMermaid-Graphlib-Consistency
          - CanvasNetMermaid-Dagre-TieBreaking
          - CanvasNetMermaid-Dagre-Determinism
          - CanvasNetMermaid-Rendering-Labels
          - CanvasNetMermaid-Scenegraph-Determinism
          - CanvasNetMermaid-Gantt-Clock
          - CanvasNetMermaid-Cose-Determinism
        tests:
          - CanvasNetMermaid_Flowchart_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Render_Concurrent_IsDeterministic
          - CanvasNetMermaid_Sequence_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_SequenceFixtures_RenderDeterministically
          - CanvasNetMermaid_ClassDiagram_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_ClassFixtures_RenderDeterministically
          - CanvasNetMermaid_StateDiagram_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_StateFixtures_RenderDeterministically
          - CanvasNetMermaid_ErDiagram_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_ErFixtures_RenderDeterministically
          - CanvasNetMermaid_PieChart_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_PieFixtures_RenderDeterministically
          - CanvasNetMermaid_GanttChart_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_GanttFixtures_RenderDeterministically
          - CanvasNetMermaid_GanttChart_Now_DrawsTheTodayLineOrReports
          - CanvasNetMermaid_Mindmap_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_MindmapFixtures_RenderDeterministically
          - CanvasNetMermaid_PacketDiagram_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_PacketFixtures_RenderDeterministically
          - CanvasNetMermaid_GitGraph_RepeatedAndConcurrentRenders_AreIdentical
          - CanvasNetMermaid_Hardening_GitGraphFixtures_RenderDeterministically
          - CanvasNetMermaid_GitGraph_GeneratedIds_AreDeterministic

      - id: CanvasNetMermaid-Cancellation
        title: >-
          The library shall stop measuring or rendering with an OperationCanceledException when the caller's
          cancellation token is canceled.
        tags: [system]
        justification: |
          A large diagram can take noticeable time to lay out; an interactive host or a build must be able to stop
          it.
        children:
          - CanvasNetMermaid-Dagre-Cancellation
          - CanvasNetMermaid-Cose-Limits
          - CanvasNetMermaid-Rendering-Layout
          - CanvasNetMermaid-Scenegraph-BoundedPainting
        tests:
          - CanvasNetMermaid_Render_CanceledToken_Throws
          - CanvasNetMermaid_Flowchart_CanceledToken_Throws
          - CanvasNetMermaid_Sequence_CanceledToken_Throws
          - CanvasNetMermaid_ClassDiagram_CanceledToken_Throws
          - CanvasNetMermaid_StateDiagram_CanceledToken_Throws
          - CanvasNetMermaid_ErDiagram_CanceledToken_Throws
          - CanvasNetMermaid_PieChart_CanceledToken_Throws
          - CanvasNetMermaid_GanttChart_CanceledToken_Throws
          - CanvasNetMermaid_Mindmap_CanceledToken_Throws
          - CanvasNetMermaid_PacketDiagram_CanceledToken_Throws
          - CanvasNetMermaid_GitGraph_CanceledToken_Throws

      - id: CanvasNetMermaid-ImageSource
        title: >-
          The library shall provide an image source that claims the .mmd and .mermaid file name extensions and the
          theme fragment parameter, draws the diagram content of a request at its natural size or at the requested
          size, and returns the reports of the library as image diagnostics.
        tags: [system]
        justification: |
          The CanvasNet image-source contract is how SVG documents, the Viewer library, and the canvasnet tool
          embed and render any supported format; a Mermaid diagram must be usable everywhere a chart or a model is.
        children:
          - CanvasNetMermaid-MermaidDocument-ImageSource
        tests:
          - CanvasNetMermaid_ImageSource_DrawsDiagramBytes

      - id: CanvasNetMermaid-ThirdPartyNotices
        title: >-
          The package shall ship the license texts of the projects whose behavior it ports (Mermaid, the Mermaid parser
          package, Langium, dagre and graphlib, d3, dayjs, cytoscape and cytoscape-cose-bilkent, cose-base and
          layout-base, khroma, js-yaml, lodash, marked, and sanitize-url) and a provenance record that names, for each,
          what was ported and that the package is not affiliated with those projects.
        tags: [system]
        justification: |
          The ported projects are MIT or ISC licensed, which requires their notices to accompany the derived work;
          the provenance record lets a reviewer confirm that only behavior, not code text, was taken.
        tests:
          - CanvasNetMermaid_ThirdPartyNotices_ShipWithPackage
