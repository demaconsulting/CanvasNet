      - id: CanvasNetMermaid-Limits
        title: >-
          The library shall treat diagram text as untrusted and bound the work and memory of a document with
          caller-adjustable limits - the text size, edges, nodes (counted together with every group a diagram draws as a
          cluster: subgraphs, sequence boxes, namespaces, composite states, concurrent regions, and note groups; the
          sections of a pie chart; the tasks and sections of a gantt chart; the nodes of a mindmap; the blocks of a
          packet diagram and the parts its rows split them into; the main branch, branches, and commits of a git
          graph), label length (also of the texts a diagram joins from shorter ones and the messages a git graph
          composes), nesting depth (also the depth of a mindmap), YAML depth (refusing YAML aliases), layout work (also
          the days, references, and ticks of a gantt chart, the layout of a mindmap, the rows and texts of a packet
          diagram, and the arrows and lanes of a git graph), pictures, painted pixels, and reports - failing with a
          located mermaid-limit-exceeded error (or an InvalidDataException for oversized text) instead of hanging or
          exhausting memory.
        tags: [system]
        justification: |
          Diagrams arrive from documents, prompts, and the network; a hostile or accidental input (an alias bomb, a
          complete graph, a deep nesting) must not stop a build or a service.
