      - id: CanvasNetMermaid-Mindmaps
        title: >-
          The library shall draw mindmaps (the mindmap keyword) with the tree that the indentation of their nodes
          makes, every node shape (the default node, the rectangle, the rounded rectangle, the circle, the cloud, the
          bang, and the hexagon), plain, quoted, and markdown texts wrapped at the width Mermaid gives each shape, the
          classes of the nodes, the sections in the colors of the theme, the edges in the colors of their sections and
          the widths of their depths, and the mindmap configuration settings, laid out by Mermaid's default
          cose-bilkent layout without any random choice; shall draw a mindmap of the keyword alone as an empty picture;
          and shall fail, located, on the mindmaps that Mermaid fails on (a second root, an icon or a class before any
          node).
