---
# Software Unit Requirements for the ViewerException Class
#
# The ViewerException class is the exception with which every
# expected failure of the Viewer library is reported (a file that is missing, unsupported, corrupt, or too large; a
# page that does not exist; an output that cannot be written), and the ErrorCodes class names those failures with
# stable strings that programs and the results of the canvasnet tool rely on.

sections:
  - title: CanvasNetViewer Requirements
    sections:
      - title: ViewerException Unit Requirements
        requirements:
          - id: CanvasNetViewer-ViewerException-Contract
            title: >-
              The ViewerException class shall carry a stable error code, a message, an optional hint that says what to
              do about the failure, and an optional inner exception, and shall be an InvalidOperationException so that a
              caller can tell an expected, user-correctable failure from a defect.
            justification: |
              A program that uses the library needs to act on a failure by its code and to show the message and the hint
              to its user, without parsing text.
            tests:
              - ViewerException_Constructor_CarriesCodeMessageHintAndCause
              - ViewerException_Constructor_HintAndCauseAreOptional

          - id: CanvasNetViewer-ViewerException-ErrorCodes
            title: >-
              The ErrorCodes class shall define the stable strings usage-error, operation-failed, input-not-found,
              input-unreadable, unsupported-format, corrupt-input, unsupported-feature, page-out-of-range,
              image-fragment-invalid, size-limit,
              same-input-output, output-exists, output-write-failed, scad-error, vega-lite-error, mermaid-error,
              budget-exceeded, file-access-denied, size-mismatch, and threshold-failed, which shall not change between
              releases.
            justification: |
              The codes are the contract of the library and of the result documents of the canvasnet tool; a script
              branches on them, so a rename would break every caller.
            tests:
              - ErrorCodes_Constants_AreTheDocumentedStableStrings

          - id: CanvasNetViewer-ViewerException-PositionsUnmatched
            title: >-
              The ErrorCodes class shall define the code positions-unmatched for a position selector that matched no
              feature under the strict option.
            justification: |
              A stable code lets a caller tell a selector mistake from every other failure.
            tests:
              - SourceLoader_Load_UnmatchedSelector_WarnsOrFailsWhenStrict
              - CanvasNetViewer_Render_UnmatchedSelector_NoteOrStrictFailure

          - id: CanvasNetViewer-ViewerException-SvgBindingFailed
            title: >-
              The ErrorCodes class shall define the stable code svg-binding-failed for an SVG position binding that was
              not resolved under the strict option.
            justification: |
              A stable code lets a caller tell a binding failure from every other failure.
            tests:
              - SourceLoader_Load_SvgBindingUnmatched_WarnsOrFailsStrictly
              - SvgFlattener_Execute_StrictUnresolvedBinding_WritesNothing

          - id: CanvasNetViewer-ViewerException-PandocFilterError
            title: >-
              The ErrorCodes class shall define the stable code pandoc-filter-error for a picture of a Pandoc document
              that the pandoc-filter command of the tool cannot draw because of the document, its files, the variables
              of the filter, or the picture cache.
            justification: |
              A stable code lets the Pandoc filter, a script, or an agent tell a mistake in a document from a failure
              of the drawing itself, which keeps the code of the library.
            tests:
              - ErrorCodes_Constants_AreTheDocumentedStableStrings
