---
# cspell:ignore canvasnet
# Software Unit Requirements for the MontageBuilder Class
#
# The MontageBuilder class is the montage operation of the library: given the facts about several files (probed
# sources) and a request, it lays them out as cells of one contact sheet, opens one source at a time, composes it into
# its cell, and writes the sheet. It is the library form of the montage command of the canvasnet tool, which parses
# its arguments into the request and prints the result.

sections:
  - title: MontageBuilder Unit Requirements
    requirements:
      - id: CanvasNetViewer-Imaging-MontageBuilder-Compose
        title: >-
          The MontageBuilder class shall place the sources, and the page of a document that is shown, row by row in
          the cells of one sheet, open and release one source at a time, label each cell with the file
          name (and the page number for a document page) when labels are on, write the sheet, and report the layout
          of the sheet, the file written, and the position, size, and label of every cell.
        justification: |
          A contact sheet is how a person or an agent sees many pictures at once; the report of the cells lets a caller
          find a picture on the sheet, and one source at a time keeps the memory to the sheet plus one source.
        tests:
          - MontageBuilder_Execute_ThreeImages_LaysOutRowByRowAndWritesTheSheet
          - MontageBuilder_Execute_Labels_AreTheFileNames
          - MontageBuilder_Execute_DocumentPage_IsLabeledWithThePageNumber

      - id: CanvasNetViewer-Imaging-MontageBuilder-OutputFormat
        title: >-
          The MontageBuilder class shall take the format of the sheet from the format of the write options when it is
          set, else from the extension of the output, and shall refuse a format that cannot be told with the
          usage-error code before anything is written.
        justification: |
          A caller that names the format must be able to write to a path without an extension or with a custom one,
          and a format that cannot be told is a mistake that must be found before any input is decoded.
        tests:
          - MontageBuilder_Execute_ExplicitFormatAndExtensionlessOutput_WritesThatFormat
          - MontageBuilder_Execute_NoFormatAndNoExtension_ThrowsUsageError

      - id: CanvasNetViewer-Imaging-MontageBuilder-Checks
        title: >-
          The MontageBuilder class shall refuse a sheet larger than the maximum image size with the size-limit code
          before any source is opened, shall refuse an output that is one of the inputs (same-input-output), and
          shall report a request without sources, a request with a missing member, and a missing source in the list
          as a defect of the caller.
        justification: |
          A sheet that cannot exist must be found from the numbers alone, an input must never be replaced by the
          sheet, and nothing can be composed from no sources or from a request that lacks a member.
        tests:
          - MontageBuilder_Execute_SheetTooLarge_ThrowsSizeLimit
          - MontageBuilder_Execute_OutputIsAnInput_ThrowsSameInputOutput
          - MontageBuilder_Execute_NoInputs_ThrowsArgumentException
          - MontageBuilder_Execute_NullRequestMember_ThrowsArgumentNullException
          - MontageBuilder_Execute_NullInfoElement_ThrowsArgumentNullException

      - id: CanvasNetViewer-Imaging-MontageBuilder-InputFragment
        title: >-
          The MontageBuilder class shall draw each input with the page, the model variables and view, and the chart
          parameters of the fragment of that input over the options of the request, shall make a page that the fragment
          names the one cell of its input whatever the request says about all pages, and shall label the cell with the
          file name, a number sign and the fragment (and no page number when the fragment names the page), so that
          the cells of one file are told apart.
        justification: |
          A sheet of the versions of one model (an assembly at several explode levels) is made of one file named
          several times; each name must choose its version and show which one it is.
        tests:
          - Operations_InputWithPageFragment_UseThePageAndTheLabel
          - InputFragment_Montage_ExplodeLevelsWithFixedCamera_DifferButShareScale
          - InputFragment_Montage_Labels_ShowTheFragment
          - InputFragment_Montage_DocumentPage_LabelHasNoRedundantPageNumber
