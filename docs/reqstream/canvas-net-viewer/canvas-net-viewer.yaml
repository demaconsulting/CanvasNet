---
# Software Unit Requirements for CanvasNetViewer
#
# These requirements describe the design-level behavior of the CanvasNetViewer unit: the static class that
# lists the built-in image sources, creates the folder image resolver for a render, and renders any file as a
# picture (with the ViewerRenderOptions and ViewerImage types it uses).
#
# Packaging note: CanvasNetViewer is distributed as the separate DemaConsulting.CanvasNet.Viewer NuGet package
# (namespace DemaConsulting.CanvasNet.Viewer), which references the core package and the Svg, Pdf, Pptx, Vsdx,
# Scad, VegaLite, and Mermaid packages. CanvasNetViewer is the sole unit of the CanvasNetViewer system. Every
# "tests" entry below cites an existing test method in the DemaConsulting.CanvasNet.Viewer.Tests project; see
# docs/verification/canvas-net-viewer/canvas-net-viewer.md for the test-evidence mapping.

sections:
  - title: CanvasNetViewer Requirements
    sections:
      - title: CanvasNetViewer Unit Requirements
        requirements:
          - id: CanvasNetViewer-CanvasNetViewer-ImageSources
            title: >-
              The CanvasNetViewer class shall expose the built-in image sources as a fixed, read-only list
              (raster, SVG, PDF, PowerPoint, Visio, OpenSCAD, Vega-Lite, and Mermaid, in that order, with shared
              instances) and the extensions they claim as the sorted union of their claims.
            justification: |
              One fixed list is the single place where the supported file types are decided, and the help of
              the command-line tool is checked against it.
            tests:
              - CanvasNetViewer_ImageSources_AreFixedAndExtensionsAreSortedUnion
              - CanvasNetViewer_ImageSources_ExtensionsAndSchemesAreReadOnly
              - CanvasNetViewer_Collections_AreReadOnly

          - id: CanvasNetViewer-CanvasNetViewer-CreateImageResolver
            title: >-
              The CanvasNetViewer class shall expose CreateImageResolver, which creates a new folder image
              resolver for every call with the built-in sources followed by any extra sources and the given
              limits, and rejects a null, empty or white-space folder and null extra sources.
            justification: |
              A resolver counts the images and collects the notes of one render, so it must not be shared; creating
              one is cheap and nothing is cached in it.
            tests:
              - CanvasNetViewer_CreateImageResolver_CreatesNewResolverWithBuiltInAndExtraSources

          - id: CanvasNetViewer-CanvasNetViewer-RenderPath
            title: >-
              The CanvasNetViewer class shall expose Render(path), which draws the file with the source that claims
              its extension, confined to its own folder (or ViewerRenderOptions.Folder), at its natural size or
              at the requested width and height (a vector drawn at that size, a raster fitted into the box or scaled
              to keep its aspect ratio), returns the picture with its format, notes, printed text, and embedded
              images, honors ThrowOnUnsupportedFeature and cancellation, rejects a requested width or height outside
              1 to Surface.MaxDimension with ArgumentOutOfRangeException before reading the file, checks the final
              buffer of a resized render against what is left of the live MaxDecodedPixels budget (in addition to the
              surface of the source), and fails
              with ArgumentNullException, FileNotFoundException, NotSupportedException, ArgumentException,
              SandboxException, ImageSourceBudgetException, or ImageSourceException (keeping the original failure
              inside) as documented.
            justification: |
              A viewer, a thumbnail generator, or a report builder gets exactly the same safety and limits as an
              embedded picture, and a caller can tell a missing file from a file that cannot be drawn.
            tests:
              - CanvasNetViewer_Render_PathNatural_ReturnsNaturalSizeAndFormat
              - CanvasNetViewer_Render_PathSized_ReturnsRequestedSize
              - CanvasNetViewer_Render_MaxDecodedPixels_IsPassedToTheResolver
              - CanvasNetViewer_Render_MermaidPictureEnlargingTheLayout_IsChargedAtTheDrawnSize
              - CanvasNetViewer_Render_SizeOutOfRange_ThrowsBeforeReading
              - CanvasNetViewer_Render_SizeAtBoundaries_IsAccepted
              - CanvasNetViewer_Render_ResizedFinalBuffer_IsChargedToTheBudget
              - CanvasNetViewer_Render_SvgWithEmbeds_SurfacesDiagnosticsEchoAndEmbedded
              - CanvasNetViewer_Render_SvgEscapingAndSelfEmbedding_AreWarnings
              - CanvasNetViewer_Render_SvgParentFolderLink_IsDrawnByDefault
              - CanvasNetViewer_Render_PathFailures_ThrowSpecificExceptions
              - CanvasNetViewer_Render_ThrowOnUnsupportedFeature_FailsInsteadOfNote
              - CanvasNetViewer_Render_CanceledToken_ThrowsOperationCanceledException
              - CanvasNetViewer_Render_PathThroughSymbolicLink_IsRenderedWhateverThePolicy
              - CanvasNetViewer_Render_LinkThroughDirectoryLink_NoSymlinks_IsAccessDenied
              - CanvasNetViewer_Render_FileOutsideTheFolderOption_IsRendered

          - id: CanvasNetViewer-CanvasNetViewer-RenderStream
            title: >-
              The CanvasNetViewer class shall expose Render(stream, fileName), which chooses the source by the
              extension of the file name, resolves the files the document itself names only from
              ViewerRenderOptions.Folder (none without it), and rejects null arguments, an unknown extension, and a
              requested width or height outside 1 to Surface.MaxDimension (before reading the stream).
            justification: |
              Content that does not live in a file (an upload, a database column) must be renderable without
              writing it to disk, and without being able to reach the disk by accident.
            tests:
              - CanvasNetViewer_Render_Stream_UsesFileNameAndOptionalFolder
              - CanvasNetViewer_Render_StreamInvalidArguments_Throw
              - CanvasNetViewer_Render_SizeOutOfRange_ThrowsBeforeReading
              - CanvasNetViewer_Render_SizeAtBoundaries_IsAccepted

          - id: CanvasNetViewer-CanvasNetViewer-LoaderSources
            title: >-
              The CanvasNetViewer class shall draw a linked file and a file given to Render with the same code as the
              command-line tool: its built-in sources shall be adapters over the SourceLoader (with the names,
              extensions and order above), hand the bytes and the fragment of the link to it, choose the page of a
              PDF, PowerPoint or Visio document from the fragment (page 1 without one), the view of a model from
              view=, and the theme of a Mermaid diagram from theme= (one of Mermaid's themes, in any case), keep
              the options of an embedding document away from an embedded file, report a page that does not exist
              as an unsupported note with the code image-page-out-of-range and a value that cannot be used as
              image-fragment-invalid without drawing the image, report notes with their detail, location, page and
              origin, and surface a library failure as the original exception inside an ImageSourceException.
            justification: |
              One loader means a linked page, a rendered page and a page written by the tool cannot differ, and a
              diagram can place any page of a document.
            tests:
              - CanvasNetViewer_Render_PdfPageFragment_DrawsTheChosenPage
              - CanvasNetViewer_Render_SlideAndVsdxPageFragments_DrawTheChosenPage
              - CanvasNetViewer_Render_PageBeyondTheLast_IsUnsupportedNoteAndNothingDrawn
              - CanvasNetViewer_Render_InvalidPageValue_IsInvalidFragmentNote
              - CanvasNetViewer_Render_UnknownParameter_IsWarningAndStillDrawn
              - CanvasNetViewer_Render_DuplicatePage_LastWinsAndWarnsOnlyWhenDifferent
              - CanvasNetViewer_Render_QueryAndEncodedFragment_AreHandled
              - CanvasNetViewer_Render_ScadViewFragment_ChoosesTheViewOrIsInvalid
              - CanvasNetViewer_Render_SchemeSource_ReceivesRawLinkAndParsedFragment
              - CanvasNetViewer_Render_ExtraSourceForBuiltInExtension_WinsAndGetsFragment
              - CanvasNetViewer_Render_NestedSvgWithFragment_UsesTheScopedResolver
              - CanvasNetViewer_Render_HostileFragment_IsRefusedAndShortInTheMessage
              - SourceLoader_Load_StrictWithFragmentProblems_FailsOnlyForRefusedLinks
              - SourceLoader_Load_FragmentProblems_AreNotesOfTheDocument
              - InputSelection_ApplyTo_Diagram_FragmentThemeReplacesTheCommandTheme
              - SourceLoader_ProbeInputReference_InvalidValue_IsImageFragmentInvalid

          - id: CanvasNetViewer-CanvasNetViewer-RenderOptions
            title: >-
              The ViewerRenderOptions class shall let Render draw a chosen page (Page, from 1, default 1) at a chosen
              resolution (Dpi), over a chosen background (Background, none by default so that a document, a model and
              an SVG file stay transparent and a chart keeps its own), and an OpenSCAD model with chosen view options
              (Scad); CanvasNetViewer shall validate them before it reads the file (ArgumentOutOfRangeException),
              report a page the file does not have as a ViewerException with the code page-out-of-range, give the
              same pixels as the SourceLoader for equal options, and return in the ViewerImage the page drawn
              (Page), the number of pages of the file (PageCount), and the anchors of a model (Anchors) besides the
              notes and printed text. A PDF, presentation or drawing shall be parsed once by a render, not once for
              its page facts and again for the page. With ThrowOnUnsupportedFeature, a link of an SVG file that is not
              drawn shall fail the render with the code unsupported-feature, as the strict mode of the tool does; a
              picture fitted into a Width by Height box shall have the Background in its margin, and its anchors shall
              follow the picture.
            justification: |
              A caller that wants page N of a document, or a model from one view, with its notes and anchors, should
              not have to leave CanvasNetViewer for the Imaging operations of the tool.
            tests:
              - CanvasNetViewer_Render_Path_ParsesTheDocumentOnce
              - CanvasNetViewer_Render_Stream_ParsesTheDocumentOnce
              - CanvasNetViewer_Render_PageOutOfRange_ParsesTheDocumentOnce
              - CanvasNetViewer_Render_LinkedDocument_ParsesTheDocumentOnce
              - SourceLoader_Probe_ParsesTheDocumentOnce
              - ViewerRenderOptions_Defaults_PageOneAndNoDpiBackgroundOrScad
              - CanvasNetViewer_Render_PageAndDpi_DrawsThePageAtTheResolution
              - CanvasNetViewer_Render_StreamWithPage_DrawsThePage
              - CanvasNetViewer_Render_PageBeyondTheLast_ThrowsViewerExceptionPageOutOfRange
              - CanvasNetViewer_Render_InvalidOptions_ThrowsBeforeReadingTheContent
              - CanvasNetViewer_Render_FractionalDpiForVsdx_ThrowsViewerExceptionUsageError
              - CanvasNetViewer_Render_Background_FlattensTransparentAreas
              - CanvasNetViewer_Render_VegaLiteBackground_DefaultIsTheChartsOwn
              - CanvasNetViewer_Render_ScadOptions_ChooseViewDefinesAndReportAnchorsEchoAndDetail
              - CanvasNetViewer_Render_Failures_HaveTheDocumentedShapes
              - CanvasNetViewer_Render_MatchesTheLoaderOfTheTool
              - CanvasNetViewer_Render_RasterWithBox_IsFittedAndCharged
              - CanvasNetViewer_Render_CanceledToken_ThrowsOperationCanceled
              - CanvasNetViewer_Render_UndrawnLink_IsNoteWithoutStrict
              - CanvasNetViewer_Render_UndrawnLinkWithStrict_ThrowsUnsupportedFeature
              - CanvasNetViewer_Render_StrictWithOnlyWarnings_Succeeds
              - CanvasNetViewer_Render_UndrawnLinkInNestedSvgWithStrict_NamesTheNestedFile

          - id: CanvasNetViewer-CanvasNetViewer-Parameters
            title: >-
              The built-in sources of CanvasNetViewer shall declare the prefix def. for a model and param. for a chart
              (and none for any other source), set from a link the variables of a model (def.name=value, like the
              definitions of the command line, together with view= or alone) and the parameters of a chart
              (param.name=value, like --param, a name the chart does not declare being the warning vl-param-unknown and
              the chart drawn without it), by the grammars of ImageParameterValues and percent-decoded after the split,
              report an unusable value or a name the library rejects as image-fragment-invalid without drawing the
              image,
              report def. on a source that is not a model and param. on one that is not a chart as
              image-fragment-unknown-parameter, apply the overrides of a nested file through the resolver of its own
              scope, and never inherit them from the embedding file; and ViewerRenderOptions.VegaLite (a ChartOptions)
              shall set the same parameters of a chart that Render draws directly, validated before the file is read
              (ArgumentOutOfRangeException for what the library rejects), with a name the chart does not declare a
              ViewerException with the code vega-lite-error that lists the declared names, laid out from the
              parameterized chart, and ignored by every other kind.
            justification: |
              The command line, the library and an embedded file must draw a parameterized model or chart the same
              way, so a diagram can show a variant of a part or a chart in a chosen state with nothing but its link.
            tests:
              - CanvasNetViewer_Render_ScadDefineFragment_OverridesTheVariable
              - CanvasNetViewer_Render_ScadDefineFragment_WithoutViewAndDuplicates_LastWins
              - CanvasNetViewer_Render_ScadDefineFragment_TextAndBooleanValues
              - CanvasNetViewer_Render_ScadDefineFragment_EncodedSeparators_StayInTheValue
              - CanvasNetViewer_Render_ScadDefineFragment_Invalid_IsAnInvalidFragmentNote
              - CanvasNetViewer_Render_ChartParamFragment_SetsTheParameter
              - CanvasNetViewer_Render_ChartParamFragment_SelectionInterval_TakesAJsonObject
              - CanvasNetViewer_Render_ChartParamFragment_UnknownName_IsAWarningAndTheChartIsDrawn
              - CanvasNetViewer_Render_ChartParamFragment_InvalidJson_IsAnInvalidFragmentNote
              - CanvasNetViewer_Render_PrefixOnTheWrongSource_IsAnUnknownParameterWarning
              - CanvasNetViewer_Render_NestedSvgWithDefineAndParamFragments_UsesTheScopedResolver
              - CanvasNetViewer_Render_VegaLiteOptions_SetTheParametersAndTheLayout
              - CanvasNetViewer_Render_VegaLiteOptions_UnknownAndInvalid_AreRefused
              - CanvasNetViewer_Render_VegaLiteOptionsOnOtherKindsAndEmbeddedCharts_AreIgnored
              - CanvasNetViewer_CreateImageResolver_SourcesDeclareTheirPrefixes
              - SourceLoader_Load_UndrawnLinkWithStrict_StillThrowsUnsupportedFeature
              - CanvasNetViewer_Render_FitIntoBox_MarginHasTheBackground
              - CanvasNetViewer_Render_PdfFitIntoBox_MarginHasTheBackground
              - CanvasNetViewer_FitIntoBox_AnchorsFollowTheScaleAndOffset
              - CanvasNetViewer_Render_ScadWithBox_AnchorsAreInsideTheReturnedPicture
          - id: CanvasNetViewer-CanvasNetViewer-ExtraSources
            title: >-
              The CanvasNetViewer class shall accept extra image sources (to CreateImageResolver and in
              ViewerRenderOptions.ExtraSources), place them after the built-in sources so that one claiming the
              same extension or URI scheme wins, hand a scheme-claimed link to its source as written, and ask a
              source again on every render without caching.
            justification: |
              The built-in list is fixed; an application that needs another file type, an override, or a live
              source adds it per render and keeps control over what the source may reach.
            tests:
              - CanvasNetViewer_CreateImageResolver_CreatesNewResolverWithBuiltInAndExtraSources
              - CanvasNetViewer_SystemIntegration_CustomSourceForNewExtension_IsEmbedded
              - CanvasNetViewer_SystemIntegration_CustomSourceOverridingBuiltInExtension_Wins
              - CanvasNetViewer_SystemIntegration_CustomSchemeSource_IsEmbeddedFromRawHref
              - CanvasNetViewer_SystemIntegration_LiveFrameSource_GivesFreshFrameOnEveryRender
              - CanvasNetViewer_SystemIntegration_RenderWithExtraSources_UsesCustomSources
