---
# Software Unit Requirements for the HelpFrontMatter Class
#
# The HelpFrontMatter class splits a help card file into its YAML front matter and its Markdown body. It reads only the
# small subset of YAML the cards use, without a package dependency, and reports anything else as an error that names
# the card file and the line, so a broken card fails the unit tests instead of being guessed at.

sections:
  - title: HelpFrontMatter Unit Requirements
    requirements:
      - id: CanvasNetViewer-Help-HelpFrontMatter-Subset
        title: >-
          The HelpFrontMatter class shall read the front matter of a card between two --- lines in a strict subset of
          YAML (key: value entries at the start of a line, lists of two-space-indented items, list items that are maps
          of four-space-indented entries, plain, single-quoted, and double-quoted one-line values, blank lines, and
          full-line comments), keeping the keys and items in order with the line each starts on, and shall return the
          body after the closing line with LF line endings, without one leading blank line and trailing line feeds
          (keeping trailing spaces, which can be a Markdown hard break or code-block text), and with the line the body
          starts on.
        justification: |
          A card is edited as ordinary Markdown with a few keys; a small parser without a package dependency keeps the
          library lean, and the line numbers let every later error say where a card is wrong.
        tests:
          - HelpFrontMatter_Parse_SupportedSubset_ReadsEveryConstruct
          - HelpFrontMatter_Parse_BodyEndingInSpaces_KeepsTheSpaces

      - id: CanvasNetViewer-Help-HelpFrontMatter-Errors
        title: >-
          The HelpFrontMatter class shall report a missing opening or closing line and any YAML outside the subset (a
          tab, a flow collection, a block scalar, an anchor, an alias, a tag, a trailing comment, an unclosed quote, an
          unsupported escape, a plain value with a colon followed by a space, a repeated key, a key without a value or
          items, or deeper nesting) as an error whose message names the card file and the line.
        justification: |
          Guessing at YAML the parser does not support would ship a card that says something other than what was
          written; an error that names the file and the line can be fixed at once.
        tests:
          - HelpFrontMatter_Parse_OutsideTheSubset_ThrowsWithFileAndLine
          - HelpFrontMatter_Parse_MissingFence_ThrowsWithFileAndLine
