---
# cspell:ignore openscad sandboxed uncatchable Parameterizing Minkowski multmatrix
#
# Software System Requirements for CanvasNetScad
#
# These requirements describe the externally visible behavior of the DemaConsulting.CanvasNet.Scad
# package (root namespace DemaConsulting.CanvasNet.Scad; internal subsystem namespaces
# DemaConsulting.CanvasNet.Scad.Language and DemaConsulting.CanvasNet.Scad.Evaluation) from the
# perspective of its consumers, without specifying implementation details.
#
# CanvasNetScad is an independent software system distributed as its own NuGet package. It is a
# clean-room implementation of a front end for the OpenSCAD language (OpenSCAD is
# GPL-licensed and its manual is CC BY-SA; no OpenSCAD source, grammar, manual text, example, or
# library was consulted - see docs/design/canvas-net-scad.md, Design Constraints, Clean-Room
# Provenance). It depends on the core CanvasNet system (Surface and Rgba32 output) and on the
# CanvasNetRender3D system (the Scene it builds and the renderer that draws it; see
# docs/design/canvas-net-scad.md's Dependencies section).
#
# CanvasNetScad was delivered incrementally. Phase 4 delivered parsing: a lexer and a
# recursive-descent parser turn OpenSCAD-language source into an internal, immutable syntax tree, and
# the public ScadDocument reports what the source declares at file scope (include/use directives,
# module names, function names) or the first syntax error with its file, line, and column. Phase 5
# added evaluation: ScadDocument.Evaluate runs a document - values, scoping, functions,
# modules and children, control flow, comprehensions, built-in functions, include/use resolution
# inside a sandbox, variable overrides, resource limits, cancellation, and echo, warning, and
# unsupported-feature reporting - into an internal, geometry-agnostic instantiation tree and returns
# the echo output, diagnostics, unsupported-feature reports, and instance count. Phase 6 added geometry
# and rendering: ScadDocument.BuildScene turns the instantiation tree into a
# Render3D scene (primitives, 2D shapes, transforms, color, booleans, extrusions, modifiers, and the
# special variables that control curve resolution) and ScadDocument.Render draws it to a Surface, with
# every construct that cannot be built reported rather than skipped. Phase 7 (this delivery) adds the
# hull module (3D and 2D) and the minkowski module of convex 3D children, built on the Render3D convex
# hull and Minkowski sum; the 2D Minkowski sum, offset,
# projection, text, surface, import, roof, color transparency, and true highlight and background
# modifiers are not supported yet and are reported as unsupported features (see
# docs/design/canvas-net-scad.md, Supported And Deferred Features). The package is packable; packaging
# is verified by the build, which packs it, and is not a behavioral requirement.

sections:
  - title: CanvasNetScad Requirements
    requirements:
      - id: CanvasNetScad-Open
        title: >-
          The library shall parse OpenSCAD-language source supplied as a string, a readable stream,
          or a file path into a ScadDocument that is identical whichever entry point is used, and
          shall reject null arguments and unreadable sources with the documented exception
          contract, while empty, whitespace-only, and comment-only source text is valid and parses
          to an empty document.
        tags: [system]
        justification: |
          Callers hold source text in different forms; every entry point must yield the same
          validated result, and invalid arguments must fail closed with a predictable exception
          rather than being coerced; a source without any statement is a legitimate empty program,
          not an invalid argument.
        children:
          - CanvasNetScad-ScadDocument-ParseString
          - CanvasNetScad-ScadDocument-OpenStream
          - CanvasNetScad-ScadDocument-OpenPath
          - CanvasNetScad-ScadDocument-SourceName
        tests:
          - CanvasNetScad_SystemIntegration_Open_ParseStringOpenStreamAndOpenPathAgree
          - CanvasNetScad_SystemIntegration_Open_InvalidArgumentsThrow

      - id: CanvasNetScad-OpenOptions
        title: >-
          The library shall let a caller supply immutable, validated open options (source name,
          base directory, library paths, and a file resolver), rejecting invalid values when they
          are set and never changing an options instance afterwards.
        tags: [system]
        justification: |
          Options that are validated at initialization let the parser and the evaluator trust every
          instance they receive, and immutability makes a shared options instance safe to use from
          several threads.
        children:
          - CanvasNetScad-ScadDocument-OpenOptions
        tests:
          - CanvasNetScad_SystemIntegration_Options_AreValidatedAndImmutable

      - id: CanvasNetScad-Syntax
        title: >-
          The library shall accept the supported OpenSCAD-language syntax - variable assignments,
          module and function definitions, module instantiations with modifiers, conditional and
          loop statements, expressions with the documented precedence, list comprehensions, and
          function literals - and shall report a successfully parsed program through its
          ScadDocument.
        tags: [system]
        justification: |
          A parse-only front end is only useful if it accepts the language constructs that real
          parametric models are written in; the accepted grammar is the contract later evaluation
          and rendering phases build on.
        children:
          - CanvasNetScad-ScadLanguage-Tokenization
          - CanvasNetScad-ScadLanguage-Parsing
        tests:
          - CanvasNetScad_SystemIntegration_Syntax_AllAuthoredFixturesParse
          - CanvasNetScad_SystemIntegration_Syntax_ParametricPartFixtureReportsDefinitions

      - id: CanvasNetScad-SyntaxErrors
        title: >-
          The library shall reject malformed source with a ScadSyntaxException that carries the
          source name, one-based line, and one-based column of the first error and a message that
          begins with that location, and shall report only the first error.
        tags: [system]
        justification: |
          A trustworthy location lets a caller point a user at the exact place in a file that
          needs fixing; stopping at the first error keeps the result deterministic and ensures that
          no partial syntax tree is ever produced.
        children:
          - CanvasNetScad-ScadLanguage-SyntaxErrors
          - CanvasNetScad-ScadDocument-SyntaxException
          - CanvasNetScad-ScadDocument-SourceLocation
        tests:
          - CanvasNetScad_SystemIntegration_SyntaxErrors_MalformedFixturesReportLocation
          - CanvasNetScad_SystemIntegration_SyntaxErrors_FirstErrorIsReported

      - id: CanvasNetScad-Directives
        title: >-
          The library shall record file-scope include and use directives (kind, path, and source
          location, in source order) on the parsed document without opening, resolving, or
          otherwise accessing any referenced file while parsing; files are accessed only when a
          document is evaluated.
        tags: [system]
        justification: |
          Recording directives without touching the file system lets a caller inspect a document's
          dependencies safely; resolution is an explicit, sandboxed part of evaluation and must
          never happen implicitly during parsing.
        children:
          - CanvasNetScad-ScadLanguage-Directives
          - CanvasNetScad-ScadDocument-Directives
        tests:
          - CanvasNetScad_SystemIntegration_Directives_IncludeAndUseRecordedWithoutFileAccess

      - id: CanvasNetScad-Definitions
        title: >-
          The library shall expose, in source order and keeping duplicates, the names of the
          file-scope module and function definitions of a parsed document.
        tags: [system]
        justification: |
          A caller wanting to discover what a library file offers needs its module and function
          names without evaluating the program.
        children:
          - CanvasNetScad-ScadDocument-Definitions
        tests:
          - CanvasNetScad_SystemIntegration_Syntax_ParametricPartFixtureReportsDefinitions

      - id: CanvasNetScad-InputLimits
        title: >-
          The library shall fail closed on hostile input: source nested more than 256 levels deep
          shall be rejected with a ScadSyntaxException without overflowing the call stack, and
          source longer than 4,194,304 characters shall be rejected with an InvalidDataException
          before it is parsed, including when it is read from a stream that never ends.
        tags: [system]
        justification: |
          Source text may come from an untrusted origin; a stack overflow, which cannot be caught,
          or unbounded memory growth would take down the host process, so every resource the
          parser uses must be bounded and every violation reported as a typed
          exception that callers can catch.
        children:
          - CanvasNetScad-ScadLanguage-InputLimits
          - CanvasNetScad-ScadDocument-SourceLimit
        tests:
          - CanvasNetScad_SystemIntegration_Limits_DeepNestingFailsClosed
          - CanvasNetScad_SystemIntegration_Limits_OversizedSourceIsRejected

      - id: CanvasNetScad-Evaluate
        title: >-
          The library shall evaluate a parsed document with the documented semantics of the dialect
          - values, scoping, functions, modules with children, control flow, comprehensions,
          operators, built-in functions, echo, and assert - and shall report the echo output as
          lines, the diagnostics, the unsupported-feature reports, and the number of module
          instances it produced, without generating any geometry.
        tags: [system]
        justification: |
          Evaluation is what turns a parsed model into a result; callers need the echo output and
          the diagnostics to validate a model, and the instance count to see what it contains,
          before any geometry exists.
        children:
          - CanvasNetScad-ScadDocument-Evaluate
          - CanvasNetScad-ScadDocument-EvaluationResult
          - CanvasNetScad-ScadEvaluation-Values
          - CanvasNetScad-ScadEvaluation-Evaluation
          - CanvasNetScad-ScadEvaluation-InstanceTree
          - CanvasNetScad-ScadEvaluation-BuiltinFunctions
        tests:
          - CanvasNetScad_SystemIntegration_Evaluate_EchoAndAssertReportOutputAndFail
          - CanvasNetScad_SystemIntegration_Evaluate_ParametricFixtureProducesInstances

      - id: CanvasNetScad-EvaluationOptions
        title: >-
          The library shall let a caller supply immutable, validated evaluation options (variable
          overrides, animation time, resource limits, and handlers for echo output, warnings, and
          unsupported features, and a switch that makes an unsupported feature an error), rejecting
          invalid values when they are set and never changing an options instance afterwards.
        tags: [system]
        justification: |
          Options validated at initialization let the evaluator trust every instance, and
          immutability makes a shared options instance safe to use from several threads.
        children:
          - CanvasNetScad-ScadDocument-EvaluationOptions
          - CanvasNetScad-ScadDocument-EvaluationHandlers
        tests:
          - CanvasNetScad_SystemIntegration_EvaluationOptions_AreValidatedAndImmutable

      - id: CanvasNetScad-Diagnostics
        title: >-
          The library shall report a recoverable problem in a model - for example an unknown
          variable, function, or module - as a warning with a message and a source location,
          continuing the evaluation instead of failing it.
        tags: [system]
        justification: |
          Authors need precise feedback on mistakes, and a model with a mistake should still produce
          whatever it can.
        children:
          - CanvasNetScad-ScadDocument-Diagnostic
          - CanvasNetScad-ScadEvaluation-Diagnostics
        tests:
          - CanvasNetScad_SystemIntegration_Diagnostics_UnknownNamesAreWarnings

      - id: CanvasNetScad-UnsupportedFeatures
        title: >-
          The library shall report a recognized but unsupported feature as an unsupported-feature
          report with a feature identifier, a message, and a source location, continuing with an
          undefined result, or, when the caller asks for it, stop at the first one with a typed
          exception carrying the same information.
        tags: [system]
        justification: |
          A model that relies on something this implementation does not provide must be told so
          precisely, and a strict caller must be able to refuse a partial result.
        children:
          - CanvasNetScad-ScadDocument-UnsupportedFeature
          - CanvasNetScad-ScadEvaluation-UnsupportedFeatures
        tests:
          - CanvasNetScad_SystemIntegration_UnsupportedFeatures_ReportedOrThrown

      - id: CanvasNetScad-EvaluationErrors
        title: >-
          The library shall stop an evaluation with a ScadEvaluationException that carries the
          source location of the failure and a message that begins with it when an assertion fails,
          a resource limit is exceeded, or an include rule is violated, and shall keep the echo
          output and warnings produced before the failure available to the caller's handlers.
        tags: [system]
        justification: |
          Some failures make a result meaningless; a typed, located exception lets a caller report
          them precisely, and the output produced so far helps explain them.
        children:
          - CanvasNetScad-ScadDocument-EvaluationException
          - CanvasNetScad-ScadEvaluation-Errors
        tests:
          - CanvasNetScad_SystemIntegration_Evaluate_EchoAndAssertReportOutputAndFail
          - CanvasNetScad_SystemIntegration_EvaluationLimits_FailClosed

      - id: CanvasNetScad-IncludeUse
        title: >-
          The library shall resolve include and use directives when a document is evaluated -
          textually for include, definitions only for use - from the file system or through a
          caller-supplied resolver, confined to the base directory and library paths (or to the
          logical paths handed to the resolver), and shall reject any path that escapes them.
        tags: [system]
        justification: |
          A document may come from an untrusted source and include resolution is the one place
          where evaluation reaches outside it; the access must be explicit, confined, and
          verifiable.
        children:
          - CanvasNetScad-ScadDocument-IncludeUse
          - CanvasNetScad-ScadEvaluation-FileResolution
        tests:
          - CanvasNetScad_SystemIntegration_IncludeUse_ResolverAndSandbox

      - id: CanvasNetScad-EvaluationLimits
        title: >-
          The library shall fail closed on hostile or runaway models: recursion depth, evaluation
          steps, loop iterations, list length, string length, instance count, and echo output shall
          each be bounded by a limit the caller can set, exceeding a limit shall raise a located
          ScadEvaluationException, and the recursion limit shall hold without overflowing the call
          stack on a thread with a small stack.
        tags: [system]
        justification: |
          Evaluation runs untrusted programs; unbounded time or memory, or an uncatchable stack
          overflow, would take down the host process, so every resource must be bounded and every
          violation reported as a typed exception.
        children:
          - CanvasNetScad-ScadDocument-Limits
          - CanvasNetScad-ScadDocument-StackSafety
          - CanvasNetScad-ScadEvaluation-ResourceLimits
          - CanvasNetScad-ScadEvaluation-StackSafety
        tests:
          - CanvasNetScad_SystemIntegration_EvaluationLimits_FailClosed
          - CanvasNetScad_SystemIntegration_EvaluationLimits_DeepRecursionOnSmallStackDoesNotOverflow

      - id: CanvasNetScad-Cancellation
        title: >-
          The library shall stop an evaluation, including one in endless recursion, promptly when
          the caller's cancellation token is canceled, by throwing OperationCanceledException, and
          shall do no work at all when the token is canceled beforehand.
        tags: [system]
        justification: |
          A caller must be able to abandon an evaluation that takes longer than it can afford, even
          when it has raised the step limit very high.
        children:
          - CanvasNetScad-ScadDocument-Cancellation
          - CanvasNetScad-ScadEvaluation-Cancellation
        tests:
          - CanvasNetScad_SystemIntegration_Cancellation_StopsEvaluation

      - id: CanvasNetScad-VariableOverrides
        title: >-
          The library shall let a caller override the variables of a document from outside its
          source text, replacing every top-level assignment of a name and creating the variable when
          absent, including special variables.
        tags: [system]
        justification: |
          Parameterizing a model from the outside is the basis of batch rendering and the
          generation of variants.
        children:
          - CanvasNetScad-ScadDocument-VariableOverrides
          - CanvasNetScad-ScadEvaluation-Overrides
        tests:
          - CanvasNetScad_SystemIntegration_VariableOverrides_ReplaceAssignments

      - id: CanvasNetScad-Determinism
        title: >-
          The library shall give identical echo output, diagnostics, and instance count for the same
          document and options on every platform, in every culture, and from repeated calls,
          including for models whose numbers must be formatted.
        tags: [system]
        justification: |
          Reproducible results make golden-output verification, caching, and cross-platform use
          possible.
        children:
          - CanvasNetScad-ScadDocument-Determinism
          - CanvasNetScad-ScadEvaluation-Determinism
        tests:
          - CanvasNetScad_SystemIntegration_Determinism_InvariantCultureAndRepeatable

      - id: CanvasNetScad-BuildScene
        title: >-
          The library shall evaluate a document and build a Render3D scene of its geometry in
          right-handed, Z-up model space - the implicit union of the top-level instances, or of the
          marked subtrees when the program uses the show-only modifier - honoring variable overrides and
          animation time, so that a caller can measure or render the model without drawing it, and
          shall give a model without geometry a scene that renders as the background.
        tags: [system]
        justification: |
          The scene is the interchange form between the language front end and the renderer; a caller
          that wants the bounds of a part, or to draw it with its own camera, needs it without a
          surface, and parameterized models must build differently for different parameters.
        children:
          - CanvasNetScad-ScadDocument-BuildScene
          - CanvasNetScad-ScadGeometry-Model
        tests:
          - CanvasNetScad_SystemIntegration_BuildScene_BoundsOfTransformFixtureAreAnalytic
          - ScadRenderSystem_Transforms_BoundsAreAnalytic
          - ScadRenderSystem_Extrusions_BoundsAreAnalytic
          - ScadRenderSystem_ModulesScene_TopViewShowsStairsAndPostRing
          - ScadRenderSystem_Parametric_DefaultsGiveThreePegsOnAThirtyUnitBase
          - ScadRenderSystem_Parametric_VariableOverridesChangeTheSilhouette

      - id: CanvasNetScad-Render
        title: >-
          The library shall render a document to a new surface of exactly the requested size, fitting
          the view to the model by default (an isometric perspective view that shows the whole model,
          adjustable by azimuth, elevation, and projection) or using a caller-supplied camera, drawing
          booleans, extrusions, and revolved profiles as their solids (a difference shows its cut-out,
          an intersection only the overlap), and shall reject an invalid size or camera before
          evaluating anything.
        tags: [system]
        justification: |
          Rendering a model to pixels in one call is the purpose of the package; a default view that
          shows the whole model spares callers from computing a camera, and invalid arguments must
          fail before expensive work.
        children:
          - CanvasNetScad-ScadDocument-Render
          - CanvasNetScad-ScadDocument-RenderGeometry
        tests:
          - CanvasNetScad_SystemIntegration_Render_FixtureRendersWithDefaultAndExplicitCameras
          - CanvasNetScad_SystemIntegration_Render_VariablesChangeTheModelAndBadCallsAreRejected
          - ScadRenderSystem_DefaultCamera_FitsAndCentersTheModel
          - ScadRenderSystem_ViewOptions_ChangeTheFittedView
          - ScadRenderSystem_ExplicitCamera_LooksAtItsTarget
          - ScadRenderSystem_EmptyModel_RendersTheBackground

      - id: CanvasNetScad-RenderOptions
        title: >-
          The library shall let a caller supply immutable, validated render options (evaluation
          options, camera, fitted-view angles and projection, scene options such as background color,
          default surface color, lights, and supersampling, and the thickness of flat shapes) with
          documented defaults - a white background, neutral gray surfaces that a model color
          overrides, and shaded lighting - rejecting invalid values when they are set and never
          changing an options instance afterwards.
        tags: [system]
        justification: |
          Options validated at initialization let the document trust every instance, immutability
          makes a shared options instance safe to use from several threads, and defaults that look
          right spare callers from configuring a renderer to see a model.
        children:
          - CanvasNetScad-ScadDocument-RenderOptions
        tests:
          - CanvasNetScad_SystemIntegration_RenderOptions_AreValidatedAndImmutable
          - ScadRenderSystem_Defaults_AreWhiteBackgroundAndNeutralCadGray
          - ScadRenderSystem_DefaultLook_ShadesColorsAndKeepsDefaultSurfacesNeutral
          - ScadRenderSystem_Background_IsConfigurable
          - ScadRenderSystem_Supersampling_BlendsEdgePixels

      - id: CanvasNetScad-Primitives
        title: >-
          The library shall build the cube, sphere, cylinder (including cones and frusta), polyhedron,
          square, circle, and polygon modules into solids and 2D shapes with the documented argument
          forms and the special variables that control the resolution of curves, accepting polyhedron
          faces in either winding and polygons with holes, and shall draw a 2D shape that is not
          extruded as a thin slab so that it is visible.
        tags: [system]
        justification: |
          The primitives are the vocabulary every model is written in; a parametric model must produce
          the solids and silhouettes its numbers describe.
        children:
          - CanvasNetScad-ScadGeometry-Primitives
          - CanvasNetScad-ScadGeometry-FlatShapes
        tests:
          - ScadRenderSystem_Primitives_TopViewShowsColorsOverAnalyticFootprints
          - ScadRenderSystem_Primitives_FrontViewHasAnalyticHeightsAndWidths
          - ScadRenderSystem_Polyhedron_PyramidHasTheAnalyticSilhouettes
          - ScadRenderSystem_Polyhedron_OctahedronTopViewIsADiamond
          - ScadRenderSystem_Polyhedron_ConcavePrismKeepsItsNotch

      - id: CanvasNetScad-Transforms
        title: >-
          The library shall apply the translate, rotate, scale, mirror, multmatrix, and resize modules
          and the color module to the geometry they wrap, composing nested transforms from the
          innermost outward and letting the innermost color win, so that a transformed model has the
          analytic position, extent, and color the transforms describe and a mirrored solid is
          indistinguishable from the same solid built mirrored.
        tags: [system]
        justification: |
          Transforms and colors are how a model places and distinguishes its parts.
        children:
          - CanvasNetScad-ScadGeometry-Transforms
        tests:
          - ScadRenderSystem_Transforms_BoundsAreAnalytic
          - ScadRenderSystem_Transforms_TopViewShowsEachPartOverItsRectangle
          - ScadRenderSystem_Transforms_FrontViewShowsShearAndResize
          - ScadRenderSystem_Mirror_RendersIdenticallyToTheHandPlacedSolid

      - id: CanvasNetScad-Booleans
        title: >-
          The library shall build the union (implicit and explicit), difference, and intersection
          modules for solids and for 2D shapes, so that a difference shows its cut-outs, an
          intersection only the overlap, and a 2D difference or intersection that is extruded gives the
          corresponding solid.
        tags: [system]
        justification: |
          Constructive solid geometry is how most parts are described.
        children:
          - CanvasNetScad-ScadGeometry-Booleans
        tests:
          - ScadRenderSystem_BracketCsg_TopViewShowsThroughHolesAndSlot
          - ScadRenderSystem_BracketCsg_FrontViewIsTheFullPlate
          - ScadRenderSystem_Intersection_TopViewLosesTheCorners
          - ScadRenderSystem_Intersection_FrontViewIsTheFullRectangle
          - ScadRenderSystem_TwoDCsg_RingIsAnAnnulusAndSymmetric
          - ScadRenderSystem_TwoDCsg_PlateHasTrimmedCornersAndTwoHoles
          - ScadRenderSystem_TwoDCsg_RingFrontViewIsTheFullRectangle

      - id: CanvasNetScad-HullMinkowski
        title: >-
          The library shall build the hull module - of 3D children as the convex solid through their
          points, and of 2D children as the convex outline that an extrusion then consumes - and the
          minkowski module of convex 3D children, so that a hull has the convex outline of its parts and
          cuts as a valid operand, a sum of a block and a ball is the rounded block, a sum distributes
          over a union, and a model that has no hull or sum (a boolean or a non-convex operand, mixed or 2D
          operands) is reported with a stable identifier and omitted instead of being approximated.
        tags: [system]
        justification: |
          Hull and Minkowski sum are how enclosures, rounded parts, and offsets are described.
        children:
          - CanvasNetScad-ScadGeometry-HullMinkowski
        tests:
          - ScadRenderSystem_Hull_TopViewIsTheConvexOutlineOfTheParts
          - ScadRenderSystem_Hull_TwoDimensionalHullExtrudesToItsOutline
          - ScadRenderSystem_Hull_CutsAsAValidCsgOperandWithoutReports
          - ScadRenderSystem_Minkowski_RoundsTheCubeAndKeepsItsExtents
          - ScadRenderSystem_Minkowski_NonConvexChildIsReportedAtItsLocationAndOmitted
          - ScadRenderSystem_HullAndMinkowski_StrictModeThrowsTheNewFeatureIds

      - id: CanvasNetScad-Extrusions
        title: >-
          The library shall build the linear_extrude and rotate_extrude modules from 2D shapes - with
          height, centering, twist, slices, and scale, and with a sweep angle - so that an extruded
          profile has the analytic outline, a twisted bar turns by its twist, a scaled extrusion is a
          frustum, and a revolved profile has the silhouette of the profile.
        tags: [system]
        justification: |
          Extrusions are how 2D drawings become parts.
        children:
          - CanvasNetScad-ScadGeometry-Extrusions
        tests:
          - ScadRenderSystem_Extrusions_StarWithHoleCoversItsPolygonMinusTheHole
          - ScadRenderSystem_Extrusions_ScaledExtrusionIsAFrustum
          - ScadRenderSystem_Extrusions_TwistedBarTurnsAQuarterTurnAndIsCentered
          - ScadRenderSystem_Extrusions_VaseSilhouetteFollowsTheProfile
          - ScadRenderSystem_Extrusions_RevolvedRingIsAnAnnulus
          - ScadRenderSystem_Symmetry_StarIsSymmetricAboutItsAxis

      - id: CanvasNetScad-GeometryUnsupported
        title: >-
          The library shall report every construct it recognizes but cannot build or draw faithfully -
          the text, offset, projection, surface, import, and roof modules, a hull or a minkowski whose
          operands have no hull or sum (the scad-hull-* and scad-minkowski-* identifiers), the
          highlight and background modifiers, color transparency, and the other documented cases - as
          an unsupported-feature report with a stable identifier, a message, and the source location,
          while drawing the supported geometry around it; shall report an invalid argument as a located
          warning that leaves that instance empty; and shall, when the caller asks for it, stop at the
          first unsupported feature with a typed exception carrying the same information.
        tags: [system]
        justification: |
          A model that relies on something this implementation does not provide must be told so
          precisely, and nothing may disappear from the picture without a report; a strict caller
          must be able to refuse a partial result.
        children:
          - CanvasNetScad-ScadGeometry-Reporting
          - CanvasNetScad-ScadGeometry-SceneHandoff
          - CanvasNetScad-ScadDocument-RenderReporting
          - CanvasNetScad-ScadDocument-RenderOperandReports
        tests:
          - CanvasNetScad_SystemIntegration_Render_UnsupportedFeaturesAreReportedOrThrown
          - ScadRenderSystem_Unsupported_EveryConstructIsReportedOnceAtItsLocation
          - ScadRenderSystem_Unsupported_OnlySupportedGeometryIsDrawn
          - ScadRenderSystem_Unsupported_StrictModeThrowsTheFirstFeature
          - ScadRenderSystem_Strict_SupportedFixturesDoNotThrow
          - ScadRenderSystem_Modifiers_DrawNormalAndHighlightedAndOmitDisabledAndBackground
          - ScadRenderSystem_Modifiers_HighlightAndBackgroundAreReportedAtTheirLines
          - ScadRenderSystem_RootModifier_DrawsOnlyTheMarkedSubtree

      - id: CanvasNetScad-GeometryLimits
        title: >-
          The library shall bound the geometry a model generates by a triangle limit the caller can
          set, estimating the size of the geometry before allocating it and raising a located
          ScadEvaluationException when the limit would be exceeded, so that a hostile model cannot
          exhaust memory.
        tags: [system]
        justification: |
          A model can ask for geometry of any size with a few characters; an unbounded build would
          take down the host process.
        children:
          - CanvasNetScad-ScadGeometry-Limits
        tests:
          - CanvasNetScad_SystemIntegration_BuildScene_TriangleLimitFailsClosed

      - id: CanvasNetScad-GeometryStackSafety
        title: >-
          The library shall build and render a model nested thousands of levels deep on a caller
          thread with a small stack to the same result as on a large stack, without overflowing the
          call stack.
        tags: [system]
        justification: |
          Callers invoke the library from threads of any stack size and a recursive module can nest
          deeply; an uncatchable stack overflow would terminate their process.
        children:
          - CanvasNetScad-ScadGeometry-StackSafety
        tests:
          - ScadRenderSystem_DeepScene_RendersFromASmallStack
          - ScadRenderSystem_DeepScene_DeepDifferenceRendersFromASmallStack

      - id: CanvasNetScad-RenderCancellation
        title: >-
          The library shall stop building and rendering promptly when the caller's cancellation token
          is canceled, by throwing OperationCanceledException, and shall do no work at all when the
          token is canceled beforehand.
        tags: [system]
        justification: |
          Rendering a large model can take longer than a caller can afford; the caller must be able to
          abandon it.
        children:
          - CanvasNetScad-ScadDocument-RenderCancellation
        tests:
          - ScadRenderSystem_Cancellation_StopsTheWork

      - id: CanvasNetScad-RenderDeterminism
        title: >-
          The library shall render the same document with the same options to byte-identical images on
          every call, with any degree of parallelism, so that every authored model renders without
          warnings and deterministically.
        tags: [system]
        justification: |
          Reproducible pixels make image comparison, caching, and cross-machine use possible.
        children:
          - CanvasNetScad-ScadDocument-RenderDeterminism
        tests:
          - ScadRenderSystem_Fixtures_RenderDeterministically
          - ScadRenderSystem_Fixtures_RenderWithoutWarnings
