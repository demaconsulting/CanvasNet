<?xml version="1.0" encoding="UTF-8"?>
<!--
  page.svg: the composed page of composition-explained.svg. It embeds the Mermaid diagram flow.mmd (whose nodes embed
  the PlantUML diagram release.puml, part.scad, and chart.vl.json) and chooses the diagram's dark theme with the #theme= fragment. The "Exploded for
  review" arrow is bound with cn:x2y2 to the part node, so its tip lands on the model at any size; the "Goal met"
  arrow ends between the W4 and W5 bars (see its comment). Only the generic font families are used. Original,
  authored for this repository (MIT).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:cn="https://demaconsulting.com/canvasnet" width="640" height="420" viewBox="0 0 640 420">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172154"/>
      <stop offset="1" stop-color="#231c5c"/>
    </linearGradient>
    <linearGradient id="pageRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="tipNote" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f8fafc"/></marker>
  </defs>
  <style>
    .pTitle { font: bold 30px sans-serif; fill: #ffffff; }
    .pSub { font: 16px sans-serif; fill: #a5b4fc; }
    .pPill { font: bold 15px sans-serif; fill: #052e1f; letter-spacing: 1px; }
    .pLabel { font: bold 18px sans-serif; fill: #ffffff; }
    .pCode { font: 15px monospace; fill: #94a3b8; }
    .pNote { stroke: #f8fafc; stroke-width: 3; marker-end: url(#tipNote); }
  </style>
  <rect width="640" height="420" rx="18" fill="url(#pageBg)"/>
  <text class="pTitle" x="24" y="48">Enclosure release</text>
  <text class="pSub" x="24" y="74">Build 1.2 - week 5</text>
  <rect x="500" y="26" width="116" height="30" rx="15" fill="#34d399"/>
  <text class="pPill" x="558" y="46" text-anchor="middle">APPROVED</text>
  <rect x="24" y="86" width="592" height="2" fill="url(#pageRule)"/>
  <!-- the diagram, its theme chosen by the link -->
  <image id="flow" href="flow.mmd#theme=dark" x="16" y="96" width="608" height="234"/>
  <!-- annotations -->
  <!-- the arrow tip is bound to the part node, so it lands on the model at any size -->
  <rect x="24" y="350" width="5" height="50" rx="2" fill="#fbbf24"/>
  <text class="pLabel" x="40" y="370">Exploded for review</text>
  <text class="pCode" x="40" y="393">part.scad#def.explode=1</text>
  <line class="pNote" x1="235.3" y1="342" x2="235.3" y2="213" cn:x2y2="#flow node:part"/>
  <!-- the arrow ends between the tops of the W4 and W5 bars: the chart is nested in the diagram, so its bars cannot
       be bound from here. The point is the chart drawn alone at the size of its node (276 x 219) with the positions
       mark:week=W4 and mark:week=W5, moved by the corner of the chart node (339.0, 103.6) -->
  <rect x="356" y="350" width="5" height="50" rx="2" fill="#fbbf24"/>
  <text class="pLabel" x="372" y="370">Goal met in W4 and W5</text>
  <text class="pCode" x="372" y="393">chart.vl.json#param.goal=180</text>
  <line class="pNote" x1="562.5" y1="342" x2="562.5" y2="149.4"/>
</svg>
