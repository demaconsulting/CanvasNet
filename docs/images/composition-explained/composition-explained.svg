<?xml version="1.0" encoding="UTF-8"?>
<!--
  composition-explained.svg: how composition works, drawn by CanvasNet from the real files. On the left an exploded
  view stacks the three layers of one page: page.svg (top), the Mermaid diagram flow.mmd it embeds (middle), and the
  OpenSCAD model part.scad and Vega-Lite chart chart.vl.json that the diagram's nodes embed (bottom). Each plane is
  a group with one affine transform whose two axes are scaled alike, so every embedded picture keeps its aspect.
  Dashed lines project each picture onto the slot it fills; the pink line is bound with cn:x2y2 to a node of the
  embedded diagram. Numbered cards give the markup behind each link, with its fragment highlighted, and a card shows
  the same link in Markdown. On the right page.svg itself is drawn, and a card lists fragments. Only the generic font
  families are used. Original, authored for this repository (MIT).

  Editing: everything inside a layer group is in the coordinates of page.svg (640 x 420); the group's matrix puts it
  on its plane, and each layer below is the same matrix moved down by 230 units. Layer 1 repeats the page's own
  content; when page.svg changes, change layer 1 the same way. The dashed projection lines are in figure coordinates:
  a page point (x, y) on layer N is at (690 + 0.5506 x - 0.4669 y, 158 + 230 (N - 1) + 0.1475 x + 0.3269 y).
  Code in the cards is split into several text elements, each placed at 0.6 em (13.8 units) per character, because
  the style of a tspan is not drawn.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:cn="https://demaconsulting.com/canvasnet" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.55" stop-color="#151244"/>
      <stop offset="1" stop-color="#2a2378"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172154"/>
      <stop offset="1" stop-color="#231c5c"/>
    </linearGradient>
    <linearGradient id="pageRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="tipNote" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f8fafc"/></marker>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a66" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#16123f" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="renders" gradientUnits="userSpaceOnUse" x1="948.8" y1="0" x2="1136" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="resultEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="edgeGlow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="footShadow" x="-100%" y="-200%" width="300%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.7"/></filter>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/></filter>
    <filter id="arrowGlow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="tipRenders" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    .pTitle { font: bold 30px sans-serif; fill: #ffffff; }
    .pSub { font: 16px sans-serif; fill: #a5b4fc; }
    .pPill { font: bold 15px sans-serif; fill: #052e1f; }
    .pLabel { font: bold 18px sans-serif; fill: #ffffff; }
    .pCode { font: 15px monospace; fill: #94a3b8; }
    .pNote { stroke: #f8fafc; stroke-width: 3; marker-end: url(#tipNote); }
    .h1 { font: bold 46px sans-serif; fill: #ffffff; }
    .lead { font: 25px sans-serif; fill: #c7d2fe; }
    .slotName { font: bold 30px monospace; }
    .ctitle { font: bold 25px sans-serif; fill: #ffffff; }
    .code { font: 23px monospace; fill: #e2e8f0; }
    .frag { font: bold 23px monospace; fill: #34d399; }
    .num { font: bold 20px sans-serif; fill: #0b1026; }
    .tag { font: bold 21px monospace; }
    .eyebrow { font: bold 22px sans-serif; fill: #e0e7ff; }
    .note { font: italic 20px sans-serif; fill: #a5b4fc; }
    .pill { font: bold 20px monospace; fill: #052e1f; }
  </style>

  <!-- page, glows, title -->
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <ellipse cx="560" cy="420" rx="520" ry="360" fill="url(#glowA)"/>
  <ellipse cx="1300" cy="420" rx="440" ry="340" fill="url(#glowB)"/>
  <text class="h1" x="56" y="84">How composition works</text>
  <text class="lead" x="56" y="124">An SVG page embeds other files, and they embed files of their own. Each is drawn as vector at the size of its box.</text>


  <!-- layer 3: the leaves: part.scad and chart.vl.json, with the fragments of their links in flow.mmd -->
  <polygon points="690,642 1042.4,736.4 846.3,873.7 493.9,779.3" fill="#000000" fill-opacity="0.6" filter="url(#planeShadow)"/>
  <polygon points="690,618 1042.4,712.4 846.3,849.7 493.9,755.3" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="10" filter="url(#edgeGlow)"/>
  <g transform="matrix(0.5506 0.1475 -0.4669 0.3269 690 618)">
    <rect width="640" height="420" rx="18" fill="url(#glass)" stroke="#fbbf24" stroke-width="4"/>
    <rect x="131.2" y="103.6" width="161.7" height="218.8" rx="6" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.7"/>
    <image href="chart.vl.json#param.goal=180" x="340.4" y="103.6" width="275.9" height="218.8"/>
  </g>
  <ellipse cx="686.9" cy="733.2" rx="48" ry="14" fill="#000000" fill-opacity="0.45" filter="url(#footShadow)"/>
  <image href="part.scad#def.explode=1" x="601.9" y="579.2" width="170" height="170"/>
  <line x1="713.8" y1="671.2" x2="713.8" y2="441.2" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="802.9" y1="695.1" x2="802.9" y2="465.1" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="700.7" y1="766.6" x2="700.7" y2="536.6" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="611.7" y1="742.8" x2="611.7" y2="512.8" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="829.1" y1="702.1" x2="829.1" y2="472.1" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="980.9" y1="742.8" x2="980.9" y2="512.8" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="878.8" y1="814.3" x2="878.8" y2="584.3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="726.9" y1="773.6" x2="726.9" y2="543.6" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- layer 2: flow.mmd, its picture nodes shown as the slots the layer below fills -->
  <polygon points="690,412 1042.4,506.4 846.3,643.7 493.9,549.3" fill="#000000" fill-opacity="0.6" filter="url(#planeShadow)"/>
  <polygon points="690,388 1042.4,482.4 846.3,619.7 493.9,525.3" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="10" filter="url(#edgeGlow)"/>
  <g transform="matrix(0.5506 0.1475 -0.4669 0.3269 690 388)">
    <rect width="640" height="420" rx="18" fill="url(#pageBg)" stroke="#a78bfa" stroke-width="4"/>
    <image id="flow" href="flow.mmd#theme=dark" x="16" y="96" width="608" height="234"/>
    <rect x="131.2" y="103.6" width="161.7" height="218.8" rx="6" fill="#0b1226b8" stroke="#fbbf24" stroke-width="4" stroke-dasharray="14 9"/>
    <rect x="340.4" y="103.6" width="275.9" height="218.8" rx="6" fill="#0b1226b8" stroke="#fbbf24" stroke-width="4" stroke-dasharray="14 9"/>
  </g>
  <line x1="654" y1="421.7" x2="654" y2="191.7" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="988.7" y1="511.4" x2="988.7" y2="281.4" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="879.5" y1="587.9" x2="879.5" y2="357.9" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="544.7" y1="498.3" x2="544.7" y2="268.3" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- the binding: from the arrow tip of the page down to the node of the diagram it is bound to -->
  <line x1="707.3" y1="258.9" x2="707.3" y2="488.9" stroke="#f472b6" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round" cn:x2y2="#flow node:part"/>
  <circle cx="707.3" cy="488.9" r="10" fill="#0b1026" fill-opacity="0.6" stroke="#f472b6" stroke-width="3" cn:center="#flow node:part"/>
  <circle cx="707.3" cy="488.9" r="4" fill="#f472b6" cn:center="#flow node:part"/>

  <!-- layer 1: page.svg: its own content, and the slot its diagram fills -->
  <polygon points="690,182 1042.4,276.4 846.3,413.7 493.9,319.3" fill="#000000" fill-opacity="0.6" filter="url(#planeShadow)"/>
  <polygon points="690,158 1042.4,252.4 846.3,389.7 493.9,295.3" fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="10" filter="url(#edgeGlow)"/>
  <g transform="matrix(0.5506 0.1475 -0.4669 0.3269 690 158)">
    <rect width="640" height="420" rx="18" fill="url(#pageBg)" stroke="#22d3ee" stroke-width="4"/>
    <rect width="640" height="420" rx="18" fill="url(#pageBg)"/>
    <text class="pTitle" x="24" y="48">Enclosure release</text>
    <text class="pSub" x="24" y="74">Build 1.2 - week 5</text>
    <rect x="500" y="26" width="116" height="30" rx="15" fill="#34d399"/>
    <text class="pPill" x="558" y="46" text-anchor="middle">APPROVED</text>
    <rect x="24" y="86" width="592" height="2" fill="url(#pageRule)"/>
    <rect x="16" y="96" width="608" height="234" rx="6" fill="#a78bfa26" stroke="#a78bfa" stroke-width="4" stroke-dasharray="14 9"/>
    <rect x="236" y="186.5" width="168" height="45" rx="22.5" fill="#0b1026" stroke="#a78bfa" stroke-width="2"/>
    <text class="slotName" x="320" y="219.5" text-anchor="middle" fill="#a78bfa" font-size="30">flow.mmd</text>
    <!-- the arrow tip is bound to the part node, so it lands on the model at any size -->
    <rect x="24" y="350" width="5" height="50" rx="2" fill="#fbbf24"/>
    <text class="pLabel" x="40" y="370">Exploded for review</text>
    <text class="pCode" x="40" y="393">part.scad#def.explode=1</text>
    <line class="pNote" x1="212" y1="342" x2="212" y2="213"/>
    <!-- the arrow ends between the tops of the W4 and W5 bars: the chart is nested in the diagram, so its bars cannot
         be bound from here. The point is the chart drawn alone at the size of its node (276 x 219) with the positions
         mark:week=W4 and mark:week=W5, moved by the corner of the chart node (340.4, 103.6) -->
    <rect x="356" y="350" width="5" height="50" rx="2" fill="#fbbf24"/>
    <text class="pLabel" x="372" y="370">Goal met in W4 and W5</text>
    <text class="pCode" x="372" y="393">chart.vl.json#param.goal=180</text>
    <line class="pNote" x1="563.9" y1="342" x2="563.9" y2="149.4"/>
  </g>

  <!-- file names of the layers, and badges on the links the cards explain -->
  <rect x="862.3" y="372.7" width="128.8" height="34" rx="17" fill="#0b1026" fill-opacity="0.85" stroke="#22d3ee" stroke-width="2"/>
  <text class="tag" x="876.3" y="396.7" fill="#22d3ee">page.svg</text>
  <rect x="862.3" y="602.7" width="128.8" height="34" rx="17" fill="#0b1026" fill-opacity="0.85" stroke="#a78bfa" stroke-width="2"/>
  <text class="tag" x="876.3" y="626.7" fill="#a78bfa">flow.mmd</text>
  <rect x="862.3" y="832.7" width="343" height="34" rx="17" fill="#0b1026" fill-opacity="0.85" stroke="#fbbf24" stroke-width="2"/>
  <text class="tag" x="876.3" y="856.7" fill="#fbbf24">part.scad + chart.vl.json</text>
  <circle cx="544.7" cy="413.3" r="15" fill="#a78bfa" stroke="#0b1026" stroke-width="3"/>
  <text class="num" x="544.7" y="420.3" text-anchor="middle">1</text>
  <circle cx="611.7" cy="667.8" r="15" fill="#fbbf24" stroke="#0b1026" stroke-width="3"/>
  <text class="num" x="611.7" y="674.8" text-anchor="middle">3</text>
  <circle cx="735.3" cy="472.9" r="15" fill="#f472b6" stroke="#0b1026" stroke-width="3"/>
  <text class="num" x="735.3" y="479.9" text-anchor="middle">2</text>

  <!-- the result: page.svg itself, with everything it embeds -->
  <rect x="1053" y="247" width="510" height="336.8" rx="20" fill="url(#resultEdge)" filter="url(#pageShadow)"/>
  <image href="page.svg" x="1056" y="250" width="504" height="330.8"/>
  <path d="M948.8,215.3 C978.8,147.3 1176,136 1176,220.8" fill="none" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="12" filter="url(#arrowGlow)"/>
  <path d="M948.8,215.3 C978.8,147.3 1176,136 1176,220.8" fill="none" stroke="url(#renders)" stroke-width="7" stroke-linecap="round" marker-end="url(#tipRenders)"/>
  <text class="eyebrow" x="1058.4" y="213.3" text-anchor="middle">RENDERS TO</text>

  <!-- card 1: the link from the page to the diagram -->
  <rect x="40" y="150" width="448" height="130" rx="16" fill="#0f1535" fill-opacity="0.92" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="72" cy="184" r="15" fill="#a78bfa" stroke="#0b1026" stroke-width="3"/>
  <text class="num" x="72" y="191" text-anchor="middle">1</text>
  <text class="ctitle" x="100" y="193">page.svg embeds a diagram</text>
  <text class="code" x="64" y="232" xml:space="preserve">&lt;image id="flow"</text>
  <text class="code" x="64" y="260" xml:space="preserve"> href="flow.mmd</text>
  <text class="frag" x="271" y="260" xml:space="preserve">#theme=dark</text>
  <text class="code" x="422.8" y="260" xml:space="preserve">"/&gt;</text>

  <!-- card 2: an arrow of the page bound to a node of the diagram -->
  <rect x="40" y="336" width="476" height="130" rx="16" fill="#0f1535" fill-opacity="0.92" stroke="#f472b6" stroke-opacity="0.9" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="72" cy="370" r="15" fill="#f472b6" stroke="#0b1026" stroke-width="3"/>
  <text class="num" x="72" y="377" text-anchor="middle">2</text>
  <text class="ctitle" x="100" y="379">Bindings pin arrows to nodes</text>
  <text class="code" x="64" y="418" xml:space="preserve">&lt;line cn:x2y2=</text>
  <text class="code" x="64" y="446" xml:space="preserve">  "#flow node:part"/&gt;</text>

  <!-- card 3: the links from the diagram's nodes to the model and the chart -->
  <rect x="40" y="538" width="490" height="186" rx="16" fill="#0f1535" fill-opacity="0.92" stroke="#fbbf24" stroke-opacity="0.9" stroke-width="2" filter="url(#cardShadow)"/>
  <circle cx="72" cy="572" r="15" fill="#fbbf24" stroke="#0b1026" stroke-width="3"/>
  <text class="num" x="72" y="579" text-anchor="middle">3</text>
  <text class="ctitle" x="100" y="581">The diagram embeds files</text>
  <text class="code" x="64" y="620" xml:space="preserve">part@{ img:</text>
  <text class="code" x="64" y="648" xml:space="preserve">"part.scad</text>
  <text class="frag" x="202" y="648" xml:space="preserve">#def.explode=1</text>
  <text class="code" x="395.2" y="648" xml:space="preserve">" }</text>
  <text class="code" x="64" y="676" xml:space="preserve">chart@{ img:</text>
  <text class="code" x="64" y="704" xml:space="preserve">"chart.vl.json</text>
  <text class="frag" x="257.2" y="704" xml:space="preserve">#param.goal=180</text>
  <text class="code" x="464.2" y="704" xml:space="preserve">" }</text>

  <!-- the same engine in Markdown -->
  <rect x="40" y="768" width="430" height="90" rx="16" fill="#0f1535" fill-opacity="0.92" stroke="#c7d2fe" stroke-opacity="0.9" stroke-width="2" filter="url(#cardShadow)"/>
  <text class="ctitle" x="64" y="806">Markdown, too (Pandoc filter)</text>
  <text class="code" x="64" y="840" xml:space="preserve">![Flow](flow.mmd)</text>

  <!-- fragments: the parameters a link or an input path takes after the file name -->
  <rect x="1056" y="606" width="504" height="182" rx="16" fill="#0f1535" fill-opacity="0.92" stroke="#34d399" stroke-opacity="0.9" stroke-width="2" filter="url(#cardShadow)"/>
  <text class="ctitle" x="1078" y="646">Fragments pick what to draw</text>
  <rect x="1078" y="667" width="104" height="30" rx="15" fill="#34d399"/>
  <text class="pill" x="1088" y="688">#page=2</text>
  <rect x="1192" y="667" width="152" height="30" rx="15" fill="#34d399"/>
  <text class="pill" x="1202" y="688">#view=front</text>
  <rect x="1354" y="667" width="152" height="30" rx="15" fill="#34d399"/>
  <text class="pill" x="1364" y="688">#theme=dark</text>
  <rect x="1078" y="705" width="188" height="30" rx="15" fill="#34d399"/>
  <text class="pill" x="1088" y="726">#def.explode=1</text>
  <rect x="1276" y="705" width="200" height="30" rx="15" fill="#34d399"/>
  <text class="pill" x="1286" y="726">#param.goal=180</text>
  <rect x="1078" y="743" width="308" height="30" rx="15" fill="#34d399"/>
  <text class="pill" x="1088" y="764">#azimuth=30&amp;elevation=20</text>
</svg>
