<svg xmlns="http://www.w3.org/2000/svg" width="2496" height="1576" viewBox="0 0 2496 1576">
  <!-- mathml-gallery.png: six equations of this folder, each linked with image href and drawn as vector at four times
       its natural size (the box of each image is four times the size that "canvasnet info x.mml" reports, centered in
       its cell), so all six share one 64 pixel font. The rows are as tall as their equations need, two columns of
       white cells on the gray background of the other galleries. Only the generic font families are used. Original,
       authored for this repository (MIT). -->
  <style>
    .cell { fill: #ffffff; }
    .label { font: 28px sans-serif; fill: #1f2937; text-anchor: middle; }
  </style>
  <rect width="2496" height="1576" fill="#e5e7eb"/>
  <rect class="cell" x="24" y="24" width="1212" height="300"/>
  <image href="quadratic.mml" x="354" y="86" width="552" height="176"/>
  <text class="label" x="630" y="366">Quadratic formula</text>
  <rect class="cell" x="1260" y="24" width="1212" height="300"/>
  <image href="binomial-theorem.mml" x="1512" y="86" width="708" height="176"/>
  <text class="label" x="1866" y="366">Binomial theorem</text>
  <rect class="cell" x="24" y="388" width="1212" height="300"/>
  <image href="fourier-transform.mml" x="230" y="450" width="800" height="176"/>
  <text class="label" x="630" y="730">Fourier transform</text>
  <rect class="cell" x="1260" y="388" width="1212" height="300"/>
  <image href="transfer-function.mml" x="1454" y="454" width="824" height="168"/>
  <text class="label" x="1866" y="730">Transfer function</text>
  <rect class="cell" x="24" y="752" width="1212" height="760"/>
  <image href="maxwell.mml" x="304" y="810" width="652" height="644"/>
  <text class="label" x="630" y="1554">Maxwell's equations</text>
  <rect class="cell" x="1260" y="752" width="1212" height="760"/>
  <image href="state-space.mml" x="1410" y="938" width="912" height="388"/>
  <text class="label" x="1866" y="1554">State-space model</text>
</svg>
