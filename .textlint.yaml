# Percent-escapes in URL and file-name examples (such as "flow%2Emmd" for "flow.mmd"): the escape and the letters
# glued to it are not words
ignoreRegExpList:
  - "/%[0-9A-Fa-f]{2}[A-Za-z]*/g"
  # Escaped line feeds and tabs in JSON and C# texts (the escape letter would be read as part of the word)
  - "/\\\\[nt]/g"
  # Hexadecimal literals in C# code (such as 0xDEADBEEFu)
  - "/\\b0x[0-9A-Fa-f_]+[uUlL]*\\b/g"
  # UTF-16 escapes in C# strings (such as \uFEFF): the hexadecimal digits and the letters glued to them are not words
  - "/\\\\u[0-9A-Fa-f]{4}[A-Za-z]*/g"
  # Hexadecimal RGB and ARGB color values (such as 4BACC6 or FAFAF9) with at least one digit and one letter
  - "/\\b(?=[0-9A-F]*[0-9])(?=[0-9A-F]*[A-F])[0-9A-F]{6}(?:[0-9A-F]{2})?\\b/g"
  # The size placeholder of the tool options (WIDTHxHEIGHT) and the attached short option form (-ofile)
  - "/WIDTHxHEIGHT/g"
  - "/-ofile\\b/g"
# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "src/**/api/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
  - "**/PngSuite/**"
  - "src/DemaConsulting.CanvasNet/Fonts/BundledFonts/OFL.txt"
  - "src/DemaConsulting.CanvasNet/Fonts/BundledFonts/NotoFonts-OFL.txt"
  - "src/DemaConsulting.CanvasNet.Mermaid/Syntax/HtmlEntities.cs"
  # The git graph vectors: the texts of Mermaid's git graph tests, with branch names that are not words, case names
  # made from the test names, and Mermaid's entity-encoding markers. Data, not prose.
  - "test/DemaConsulting.CanvasNet.Mermaid.Tests/Fixtures/upstream-vectors/gitgraph-parser.json"
  - "**/TestResults/**"

# Per-file exceptions (see WHERE AN EXCEPTION BELONGS above); each entry names exactly the files that need it
overrides:
  # The C++ standards shared with the other repositories: the Allman brace style, the GCC/Clang warning flags
  # (-Wextra, -Werror), and the Google Mock library (also named in this file, which lists them)
  - filename:
      - ".github/standards/cpp-*.md"
      - .textlint.yaml
    words:
      - Allman
      - gmock
      - Werror
      - Wextra
  # The link-check test vectors: string literals that spell unsafe URL schemes in encoded, split or truncated forms
  # (such as an entity-encoded letter or a tab inside the scheme name), which are deliberately not words
  - filename:
      - test/DemaConsulting.CanvasNet.Mermaid.Tests/Class/ClassModelTests.cs
      - test/DemaConsulting.CanvasNet.Mermaid.Tests/Class/ClassParserTests.cs
