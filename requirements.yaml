---
# Root requirements file - includes all system, unit, platform, and OTS requirements
# root-tags: any requirement not (transitively) linked as a child of a requirement
# tagged with one of these tags is reported as an orphan by
# `dotnet reqstream --requirements requirements.yaml --enforce`. This catches
# low-level implementation requirements (and tests/code) that were added without
# ever being connected to user-visible functionality.
root-tags: [system, quality]
includes:
  - docs/reqstream/quality.yaml
  - docs/reqstream/canvas-net.yaml
  - docs/reqstream/canvas-net/canvas.yaml
  - docs/reqstream/canvas-net/canvas/surface.yaml
  - docs/reqstream/canvas-net/codecs.yaml
  - docs/reqstream/canvas-net/codecs/bmp-codec.yaml
  - docs/reqstream/canvas-net/codecs/png-codec.yaml
  - docs/reqstream/canvas-net/codecs/tiff-codec.yaml
  - docs/reqstream/canvas-net/codecs/jpeg-codec.yaml
  - docs/reqstream/canvas-net/geometry.yaml
  - docs/reqstream/canvas-net/geometry/rect.yaml
  - docs/reqstream/canvas-net/geometry/path.yaml
  - docs/reqstream/canvas-net/geometry/bezier-flattening.yaml
  - docs/reqstream/canvas-net/geometry/svg-arc-converter.yaml
  - docs/reqstream/canvas-net/drawing.yaml
  - docs/reqstream/canvas-net/drawing/path-filler.yaml
  - docs/reqstream/canvas-net/drawing/path-stroker.yaml
  - docs/reqstream/canvas-net/platform-requirements.yaml
  - docs/reqstream/ots/xunit.yaml
  - docs/reqstream/ots/reqstream.yaml
  - docs/reqstream/ots/buildmark.yaml
  - docs/reqstream/ots/versionmark.yaml
  - docs/reqstream/ots/sarifmark.yaml
  - docs/reqstream/ots/sonarmark.yaml
  - docs/reqstream/ots/sysml2tools.yaml
  - docs/reqstream/ots/reviewmark.yaml
  - docs/reqstream/ots/pandoc.yaml
  - docs/reqstream/ots/weasyprint.yaml
  - docs/reqstream/ots/fileassert.yaml
  - docs/reqstream/ots/system-numerics-tensors.yaml
