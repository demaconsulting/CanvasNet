            - field: "Title"
              contains: "User Guide"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "canvas-based drawing and rendering API"
          pages:
            min: 3
          text:
            - contains: "User Guide"

