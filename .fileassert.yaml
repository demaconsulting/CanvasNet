---
# FileAssert document validation tests for CanvasNet.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.

tests:

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/CanvasNet Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "CanvasNet"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"

  # --- CODE QUALITY ---

  - name: Pandoc_CodeQualityHtml
    description: "Code Quality HTML was generated by Pandoc"
    tags: [code-quality]
    files:
      - pattern: "docs/code_quality/generated/quality.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "CodeQL"

  - name: WeasyPrint_CodeQualityPdf
    description: "Code Quality PDF was generated by WeasyPrint"
    tags: [code-quality]
    files:
      - pattern: "docs/generated/CanvasNet Code Quality.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "Code Quality"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Code Quality"
          pages:
            min: 1
          text:
            - contains: "CodeQL"

  # --- CODE REVIEW PLAN ---

  - name: Pandoc_ReviewPlanHtml
    description: "Code Review Plan HTML was generated by Pandoc"
    tags: [code-review]
    files:
      - pattern: "docs/code_review_plan/generated/plan.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Review Plan"

  - name: WeasyPrint_ReviewPlanPdf
    description: "Code Review Plan PDF was generated by WeasyPrint"
    tags: [code-review]
    files:
      - pattern: "docs/generated/CanvasNet Review Plan.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "Review Plan"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Review Plan"
          pages:
            min: 1
          text:
            - contains: "Review Plan"

  # --- CODE REVIEW REPORT ---

  - name: Pandoc_ReviewReportHtml
    description: "Code Review Report HTML was generated by Pandoc"
    tags: [code-review]
    files:
      - pattern: "docs/code_review_report/generated/report.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Review Report"

  - name: WeasyPrint_ReviewReportPdf
    description: "Code Review Report PDF was generated by WeasyPrint"
    tags: [code-review]
    files:
      - pattern: "docs/generated/CanvasNet Review Report.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "Review Report"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Review Report"
          pages:
            min: 1
          text:
            - contains: "Review Report"

  # --- DESIGN DOCUMENT ---

  - name: SysML2Tools_SoftwareStructureViewSvg
    description: "Software Structure View diagram was rendered by SysML2Tools"
    tags: [design]
    files:
      - pattern: "docs/design/generated/SoftwareStructureView.svg"
        count: 1
        xml:
          - query: "//*[local-name()='svg']"
            count: 1
          # A view that resolves to nothing still writes an <svg> root, so also require drawn text.
          - query: "//*[local-name()='text']"
            min: 1

